n die Anfangsbuchstaben der Zeilen – und jeder kann schon garantiert das Gedicht","Tafel","PL","","wischtechnik.jpg","","",""],["Erzählkiste","","DaF Sprechen","","","","","In einer Kiste sind Wortkärtchen in sechs Gruppen gegliedert: Satzanfänge, Eigenschaften, Personen/Figuren, Orte, Gegenstände, Ereignisse. Die verschiedenen Wörter sind also Impulse, welche die L zum Erzählen und/oder Schreiben anregen sollen.","Wortkarten, Kiste / Stapel","GA","","erzahlkiste.jpg","","",""],["Fragekatalog","","DaF Sprechen","","","","","Erzählspiel für Kleingruppen:  Zu einem angegebenen Titel formulieren wir Fragen. Die L erzählen eine Geschichte, indem sie diese Fragen beantworten. Die Fragen können auch einzeln auf Kärtchen geschrieben und nach und nach aufgedeckt werden. Einige Fragekärtchen können wir markieren, an dieser Stelle sollen die L Bildkarten ziehen, und diese in die Antwort mit einbauen. Variante: Zu einem angegebenen Titel werden vorab Fragen gesammelt und in eine spannende Reihenfolge gebracht.","Kärtchen","PA / GA","","","","",""],["Filmleiste","","DaF Sprechen","DaF Schreiben","","","","Die Filmleiste ist ein Mittel, um Experimente, Vorgänge, Handlungen, Konstruktionen, Operationen etc. in Einzelschritte zu zerlegen und eine  Grundlage zur Textproduktion oder zum zusammenhängenden Sprechen zu schaffen. Entsprechend dem Sprachstand kann eine Wortliste bzw. eine Liste mit Konjunktionen hilfreich sein. Bei einer Wiederholung kann man den Filmstreifen zerschneiden und von den L neu ordnen lassen. Mit einem geeigneten Text können die Schüler selbst einen zugehörigen Filmstreifen entwerfen.","AB","EA / PA","","filmleiste.jpg","","",""],["Lügendetektor","","Kennen lernen","DaF Sprechen","","","Bewegung","Jeder L schreibt über sich 5-8 Sätze, in denen er 2 Informationen versteckt, die nicht wahr sind. Die Texte werden für alle gut zugänglich ausgehängt und jeder L bekommt Post-Its. Alle lesen die Texte und notieren auf der Rückseite der Post-its ihre Tipps, welche Infos nicht stimmen. Sie kleben die Post-its verdeckt hin. Die Verfasser lesen dann die Post-its und erzählen im Plenum, was nicht stimmt und was die Wahrheit ist, bzw. was sie bei den Kommentaren überrascht hat.  Variante: Die Texte werden mit einer Wäscheklammer vorne an der Kleidung befestigt. Die L gehen herum, lesen die Texte und sagen dem Verfasser gleich, was ihrer Meinung nach nicht stimmt. Hinweis: Auf einmal immer nur mit einem Partner sprechen. Im PL wird nicht alles besprochen, wir gehen nur auf überraschende Tipps und interessante Aspekte bei den Gesprächen ein.","Kärtchen / Post its","CP","","","","Online 1 Wahrheit - 1 Lüge auf ein Blatt schreiben und in die Kamera halten. Die anderen raten.","genauso"],["Meinungspingpong","","Diskussion","DaF Sprechen","","","","Als Vorbereitung zwei Gruppen bilden, die zum Diskussionsthema pro bzw. contra Argumente sammeln. Jeder L sucht sich aus einer Diskursmittelliste für jede Sprechabsicht (eine Meinung vertreten, zustimmen, widersprechen, zweifeln, zögern...) einen Diskursmittel aus.  Die Gruppen setzen sich einander gegenüber hin und diskutieren nach dem Reißverschlussprinzip, wie in der Abbildung.  Regel: Redebeitrag des Vorredners aufgreifen, passendes Argument aus der Liste anbringen und einen Diskursmittel benutzen.","Thesen / Bild als Impuls","GA --> PL","zwei Stuhlreihen einander gegenüber","meinungspingpong.png","","",""],["Planspiel","","DaF Sprechen","Kooperation","Problemlösung","","","L agieren in Planspielen als sie selbst (evtl. in einer möglichen „Funktion”). Sie handeln in Kleingruppen eine Entscheidungssituation bzw. eine besondere, außergewöhnliche Situation aus.  Material: Beschreibung der Situation, Dokumente, Texte, Bilder, die den L erleichtern, sich die Situation vorzustellen. Nach einer kurzen Vorbereitung, in dem sich die L ihrer eigenen Entscheidung, Präferenzen, Standpunkt… klar machen , wird die Entscheidung in der Gruppe getroffen. Bekannte Beispiele: NASA-Spiel / Mondlandung, Ballonfahrt, Reise in die Wüste, Fahrstuhl, Stadtplanung...","Listen, Bilder, Hintergrundmaterial","GA","","","","",""],["Reizwortgeschichte","","DaF Sprechen","DaF Schreiben","","","","Die L erzählen eine Geschichte zu vorher angegebenen Wörtern. Die Reihenfolge der Wörter ist wichtig / nicht wichtig. Es gibt weitere Varianten:  - Nach der Angabe des Titels fängt ein L an zu erzählen. Der Spielleiter zeigt nach einigen Sätzen eine Wortkarte (zufällig aus der Wortschatzkartei gezogen oder vorbereitet) – dieses Wort / dieser Ausdruck muss nun in die Geschichte eingebaut werden.  - Die L erzählen reihum, wenn sie aufhören wollen mit ihrem Teil, nennen sie ein Wort, das die nächste in die Geschichte einbauen soll.","Wortliste, Wortkarten","GA","","","","",""],["Rollenspiel","","DaF Sprechen","Kooperation","Präsentation","","","Rollenspiele sind inhaltlich mehr oder weniger definiert - es geht dabei um Sprachhandeln: um Problemlösung – meist in konfliktträchtigen Situationen. Die Situation, Raum, Zeit sind vorgegeben, die Rolle, in der die L agieren sollen, ist umrissen (Person, Beziehung zu den anderen Mitspielern, Name, Alter, die eigenen Ziele und Wünsche in der konkreten Situation, evtl. besondere Eigenschaften...). Die Spieler stellen die mögliche Entwicklung der Situation vor. Rollenspiele können mit oder ohne Vorbereitung im Plenum vorgespielt werden, oder noch sinnvoller in den Kleingruppen gespielt werden – dann folgt im Plenum nur eine Auswertung in Form eines Gesprächs (“Wie ist das Spiel bei euch ausgegangen?)","Rollenkarten","(EA / GA) --> GA --> PL","","","","",""],["Sanduhr","","Erfahrung","DaF Sprechen","","","","Die L erzählen / diskutieren in Kleingruppen. Ein L fängt an, er spricht solange, bis die Sanduhr läuft – dann bestimmt er, wer fortsetzen soll / oder der, der weiter erzählen möchte, nimmt die Sanduhr.","Sanduhr (1 Minute)","PL","Sitzkreis","","","",""],["Talkshow","","Erfahrung","Diskussion","DaF Sprechen","","","Vorbereitung: Rollenkarten (Name, Alter, Beruf, typisches Zitat als Einstieg bzw. Darstellung der Position der Person in der aktuellen Frage,) Materialien, die den L erleichtern, sich in die Situation hineinzuversetzen (jeder L soll andere Texte bekommen!) Namensschilder für die Mitspieler Die Großgruppe wird in mehrere kleine Runden (max. 5-6 Personen) aufgeteilt. Jeder L bekommt eine Rollenkarte und die dazu gehörenden Materialien. Nach dem Studium der Materialien beginnt die Diskussion des Themas mit dem Ziel, eine gemeinsame Gruppenstellungnahme in der Frage vorzubereiten. Jeder stellt sich kurz vor und platziert die Namenskarte vor sich – dann geht’s los...","Rollenkarten","PL","Sitzkreis","","","",""],["Thesendiskussion","","Diskussion","Erfahrung","DaF Sprechen","","","Wir bereiten z.B. für 20 L 5 Thesen zu einem Thema auf Kärtchen vor, nummerieren sie und markieren jeweils paarweise die Thesen mit A oder B (so gibt es von jeder These jeweils zwei A und zwei B-Kärtchen...) Die L nehmen ein Kärtchen, notieren dazu in Stichpunkten ihren Standpunkt, danach setzen sie sich mit dem L zusammen, die die gleiche These hat (die zwei, die 2a haben usw.). Sie vergleichen ihre Meinung, und versuchen sich in eine gemeinsame Stellungnahme zu einigen. Danach setzen sie sich mit den anderen zwei L mit der gleichen These zusammen, einigen sich in eine Gruppenstellungnahme, notieren die Punkte, die in der Gruppe kontrovers diskutiert worden sind, und bestimmen einen Gruppensprecher. Im PL stellen die Gruppensprecher reihum ihre Statements vor und stellen die kontrovers diskutierten Punkte zur Diskussion.","Thesenkarten (4x)","EA --> PA --> GA --> PL","","","","Thesen auf Jamboard-Frames vorbereiten und nummerieren, TN-Liste mit Nummern in den geteilten Notizen kopieren. PA-Runde: Privater Chat, von da an Breakouträume mit Wahlgruppen.",""],["Umfrage","","Erfahrung","Diskussion","DaF Sprechen","","Bewegung","In der Klasse Fragen zu einem Thema sammeln. Fragen verteilen – jeder L ist für andere Fragen verantwortlich. Sie gehen herum und befragen möglichst Alle in der Klasse / Gruppe. Zum Schluss werten sie das Ergebnis statistisch aus.","Fragekatalog, Fragekärtchen","CP / PA","","","","",""],["Wollfadenspiel","","Aktivieren","Einstieg","DaF WS","DaF Sprechen","","Die L sitzen im Kreis, der SL hält das Ende des Woll- oder Schnurknäuels in der Hand, fängt an, eine Geschichte zu erzählen. Nach einigen Sätzen wirft er einem L das Knäuel zu (er hält dabei das Ende des Fadens fest). Dieser L setzt die Geschichte fort, und wirft nach einigen Sätzen das Knäuel weiter.  Im Laufe des Spiels entsteht ein Netz, das Verbindungen schafft zwischen den Beteiligten. Variante WS: Kettenübung - ein L nennt zu dem genannten Aspekt (z.B. Was ich nicht gern esse..) ein Wort, Wollknäuel weiterwerfen, der nächste wiederholt, was er gehört hat (Anna isst nicht gern X), nennt selbst ein Wort... usw. Am Ende Faden aufwickeln und alles in umgekehrter Reihenfolge nennen (nur das Wort, das die Person genannt hat, von der man den Faden bekommen hat)","Wollknäuel","PL","Stehkreis / Sitzkreis","","","",""],["Wortgeländer","","DaF LV","DaF Sprechen","","","","Beim Lesen eines Textes tragen die L die Schlüsselwörter in ein Wortgeländer oder in eine Textkarte ein (ähnlich, wie eine mind map: im Vergleich zum Worgeländer, das eine Liste ist, ist diese strukturiert). Die L Geschichte erzählen dann mit Hilfe dieses „Spickzettels“ zu zweit nach. ODER Grundgerüst für einen Text (erzählen / schreiben) wird vom KL präsentiert.","AB","PA","","","","",""],["Themen würfeln","","Erfahrung","Kennen lernen","DaF Sprechen","","","Gewürfelt wird zweimal, der L erzählt etwas zu dem erwürfelten Thema. (Das gleiche Feld kann mehrmals drankommen.)","AB (Raster 6x6, Spalten und Zeilen nummeriert, in jeder Zelle ein Thema oder eine Frage), Würfel","GA","","v2_w_rfelspiel_ohne_joker.jpg","","",""],["Wörterbuch-Orakel","","Aktivieren","DaF Sprechen","","","","Probleme des täglichen Lebens auf Zettel schreiben (EA)  Karten behalten, Lerngruppen bilden und die Karten mitnehmen. Eine Wahrsagerin bestimmen. Ein L liest eine seiner Fragekarten vor. Die WahrsagerIn schlägt das Wörterbuch auf, tippt mit geschlossenen Augen auf ein Wort und beantwortet die Frage, indem sie das Wort in die Antwort hineinflechtet. Wenn alle dran waren, neue Wahrsagerin bestimmen.","Wörterbücher, Kärtchen","EA --> GA","","","","",""],["Zeitungsmaumau","","DaF LV","DaF Sprechen","","","Wettbewer b","Die L lesen Zeitung und suchen nach bekannten Namen. Sie machen Notizen zu den Fragen: Wie heißt er / sie? Was ist er / sie von Beruf? Warum kam er / sie jetzt in die Zeitung? In Kleingruppen erzählen sie dann einander von den Nachrichten und wählen die X interessantesten aus und schreibt sie auf Kärtchen (etwa 1/3 eines A4-Blattes groß), z.B. Schumacher, Ex Formel-1-Fahrer, Unfall beim Schiurlaub Eine Gruppe legt eine Karte oder klebt sie an die Tafel und erzählt kurz über die Nachricht. Die nächste Gruppe muss unter den eigenen Karten etwas passendes finden: Gleicher Vorname? Gleicher Beruf? Gleiches Thema? Gleiche Nationalität? Gleiche  Initialen? Ähnliches Aussehen? Wer nicht legen kann, setzt eine Runde aus. Dann ist die nächste Gruppe dran. Sieger ist, wer als Erster alle Karten los wird.","alte Zeitungen (für jeden TN eine), Kärtchen, dicke Stifte","EA --> GA --> PL","Gruppentische --> Sitzkreis","","","",""],["Bilder-Quiz","","Wahrnehmung","Einstieg","DaF Sprechen","","","Der SL gibt einem L die Bilder und bittet ihn, hinauszugehen, sich ein Bild auszusuchen und dann wiederkommen. In der Zwischenzeit sammeln die anderen TN Fragen.  Der TN kommt mit den Bildern wieder herein, setzt sich vor die Gruppe, so dass nur er das ausgewählte Bild sehen kann. Die TN stellen ja/nein-Fragen, um möglichst viel über das Bild zu erfahren.  Nach etwa 20 Fragen wird abgebrochen, der SL verteilt alle Bilder auf demBoden, die TN müssen herausfinden, welches Bild ausgewählt wurde. Jede Wahl muss begründet werden.","10-12 Bilder (nicht sehr unterschiedlich)","PL","U / Gruppentische","","","",""],["Tischgespräche","","Kennen lernen","DaF Sprechen","","","","Die TN  befinden sich als Gast in einem gemütlichen Restaurant, das bekannt ist für sein ausgezeichnetes Essen. Der KL selber ist der Oberkellner. Die Gäste stehen ungezwungen in Gruppen zusammen, plaudern und lachen. KL ruft zum Beispiel: „Zweiertische!“. Alle bilden Paare, wie es sich gerade ergibt, bei einer ungeraden Anzahl stellt sich ein übriggebliebener Gast zu einem Paar seiner Wahl.  In zwei Minuten tauschen die Gäste sich in diesen Tischgruppen darüber aus, was man am liebsten isst, und einigt sich auf ein Menü aus drei Gängen.  (Zeit vorgeben). Dann weiter – und „Vierertische“... usw. Gesprächsthema kann man jedes Mal ändern. Das Spiel mit „Hochzeitsgesellschaft“ / „Klassentreffen“... o.ä. beenden und jeder sagt laut, was er gerade isst und sagt laut „PROST“.","","GA","Gruppentische","","","",""],["Post stop tops spot","","Aktivieren","","","","","Dieses Spiel spielen zwei Teams à 4 Personen gegeneinander. Jeder von Ihnen bekommt einen Buchstaben auf die Brust geklebt. Die vier Buchstaben, die es in jedem Team gibt, können mehrere Worte ergeben, so zum Beispiel Post, Stop, Tops und Spot.  Nun wird dem Team eine Frage gestellt, die als Antwort eine der möglichen Kombinationen ergibt. Welches Team schafft es am schnellsten, sich in der richtigen Lösungsreihenfolge aufzustellen?","DIN A4-Blätter","GA4","","","","",""],["Oing oing","","Aktivieren","","","","","Alle Spieler müssen sich nach vorne beugen und ihre Knöchel mit den Händen umfassen. Alle gehen nun in dieser Position vorsichtig im Raum rückwärts. Berühren sich zwei Spieler mit ihren Hinterteilen, müssen sie sich durch die Beine hindurch anschauen und mit “Oing Oing” begrüßen.","","PL","","","","",""],["Anblinzeln","","Konzentration","Wahrnehmung","Aktivieren","","","Die Hälfte der TN sitzt im Stuhlkreis auf einem Stuhl; die andere Hälfte verteilt sich hinter die Stühle, so dass auf jedem Stuhl ein TN sitzt und hinter jedem Stuhl ein TN steht. Ein zusätzlicher Stuhl wird nun in den Stuhlkreis gestellt, hinter den sich ein weiterer Mitspieler stellt. Dieser muss nun versuchen einen TN mit den Augen anzublinzeln. Fällt dies dem TN auf dem Stuhl auf, läuft er los und setzt sich auf den freien Stuhl vor den Blinzelnden.  Das muss der TN, der hinter dem Angeblinzelten steht, allerdings verhindern. Dazu muss es den TN, das auf dem Stuhl sitzt, festhalten, sobald er angeblinzelt wird. Es geht also um die Schnelligkeit beider Spieler.  Schafft es ein TN zu entfliehen, ist der Mitspieler, der hinter dem nun freiem Stuhl steht, der neue Blinzler.","","Stuhlkreis","PL","","","",""],["Ortsschilder","","Kennen lernen","Namen lernen","","","","Ortsschilder als Namensschilder für den Anfang - und hier kann man sie machen: http://www.ortstafel.org/","","","","","","",""],["Telefonbuch","","Aktivieren","","","","","Zu Beginn bekommt jeder Spieler eine Seite aus einem Telefonbuch auf den Rücken geklebt. Nun ruft der Spielleiter einen Namen oder eine Telefonnummer. Diese befindet sich auf einer der Seiten und wurde vorher von der Spielleitung herausgesucht.  Nun besteht die Aufgabe aller Spieler darin, die Nummer oder den Namen auf dem Rücken eines Mitspielers zu finden. Wem dies zuerst gelingt, der bekommt einen Punkt. Die Aufgabe kann beliebig oft wiederholt werden mit neuen Nummern oder Namen. Wer gewinnt die meisten Punkte?","Telefonbuchseiten","PL","freier Raum","","","",""],["Erzähl-Labyrinth","","DaF Sprechen","Kooperation","","","","Man braucht dazu für jede Gruppe ein AB mit dem Labyrinth und einige kleine Bilder, die die L ohne nachzudenken im Labyrinth platzieren. Dann kann es losgehen: Sie erzählen eine Geschichte, indem sie im Labyrinth wandern und versuchen da rauszukommen. Alle Bilder, an denen sie vorbeigehen, müssen in die Geschichte eingebaut werden.","AB, kleine Bilder","GA","","erz_hllabyrinth.jpg","","",""],["Hexe, Hexe, was kochst du heute?","","Aktivieren","DaF WS","","","Bewegung","Ein L übernimmt die Rolle der Hexe und steht den anderen in einiger Entfernung gegenüber. Die anderen fragen, was die Hexe heute kocht (im Chor: Hexe, Hexe, was kochst du heute?), die dann ein Gericht nennt. Um die Anzahl der Silben dieses Wortes dürfen die anderen L auf die Hexe zukommen, z. B. Spaghetti = Spa-ghet-ti = 3 Schritte. Wer zuerst bei der Hexe angekommen ist, wird neue Hexe. Wenn die Hexe etwas nennt, was man nicht kochen kann, müssen die anderen L zurückrennen und die Hexe versucht sie zu fangen. Wer gefangen wird, wird auch zur Hexe.","","PL","freier Raum","","","",""],["Ebbe und Flut","","Aktivieren","Konzentration","DaF HV","","","Der Spielleiter erzählt eine Geschichte, die von Menschen handelt, die am Strand spazieren gehen. Die L spielen nach, was der SL sagt, z. B. gehen, nach Muscheln bücken, Hosen aufkrempeln, einen Rucksack tragen, einen Sonnenschirm aufspannen ... Fällt das Wort „Ebbe“, gehen alle L in die Hocke, fällt das Wort „Flut“, steigen alle L schnell auf einen Stuhl. Danach geht es mit der Geschichte weiter.","Stühle","PL","","","","",""],["Geräuschlawine","","Aktivieren","DaF LV","","","","Auf Zetteln werden Geräusche beschrieben, der KL gibt einen Zettel an den ersten TN, er muss das Geräusch nachmachen und dann den Zettel weitergeben und bekommt einen neuen Zettel... usw. Wenn die TN den Zettel mit Stop bekommen, müssen sie aufhören....","kleine Zettel","PL","Sitzkreis","geraeuschelawine1.pdf","","",""],["Palastwache","","Aktivieren","","","","","Egal, ob vor Schlössern oder Regierungssitzen. Meistens werden diese von Wachen abgeschirmt. Was diese nicht dürfen? Auf Fragen reagieren oder lachen. Und genau das ist die Herausforderung bei diesem Spiel. Ein Mitspieler wird zur Palastwache – die anderen müssen versuchen, diese zum lachen zu bringen. Dabei sind alle Sachen erlaubt – bis auf eine: Die Palastwache darf nicht berührt werden. Wer schafft es, die Wache zum Lachen zu bringen?","","PL","Stehkreis","","","",""],["Schnibbel-schnabbel-schnöwen","","Konzentration","Aktivieren","DaF WS","","","Tierzauberei - auch viel Bewegung, man muss aber gleichzeitig gut hinhören und man übt auch Tiernamen (oder auch was anderes, was man nachmachen kann, Berufe z.B. Die Kategorie muss im Spiel immer das gleiche bleiben und vorher ankündigen). Der Spielleiter sagt Zaubersprüche: \"Schnibbel-schnabbel-SCHNÖWEN - jetzt seid ihr alle MÖWEN\" - danach müssen die L das genannte Tier nachmachen. (Am Platz oder auch herumrennen... oder fliegen :-). Dann gehts weiter mit einem anderen Tier: \"Schnibbel-Schnabbel-Schnaffen - jetzt seid ihr alle ... AFFEN. Wenn ihr einige Zaubersprüche selbst gesagt habt, und die L das System drauf haben, könnt ihr den Zauberstab weitergeben.","Stauberstab. (Lineal, Stock.. was auch immer)","PL","freier Raum (oder einfach nur aufstehen)","","","",""],["Kuddelmuddelgeschichte","","Aktivieren","Konzentration","DaF Sprechen","","","Ein TN beginnt mit einem Satz eine Geschichte. Reihum fügt jeder TN einen Satz an die Geschichte an. Die TN bekommen vorher den Auftrag, den Satz, den sie erfunden haben, genau zu merken. Am Ende wechseln alle den Platz, bis auf den TN, der die Geschichte angefangen hat. Er beginnt wieder die Geschichte und jeder sagt dann seinen Satz dazu.","","PL","Sitzkreis","","","",""],["Klatschspiel 2","","Aktivieren","Konzentration","DaF Sprechen","","","wie unten","","PL","Sitzkreis","klatschen2.jpg","","",""],["Klatschspiel 1","","Aktivieren","Konzentration","DaF Sprechen","","","wie unten","","PL","Sitz / Stehkreis","klatschen1.jpg","","",""],["Klatschspiel 3","","Aktivieren","Konzentration","DaF Sprechen","","","wie unten","","PL","Sitz- / Stehkreis","klatschen3.jpg","","",""],["Rondell","","Einstieg","DaF Schreiben","","","","Die S. gehen von einer persönlichen Grundaussage aus und folgen beim Schreiben den folgenden Anregungen:  1. Wähle ein für dich wichtiges Thema 2. Schreibe einen kurzen Satz zu diesem Thema, der deine Meinung treffend zum Ausdruck bringt. Schreibe diesen Satz in die Zeilen 1, 4 und 7.  3. Führe deine Gedanken in einem weiteren kurzen Satz fort. Schreibe diesen Satz in die Zeilen 2 und 8.  4. Schreibe weitere, verschiedene Aussagen zum Thema in die Zeilen 3, 5 und 6.","","EA","","rondell_klein.jpg","","",""],["Biographischer Kompass","","DaF Schreiben","DaF Sprechen","DaF LV","","","Zu Kurzprosa-Texten oder zu Gedichten, in denen die L nicht allzu viel über eine literarische Figur erfahren, entwerfen sie zusätzliche Figurenaspekte, indem sie überlegen, welche Menschen und welche Ereignisse die Figur in ihrem bisherigen Leben beeindruckt haben, ws ihr Orientierung für ihr Handeln gegeben haben könnte, aufgrund welcher Motive die Figur handelt, wo sie sich in ihrem Leben aufgehalten hat und welche Räume, Landschaften usw. sie geprägt haben könnten.","Erzähltexte, Gedichte","GA","","","","",""],["Tafelkim","","Transfer","DaF WS","DaF Rechtschreibung","","Wettbewerb","Vorbereitung: schwierige Wörter (Schreibweise) sammeln oder gemeinsam in der Klasse Wörter sammeln und an der Tafel notieren. Schreibweise besprechen, evtl. Fehler korrigieren. Die L haben dann 1 Minute Zeit, sich alle Wörter einzuprägen. Dann Tafel zuklappen, und alle schreiben möglichst viele Wörter auf. Kontrolle: Tafel aufklappen.","Tafel oder Flipchart","PL --> EA","","","","",""],["Kopfschmerzen und Tabletten","","DaF Sprechen","DaF GR","","","","TN überlegen sich ein Problem, für das sie einen Ratschlag möchten. Dann Kugellager im flotten Tempo: Außenkreis sagt das Problem, das Gegenüber sagt einen Ratschlag. Nach 3-4x Rutschen STOP: Jetzt ist der Innenkreis dran mit Problem nennen... usw.  PL: Bericht: besonders gute / blöde Idee?","","Kuggelager","","","","",""],["Kritzlertest","","DaF Lesen","Wahrnehmung","","","","Einfache Sätze - Informationen zu einem Wimmelbild - vorbereiten (Suchaufgaben, Zählaufgaben...). L suchen die Infos, notieren Zahlen, markieren Bildteile.","Wimmelbild + AB","EA / PA","","kritzlertest.pdf","","",""],["Geräuschelawine","","Aktivieren","DaF LV","","","","s. unten","Kärtchen","PL","Sitzkreis","v2_geraeuschelawine1.pdf","","",""],["Figuren merken","","Wahrnehmung","Konzentration","DaF Sprechen","","","Abstrakte Figuren a die Tafel malen / beamen. Die L schauen sich die Figuren eine halbe Minute lang genau an. Dann Tafel zuklappen / Bild wegnehmen. Die L beginnen das Bild nachzuzeichnen. Nach einer Minute legen alle den Stift weg und man zeigt wieder das BIld.  Bei mehreren Bildern mehr Zeit geben und evtl. in Gruppen rekonstruieren lassen. Nur ein L malt in diesen Fall. Vorher eine Punktzahl vereinbaren und für Übereinstimmungen Punkte vergeben.","Bilder, Tafel / Beamer","EA, GA","","figuren_merken_klein.jpg","","",""],["Boogle","","Aktivieren","DaF WS","","","","Vorbereitung: Ein Buchstabenquadrat mit 4x4 Feldern. Aufgabe: Möglichst lange Wörter aus den Buchstaben des Quadrats bilden. Man darf dabei keine Felder überspringen, erlaubt sind auch angrenzende schräge Buchstaben.","Tafel- / Flipchartanschrieb / AB","EA / PA","","boogle_l_sung.jpg","","",""],["Gleichzeitig","","Konzentration","Wahrnehmung","","","","Ein selbst gebasteltes Pendel aufhängen und in Bewegung setzen (oder rhythmisch in die Hände klatschen,mit gleichmäßigen Schritten auf und ab gehen). Die L zählen zuerst mit. Dann 6 Nomen mit 6 Zahlen (z.B. 7 Äpfel, 3 Bälle, 9 Fahrräder, 2 Handtücher, 5 Zeitungen, 6 Nägel) als Liste projizieren. Wenn der Pendel den Höhepunkt durchläuft, Startzeichen geben. Die L müssen die Schwingungen zahlen und gleichzeitig die Liste merken. Nach einer Minute stoppen und die Liste wegnehmen. Die L schreiben die Zahl der Schwingungen / Klatschen / Schritte und die Liste auf.","Pendel, Tafel / Flipchart / Beamen","PL","","","","",""],["Vertauschte Buchstaben","","Wahrnehmung","DaF WS","","","","In einem Satz 2 Buchstaben (oder 2x2 Buchstaben) vertauschen. L sollen möglichst schnell herausfinden, welche. Wenn fertig, nächsten Satz präsentieren.","Tafel / Beamer","EA","","","","",""],["Wettlauf mit vier Buchstaben","","Aktivieren","DaF WS","","","","Ein Wort mit 4 Buchstaben auf einen Zettel schreiben. Dieses Wort sollen die L möglichst schnell finden. Sie nennen reihum Wörter und der SL sagt, welche Buchstaben im Wort NICHT vorkommen - sie streichen diese Wörter in einer ABC-Liste durch. Die abgestrichenen Buchstaben dürfen beim nächsten Versuch nicht vorkommen. Wenn Buchstaben im gesuchten Wort vorkommen, sagt der Spielleiter auch, an welcher Stelle. Die L notieren das im vorbereiteten AB.","ABC-Liste (oder L machen schnell eine Liste ins Heft), AB (oder Raster an der Tafel - L malen es ab)","PL","","wettlauf_mit_vier_buchstaben_AB.jpg","","",""],["Wurstzipfelspiel","","Aktivieren","DaF WS","","","Spiel","SL nennt ein zusammengesetztes Wort (z.B. Windmühle), der nächste Spieler nennt ein zusammengesetztes Wort, das mit \"Mühle\" beginnt... usw. Wer innerhalb 3 Sekunden kein Wort nennen kann, gibt ein Pfand / eins von 5 Streichhölzer ab. Spiel muss schnell gehen!","evtl. Streichhölzer","PL","Sitzkreis","","","",""],["Wörterpyramide","","Aktivieren","DaF WS","","","","SL gibt einen Buchstaben vor, der erste L nennt ein Nomen mit dem Anfangsbuchstaben. Der nächste L muss mit den ersten 2 Buchstaben ein Wort nennen... usw. SL schreibt die Wörter an die Tafel. (s. Abbildung). Ziel ist, eine möglichst hohe Pyramide zu bauen. Funktioniert auch als Wettbewerb zwischen Gruppen.","Tafel / Flipchart","PL / GA","","w_rterpyramide_klein.jpg","","",""],["Stadt-Land-Fluss anders","","Aktivieren","Wiederholung","DaF WS","","Wettbewerb","Der SL oder ein L nennt ein beliebiges, einfaches Wort. Dann schreiben die Gruppen Tiere, Pflanzen, Städte, Länder, Vornamen, Berufe... mit den Buchstaben des Wortes (wenn im Wort 2x der gleiche Buchstabe vorkommt, müssen sie zwei verschiedene Tiere... usw. notieren!). Die Gruppe, die zuerst fertig ist, rennt zum Tischklingel...","Papier","GA","","","","",""],["Drei Wörter ein Satz","","DaF WS","DaF GR","Wiederholung","","Vokabelkartei","SL nennt / zeigt 3 Wörter (oder eine Liste mit 3-er-Gruppen von Wörtern). L schreiben sinnvolle und grammatisch korrekte Sätze mit den Wörtern. Später werden die Sätze von einem Jury bewertet (Mögliche Aspekte: 1 Punkt - sinnvoll, 1 Punkt - grammatisch korrekt, 1 Punkt - Rechtschreibung korrekt, 1 Punkt - besonders originell).","Wortliste (AB)","GA","","","","",""],["Eine Minute","","Konzentration","Wahrnehmung","","","","TN stehen von ihrem Stuhl auf und stehen still. Sie schauen auf ihre Uhr und versuchen dann ohne auf die Uhr zu schauen einzuschätzen, wie lange 1 Minute ist. Sie setzen sich, wenn sie glauben, dass die Minute schon um ist und notieren sie die Zeit, die sie geschätzt haben. Passt gut, um die Gruppe zu Ruhe kommen zu lassen und eine konzentrierte Arbeit zu ermöglichen.","","PL","","","","",""],["Paketversand","","Kooperation","Aktivieren","Problemlösung","","","Mehrere Teilgruppen bilden, die TN sollen möglichst eng zusammenstehen. Der SL bindet um jede Gruppe ein Seil. Die Gruppen sollen sich als \"Paket\" möglichst schnell von ihrem Ausgangsort zu einem vorher festgelegten Ziel bewegen.","Seile","GA","im Freien / freier Raum","","","",""],["Kopfdomino","","Konzentration","DaF WS","","","Wettbewerb","Die Reihenfolge der Dominosteine bestimmen, nur durch schauen - ohne zu markieren. Wer findet am schnellsten das letzte Wort?","AB / Beamen","EA","","kopf1.jpg","","",""],["Farbstift-Diskussion","","Kooperation","Wahrnehmung","Konzentration","","","Der Spielleiter teilt die Gruppe in Paare ein. Jedes Paar erhält ein Blatt Papier. Die Partner wählen sich zwei verschiedenfarbige Buntstifte; ideal sind Farben, die einen guten Kontrast ergeben, also z.B. grün und rot oder blau und gelb. Ein Partner beginnt und zeichnet eine kleine abstrakte Figur, z.B. einen Kreis oder eine Wellenlinie. Dann ist der andere Spieler an der Reihe. Er muss auf die Zeichenbotschaft mit seiner Zeichnung antworten. Auf diese Weise entsteht eine Diskussion. Wichtig: Es darf währenddessen nicht gesprochen werden! Erst hinterher wird über die Zeichen-Diskussion und wie sie jeder erlebt hat, diskutiert.","Buntstifte, mehrere Farben","PA","","","","",""],["Gegenstandkette","","Aktivieren","DaF WS","","","Wettbewerb","Vorab stellt jeder TN 3 kleine Gegenstände zusammen und legt sie vor sich hin, z.B. ein Stück Schnur, ein Stück Kreide, einen Hüpfball, ein Blatt Papier usw. Alle setzen sich mit ihren Gegenständen im Kreis zusammen. Zu Beginn legt der SL einen Gegenstand in die Mitte. Jetzt gilt es einen Gegenstand zu finden, der auf irgendeine Weise zu dem Gegenstand in der Mitte passt. Mögliche Kriterien sind dabei z.B. Farbe, Form, Zweck, Material. Es sind aber auch andere Verknüpfungen denkbar. Wenn ein TN glaubt, dass sein Gegenstand dazu passt, legt er ihn daneben und erklärt den Zusammenhang. Gewonnen hat der TN, der als erster seine Gegenstände in die Domino-Kette eingereiht hat.","eigene Gegenstände / Gegenstände aus dem Klassenraum","PL / GA","","","","",""],["Ich aus einer anderen Perspektive","","Kennen lernen","DaF Schreiben","","","","Jeder Teilnehmer wählt einen Gegenstand oder ein Haustier - kurz: etwas, womit er sehr viel umgeht und stellt sich vor, was dieser Gegenstand bzw. das Haustier über ihn erzählen könnte. Also etwa so: \"Meine Katze hat mir gesagt, dass sie gern von mir gestreichelt wird. Es nervt sie aber, wenn ich sie festhalten will und sie das gar nicht will. Worüber sie sich am meisten ärgert, ist, dass ich sie manchmal einsperre, nur damit ich bei ihr bin und sie nicht allein im Zimmer ist. ...\" Für die Übung erhält jeder Schreibpapier und Stift. Die Beiträge werden eingesammelt und nacheinander vorgetragen. Nach jedem Vortrag wird geraten, von wem der Beitrag stammt.","Papier","EA --> PL","","","","",""],["Künstlerrunde","","Kennen lernen","DaF Sprechen","","","","Jeder TN überlegt sich, was er besonders gut kann. Dabei ist alles erlaubt - vom Hüpfen oder Stehen auf einem Bein über Basteln oder Schnitzen bis hin zu Fußball oder anderen Sportarten. Dazu überlegt sich jeder einen Künstlernamen, z.B. Karin-Känguruh für jemanden, der besonders gut springt  Hinterher stellt jeder seine \"Kunst\" und seinen Künstlernamen vor. Wer will, kann dabei zugleich eine Kostprobe seines Könnens liefern.","","PL","Stehkreis","","","",""],["Lebendiges Domino","","Transfer","DaF WS","","","","Auf zwei verschieden farbigen Kärtchen (1/3 von einem DIN A4-Blatt) schreiben wir Wörter und die türkische Entsprechung (oder ein Bild, das geht aber nicht immer  Ihr braucht so viele Wörter wie Teilnehmer in der Gruppe. Diese Aufgabe könnt ihr aber auch in Gruppen geben, jeder Gruppe aber ein anderes Thema geben, z.B. wenn ihr eine Wiederholung macht, könnt ihr jeder Gruppe eine unterschiedliche Lektion geben und sie schreiben die X wichtigste...","Kärtchen in zwei Farben","PL","Stehkreis","","","",""],["Was braucht er?","","DaF Sprechen","DaF Schreiben","","","","Der Spielleiter teilt die Gruppe in Paare oder Kleingruppen von bis zu vier Teilnehmern ein. Jede Kleingruppe erhält ein Foto von einem Jugendlichen, Junge oder Mädchen sowie ein Blatt Papier und einen Stift pro Teilnehmer. Aufgabe der Gruppe ist es, sich auszudenken, was der Junge bzw. das Mädchen braucht, und die Einfälle zu notieren. Anschließend stellt jede Gruppe ihre Figur vor.","Fotos aus Zeitungen","GA","Gruppentische","","","",""],["Ich fahre nach Ottawa...","","Aktivieren","Gedächtnis","DaF Sprechen","","Kettenübung","Die Teilnehmer setzen sich im Kreis zusammen. Der Spielleiter beginnt: \"Ich fahre nach Ottawa und dorthin nehme ich Ohrschützer mit.\" Dann reihum weiter so - und alles wiederholen.  (alles mit O geht :-) - ob am Wortanfang oder im Wortinneren)","","PL","Sitzkreis","","","",""],["Was passt wozu?","","Gruppenbildung","DaF WS","","","","WAS PASST WOZU?  Wörter erklären üben und Partner / Gruppenmitglieder finden Vorbereitung: Begriffe auf Zettel schreiben, die zusammen gehören, z.B. Messer - Gabel, Papier - Bleistift, Buch - Leselampe, Tisch - Stuhl, Korken - Flasche, Topf - Topfdeckel, Mutter/Vater - Kind, Wolke- Regen. Es müssen halb so viele Gegensatz-Begriffspaare gefunden werden, wie die Gruppe Teilnehmer hat.  (Bei Gruppen so viele Begriffsgruppen wie Gruppen.) Zettel zusammenfalten / zusammenknüllen. Für das Spiel zieht jeder L einen Zettel. Dann sollen sie den richtigen Partner finden. Dabei darf jedoch nicht der eigene Begriff genannt werden, der Begriff muss umschrieben werden. Wenn jemand z.B. den Begriff \"Tisch\" hat, dann kann er diesen Begriff z.B. mit \"Platz, an dem gegessen wird\" umschreiben.","Zettel","PL","","","","",""],["Was wenn...","","DaF GR","","","","","Jeder L denkt sich den Anfang eines Wenn-Satzes aus (wenn ich…). Er schreibt dann die Folgen als “dann…”-Sätze auf einen Zettel. (5 Sätze). Zettel einsammeln und neu verteilen. Die Sätze werden vorgelesen und alle raten mit, was wohl der Anfangssatz ist.","Zettel","EA --> PL","","","","",""],["Schiffe versenken","","DaF WS","DaF Sprechen","","","Wettbewerb","Die L bekommen ein Schema (Haus, Regal, Schrank...). Sie notieren in den Feldern passende Nomen (z.B. Schulgebäude: Hausmeister, Bibliothek, Lehrerzimmer, Schulleiter, Chemieraum, Sporthalle, Cafeteria). Dann wie bei Schiffe versenken durch Fragen herausfinden, was der Partner wo notiert hat. \"Ist die Cafeteria im Erdgeschoss links?\" Bei Treffer darf man weiter fragen, wenn nichts gefunden, dann ist der Partner dran.","Papier","PA","","schiffe_versenken.JPG","","",""],["Orgelpfeifen","","Aktivieren","Einstieg","DaF HV","","Bewegung","Jeder L bekommt ein Wort aus dem Lied (häufige Wörter wie ich, und... und was im Lied noch oft genannt wird). Gern auch manche Zettel doppelt vergeben. Wenn sie das Wort hören, müssen sie schnell aufstehen.","Zettel","PL","","","","",""],["Satz stellen","Lebendiger Satz","Einstieg","DaF GR","Abschluss","","Bewegung","Jeder L bekommt eine Wortkarte: ein Wort aus einem langen Satz (Artikel + Wort oder Präposition und Artikel können auf die gleiche Karte). Die Aufgabe der Gruppe ist, sich so hinzustellen, dass der Satz gelesen werden kann. (Schwieriger: Man darf nicht miteinander kommunizieren dabei, jeder kann nur für sich gehen, aber niemanden Anweisungen geben.)","Wortkarten","PL","Stehkreis","","","mit einem längeren Satz, Satzteile in den PRIVATEN CHAT schreiben. Spielrgel beamen: Nicht erlaubt. Chat und geteilte Notizen verwenden und Raum verlassen. TN schalten Mikro ein, besprechen die Gruppenstrategie. (z.B. Teile vorlesen, Ende-Anfang und Satzteil-Paare feststellen, Satzteil auf A4 - Kamera an, Blatt in die Kamera halten...)",""],["Teekesselchen","","Aktivieren","DaF WS","DaF Sprechen","","","Einer oder mehrere der Mitspieler denken sich einen solchen Begriff aus und bezeichnen ihn in der Folge als Teekesselchen. Es gilt, den Begriff, der sich hinter dem Wort „Teekesselchen“ versteckt, zu beschreiben, damit der andere Teil der Mitspieler ihn erraten kann. Bei mehreren Beschreibenden steht oft jeder der Hinweisgebenden dabei für eine der Bedeutungen - es wird abwechselnd jeweils nur ein Hinweis preisgegeben. Beispiel: „Auf meinem Teekesselchen kann man sitzen“; „auf meinem Teekesselchen kann man Geld wechseln“ (Lösung: Bank - als Möbel und Kreditinstitut) Oft treten zwei Teams gegeneinander an - es gewinnt dann dasjenige, dessen Mitglieder am wenigsten Hinweise zum Erraten mehrerer Begriffe benötigt haben. Eine häufige Variante ist, dass der Begriff vom Team ausgewählt wird, dem die Ratenden nicht angehören, und anschließend so viele Mitglieder des Rateteams den Begriff mitgeteilt bekommen, wie er Bedeutungen hat - die Eingeweihten müssen den Begriff so geschickt umschreiben, dass er mit möglichst wenigen Hinweisen vom eigenen Team erraten werden kann.","http://www.singenundspielen.de/id314.htm - hier eine Liste mit Homonymen.","PL, GA","","","","",""],["Lernpatience","","Wiederholung","Transfer","DaF WS","","","Als Erstes werden drei Kärtchen nebeneinander in eine Reihe gelegt. Nun nimmt man die erste Karte von links auf. Wird die Vokabel richtig beantwortet, wandert die Karte in eine neu eröffnete zweite Reihe über der ersten. Hat man die Vokabel falsch übersetzt, so wird die Karte nach rechts außen in die erste Reihe gelegt.  Wandert eine richtig beantwortete Karte in die zweite Reihe, so füllt man die erste Reihe mit einer neuen Karte aus dem Stapel von rechts her auf, sodass wieder drei Karten in der ersten Reihe liegen. Wenn man viele Vokabeln richtig beantwortet, füllt sich die zweite Reihe schnell. Sie ist komplett, wenn sie vier Karten umfasst. Nun wird statt der linken Karte in der ersten Reihe die linke Karte der zweiten Reihe beantwortet und in der ersten Reihe keine neue Karte vom Stapel nachgelegt. Ist die Antwort falsch, landet die Karte wieder ganz unten rechts in der ersten Reihe. Kann die Karte jedoch richtig beantwortet werden, so wird mit ihr die dritte Reihe eröffnet, die mit maximal fünf Karten gefüllt werden kann.  Die vierte und letzte Reihe umfasst sechs Karten. Wird eine Reihe voll, arbeitet man als Nächstes die linke Karte der gerade gefüllten Reihe ab. Egal, in welcher Reihe die Karte auch liegt – hat man die Vokabel nicht gewusst, wandert die Karte wieder rechts in die erste Reihe, und es geht weiter mit der linken Karte in der ersten Reihe.","Vokabelkartei oder min. 18 Wortkarten","EA","Tisch","","","",""],["Buchstaben kombinieren","","Einstieg","DaF WS","Transfer","","","Buchstaben durcheinander an die Tafel schreiben, L schreiben möglichst viele und lange Wörter, die diese enthalten. Buchstben können auch mehrmals vorkommen. Variante: Ein sehr langes Wort aufschreiben, das die L kennen, die Buchstaben des Wortes sollen recycelt werden. Variante Seminar. Jede Gruppe bekommt einen anderen langen Fachbegriff.","Tafel","PA / GA","","","","",""],["Zeitungsrallye","","DaF LV","","","","Wettbewerb","Jeder Lernende bekommt eine Zeitung (unterschiedlichen Datums / unterschiedliche Zeitungen). Sie suchen die Antwort auf sehr allgemein formulierte Fragen, z.B. Welches Sportereignis war an dem Tag am wichtigsten? Was ist das Ergebnis?  Eine empfehlenswerte Fernsehsendung? Wie ist das Wetter? Kann man einen Ausflug / Wanderung machen?  Die Sensation des Tages? Die interessanteste Anzeige? Die wichtigste Nachricht aus D? Die wichtigste Nachricht aus dem Ausland? Der Text mit der größten Schlagzeile? Eine schlechte Nachricht?  Eine sehr gute Nachricht? … usw. Zeit begrenzen, damit die Lernenden wirklich schnell lesen!!! Die Lernenden vergleichen dann ihre Ergebnisse in Gruppen.","pro L eine Zeitung","EA --> GA","","","","",""],["Wörterjagd","","DaF WS","","","","","Die L suchen zu bestimmten Kategorien (Thema, grammatische Kategorie wie Adjektive, Verben, Eigennamen...) Wörter von einer Zeitungsseite.","pro L eine Zeitung","EA","","","","",""],["Zeitungsentenjagd","","DaF LV","DaF Sprechen","","","","S lesen allein, mit einem Partner oder in der Gruppe Zeitung. Sie einigen sich auf eine Nachricht / einen Bericht und verändern darin einige Fakten. Dann Gruppen mischen (\"Mixgruppe\"), die L erzählen möglichst glaubwürdig ihre Nachricht - die anderen raten, was wahr und was gelogen ist.","pro Paar / Gruppe eine Zeitung","PA / GA","","","","",""],["Löwenjagd","","Aktivieren","DaF HV","DaF Phonetik","","Bewegung","Die Lernenden stehen im Kreis und sprechen den Text dem “Vorsänger” nach und die machen die Bewegungen nach.  Wir sind auf der Löwenjags / Wir haben keine Angst / Wir haben ein gutes Gewehr dabei / Und ein scharfes Schwert. / Doch, was ist das?  / Das ist Elefantengras! / Man kann nicht dran vorbei / Man kann nicht drüber weg / Man kann nicht unten durch / Man muss mitten hinein.  (Nach Elefantengras kommt: Sumpf, ein See, eine Höhle – und ein schrecklich großes Tier und einfach zurückrennen (alle Gesten wiederholen, rückwärts).","","PL","Stehkreis","L_wenjagd.doc","","",""],["Tafelrallye","","Einstieg","DaF WS","DaF GR","Wiederholung","Wettbewerb","Die Lerngruppe in 3-4 Gruppen teilen. Die Aufgabe an der Tafel präsentieren, z.B. Wörter suchen zu mehreren Kategorien, Verben sortieren nach Bedeutung oder nach grammatischen Kategorien wie Perfektbildung, Valenz (A - D - A+D), trennbar-untrennbar...). Die erste Person jeder Mannschaft bekommt eine Kreide / einen Tafelstift in unterschiedlichen Farben, rennt zur Tafel und notiert EIN Wort in eine Kategorie, rennt zurück, ... Was schon steht, darf nicht noch einmal notiert werden (es sei denn, man ist mit der Zuordnung nicht einverstanden). Während einer an der Tafel ist, darf sich die Gruppe hinten beraten. Gewonnen hat die Gruppe, die in der vorher bestimmten Zeit die meisten korrekt zugeordneten Einträge hat.","Tafel, Stifte / Kreide in verschiedenen Farben","GA","freier Zugang zur Tafel, Gruppen stehen in einem Abstand, dass die L noch rennen müssen und der Schreiber die Gruppe nicht hört","","","",""],["ALPEN-Methode","","Zeitmanagement","UP","Planen","","","Zeitmanagement mit der ALPEN-Methode :-) - - passt auf für Unterrichtsplanung:   A-ufgaben und geplante Aktivitäten notieren:  Brainstorming Ziele und mögliche Aktivitäten, die zielführend sein könnten, eine Auswahl treffen, Reihenfolge überlegen...  L-änge schätzen:  Grundregel 1: Alles dauert länger als gedacht. Grundregel 2: Aktivitäten dauern selten 1,5 Minuten und so :-)  Überlegen: wie lange brauchen die Schnellen? wie lange die Langsamen? (am besten die Zeit der Langsamen nehmen und für die Schnellen Pufferaufgaben / Zusatzaufträge überlegen). Wichtig: Die Zeit für die Erklärung der Aufgabe, Verteilung des Materials, Gruppenbildung, evtl. Raum-Arbeiten :-) auch mit einzukalkulieren!  P-ufferzeiten einplanen: Wenn beim Planen noch 3-5 Minuten nicht \"vollgepackt\" sind - lieber sein lassen. :-) ABER auch mögliche Pufferübungen ohne großen Aufwand einplanen, falls es doch alles schneller geht als gedacht..   E-ntscheidungen treffen:  Was ist sehr wichtig? Was kann u.U. weg? Im Plan vielleicht schon im Vorfeld Schritte markieren, die weggelassen / verschoben / als Hausaufgabe verteilt / in Parallellgruppen gelöst werden können.  Welche Alternativen gibt es (Medien, Material, Sozialform, Aufgabe reduzieren?), wenn es doch anders läuft?   N-achkontrolle:  Am Ende der Planung eine reine Matheaufgabe (witzig, wie oft wir uns dabei vertun.) Und im Unterricht im Plan notieren, wenn Plan und Realität auseinanderklafft :-)","","","","","","",""],["Text falten","","Input","DaF LV","DaF Sprechen","Kooperation","","Einen Text mit normaler Schriftgröße auf ein A4 Blatt drucken. Blatt diagonal falten und beide Teile kopieren. Dann auch die Lerngruppe halbieren, die Hälfte bekommt Text A, die andere Text B. Zuerst den Teil lesen und in der Gruppe darüber spekulieren, was im anderen Textteil wohl steht. Eine Liste machen: 1. Das steht sicher im Text 2. Das könnte vielleicht im Text stehen.  Dann Paare bilden (ein A und ein B zusammen): Die L sagen ihre Vermutungen und der Partner sagt, ob das stimmt oder nicht.","AB A und B","EA --> GA --> PA --> PL","","texte_falten.jpg","","",""],["Textorakel","","DaF LV","DaF Sprechen","DaF Schreiben","","Strategie","Kopiert den Text so (oder formatiert es so, wenn ihr ihn digital habt), dass zwischen den einzelnen inhaltlichen Blöcken, immer an der Stelle, wo euch beim Lesen ganz natürlich die Frage \"Und dann...?\" aufkommt, eine Lücke von etwa 2 cm entsteht. Ihr könnt dort auch ein Zeichen (z.B Stop-Schild) einsetzen.  Die L nehmen das Blatt und ihr Heft und legen das Heft auf den Text, so dass der Teil nach dem Stop-Schild nicht zu lesen ist. Sie lesen den ersten Abschnitt und diskutieren dann mit dem Partner, wie die Geschichte weitergeht. Ihr könnt aber, wenn die Aufgabe für die L neu ist, an dieser Stelle die Ideen auch im Plenum sammeln. Dann das Buch weiter nach unten ziehen und weiterlesen - ... Danach vergleichen: Waren unsere Ideen richtig? Und weiter spekulieren: Und? Wie geht es jetzt weiter? ... usw.  Nicht mehr als 6-7 Stops machen, sonst wird es leicht langweilig. (Auch kombinierbar mit einer Schreibaufgabe: Das Ende ganz weglassen und die L schreiben die Geschichte zu Ende.) Wir können am Ende auch darüber sprechen, wer die meisten \"Treffer\" hat bzw. was gutes \"Wahrsagen\" ausmacht: Welche Indizien im Text haben geholfen?","AB, Text","EA --> PA / PL","","","","",""],["Textorakel light","","DaF LV","DaF Sprechen","","","Strategie","Text genauso präparieren wie bei Textorakel, aber bei den Stop-Schildern immer eine ganz konkrete Frage formulieren - mündlich oder schriftliich: z.B. \"Wen ruft er jetzt an und was sagt er?\" \"Was ist wohl im Karton?\"... Die L  notieren ihre Antwort.","AB, Text","EA --> PA / PL","","","","",""],["Diskussion mit Redemittelkarten","","DaF Sprechen","","","","","Die Lernenden arbeiten in Gruppen. Sie schreiben zuerst Fragen / Thesen / Vorschläge auf Kärtchen und legen sie verdeckt in die Mitte.  Dann nimmt jeder eine der 4-5 Redemittelkarten, auf denen zu verschiedenen Sprechabsichten Redemittel aufgelistet sind. Der erste Spieler, der z.B. „Eine Meinung sagen” oder „einen Vorschlag machen” hat, nimmt eine Karte von der Mitte und stellt es vor: z.B. „Ich finde, Kinder unter 14 sollten keine Handys haben, weil....”. Die anderen Lernenden reagieren, wie ihre Redemittelkarte es verlangt: Zögernd – ausweichend, zustimmend, wider-sprechend. Sie sollen bei ihrem Statement immer Redemittel von ihrer Karte verwenden. Dann ist die nächste Thesenkarte dran. … Nach 2-3 Karten werden die Redemittelkarten immer neu verteilt …","Redemittelkarten, leere Zettel","GA","Gruppentische","redemittelkarte.jpg","","",""],["Ich will erzählen über....","","Kennen lernen","Einstieg","DaF Sprechen","","","Die Lernenden spielen in Gruppen. Sie malen ein Raster von 6x6 Feldern und schreiben in jedes Feld ein Thema (Ferien, Party, Pech, sich verspäten...) oder eine Frage (Wo würdest du gern leben? Urlaub: Zelten oder Hotel?...) oder eine These / Aussage (Die Schuluniform muss weg. Vegetarier leben gesünder. …) Sie müssen sich nicht absprechen, jeder schreibt seine Ideen drauflos in das Raster. Sie schreiben dann über die Spalten und zu den Reihen die Zahlen von 1-6. Dann wird gewürfelt (mit zwei Würfeln oder einfach zweimal). Das erste Bestimmt die Spalte, das zweite Würfeln die Reihe. Dann spricht der Spieler zu dem erwürfelten Thema und befragt auch die anderen nach ihrer Meinung. Sind sie fertig, wird das Feld markiert und weiter gewürfelt. Würfelt man noch einmal das gleiche Feld, kann man dazu noch was sagen – wenn einem etwas Neues eingefallen ist, oder der Spieler würfelt noch einmal.  Vorher die Zeit festlegen, wie lange man spielt. (Normalerweise wollen die Lernenden eine Verlängerung :-)   Variante für Wörter wiederholen: In den Feldern gibt es Themen (Ferien, Hobby, rund, Sachen im Bad....), Nach dem Würfeln die Sanduhr stellen, jeder schreibt Wörter auf, die ihm einfallen. Jedes Wort ist einen Punkt wert.","Würfel (1 oder 2 pro Gruppe), DIN A3-Blätter","GA","Gruppentisch","w_rfelspiel_ohne_joker.jpg","","",""],["Sätze würfeln 2","","DaF GR","DaF WS","","","","Die Lernenden bekommen Spezialwürfel: Präpositionen auf den Seiten, Modalverben, verschiedene Zeitformen...). Sie würfeln reihum und sagen einen Satz zu der erwürfelten Kategorie. Ist der Satz korrekt, bekommt der Spieler einen Punkt. Ob der Satz richtig ist, entscheidet die Gruppe, bei Streitfragen im Kursbuch / Wörterbuch nachschlagen oder den Lehrer fragen.  (Strittige oder fehlerhafte Sätze auch notieren – mit denen kann man später z.B. Fehlerversteigerung spielen :-) Vorher Zeit vereinbaren, wie lange wir spielen. Gewonnen hat der Spieler, der die meisten Punkte hat.","Spezialwürfel","GA","","w_rfelspiel_pr_positionen.jpg","","",""],["Brettspiel Konjugation","","DaF GR","","","","","Die Lernenden basteln sich zuerst ein Spielbrett: Sie notieren Verben, die sie schon kennen, in die leeren Felder. (Spielbrett können sie leicht selbst malen, muss nicht kopiert werden.) Dann wird gewürfelt, jede Augenzahl entspricht einem Personalpronomen, die Spieler müssen korrekte Sätze bilden. Ist der Satz korrekt, bleibt der Spieler auf dem Feld. Ist er falsch, muss er zurückgehen auf das Feld, wo er vorher stand. Ob der Satz richtig ist, entscheidet die Gruppe, bei Streitfragen im Kursbuch / Wörterbuch nachschlagen oder den Lehrer fragen.  Bei 6 darf man noch einmal würfeln. Gewonnen hat der Spieler, der zuerst das Ziel erreicht.","DIN A3 Blätter, Würfel","GA","","w_rfelspiel_verb.JPG","","",""],["Wörterjagd","","Einstieg","DaF WS","","","Wettbewerb","Jeder Lernende bekommt eine Zeitung / einige Zeitungsseiten. Sie suchen zu bestimmten Kategorien (bestimmtes Thema, eine grammatische Kategorie wie Adjektive, Verben, Eigennamen...) Wörter aus einer Zeitungsseite.  Ergebnisse dann in Gruppen zusammentragen.  Am Ende in der Gruppe 2-3 neue Wörter auswählen, die alle lernen sollten.","eine Zeitungsseite pro TN","EA --> GA","","","","",""],["Buchstabenrallye","","Aktivieren","DaF WS","","","Bewegung","Der SL ruft durcheinander Buchstaben in die Klasse. Die Lernenden müssen schnell zu einem Gegenstand laufen und diesen berühren, der mit diesem Buchstaben beginnt. Wer nichts gefunden hat oder einen falschen Gegenstand berührt hat, sagt den nächsten Buchstaben.","","PL","","","","",""],["Flaschen drehen 2","","DaF Sprechen","Erfahrung","Kennen lernen","","","Die L sitzen im Kreis um das Spielfeld herum (A3-Blatt für Kleingruppen, Packpapier für größere). Der erste Spieler dreht das Bleistift / eine Flasche, und beginnt eine Geschichte zu erzählen (Titel kann angegeben werden). Er erzählt so lange, bis er das Wort oder die Idee, die bildhaft auf dem Spielfeld dargestellt wurde, nicht in die Geschichte eingebaut hat. Dann gibt er das Bleistift / die Flasche – und  damit das Erzählrecht weiter.","Packpapier mit Stichwörtern oder Bildern, eine nicht zu leichte Flasche pro Gruppe","GA","kleine Sitzkreise, Boden frei","flaschendrehen.JPG","","",""],["Artikelgymnastik","","DaF Grammatik","Fachwortschatz","Aktivieren","","Bewegung","Die Lernenden bekommen 5-10 Minuten Zeit, um im Kursbuch / in ihren Vokabelheften zu blättern und die Artikel zu wiederholen. Danach werden Artikelkarten verteilt (der-die-das), durcheinander. Der Spielleiter liest von einer Liste Nomen vor, die Lernenden, die die passende Artikelkarte haben, stehen auf, halten die Artikelkarte hoch und rufen laut: z.B. „DER TISCH” und setzen sich wieder. Nach einigen Beispielen kann man das Tempo steigern.  Variante: Wir vereinbaren unterschiedliche Bewegungen für die Artikel. z.B. DER – hochhüpfen. DIE – in die Hocke gehen, DAS – vorbeugen und den Boden berühren. Wir lesen die Liste vor und die Lernenden machen den Artikeln entsprechend die Bewegung.","","PL","Stehkreis","","","",""],["Only Connect","","Aktivieren","Einstieg","DaF WS","","","Die L überlegen 4x4 Wörter, die zusammenhängen, schreiben sie durcheinander auf ein Blatt und geben es weiter. Die anderen Gruppen versuchen die Gruppen zu finden und geben ihr Lösungsblatt ab, mit den 4 Gruppen und der Begründung, wie sie zusammenhängen.  Das Punktesystem:  1 Punkt für eine gefundene Gruppe, 1 Punkt für die Erklärung, wie sie zusammenhängen und 2 Bonuspunkte, wenn man alle 4 Gruppen gefunden hat. Geht auch als Station: Die Gruppen schreiben die Wörter auf Zettelchen, die müssen geordnet werden. Und auf der Station gibt es auch ein Lösungsblatt.  http://www.bbc.co.uk/programmes/b00lskhg/features/quiz - und hier ist das Originalspiel","Zettel","GA","","","","",""],["Lerntempoduett","","Input","DaF LV","","","","Zwei Texte (A+B) werden gleichmäßig in zwei Gruppen verteilt. Eine Gruppe bearbeitet Text A die andere Text B. Alle lesen gleichzeitig und machen sich Notizen (Visualisierung des Textinhalts), da sie ihren Teil im Anschluss einem Mitlernenden erklären werden. Wer fertig ist, signalisiert dies nonverbal (z.B. durch Aufstehen), bis jemand mit dem anderen Text auch fertig ist und die beiden sich zu einer Gruppe zusammenschließen. Beide arbeiten zusammen und erklären sich gegenseitig ihren Text, dann werden die Texte ausgetauscht und vertiefend gelesen. Es besteht die Möglichkeit in die Gruppenarbeit Fragen bzw. Aufgaben zu geben, die sich aus den zwei Texten beantworten lassen (Einzel- oder Partnerarbeit) und anschließend im Plenum zusammen getragen werden.","2 Texte","EA -->PA","","","","",""],["Assoziogramm","","WS","Einstieg","","","","Zu einem zentralen Begriff / einer zentralen Frage Wörter sammeln (Zuruf - SL oder ein TN protokolliert). Alle Ideen werden ohne Kommentare ungeordnet, mit gleich großen Buchstaben notiert.","Tafel / Flipchart","PL","","","","",""],["Fingerübung","","Einstieg","DaF  WS","","","","Die Lernenden malen den Umriss ihrer Hand auf ein Blatt Papier. Schreiben in jeden Finger einen Oberbegriff und notieren um die Finger herum Wörter, die zu diesem Oberbegriff passen.","DIN A4-Blatt","EA","","","","",""],["Wort-karten","","DaF WS","","","","","Wortkarte - mal anders (für größere Karten). Oder für Wiederholungsübungen: Gruppen beschriften einige Karten - und lassen die Mitte leer und schreiben die Lösung auf die Rückseite. Die Aufgabe der anderen Gruppen ist, die Wörter zu finden.","","","","ws_karte_anders.jpg","","",""],["Van Goghs Schlafzimmer","","Wahrnehmung","DaF WS","","","","\"Van Goghs Schlafzimmer\": Ein Bild mit vielen Details nehmen. Die Lernenden dürfen das Bild eine Weile betrachten und sie benennen die Sachen, die sie schon auf Deutsch kennen. Dann legen sie das Bild weg und malen ein Wort-Bild aus dem Gedächtnis. (Beispiel: MEMO - Langenscheidt)","Kunstpostkarten","PA","","van_goghs_schlafzimmer_zusammen.jpg","","",""],["Museum","","Kennen lernen","DaF Sprechen","","","","Jeder gestaltet mit kleinen Gegenständen und Symbolen ein persönliches Museum.  (entweder spontan mit Dingen aus der eignen Tasche oder vorbereitet mit Dingen  von zuhause)  Jeder TN bekommt eine Ausstellungsfläche in der Größe eine DIN A4- Blattes. Nach einer 10minütigen Vorbereitungszeit des Museums (mit entsprechenden  Hinweisschildchen und einem ansprechenden Arrangement), wird gemeinsam das  Museum besucht.","persönliche Gegenstände","EA --> PL","Tische","","","",""],["Seminardomino","","Evaluation","Transfer","","","Abschluss","\"Dominosteine“ (Moderationskarten) werden in Gruppen vorbereitet. Die TN schreiben die - aus ihrer Sicht wichtigsten - Schlagworte und Lernbegriffe auf die Karten. Die Karten dürfen angelegt werden, wenn die TN inhaltliche Verknüpfungen herstellen können.","Kärtchen","GA --> PL","","","","",""],["Ressourcengespräche","","Kennen lernen","Reflexion","Gruppendynamik","","Bewegung","Die TN bekommen ein AB mit 3 Fragen. Sie gehen durch den Raum und suchen sich einen Gesprächspartner. Sie tauschen sich zu einem der Fragen aus, notieren die Antwort des Partners auf SEINEM Bogen und gibt ihm am Ende eine Unterschrift. Dann Wechsel. Wenn fertig, neuen Partner suchen.","AB","CP","freier Platz","ressourcengespraech.png","","",""],["Blinder Zahlensalat","","Kooperation","Konzentration","","","","Die TN versammeln sich in der Mitte eines Raumes oder draußen innerhalb eines per Seil oder Band „abgesteckten“ Terrains (z.B. zwischen Bäumen, möglichst in Hüfthöhe) und gehen langsam mit geschlossenen Augen, ohne zu sprechen, die Arme auf Brusthöhe nach vorne gestreckt, umher. Nach ca. 15 Sekunden teilt die Spielleitung mit, dass alle TN eine Zahl ins Ohr geflüstert bekommen. Die Aufgabe besteht darin, sich – ohne zu sprechen – richtig sortiert, der Reihe nach aufzustellen.","Seil","PL","Freier Raum oder im Freien","","","",""],["Circle Runner","","Aktivieren","","","","Bewegung","Alle TN laufen im Raum herum und merken sich jeweils eine Person aus der Gruppe. Auf ein Zeichen der moderierenden Person läuft nun jede/r der TN dreimal im Kreis um die Person herum, die sich jede/r Einzelne gemerkt hat.","","PL","Freier Raum oder im Freien","","","",""],["Zuckerturm bauen","","Kooperation","Problemlösung","Gruppendynamik","","","Mindestens 2 oder mehr Teams mit je mindestens 4 Personen bilden, die einen Turm bauen sollen. Die Teams erhalten jeweils gleiche Menge Zuckerwürfel, um einen möglichst hohen Turm zu bauen. Sie haben 1 min Zeit, um das Vorgehen für den Turmbau zu besprechen. Nach Ablauf der Minute geht es los und Teams haben 3 min Zeit, um den Turm zu bauen. Nach der 1. Runde kurze Gratulation / Prämie für Gewinner möglich,  danach wechselt jeweils ein Mitglied aus einem Team in ein anderes Team. Die Teams haben jetzt 2 1/2 min Zeit für Turmbau - dieses Mal keine Extra-Vorbesprechungsszeit!!  In der Auswertung soll besprochen werden, wie sich die Gruppendynamik entwickelt hat, um gemeinsam an dem Projekt 'Turmbau' zu arbeiten. Wie hat sich der Wechsel in den Teams bemerkbar gemacht oder ausgewirkt? Haben sich die TN Gedanken über ihre neue Rolle (zum Beispiel nach dem Wechsel) gemacht?","Würfelzucker, Tische","GA","Gruppentische, weiter voneinander","","","",""],["Dreiecksspiel Identität","","Kennen lernen","Reflexion","Ziele","","","https://www.dija.de/nc/toolbox-interkulturelles-lernen/methodenbox-interkulturell/?tx_fedijamethoden_pi1%5BshowUid%5D=36&cHash=7def2b1c80341dc4251f5cf15d4a2c2a","","","","","","",""],["Energiekreis","","Konzentration","Kooperation","Aktivieren","","","Alle TN stehen im Kreis. Die Hände werden mit den Handflächen nach oben zeigend seitlich ausgestreckt, wobei die linke Hand unter und die rechte Hand auf der Nachbarshand „liegt“. Die Energie fließt, indem ein/-e TN ihre/seine rechte Hand auf die linke Hand des Nachbarn schlägt. Dieses „Signal“ wird dann möglichst schnell weitergegeben, bis es wieder den Ausgangspunkt erreicht hat.","","PL (oder Teilgruppen)","Stehkreis","","","",""],["Farbpalette","s.a. Obstsalat","Aktivieren","DaF WS","Gruppenbildung","","Bewegung","Die TN sitzen im Stuhlkreis und SL steht in der Mitte des Kreises. SL hat keinen Stuhl und die Gruppe in 4 oder mehr Kleingruppen ein, indem er/sie jedem/jeder Spieler/-in eine Farbe zuteilt (z.B. blau, rot, gelb, weiß). Das Spiel beginnt, in dem SL zwei verschiedene Farben aufruft (z.B. blau und gelb). Bei diesem Aufruf müssen alle TN mit entsprechender Farbe aufstehen und sich einen neuen Stuhl suchen. Ruft SL „Farbpalette!“, tauschen alle Spieler/-innen den Platz. SL versucht auch, einen Platz zu finden und derjenige, der am Schluss in der Mitte übrig ist, ist nun seinerseits an der Reihe, die Farben auszurufen. (Geht auch mit anderen Wortfeldern, oder ohne Farb-Zuteilung. Jeder muss aufstehen, der etwas in dieser Farbe hat / anhat.) Das Spiel kann erschwert werden, indem der/die Spielleiter/-in Mischfarben nennt. Zum Beispiel „grün“, so dass die Farbgruppen „blau“ und „gelb“ die Plätze tauschen müssen, bei „violett“ die Gruppen „blau“ und „rot“ usw.","","PL","Sitzkreis, ein Stuhl weniger als TN","","","",""],["Kreispräsentation","","Präsentation","Konzentration","","","","Die TN haben in Gruppen gearbeitet, jede Gruppe zu einem bestimmten Abschnitt von einem Prozess. (z.B. Phasenmodell). Sie stellen sich nachher im Kreis auf, der dem Ablauf entspricht. Jeder TN nennt einen Aspekt aus dem Gruppenergebnis. (z.B. \"ein wichtiges Merkmal dieser Phase\", \"Worauf wir als Lehrer achten sollen\"...)","","PL","Steh- oder Sitzkreis.","","","mit Gruppensprechern / oder jeder darf: 1-2-3: BREAKOUT-ROOMS haben Nummer, wir fangen mit irgendeiner Nummer an und machen im Kreis weiter",""],["Synchronprotokoll","","Präsentation","Auswertung","","","","Zu zwei verschiedenen Aspekten notieren zwei Personen auf getrennten Flipcharts die Ideen / Zurufe der TN. Am Ende werden die beiden Flipcharts verglichen und ein gemeinsames Protokoll verabschiedet. Das Verfahren macht das Protokollieren leichter und stoppt nicht den Fluss der Diskussion mit Rückfragen.","2 Flipcharts / 2 Tafelhälften / 2 Plakate","PL","","","","",""],["Team-Scrabble","","Kooperation","Einstieg","Erfahrung","","","Die TN bekommen ihre Namen aus Scrabble-Steinen gelegt. (echt oder aus Papier). Die Gruppen bekommen zusätzlich 3 Joker. Aufgabe: Aus den Steinen Wörter zum neuen Thema legen oder ein Motto für die Gruppe legen.","Scrabblesteine","GA","","","","",""],["Das Kostbare an dir ist...","","Feedback","Kennen lernen","Gruppendynamik","","","Vorstellungsrunde, wenn die TN sich kennen, aber der KL kennt sie nicht: Die TN sitzen im Kreis. Jeder stellt den Nachbarn vor und sagt etwas, was an ihm kostbar ist, was sie an ihm schätzen. Jeder fängt den Satz mit \"Das Kostbare an dir ist...\" an.","","PL","Sitzkreis","","","",""],["Tagesabschlusskarten","","Reflexion","Auswertung","","","Ritual","Die TN bekommen ein Set von Fragekarten für die Mitte. In der Gruppe wählen reihum alle TN eine Karte und beantworten die Frage. Die Karte wird dann weggelegt. 2-3 Runden machen.","Kärtchen","GA","Gruppentisch","tagesabschlusskarten_1.jpg","","",""],["Bild nachmalen","Nachspuren","Kontrolle","","","","","An der Tafel ein Bild mit gestrichelten oder dünnen Linien oder mit einer weniger intensiven Farbe malen, mit so vielen Einzelteilen, wie viele Aufgaben die TN / die Gruppe lösen sollen. Für jede gelöste Aufgabe den Teil mit einer intensiven Farbe / dickem Marker nachmalen.  (Auch geeignet für Laufzettel!)","Tafel, Bild, Marker","PL","","","","",""],["Flipchartleporello","","Präsentation","Visualisierung","","","","Komplexe, mehrschrittige Arbeitsaufträge auf Flipchartpapier schreiben und nach und nach zeigen / bearbeitete AA nach hinten flippen.","Flipchartbögen","FA","","","","",""],["Baukasten-Planung","","Transfer","Kooperation","UP","","","Mögliche Elemente (Methoden, Material...) für einzelne Phasen und Schritte nach und nach als Baukasten präsentieren. Die Gruppen wählen in jeder Runde 1-2 mögliche Elemente und überprüfen am Ende, ob die Planung kohärent ist.","Flipchartplakate, AB, Präsentation","GA","","","","",""],["Geschichtenjagd","","Gruppenbildung","DaF Sprechen","DaF Schreiben","","","Jede/-r TN erhält ein Bild (Teil einer Bildergeschichte). Nun müssen sich diejenigen finden, deren Teile dieselbe Nummer auf der Rückseite haben.  Wenn die TN ihre Gruppe gebildet haben, werden sie aufgefordert, die Teile in der richtigen Reihenfolge anzuordnen und so die Geschichte zusammenzusetzen.  Anschließend kann die Geschichte in der Gruppe besprochen und dann den anderen Gruppen erzählt werden.","Comics, zerschnitten, auf der Rückseite nummeriert","CP --> GA","","","","",""],["GYMKHANA","","interkulturelles Lernen","Problemlösung","","","","https://www.dija.de/nc/toolbox-interkulturelles-lernen/methodenbox-interkulturell/?tx_fedijamethoden_pi1%5BshowUid%5D=52&cHash=b2e7415f9254beeffe0376f1f6162e30","","","","","","",""],["Labels und Etiketten","","Gruppendynamik","Konflikte","","","","Für jeden TN weiße selbstklebende Etiketten (ca. 5 cm x 2 cm). Auf jedes Etikett soll eine Charaktereigenschaft geschrieben werden, wie z.B. \"verantwortungslos\", \"lustig\", \"schlau\", \"ungeschickt\", \"intelligent\" usw. Es muss über eine Aufgabe, die die Gruppe ausführen soll entschieden werden, zum Beispiel die Planung eines Festes, die Möbel neu anzuordnen, darüber zu entscheiden, ob eine berühmte Popgruppe in der Kleinstadt auftreten soll. Jeder TN bekommt ein Etikett auf die Stirn geklebt, er/sie darf aber nicht erfahren, welche Charaktereigenschaft auf diesem Etikett steht. Der Gruppe wird die Aufgabe erklärt. Es wird ihnen dabei klar gemacht, dass die TN sich gegenseitig nach den ihnen auf der Stirn stehenden Charaktereigenschaften behandeln sollen. Wenn z.B. ein/-e TN als faul charakterisiert ist, behandeln die anderen ihn/sie so, als wüssten sie, dass dieser immer sehr faul ist. Aber die Beteiligten sollten dabei darauf achten, niemals das Wort „faul“ zu benutzen. Außerdem darf natürlich den anderen TN nicht erzählt werden, was ihnen „auf die Stirn geschrieben“ wurde. Die TN sollen versuchen, die Aufgaben zu erfüllen. Am Ende des Spielablaufs raten die Beteiligten, was auf ihrem Etikett geschrieben steht. Die Spielleitung sollte darauf achten, welche Charaktereigenschaften den einzelnen Personen zugeordnet werden. Wenn zum Beispiel ein/-e Mitspieler/-in von einigen anderen TN als faul angesehen wird, sollte er/sie nicht die Charaktereigenschaft „faul“ erhalten. Das Ziel des Spiels ist nicht, persönliche Meinungen einzelner Gruppenmitglieder über andere Gruppenmitglieder an die Öffentlichkeit zu bringen, da dieses Spiel nicht den richtigen Rahmen bietet, um Gruppendifferenzen auszutragen. Auswertung: Wie hat sich jede/-r Spieler/-in während der Aktivität gefühlt? War es schwer, die anderen nach den Charaktereigenschaften zu behandeln? Fing jemand an, sich entsprechend der ihm/ihr zugeschriebenen Charaktereigenschaft zu verhalten? Welche Art von Stereotypen schreiben wir im realen Leben Personen zu? Welche Effekte hat das auf diese Personen und auf unser Denken über diese Personen? Welche der benutzten Stereotypen werden im realen Leben bestimmten Personengruppen zugeschrieben? Welchen? Sind diese passend?","selbstklebende Etiketten","PL","","","","",""],["Labyrinth","","Kooperation","Problemlösung","","","","Mit Klebeband oder Kreide wird auf dem Boden ein Quadrat oder Rechteck von 6 mal 6 Feldern (oder größer, dann wird die Übung schwieriger) markiert – das Labyrinth. Nur ein Weg führt durch das Labyrinth. Diesen sollte der/die Übungsleiter/-in vorher aufzeichnen, um nicht selbst den Überblick zu verlieren. Der/die Spielleiter/-in erklärt, dass die Gruppe das Labyrinth durchqueren muss, durch das es nur einen richtigen Weg gibt (den nur der/die Spielleiter/-in kennt).  Es darf sich jeweils nur eine Person im Feld bewegen, die nächste darf erst dann folgen, wenn die erste Person ihr Ziel erreicht hat.  Die Gruppe erhält ein Konto von 10 Punkten (1 Million € o. a.; bei größerem Feld evtl. mehr). Für jeden falschen Schritt muss 1 Punkt (100 000 €) Strafe bezahlt werden. Sind die Punkte aufgebraucht, ist das Spiel zu Ende.  Die Gruppe erhält 10 Minuten Zeit zur Vorbesprechung. Danach darf nicht mehr gesprochen, sondern nur noch mit Körpersprache kommuniziert werden.","Klebeband / Kreide","GA (10 Personen)","","","","",""],["Quadrat im Kreis","","Kooperation","Problemlösung","","","","Es werden zwei Seile nebeneinander gelegt. Der/die Spieler/-in, der/die das Seil berührt, wird blind (Augenbinde). Sobald die erste Person das Seil berührt, werden alle anderen Spieler/-innen stumm. Die Aufgabe besteht darin, aus dem einen Seil einen Kreis zu bilden und aus dem zweiten Seil ein Quadrat, das den Kreis mit seinen Ecken berührt.","2 Seile, Augenbinden / Tücher","GA (min. 10 Personen)","","","","",""],["Ra-ka-rö","","Kooperation","Aktivieren","","","Bewegung","Ein Bewegungsgesang im Kreis in drei Strophen.  Alle Teilnehmenden stellen sich im Kreis auf. Es geht dreimal drei Schritte nach rechts, zzgl. einem Zwischenschritt. Dann dreimal drei Schritte nach links (ebenfalls mit Zwischenschritt).  Auf die ersten drei Schritte werden jeweils die Silben „Ra“ „Ka“ „Rö“ gesprochen. Bei der ersten Strophe berührt man sich mit den Händen auf den Nachbarsschultern, bei der zweiten Strophe mit den Händen auf den Nachbarsknien, bei der dritten Strophe mit den Händen auf den Nachbarsknöcheln.","","PL","freier Raum","","","",""],["Schenkel klatschen","","Konzentration","Aktivieren","Gruppendynamik","","","Die Gruppe sitzt im Kreis. Jede/-r legt die rechte Hand auf den linken Schenkel des Partners bzw. der linken Partnerin und die linke Hand auf den rechten Schenkel des Partners bzw. der linken Partnerin. Die Arme sind demnach verkreuzt mit den Spiel-Partner(inne)n zur linken und rechten Seite.  Spielverlauf in Uhrzeigerrichtung (bis zur Ansage auf Wechsel!). Die Spielleitung beginnt, indem sie mit der eigenen Hand leicht auf den Schenkel des Nachbarn/der Nachparin tippt, auf dem die Hand liegt. Entsprechend der Uhrzeigerrichtung muss die nächste Hand - nicht der nächste Partner - bewegt werden.  Klopft eine Hand zweimal kurz hintereinander, so wird die Richtung gewechselt.  Wer zu spät mit Klopfen reagiert oder gar die falsche Hand bewegt wird (meist zu voreilig), muss diese Hand auf den Rücken nehmen. Durch den Ausschluss von Händen verändert sich laufend die Situation und die Gruppengröße für den einzelnen Spieler bzw. /die einzelne Spielerin.","","PL","Sitzkreis","","","",""],["Secret spot","","Konflikte","Kooperation","","","","TN in Kleingruppen aufteilen. Jede/r TN erhält (leise und so, dass es die anderen nicht mitbekommen) die Anweisung, an welche Stelle im Raum er / sie die Gruppe hinbringen soll. Die TN dürfen sich untereinander NICHT über diese Stelle im Raum austauschen. Die Übung soll ohne Worte durchgeführt werden. Es findet kein verbaler Austausch zwischen den TN statt. Diese halten sich nur an den Händen und versuchen, die Gruppe jeweils an den Platz im Raum zu dirigieren, der ihnen vorher mitgeteilt wurde. Was passiert? Jede/r bewegt sich in eine andere Richtung. Im Verlauf der Übung darauf achten, welche Strategien und Methoden die einzelnen Personen beziehungsweise Gruppen benutzen, um an ihr Ziel zu kommen. Fragen zur Auswertung: Überprüfen, wer wirklich an den zugewiesenen Platz gelangt ist. Wie haben sich die Spieler/-innen dabei gefühlt? Welche Strategien und Methoden wurden benutzt (von den einzelnen TN / von der Gruppe)? Was wäre anders gelaufen, wenn ein verbaler Austausch stattgefunden hätte?","","GA (8-10)","","","","",""],["Seminarkurve","","Evaluation","Reflexion","","","","Auf einem großen Plakat wird ein Koordinatenkreuz für die Seminarkurve aufgezeichnet. Auf dem Koordinatenkreuz sind auf der horizontalen Achse alle Programmeinheiten (Methoden), auf der vertikalen Achse Noten von +3 bis -3 aufgeführt.  Gefragt wird danach, wie den TN die Veranstaltung oder das Seminar während der einzelnen Seminareinheiten gefallen hat. Die Teilnehmer/-innen tragen somit jeweils ihre ganz persönliche Kurve ein.  Im Anschluss kann in einem Gespräch auf die Ursachen für die Wertungen eingegangen werden, was sich besonders dann empfiehlt, wenn sie auffallend niedrig sind oder weit auseinandergehen.","Plakat","EA","","","","",""],["Motorboot - Ruderboot?","","Kennen lernen","Aktivieren","DaF Sprechen","","","Der Leiter denkt sich verschiedene Paare aus: z.B. Motorboot - Ruderboot; Toastbrot - Vollkornbrot; Playstation - PC; Vanilleeis - Schokoeis; Auto - Fahhrad; Frühling-Sommer; Sommer - Winter; Metal - Pop; lila - gelb; Rockstar - Hausfrau/-mann; Sushi - Döner; ...  Jeder L erhält ein Wortpaar und muss allen anderen erklären, warum er eher das eine ist, als das andere (z.B. ich bin eher Ruderboot als Motorboot, weil ich gerne etwas aus eigenem Antrieb bewege(schaffen möchte), oder ich bin eher Motorboot als Ruderboot, weil ich ein fauler Mensch bin. So erhält man auf witzige Weise einen Überblick über etwaige Charaktereigenschaften der TN.","Kärtchen","CP oder PL","","","","",""],["Schattenbilder","","Kennen lernen","DaF SP","","","","Jeder L macht mit zwei weiteren L ein Schattenbild (ein L sitzt vor einer Wand, ein anderer L leuchtet mit einer (Taschen)Lampe den Umriss des Kopfes an die Wand und der Dritte zeichnet den Umriss ab. Jeder L schneidet seinen Kopf aus). Auf der Rückseite können z.B. Lieblingsgericht, Wohnort, Geburtstag usw. drauf geschrieben werden. Mithilfe des Schattenbildes und der Infos sollen die L erraten, wer dahinter steckt.","Papier, Stifte, Taschenlampen","GA3","","","","",""],["Überraschungsei","","Kennen lernen","Einstieg","DaF Sprechen","","","Jeder L erhält ein Überraschungsei. Gemeinsam werden sie aufgemacht und gegessen. Anschließend erfolgt eine Austauschrunde. Jeder sagt ein paar Dinge über sich. Der Gegenstand (Spielzeug) soll in Bezug gebracht werden zur eigenen Persönlichkeit (z.b. Flugzeug – ich reise gerne/ oder ich habe Flugangst). (Wenn wir die Methode als Einstieg in das Thema benutzen, können wir gezielt Spielzeug aussuchen und in den Kapseln verstecken.)","1 Überraschungsei pro L","EA --> PL","","","","",""],["Plankenhüpfen","","Kooperation","Problemlösung","","","","Eine Strecke von ca. 15 m mit Markierungslinien kennzeichnen. Die Gruppe muss die markierte Strecke als Gesamtgruppe überwinden. Nur eine Person darf den Boden berühren, die anderen haben keine säurefesten Schuhe :-), sie stehen auf einem Brett von ca 80c120 cm. Kommt eine Person mit dem Boden in Kontakt, werden ihr die Augen verbunden. (Auswertung: Wie sind sie zum gemeinsamen Rhythmus gekommen? Wie sind mit Frust umgegangen? Was können sie aus dieser Übung lernen?)","Kletterseil ca 3 m, für 10 Personen ein Brett von ca 80x120 cm mit einem Loch in der Mitte, ca. 10 cm Abstand zur Brettkante, durch das das Seilstück eingefädelt werden kann.","GA (11 Personen)","im Freien, auf ebener Fläche","planke.jpg","","",""],["Gewichtsfragen","","Problemlösung","Kooperation","Kreativität","","","Die Gruppe soll mithilfe der im Seminarraum vorhandenen Materialien herausfinden, wie viel eine 1 Euro-Münze wiegt. (Lösung: Einen Gegenstand suchen, von dem sie das genaue Gewicht kennen. Muss leichter sein als das mutmaßliche Gewicht der Münze und möglichst in kleinen Einheiten vorhanden sein. Danach wird eine Waage aus Büroklammern, Moderationskarten, Stiften etc. gebaut und das Gewicht abgemessen. 1 EUR = 7,5 g, 50 cent = 7,8 g, 2 EUR = 8,5 g)","vorher checken, ob etwas tatsächlich da ist mit aufgedruckten Gewichtsinfos!!!","GA","","","","",""],["Ein Eimer auf Füßen","","Kooperation","Problemlösung","","","","Die L legen sich eng (Po an Po) in einem Kreis auf den Rücken und strecken die Beine in die Luft zum Mittelpunkt des Kreises hin aus. Auf die Schuhe platziert der SL ein Eimer Wasser. Alle Schuhsohlen sollen den Eimer berühren. Aufgabe: Alle L solen möglichst schnell die Schuhe ausziehen, ohne dass der Eimer abgesetzt oder Wasser verschüttet wird. Evtl. Zeitvorgabe geben.","Plastikeimer (ca 40 cm Durchmesser) voller Wasser","GA6","Bei schönem Wetter und draußen spielen!","eimer.png","","",""],["Eieruhr","","Problemlösung","Kooperation","Kreativität","","","Das Ei mit der Schnur in ca 4 m Höhe an einem Ast aufhänge. (Im Seminarraum den wahrscheinlichen Landeplatz mit einer Zeitung schützen). Die Gruppe hat 20 Min Zeit, um eine freistehende Konstruktion mit Zeitung und Tesafilm zu bauen, damit das Ei, wenn die Schnur durchgeschnitten wird, nicht kaputtgeht.","ein kurzes Stück Paketschnur, ein rohes Ei, eine Zeitung, eine Schere, ein Stück Tesafilm ca 1 m lang.","GA5-6","nach Möglichkeit im Freien","","","",""],["Greif den Löffel!","","Wiederholung","Einstieg","Transfer","","Wettbewerb","Einen Kaffeelöffel in die Tischmitte legen.  Der KL liest Fragen vor. Wenn jemand glaubt, die Antwort zu kennen, greift er nach dem Löffel. Nur wer den Löffel hat, darf antworten. Ist die Antwort korrekt, bekommt das Team einen Punkt.  Schwieriger: Wer den Löffel schon hatte, geht nach hinten und darf erst nach 3 Fragen wieder ran.","Tisch, 1 Kaffeelöffel, Fragekatalog","PL","","","","",""],["Postkartenübung","","Wahrnehmung","DaF Sprechen","Einstieg","","","Die L sitzen im Stuhlkreis. 3-4 L bekommen eine Postkarte. Die anderen L dürfen die Bilder nicht sehen. Jeder L mit einer Postkarte hat 60 Sec Zeit, sich das Bild auf seiner Karte genau einzuprägen. Danach werden die Karten wieder eingesammelt. Jetzt erzählen die L der restlichen Gruppe, was sie auf ihrer Postkarte gesehen haben. Nach jeder Beschreibung geht die beschriebene Postkarte durch die Gruppe (oder scannen / fotografieren und beamen) und jeder kann seine Vorstellungen und sein Verständnis der Beschreibung mit der Karte überprüfen.","3-4 Postkarten, Beamer","PL","Sitzkreis","","","",""],["Lernsteine","","Feedback","Gruppendynamik","","","","\"Diese Steine sind sog Lernsteine. Ich werde sie zuerst wahllos unter Ihren verteilen. Diejenigen, die einen Lernstein von mir bekommen, haben die Aufgabe, sie bei der nächsten Gelegenheit (in den Pausen zwischen den Einheiten / Übungen) weiterzugeben Sie geben den Lernstein an jemanden weiter, der durch seinen Beitrag oder sein Handeln entweder besonders mutig oder hilfreich für den Prozess war, einen besonderen Einsatz für die Gruppe oder für sich gezeigt hat oder Sie irgendwie anders beeindruckt hat. Wenn Sie den Lernstein weitergeben, sagen Sie dem Empfänger, warum Sie ihm/ihr den Stein geben. Die Lernsteine solen nicht zu lange bei einem Besitzer verweilen, sie sollen in der Gruppe wandern.\"","Halbedelsteine oder besonders schöne Steine, TN-Zahl dividiert durch 4","","","","","",""],["Systemisch kreisen","","Aktivieren","Gruppendynamik","","","Bewegung","Die L stehen im Kreis. Jeder wählt geheim eine Person aus. Jeder muss die gewählte Person dreimal umrunden. Wenn dies jemandem gelungen ist, geht er in die Hocke.","","PL","Freier Raum oder im Freien","","","",""],["Narbengeschichten","","Kennen lernen","DaF Sprechen","","","","Jeder L stellt sich mit einer kurzer Geschichte vor, wie er zu seiner spektakulärsten Narbe gekommen ist.","","PL","Sitzkreis","","","",""],["Teamschätzung","","Kennen lernen","Gruppendynamik","DaF Sprechen","","","Gruppe in gleich große Teilgruppen aufteilen. Aufgabe: So schnell wie möglich bzw. in max 10 Min. alle Fragen zur Gruppe, die auf der Flipchart stehen, zu beantworten. Dies erfolgt in den Kleingruppen leise und und unabhängig voneinander und notiert die Lösungen auf einem Papierstreifen (so lang wie das Flipchartpapier). Sobald eine Gruppe meint, die Lösungen erarbeitet zu haben (bzw. nach spätestens 10 Min.) Auswertung an der Flipchart: Zuerst die Tipps der Gruppen ankleben, dann Daten zusammentragen und rechnen. (Ideen für Fragen: Wie viele Km hat die Gesamtgruppe für die Anreise zurückgelegt? Wie viele Trainingstage in diesem Jahr hat die GG bisher absolviert? Wie alt sind wir zusammen? Wie viele Kinder hat die GG bisher gezeugt? Auf wie viele Knochenbrüche bringt es die GG?...)","Flipchart mit Fragen, Papierstreifen, Stifte, Taschenrechner","GA","","","","",""],["Inselspiel","","Aktivieren","Gruppendynamik","Kennen lernen","","","Mehrere Hulahoop-Reifen werden im Raum oder auf dem Rasen verteilt. Jeder Reifen stellt eine Insel dar. Die Gruppe läuft durch den Raum. Wenn der SL  z.B. sagt alle die keine-1-2-3-X-Geschwister haben stellen sich einem (bestimmten) Kreis auf. Nun müssen sich alle je nach Geschwister Anzahl auf den Inseln sortieren das klappt natürlich mit allen Fragen wie z.B. nach Alter, Haarfarbe oder Größe. Auf jeder Insel dürfen nur diejenigen sich einfinden, die dieselbe Eigenschaft haben.","Hulahoop-Reifen in verschiedenen Farben - oder Seile, die wir wie Kreise hinlegen","PL","Freier Raum oder im Freien","","","",""],["Klaus küsst klasse","Namen lernen","Kennen lernen","Aktivieren","DaF Schreiben","","","Variante A: Jeder schreibt mit dem Anfangsbuchstaben seines Namens einen kurzen Satz und stellt sich damit vor. \"FRED feiert fest\".  Variante B ist lustiger und spannender. Alle L schreiben den eigenen Vornamen auf ein kleines Blatt Papier. Die Zettel werden vom SL in eine Schachtel gegeben. Jeder zieht dann einen Namen heraus und überlegt sich mit dem Anfangsbuchstaben einen lustigen Satz und liest ihn vor. Der Genannte steht auf und stellt den Satz pantomimisch dar. Z.B.: KLAUS küsst klasse. MARIO macht Marmelade.","Zettel","PL","Sitzkreis","","","",""],["Der eilige Edding","","Kennen lernen","DaF WS","","","Kettenübung","Alle TN stehen im Kreis. Der Spielleiter hält einen Edding in der Hand und sagt \" Das ist der eilige Edding und ich bin der \"schnelle\" Sven.\" Der Reihe nach geht es weiter und die TN benennen den Edding, den Spieler, von dem sie den Edding bekommen haben und nennen auch ihren Namen mit passendem Adjektiv, der denselben Anfangsbuchstaben hat, wie der eigene Name.","ein Edding","PL","Sitzkreis / Stehkreis","","","",""],["Für den ersten Eindruck gibt es keine zweite Chance","","Kennen lernen","DaF SP","","","","Dieses Kennlernspiel eignet sich für Gruppen, deren Mitglieder sich gänzlich unbekannt sind. Die TN finden sich zu viert zusamme
