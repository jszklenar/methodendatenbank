<style>

const COLS=["NAME", "AUCH", "FUNKTION 1", "FUNKTION 2", "FUNKTION 3", "FUNKTION 4", "ANMERKUNG", "BESCHREIBUNG", "MATERIAL", "SOZIALFORM", "RAUM", "BEISPIEL", "QUELLE", "ONLINE VARIANTE", "ONLINE ZUSATZ"];
const BASE=[["Plus-minus-Fragezeichen-Zettel","","Feedback","Evaluation","","","","TN notieren in einer Liste / schreiben auf drei Zetteln mit verschiedener Farbe Kommentare: + : Hat mir gut gefallen,... / ? : Habe nicht ganz verstanden,... / - : Fand ich nicht so gut,.... Nennungen können vorgelesen und kommentiert werden. Variante mit Zetteln: Sie können angepinnt und geclustert oder reihum weitergegeben werden, bis jemand nicht “Stop” sagt. Dann werden die Kärtchen kommentarlos vorgelesen.","3 Kärtchen pro TN","EA --> PL","","","","Geteilte Notizen - 3 Runden",""],["Drei-Minuten-Bericht","","Auswertung","Feedback","Präsentation","","","Gruppensprecher / einzelne TN fassen Ergebnisse in 3 Minuten zusammen, ohne Visualisierung. Danach offene Kommentarrunde.","","PL","","","","Kamera für alle GS, sonst alle stumm, Kommentare in den Chat",""],["Drei-Satz-Statements","","Auswertung","Feedback","Präsentation","","","Gruppensprecher / einzelne TN fassen Ergebnisse in 3 Sätzen zusammen, ohne Visualisierung. Danach offene Kommentarrunde.","","PL","","","","GS Kamera und Mikro an, alle anderen aus, Kommentare parallel in den öffentlichen Chat",""],["Dreimal Plus und Dreimal Tipps","","Feedback","","","","","Nach einer Aktivität nennt die beteiligte Person 3 Sachen, die sie gut gemacht hat (worauf dann das Publikum mit weiteren positiven Kommentaren reagieren kann). Danach gibt die SL (oder Beobachtergruppen) der Person 3 Verbesserungstipps / Hinweise, woran die Person noch arbeiten sollte.","","PL","Sitzkreis / U","","","Kamera und Mikro an - alle schreiben die kommentare in den öffentlichen chat",""],["Dreimal drei","","Auswertung","Reflexion","Feedback","","","Die TN malen in 9 Felder 9 Bilder, die die Ideen / persönlichen Erkenntnisse / Methoden symbolisieren, die sie aus der letzten Aktivität mitnehmen. Sie stellen sich dann in einen Kreis, legen das Blatt vor sich auf den Boden. Der KL mcht Musik und setzt sich mit dem Rücken zur Gruppe, die TN werfen einen Ball herum. Wenn die Musik stoppt, kommentiert der TN, der den Ball hat, die 3 wichtigsten Bilder.... usw. Wenn jemand schon dran war und den Ball hat, darf er ein weiteres Bild kommentieren. Die Bilder werden nachher ausgehängt (bietet einen guten Sprechanlass in der Gruppe).","DIN A4 mit 9 Feldern, dicke Stifte","PL","für Auswertung: Stehkreis","DSCN5879.JPG","","malen auf Papier, WL wählt random TN, sie schalten ihre Kamera an und halten das Papier in die Kamera :-)",""],["Vier Füße und zwei Hände","","Kooperation","Problemlösung","Aktivieren","","","Die Gruppe bekommt eine Aufgabe: Sie darf mit 8 Leuten nur mit maximal 4 Füßen und 2 Händen den Boden berühren und alle Mitglieder der Gruppe müssen irgendwie miteinander verbunden sein. Klingt einfach, kann aber ganz schön schwer werden...","keine","GA8","relativ großer Raum","","","X","X"],["Abreißzettel","","Selbstkontrolle","Präsentation","","","","Die Lösung (eine Zahlenfolge / Reihe von Symbolen...) oder Aufgaben oder Quellenangebe von Texten... steht auf langen Zetteln wie bei Anzeigen am Schwarzen Brett, für jede Gruppe ein Zettel zum Abreißen bereit.","Lösungsblatt wie bei Wohnungsanzeigen zum Abreißen","EA / PA / GA","","abreisszettel.doc","","X","X"],["AH-KO-SO","","Konzentration","","","","","Drei Töne und Handbewegungen müssen die TN immer in der gleichen Reihenfolge durchführen: 1. symbolischer Handkantenschlag an die eigene Kehle + laut \"AH\" rufen. (Je nachdem, ob dazu die linke oder rechte Hand benutzt wurde, zeigen die Finger auf den rechten oder linken Nachbarn, der nun mit der zweiten Bewegung an der Reihe ist.) 2.  verfehlter Handkantenschlag direkt über den eigenen Kopf + laut: \"So\". Dabei zeigen die Finger wieder nach rechts oder links und der jeweilige Nebenmann ist mit der dritten Bewegung dran. 3. symbolischer Handkantenschlag in die Mitte des Kreises, zeigt dabei auf einen anderen Mitspieler +  laut \"KO\". ...Dieser Spieler beginnt wieder mit 1....  Macht jemand einen Fehler, so rufen alle laut \"RAUS\" und zeigen mit einer deutlichen Handbewegung an, dass die Person den Kreis verlassen muss. Die hinausgeworfenen Spieler haben die Aufgabe, die im Kreis verbliebenen Spieler in deren Konzentration zu stören. Sie dürfen diese allerdings nicht berühren oder ihnen die Sicht versperren. Scheidet ein Spieler aus dem Kreis aus, so setzt immer der linke Spieler das Spiel fort. Das Spiel ist zu Ende, wenn nur noch drei TN in Kreis sitzen","","PL","Stehkreis","","","WL Kamera an, vormachen, TN machen es zu Hause, Mikro an",""],["Am Seil entlang","","Kennen lernen","Erfahrung","","","","“Erfahrungsschlange” mit einem Seil: Das Seil wird auf den Boden gelegt und alle Spieler sollten sich nebeneinander auf das Seil stellen. Das Seil sollte nicht viel länger sein als die Reihe der Spieler ist. Dann gibt man verschiedene Kommandos nach welcher Reihenfolge sich die Spieler aufstellen sollen, ohne, dass sie den Kontakt zum Seil verlieren.","Seil","PL","freier Raum","","","X","X"],["Ampelabfrage","","Erwartungen","","","","","TN schreiben (nach Kennen Lernen des Seminarprogramms) ihre Erwartungen auf Karten: GRÜN: Ich freue mich darauf / Das erwarte ich vom Sem. GELB: Mal sehen... ROT: Das will ich auf keinen Fall / Das brauche ich eher nicht. Kärtchen werden geclustert (Doppelungen werden angepinnt):","Kärtchen in verschiedener Farbe oder weiße Kärtchen und Stifte in drei Farben, Pinnwand","EA --> PL","","","","öffentlicher Chat 3 Runden // geteilte Notizen präparieren mit den drei Kategorien",""],["Angestiftet","Stiftetango","Kooperation","Konzentration","","","","2 TN halten 2 dicke Stifte zwischen ihren Zeigefingern und führen einige Instruktionen aus, ohne die Stifte fallen zu lassen (Hände heben, senken, eine Hand oben, eine unten, Kreis in die Luft malen, in die Hocke gehen, rückwärts laufen, tanzen, sich hinsetzen...)","1 dicker Stift pro Paar","PA","freier Raum","angestiftet_stiftetango.jpg","","X","X"],["Anleitung und Rezepte","","Transfer / Anwendung","","","","","Für Planungsphasen schrittweise Anleitung geben, für einzelne Komponente „Rezepte“ in Form von Spielbeschreibungen, Übungstypologie anbieten. Anleitung auf AB bzw. auf Flipchart / Pinnwand. (wird nicht extra erläutert.)","Pinnwand","GA","","","","",""],["Apfel und Zwiebel","","Feedback","","","","","1 schöner Apfel und eine Zwiebel (etwa gleich groß) werden zusammen herumgereicht. Mit dem Apfel wird positives mit der Zwiebel negatives Feedback gegeben. Wer als nächstes sprechen will, verlangt den Apfel und die Zwiebel.","1 Apfel, 1 Zwiebel","PL","Stehkreis / Sitzkreis","","","Folie mit Apfel und Zwiebel - Mikro \"weitergeben\" (aus der TN-Liste spicken)",""],["Aquarium","Fishbowl","Reflexion","Evaluation","Diskussion","","","Kleingruppen mit der Auswertung von einzelnen Auswertungsaspekten oder Seminartagen beauftragen. Die Gruppen delegieren eine VertreterIn in das Aquarium. In der Mitte Stühle (Zahl der Kleingruppen + 2 + evtl. 1 für die ModeratorIn) bereitstellen. Die Vertreter nehmen im Kreis Platz, diskutieren die absolvierte Arbeitsphase. Die freien Stühle können TN aus dem Publikum besetzen, aber nur so lange, wie sie ihren Beitrag geleistet haben.","","GA --> PL","doppelter Stuhlkreis, in der Mitte X + 2 Stühle","fishbowl_bpb.jpg","","Innenkreis: Mikro und Kamera an, Außenkreis stummgeschaltet, wer in den Innenkreis will, schaltet Mikro und Kamera an - nach dem Beitrag wieder aus.",""],["Arbeitsauftrag beamen / auf Flipchart","","Arbeitsorganisation","","","","Ritual","Komplizierte, mehrschrittige oder für die TN ungewohnte Aufgaben Schritt für Schritt auf Plakat oder Kärtchen schreiben oder beamen. (Folge: Weniger Nachfragen, da es die ganze Zeit als Erinnerungshilfe da ist, ermöglicht den TN auch eine bessere Zeit- und Arbeitsplanung, weil sie selbst bestimmen, wann sie zum nächsten Schritt übergehen). 'Fixpunkte“, die zu bestimmten Zeiten erfolgen sollen, deutlich markieren!","PPP / WORD-Datei oder Flipchart","FA","","","","in die Präsentation einbauen // jpg getrennt // spontan: an die Whiteboard schreiben",""],["Verlaufspuzzle","","Reflexion","","","","","Arbeitschritte einer längeren Sequenz einzeln auf Streifen schreiben, die TN ordnen diese zusammen oder in Kleingruppen.","Papierstreifen / Kärtchen","PA / GA","","","","in die geteilte Notizen kopieren (Zeilen dazwischen) - gemeinsam ordnen: alle Mikros an, einen Schreiber bestimmen, der die gemeinsamen Entscheidungen ausführt",""],["Aschenputtel","","Erfahrung","Üben","Transfer","","","Einen großen Haufen von Items in verschiedene Kategorien sortieren.","Kärtchen, Bilder, Textstreifen","PA / GA","","","","Folie - whiteboard für gemeinsame Bearbeitung freischalten, Items mit verschiedenen Farben markieren",""],["Auf zwei Seiten der Pinnwand","","Erfahrung","Diskussion","","","","TN stehen in zwei Gruppen an den zwei Seiten der Pinnwand, an der identische Aufgaben / Fragen präsentiert sind. Sie lösen / diskutieren die Aufgabe, und wenn fertig, schieben sie die Wand weg und vergleichen ihre Ideen / Lösungen mit der anderen Gruppe. (Variante: Pinnwand-Arena / Pinnwandspaziergang)","pro Aufgabe 1 Pinnwand, Aufgaben doppelt","GA","","","","X",""],["Aufgabenrallye","","Üben","","","","Autonom","TN bearbeiten in Gruppen Aufgaben in einer festgelegten Reihenfolge und kontrollieren ihre Lösung mit einem Lösungsschlüssel. Die Aufgaben werden nacheinander abgeholt vom Gruppenstapel. Die letzten Aufgaben sind immer Bonusaufgaben, alle Gruppen sollen in der angegebenen Zeit das Mininum ohne Mühe meistern können.","Aufgaben und Lösungsblätter gestapelt, pro Gruppe 1 Stapel","GA","","aufgabenrallye_perfekt.pdf","","Material in cloud ablegen (blätterbar oder einzeln, nummeriert), Aufgabenstellung + Link / QR-code, die zum Material führt, auf eine Folie schreiben, Gruppen in Breakout-Rooms schicken (PA oder GA3-4), oder: APP MATRIX von Learning Apps, ACCORDION von h5p / zumapp, infografik von genially...",""],["Babylonisches Sprachvergnügen","","Kennen lernen","","","","","TN gehen herum und begrüßen einander in ihrer Muttersprache / Landessprache (mit passender Gestik)","","PL","freier Raum","","","Begrüßung in der Muttersprache beim \"Reinkommen\" im Chat (Auftrag auf der Begrüßungsfolie) // zu Beginn: Mikro an, alle begrüßen einander in der MS",""],["Ball-Musik-Stopp","","Präsentation","Reflexion","","","","Während die Musik läuft, werfen die Personen / Teams einander einen Ball zu. Wenn die Musik stoppt, darf die Gruppe kommentieren, die den Ball hat. (KL sitzt mit dem Rücken zur Gruppe und sieht nicht, wo der Ball ist.)","Ball, lebhafte Musik","PL","Stehkreis","","","ohne Ball. alle haben den Mikro auf on, Video starten und stoppen, einen TN nennen - er sagt was... Musik an ... Stopp, der vorige TN sagt, wer weitermacht",""],["Bandolo","","Üben","","","","Selbstkontrolle","Auf festen Karten oben und unten 6-8 Felder erstellen, oben die Aufgabe, unten vermischt die Lösungen notieren, bei jedem Feld ein klein bisschen in der Mitte ausschneiden. Auf dem Kartenbündel einen Faden festbinden, diesen führt man vorne, hakt irgendwo oben ein, führt hinten weiter zu der Lösung und hakt ein, … Wenn fertig, umdrehen: Stimmt der Verlauf des Fadens mit dem vorher markierten Muster überein, ist die Lösung richtig.","Bandolo","EA / PA","","Bandolo_2S.png","","",""],["Bauklötzespiel","","Kooperation","Wahrnehmung","","","","Die TN sitzen im Kreis, das Spielfeld ist in der Mitte. Jeder TN bekommt 4-5 Bauklötze von unterschiedllicher Form und Größe und sollen aus ihnen gemeinsam einen stabiles und ästhetisches Bauwerk bauen, so, dass jeder alle seine Bauklötze einbaut. Dabei gelten folgende Regel: Sie dürfen nicht reden. Auf einmal darf nur eine Person arbeiten und nur einen Bauklotz auf einmal einbauen. Die nächste Person darf erst mitbauen, wenn ihr Vormann wieder Platz genommen hat. Wenn das Bauwerk einstürzt, die TN dürfen nur mit den verbleibenden Steinen an der „Ruine” weiterbauen, die eingestürzten Bauelemente müssen liegen bleiben.","Bauklötze","PL","Sitzkreis","","","",""],["Baumschleife","","Kooperation","Problemlösung","","","","Zusammen eine Schleife um einen Baum herum binden, so dass niemand den Seil loslässt.","Seil","GA / PL","im Freien","","","",""],["Begriffsrecherche","","Input","","","","","TN bekommen / wählen Begriffe (Markt, Kaffee, Öffnungszeiten...), die sie im Internet / “draußen” - Bibliothek, Museum, Befragung von Passanten / Experten – recherchieren.","","GA","Außerschul. Lernorte","","","",""],["Begrüßungen","","Aktivieren","Kommunikation","","","","Die Spieler gehen durch den Raum. Auf Ansage des Spielleiters begrüßen sie sich in unterschiedlicher Art und Weise, jedoch immer ohne zu sprechen: Jeder seiner Herkunft entsprechend (Hier ist es spannend, wenn verschiedene aufeinander treffen!); Jeder, wie er es höchst offiziell tut; Alle offiziell deutsch (jeder so wie er sich dies vorstellt); alle offiziell japanisch, Alle, wie ein Italiener, der nach langer Zeit einen Schulfreund trifft; alle wie ein Italiener, der seinen Expartner trifft; alle wie Eskimos","","PL","freier Raum","","","",""],["Beibringbasar","","Input","Kooperation","DaF Sprechen","","","TN notieren auf Kärtchen etwas Praktisches, was sie den anderen auf der Stelle ohne oder mit ein bisschen Vorbereitung beibringen können. Möglich im Plenum oder als Cocktailparty (in diesem Fall Kärtchen an sich befestigen, TN gehen herum und lernen voneinander die Sachen, die sie interessieren). Funktioniert auch mit Unterrichtsmethoden / Spiele / Übungen / Aufgaben erklären.","","EA / PA --> PL","","","","",""],["Beipackzettel","","Input","","","","","Bücher auswerten nach vorbereiteten Fragen, die auf einem „pharmazeutischen Beipackzettel“ präsentiert werden. Die TN studieren die Beipackzettel und lesen die interessanten Bücher an.","Beipackzettel","EA / PA","","","","amazon blick ins buch-Funktion nutzen - Links in den Chat, Beipackzettel wieder in den Chat kopieren, zusammen mit den links",""],["Benchmarking","","Problemlösung","","","","","Problematische Aspekte / Problemstellen feststellen, die die Entwicklung / eine Veränderung hindern. Lösungen suchen, um diese zu beseitigen. Wird oft mit “best practice” (Meine Lösungen aus der Praxis) gekoppelt.","","GA","","","","",""],["Bewertung mit globalen Leitfragen","","UB","","","","","Unterricht nach 3-4 globalen Fragen (Lerngruppe, Atmosphäre, Methoden, Lehrerverhalten) auswerten.","AB / Kärtchen","EA / PA / GA --> PL","","","","",""],["Bienenkörbe","Buzz groups, Murmelgruppen","Erfahrung","Diskussion","Reflexion","DaF Sprechen","","TN bewegen sich zu Musik im Raum. Wenn die Musik stoppt, bilden sie Kleingruppen (3-4-5-Personen) und tauschen sich zu einer Frage / zu einem Thema aus. Wenn die Musik wieder anklingt, lösen sich die Gruppen auf. Bei Musikstopp bilden sich neue Gruppen und tauschen sich zu einem neuen Aspekt aus.","Musik","CP","freier Raum","","","schnell wechselnde breakout-rooms mit Zufallsgruppen",""],["Bierdeckelmatch","","Aktivieren","Gruppendynamik","","","","Ein Spieler wird zum Schiedsrichter ernannt, die übrigen werden in zwei Gruppen eingeteilt (evtl. wählen lassen). Der Schiedsrichter verteilt in jedem Feld 50 Bierdeckel (hineinwerfen reicht, es sollten nur nicht alle auf einem Haufen liegen). Jeder Mannschaft wird ein Feld zugeteilt. Gewonnen hat am Ende die Mannschaft, die nach einer vorher festgelegten Zeit die wenigsten Bierdeckel in ihrem Feld hat.","100 Bierdeckeln","PL","Das Spiel erfordert einen großen Raum (oder eine Wiese, dann sollte es allerdings relativ windstill sein), welcher durch eine Mittellinie in zwei Hälften geteilt wird.","","","",""],["Bild ausmalen (Laufzettel)","","Prozessbegleitung","","","","","Arbeit an Stationen: Auf dem Laufzettel ein zum Thema passendes Bild in so viele Teile teilen, wie viele Stationen wir eingerichtet haben und ensprechend markieren (Titel in den Teilen, Nummer der Station). Die TN malen die Teile aus, die sie schon bearbeitet haben.","Bild mit Details, nummeriert, passend zum Thema","PA / GA","","","","",""],["Bilderbüfett","","Einstieg ins Thema","Erfahrung","Feedback","Reflexion","","SL formuliert eine “Suchfrage”, z.B. “Was ist für Sie im Deutschunterricht besonders wichtig?”  TN nehmen eine Postkarte / Bildkarte, die zu der Fragestellung am besten passt. Funktioniert auch als Auswertung eines Tages / einer längeren Arbeitsphase.","Postkarten, Fotos (laminiert)","PL","Stehkreis","","http://climercards.herokuapp.com/responses/new","Collage in der PRÄSENTATION einbauen. TN Mikro an. WHITEBOARDfunktion für alle aktiv - TN MARKIEREN\"ihr\" Bild beim Erzählen.// Collage vorbereiten, BILDSCHIRM TEILEN. weiter: s. Weg 1",""],["Bilderlotto","","Üben","DaF WS","DaF GR","","Selbstkontrolle","Ein Aufgabenblatt in Form eines Rasters vorbereiten (5x4 z.B.), in jedes Feld eine Aufgabe schreiben. Lösungsblatt spiegelverkehrt basteln, auf die Rückseite ein Bild aufkleben und Lösungsblatt zerschneiden. Die TN legen die Lösungskarten auf das Aufgabenblatt, wenn fertig, drehen sie die Kärtchen um. Stimmt das Bild, stimmt auch die Lösung.","Bild, AB","EA / PA / GA","","Bilderlotto.jpg","","",""],["Bildmetapher: .... ist wie ...","","Einstieg","","","","","TN wählen zu einem Begriff Bildmetapher oder suchen aus angebotenen Bildern geeignete Metapher.","evtl. Fotos","EA / PA / GA --> PL","","","","",""],["Bildpuzzle","","Einstieg","Gruppenbildung","DaF Sprechen","","","Bilder in Teile zerschneiden (ent¬spre¬chend der gewünschten Gruppengröße). Jeder L bekommt einen Bildteil, den er niemandem zeigen darf und die Information, wie viele Teile noch zu ihrem Bild gehören. Sie gehen herum und beschreiben einander, wie ihr Bildteil aussieht und versuchen die anderen L zu finden, die einen Teil von ihrem Bild in der Hand haben.  Die Puzzleteile dürfen nur bei einem begründeten Verdacht einander gezeigt werden.","Bilder (entsprechend der Anzahl der gewünschten Gruppenzahl) in Teile zerschneiden (entsprechend der gewünschten Gruppengröße).","CP","freier Raum","","","",""],["Blick weitergeben / Platztausch","","Wahrnehmung","","","","","TN stehen im Kreis, einer beginnt mit einem Gesichtsausdruck, den der Nachbar möglichst genau und schnell weitergeben soll. Platztausch: TN stehen im Kreis, einer von ihnen in der Mitte. Die im Kreis stehenden nehmen Augenkontakt zu einem Kollegen auf, wenn er den Blick zurückgibt, tauschen sie die Plätze. Der TN in der Mitte muss versuchen, den Blick zu „fangen“ und einen Platz im Kreis für sich zu sichern. Wer keinen Platz hat, geht in die Mitte.","","PL","Stehkreis","","","",""],["Blickkontakt","","Paare bilden","","","","","TN nehmen wortlos durch Blickkontakt Kontakt zu ihrem Wunschpartner auf und wenn der Partner einverstanden ist, suchen sie sich einen Arbeitsplatz aus / holen das Material ab","","PL","Stehkreis","","","",""],["Blinde Formen","","Kooperation","Wahrnehmung","","","","Zuerst einige Übungen “sehend”: Die Gruppe muss zusammen angegebene Formen (Dreieck, Kreis, Ovale, Stern, Halbmond, Kreuz) oder Buchstaben und Zahlen formen. Nach 2-3 Versuchen die Aufträge mit geschlossenen Augen durchführen, ein TN kann (ebenfalls nicht sehend) die gebildete Form abtasten. Wenn die Gruppe mit dem Ergebnis zufrieden ist, können die Augen geöffnet werden.","Seil","PL","Am besten im Freien.","","","",""],["Blinde führen","","Kooperation","Vertrauen","Gruppendynamik","","","Ein TN ist bei dieser Übung blind und ein anderer TN führt. Bei der Übung darf nicht gesprochen werden. Zuerst an der Hand nehmen, dann vorsichtig, nur mit der Fingerkuppe berühren, zum Schluss ohne Körperkontakt, nur mit einem Geräusch. Dann Wechsel. Am Ende zu zweit besprechen, wie sie sich bei der Übung gefühlt haben, was war leicht / schwer? Was war leichter, zu führen oder geführt zu werden? Woran lag das?","","PA","","","","",""],["Blinde Schlange","","Kooperation","Vertrauen","","","","Die TN stellen sich hintereinander auf, legen die Hände auf die Schultern des Vordermannes und schließen die Augen. Nur der vorderste sieht etwas. Er muss nun die Gruppe herumführen, durch den Raum, das Haus, den Garten,... Dabei gibt es verschiedene Möglichkeiten: Er macht dies einfach durch gehen und die anderen folgen ihm, durch Sprache oder andere vorher vereinbarte Signale. eine andere Variante: Nicht der Vorderste sieht etwas, sondern der Hinterste oder jemand aus der Mitte. Dabei sind die Führungsmöglichkeiten die gleichen.","","PL / GA","","","","",""],["Blinde, Gelähmte und Stumme","","Kooperation","Problemlösung","Wahrnehmung","","","Die Gruppe wird in drei Gruppen eingeteilt. In: 1) Blinde - Diese Personen bekommen die Augen verbunden und können nichts sehen. Reden und Gehen können sie.  2) Gelähmte - Diese Person kann nicht gehen, sie kann nur von anderen Mitspielern getragen werden. Reden und sehen kann sie.  3) Stumme - Diese Person kann nicht reden. Gehen und sehen kann sie. Die Gruppe wird nun auf dem Gelände verteilt. Ihre Aufgabe ist es alle Gruppenmitglieder zurück zum Startpunkt (Mitarbeiter) zu bringen. Dazu muss die Gruppe zusammen arbeiten. Das Spiel endet erst wenn alle gefunden und zum Startpunkt zurück gebracht wurden. Wenn eine Person fehlt, heißt es für alle die es können, nochmal los gehen und suchen.  Variation: Man kann auch Personen mit zwei oder allen Eigenschaften machen, also welche, die blind und gelähmt sind oder blind und stumm, ...","","PL","Spielfeld: am besten Wiese, auch lichter Wald.","","","",""],["Blitzlicht","","Feedback","","","","","Jeder TN kann in einem Satz / mit einem Wort – über seine momentane Stimmungslage / über den wichtigsten Ertrag des Tages... berichten. Niemand ist gezwungen, etwas zu sagen!","","PL","Stehkreis / Sitzkreis oder Gruppentische","","","",""],["Bonbonbewertung","","Auswertung","Feedback","","","","Die Ergebnisse mit einem vorbereiteten oder von den Gruppen selbst erarbeiteten System bewerten und von einer angegebenen Anzahl von Bonbons / Schokolade welche vergeben.","Bonbons, Schokolade","GA / EA","","","","",""],["Brief an uns alle","","Evaluation","Transfer","","","","Nach dem Abschluss des Seminars (mit einem Abstand von 1-3 Monaten) schreibt das Team eine Rundmail an alle TN, die sie als „Mail an alle“ beantworten. Dient der Nachverfolgung und Nachbereitung der Seminarinhalte und der im Seminar gesetzten Ziele und geplanten Projekte.","","EA","","","","",""],["Bullshit-Bingo","","Präsentation","DaF HV","","","spielerisch","Statt Bingokarten mit Zahlen werden Karten mit Schlagwörtern benutzt (die Schüler können Wörter oder Redemittel selbst sammeln, z.B: \"was Lehrer oft sagen\", \"was man bei einem Referat häufig sagt\"). Die Wörter werden gestrichen, wenn sie genannt werden. Bei einer vollständig gefüllten Reihe, Spalte oder Diagonale soll der Spieler den Regeln nach aufstehen und „Bingo“ rufen.","leeres Bingo-AB","EA","","bullshitbingo.jpg","","",""],["Buntes Programm / Bit by bit","","Präsentation","","","","","Vorbereitete und geordnete Kärtchen (Programm / Infos eines Vortrags...) werden nach und nach umgedreht und angepinnt. Die einzelnen Programmschwerpunkte sind mit unterschiedlichen Farben gekennzeichnet.","Kärtchen, bunt, Pinnwand","FA","","","","",""],["Centering 1","","Konzentration","","","","","Die TN stehen die Füße hüftbreit und parallel zueinander im Kreis. Die Knie sind durchlässig, das heißt, nicht durchgedrückt sondern locker. Das Becken zieht schwer nach unten. Der Oberkörper ist aufgerichtet, die Arme hängen locker an den Seiten herab. Die TN schließen die Augen und spüren, wie sich ihre Füße mit dem Boden verwurzeln. Kein Wind kann sie mehr umwerfen. Nun stellen die TN sich vor, an ihrem Scheitelmittelpunkt ist ein unsichtbarer Faden befestigt, welcher den Kopf aufrichtet, d.h. den Nacken lang zieht. Die TN verlagern das Gewicht ihres Oberkörpers einen Millimeter nach vorn, nach ein paar Sekunden wieder in die Mitte zurück (Füße bleiben fest verwurzelt). Das Gleiche nach rechts, hinten und links. Wieder in der Mitte angekommen, geben sie mit der nächsten Ausatmung noch einmal alles Gewicht in den Boden ab. Kurz Nachspüren und in dieser Konzentration langsam die Augen öffnen.","","PL","Stehkreis","","","",""],["Centering 2","","Einstieg","","","","","Zum Thema des Seminares / Seminartages Fragen auf Kärtchen formulieren und in die Mitte legen.","","FA","Stehkreis / Sitzkreis","","","",""],["Checkliste / Kriterienkatalog","","UB","","","","","Gütekriterien für bestimmte Unterrichtsphasen / -schritte formulieren (z.B. “Welche Merkmale hat eine gelungene Hinführung zur Textarbeit?”), die nach der Unterrichtsbeobachtung zur Auswertung des gesehenen Unterrichts genutzt werden.","","GA --> PL","","","","",""],["Chef-Vize-Depp","","Konzentration","Aktivieren","","","spielerisch","Geht genauso wie das Engel-Telefon, aber die Rollen sind anders: Chef - Vize - 1, 2, 3.... der letzte rechts neben dem Chef ist der \"Depp\". Und neu ist die Regel, dass der Depp durch Klatschen und Schwätzen die anderen durcheinander bringen darf.","","PL","Sitzkreis","","","",""],["Clustern","","Ideen","","","","","Kärtchen ordnen, aus zusammengehörigen Kärtchen “Häufchen” bilden - alle müssen gut sichtbar sein. Cluster umranden (wenn die Kärtchen auf einem Packpapier angepinnt worden sind) und mit einem Oberbegriff kennzeichen (dazuschreiben oder eine Karte in einer anderen Farbe / Form dazupinnen).","Pinnwand, am besten mit Packpapier bespannt","PL","U","","","",""],["Cocktailparty / Klassenspaziergang","","Diskussion","DaF Sprechen","Üben","","","TN gehen herum und sprechen mit wechselnden Paaren (keine Grüppchenbildung zulassen!). Damit sie mit vielen in Gespräch kommen, Spielregeln einführen, wie z.B. „Nenne die 5 interessanten Aspekte deines Themas\". \"Stelle an deinen Partner eine Frage zu deinem Thema....“ oder \"Fasse kurz zusammen, was du von deinem Gesprächspartner erfahren hast.\"","je nach Inhalt: Kärtchen, AB","CP","freier Raum","","","",""],["Countdown-Bericht","","Präsentation","","","","","Die Gruppenberichte extrem limitieren (2-3 Minuten), während der Berichte läuft ein Countdown (div. Möglichkeiten im Internet), das für alle gut sichtbar projiziert wird.","online Countdown, Beamer","PL","U, Fächer","","","",""],["Das australische Schwebeholz","","Gruppendynamik","Problemlösung","","","","TN stehen im Spalier und strecken beide Zeigefinger aus (“Pistole”). KL legt einen langen Stab / Zollstock auf ihre Finger und drückt sie leicht nach unten und lässt ihn dann los. Die Aufgabe: den Stab auf den Boden zu legen. Die Aufgabe ist, den Stab auf den Boden zu legen, ohne dabei den Kontakt zum Stab zu verlieren. 1-2 TN aus der Gruppe beobachten, wie die TN reagieren (wie sie handeln und was sie sagen).","Bambusstab / Zollstock","max. 16 Personen (je nach Länge des Stabes)","","","","",""],["Aber ich!","","Kennen lernen","Aktivieren","DaF Sprechen","DaF HV","Spiel","Die TN stehen im Kreis. Ein L sagt: „Ich habe/bin noch nie ....!“ (meinen Arm gebrochen... Kaviar gegessen... Tretboot gefahren...). Jemand, der es schon gemacht hat (oder den Ball haben will  sagt: „Aber ich!“ - und der erste TN wirft ihm den Ball zu. (Vorher sagen, dass man nicht unbedingt die Wahrheit sagen muss...)","Ball","PL","Stehkreis","","","",""],["Das kleine süße Ding","","Aktivieren","Wahrnehmung","","","","Die TN stehen im Kreis. Der Spielleiter zieht einen imaginären Gegenstand aus der Tasche und zeigt den anderen, welches Gefühl dieser in ihm auslöst. Dann gibt er ihn im Kreis weiter - bei jedem verändert es sich und kann jedes mögliche Gefühl auslösen.","","PL","Stehkreis","","","",""],["Deckenschleuder","","Kooperation","","","","","Auf das Laken werden Luftballons verschiedener Größen gelegt. Die TN spannen das Leintuch zwischen sich aus und schleudern die Luftballons in die Höhe, indem sie an dem Lagen ziehen. Sie versuchen das Leintuch so zu bewegen, dass alle Luftballons durch das Loch fallen. Wenn sie damit fertig sind, können di Spieler dieses Spiel wiederholen und dabei selbst die Zeit abstoppen, um festzustellen, ob sich ihre Fähigkeit zusammenzuarbeiten verbessert hat.","1 großes Leintuch mit einem Loch in der Mitte (groß genug, um einen Luftballon durchfallen zu lassen), Luftballons in versch. Größen","PL","freier Raum / im Freien","","","",""],["Der heiße Stuhl 1","","Kontrolle","Wiederholung","DaF: WS","","","An der Pinnwand sind viele Wortkarten mit den wichtigsten / zuletzt behandelten Wörtern und Begriffen angepinnt. Ein TN aus der Gruppe setzt sich mit dem Rücken vor die Pinnwand, die anderen TN erklären Begriffe, der TN auf dem heißen Stuhl nennt die Wörter.  Auf Zeit spielen (wie viele Begriffe in angegebener Zeit?) und danach tauschen oder ein Limit setzen (wenn 5 oder 10 erreicht, Platz freigeben für andere).","Vokabelkartei oder Wortkarten","GA3","Die Pinnwand wird zur Gruppe hin umgedreht, so dass alle TN die Karten gut sehen, ein Stuhl mit dem Rücken zur Pinnwand.","","","",""],["Der schnelle Ball","","Kooperation","Problemlösung","Aktivieren","Gruppendynamik","","TN stehen im Kreis. Ein Ball muss herumgehen, er muss bei jedem TN 1x – und nur 1x! - gewesen sein. Ball darf allerdings fallen gelassen werden das gilt nicht als Fehler. Wenn die TN Fehler machen, müssen sie von vorne anfangen. Wenn die Runde erfolgreich absolviert ist, müssen sie es noch einmal, in der gleichen Reihenfolge tun, dann einfach immer schneller (Zeit nehmen!). Interessant: Auswertung über Strategien, Gruppenverhalten...","Ball, Stoppuhr","PL","Stehkreis, freier Raum / im Freien","","","",""],["Dialoggerüst / Dialogplan","","DaF Sprechen","DaF HV","","","","Gerüst enthält Schlüsselwörter / Piktogramme, TN rekonstruieren damit den Originaldialog - oder halten den Inhalt des neuen Dialogs in Stichworten fest","AB / Tafelskizze","PA","","angela_2.jpg","","",""],["Die angenehme Kritiktreppe","","Feedback","","","","","3x Lob / positive Aspekte nennen, 2x Kritik (mehrere kleine Kritikpunkte unter einen gemeinsamen Nenner bringen und als Beispiel nennen!), 1x Tipp / Veränderungsvorschlag formulieren","","","","","","",""],["Diskussion mit Rollen","","Diskussion","DaF Sprechen","","","","2 TN werden als Moderatoren hinausgeschickt; Rollen werden verteilt (Choleriker, Helfertyp, Angeber, Hektiker, Schwätzer, Nervensäge, Optimist, Nörgler, Dummkopf, Pedant…) – sie müssen nun ein Thema diskutieren. Die Moderatoren sagen am Ende, wie sie die TN in der Diskussion erlebt haben und versuchen die Rollen zu erraten.","Rollenkarten","PL","","","","",""],["Do-Dont-Allee","","Erfahrung","Feedback","","","","TN stehen in Paaren einander gegenüber und sagen abwechselnd positiv und negativ formulierte Regel (man soll / muss  bzw. Man darf nicht / man soll nicht).","","PL","Spalier","","","",""],["Drehen und wenden","","Erfahrung","Diskussion","DaF Sprechen","","","Thesen / Stichworte / Fragen auf buntes Papier, auf die Seiten von großen Kartons kleben. Die Kartons in der Mitte des Raumes stapeln.  Mögliche Verwendung: Ordnen, auswählen, Türme bauen, Prioritäten sichtbar machen...","Kartons, Papier","","","","","",""],["Drudel","","Aktivieren","DaF Sprechen","","","spielerisch","Objekte aus einer ungewohnten Perspektive skizzenhaft malen und raten lassen. Variante: Aus Bildern (z.B. Fotos von einzelnen TN) nur Ausschnitte zeigen und raten lassen, was / wer auf dem Foto zu sehen ist.","PPP","PL","","drudel.png","","",""],["Duett-Lesen","","Präsentation","","","","","Einen Text zeilenweise / satzweise halbieren, 2 TN lesen ihn als Duett vor.","Text","PL","","","","",""],["Durchzählen","","Gruppenbildung","","","","","TN zählen durch, bei 4 Gruppen z.B. bis 4: 1-2-3-4-1-2-3-4... usw. Alle, die die gleiche Zahl haben, versammeln sich nachher und bilden eine Gruppe.","","","","","","",""],["Eieruhr-Bombe","","Erfahrung","Üben","Transfer","DaF WS","","Bei diesem Spiel geht es um Zeit. Man benötigt hier nur eine Eieruhr und ein kleines Säckchen, worin die Uhr verstaut wird. Der Spielleiter stellt die Eieruhr auf 1 bis 2 Minuten ein und reicht sie schnell zum nächsten TN weiter. Das geht die ganze Zeit so, bis die Uhr zum Klingeln anfängt. Die Regeln kann man individuell gestalten. Entweder diese Person scheidet aus oder es geht wieder alles von vorne los. Umgekehrt geht es genauso. Explodiert die Bombe bei einem bestimmten TN, bekommt er einen Punkt.","Eieruhr","PL","Sitzkreis / Stehkreis","","","",""],["Ein-Wort-Resümee","","Feedback","","","","","Wie Blitzlicht, hier ist aber wirklich nur ein einziges Wort als Kommentar erlaubt.","","PL","Stehkreis / Sitzkreis","","","",""],["Eine Ente, zwei Beine...","","Aktivieren","Konzentration","","","spielerisch","Der folgende Spruch, der von der Spielleitung begonnen wird, wird reihum von den Teilnehmern sinngemäß weitergeführt: 1. \"Eine Ente...\" 2. \" zwei Beine\"... 3. \"springt ins Wasser...\" 4. \"Plitsch!\" 5. \"Zwei Enten...\" 6. \"vier Beine...\" 7. \"springen ins Wasser...\" 8. \"Plitsch...\" 9. \"Platsch!\" (2 Geräusche, weil zwei Enten ins Wasser springen) 10. \"Drei Enten...\" usw. So geht es reihum, bis es zu kompliziert wird. Wenn jemand zu lange überlegt oder sich verspricht, muss die Gruppe wieder alles von vorne beginnen. Ziel ist es, so viele Enten sicher ins Wasser zu lassen, wie viele TN es in der Gruppe gibt.","","","","","","",""],["Eine Person in Zahlen","","Kennen lernen","","","","spielerisch","Zu der eigenen Person mehrere Zahlen aufschreiben und auch mehrere Lösungsvorschläge angeben. Geeignet auch zur Vorstellung der SL (Gruppe rät, welche Zahl was bedeutet. - Variante: Zu der eigenen Person mehrere Zahlen aufschreiben und mit einer Wäscheklammer an der Kleidung festmachen.  Herumgehen (Cocktailparty): Die anderen raten lassen, wofür die Zahlen stehen (und am Ende auflösen)","DIN A4 Blatt","GA / PL","","","","",""],["Einer für alle","","Präsentation","","","","","Geeignet für größere Gruppen (GA mit über 3 Gruppen): Reihenfolge der Präsentation verlosen. 1. Der 1. GS pinnt die vorbereiteten Kärtchen der Gruppe (Stichworte) an die Pinnwand und kommentiert sie. 2. jeder weitere GS pinnt die Karten, die identische Aspekte ansprechen, kommentarlos neben die passenden Karten / oder drüber 3.  spricht dann ergänzend NUR über Aspekte, die die VorrednerInnen noch nicht erwähnt haben und pinnt die Karten an","Kärtchen, Pinwand","PL","","","","Gruppen nehmen ihre Ergebnisse mit aus GETEILTE NOTIZEN mit (copy) und die erste Gruppe kopiert sie zuerst in die GET NOT im Hauptraum (paste). Der \"Schreiber\" der nächsten Gruppen kopieren zwar alles, aber löschen alles, was gleich ist, und behalten nur neue Aspekte. Der Gruppensprecher kommentiert. (Wenn wichtig ist, dass wir wissen, welche Aspekte von wie vielen Gruppen genannt / vorgeschlagen wurden, kann der Schreiber hinter den Items, die auch bei ihnen auf der Liste waren, mit einem X markieren.)","Die Gruppen arbeiten auf Jamboard und posten auf ihrem Frame Post-its. Präsentation: alle besuchen das Frame der ersten Gruppe, die präsentiert (REIHENFOLGE nicht identisch mit den BOR-Nummern!), die nächste Gruppe kopiert neue Aspekte (Post-it nochmal anklicken, Text kopieren und neuen Post erstellen)."],["Fehlersuche","","Input","Kontrolle","DaF LV","","","In einem Material (Text / Bild / Gegenstand / Modell) nicht passende Teile identifizieren.","Text / BIlder / Gegenstand / Modell","EA / PA / GA","","","","",""],["Elfchen","","Kennen lernen","Aktivieren","Evaluation","DaF Schreiben","","Nach inhaltlichen Impulsen ein Gedicht aus 11 Zeilen schreiben. z.B. 1. Zeile = 1 Wort: Vorname, 2. Zeile = 2 Wörter (Adjektive): wie die Person ist, wie ich sie sehe, 3. Zeile = 3 Wörter: was die Person mag bzw. gut kann, 4. Zeile = 4 Wörter, meine Beziehung zu der Person / was sie besonders macht... usw., 5. Zeile = 1 Wort, ein virtuelles Geschenk an sie.","","EA --> PL","","","","",""],["Engel-Telefon","","Aktivieren","Konzentration","","","spielerisch","TN sitzen im Kreis und bekommen eine „Telefonnummer” zugeordnet: die ersten 4 bekommen die Namen von Engeln (Gabriel, Michael, Uriel, Refael), die anderen nach ihnen Zahlen, indem sie aufwärts zählen (1-2-3..).  Alle schlagen gleichzeitig im Rhythmus 1x auf die Oberschenkel 1x in die Hände klatschen 1x mit der rechten Hand über der rechten Schulter schnipsen 1x mit der der linken Hand über der linken Schulter schnipsen. Das Telefonieren beginnt: Gabriel nennt beim Schnipsen mit rechts die eigene Nummer, dann beim Schnipsen mit links die des Gesprächsteilnehmers. Der/die Angerufene ist der neue Anrufer und nennt somit die eigene Nummer und die des neuen TN.  Wenn jemand einen Fehler macht (nicht reagiert, zu spät reagiert...) beginnt wieder Gabriel, und der TN, der den Fehler gemacht hat, setzt sich auf den Stuhl mit der höchsten Nummer. Die anderen rücken auf, und bekommen dadurch die Nummer, die zum Stuhl gehört.","","PL","Sitzkreis","","","",""],["Entknoten","","Kooperation","Problemlösung","Gruppendynamik","","","In ein langes Seil so viele Knoten  machen, wie es Mitspieler gibt. Jeder TN hält das Seil mit beiden Händen zwischen zwei Knoten fest und die Gruppe muss alle Knoten lösen, ohne dass jemand das Seil auch nur kurz loslässt.","Seil","PL (oder zwei Halbgruppen)","im Freien","","","",""],["Entscheidung mit den Füßen","","Gruppenbildung","","","","","Brainstorming im Sitzkreis – TN nennen ihre Ideen, der KL sammelt sie auf Kärtchen und legt sie in die Mitte auf den Boden. Die TN clustern die Ideen und schreiben dazu auf Kärtchen in einer anderen Farbe Oberbegriffe. TN stellen sich dann zu dem Ideen-Bündel, das sie am meisten interessiert. ODER: Ausgewählte Themen auf Kärtchen schreiben / Bildsymbole auswählen und die Kärtchen gut sichtbar aufhängen oder auf den Boden legen. TN stellen sich zum Thema ihrer Wahl hin.","Kärtchen, Bilder","PL","Sitzkreis","","","",""],["Erinnerungskiste","","Evaluation","Gruppendynamik","","","","Die Gruppe stellt eine Art Erinnerungskiste zusammen, eine Sammlung von Gegenständen, die ihre speziellen Eigenschaften als Gruppe wiedergibt. Eine Person, die sich die Sammlung in zehn Jahren anschauen wird, in der Lage sein muss, festzustellen, wie die Gruppe war und was die Besonderheit dieser Gruppe ausmachte. Mögliche Gegenstände sind Photos, Arbeitsergebnisse, Gedichte über die Gruppe, Collage aus Bildern und Wörtern, die aus Zeitschriften ausgeschnitten worden sind oder irgendetwas, das die speziellen Interessen oder Aktivitäten der Gruppe symbolisiert","Karton","PL","","","","",""],["Erkenntniskarte","","Reflexion","","","","","TN schreiben Fragen, die sie beschäftigen und auf die sie eine Antwort suchen, auf eine Seite einer stabilen Karte. Während der Veranstaltung werden sie regelmäßig aufgefordert, die Karte zu überprügen und die wichtigsten Erkenntnisse auf der anderen Seite festzuhalten.","Kärtchen aus stabilem Karton","EA","","","","",""],["Erkundungsprojekt","","Input","","","","Projekt","TN erkunden einen Ort / eine Firma / eine Veranstaltung, erforschen vorher festgelegte Fragestellungen, sammeln “Beweismaterial” in Form von Fotos, Video- und Tonaufnahmen, konkreten Gegenständen, machen Notizen, die sie dann mit Plakaten / Rollenspielen / Vorträgen / Texten... präsentieren.","Kamera","GA","Außerschulische Lernorte","","","",""],["Jaaaaaaa bitte! Bitte nicht!","","Erwartung","","","","","Die Erwartungen an das Seminar (Das möchte ich hier... Das will ich auf keinen Fall... Damit kann ich dem Gelingen des Seminars beitragen)  sammeln und clustern. Im Seminar überprüfen: Welche Erwartungen sind erfüllt?","Großes Plakat in 3 Teile teilen. Pinnwand, Kärtchen, dicke Stifte","EA --> PL","","","","",""],["Es fliegt.. ein Klavier!","","Aktivieren","Wahrnehmung","DaF WS","","spielerisch","Ballspiel: Virtuelle Gegenstände herumwerfen – Gegenstand benennen, der Ball soll so geworfen und so gefangen werden, als wäre er dieser Gegenstand.","nichts","PL","Stehkreis","","","",""],["Es werde Licht!","","Aktivieren","Problemlösung","","","","Problem: Ein Haus hat 2 Stockwerke. Im Obergeschoss ist eine Glühbirne, die man mit einer Schalter im EG anmachen kann. Unten gibt es 3 Schalter. Man darf 2 Schalter probieren und 1x die Treppe hochgehen. Was müssen wir tun, um festzustellen, welcher Schalter zur Lampe passt?  Gruppe rät zusammen oder in Kleingruppen. (Lösung: 2 Schalter direkt nacheinander anmachen. Brennt das Licht, dann war es der zweite Schalter, ist die Glühbirne warm, dann ist es der erste, ist die Glühbirne kalt, so ist es der dritte Schalter.)","Bild","GA --> PL","","es_werde_licht.jpg","","",""],["Toaster-Mixer-Känguruh","Känguruhkotzer","Aktivieren","Konzentration","","","spielerisch","KL lässt beschreiben, welche Merkmale ein Elefant hat. Dann stellt er den Elefanten mit Hilfe der Nachbarn vor: Er (in der Mitte) deutet mit der ausgestreckten Hand den Rüssel an, die Nachbarn links und rechts wedeln mit den Ohren. Die TN überlegen in 3er-Gruppen, wie sie verschiedene Tiere darstellen können. TN stellen sich im Kreis auf. Der Spielleiter nennt einen Namen / zeigt auf jemanden  und nennt ein Tier: Die Person und ihre Nachbarn müssen schnell das Tier zeigen. Wer einen Fehler macht, übernimmt das Kommando, der Spielleiter übernimmt seinen Platz im Kreis. Wenn alles schon gut läuft, kann man weitere Tiere einführen.","","PL","","","http://www.praxis-jugendarbeit.de/spielesammlung/kotzendes-kaenguru-mixer-und-toaster-spiel.html","",""],["Essenzplakat","","Präsentation","Transfer","","","","Auf einem Plakat die wichtigsten Aspekte festhalten. Fortsetzung: Galerie oder Benchmarking oder Messe.","Packpapier","GA --> PL","","","","",""],["Euro-Song-Contest","","Auswertung","Feedback","","","","TN geben einzelnen Programmpunkten (oder Restaurants :-) Punkte wie im Euro-Song-Contest: 10, 7 und 5 Punkte für die ersten 3 ihrer Wahl.","Stimmzettel, Auswertungsplakat","EA --> PL","","","","",""],["Expertengruppen","","Gruppenbildung","","","","","TN tragen sich zu angegebenen Themen ein, zu denen sie die meisten Ideen / Erfahrungen einbringen können.","Listen","EA","","","","",""],["Fächer / Streifenblume","","Präsentation","","","","","Die vorbereiteten AB / Material / Streifen liegen verdeckt in der Mitte des Raumes / werden an der Pinnwand angebracht als Fächer / Blume, wenn die TN in den Raum gehen. Die TN nehmen ein AB.","AB / Kärtchen","PL","freie Fläche auf dem Boden in der Mitte","","","",""],["Partnerschnur / Faden ziehen","","Paare bilden","Gruppenbildung","","","","Fadenbündel in der Mitte lose festhalten. TN greifen das Ende eines Fadens und suchen den Partner, mit dem sie “verbunden” sind.","Lange Fäden schneiden (Anzahl der Hälfte der TN-Zahl) entsprechend.","PL --> PA","","","","",""],["Fahrplan","","Aktivieren","Konzentration","","","","\"Die S1 fährt nach Schwäbisch Hall.\" ... \"Die S1 fährt nach Schwäbisch Hall, die S2 fährt nach Ludwigsburg.\" ... \"Die S1 fährt nach Schwäbisch Hall, die S2 fährt nach Ludwigsburg und die S3 fährt nach Göttingen.\"","nichts","PL","Sitzkreis","","","",""],["Fahrradkette","","Üben","","","","Selbstkontrolle","Kurze Aufgaben einzeln auf Zettel schreiben und Zettel nummerieren und mit den Zetteln einen langen Tisch “decken”: TN sitzen an beiden Seiten des Tisches. Jede/r / jedes Paar bekommt einen Zettel, bearbeitet die Aufgabe (kontrolliert sich mit der Rückseite) und gibt die Aufgabe weiter. Richtung angeben! Mehr Zettel vorbereiten als TN, um Stau zu vermeiden.","Aufgaben auf Zetteln / Streifen","EA","langer Tisch in der Mitte, auf beiden Seiten Stühle (wenn Aufgabe länger)","","","",""],["Familie Bühler-Pieler...","","Gruppenbildung","DaF Phonetik","","","","TN sagen laut den Namen, der auf ihrer Visitenkarte steht und versuchen ihre \"Familie\" zu finden. (Auch Phonetikübung für DaF.)","Visitenkarten (z.B. Horst Bühler, Greta Bühler, Wolfgang Bühler, Margret Bühler... / Johann Pieler.... usw.). Witzig, wenn es \"echt\" aussieht. Laminieren!","CP","freier Raum","","","",""],["Familie Lehmann","","Gruppenbildung","Aktivieren","","","Bewegung","TN bekommen je eine Karte, die sie sich aber nicht anschauen können. Solange Musik läuft,  tauschen  die TN die Visitenkarten untereinander aus. Wenn die Musik stoppt, schauen sie sich die Karte in ihrer Hand an und rennen “nach Hause” zum Stuhl, und setzen sich auf den Stuhl: Unten der Vater, dann die Mutter, dann das Kind und oben der Hund. 4-5 Runden machen – dabei darauf achten, dass die Gruppen gut durchgemischt sind! (Variante: Sich als Reihe hinter dem Stuhl aufstellen.)","Visitenkarten vorbereiten: So viele “Familien”, wie viele Gruppen wir haben wollen mit so vielen Mitgliedern, wie TN in einer Gruppe sein sollten (z.B. Vater Lehmann, Mutter Lehmann, Kind Lehmann, Hund Lehmann). Für jede Familie auch einen Stuhl mit Namensschild vorbereiten. Lebhafte Musik.","CP","freier Raum","familie_lehmann.jpg","","",""],["Feedback mit Gesprächskarten","","Feedback","","","","","Zur Vorbereitung des kollegialen Feedbacks Karten mit möglichen Gesprächsthemen schreiben. Die Beobachtete wählt aus, wozu sie ein Feedback möchte bzw. In welcher Reihenfolge die Karten besprochen werden sollen.","Fedbackkarten","PA / GA","","","","",""],["Feedback schneiden und knicken","","Feedback","","","","","Erwartungskarten nach einer Zeit bearbeiten: knicken: “hat sich erledigt”, oder halbieren / vierteln / Stück abschneiden","Erwartungskarten an der Pinnwand, Scheren","EA --> PL","","","","",""],["Feuer, Wasser, Blitz","","Aktivieren","Konzentration","","","","Die Spieler bewegen sich frei durch den Raum (evtl. bei Musik). Der Spielleiter ruft plötzlich ein Kommando:  Feuer (die Spieler müssen zu einer Tür oder zu einem Fenster laufen, um sich zu retten) Wasser ( die Spieler müssen auf etwas hochsteigen, damit sie keine nassen Füße kriegen) Blitz (alle legen sich flach auf dem Boden, um nicht vom Blitzschlag getroffen zu werden) Jeweils die letzte Person, die das Kommando befolgt, scheidet aus und darf das nächste Kommando rufen. Die letzte Person gewinnt das Spiel.","nichts","PL","freier Raum","","","",""],["Fehlerversteigerung","","Wiederholung","Fehlerkorrektur","","","spielerisch","Fehlerhafte Sätze in einer Liste präsentieren. TN korrigieren die Sätze in Gruppen. Danach werden die Sätze versteigert: Jede Gruppe bekommt ein virtuelles Konto, die Sätze werden einzeln angeboten, die Gruppen steigern mit. Wird der Satz gekauft (gebotene Summe vom Konto abziehen!), muss die Gruppe den Satz reparieren. Bei korrekter Lösung bekommt die Gruppe 100 Euro. Sieger ist die Gruppe, die das meiste Geld hat.","Auktionskarte, Kontoauszug","PA / GA","","","","",""],["Festgetackert","","Kooperation","Problemlösung","","","","Ziel des Spieles ist es ein Gruppenmitglied so an die Wand zu kleben, dass die Person nicht mehr den Boden berührt. Am besten geht es auf einer Kunststoffoberfläche! Zu Beginn der Aktivität stehen die Holzklötze noch als Hilfsmittel zur Verfügung. Nach Befestigung der Person an der Wand sollen die Klötze allerdings unter ihr entfernt werden, um zu sehen, ob das Ankleben auch wirklich funktioniert hat. Die Person soll dann mindestens 5 Sekunden an der Wand kleben, ohne den Fußboden zu berühren. Bevor die Klötze unter den Füßen weggezogen werden MUSS der Spielleiter prüfen, ob die Verbindungen halten, ansonsten Verletzungsgefahr!","1 Rolle Paketklebeband, 2 Holzklötze und mehrere Scheren.","GA","","","","",""],["Finde etwas...","","Kooperation","Wahrnehmung","","","","Im Grünen Gegenstände suchen, auf die die Suchmerkmale zutreffen. (Etwas rundes, glänzendes, hartes, kantiges, unpassendes...) Möglich als Gruppenwettbewerb: Wer findet die meisten Gegenstände in der angegebenen Zeit?","AB","GA","im Freien","","","",""],["Finde jemanden","","Kennen lernen","Einstieg","Aktivieren","DaF Sprechen","","TN bekommen ein AB mit 16-25 Fragen / Stichworten (vgl. Anhang). Sie laufen herum, befragen immer einen TN, und wenn er/sie eine Frage mit JA beantwortet, notieren ihren/seinen Namen zur Frage und sie müssen einen neuen Gesprächspartner suchen. Sie können später nochmal zu TN zurückkommen, die sie schon einmal befragt haben. Ziel ist in möglichst jedem Kasten EINEN Namen zu haben. Auswertung: Was war leicht / schwer zu finden? Wer hat doch jemanden gefunden zu den \"schweren\" Fragen?","AB","CP","freier Raum","finde_jn.jpg","","TREMBER nutzen für die Aufgabe (parallel zu BBB, in einem neuen Fenster). In BBB dann Mikro stummschalten, um Rückkopplung zu vermeiden.",""],["Finde jemanden Bingo","","Kennen lernen","Einstieg","DaF Sprechen","","","s. Finde jemanden, plus die TN sollen waagerecht / senkrecht / diagonal 5 Felder ausgefüllt haben, und dann Bingo rufen.","AB","CP","freier Raum","End-of-the-Year-Bingo.jpg","","",""],["Flaschen drehen 1","","Gruppenbildung","","","","","Wenn die Entscheidung für ein Thema schwierig sein könnte (z.B. es gibt einige begehrte und einige weniger beliebte Themen). TN drehen die Flasche, wählen darf die Person, auf die der Flaschenhals zeigt.","Flasche (schwere !)","PL","freie Fläche auf dem Boden in der Mitte","","","",""],["Flaschenpost","","Evaluation","Reflexion","","","","Eine abgeschlossene Arbeitsphase schriftlich reflektieren, Papier wie für eine Flaschenpost zusammenrollen. Auswertung: A) Texte hinlegen – jeder TN “fischt” eine Flaschenpost aus und liest sie. B) Text einer “Vertrauensperson\"","Papierstreifen","EA --> PL","","","","",""],["Fleischmagnet","","Wahrnehmung","","","","","Eine Hand ballen und mit ihr das eigene Gesicht abfahren: Die Gesichtsmuskel trainieren, im dem man sich vorstellt, dass die Hand wie ein Magnet die Teile des Gesichts an sich zieht, in dessen Nähe sie kommt.","","PL","Stehkreis","","","",""],["Fliegende Eier","","Kooperation","Vertrauen","","","","Die Gruppe schreibt ein Gruppenmotto / die Essenz der vorangegangenen Phase auf ein Ei, das vorsichtig in der Gruppe herumgeworfen wird. Ziel ist, das Ei lange unversehrt im Umlauf zu halten.","Pro Gruppe 1 rohes Ei","GA","am besten im Freien :-)","","","",""],["Fließgleichgewicht","","Gruppendynamik","Konzentration","Wahrnehmung","","","Die TN suchen sich zwei TN in der Gruppe aus, sagen aber niemandem, wer diese zwei sind. Auf ein Kommando bewegen sich alle TN im Raum so, dass sie versuchen, mit diesen zwei TN ein gleichseitiges Dreieck zu bilden.  Auswertung. Wer glaubt zu wissen, wer sich mit ihnen zusammen bewegt hat?","","PL","freier Raum","","","",""],["Floß wenden","","Kooperation","Problemlösung","Gruppendynamik","","","Die Gruppe bekommt die Aufgabe, eine Decke/Plane, auf der sie stehen, umzudrehen. Die Decke symbolisiert ein Rettungsboot, das leider falschrum auf dem Meer treibt und somit keinen ausreichenden Schutz vor dem Ertrinken bietet. In der Planungsphase überlegen sie sich eine Strategie, wie sie das Problem lösen wollen. Hat sich die Gruppe auf eine Vorgehensweise geeinigt, stellen sie sich auf die Decke und dürfen sie ab jetzt nicht mehr verlassen. Berührt irgendein Körperteil den Boden außerhalb der Decke, wird ein Handicap eingebaut (z. B. einer wird blind, bekommt die Arme zusammengebunden...)","Decke / Plane","PL","freier Raum","","","",""],["Fokuskarten","","UB","","","","","Beobachtungsfokus auf Spielkarten formuliert – Beispiele s. hier: (http://www.beltz.de/de/paedagogik/themen/titel/konstruktives-feedback.html. Jeder TN in der Gruppe zieht eine Karte zu einem gemeinsamen Aspekt (Organisation / Körpersprache / Kommunikation...) und sammelt zu dem Beobachtungsfokus Belege bei der Hospitation.","spezielle Spielkarten","EA","","","","",""],["Fotoquiz","","Kooperation","Gruppendynamik","Kennen lernen","","","Interessante Details des Seminarortes, die auf Fotos präsentiert werden, in einer angegebenen Zeit finden. (Am besten als Gesamtgruppe).","Fotos","PL","","","","",""],["Fotostrecke","","Präsentation","","","","","Erkundung durch Fotos dokumentieren, diese Nummerieren und als Slide abspielen und dabei kommentieren. (Keine Power Point, also keine integrierten Wort-Kommentare).","Fotos in einem Ordner","PL","","","","",""],["Frage-Antwort-Kärtchen","","Input","DaF LV","","","","Interviews in Fragen und Antworten zerschneiden, jeder TN bekommt einen Streifen, muss den Partner finden und die wichtigsten Aspekte im Textteil markieren und den anderen vorstellen.","Textstreifen","EA --> PA --> PL","freier Raum","","","",""],["Frage-Stationen","","Kontrolle","Transfer","Wiederholung","","","Auf dem Boden / an der Wand / auf den Stühlen Fragekarten / Wortkarten auslegen. TN gehen herum und markieren alle Fragen, die sie beantworten können bzw. die Wörter, die sie verstehen und erklären können. Am Ende die Karten einsammeln und zuerst die Karten mit den meisten Markierungen besprechen.","Kärtchen","EA --> PL","Stuhlkreis, von innen begehbar","","","",""],["Fragebleistifte","","Transfer","","","","","Während eines Vortrags Fragen / Ideen auf vorbereitete Streifen schreiben. Am Ende eine Auswahl treffen, was man fragen will und die Streifen vorlesen, bzw. die Streifen nach vorne reichen und der Vortragende entscheidet, auf welche Fragen er eingehen möchte.","leere Streifen","FA","","","","",""],["Freibad","","Reflexion","Evaluation","","","","Wo stehe ich im Moment in Bezug auf das Seminarthema? TN positionieren sich in einem Freibad-Grundriss (Freischwimmer – Nichtschwimmer – Sprungturm – Dusche – Umkleidekabinen – Liegewiese – Erfrischungen – Zuschauertribüne... etc.) und kommentieren ihre Entscheidung.","Tesakrepp, Kärtchen","PL","freie Fläche auf dem Boden in der Mitte","","","",""],["Galeriegang","","Präsentation","","","","","TN gehen herum und informieren sich durch die Plakate / Bilder der anderen TN / Gruppen, kombinierbar mit Fragekarten / Kommentarklebern. (S. Anhang: Verstehe ich nicht / finde ich richtig gut / damit bin ich nicht einverstanden - und Kommentare auf seperaten Kärtchen)","evtl. Pinnwand","GA  PL","","e5072f5d13dd77fb0c309e23a1cc4873.jpg","","",""],["Gang-Arten","","Wahrnehmung","","","","","Durch den Raum gehen, Körper spüren, wie geht es mir, wo fühlt sich etwa gut / schlecht an, wo tut etwas weh, wo ist es warm / kalt (ohne zu bewerten) &#8722; neutraler Gang: wach (Bühnenspannung), aufrecht, Arme locker runterhängend, Blick offen (unfokusiert), &#8722; Freeze: bei Klatschen einfrieren, Körperspannung halten &#8722; spüren, wie berühren meine Füße den Boden, wie gehe ich, was würden meine Füße für einen Abdruck im Sand hinterlassen &#8722; Füße nach innen drehen, Füße nach außen drehen, (dazwischen immer abschütteln, Ausgleichsbewegungen machen und einige Schritte normal gehen, bei jeder Haltung Impulsen nachgehen und vergleichen, was sich verändert, wie sich die anderen Körperteile in der Haltung verändern, die Stimmung, das Tempo, der Blick etc.), auf den Fuß-Außenkanten gehen, auf den Fuß-Innenkanten gehen, auf den Hacken gehen, auf den Fußballen gehen &#8722; Becken nach vorn kippen und nach hinten kippen (Entenarsch) &#8722; Brustkorb so weit wie möglich nach vorn und nach hinten &#8722; Schultern hochziehen+Arme steif, Schultern locker+Arme locker &#8722; Kopf vor und zurück","","PL","freier Raum","","","",""],["Geburtstags-, Hausnummernschlange","","Gruppenbildung","","","","","TN stellen sich – ohne miteinaner zu sprechen – nach ihrem Geburtstagsdatum / nach ihrer Hausnummer in eine Schlange, die Schlange wird zerhackt (je nach gewünschter Gruppengröße).","","PL","freier Raum","","","",""],["Gefühlsstatuen bauen","","Wahrnehmung","","","","","Die Gruppe teilt sich in Paare auf: einer ist der Statuenbauer, der Andere wird zum „Material“. Das „Material“ schließt nun die Augen und wird vom Statuenbauer vorbereitet, indem er es durch energisches Ausstreichen von oben nach unten „abstaubt“, überall sanft mit der hohlen Hand ausklopft (Achtung: nicht direkt auf der Wirbelsäule) und abschließend mit leichtem Druck weich knetet. Danach kann der Statuenbauer durch Bewegen der Körperteile eine beliebige Statue formen - d.h. das „Material“ bleibt in der jeweiligen Position stehen. Hierfür ist es empfehlenswert, dass der Statuenbauer sich für eine Emotion entscheidet, die er darstellen möchte. Dies darf nciht mit der Statue abgesprochen werden. Wichtig ist, dass hierbei nicht gesprochen und auf vorsichtigen Umgang miteinander geachtet wird. Am Ende werden die Augen des „Materials“ durch eine sanfte Berührung des Augenlides geöffnet und die Blickrichtung im Raum angezeigt. Nun werden alle Statuen der entstandenen Galerie gemeinsam betrachtet und besprochen, was in jeder Einzelnen gesehen wird. Auf Antippen des Spielleiters erwacht eine einzelne Statue oder mehrere für kurze Zeit zum Leben. Erst nachdem jeder (die Außenstehenden sowie die Statue) seinen Eindruck äußern durfte, sagt der Statuenbauer, was er damit ausdrücken wollte. Ist eine Statue fertig besprochen, darf sie die Position auflösen und die weiteren Statuen mit betrachten.","","PA --> PL","freier Raum","","","",""],["Energiepegel-Anzeige","","Feedback","","","","","Die SL gibt vor, welche räumliche Höhe den Maximalpegel darstelle (z. B. Gürtelhöhe, Brusthöhe, Scheitel oder so). Der Boden bedeutet keine Energie. Dann zeigen alle gleichzeitig mit der Hand, wie viel Energie sie im Moment noch haben.","nichts","PL","Stehkreis","","","",""],["Gespräche belauschen","","Einstieg","Erfahrung","DaF Sprechen","Wahrnehmung","","Bilder an die Tafel pinnen / für alle gut sichtbar auslegen. Die L arbeiten mit einem Partner, enigen sich still auf ein Bild und besprechen, worüber die beiden sprechen können. Dann sprechen alle Paare im PL und die anderen raten, welches Bild sie als Vorlage ausgewählt haben.","6-10 Bilder, auf denen zwei Personen abgebildet sind, die miteinander sprechen","PA --> PL","","","","",""],["Gesprächskarten","","Kennen lernen","Erfahrung","DaF Sprechen","","","TN ziehen Karten mit Thesen / Fragen. Sie gehen herum und stellen einer anderen TN die Frage und antworten schließlich auch selbst. Dann die Frage der anderen TN besprechen – und am Ende die Karten austauschen und mit der neuen Karte eine andere TN befragen.","Gesprächskarten, etwa doppelt so viele wie TN","CP","freier Raum","","","",""],["Gesucht und gefunden","","Gruppenbildung","","","","","Jeder Spieler nimmt sich aus dem Vorrat (am Besten aus einer verschlossenen Kiste) einen Gegenstand. dabei handelt es sich immer um zusammengehörige Paare (bzw. \"Sets\"): Bsp. - Bleistift und Radiergummi (2er Team) - Feuerzeug und Kerze (2er Team) - Gabel, Messer, Löffel (3er Team) - Faden, Nadel, Socke mit Löchern (3er Team) - 5 Cent, 10 Cent, 1 Euro, 2 Euro - Geldstücke (4er Team) - Tuschkastenfarben, Pinsel, Wasserglas (diverse Varianten)... Wenn jeder einen Gegenstand hat, laufen alle im Raum herum und suchen ihre Gruppen, dabei kann durchaus auch etwas Kreatives herauskommen","kleine Gegenstände","CP","freier Raum","","","",""],["Geteilte Sprüche","","Gruppenbildung","Einstieg","DaF Phonetik","","","Sprüche, Sprichwörter,  kurze interessante Infos, Zitate, die zum Thema passen… in zwei Hälften schneiden, TN merken ihren Text, gehen herum, sagen, was auf ihrer Karte stand  und versuchen ihren Partner zu finden.","Kärtchen (evtl. laminieren)","CP","","","","",""],["Gordischer Knoten","","Kooperation","Gruppendynamik","Problemlösung","Aktivieren","","TN stehen im Kreis, eng, Schulter an Schulter, greifen zunächst mit der rechten Hand in die Mitte und fassen eine Hand an (nicht die der NachbarIn!), dann mit der Linken. Ziel: Knoten entwirren, ohne die Hände loszulassen.","nichts","PL","freier Raum","","","",""],["Grafik deuten","","Einstieg","","","","","Eine Grafik / Schaubild, die offen ist und mehrere Deutungsmöglichkeiten zulässt, gemeinsam deuten.","Grafik / Schaubild, Beamer","PL","","","","",""],["Grashalm im Wind","","Kooperation","Gruppendynamik","Vertrauen","","","Die Schüler finden sich zu Gruppen von etwa zehn Personen zusammen und bilden einen engen Kreis. Ein Freiwilliger stellt sich in die Mitte, verschränkt seine Arme, schließt die Augen und lässt sich mit steifem Körper in die Arme seiner Mitschüler fallen, die ihn sachte und vorsichtig herumreichen. Jeder soll hierbei die Chance erhalten, einmal in der Mitte zu stehen","","GA10","freier Raum","","","",""],["Gruppenbild malen","","Kooperation","Gruppendynamik","Feedback","","","Gemeinsam in der Gruppe ein Bild malen, das die Gefühle in der Gruppe / den gemeinsamen Arbeitsprozess / die Ziele der Gruppe darstellt. Bilder werden kommentarlos aufgehängt und zuerst von den anderen TN gedeutet. Zum Schluss erklären die Künstler ihr Werk.","Packpapier, Buntstifte, Fingermalfarbe, Wachsmalkreide...","GA --> PL","","","","",""],["Spezialkärtchen","","Gruppenbildung","","","","","Passend zum Thema der darauf folgenden Gruppenarbeit spezielle Karten anfertigen, die zwei Aspekte aufweisen (damit sie leicht für die Bildung von Mix- und Wirbelgruppen geeignet sind), z.B. 1 / 2 / 3 kg Bananen / Äpfel / Melonen / Trauben...","Kärtchen","PL","","","","",""],["Gruppenpuzzle","","Input","Kooperation","DaF LV","","","Experten erarbeiten in EA verschiedene neue Aspekte eines Inhalts. Die Experten beraten sich zuerst, dann bilden wir Mixgruppen, in denen jedes Thema durch einen Experten vertreten ist. Die Experten bringen den anderen ihr Thema bei. Danach schreibt jeder TN einen Test. Ergebnis auswerten mit Lösungsschlüssen, danach ermitteln, welcher Experte der beste “Beibringer” war und besprechen, woran das lag.","2 Tests","GA","","","","2x Breakouträume, am einfachsten so gebildet, dass die TN sich in einer Tabelle eintragen: 1. Runde: die TN gehen in eine Gruppe, die in der gleichen SPALTE sind ,2. Runde: ZEILEN","TN zählen in der 1. Gruppe durch, nennen sich um - in der 2. Runde kommen alle mit der gleichen Nr. in die Gruppen."],["Gruppenpuzzle mit Test","","Input","Kooperation","DaF LV","","","Experten erarbeiten in EA verschiedene neue Aspekte eines Inhalts. Die Experten beraten sich zuerst, dann bilden wir Mixgruppen, in denen jedes Thema durch einen Experten vertreten ist. Die Experten bringen den anderen ihr Thema bei. Danach schreibt jeder TN einen Test. Ergebnis auswerten mit Lösungsschlüssen, danach ermitteln, welcher Experte der beste “Beibringer” war und besprechen, woran das lag.","1 Test","GA","","","","",""],["Gruppenrallye","","Wiederholung","Input","Kooperation","","","Die TN lösen zuerst allein einen Test, ermitteln mit einem Lösungsschlüssel das Ergebnis.  Sie finden sich dann zu Zufallsgruppen zusammen, addieren ihre Punktzahl und besprechen das Ergebnis, erklären einander die Lösungen, helfen, Lücken zu schließen.  Danach lösen alle Teammitglieder einen ähnlich schwierigen Test (individuell oder als Gruppentest) zu ähnlichen Testzielen. Ziel: Als Gruppe (und auch als Einzelner) die Ergebnisse der Vorrunde zu verbessern.  Möglich: Kombination mit einer Lernphase (Z.B. In Form von Stationen). Die TN treffen Vereinbarungen, wer was im Interesse der Gruppe erarbeitet, dann finden sie sich wieder  in der Gruppe zusammen und geben einander die neuen Kenntnisse weiter.","2 Tests","GA","","","","",""],["Gruppenspiegel malen","","UB","","","","","Notizen machen zu der Lerngruppe (Gruppe malen / Tabelle mit Namen): Personen, Interaktion, Bewegungen...","","EA","","","","",""],["Gruppenspiegel","Klassenstatistik","Kennen lernen","Erfahrung","","","","Die TN notieren auf Kärtchen Infos zu ihrer Person (Name, Land / Ort, Schultyp, was ich mag, was ich gut kann...). Die TN können auch selbst Aspekte vorschlagen. Jeder stellt sich vor und klebt seine Kärtchen in eine vorbereitete Tabelle auf einem großen Packpapier. Kann hinterher mit einem Foto ergänzt werden.","Kärtchen in unterschiedlichen Farben, Packpapier","EA --> PL","","gruppenspiegel.jpg","","Jamboard, Miro, Conceptboard",""],["Gruppensprecher durch Zufall","","Präsentation","","","","","Bei jeder Gruppe ein anderes Kriterium nennen, wer aus der Gruppe präsentieren soll (die jüngste, die älteste, die einen schwarzen Kulli hat...). Kriterium erst unmittelbar vor der Präsentation nennen. Daduch können wir bisher weniger aktive TN einbeziehen oder „Vielredner“ abbremsen :-) (Variante: Diese vorher schon auf Kärtchen schreiben und einzeln aufdecken).","","PL","","","","Gruppensprecher aktiviert seine KAMERA, während er spricht",""],["Gruppenstandbild bauen","","Feedback","Gruppendynamik","Evaluation","","","Gemeinsam in der Gruppe ein Standbild / Denkmal bauen, das die Gefühle in der Gruppe / den gemeinsamen Arbeitsprozess / die Ziele der Gruppe darstellt. (SL bleibt während der Besprechung und Ideensammlung draußen.) Das Standbild wird zuerst von der SL  interpretiert – Künstler ergänzen dann die Interpretation.","nichts","GA / PL","","","","",""],["Gruppensteckbrief","","Kooperation","Gruppendynamik","Kennen lernen","","","Nach einigen Tagen im Seminar den Steckbrief (mit den gleichen Items, wie beim Kennenlernen) als Gruppe ausfüllen. Funktioniert auch als Kennenlernaufgabe bei einem neuen KL / SL.","leerer Steckbrief auf Flipchartbogen (oder noch größer)","PL","","","","",""],["Gummibärchenpyramide","","Kooperation","Problemlösung","Konzentration","","","Die TN sollen eine Pyramide aus Gummibären bauen (5, 4, 3, 2, 1). Jede Reihe soll eine andere Farbe haben (gelb, grün, rot, orange, weiß). Die Gummibären liegen in der Mitte auf einem Haufen. Die Gruppen stehen in 5 Meter Abstand in einem Kreis um den Gummibärenhaufen. Jeder Gruppe hat einen Bierdeckelauf dem Boden vor sich liegen, auf Start darf der erste Spieler den Bierdeckel nehmen, und damit versuchen, Gummibärchen für die erste Reihe mitzunehmen und zurückgekehrt mit Hilfe des Bierdeckels aufzustellen. Dann ist der nächste Spieler dran, um die nächsten passenden Gummibärchen zu holen... Fällt ein Gummibärchen runter, darf es nur mit dem Bierdeckel wieder eingebaut werden. Gewonnen hat die Gruppe, die zuerst eine Pyramide baut, die min. 1 Minute lang stehen bleibt.","min.2 Packung Gummibärchen","GA","","","","",""],["Hans, Roland, Gerti, Rosi","","Aktivieren","Wahrnehmung","DaF GR","","","SL stellt die Gegenstände vor und stellt danach Fragen, wer wer ist. Die TN identifizieren die Personen und erklären, warum sie sicher sind, dass es sich dabei um die Person handelt.","4 Gegenstände, die sich in Form und Größe unterscheiden (z.B. Blätter, Kartoffeln, Tomaten...)","PL","Tisch in der Mitte oder freie Fläche auf dem Boden","","","",""],["Haus-Baum-Hund","","Kooperation","Wahrnehmung","","","","Zu zweit nach Instruktionen ein Bild malen: Ein Haus, einen Hund, einen Baum..., indem beide den Stift festhalten und dabei nicht miteinander reden. Am Ende das Bild signieren und dem Bild einen Titel geben. (Auswertung: Wer hat geführt? Wie wurde diese Aufgabenteilung gemacht? Gab es Wechsel? Wie habt ihr euch durchgesetzt bzw. miteinander kommuniziert?...)","Papier, ein dicker Stift","PA, GA3-4","","Tag_12_Hausbaumhund_von_Team_cool.jpg","","",""],["Haussammlung","","Kooperation","","","","","TN formulieren auf Kärtchen, was sie zum Gelingen des Seminars beitragen können. (Wer bringt was mit?)","Kärtchen, Pinnwand","EA --> PL","","","","",""],["Hey, du!","","Wahrnehmung","Kommunikation","Körpersprache","Aktivieren","","Die TN stehen im Kreis und der Spielleiter beginnt einen Spieler anzusprechen mit folgendem Dialog: A: Hey Du! B: Wer, ich? A: Ja, Du? B: Nein! - Du! C: Wer, ich? B: Ja, Du! C: Nein! - Du! D: Wer, ich? Etc. Wer nicht an der Reihe ist, steht in einer neutralen Haltung. Wird man angesprochen, nimmt man eine Haltung zum Gegenüber ein, z.Bsp. wütend, freudig, ängstlich etc. Diese äußert sich sowohl körperlich als auch in der Sprechweise","","PL","Stehkreis","","","",""],["Hi-yaa! / Schrei der Samurai","Hu-Hu-Ha!","Aktivieren","","","","","TN stehen im Kreis. Ein Spieler greift mit einem imaginären Samuraischwert einen anderen Mitspieler an mit lautem “Hi-yaa!”-Ruf. Der Angegriffene verteidigt sich mit dem gleichen Ruf, und hebt einen Schwert über seinem Kopf – seine Nachbarn links und rechts schreien auch, “zücken” ihre Schwerter und zeigen mit ihnen vor dem Körper des 2. Mitspielers.","","PL","Stehkreis","","","",""],["Hinter der Pinnwand","","Kontrolle","Wiederholung","DaF WS","","Rätsel","An der Pinnwand sind Wortkarten mit den wichtigsten / zuletzt behandelten Wörtern /  angepinnt. Die Pinnwand wird umgedreht, so dass die TN die Karten nicht sehen. Ein TN geht hinter die Pinnwand, erklärt einen Begriff, die anderen raten.","Vokabelkartei oder Wortkarten, Pinnwand","PL","","","","",""],["Hirte und Herde","","Kooperation","Problemlösung","Wahrnehmung","","","Aus der Gruppe (ca. 8 bis 30 TN) wird ein Hirte ausgewählt. Die übrigen TN sind Schafe. Die gemeinsame Aufgabe der Gruppe ist, dass sich am Ende alle Schafe im Stall befinden. Hierfür müssen Hirte und Schafe zusammenarbeiten. Der Hirte soll die Schafe durch Zurufe in den Stall bringen. Allerdings haben die Schafe die Augen verbunden und der Hirte darf nur 4 verschiedene Wörter benutzen um sich zu verständigen, bzw. die Schafe zu leiten. Die Gruppe bekommt am Anfang des Spieles mind. 3 min. Zeit sich auf vier Wörter oder Befehle zu einigen. Der Hirte hat begrenzten Bewegungsraum, der sich nicht in der Nähe des Stalles befindet (sonst könnten die Schafe einfach seiner Stimme folgen). Der Eingang des Stalles wird erst dann vom Spielleiter bestimmt, wenn alle Schafe die Augen verbunden haben.  Für das Spiel wird ausreichend Platz ben","Augenbinden","PL","freier Raum","","","",""],["Hoch- und Niedrigstatus","","Wahrnehmung,","Körpersprache","","","","Nun stellt sich die Gruppe in zwei Reihen gegenüber, so dass sich die TN anschauen und jeder TN einen Partner hat. Eine Seite nimmt nun eine Körperhaltung für den Hochstatus, die andere Seite den Tiefstatus ein. Nacheinander tauschen die Paare ihre Plätze, so dass sie sich auf dem Weg in irgendeiner Art und Weise (jedoch ohne Sprache) begegnen. Der Rest der Gruppe beobachtet, was passiert und wie unterschiedlich der Status dargestellt wird. Wenn jedes Paar seinen Platz getauscht hat, nehmen diejenigen die vorher den Hochstatus hatten, den Tiefstatus ein und umgekehrt und begegnen sich erneut. In einer kurzen Reflexion Merkmale sammeln, wie sich der Status körperlich geäußert hat. Status auf einer Skala von 1 - 10: zehn gilt als höchster Hochstatus, eins als niedrigster Tiefstatus. Alles was sich unter fünf bewegt tendiert zum Tiefstatus, darüber eher zum Hochstatus. Nun bilden sich ebenfalls zwei Reihen, so dass jeder ein Gegenüber hat. Jeder TN sucht sich ohne Absprache eine Statuszahl aus, in der er seinem Partner begegnet. Es ist dementsprechend auch möglich, dass beide TN den selben Status haben. Die Gruppe sollte nach jedem Paar kurz diskutieren, wer welchen Status hatte und wie sich dieser äußerte. Dann wird die Zahl verraten.","","PL","freier Raum","","","",""],["Hot spots","","Diskussion","","","","","In Kleingruppen die heißesten Diskussionspunkte sammeln und auf rote Karten schreiben. Sie kommen in eine spezielle Ecke und werden nach Bedarf ergänzt oder wenn ausdiskutiert, enfternt.","rote Kärtchen, Pinnwand","GA --> PL","","","","",""],["Hummel und Schmetterling","","Input","","","","","Texte / Unterrichtsmaterial / Bücher anlesen bzw. sich in interessanten Materialien vertiefen, um sich zu einem zentralen Thema zu informieren","","EA / PA","","","","",""],["Hüpfende Antwort","","Konzentration","Aktivieren","DaF HV","","","Auf eine Frage wird immer eine Antwort gegeben, die genau zu der Frage zuvor passt. Beispiel: L1: Was machst du heute Abend?  L2: QUATSCHANTWORT; egal, darf nicht passen. Frage: Wie viel Kugeln Eis kannst du essen?  L3.  antwortet auf die Frage 1: Geh ins Kino.  Frage: Wie alt bist du?  L4.  antwortet auf Frage 2: drei..  usw. Kettenspiel im Sitzkreis. Schwieriger im Stehkreis, erfordert noch mehr Konzentration:  Ball zuwerfen oder einen Schüler mit Namen ansprechen.","","PL","Sitzkreis","h_pfende_antwort.jpg","","",""],["Ich bin wie du - ich bin anders als du","","Feedback","","","","","Die TN arbeiten mit einem Partner zusammen, mit dem sie bisher / sonst selten zusammen gearbeitet haben. Eine von ihnen erzählt zuerst, worin sie sich ihrer Meinung nach ähnlich sind. Jede Aussage muss mit dem Satz „Ich bin wie du, auch ich...” Nach zwei Minuten Wechsel. Der Partner kann auch etwas sagen, was der andere schon genannt hat. In der nächsten Runde kommen die Unterschiede dran:  „Ich bin anders, als du, ich...” Im Plenum wird nur darüber berichtet, ob sie  viele / wenige Ähnlichkeiten/ Unterschiede gefunden haben, was war das Interessanteste...","","PA --> PL","","","","",""],["Impulsfragen","","Erfahrung","Diskussion","DaF Sprechen","","","Zur Strukturierung des Erfahrungsaustausches werden Fragen auf Kärtchen / Flipchart geschrieben. Die Ergebnisse des Austausches (die Highlights, die überraschendsten Informationen, Ähnlichkeiten / Unterschiede...) auf Plakaten festhalten.","Kärtchen / Flipchart","GA --> PL","","","","",""],["Ich - wir - es  (PEACE!)","","Reflexion","Feedback","","","","Nach dem Abschluss einer längeren / intenstiven Phase: Ein Kreis in 4 Teile teilen (“Peace-Zeichen”). In einem Teil Kommentare zum persönlichen Lernerfolg / Gefühlen / Gedanken notieren, im zweiten zum Gruppenprozess / Zusammenarbeit in der Gruppe, und in den zwei kleinen Teilen zu “es”: Inhalte und Methoden.","A3-Blatt","EA / PA / GA --> PL","","","","",""],["Impulskarten","","Erfahrung","Diskussion","DaF Sprechen","","","Zur Strukturierung des Erfahrungsaustausches werden Fragen auf Kärtchen / Flipchart geschrieben. Die Gruppe kann u.U. bestimmen, in welcher Reihenfolge sie die Impulse diskutieren. Die Ergebnisse des Austausches (die Highlights, die überraschendsten Informationen, Ähnlichkeiten / Unterschiede...) auf Plakaten festhalten.","Kärtchen / Flipchart","GA --> PL","","","","",""],["Impulskartenstapel","","Kennen lernen","Erfahrung","Einstieg","DaF Sprechen","","Impulse (Stichworte, Fragen, Thesen) auf Kärtchen schreiben und in einer logischen Reihenfolge auf einen Stapel legen. Die Kleingruppen erzählen / diskutieren, indem sie den Stapel „abarbeiten“. Hinweis: Kurzinfos /-kommentare, das Ziel ist es, „unten“ anzukommen.","Kärtchen in unterschiedlichen Farben (für jeden neuen Aspekt neue Farbe)","GA","","","","",""],["Dampfer im Nebel","","Kooperation","Vertrauen","","","","Gruppe wird in mehrere Tankergruppen (min. 5- 6 Pers.) aufgeteilt. Jeder Spieler legt dem Vordermann beide Hände auf die Schultern. In jeder Gruppe ist immer der Hintermann der \"Kapitän\" des Schiffes. Nachdem Nebel aufgekommen ist, schließen alle, mit Ausnahme des Kapitäns die Augen. Mit Hilfe der empfindlichen Kontaktsteuerung navigiert der Kapitän das Schiff vom Heck aus hoffentlich sicher durch das Meer:  Mit beiden Händen auf beide Schultern klopfen: \" Volle Kraft voraus! - (bzw. \"Richtung beibehalten!\")  Nur auf die rechte Schulter klopfen: \"Steuerbord!\" (Rechtskurve)  Nur auf die linke Schulter klopfen: \"Backbord!\" (Linkskurve)  Mit beiden Händen zweimal hintereinander auf die Schulter klopfen: \"Alle Maschinen Stopp!\" Das Kommando wird von hinten nach vorne weitergegeben.","evtl. Augenbinden","GA4-5","Raum mit Hindernissen","","","",""],["Alles in den Kreis!","","Kooperation","Gruppendynamik","Problemlösung","","","Aus dem Seil wird ein kleiner Kreis mit einem Radius von höchstens 1m gelegt. Um diesen Kreis herum werden 10 Gegenstände verteilt. Sie sollten einen Abstand von 10-15m haben. Alle TN fassen sich an den Händen und bilden so eine Kette. Die Gruppe muss die Gegenstände in den Kreis einholen. Dabei muss immer mindestens eine Person der Gruppe mit einem Fuß im Kreis stehen und die Kette darf nicht unterbrochen werden. Für nahe gelegene Gegenstände dürfte es ausreichen, wenn alle die Arme weit ausstrecken. Für weiter entfernte Gegenstände müssen sich dann schon Leute z.B. auf den Boden legen und andere müssen sie an den Füßen festhalten, um die Kette nicht zu unterbrechen. Insgesamt hat die Gruppe für 10 Gegenstände 15 Versuche, ihren Kreis zu verlassen. Jeder dieser Versuche hat ein Zeitlimit. (Als gutes Zeitlimit haben sich für den Anfang 30 Sekunden herausgestellt, nachher kann man auf 25 und dann auf 20 Sekunden runtergehen.) Innerhalb dieses Zeitlimits darf die Gruppe so viele Gegenstände einholen, wie sie schafft. Allerdings muss sie alle Gegenstände wieder abgeben, wenn nach Ende des Zeitlimits auch nur eine Person der Gruppe noch nicht komplett im Kreis ist oder wenn die Kette unterbrochen wurde.^ Wenn die Gruppe schlau ist, benutzt sie Jacken, um die Kette zu verlängern. Das sollte man in der ersten Runde auch noch zulassen, nachher aber verbieten. Wenn die Gruppe das  Spiel einmal verstanden hat, sollte die Aufgabe etwas anspruchsvoller werden: Ein Spieler aus der Gruppe bekommt nun die Augen verbunden. Die Gruppe muss sich selbst überlegen, an welche Position sie ihn hinstellt. In der nächsten Runde können auch noch mehr Spieler eine Augenbinde bekommen.","10 Gegenstände (z.B. kleine Bälle), Seil, evtl. Augenbinden","PL (7-15 TN)","freier Raum","","","",""],["Je kleiner, desto besser","","Kooperation","Gruppendynamik","Problemlösung","","","Die Gruppe erhält das Seil (3m lang) und muss nun einen möglichst kleinen Kreis damit legen, bei dem sie glaubt, dass sie alle noch hineinpassen, d.h. darin stehen können. Die Gruppe darf nicht ausprobieren, ob sie es schafft. Wenn die Gruppe sich auf einen Kreis geeinigt hat, müssen sie es beweisen. Wenn sie es geschafft habe kann noch eine zweite Runde angeboten werden, in dem ein kleinerer Kreis gelegt werden soll. Danach bietet sich eine Reflexion an: wer war Wortführer? Haben sich alle beteiligt gefühlt? Warum ist die Aufgabe gescheitert?","3m langes Seil","PL","freier Raum","","","",""],["Je länger, desto besser","","Kooperation","Gruppendynamik","Problemlösung","Aktivieren","","Mit vorgegebenen oder selbst zu organisierendem Material sollen die Mitspieler in vorgegebener Zeit (je nach Gruppengröße 3 – 10 Minuten; je kleiner die Gruppe, desto mehr Zeit ): aus mindestens 10 selbst organisierten Schnürsenkeln die längste Kette knüpfen; aus selbst beschafften Büroklammern die längste Kette machen (je nach Gruppengröße und Ort 5 – 20 Minut
