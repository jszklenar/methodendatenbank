"","Wettbewerb","Die Gesamtgruppe wird in Kleingruppen (4-6 Personen) geteilt. Jede Kleingruppe schreibt das Alphabet einzeln auf Zettelchen oder auf ein großes Packpapier. Auf Kommando beginnt das Spiel. Ziel ist es, auf jede Karte einen Gegenstand zu legen, der mit diesem Anfangsbuchstaben beginnt. Es ist auch Kreativität gefragt, z.B. zählt bei C auch \"Christianes Uhr\" oder bei U \"unsichtbarer Kugelschreiber\". Die Gruppe, die zuerst fertig ist, hat gewonnen / bzw. die Gruppe, die innerhalb einer vorgegebenen Zeit die meisten Buchstaben richtig belegt hat. Punkte vergeben: 1 Punkt für einen korrekt gelegten Gegenstand, den die andere Gruppe NICHT hat, 2 Punkte, wenn die andere Gruppe gar nichts auf diesem Buchstaben liegen hat.","Gegenstände im Raum","GA","Gruppentische, möglichst weit voneinander","buchst.jpg","","",""],["Sätze verwandeln","","DaF GR","DaF WS","","","","Die L suchen sich einen beliebigen Satz aus einem Text aus, möglichst einen längeren mit mindestens einem Nebensatz. Satz abschreiben (am besten mit einem Bleistift, oder auch am Computer). Dann ein beliebiges Wort durchstreichen und durch ein anderes ersetzen (am besten in einer anderen Farbe), so dass der Satz immer noch eine korrekte Struktur hat. Das so langemachen, bis der gesamte Satz eine neue Farbe (und wahrscheinlich einen komplett veränderten Sinn) hat.","","PA","","","","",""],["Zeilensalat","","Input","DaF LV","","","","Text auf etwa gleich große Streifen teilen. Reihenfolge verändern (AB) oder Schnipsel ausschneiden. TN ordnen den Text und vergleichen ihre Lösungen.","Streifen","EA / PA","","","","",""],["Fließband","","Aktivieren","Konzentration","DaF WS","","Kettenübung","Ich beginne mit “A” (Apfel) (Ball in die Nachbar-Hand legen). Das “A”-Wort wird von der Nachbarin wiederholt (Ball mit rechts aus links) und “B”(anane) gesagt (Ball in Nachbarhand) . So geht es weiter. Das ganze ABC, zu einem Wortfeld oder frei, und wenn wir “durch” sind, wieder von vorne. Aber, Achtung: Es folgen weitere Bälle! Ein Zahlen-Ball, die Wochentage und Monate. Gar nicht so einfach!","Bälle (Hälfte der TN-Zahl)","PL","Stehkreis / Sitzkreis","","","",""],["Dosen schütteln","","Gruppenbildung","Konzentration","Wahrnehmung","","","Geeignet für PA oder GA: Etwas aufwendig, aber spannend und erhöht die Konzentration: Filmdosen oder Kinderüberraschungseier mit verschiedenem Material füllen (Sand, Kieselsteine, Salz, Zucker, Erbsen, Linsen, Reißzwecke, Büroklammern, Mehl...), jeweils in 2 Dosen das gleiche Material (oder bei GA mehr :-). Die L gehen leise und aufmerksam herum, schütteln ihre Dosen, versuchen herauszuhören, wer das gleiche Material hört. Wenn sie ziemlich sicher sind, können sie reinschauen.","Döschen oder Kinderüberraschungseier, verschiedenes Füllmaterial","PL","freier Raum","","","",""],["Gemeinsam lesen","","Konzentration","Kooperation","Wahrnehmung","","","Die Gruppe liest zusammen einen Text vor, jeder muss ein Wort vorlesen, Reihenfolge wird aber nicht vorher vereinbart. Absprachen nur über Blickkontakt, sprechen und Gesten sind nicht erlaubt. Sprechen zwei gleichzeitig, muss die Gruppe von vorn anfangen. Wenn alle dran waren, können sie eine neue Runde starten und den Text weiterlesen.  (Eignet sich aber auch als Einstieg in den Text, L neugierig machen, nach dem Vorlesen eines Teils mit 16-30 Wörtern spekulieren, wie es weitergeht...)","Text für alle","PL","Stehkreis oder Sitzkreis","","","",""],["Filmteams","","Gruppenbildung","","","","","Kartensets vorbereiten, die zu Filmen gehören (so viele Sets, wie Gruppen gebildet werden sollen). Die Karten enthalten z. B. auf der ersten Karte Informationen über Schauspieler des Films (am besten ein Foto aus einer Illustrierten), auf der zweiten das Thema, auf der dritten eine kurze Beschreibung der Handlung, auf der vierten das Land, auf der fünften den Regisseur.","Kärtchen","PL","","","","",""],["Was wirklich zählt","","Wahrnehmung","","","","","Die TN setzen sich in einem Halbkreis an einen Tisch. Der KL legt 5 Streichhölzer (oder Zahnstocher) auf den Tisch und erklärt, dass er mit Hilfe dieser Streichhölzer geometrische Formen bilden wird, die jeweils für eine Zahl zwischen Null und Fünf stehen. Derjenige, der zu wissen glaubt, um welche Zahl es sich handelt, darf es laut sagen. Weder Trainer noch TN dürfen darüber hinaus miteinander sprechen. Ist die erratene Zahl richtig, legt der Trainer die nächste Form.  Lösung: Die gelegten Formen haben absolut nichts mit der eigentlichen Zahl zu tun; sie sind Fantasieformen . Während der Trainer eine beliebige Form mit der rechten Hand legt, „zeigt“ er die richtige Zahl mit der linken Hand möglichst unauffällig. (Faust = 0 ausgestreckter Zeigefinger = 1 zwei ausgestreckte Finger = 2 usw.) Um die TN noch mehr in die Irre zu führen , kann der Trainer auch bestimmte Formen wiederholt legen, die dann jedes Mal aber eine andere Bedeutung haben – eben jene der linken Hand! :-)","5 Streichhölzer","PL","","","","",""],["Geschichten-Memory","","Konzentration","Gedächtnis","DaF Sprechen","","","Die Lernenden finden sich in Dreier- oder Vierergruppen zusammen, nehmen sich jeweils einen Stapel Memory-Karten und legen die Karten verdeckt auf einen Tisch.  Der erste Spieler nimmt sich die erste Karte des Stapels und beginnt eine Geschichte passend zu dem abgebildeten Motiv zu erzählen. Er legt die Karte verdeckt auf den Tisch. Der zweite nimmt die nächste Karte und baut sein Bild in die angefangene Geschichte ein usw. Danach legt auch er seine Karte verdeckt auf dem Tisch ab.  Wenn alle Karten verbraucht sind, wird die Geschichte noch einmal in der gleichen Reihenfolge erzählt, und dabei die Karten wieder umgedreht. Regel: Niemand darf zu der Karte erzählen, die er vorher schon hatte.  Variante: Der Spielleiter stoppt nach den Zufallsprinzip, der Spieler, der gerade erzählt, fasst die Geschichte mit Hilfe der Karten zusammen (Reihenfolge der Karten muss stimmen). Danach Karten mischen und neue Geschichte anfangen.","Memory-Karten","GA","","","","",""],["Ich habe mal erlebt","","Aktivieren,","Wahrnehmung","Kooperation","DaF Sprechen","","Die Gruppe sitzt im Stuhlkreis. Ein TN bekommt den Ball vom KL zugeworfen und beginnt daraufhin eine Fantasiegeschichte mit dem Einleitungssatz „Ich habe mal erlebt, dass …“ zu erzählen. Nach einigen Sätzen wirft er den Ball einem anderen TN zu, der die Geschichte weitererzählt usw. Wenn alle in der Runde mindestens einmal in Besitz des Balles waren und somit ihren Anteil zur Geschichte beigetragen haben, bittet der KL alle TN, die von ihnen jeweils wahrgenommenen wesentlichen Elemente der Geschichte aufzuschreiben und anschließend der Gruppe vorzustellen. Die TN werden zumeist feststellen, dass jeder unterschiedliche Inhalte aufgeschrieben hat. Sie werden dadurch sensibilisiert für eigene und fremde Wahrnehmungsmuster.","Ball","PL","Sitzkreis","","","",""],["Kalimba de luna","","Aktivieren","Konzentration","","","Bewegung","Die TN stehen im Kreis. Der KL führt zum Rhythmus der Musik die Bewegungen vor, alle machen es ihm nach:   rechte Hand vor und winken linke Hand vor und winken rechte Hand an linke Wange linke Hand an rechte Wange rechte Hand an Schulter des linken Nachbarn linke Hand an Schulter des rechten Nachbarn rechte Hand an Hüfte des linken Nachbarn linke Hand an Hüfte des rechten Nachbarn rechte Hand an Knie des linken Nachbarn linke Hand an Knie des rechten Nachbarn rechte Hand an Knöchel des linken Nachbarn linke Hand an Knöchel des rechten Nachbarn  Natürlich alles im Takt der Musik! https://www.youtube.com/watch?v=YOUEVvJyo5Y","Musik","Stehkreis","","","","",""],["Pflaumen pflücken","","Aktivieren","Konzentration","","","Bewegung","Die TN stehen im Kreis, die Füße schulterbreit auseinander. Der KL fordert die TN auf, sich einen Pflaumenbaum voller Früchte vorzustellen. Im Rhythmus der Musik (richtig schwungvoll!) zeigt er, wie das Pflaumenpflücken geht, und die TN machen es ihm nach:  zweimal oben rechts  zweimal oben links zweimal unten rechts zweimal unten links  Bei der Fülle der Pflaumen wurden jedoch einige Früchte übersehen, von daher noch mal von vorn: einmal oben rechts einmal oben links einmal unten rechts einmal unten links  Anschließend schlagen sich alle voller Freude über die reiche Ernte mit der rechten Hand auf den linken Schenkel,  dann mit der linken Hand auf den rechten Schenkel,  schließlich mit beiden Händen auf die Pobacken  und klatschen einmal mit den Händen , bevor es in die nächste Pflückrunde geht, also: zweimal oben rechts usw.","schwungvolle Musik","Stehkreis","","","","",""],["Tante Jo","","Konzentration","Wahrnehmung","","","Bewegung","Die TN sitzen in einem Stuhlkreis. Der KL fragt seinen rechten Stuhlnachbarn: „Kennen Sie Tante Jo?“ Dieser verneint. Der KL sagt darauf: „Tante Jo macht immer so!“ und hebt dabei drohend den rechten  Zeigefinger. Der Nachbar gibt die Frage nach rechts weiter, dieser TN fragt wiederum seinen rechten Nachbarn usw., bis die Frage wieder beim Kursleiter angelangt ist. Jetzt verrät der Trainer eine weitere Eigenart von Tante Jo, z. B. Augenzwinkern. Er hebt also bei dem Satz „Tante Jo macht immer so“ gleichzeitig den Zeigefinger und zwinkert mit den Augen. Bei jeder Runde kommt eine Bewegung hinzu, z. B. Lippenschürzen, Naserümpfen oder Kopfschütteln. Jedes Mal werden die vorhergehenden Eigenarten wiederholt.","","PL","Sitzkreis","","","",""],["Au ja!","","Aktivieren","DaF HV","","","","Alle TN stellen sich im Kreis auf. Ein TN darf einen Wunsch formulieren, den alle anderen TN und er selbst ebenfalls, ausführen müssen, zum Beispiel: „Alle hüpfen auf einem Bein\"! Als Antwort darauf rufen alle TN begeistert: „Au ja, au ja! Wir hüpfen auf einem Bein!\" - und hüpfen für kurze Zeit auf einem Bein. Anschließend darf der nächste TN aus der Gruppe einen Wunsch äußern, den wieder alle TN mit „Au ja, au ja! ...\" beantworten und ausführen. Ziel der Übung ist es zum Beispiel, nach der Mittagspause oder allgemein zur Auflockerung etwas Schwung in die Gruppe zu bringen. Außerdem zeigt dieses Spiel auf sehr einfache Weise, wie viel leichter es ist, etwas zu tun, das man mit Begeisterung anpackt und wie diese Begeisterung entstehen und wirken kann.","","PL","Stehkreis","","","",""],["Moorhuhnschießen","","Wiederholung","Transfer","","","Bewegung","Von den TN selbst (ggf. auch vom KL) hergestellte Fragekarten sind die Grundlage dieses Spiels. Die Fragen beziehen sich auf Themen, die im Seminar bzw. im Workshop behandelt wurden. Die TN teilen sich in Kleingruppen. Jeweils zwei Gruppen spielen gegeneinander. Jede Gruppe zieht dieselbe Anzahl an Fragekärtchen aus dem vorbereiteten Fragenpool, den der Kursleiter auf einem Tisch oder in einem Korb bereithält. Nun beginnt das Quiz, indem ein Mitglied einer Gruppe der Gegenpartei eine Frage vorliest. Regel: Bei jeder richtigen Antwort gibt es zwei Punkte. Sollte die Antwort falsch sein, kann die Gruppe dennoch einen Punkt durch erfolgreiches Moorhuhnschießen gewinnen. Bei einer Gruppe von fünf TN funktioniert das z. B. folgendermaßen: Vier TN ergreifen je eine Ecke des Tuchs und stehen in einigem Abstand zum fünften TN. Dieser versucht nun, das Huhn in die Mitte des Tuchs zu werfen , wobei die Kollegen mithelfen können. Je nach räumlicher Situation können Sie den Abstand zwischen dem werfenden TN und Tuch auf mindestens zwei, maximal drei Meter festlegen. Das Spiel endet nach einer zuvor festgelegten Anzahl an Fragerunden.","Laken, Gummihuhn","2 Großgruppen","freier Raum in der Mitte","","","",""],["Bleistiftstafette","","Konzentration","Kooperation","","","","Einer hält in jeder Hand einen Bleistift; über diese beiden Stifte ist ein dritter quer gelegt.  Vorsichtig wendet sich der Spieler zum Nachbarn, der die Bleistifte abnehmen und weitergeben soll.  Wer den Bleistift fallen lässt, gibt ein Pfand (optional).","3 Bleistifte, möglichst gleich lang","PL","Stehkreis","","","",""],["Disney-Strategie","","Ideen","Problemlösung","","","","Die TN werden in drei Gruppen aufgeteilt und bekommen eine Rolle zugewiesen: Träumer, Kritiker, Realist. Jede dieser Gruppen zieht sich in einen Raum zurück. Möglich ist auch den Raum in drei Bereiche aufzuteilen.  • Die Träumer fantasieren drauflos, was alles in der konkreten Situation toll wäre, ohne dass sie sich von irgendwelchen vermeintlichen Hindernissen beirren lassen. Nach der Auflistung der verschiedenen \"Träume\" reichen sie das Papier weiter an die Kritiker-Gruppe. • Die Kritiker greifen die Ideen der Träumer auf und kritisieren hemmungslos. Sie erarbeiten alle möglichen und unmöglichen Hindernisse, die die Umsetzung der Ideen der Träumer verhindern können. Sobald diese Gruppe keine kritischen Argumente mehr liefern können, geben auch sie das Blatt weiter an die Realisten. • Die Realisten suchen aus dem bisher erarbeiteten (Traum, Kritik) das Mögliche heraus. Sie sind die Instanz, die entscheidet, was tatsächlich umgesetzt.","","GA","","","","",""],["9 Punkte","","Problemlösung","Kreativität","","","","Ziel ist, über Grenzen zu denken: TN bekommen die Aufgabe, 9 Punkte (s. Bild) mit möglichst wenig geraden Linien zu verbinden, ohne den Stift abzusetzen. (Trick: Niemand sagte, dass man die Linien nicht weiter laufen dürfen, und schon gar nicht, wie dick der Stift ist. Nimmt man ganz kleine Punkte und einen ganz dicken Stift, dann reicht sogar 1 Linie! :-)","Blatt, Stifte","PA / GA","","9_punkte.png","","",""],["Die Gedanken sind frei","","Kennen lernen","Wahrnehmung","","","","Die TN gehen paarweise zusammen.  Nun stellt ein TN dem anderen Fragen, die dieser nur mit \"Ja\" oder \"Nein\" beantworten kann, z.B.: Können Sie Golf spielen?\"; \"Waren Sie schon einmal in Argentinien?\"; \"Haben Sie eine Cousine?\"  Der Fragende achtet dabei genau auf die Mimik und die Gestik des Erwidernden.  Nach insgesamt rund zehn Fragen wird das Interview nonverbal fortgesetzt.  Das bedeutet, der Befragte \"denkt\" sich seine Antworten und der Fragende muss diese nun anhand der Körpersprache erraten.  Nach jeder Frage und stillen Antwort gibt der Befragte die Auflösung.  Nach etwa fünf weiteren Fragen werden die Rollen getauscht.","","PA","","","","",""],["Fremdsprache","","Feedback","Wahrnehmung","","","","Ein Mitspieler tritt in den Kreis und drückt seine Gefühle durch einsilbrige, sinnlose Worte aus, wie z.B.: plopp, bohhh, zapp, ihi usw.  Die Gruppe deutet, wie er sich wohl grade fühlt.  Wenn weder Mimik noch Körpersprache sichtbar sein sollen, stellt sich der Spieler hinter eine Pinwand oder Flipchart.","","PL","","","","",""],["Infomarkt","","Input","Kooperation","DaF Sprechen","","","Beim Infomarkt erhalten alle Teilnehmer ein Spezialgebiet zugewiesen, über das sie sich informieren und zu „Experten\" auf diesem Gebiet werden. In Kleingruppen tauschen sich dann die Experten über ihre unterschiedlichen Themen aus, erläutern diese und geben so ihr Wissen an die anderen Gruppenmitglieder weiter. Ablauf: - Jeder Teilnehmer erhält Informationsmaterial über ein bestimmtes Thema - In einer ca. zehnminütigen Vorbereitungszeit arbeitet sich jeder Teilnehmer in sein Thema ein, erarbeitet evtl. einen Kurzvortrag, ein Poster... - Kleingruppen mit je vier bis fünf Teilnehmern werden gebildet und verteilen sich so zu Stehkreisen, dass ggf. die Möglichkeit besteht, die Poster aufzuhängen - Die Teilnehmer informieren sich wechselseitig zu ihren Spezialgebieten und beantworten etwaige Rückfragen - Ist die Runde abgeschlossen, können die Gruppen neu gemischt werden und eine neue Info-Runde kann beginnen","Plakat","GA","","","","",""],["Karten in 4 Farben","","Erwartung","","","","","In der Mitte liegen verschiedenfarbige Moderationskarten sowie dicke Filzstifte. Die Zuordnung der Fragen wird vorher erklärt und hängt am besten sichtbar an einer Pinnwand. Rot:  Themen / Inhalt/Methoden Gelb:  Leitung Grün:  Gruppe Blau:  ich persönlich Die Teilnehmer schreiben. auf die roten Karten: Was erwarte ich vom Inhalt des Seminars, welche Themen? Was will ich in Bezug auf das Thema lernen oder erreichen? (Je nach Seminarthema auch: Was erwarte ich hinsichtlich der Methoden?) Auf die gelben Karten: Welche Erwartungen habe ich an die Leitung? Auf die grünen Karten: Was erwarte oder wünsche ich von der Gruppe? Auf die blauen Karten:  Was wünsche ich mir für mich persönlich? Während die Teilnehmer die Karten ausfüllen, können Sie leise Musik im Hintergrund laufen lassen und die Teilnehmer bitten, sich während der Zeit still zu verhalten.  Weiterarbeit:  Sie lassen die Teilnehmer einzeln nach vorne an die Pinnwand kommen, die Karten farblich zugeordnet anheften und erläutern.  Anschließend können die Karten noch geordnet und geclustert werden.","Karten in 4 verschiedenen Farben, dicke Stifte, Pinnwand","EA","","","","",""],["Von Z bis A","","Konzentration","","","","","Wir haben das Alphabet von A bis Z auswendig gelernt und können es von A bis Z auch schnell auswendig hersagen.  Da wir eine Richtung gelernt haben, fällt uns die andere Richtung besonders schwer, also das Alphabet von Z nach A aufzusagen.  Probieren Sie es einmal! Schritt 1:  Der Trainer sagt einen Buchstaben, und die Gruppe sagt gemeinsam den nachfolgenden Buchstaben.  Hiervon macht man fünf bis sechs Beispiele. Schritt 2:  Dann wechselt die Aufgabe: Die Gruppe soll den Buchstaben gemeinsam sagen, der vor dem Buchstaben kommt, den der Trainer dann nennt. Schritt 3:  Wie lautet die dritte Zeile der Nationalhymne?  Besondere Hinweise:  Die Gruppe erkennt, wie schwer das ist bzw. dass dies kaum möglich ist, weil wir gelernt haben, in Einbahnstraßen zu denken.  So wie ich es gewohnt bin zu lernen, so denke ich jetzt und auch in der Zukunft.  Es sei denn, ich beginne, mir neue Lerntechniken anzueignen, damit ich morgen anders denken kann.","","PL","","","","",""],["Modell, blindes Huhn und Sprecher","","Kommunikation","Wahrnehmung","","","","In den 3er Gruppen werden 3 Rollen zugeteilt: Modell, blindes Huhn und Sprecher. Das Modell setzt sich dann in einer bequemen und eventuell eher ungewöhnlichen Sitzposition auf einen Stuhl. Daneben sitzt das blinde Huhn mit geschlossenen Augen - eventuell auch Rücken an Rücken mit dem Modell. Der Sprecher hat nun die Aufgabe, dem blinden Huhn Anweisungen zu geben, bis dieses genauso sitzt wie das Modell, wobei Rückfragen des Modells nicht erlaubt sind. Es hat genau das zu tun, was der Sprecher sagt. Die erste Spielrunde ist vorbei, wenn der Sprecher mit seinen Erklärungen fertig ist und das blinde Huhn genauso sitzt wie das Modell. Es folgen 2 weitere Runden mit jeweils verteilten Rollen. Im Anschluss wird diskutiert, was aufgefallen ist, wo die Schwierigkeiten lagen und woran das gelegen haben mag.","","GA3","","","","",""],["Plus-Karten","","Feedback","","","","","Die Teilnehmenden erhalten jeweils drei Moderationskarten.  Auf diese sollen sie bis zu einem festgesetzten Zeitpunkt (Mittagspause, Tagesende...)  etwas positives über ein Gruppenmitglied notieren (pro Person eine Karte benutzen). Die Karte schenken Sie dann der betreffenden Person.  Sie dürfen sich auch selbst solche \"Pluskarten\" schenken.  Es gibt keine Obergrenze für die Anzahl der Karten:  Blankokarten liegen die ganze Zeit bereit. Variationen: Namen auf Zettel schreiben und blind ziehen lassen.  Jede/r schreibt dann der Person, deren Namen er/sie gezogen hat eine Pluskarte. Die TN gehen mit einer DIN A4 Pappe auf dem Rücken zu Musik durch den Raum.  Bei Stopp der Musik schreiben sich die 2 nächststehenden Personen ein positives Feedback auf die Pappe; nach ca. 1 Minute die Musik weiter spielen lassen.  Die TN gehen weiter.  Mindestens drei Mal schreiben lassen.  Bei größeren Gruppen nicht zu oft wiederholen, sonst wird es langweilig. Übung nach einer Gruppenarbeit, bezogen auf das, was jeder der Gruppe gegeben hat. (Der Arbeitsauftrag fördert eine positive Wahrnehmung und Kommunikation in der Gruppe.  Die Teilnehmer erleben wie sehr sie sich über diese Karten freuen.  Bei erstgenannter Variante vergessen viele zunächst die Karten zu schreiben - ganz wie im richtigen Leben, wo wir vergessen, positives Feedback zu geben.  Deshalb zwischendurch (aber nicht zu früh!) nachfragen und Prozesse bewusst werden lassen. Auf jeden Fall vorher die Befürchtung ansprechen: \"Ich bekomme keine/wenige Karten.\"  Das heißt nicht, Sie haben nichts positives, sondern, die anderen haben es nicht beobachtet!! )","","CP","","","","",""],["Tea for two","","Kennen lernen","DaF Sprechen","","","","Eine Gruppe von max. 7 Personen sitzen an einem Tisch und erhalten je einen Stift und ein Arbeitsblatt. Der KL erzählt den TN, dass sie die Gelegenheit haben, berühmte Persönlichkeiten der Weltgeschichte an unterschiedlichen Tagen zum Tee einzuladen, um mit ihnen unter dem Stichwort, \"was ich Sie immer schon mal fragen wollte; was ich Ihnen schon immer mal sagen wollte\" zu plaudern.  Neben den Gesprächsinhalten, über die sie sich austauschen, sollten die TN überlegen, was sie zu trinken und zu essen anbieten wollen. Nach der Einzelarbeit findet ein Austausch in der Gruppe statt über die Wahl der Persönlichkeiten, Gesprächsinhalte, Getränke und Speisen.","","EA --> GA (max 7)","","Tea_for_two_Arbeitsblatt.pdf","","",""],["Wandelstift","Edding / Der magische Gegenstand","Aktivieren","DaF WS","","","Rätsel","Der KL lässt einen Stift herumgehen, den die TN pantomimisch verwenden sollen (z.B. als Lippenstift, Golfschläger, Zahnbürste, Zigarre usw.).  Jeder TN kann sich eine völlig andere Bewegung ausdenken, diese brauchen sich also nicht aufeinander zu beziehen.  Der Nachbar sagt dann: \"Ach, ein ...! Danke!\" und nimmt den Stift ab. Dann ist er dran... Keine Wiederholung, jeder TN muss einen neuen Gegenstand ausdenken.","Stift","PL","Sitzkreis / Stehkreis","","","",""],["Kollisionskurs","","Wahrnehmung","","","","","Jeder geht durch den Raum, sucht sich immer Punkte aus, auf den er geradewegs zugeht und muss darauf achten, nicht mit den anderen zusammenzustoßen.","","PL","freier Raum","","","",""],["Gegengewicht","","Kooperation","Vertrauen","","","","Zwei nehmen sich bei der Hand, lassen sich möglichst weit nach hinten fallen und geben einander so Gegengewicht.","","PA","","","","",""],["Doppelbesetzung","","Wahrnehmung","Kommunikation","","","","Dialog mit Doppelbesetzung der Rolle: Die Personen sollen auch gleichzeitig sprechen. Ziel: Abstimmung und Anpassung.","","GA4","","","","",""],["Ja, und dann...","","Aktivieren","DaF Sprechen","","","","TN sitzen im Kreis, einer beginnt eine Geschichte zu erzählen, sagt einen Satz. Der Nachbar setzt fort, er muss den Satz aber immer mit Ja, und dann... beginnen. Der letzte im Kreis muss die Geschichte beenden.","","Sitzkreis","","","","",""],["Satz für Satz","","Aktivieren","DaF Sprechen","","","","Der erste Satz für Lerner A: Es ist Dienstag. Sie entwickeln Satz für Satz die Szene. KL sagt irgendwann stop. Neue Szene beginnt, B beginnt, verwendet den letzten Satz aus der vorangehender Szene als ersten  Satz der neuen Szene.","Signal für den Wechsel (Klingel....)","PA","","","","",""],["Fotoreflexion","","Reflexion","Feedback","","","","Die Fotos werden in Einheiten aufgeteilt, z.B. Tage oder Programmpunkte. Das Plakat wird im Spalten unterteilt und jede Spalte mit einem Prorammpunkt überschrieben.  In der Refelxion zeigt man den Teilnehmern nun alle Fotos zu einer Einheit und erzählt entsprechend den Ablauf. Nach jeder Einheit macht jeder Teilnehmer einen Punkt in der entsprechenden Spalte auf dem Plakat, ganz oben für super toll und ganz unter für absolut schlecht.","Fotos aus dem Seminaralltag","","","","","",""],["Füße am Boden","","Problemlösung","Kooperation","","","","Die Spieler müssen nach zwei Minuten mit möglichst wenig Füßen den Boden berühren. Vorher können sie sich zwei Minuten Zeit beraten.","","GA / PL","freier Raum","","","",""],["Faxen","","Wahrnehmung","Kommunikation","","","","Es werden je nach Spieleranzahl zwei oder mehr Gruppen gebildet, welche gleich groß sind. Vorzugsweise 4 pro Mannschaft. Jede Gruppe bildet eine Faxmaschine und setzt sich in einer Reihe hintereinander auf den Boden/oder stellt sich in einer Reihe auf. Der Spielleiter gibt gemalte Motive an die Letzten, also am weitesten hinten Sitzenden einer Gruppe. Nach einem Startsignal wird das Fax losgeschickt, indem der Letzte das Motiv seinem Vordermann auf den Rücken mit dem Finger malt. Das geht so weiter bis der Erste, also am weitesten vorne Sitzende, es „ausgedruckt“ hat, das heißt aufs Papier gemalt hat. Die Gruppe, dessen Ergebnis dem Original am ähnlichsten ist, gewinnt.","Bilder","GA4","","","","",""],["Laufdiktat","","Einstieg ins Thema","Aktivieren","DaF Aussprache","DaF Rechtschreibung","Bewegung","Einen kurzen Text (10-12 Sätze) in mehreren Exemplaren ein wenig vergrößert kopieren und an mehreren Stellen im Raum aufgehängt. Wichtig: Die Texte so zu platzieren, dass die Lernenden richtig herankommen können und den Text lesen können.         Variante: der Text wird in Sätze zerschnitten, die Teile bekommen eine Nummer und wird in jeweils einem Exemplar gut voneinander getrennt aufgehängt.        Die Lernenden arbeiten in Paaren/Kleingruppen: Einer von ihnen läuft zunächst zu einem Text, merkt sich so viel, wie er nur kann, läuft zurück zum Partner und diktiert den Textteil. Wenn der Schreibende unsicher ist, wie ein Wort geschrieben wird, schickt er den Partner zurück, um nachzuschauen. Zum Schluss korrigieren die Lernenden sich selbst: Jedes Team bekommt den kompletten Text.        Variante: Wenn die Lernenden auf die Wette schreiben: Zum Schluss noch ein „Korrekturlauf“, dann wird der Text abgegeben. Die Eingänge nummerieren und nachher den Text korrigieren: Gewonnen hat das Paar, das als erste den kompletten Text ohne Fehler hat..","Texte","freier Raum","","","","",""],["Von 1 bis 5","","Wiederholung","DaF WS","","","Wettbewerb","Die Wörter und deren Übersetzung liegen auf dem Tisch (viele!). Die TN stehen um den Tisch herum (max. 8-10). Ein TN nimmt ein Wort und sucht die deutsche Entsprechung. Die Gruppe zählt von 1 auf 5. Wenn der TN die Aufgabe innerhalb dieser Zeit schafft, darf er das Wort nehmen. Sieger ist der, der die meisten Wörter hat.","Wortkarten","GA","","","","",""],["Bildbeschreibung mit post-its","","Wahrnehmung","DaF WS","DaF Sprechen","","","Man nehme ein Kunstbild und beame es groß an die Tafel. Man markiert an der Tafel den Rand des Bildes. Die L betrachten das Bild 1 Minute lang. Dann schreiben sie in Gruppen auf Kärtchen möglichst genaue Infos: Was habe ich alles auf dem Bild gesehen? (z.B. ein Hut / ein gelber Hut / ein gelber Hut im Stil der 30-er Jahre). Am besten hat jede Gruppe eine andere Farbe von Post-it-Zetteln. Danach beschreiben sie das Bild und kleben den Zettel an die Tafel, an die Stelle, wo ihrer Meinung nach das Detail zu sehen war. Die nächste Gruppe klebt auch alles an, aber kommentiert nur die Stellen, die ihrer Meinung nach anders sind oder woanders im Bild zu sehen waren. Danach beamen wir das Bild über die Zetteln und vergleichen, was stimmt. Wir können die einzelnen Objekte dann auch an die Tafel malen.  Dieses Verfahren ist sehr intensiv, danach werden die Schreib- und Sprechaufgaben (Wer ist sie, was ist passiert? Was ist die nächste Szene? ...) auch viel intensiver, die L können sich viel leichter in die Situation hineinversetzen - und wir haben schon jede Menge Vokabeln gesammelt, die ihnen helfen.","Kunstbild, Beamer, Post-its","FA --> GA","","","","",""],["Schnipp-schnapp","","DaF WS","Wiederholung","","","","Zwei Gruppen (4-5 TN pro Gruppe) spielen gegeneinander. Jeder hat mehrere Karten mit Wörtern oder Redewendungen. Die beiden Gruppen drehen abwechselnd ihre Karten auf und bilden damit einen Satz. Wenn der Satz falsch ist bzw. wenn sie das Wort nicht kennen und die andere Gruppe bemerkt das, darf sie alle schon \"bespielten\" Karten einstreichen. Ziel: Möglichst viele Karten zu haben - Zeitlimit!","Vokabelkartei oder vorbereitete Wortkarten, Tische","GA","","","","",""],["Wörter-Rap","","DaF WS","DaF Phonetik","","","Bewegung","Mit allen neuen Vokabeln kann man rappen:  z.B. Pullover - T-Shirt - Jeans und Schuhe. Dabei zeigen alle auf den Körperteil, auf dem dieses Kleidungsstück getragen wird.","","PL","Stehkreis","","","",""],["Umgekehrt","","Aktivieren","DaF WS","","","","Die TN lesen einen Text mit den entgegengesetzten Verben / Nomen / Adjektiven vor. (Sätze abwechselnd lesen).","Text","PA","","","","",""],["Auf der Couch","","Einstieg","DaF WS","","","","Ein Spieler spielt den Psychologen, der andere den Patienten. Der Psychologe präsentiert nacheinander Worte und Fachbegriffe aus dem zu behandelnden Thema. Der Patient gibt jeweils Worte und Begriffe an, die im Zusammenhang mit den Worten stehen. Zu jedem Zeitpunkt kann der Psychologe sagen: \"Warum haben Sie das gesagt?\" und der Patient muss eine Erklärung abgeben.","","PA","","","","",""],["Eilpost","","Aktivieren","Einstieg","DaF WS","","Kettenübung","A nennt einen Begriff; B muss weitere Begriffe angeben, die mit dem gleichen Buchstaben beginnen oder enden, bevor A bis 10 gezählt hat. Dann macht B und C weiter...","","GA3","","","","",""],["Fotograf","","Wahrnehmung","DaF Sprechen","","","","Ein TN ist der Fotoapparat und ein anderer der Fotograf. Der Fotoapparat-TN wird mit geschlossenen Augen geführt und zum “Fotografieren” angehalten. Wenn der „Fotograf“ auf den Kopf tippt, macht der Fotoapparat-TN kurz die Augen auf, erstellt ein “Foto” von dem gesehenen Ausschnitt und schließt die Augen sofort wieder. Nach fünf Fotos beschreibt der „Fotoapparat“ die entstandenen Bilder und versucht, sie eventuell in der Natur wieder zu finden.","","PA","im Freien","","","",""],["Geräuschelandkarte","","Wahrnehmung","DaF Schreiben","","","","Alle bekommen ein postkartengroßes Papier und einen Stift in die Hand. In die Mitte des Papiers malen sie einen Punkt, um die eigene Position zu kennzeichnen. Danach sucht sich jeder einen Platz im Wald oder auf der Wiese und schließt die Augen. Wahrgenommene Geräusche werden auf dem Papier mit Richtung und Art vermerkt. Danach Auswertung und Betrachtung der entstandenen Karte.","Papier","EA","im Freien","","","",""],["Geräuschmemory","","Wahrnehmung","DaF WS","","","","In je zwei Filmdosen, Kinderüberraschungseier... werden gleiche Materialien getan, die Geräusche machen. Die Dosen müssen alle gleich aussehen. Nach dem Mischen der Dosen können die TN anhand der Geräusche die passenden zusammen suchen. (Material selbst zusammenstellen geht auch!) Min. 12 Paar Dosen! (Geeignet für Stationen)","Dosen, Füllmaterial","GA","Gruppentische","","","",""],["Musikstopp","","Aktivieren","DaF HV","","","","Während die Musik läuft, können sich alle durcheinander im Raum bewegen. Sobald die Musik stoppt, müssen alle versteinert stehen bleiben, eine Bewegung ausführen, ein Ziel erreichen, bestimmte Körperteile berühren, ... Die Anweisung erfolgt, sobald die Musik stoppt. Der letzte TN, der die Anweisung ausführt, kann auch Pfand abgeben oder einen Strafpunkt (Schminkfarbe, Klebepunkt, Wäscheklammer...) bekommen.","lebhafte Musik","PL","freier Raum","","","",""],["Luftmatratze","","Wahrnehmung","Körpersprache","DaF WS","","","Der TN liegt ganz schlaff auf dem Boden und eine Erzieherin fängt langsam an, die verschiedenen Gliedmaßen (Arme, Beine, Bauch etc.) aufzupumpen, so dass alle ganz steif werden. Wenn alle aufgepumpt sind, kann die „Luftmatratze“ steif aufgestellt werden. Nach kurzem Stehen wird der Stöpsel gezogen und die „Luftmatratze“ fällt in sich zusammen.","","PL","freier Raum mit Teppich oder Teppichboden","","","",""],["Wörterschlange herauslesen","","DaF WS","DaF Rechtschreibung","","","","Jeder Lernende bekommt eine Zeitungsseite. Aus den Texten sollen sie Wörter herausschreiben, so dass der Endbuchstabe dem Anfangsbuchstaben des nächsten Wortes entspricht. Die Wörter wie eine Schlange aufschreiben, z.B.: unfallkwiesenhirtorwartorchanceckereignis...  Wichtig: Kein Wörterbuch benutzen! Man darf nur Wörter notieren, die man versteht und auch erklären kann. Auswertung in Partnerarbeit: Der Partner soll versuchen, die Schlange zu zerhacken. Wörter, die er nicht kennt, lässt er sich dann erklären.","Zeitung, Texte, Internetverbindung...","EA","","","","",""],["Fragediktat","","DaF Rechtschreibung","","","","","Text Satz für Satz diktieren. Nach jedem Satz können die L Rechtschreibunsicherheiten gezielt erfragen (schreibt man Wald mit d oder t?) und Antworten sind in Form von Kommentaren zu richtigen Schreibweisen gehalten (Wälder, deshalb d).","Text","FA","","","","",""],["Frühstücksdiktat","","DaF Rechtschreibung","Ritual","","","","Pro Woche einen Text auswählen (für jeden Tag ein-zwei Sätze). Täglich wird ein Satz diktiert, L schreiben in ins Heft (auf die gleiche Seite). (Partnerkontrolle / Kontrolle mit einer Folie) Am Ende der Woche werden die Sätze im Zusammenhang diktiert. Das Wortmaterial wird so gewählt, dass es bereits bekannte und geübte Wörter enthält und dosiert einige neue einführt.","kurzer Text","EA","","","","",""],["Memory + Wortlistendiktat","","DaF WS","DaF Phonetik","DaF Rechtschreibung","","","Schwierige Wörter üben: Zuerst die Wörter auf Memorykarten schreiben (schwierige Stellen mit Textmarker hervorheben). L spielen Memory, dabei können sie beim Aufdecken die Wörter laut sagen und auch die Entsprechung der Muttersprache nennen. Danach die Wortliste diktieren.","Memorykarten","GA / Stationen","","","","",""],["Amnesia-Party","","Aktivieren","DaF Sprechen","","","Bewegung","Kärtchen mit Namen von bekannten Personen / fiktiven Figuren beschriften. Jeder L bekommt eine Karte an seinen Rücken geheftet, geht herum, stellt den anderen Fragen, die sie mit ja/nein beantworten dürfen. Eine Person darf man so lange fragen, bis sie eine Frage mit ja beantwortet. Dann muss man weitere TN fragen. Ziel ist, dass die TN herausfinden, wer sie sind. Gelingt es ihnen, spielen sie weiter und helfen den anderen bei der \"Identitätssuche\".","Kärtchen","CP","freier Raum","","","",""],["Meinungsforschung","","Kennen lernen","Erfahrung","DaF Sprechen","","Bewegung","Themen / Aussagen in Form einer Liste für jeden TN kopieren. Die TN bekommen die Liste, worauf eins der Themen / Aussagen markiert ist. Sie gehen herum, befragen möglichst alle und notieren, wie sie über das Thema denken. Am Ende werden die Ergebnisse statistisch ausgewertet, graphisch dargestellt und zur Diskussion vorgestellt.","Liste","CP","","","","",""],["Partnerquiz","","Kennen lernen","DaF Sprechen","","","Wettbewerb","Zu einer Frage (z.B. was mag er lieber?) werden Wörterpaare oder eine Wortliste (Pizza / Pasta? Rock / Pop? Fahrrad / Mofa? ...) angeboten, der Partner muss eingeschätzt werden. Für jeden richtigen Tipp gibt es einen Punkt.","Liste","PA","","SP_spiel_partnerquiz.jpg","","",""],["Partnerinterview 1","","Kennen lernen","Einstieg","DaF Sprechen","","","Die L beantworten zuerst die Fragen für sich (Tabelle, Spalte 1), und machen dann ein ein Interview mit dem Partner. Sie stellen einander Fragen, notieren die Antwort des Partners (Spalte 2). Zum Schluss berichten sie einem neuen Partner über die Infos / den Standpunkt des interviewten Partners.","Fragenkatalog – je nach Sprachstand mit ausformulierten Fragen oder mit Stichworten zu Fragen.","PA","","","","",""],["Bilderdiktat","","Aktivieren","Wahrnehmung","DaF Sprechen","","","Ein L bekommt ein Bild, er beschreibt es dem Partner. Rückfragen zu stel - len ist erlaubt, die beiden Bilder während der Arbeit anzuschauen jedoch nicht. Am Ende können die Bilder aufgehängt werden: Nach dem Besuch der Galerie können die L die schönste „Kopie“ des Originals auswählen und prämiere","ein Bild pro Paar","PA","sitzen Rücken an Rücken","","","",""],["Alphabetstaffel","","Aktivieren","Einstieg","DaF WS","","","Die Spieler stellen sich hinter der Startlinie auf. Die Spielleitung gibt das Thema (etwa: \"Weihnachten\") bekannt.  Nach dem Startkommando läuft jeweils ein Spieler jeder Gruppe zu seinem Papierbogen und schreibt zu einem noch freien Buchstaben einen Begriff hin. Dieser Begriff muss mit dem jeweiligen Buchstaben beginnen und zum Thema passen. Beim Thema \"Weihnachten\" könnten etwa folgende Begriffe genannt werden: A => Advent, B => Bethlehem, C => Christkind, u.s.w. Anschließend laufen die Spieler zurück und der jeweils nächste Spieler der Gruppe darf einen Begriff eintragen.  Gewonnen hat die Gruppe, die zuerst alle Begriffe ausfüllen konnte (eventuell können schwierige Buchstaben wie Q und Y auch ausgelassen werden, oder Sonderpunkte bringen). Alternativ kann das Spiel auch nach einer gewissen Zeitdauer beendet werden.      Schwieriger wird es, wenn die Buchstaben in der alphabetischen Reihe bearbeitet werden müssen.     Eventuell darf auch einfach irgendein Spieler der Gruppe laufen, der einen Begriff weiß (anstatt einer fixen Reihenfolge im Team).","Packpapier","GA","freier Raum","","","",""],["Liedpuzzle","","Einstieg","DaF HV","","","","Das Lied in seine Zeilen zerlegen. Die L erhalten das zerschnittene Lied und müssen es während dem Hören rekonstruieren. In Gruppen von 2 – max. 4 Personen ordnen sie die Streifen während des Hörens neu. Je nach Lied brauchen Gruppen  2-3 Durchgänge.","Textstreifen","PA / GA","Gruppentische","","","",""],["Strophenmix","","DaF HV","Einstieg","","","","Variante zu \"Zeile für Zeile\": Statt die Zeilen auf einzelne Zettel zu schreiben, werden sie auf einem Blatt innerhalb der Verse vermischt. Das ist einfacher zum Vorbereiten und auch einfacher zum Lösen, da der Suchraum begrenzt ist.","AB","EA / PA","","","","",""],["Wörter zur Wahl 2","","DaF HV","DaF WS","","","","Einzelne Wörter durch ähnlich klingende ersetzen (L müssen genau hinhören und den Kontext verstehen).","AB","EA / PA","","","","",""],["Was nicht passt","","DaF HV","DaF WS","DaF GR","","","Liedtext komplett präsentieren, in den Text nicht passende Wörter einschmuggeln (max 1 pro Zeile bei langsameren Liedern, bei schnelleren weniger). Vor dem Hören die Wörter markieren, die vermutlich nicht passen, beim Hören kontrollieren und nicht Gehörtes streichen.","AB","EA / PA","","","","",""],["Geschichte ausschmücken","","DaF Schreiben","","","","","Den L als Impuls ein „Textskelett“ präsentieren, das sie durch Dialoge, Beschreibungen, Übertreibungen... interessant ausschmücken sollen. Die Stellen, an denen Ausschmücken möglich ist, können auch markiert sein. (Wenn wir im PL gemeimsam erzählen, können wir den Text auf Folie präsentieren.) Die Übung funktioniert mündlich wie schriftlich.","AB (oder beamen)","EA / PA / GA","","","","",""],["Geschichte mit Störung","","DaF Schreiben","","","","","Die L bekommen 5 verschiedene Titel angeboten. Die L, die den gleichen Titel gewählt haben, kommen in die gleiche Gruppe. Sie fangen an, gemeinsam eine Geschichte zum Titel zu schreiben. Nach einer Zeit werden sie vom Lehrer unterbrochen und bekommen einen Satz, den eine Storyfigur in der nächsten Etappe der Geschichte sagen soll / eine Figur oder Ort oder Gegenstand, die/der in die Geschichte eingebaut werden soll.","Titel auf Streifen","GA","","","","",""],["Ich-du-er-sie- wir...-Geschichten","","DaF Schreiben","","","","","Die erste Geschichte schreiben die L zu zweit. Beide schreiben je einen ersten Satz auf ein leeres Blatt Papier, in dem ein ich (mir, mich, mein etc.) vorkommt. Dann tauschen sie die Blätter aus und schreiben den zweiten Satz auf dieses Blatt. Sie tauschen wieder, schreibe den dritten Satz usw., bis beide Geschichten fertig sind. Dies geschieht nach dem Prinzip von Reihumgeschichten. Jetzt setzen sie sich mit einer anderen Zweiergruppe zusammen, verteilen die Geschichten untereinander, so dass jede/r eine Geschichte hat, an der er/sie nicht beteiligt war. Aufgabe: Eine neue Perspektive wählen: Auftrag: „Du betrachtest die Ich-Figur der Geschichte von außen als Sie oder Er und schreibe eine Sie- oder Er- Geschichte.” oder: „Du sprichst die Ich-Figur als Du an und führst ein (inneres) Gespräch mit ihr: Dies ergibt eine Du- Geschichte.” Im Prinzip lässt sich diese Aufgabe fortführen, indem die neu entstandenen Geschichten in der Gruppe wieder verteilt werden und weitere Perspektiven gewählt werden.","","PA","","","","",""],["“Kaputte” Texte rekonstruieren","","DaF Schreiben","","","","","Einen Text verrätseln: An die gewünschten Stellen Kaffeeflecken, Tintenflecke malen, Mottenlöcher imitieren, Brandstellen vortäuschen, Papierstreifen darüberlegen und so kopieren... oder gar die Hälfte des Textes wegwischen:","AB","EA / PA / GA","","","","",""],["Komposita-Gedicht","","DaF Schreiben","","","","","Zwei L wählen für sich ein zusammengesetztes Wort, das sie beide mögen oder das ihnen beiden wichtig ist. Sie schreiben jeweils zu einem Teil ein Gedicht mit 10 Zeilen. Anschließend setzen sie das Wort und auch die Gedichtteile wieder zusammen.","","EA --> PA","","","","",""],["Lückendiktat","","DaF Rechtschreibung","","","","","Die L bekommen einen Text mit Lücken (z.B. schwere neue Wörter, die sie gelernt haben, oder Wörter, die alle für die Übung einer bestimmten Regel ausgewählt wurden – ss oder ß, getrennt oder zusammen, groß oder klein...). Der Lehrer diktiert den Text, die L müssen nur die fehlenden Wörter schreiben.","AB","EA","","","","",""],["Mehrfachwahlgedicht","","DaF Schreiben","","","","","In einem Gedicht Lücken schaffen und für die Lücken jeweils 3-4 Auswahlmöglichkeiten anbieten. Die L schreiben das Gedicht neu, indem sie die für sie passendsten Wörter aussuchen.","AB","EA / PA","","","","",""],["Mix-Story","","DaF Schreiben","","","","","Die Gruppen (3-4 Personen) schreiben auf getrennte Zettel in verschiedenen Farben:  a) 3 Figuren, die in der Story vorkommen sollen b) zwei Orte, an denen die Story spielt c) eine Zeit, zu der die Story spielt  und evtl. auf einen vierten Zettel eine Textsorte (Märchen, Gruselgeschichte, Krimi, Abenteuer, Liebesgeschichte, fantastische Geschichte, Sage...)  Diese werden gemischt, jede Gruppe zieht von allen Stapeln und schreibt eine Geschichte.","Kärtchen in 3 Farben, dicke Stifte","GA","","","","",""],["Nachrichten zu Schlagzeilen schreiben","","DaF Schreiben","","","","","Aus einer Zeitung suchen die L (in PA) zwei Schlagzeilen aus, die sie interessieren. Sie schneidet die passenden Artikel aus, so, dass nur die Schlagzeile zu lesen ist, und der Platz, wo der Artikel war. Sie kleben das dann  auf ein Blatt Papier, schreiben ihre Namen dazu und pinnen es an die Pinnwand. Sie suchen sich eine Schlagzeile aus, zu dem sie gern einen Artikel schreiben wollen. Schreiben den Text und achten auf die W-s: Was? Wann? Wo? Wie? Warum? Mit welchen Folgen? Wenn sie fertig seid, geben den Text den Mitschülern, die die Schlagzeile ausgesucht haben und holen sich das Original zum Nachlesen ab. (Mögliche Weiterarbeit: Partnerkorrektur /Leseaufgabe:  Worum ging es im Original? Welcher Text war interessanter?)","Alte Zeitungen, Scheren","PA","","","","",""],["Quatsch-Geschichte","","DaF Schreiben","","","","","Die L schreiben X beliebige Wörter nach Angaben auf.. Danach bekommen Sie einen kleinen Text mit nummerierten Lücken, in den Sie ihre Wörter einsetzen können.","AB","EA / PA","","","","",""],["Quizaufgaben machen","","DaF Schreiben","DaF LV","","","","Quizaufgaben machen Die Lernenden sammeln aus ihren Schulbüchern oder recherchieren im Netz / in Lexika zu den DACH-Ländern und erstellen Quiz-Aufgaben füreinander.","Lexika, Schulbücher","PA / GA","","","","",""],["Rauf und runter","","DaF WS","DaF Schreiben","","","","Ein langes Wort (z.B: Radiergummi) einmal von oben und einmal von unten aufschreiben, so dass zwischen ihnen Platz zum Schreiben bleibt. Wörter dazwischenschreiben (erster und letzer Buchstabe ist durch das Wort bestimmt). Im Anschluss einen Text mit diesen Wörtern schreiben, die Reihenfolge ist beliebig.","Vokabelkartei","EA / PA / GA","","","","",""],["Reimwörter","","DaF WS","DaF Schreiben","","","","Wörter aus der Worschatzkartei suchen, die reimen. Oder zu angegebenen Wörtern mehrere Reimwörter suchen (aus der Kartei / aus dem Gedächtnis / aus dem Wörterbuch.) Mit den schönsten Reimwörtern ein Gedicht schreiben. Variante: In Gedichten das gelöschte Reimpaar rekonstruieren.","Wortschatzkartei / Liste mit Wörtern, Wörterbuch","EA / PA","","","","",""],["Reißverschlussgeschichten","","DaF Schreiben","","","","","Die Gruppe setzt sich um einen großen Tisch in einen Kreis. Alle nehmen ein leeres Blatt Papier. Dann schreibt jeder einen ersten Satz auf das Blatt, der ein Anfang einer Geschichte sein könnte. Wenn fertig, alle geben ihr Blatt nach rechts weiter. Satz auf dem Blatt lesen, und sich einen weiteren Satz ausdenken, der die Geschichte fortsetzen kann. Den Satz aber nicht aufschreiben, sondern genügend Platz dafür offen lassen. Danach einfach den dritten Satz auf das Blatt schreiben. Blatt wieder nach rechts weiterreichen. Zuerst die Lücke mit einem passenden Satz auf.füllen und dann wieder einen folgenden (den vierten) Satz ausdenken, den aber wieder wie vorher nicht hinschreiben, sondern nur eine Lücke offen lassen. Dann passend zum ausgedachten vierten Satz den fünften Satz schreiben... usw. Vor dem Ende ankündigen, dass jetzt nur noch 3-4 Sätze kommen werden, damit die L die Geschichten zu Ende schreiben können. Variante: Nach so vielen Sätzen aufhören, wie viele L wir in der Klasse haben, und jeder bekommt das Blatt mit dem eigenen Anfangssatz zurück – Geschichte dann beenden. (Hier Verantwortung für die sprachlichen Fehler übernehmen.) Danach wollen die L in der Regel alle Geschichten lesen, weil sie gespannt darauf sind, ob ihre gedachten Sätze erraten worden sind. (Geschichten herumgeben, an der Wäscheleine aufhängen, in der Bibliothek einer Mappe sammeln...","Papier","EA","Sitzkreis","","","",""],["Satzsalat","","DaF Schreiben","DaF LV","","","","Alle Wörter eines Textes werden kleingeschrieben und ungetrennt und ohne Satzzeichen niedergeschrieben. Die L sollen im Satzsalat die Satzzeichen ergänzen, die Großbuchstaben markieren und die Wörter trennen. (Evtl. auch den ganzen Text noch einmal korrekt niederschreiben.).","AB","EA / PA","","","","",""],["Sätze kleben","","DaF Schreiben","DaF LV","","","","Aus einer Zeitung schneiden die L Wörter aus, die sie verstehen. Sie kleben aus den Wörtern möglichst viele sinnvolle Sätze und kleben eine kleine Story / Nachricht zusammen. Variante für die Fortsetzung: Sätze in der Klasse “verkaufen” – aus den Sätzen so die Story schreiben.","Alte Zeitungen, Scheren, Klebestifte","EA / PA / GA","","","","",""],["Schlangengeschichten","","DaF Schreiben","","","","","Die L arbeiten in Kleingruppen (4-6. Sie zeichnen auf ein großes Papier eine lange Schlangenlinie  mit einem Schlangenkopf an einem Ende. Danach schreiben sie zusammen vom Kopf her der Schlangenlinie entlang einer Geschichte, indem sie abwechslungsweise jeden Satz je mit einer andern Farbe schreiben. Die so entstehenden Sätze sollen keinen Sinn ergeben, sie müssen aber grammatikalisch korrekt sein!","Packpapier","GA","Gruppentische","","","",""],["Schreibkarussell","","DaF Schreiben","DaF LV","Kooperation","","Bewegung","Die L  arbeiten in Kleingruppen. Jede Gruppe bekommt den Anfang einer möglichen Geschichte (selbst erfinden oder den Anfang von Kurzerzählungen nehmen, die die L nicht kennen). Die Gruppen schreiben die Geschichte fort, sie haben 10 Minuten Zeit. Danach lassen sie den Text liegen, sie gehen im Uhrzeigersinn weiter zum nächsten Tisch, lesen den Text, den sie vorfinden und schreiben ihn weiter. ...usw. Jeder Rundgang dauert dann etwas länger (12, 14, 16.. Minuten), da die L immer mehr lesen müssen, bevor sie weiterschreiben.Wenn die Gruppen zu ihrem eigenen Text zurückkehren, sollen sie die Geschichte beenden. Sie haben auch das Recht, Ungereimtheiten zu verbessern oder Lücken zu schließen. Die Texte werden dann entweder vorgelesen (jetzt gibt es wirliches Interesse, zumal jeder am Schreiben mitgewirkt hat) oder in der Klasse aufgehängt oder wieder im Karussellverfahren herumgereicht.","AB","GA","Gruppentische","","","Padlet Sandbox, Google Slides","Padlet Sandbox, Google Slides"],["Schreibkonferenz","","DaF Schreiben","Feedback","","","Autonom","Methode zur Überarbeitung / Korrektur von Schülertexten. Die L arbeiten in Kleingruppen (3-4 Personen). Alle Texte werden vorgelesen. Die Mitschüler sagen spontan ihre Meinung zum Inhalt (oder zu Fragen, die sie als Kriterienkatalog bekommen). Sie stellen Fragen zu inhaltlichen Einzelheiten, die ihnen unklar sind. Der Verfasser macht sich gegebenenfalls  Zeichen im Text, wo noch etwas verändert werden muss. Die L gehen den Text durch und besprechen sprachliche wie inhaltliche Aspekte. Der Verfasser markiert Stellen, die es möglicherweise ändern will, und notiert Vorschläge. Der Text wird auf Rechtschreibung durchgelesen (Tausch mit einem Partner). Anschließend überarbeitet der Verfasser den Text inhaltlich, sprachlich und orthografisch und gibt den Text ab – der Text wird 'veröffentlicht', d.h. vorgelesen, gedruckt, gestaltet ....","Kriterienkatalog, Markerstifte","GA","Gruppentische","","","",""],["Spiegelschrift","","DaF Schreiben","","","","","Einen Text auf OHP-Folie schreiben und absichtlich einige Fehler einbauen. Die Folie verkehrt auflegen – die L sollen nun den Text fehlerlos aufschreiben.","OHP, Folie","EA","","","","",""],["Sprechblasen puzzeln / ergänzen","","DaF Schreiben","","","","","In einer Bildergeschichte die Sprechblasen / oder Wörter aus den Sprechblasen löschen, die S sollen diese schreiben. Mögliche Hilfen: Texte / Wörter in einem Schüttelkasten.","AB oder beamen / Schüttelkasten","EA / PA","","","","",""],["Story aus der Tüte","","DaF Schreiben","","","","","Die L sitzen im Kreis. Jeder legt 1-2 Gegenstände in die Tüte. (L bitten, unterschiedliche Gegenstände reinzutun, nicht alle einen Kulli :-) Die Spielleiterin beginnt eine Geschichte. An einer Stelle unterbricht sie das Erzählen, gibt einer Freiwilligen die Tüte, sie holt einen Gegenstand heraus und erzählt die Geschichte weiter, so dass sie den Gegenstand in die Story hineinbaut. Spielregel: Mehr als nur einen Satz sagen!","größere Tüte oder Beutel, kleine Gegenstände","EA","Sitzkreis","","","",""],["Story der Möglichkeiten","","DaF Schreiben","","","","","Jeder L beschreibt in drei Sätzen eine alltägliche Situation. Sie fangen an, die Geschichte zu erzählen. An einer spannenden Stelle unterbrechen sie die Story und skizzieren einige mögliche Fortsetzungen: Eine normle, eine alltägliche, eine mögliche, aber nicht alltägliche, und eine fantastische. (Vorher ein Beispiel geben. z.B. Ein Hund läuft ohne Herrchen auf der Straße. Er überquert eine frequentierte Straße und …. kommt heil auf der anderen Seite n / bleibt in der Mitte ruhig stehen und macht ein Häufchen / der Hund wird von einem Bus überfahren / die Straße öffnet sich vor ihm und ein gigantischer grüner Hund mit 6 Pfoten ergreift den Hund und reißt ihn in die Tiefe.) Die L darauf hinweisen, nur Varianten aufzulisten, zu denen sie weitere Ideen haben. Danach bilden wir einen Stuhlkreis, jeder L liest den Anfang der Geschichte und die drei Varianten vor. Die Gruppe entscheidet, welche Variante in die Geschichte eingebaut werden soll.  Variante: L skizziert auf einem Blatt die Situation und gibt dem Nachbarn rechts weiter, er schreibt darauf mögliche Fortsetzungen und gibt den Zettel  zurück oder an den Nachbarn rechts weiter...","Papier","EA","Sitzkreis","","","",""],["Tabu-Storys","","DaF Schreiben","","","","","Die L schreiben einen Text, die Textsorte können sie selbst bestimmen. Die Buchstaben des Wortes TABU sind Tabu, sie müssen beim Schreiben ohne sie auskommen. (Einfacher: Kein Wort darf mit diesen Buchstaben beginnen.)","","EA / PA / GA","","","","",""],["Texte flicken","","DaF Schreiben","DaF WS","DaF LV","","","Alle Gruppen bekommen den gleichen kurzen Text. Jemand aus der Gruppe tippt mit dem Bleistift auf ein zufällig gewähltes Wort im Text und sagt, welcher Wortart das Wort gehört. Die Person, die rechts sitzt, sagt ohne lange zu überlegen ein Wort. Das neue Wort ersetzt das alte., der Schüler streicht das Wort durch und notiert darüber das neue, so dass es grammatikalisch an der Stelle des alten Wortes in den entsprechenden Satz passt, inhaltlich muss es jedoch keinen Sinn machen. Nun tippt jemand anders auf ein weiteres Wort, wenn er auf eine schon „geflickte” Stelle tippt, nimmt er eins der Nachbarwörter. ….","AB","GA","Gruppentische","","","",""],["Text schreiben mit Mind map","","DaF Schreiben","","","","","Zu einer vorbereiteten Mind map (oder selbst erstellen lassen) eine Geschichte schreiben: Vor dem Schreiben Äste nummerieren.","AB (Mind map)","EA / PA / GA","","","","",""],["Text weiterschreiben","","DaF: Schreiben","DaF LV","","","","Geeignet für Texte, die eine Handlung beschreiben (Erzählung, Bericht...) Die L schreiben den Text weiter bzw. schreiben einen Text darüber, was vor dem gehörten / gelesenen Text passierte. Es ist möglich, in der gleichen Textsorte zu bleiben oder die Textsorte zu verändern (die Lernenden können auch Tonaufnahmen machen). Eine Mischung aus reproduktivem / produktivem Umgang mit dem Text.","AB (Textanfang)","EA / PA / GA","","","","",""],["Textgerüst ergänzen","","DaF Schreiben","","","","","Das Gerüst eines Textes (möglichst große Lücken, die eine inhaltliche Variation erlauben) sinnvoll mit eigenen Ideen ergänzen. Optimal für Briefe und für Texte mit einer festen Struktur.","AB","EA / PA","","","","",""],["Textsortenwechsel","","DaF Schreiben","DaF LV","","","","Den Text dramatisieren: Ein Hörspiel, ein kurzes Stück schreiben, aufnehmen / vorführen. Vorher notwendige Techniken einführen: Drehbücher studieren / Checkliste geben (z.B. beim Hörspiel: Text, Instruktionen für die Sprecher, Hintergrundgeräusche, Pausenmusik....) Möglich ist auch die Umgestaltung in Bildergeschichte / Comics (hier auch: Bild + Sprech- oder Denkblasen + Geräuscheblasen + kurze Verbindungstexte.)","Textvorlage (AB)","PA / GA","","","","",""],["Trennwanddiktat","","DaF Rechtschreibung","","","","","Einen Text „halbieren“: zweimal kopieren und aus jedem Text andere Informationen löschen oder das Blatt einfach knicken und so zweimal kopieren. Die L arbeiten in Partnerarbeit: Je zwei Schüler bekommen die Hälfte des Textes und eine Trennwand. Sie diktieren einander ihre Texthälften.","Text halbiert und in 2 AB verteilt (mit Platz zum weiterschreiben und ergänzen)","PA","","","","",""],["Wortlawinengerüst","","DaF Schreiben","","","","","Zu einem vorgegebenen Thema wird in Kleingruppenarbeit ein Gedicht geschrieben. Die erste Zeile besteht aus einem Wort, die zweite aus zwei Wörtern, die dritte aus drei Wörtern und so weiter. Man einigt sich auf eine Zahl von Wörtern bzw. Zeilen und führt den Text dann mit abnehmender Zahl zu Ende.","AB (Schablone)","EA / PA","","","","",""],["Zehn kleine Schreiberlein","","DaF Schreiben","DaF Sprechen","","","","Jeder L gibt vor dem Schreiben an, wie lange er/sie jetzt gern schreiben möchte. (Min. 10 Minuten, max. Länge der Stunde Minus etwa 20 Minuten). Die Angaben in einer Reihenfolge n der Tafel festhalten, mit dem L mit der längsten Schreibzeit anfangen. Wenn mehrere die gleiche Zeit angegeben haben, Reihenfolge auslosen. Alle schreiben los, schreiben etwa 5 Minuten lang. Die L sitzen im Sitzkreis. Der L mit der längsten Schreibzeit beginnt, er liest seine Geschichte vor und die Gruppe diskutiert, wie sie die Geschichte fortschreiben würde. (Nur Rahmen, keine Details.) Wenn der Rahmen fertig ist, geht der Schreiber aus dem Raum oder geht aus dem Kreis, setzt einen Kopfhörer auf und schreibt so lange, wie er vorher angegeben hat.  So verfahren wir mit allen „Schreiberlein“.","Tafel / Flipchart","EA --> PL --> EA","Sitzkreis und Einzelarbeitsplätze","","","",""],["Zeitungsstory kleben","","DaF Schreiben","Kooperation","","","","Die L schneiden aus aus alten Zeitungen und Magazinen Wörter aus, die sie kennen und kleben sie so auf, dass sie aus den Wörtern Sätze – oder vielleicht eine Ministory bekommen. Die Storys werden danach ausgehängt und gelesen.","Alte Zeitungen, Scheren, Klebestifte","PA / GA","","","","",""],["Nachricht mit Funkstörung","","DaF Schreiben","","","","","Der Spielleiter liest eine Nachricht oder einen Bericht so vor, dass er nur die ersten Wörter der Sätze und die Satzzeichen vorgibt. Die L schreiben mit. Dann machen sie daraus einen Bericht, der zuletzt mit dem Original verglichen wird.","Original als LB","EA","","","","",""],["Artikeltischtennis","","DaF WS","Wiederholung","","","Wettbewerb","Gespielt wird zu zweit, nach den Regeln vom Tischtennis – oder in einer vorher vereinbarten Zeit. Ein L nennt ein Wort, der Partner muss soll den Artikel nennen. Ist seine Antwort korrekt, nennt er ein nächstes Wort. Nennt einer von ihnen einen falschen Artikel, bekommt der Partner einen Punkt.","","PA","","","","",""],["Begriffe-Scrabble","","DaF WS","Einstieg","Kennen lernen","","","Das zentrale Wort der neuen Einheit / das wichtigste Wort für eine Person / den eigenen Vornamen / eine Stadt, die man gern hat... o.ä. quer auf ein Blatt schreiben und zu jedem Buchstaben wie beim Scrabble-Spiel weitere Wörter notieren, die mit dem Ausgangswort etwas zu tun haben. Eignet sich auch als Kennenlernaktivität / als Einstieg in das neue Thema / als Abschluss eines Themas.","Blätter","EA","","Begriffe-Scrabble.jpg","","",""],["Beziehungsweise","","DaF WS","Einstieg","","","","Die L ziehen aus ihrer Vokabelkartei jeweils 2 Kärtchen. Sie suchen gemeinsam Wörter, die etwas mit beiden zu tun haben und erklären den Zusammenhang.  Auch als Wettspiel möglich, die L machen Aufgaben füreinander. Für Einstieg in ein neues Thema: Bezug zum Thema erklären. (Keine gezielte Auswahl von Wörtern!)","Vokabelkartei","EA / PA","","","","",""],["Bilder übersetzen","","DaF WS","","","","","In einem Text sind einige Wörter, die die L kennen, als Bild dargestellt ist, Aufgabe ist, den Text auf Deutsch zu schreiben.","AB","EA / PA","","","","",""],["Bingo","","DaF WS","","","","Wettbewerb","Jedes Paar / jeder L bekommt ein leeres Raster und trägt Zahlen von 1 bis 20 ein. Jede Zahl darf nur einmal aufgeschrieben werden. Ein L bekommt als Spielleiter die Schachtel mit den Zahlen-Kärtchen. Der Schüler zieht nacheinander Kärtchen und liest die Zahl vor. Die anderen Schüler streichen die genannte Zahl aus. Ziel ist, horizontal, vertikal oder diagonal eine Reihe mit vier durchgestrichenen Zahlen zu bekommen:","Raster (AB)","EA / PA","","","","",""],["Domino-Spiel","","DaF WS","","","","Wettbewerb","Gespielt wird in Gruppen (3-4 Spieler). Jeder Spieler bekommt 7 Steine. Der Rest wird verdeckt in die Mitte gelegt. Die Spieler legen abwechselnd Steine an einem der beiden offenen Enden an. In jeder Runde kann man nur einen Stein anlegen, und man muss begründen, worin der Zusammenhang zum anderen Stein besteht (z.B. Hier: „Sportschuh – Inlineskater – beide sind Sportartikel, beide trägt man am Fuß”, „Taschenrechner – Kamera – beide brauchen Batterien”. ) Wenn jemand nicht legen kann, zieht er Steine aus dem Vorrat. Wenn der Vorrat aufgebraucht ist, nimmt er einen Stein vom Ende auf die Hand. Das Spielt endet, wenn ein Spieler keine Steine mehr hat. Geht auch mit Präfixverben (einzelne Präfixe kommen mehreren Kätchen vor).","Dominosteine","GA","Gruppentische","domino.jpg","","",""],["Geheimschrift","","DaF WS","","","","Rätsel","Die Wörter aus der vorigen Stunde oder ein Text, der diese enthält, wird nach einem Chiffre-System, das den S bekannt ist, chiffriert, die L sollen die Wörter – oder einen Text entschlüsseln. (Am Ende kann die Botschaft auch in die MS übersetzt werden – für Agenten, die nicht dt. können, wenn auch das Ziel ist, zu kontrollieren, ob die L die Bedeutung kennen.)","AB / Kärtchen","EA / PA","","","","",""],["Wortkonturen","Word shape","DaF WS","Einstieg","","","Wiederholung","Wiederholung - kombinierbar mit der Vokabelkartei: Wörter (aus der vorigen Stunde / aus der Einheit) als Silouette malen (Buchstaben mit Überlängen und Großbuchstaben: großer Kasten, normale Buchstaben: halb so groß, Buchstaben mit Unterlängen: groß, nach unten). L schreiben auf, welches Wort gemeint ist.","Vokabelkartei","EA / PA / GA","","shape.jpg","","",""],["Ich-Wortschatz","","DaF WS","","","","","Eignet sich zur Systematisierung des Wortschatzes: Die L sammeln Wörter zu „Wörter, die ich mag“, „Wörter die ich nicht mag“ / „Dinge, die ich mag – Dinge, die ich nicht mag“ oder sortieren / wählen Wörter aus einem persönlichem Gesichtspunkt aus.","","EA","","","","",""],["Kamm-Rätsel","","DaF WS","","","","Rätsel","In den markierten Feldern gibt es immer den gleichen Buchstaben ODER in die Buchstaben von oben nach unten zusammengelesen ergibt sich ein Lösungswort (ein Wort, das die L nicht kennen – gern Eigennamen z.B.)","AB","EA / PA","","kammraetsel.png","","",""],["Kettenübung","","DaF WS","","","","","Reihum wird eine Frage nach einer relativ einfachen Regel von allen beantwortet oder ein Satz mit einigen Variationen gesagt bzw. immer um ein weiteres Glied ergänzt. Dafür bietet sich ein Stuhlkreis an. Beispiel: Das beliebte Kofferpacken-Spiel oder die Wortschlange oder „Onkel Willy“.","","PL","Sitzkreis","","","",""],["Kriss-Kross","","DaF WS","","","","Rätsel","Kreuzworträtsel der leichten Art (zumindest für die Herstellung): Die Wörter kreuzen sich an einigen Stellen. Auch möglich als Aufgabe zur Wortschatzkartei: Die L ziehen einige Karten und basteln dazu ein Rätsel.","Vokabelkartei, AB / Papier","EA / PA","","krisskross.png","","",""],["Kuckucksei","Was passt nicht?","DaF WS","","","","","Die gelernten Wörter werden in 3er, 4er oder 5er Gruppen angeboten: Eins der Wörter passt aus einem bestimmten Grund nicht in die Reihe. Die L sollen das „Kuckucksei“ – das nicht passende Wort finden und den Grund nennen, weswegen das Wort nicht passt. (Elefant / Affe / Ente / Kuh; den Computer: ausschalten / installieren / ausdrucken / herunterfahren). Solche Übungen können die S auch selbst für ihre Mitschüler basteln. Kontrolle mit einem Lösungswort, das sich aus den Buchstaben vor den Wörtern ergibt. (ein neues Wort oder ein Eigenname)","AB / beamen","EA / PA","","welches_wort_passt_nicht_genial_A1.JPG","","",""],["Magisches Quadrat","Suchquadrat","DaF WS","Input","","","Selbstkontrolle","In einem Quadrat von etwa 20x20 Feldern sind waagerecht, senkrecht und diagonal, in richtiger Reihenfolge der Buchstaben bzw. auch rückwärts geschrieben (dies ist schon ganz schwer...) die Wörter versteckt. Leichtere Variante: Die Anfangsbuchstaben sind markiert. Nach der Suche können die Schüler die Wörter auf dt. erklären, die Entsprechung in der MS aufschreiben, mit den Wörtern einen Text schreiben... Kontrolle: Kontrollblatt mit den markierten Wörtern.","AB, Markerstift","EA","","magisches_quadrat.png","","",""],["Mit Wörterbausteinen üben","","DaF WS","","","","","Aus Texten / aus dem Wörterbuch / aus der Wortschatzkartei / aus dem Gedächtnis Wörter suchen, die einen bestimmten Wörterbaustein enthalten. Aus diesen können die besten X ausgesucht werden, die in eine Geschichte eingebaut werden.","Packpapier / DIN A3-Blätter","PA / GA","","bausteine.jpg","","",""],["Motten in Wörtern","","DaF WS","","","","Rätsel","Fehlende Buchstaben in bekannten Wörtern ohne Wörterbuch oder in neuen Wörtern mit einem Wörterbuch rekonstruieren. Die L können die Motten-Rätsel auch füreinander erstellen - z.B. mit Karten aus der Vokabelkartei.","Vokabelkartei, AB / beamen","EA / PA","","motten.png","","",""],["Nonsenssätze reparieren","","DaF WS","","","","","Die „Fehler“ im System entdecken und sinnvolle Sätze schreiben. (z.B. \"Julia isst nach dem Frühstück schnell noch ihren Hamster. Wir turnen in der Jugendherberge im Schlafsack...)","AB","EA / PA","","","","",""],["Quartett-Spiel","","DaF WS","DaF GR","","","Wettbewerb","Der Lernwortschatz wird in thematisch zusammenhängende 4-er-Blöcke geordnet und auf Spielkarten verteilt.  Man braucht pro Grup-pe einen Satz von min. 8 x 4 Karten. Gespielt wird in 3-5er-Gruppen. Die Karten werden ge-mischt und innerhalb der Gruppe verteilt. Die Spieler sollen nun ver-suchen, vier Karten, die zusammengehören, durch Fragen zu bekommen. Wenn jemand nach einer Karte gefragt wird und sie nicht hat, darf er/sie weiterfragen. Wer ein komplettes Quartett hat, kann es ablegen.  Wer zuerst alle Karten abgelegt hat, ist Sieger.","Spielkarten","GA","","","","",""],["Reihen bilden / Reihen ergänzen","","DaF WS","","","","","Angegebene Wörter müssen in eine Reihe geordnet werden (neu schreiben, nummerieren, in ein Skala eintragen...).  bummeln &#61680; schlendern &#61680; gehen &#61680; laufen &#61680; rennen Variante: Angefangene Reihen müssen fortgesetzt oder an leer gelassenen Stellen ergänzt werden. eiskalt &#61680; kalt &#61680; ................. &#61680; warm &#61680; ................. : eiskalt &#61680; kalt &#61680; lauwarm &#61680; warm &#61680; heiß","AB / beamen","EA / PA","","","","",""],["Silbenrätsel","","DaF WS","","","","Rätsel","Die Wörter werden in Silben zerlegt und alphabetisch geordnet. Wie bei einem Kreuzworträtsel werden Definitionen oder die Entsprechungen in der MS angegeben. Die S sollen aus den angegebenen Silben die passenden Wörter zusammensetzen. (Als Hilfe kann man die Anzahl der Silben angeben oder den Wortanfang mit Großbuchstaben markieren.) Die L können das Rätsel auch füreinander erstellen - z.B. mit Wortkarten aus der Vokabelkartei (ABC-Register oder aktuelle Einheit).","Vokabelkartei, AB","EA / PA","","","","",""],["Silbensalat","","DaF WS","Wiederholung","","","Rätsel","In den Wörtern / Ausdrücken werden Silben umgetauscht, die L schreiben das Wort korrekt auf. Nuße mit Sodeln = ?  Hähnlat mit Sachen = ? Brattoffeln mit Karwurst = ? Schweinedel mit Knöbraten = ?   Wurstkraut mit Sauerchen = ?","Vokabelkartei, AB / beamen / Kärtchen","EA / PA","","","","",""],["Stadt-Land-Fluss","","DaF WS","Wiederholung","","","Wettbewerb","L suchen nach einem vorgegebenen Raster mit unterschiedlichen Anfangsbuchstaben Wörter nach mehreren Oberbegriffen. Diese Wörter haben immer den gleichen Anfangsbuchstaben wie vorher vereinbart.  Schwierigere Variante: Artikel verlangen! Mögliche Oberbegriffe, je nach Wissensstand der L zu variieren: Stadt, Land, Pflanze, Menschen, Berufe, Obst, Gemüse, Spielzeug, Getränk, Name, Automarke,...","Raster","EA / PA / GA","","","","",""],["Teekesselchen","","DaF WS","","","","Rätsel","Jeder L / oder Gruppen sammeln zuerst Homonyme. Dann sagt / sagen sie etwas über die zwei Dinge aus:  Bank : “Mein Teekesselchen ist aus Holz” – “Mein Teekesselchen ist aus Steinen, Beton, Glas...” / “Auf meinem Teekesselchen kann ich mich ausruhen” – “In meinem Teekesselchen kann ich Geld abheben”.... usw.  Es geht solange, bis der Partner oder jemand aus den anderen Gruppen nicht die beiden Wörter herausfindet.","","GA","","","","",""],["Vokabelfußball","","DaF WS","Wiederholung","","","Wettbewerb","Wir bilden zwei Mannschaften. Als Vorbereitung überlegen die Mannschaften schwierige Wörter und machen eine Liste.  „Anstoß“: Die KL nennt ein Wort (Dt oder MS) oder einen Satz, in dem ein Wort fehlt oder Synomye, Antonyme, eine Erklärung – die Mannschaft, die als erste das gesuchte Wort nennt (schreit), darf den Ball eine Position weiter in Richtung gegnerisches Tor schießen. Jetzt müssen sie stürmen und der anderen Mannschaft eine Aufgabe geben, die den Ball „abwehren“ muss (nicht lange überlegen, das erstgenannte Wort zählt!). Können sie den Ball abwehren, spielen sie in die andere Richtung. Können sie die Bälle nicht abwehren, können sie in 4 Schritten ein Tor erzielen. Dann steht es 1:0, anschließend spielt man einfachheitshalber wieder von der Mittellinie.  Die Spielzeit (zwei Halbzeiten, evtl. mit einer Pause für Stärkung – Durchblättern der Vokabelkartei) müssen wir vorher vereinbaren.","Das Spielfeld wird an die Tafel gezeichnet oder die Vorlage auf eine Folie kopiert. Spielfigur: Magnet / Bild mit Blu-tack (Tafel). Oder Spielfeld als Bild in Padlet Sandbox einfügen – Seite beamen  (Ball als Bild, Hintergrund entfernen)","GA --> PL","","vokabelfu_ball_klein.jpg","Bild: Trippó Sándor","Sandbox, Bildschirm teilen","Sandbox, Bildschirm teilen"],["Akzent markieren","","DaF WS","","","","","Beim Hören die akzenttragende Silbe / das akzenttragende Wort markieren.","Liste mit Wörtern (AB)","EA","","","","",""],["Wort-Stationen","","DaF WS","","","","Vokabelkartei","Kärtchen mit den neuen Wörtern / mit den Erklärungen (dt) der neuen Wörter in Augenhöhe an die Wand kleben / auf die Tische legen. Die L gehen an den Kärtchen vorbei und markieren die Wörter, die sie erklären / auf Dt. nennen können Im PL durch Zuruf die Wörter kontrollieren (absteigend mit dem Kärtchen anfangen, die die meisten Markierungen bekommen haben).","Kärtchen, blu-tack","EA  --> PL","","","","",""],["Wortbildungsübung","","DaF WS","","","","","Aus angegebenen Substantiven bzw. aus Substantiven und Suffixen, aus Verben und Präfixen... sollen die S möglichst viele zusammengesetzte und abgeleitete Wörter bilden. (Hinweis auf Wortbildungsregeln – Artikel, Fugenelemente... ist vorher hilfreich!). Die Lösungen können mit einem Wörterbuch kontrolliert werden.","AB, Wörterbuch","PA / GA","","","","",""],["Buchstabensalat","","DaF WS","","","","Rätsel","Die Buchstaben der Wörter durcheinandermischen - L schreiben das richtige Wort auf. (Leichter, wenn der Anfangsbuchstabe markiert ist - oder wenn man die Definition angibt.)","AB","EA / PA","","buchstabensalat.png","","",""],["Wortsalatdiktat","","DaF WS","","","","","Ein L denkt sich ein Wort aus und schreibt es auf. Er buchstabiert dann das Wort in einer beliebigen Reihenfolge. Die anderen L schreiben die Buchstaben auf und versuchen das Wort zu erraten.","","PL","","","","",""],["Wortschlange","","DaF WS","","","","Kettenübung","Einfache Variante: Aufzählung der neuen Wörter als Kettenübung - die neuen Wörter aneinanderbinden, indem das nächste Wort mit dem letzten Buchstaben des vorigen Wortes beginnt. Komplizierte Variante: Der erste L erklärt ein Wort, der nächste nennt das Wort und erklärt ein Wort, das anschließen kann... usw.","","PL","","","","",""],["Wortspirale","","DaF WS","Einstieg","","","Rätsel","Rätsel wie üblich vorbereiten, die Lösungswörter sind in einer Spirale untergebracht.  Variante: Der letzte Buchstabe des ersten Wortes ist der erste Buchstabe des nächsten Wortes.","AB","EA","","wortspirale.jpg","","",""],["Wörtermontage","","DaF WS","","","","","Längere Wörter ergänzen: Das Ende finden (Zuordnungsübung) und die Mitte frei ergänzen.","AB","EA / PA","","wortermontage.jpg","","",""],["Wörter ordnen","","DaF WS","","","","","Wörter ohne Hilfestellung oder zu nach einem angegebenen Schema (Tabelle / Grafik)  ordnen.","Wortliste, AB","EA / PA / GA","","","","",""],["Zeitungswörterbuch","","DaF WS","","","","Wettbewerb","Die L sammeln aus alten Zeitungen und Magazinen Wörter , die sie schon kennen oder erkennen. Sie machen eine Liste – oder wenn die Zeitung nicht mehr gebraucht wird, schneiden die Wörter aus und kleben die ausgeschnittenen Wörter auf Packpapier. Sie schreiben dazu Wort in ihrer Muttersprache dazu. Mögliche Ordnungsprinzipien: alphabetisch, thematisch, nach persönlichen Aspekten. - Kann auch als Wettbewerb zwischen Gruppen organisiert werden, mit verschiedenen Kategorien: die meisten Wörter, das längste Wort, die meisten Verben....","alte Zeitungen","EA / GA","","","","",""],["Zuordnungsübung","","DaF WS","DaF GR","","","","Bild und dt. Wort / dt. Wort und Wort in der Muttersprache / dt. Wort und Erklärung auf dt. / Wort und Synonym / Wort und Antonym / Substantiv und dazu passendes Verb oder Adjektiv.... werden in zwei Spalten oder zwei Kästchen oder in einer witzigen Zeichnung aufgelistet. Kontrolle: Pfeile (Overlayfolie), mit einem Lösungswort, mit Puzzlekarten, die umgedreht ein Bild ergeben, mit einem Codewort, mit einem Rätselbild (Nummer sollen der Reihe nach in einem Bild miteinander verbunden werden..)","AB","EA / PA","","","","",""],["Wörter im Wort","","DaF WS","","","","","Man einigt sich in der Gruppe auf ein möglichst langes Wort. Die TN versuchen in Gruppen möglichst viele verschiedene Wörter aus den Buchstaben des langen Wortes zu bilden. Dabei müssen nicht alle Buchstaben verwendet werden. Sie schreiben 1-2 Minuten lang alle Begriffe auf, die ihnen einfallen. Pro Begriff wird 1 Punkt gutgeschrieben. Wenn ein Begriff nur von einer Person gefunden wurde, gibt's dafür 2 Punkte.","","GA","","","","",""],["Amnesiaparty","","Aufwärmen","DaF Sprechen","","","Bewegung","Kärtchen mit Namen von bekannten Personen / bekannten fiktiven Figuren aufschreiben. Jeder L bekommt eine Karte auf seinen Rücken geheftet, geht herum, stellt den anderen Mitschülern Fragen, die sie mit ja/nein beantworten dürfen.  Eine Person darf man solange fragen, bis er/sie eine Frage mit ja beantwortet.  Ziel ist, dass die L herauszufinden, wer sie sind.  Gelingt es ihnen, spielen sie weiter als „Helfer” bei der Identitätssuche der anderen mit. Prinzip auch auf andere Frage-Ratespiele übertragbar.","Kärtchen, Wäscheklammer / Büroklammer","CP","","","","",""],["Dialogplan","","DaF Sprechen","DaF HV","","","","Enthält nur Stichwörter aus einem Dialogtext / einem entworfenen neuen Dialog. Mögliche Aufgaben: beim Hören unter mehreren Dialogplänen den richtigen auswählen; beim Hören die Fehler in einem Dialogplan korrigieren,  Originaldialog / neuen Dialog mit dem Dialogplan spielen; Dialogplan aus einem Dialogtext schreiben; vor / nach dem Hören den verpuzzelten Dialogplan ordnen; Dialogteile nach einem Dialogplan ordnen und Dialog spielen","Dialogplan","PA","","Babysitter_aufgabe.jpg","","",""],["Aus drei  mach zwei","","DaF Sprechen","","","","","Jede Gruppe erhält einen Satz Karten. Es werden immer drei Karten gezogen. Die Gruppe wählt daraus zwei Karten aus, die ein gemeinsames Merkmal haben, das für die dritte Karte nicht zutrifft. Der Spielverlauf wird auf einem Protokollblatt festgehalten. Die Kartennummern und das Auswahlkriterium werden notiert und ggf. in deutscher Sprache erläutert.  Die Karten werden zurückgelegt, neu gemischt und das Spiel mit einer neuen Runde fortgesetzt.  Variante:  Die Karten werden nicht zurückgelegt und das Ziehen wird solange fortgesetzt, bis der Stapel abgearbeitet ist.","Karten","GA","","","","",""],["Augenzeugen","","DaF Sprechen","","","","","Ein detailreiches Bild nach und nach um Personen erweitern, die L beschreiben in Kleingruppen aus den verschiedenen Perspektiven, was sie beobachtet haben.","Wimmelbild","GA / PL","","kep1v_mark.jpg","","",""],["Schlüssellochprinzip","","DaF Sprechen","","","","","Bild auf eine Folie kopieren und langsam mit einem größeren Blatt mit einem Loch in der Mitte abfahren.  L beschreiben, was sie erkennen und spekulieren über das Gesamtbild.","Wimmelbild, OHP + Folie + Abdeckblatt mit einem Loch, Smartboard","PL","","kep5v.JPG","","",""],["Adventskalender","","DaF Sprechen","Wahrnehmung","","","","Bild auf eine Folie kopieren und mit einem Blatt abdecken, in dem kleine Fenster ausgeschnitten sind. Die Fenster nach und nach öffnen, dabei vom weniger wichtigen zum wichtigen Detail hin arbeiten. Die L beschreiben, was sie sehen und stellen Vermutungen über das Gesamtbild auf.","Folie, OHP, Abdeckblatt mit nummerierten Fenstern","PL","","kep7.JPG","","",""],["Abdeckblätter","","DaF Sprechen","Wahrnehmung","","","","Für Bilder mit überraschendem Pointe: Bild auf eine Folie kopieren, Teile mit speziellen Abdeckblättern abdecken und diese nach und nach entfernen. L beschreiben, was sie sehen und stellen Vermutungen über die noch abgedeckten Teile auf. Hier auch vom weniger wichtigen zum wichtigen Detail hin arbeiten.","Bild, Folie, Post-its / Zettel und etwas zum Beschweren","","","kep2.JPG","","",""],["Abdeckstreifen","","DaF Sprechen","Wahrnehmung","","","","Durch Abdecken von Bildteilen (Bild auf Folie) oder durch bewusst falsches Kopieren Teile des Bildes unkenntlich machen. L beschreiben die Teile, die sie erkennen und spekulieren über die fehlenden Teile.","Bild auf Folie, Papierstreifen / AB: Bild mit Streifen kopieren","PL","","kep3.JPG","","",""],["Von links nach rechts","","DaF Sprechen","Wahrnehmung","","","","Bild auf eine Folie kopieren und mit einem Blatt Papier langsam abfahren. L beschreiben den Ausschnitt, den sie sehen und stellen Hypothesen über das Gesamtbild auf.","Folie, Abdeckblatt","PL","","kep4.JPG","","",""],["Bild vertonen","","DaF Sprechen","Aktivieren","Kreativität","Kooperation","","Gemälde oder bekannte Fotos nachstellen: als Vorbereitung Sprechblasen schreiben, dann Rollen verteilen und „vertonen”. Bild einfach in eine Szene verwandeln: die nächsten X Szenen langsam entwickeln (wie eine Zeitlupe)","Bilder","PA / GA","","","","",""],["Brettspiel","","DaF Sprechen","DaF WS","DaF Grammatik","","Wettbewerb","Geeignet sind alle Brettspiel-Vorlagen, Schlangen und Leitern, Spirale... Aufgabenfelder: Der Spieler liest die Aufgabe laut und versucht, sie zu lösen. Richtige Lösung: Er bleibt stehen und darf bei der nächsten Runde weiterspielen. Keine oder falsche Lösung: Er muss ein Feld zurückgehen und dort die entsprechende Frage beantworten.  Joker-Felder: Der Spieler darf die entsprechende Zahl Felder vorgehen. Pausen-Felder: Der Spieler muss eine Runde aussetzen. Teufel-Felder: Der Spieler muss die entsprechende Zahl Felder zurückgehen. oder einfach so: Sätze sinnvoll beenden – die Mitspieler entscheiden, ob sie die Lösung akzeptieren.","Spielbrett, Puppen / Steine / kleine Gegenstände, Würfel","GA","","","","",""],["Der heiße Stuhl 2","","Erfahrung","Diskussion","DaF Sprechen","","","Anlass: aktuelle, allgemein wohl bekannte Themen. Impuls: Zitat, Lese-/Hörtext. In der Mitte der heiße Stuhl mit dem Experten / Verantwortlichen (beim ersten Durchlauf einen sehr aktiven L wählen, der eine hohe Akzeptanz in der Gruppe genießt und ein gewisses Talent fürs Schauspielern hat), neben ihm 1-2 Stühle für “offizielle Helfer” und 1-2 Stühle für die Opposition, sowie einige freie Stühle, die kurz, jeweils für eine Wortmeldung belegt werden können. Im Kreis herum sitzen die im Moment nich Aktiven (Lehrer auch). Die L, die sich zum Wort melden und einen der Stühle besetzen, stellen sich kurz (mit ihrer Rolle) vor. Die Rollen werden nicht zugeteilt und können während der Simulation gewechselt werden, vor allem bei „heißen” Themen sind manche L sehr dankbar dafür, dass sie sich hinter Rollen verstecken können. Das Spiel kann in einer echten Diskussion münden.","","PL","Halbkreis aus Stühlen, vorne der heiße Stuhl und Stühle für Opponenten und Verteidiger + ein freier Stuhl","hot_seat.jpg","","",""],["Detektive / Müll-Detektive","","DaF Sprechen","","","","","Die L bekommen Listen mit Sachen (Inhalt von Mülltonnen, Einkaufszettel, Restaurantrechnungen...). Sie spekulieren in Kleingruppen über die Personen und machen eine Liste, was alles sie über sie erfahren haben. Sie können auch Szenen nachspielen, Entscheidungen treffen und begründen...","Listen (AB)","PA / GA","","","","",""],["Dreierstory","","DaF Sprechen","","","","","Jede Erzählgruppe besteht aus 3 Lernenden. Sie verteilen unter sich die folgenden Rollen:  Einer ist für „Action“ – für Handlung, eine für „Ton“ – für die Dialoge und Monologe und eine für „Bild“ – für die Beschreibung von Orten und Figuren... zuständig.  Handlung fängt an. Immer wenn eine/r von den beiden eine Idee hat, unterbricht sie die Handlung mit ihrem Beitrag. So wird die Story langsam weitergesponnen.","","GA","","","","",""],["Wisch und weg","","DaF Phonetik","Gedächtnis","","","","Ein kurzes und gut merkbares Gedicht (6-8 Zeilen) zuerst laut vorlesen, danach besprechen, wo die Satz- und Wortakzente liegen, wo macht man Pausen, wie sieht die Intonation aus. Diese im Text markieren. Dann das Gedicht ein- zweimal gemeinsam, im Chor vorlesen.   Danach in jeder Zeile ein Wort wischen (wenn das Gedicht reimt, soll jeweils eines der Reimwörter erhalten bleiben). Gedicht wieder vorlesen und die geschaffene Lücke rekonstruieren. In der nächsten Runde wieder pro Zeile ein Wort wischen... usw. Am Ende bleibe
