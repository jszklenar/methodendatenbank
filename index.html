uss kein Kunstwerk sein, Schritt 2: Präsentationen, à ca. 10 Min: Jetzt stellt jeder seinen Lebensweg vor. Während ein TN seinen Weg beschreibt, achten die anderen auf Werte und Prägungen, notieren diese und geben hierzu eine Rückmeldung. Welche Werte sind ersichtlich? Was ist wichtig im Leben? ACHTUNG: Die Offenheit, auch die Dinge im Leben zu benennen, die schwierig waren sind bei dieser Methode wichtig, denn oft sind sie es, die uns zu dem gemacht haben was wir sind.","Flipchartpapier","EA > pA / GA / PL","","","https://www.trainer-lounge.net/download/methode_lebensweg.pdf","",""],["Das WOW-Effekt","","Reflexion","Feedback","","","","s. Anhang","A3-Blätter","EA","","methode_wow-effekt.pdf","","",""],["Bewegungskanon","","Aktivieren","","","","Bewegung","Bitte alle TN aufzustehen und deine Bewegungen nachzumachen: 3 x in die Hände klatschen 3 x auf die Oberschenkel schlagen 3 x die Hände in die Luft strecken 3 x mit den Füßen auf den Boden stampfen &#9733; Sobald dieser Grundablauf sitzt, erhöhst du nach und nach den Schwierigkeitsgrad: Stufe 1: Teile die Gruppe in 2 Hälften. Gruppe 1 beginnt den Kanon. Wenn sie sich zum ersten mal auf die Oberschenkel schlagen, beginnt Gruppe 2 Stufe 2: Teile deine TN in insgesamt vier Gruppen und dirigiere erneut","","PL","","","","",""],["Be happy","","Reflexion","Motivation","","","","Selbstreflexion und um aus der Negativspirale rauszukommen. Regelmäßige Reflexion, für jeden Tag! Die TN überlegen drei Dinge, die an dem Tag gut gelaufen sind und warum sie ihrer Meinung nach gut gelaufen sind. Es muss eine greifbare Aufzeichnung sein.","Notizbuch","EA","","","","",""],["Zirkuläres Feedback","","Feedback","","","","","Jeder TN schreibt seinen Namen auf einen Zettel, faltet ihn und wirft ihn in eine Schale. Aus dieser Schale zieht jeder einen Zettel. Achte darauf, dass niemand seinen eigenen Namen zieht. Reihum beantwortet nun jeder max. 3-4 Steuerungsfragen aus der „Ich-Perspektive“ desjenigen TN, dessen Namen er gezogen hat. Am besten startet er mit dem Satz „Ich bin (Name) ...“","mögliche Impulse auf Flipchart (S. Anhang)","EA","","methode_zirkulares-feedback.pdf","","",""],["Schock-Memory","","Wiederholung","Transfer","","","","Inhaltliche Fragen zum Thema des Seminars / des Tages auf Moderationskarten schreiben und auf ihre Rückseite das Wort FRAGE. Die Namen der TN auch auf Moderationskarten schreiben und auf die Rückseite: NAME.  Fragekarten und Namenskarten anpinnen. Nach außen hin sieht man immer nur die Rückseiten. Eine Frage vorlesen, danach eine Namenskarte nehmen und dieser TN  beantwortet dann die Frage. Sollte etwas an der Antwort nicht stimmen oder fehlen, in der Runde fragen und erst dann (wenn nötig) selbst ergänzen. Der TN, an den die erste Frage ging, geht an die Pinnwand, deckt wieder zuerst eine Fragekarte auf, liest sie laut vor und wählt dann eine der Namenskarten aus. So geht es munter weiter, bis alle Karten aufgedeckt sind. Auf lockere Stimmung achten – ist kein TEST, sondern eine Wiederholung.","Pinnwand, Kärtchen","PL","","","","",""],["Hindernislauf","Out of the Box","Problemlösung","Erfahrung","","","","Die TN machen in Gruppen stichpunktartig Notizen zu der Frage: Welche Hindernisse/Stolpersteine erwarten dich auf deinem Weg zum Ziel (= Seminarziel)  ca. 10 Minuten  Die Gruppen rotieren jetzt gegen den Uhrzeigersinn zur nächsten Pinnwand, lediglich der Streckenposten bleibt bei seiner Pinnwand stehen. Der Streckenposten erläutert der neuen Gruppe die erarbeiteten Hindernisse. Die Gruppe erarbeitet Lösungsvorschläge und notiert diese auf dem zweiten Flipchartpapier. ca. 10 Minuten Am Ende: Die Streckenposten präsentieren die Hindernisse und Lösungsvorschläge im Plenum.","pro Gruppe 1 Pinnwand mit 2 Bögen Flipchartpapier","GA","","","","",""],["Kurz-URL","","Präsentation","","","","WWW","Texte, Bilder, Videos aus dem Internet oder eigene Sammlungen von Fotos / Texten als Link präsentieren: Link mit einem Programm (wie z.B. bit.ly, goog.le) verkürzen, diese groß anschreiben oder beamen.","","","","","","",""],["Sketchnotes","","Präsentation","Input - Handout","","","","Sketchnotes sind visuelle Notizen, die aus Text, kleinen Bildern und Strukturen (Pfeile, Boxen...) bestehen.","","","","","","",""],["Stimmungsbarometer","","Reflexion","Evaluation","","","","Die TN machen sich allein Gedanken über die vergangene Arbeitsphase und bringen danach auf einem vorbereiteten Plakat Klebepunkte auf einer Skala an, die das Arbeitsklima bewertet. Die Skala kann man differenziert vorbereiten, z.B. mit Ziffern oder mit abgestuften Kommentaren (sehr - wenig - gar nicht..Die TN können ihren Klebepunkt auch kennzeichnen, sodass sie diesen später wiedererkennen.","Klebepunkte, Flipchartplakate (Skala)","EA","","","","",""],["Stimmzettel","","Ideen","Feedback","","","","Die TN notieren auf einem Stimmzettel ihre Favoriten (Zahl vorher festlegen), in einer absteigender Reihenfolge. Die Zettel werden eingesammelt und mit Strichlisten ausgewärtet. Variante: der Stimmzettel ist vorbereitet, die TN können für jeden Posten verschiedene Punkte vergeben, z.B. 10, 5, 3.","leere Zettel / Mini-AB","EA > PL","","","","",""],["60 Sekunden","","Wahrnehmung","","","","","Vorbereitung: Uhren entfernen (wenn laut) / abdecken. Die TN werden gebeten, zu üben, sich mit geschlossenen Augen leise auf ihre Stühle zu setzen. Danach stehen alle TN auf und schließen die Augen.. Auf das Kommando „Jetzt!“ zählen alle 60 Sekunden lang und setzen sich anschließend leise hin. Die Übung kann nur funktionieren, wenn alle die ganze Zeit über leise sind. Sobald alle TN sitzen, können sie wieder die Augen öffnen. SL: Notiert, wann die ersten 3 und wann die letzte TN sich gesetzt hat.","Uhr für den SL","PL","Sitzkreis","","","",""],["Büchsendiktat","Dosendiktat","DaF Rechtschreibung","DaF Phonetik","DaF LV","Input","","Sätze eines zusammenhängenden Textes werden einzeln auf Papierstreifen geschrieben, nummeriert und in eine Büchse / Pappbecher... gesteckt. (Pro Team 1 Büchse, bei längeren Texten für 2 Teams 1 Büchse vorbereiten). Die Lernenden arbeiten in PA: Einer von ihnen greift in eine Büchse, liest einen Satz, merkt sich den Satz und die Nummer, diktiert dem Partner den Satz. („Nr. 9 heißt: Dazu hatte ich keine Lust....“). Einen Streifen können sie mehrmals lesen, wenn sie nicht mehr sicher sind, ob sie es richtig haben. Variante: Sätze nicht nummeriert, sondern entweder auf unterschiedlich farbigen Streifen geschrieben / mit Bildern gekennzeichnet. Am Ende kann so auch die Reihenfolge der Sätze gemeinsam diskutiert werden.","Dosen, Pappbecher oder andere Behälter, Text in Streifen geschnitten","PA","","","","",""],["Dominoschlange A4","","Input","Üben","","","Selbstkontrolle","Ein A4-Blatt wird in z. B. sechs Reihen mit je sieben Spalten, d.h. in insgesamt 42 rechteckige Teile zerschnitten. Auf jedem Teil steht eine Aufgabe und eine Lösung, kleine Pfeile geben an, in welcherRichtung das nächste Puzzleteil mit der Lösung angelegt werden muss. Damit die Schüler nicht „mo-geln“ und einfach die Teile beliebig zusammenlegen, können einige Cartoons aufgedruckt werden, andenen man mit einem Blick erkennen kann, ob richtig gearbeitet wurde.","Kärtchen","PA","","domino_anders.jpg","","",""],["Alles, was rund ist","","Aktivieren","DaF WS","Kreativität","","","Die TN arbeiten in Gruppen. Ihre Aufgabe: 25 gleich große Kreise zu malen und danach in fünf Minuten die Kreise zu Gegenständen zu ergänzen, die (aus irgendeiner Perspektive) rund sind. Am Ende benennen die TN die gemalten Sachen. Gewonnen hat die Gruppe, die die meisten Gegenstände gefunden hat ODER wer die originellsten Ideen hatte. (Bei der Präsentation wird alles durchgestrichen, was andere auch haben. Gewonnen hat die Gruppe, die am Ende noch die meisten Sachen hat.","Packpapier, dicke Stifte","GA","","Tag_19_alles_was_rund_ist.jpg","","",""],["Expertenrunde","","DaF Sprechen","Präsentation","","","Ritual","Kann als Ritual in den Kurs eingebaut werden, als Mini-Vortragsreihe der Lernenden über ihre Lieblingsthemen, Hobbys (allein oder in Teams)","","PL","","","","",""],["Textkarussell","","DaF LV","Ideen","","","","Mehrere Texte mit einem Lernpartner kurz anlesen und wenn der Text / das Thema gefällt, auf der Rückseite eine Markierung machen. Am Ende die Texte mit den meisten Markierungen für genauere Bearbeitung in Expertengruppen geben. Fortsetzung: Mix-Gruppen oder Wirbelgruppen oder Galerie.","Texte","PA","","","","",""],["Aufstand-Entscheidung","","Ideen","Gruppenbildung","","","","Themen kurz vorstellen, dann nacheinander nennen. TN, die das Thema bearbeiten möchten, stehen auf, bilden Gruppen und holen dann gemeinsam das entsprechende Material ab / nehmen Platz an markierten Tischen.","","FA","","","","",""],["Blinde Detektive","","Kennen lernen","Wahrnehmung","Konzentration","","","tgshzsrtsrtsrtujhujhujhujhujhujhujhujhujhujhujhujhujhujhujhujhujhujhujh","","PL","","","","",""],["Hu-hu-ha!","","Aktivieren","Konzentration","","","Bewegung","Die TN stehen im Kreis. Der Spieler, der beginnt (Spieler 1), legt die Hände zusammen, hebt sie kurz übern Kopf und zeigt auf einen Spieler im Kreis und sagt laut HU! Der \"angesprochene\" Spieler (Spieler 2) hebt in der gleichen Weise die Hände übern Kopf und antwortet mit HU! Die beiden Spieler an seiner Seite bilden mit ihren Händen vor der Brust des Spielers einen Schutz und sagen laut HA! Dann ist Spieler 2 dran, wählt einen neuen Mitspieler im Kreis, zeigt auf ihn und sagt wieder HA. Es soll sehr schnell gehen. Variante: Mitspieler, die Fehler machen (nicht reagieren, falsch reagieren...) werden mit 3x HU-HU-HA! aus dem Kreis verabschiedet. http://bit.ly/2J2THIn","","Stehkreis","","","","",""],["Activity","","Wiederholung","DaF WS","","","Wettbewerb","Spielfeld an der Tafel vorbereiten, Spielfiguren mit blu-tack oder Magneten festhalten.  Die Wortkarten werden in der Gruppe gemein-sam vorbereitet, einfache Wortkarten (eine Karte ein Wort) oder schon so, wie im Originalspiel: 6 Wörter pro Karte, verteilt in 6 Felder (Malen – Erklären – Pantomime – Malen – Erklären – Pantomime + Punktwerte von 3-6).  Gespielt wird in Gruppen. .Je nachdem auf welchem Feld man steht, wird nun der Begriff in 60 Sekunden erklärt. Wird der markierte Spielbegriff gewählt, können alle Teams mitraten.","Spielfeld, Spielkarten, Spielfiguren","PL","","","","",""],["Adjektiv-Hut","","Wiederholung","DaF WS","","","Wettbewerb","Vorbereitung: Die Gesamtgruppe in 2 Gruppen teilen. Jede Gruppe sammelt Adjektive, schreibt sie einzeln auf Kärtchen und legt sie in eine Tüte / in einen Hut. Danach ziehen in jeder Runde beide Gruppen eine Karte (z.B. rot - rund) Variante a) wer zuerst eine Sache nennen kann, auf die beide Adjektive zutreffen, bekommt einen Punkt. Variante b)  in 1 Min. sollen beide Gruppen möglichst viele Sachen nennen, auf die beide Adjektive zutreffen. Punkte gibts für alles, was die andere Gruppe nicht in ihrer Liste hat.","Zettel, Tüten o.ä.","GA > PL","","","","",""],["Die Stadt im Klassenraum","","DaF Sprechen","","","","Bewegung","Die Lernenden richten den Klassenraum wie eine Stadt ein, schreiben Kärtchen mit den Orten und stellen sie auf die Tische (z.B. Rathaus, Kino, Bahnhof, Zoo..) und benennen die Straßen. Sie ziehen dann von einem Stapel Kärtchen, auf dem ein Ort steht. Sie gehen „irgendwohin” und fragen dann einen Mitschüler, wie sie von dort zu diesem Ort kommen.","Kärtchen","PA","","","","",""],["Die Zahlen meines Lebens","","Kennen lernen","DaF Sprechen","","","","15 Zahlen zwischen 1-100 auf ein DIN A4-Blatt schreiben und für alle kopieren. Die TN überlegen, welche Zahlen eine Rolle in ihrem Leben gespielt haben und markieren die „passenden“ Zahlen.   Die TN  gehen herum, und suchen für die fehlenden Zahlen Antwort von den anderen suchen – nachher merken, wer was gesagt hat. Wer fertig ist, sagt: BINGO.  Variante: TN notieren 5-7 Zahlen auf einem Blatt Papier, die in ihrem Leben wichtig sind / waren. Sie laufen herum und lassen die anderen spekulieren, was die Zahlen für die anderen bedeuten. Für jede korrekt erratene Zahl bekommen sie einen Punkt auf ihr Blatt gemalt. Sieger ist, wer in der angegebenen Zeit die meisten Punkte gesammelt hat.","AB (oder ein Blatt Papier)","EA > CP","","","","",""],["Ärzte und Patienten","","DaF Sprechen","","","","Bewegung","Die Gruppe in zwei Teilgruppen aufteilen: die Hälfte werden Patienten, die andere Hälfte Ärzte.  (Mit Wahlgruppen ist auch eine Differenzierung möglich.)  Die Patienten denken sich ein Problem aus (oder suchen sich eine Problemkarte aus) und überlegen, wie sie die Symptome beschreiben. Sie gehen dann zu möglichst vielen Ärzten und lassen sich beraten.  Am Ende treffen sich die Patienten und diskutieren, wer ihrer Meinung nach der beste / der verrückteste Arzt war. Gleichzeitig treffen sich die Ärzte, und besprechen, welcher Patient der Schwierigste war bzw. das schwierigste Problem hatte und vergleichen ihre Ratschläge.","","CP","","","","",""],["Bandwurmsatz","","DaF WS","DaF GR","","","","Alle Wörter der Sätze werden kleingeschrieben und voneinander nicht getrennt. Die Lernenden sollen die Wörter trennen und den Satz korrekt aufschreiben.  Schwieriger: Die Sätze sind nicht getrennt. (Geht nur bei kurzen Texten!) Auch anderes Layout denkbar - z.B. Wellen.","AB","EA / PA","","","","",""],["Beziehungen","","DaF Sprechen","","","","","Die TN arbeiten in Gruppen. Sie schneiden aus Zeitschriften Fotos von Personen in verschiedenem Alter aus. Sie entscheiden sich dann für die fünf besten Bilder.  Die Bilder mischen. Jede Gruppe zieht dann 5 Bilder.  Aufgabe: Die Fotos mit Leben füllen und besprechen, in welcher Beziehung die 5 Personen miteinander sind und ein Plakat machen mit einigen Stichworten.  Danach die Plakate aufhängen und die Gruppen mischen, so dass in jeder neuen Gruppe jeweils ein Vertreter der alten Gruppen ist. Die Gruppen wandern im Uhrzeigersinn von Plakat zu Plakat, und der Lernende, der das Plakat gemacht hat, stellt die fünf Personen vor.","Bilder / Postkarten","GA","","","","",""],["Beziehungskiste","","DaF WS","Wiederholung","","","","Die TN arbeiten zu zweit oder in Kleingruppen und ziehen reihum aus der Kartei jeweils 2 Wortkarten. Der Partner (die anderen in der Gruppe) soll(en) schnell ein Wort nennen, das mit beiden etwas zu tun hat und den Zusammenhang erklären.   Variante Rätsel: die Verbindung erklären, die anderen raten, welches das gemeinsame Wort sein kann.","Vokabelkartei","PA / GA","","","","",""],["Bilder beschriften","","DaF WS","Üben","","","","Markierte Teile eines (detailreichen) Bildes benennen oder angegebene Wörter zu den markierten / nummerierten Stellen zuordnen. (Wenn nummeriert, kann das Bild auch gebeamt werden.)","AB / Bild","EA / PA","","","","",""],["Bilder nachstellen","","Aktivieren","DaF Sprechen","","","","Die TN wählen eine von Kunstpostkarten, die Szenen mit mehreren Figuren darstellen.  Sie stellen dann die Szene nach: sie schreiben als Vorbereitung Sprechblasen, verteilen Rollen (bei Bedarf erfinden sie noch neue Figuren, die gerade ins Bild treten wollten, wenn sie passend zur TN-Zahl der Gruppe noch jemanden brauchen). Sie „vertonen” dann das Bild und verwandeln es in eine Szene, in der die Figuren miteinander sprechen.  Nach der Vorbereitung wird es auch im Plenum gespielt.  (Beobachtungsufgabe für die Zuhörer geben!)","Kunstpostkarten / oder Web-Recherche > Handy","GA","","","","",""],["Bilder markieren / nummerieren","","DaF HV","DaF LV","","","","Beim Lesen / Hören oder nach dem Lesen / Hören Bilder markieren (kommt vor) oder dem Textverlauf entsprechend nummerieren.","Bilder AB / Beamen","EA","","","","",""],["Bildkarten legen","","DaF HV","DaF LV","","","","Zu einem handlungsreichen Text oder zu einem Lied Bilder malen / Fotos aus Magazinen suchen / mit KI Bilder erstellen. Die TN legen die Bildkarten vor dem Lesen / Hören in eine für sie sinnvolle Reihenfolge und überprüfen ihre Lösung beim Hören / Lesen.","Bilder / Fotos / eigene Zeichnungen","EA > PA / GA","","","","Padlet Sandbox, FigJam, Jotboard oder Bilder in der Präsentation mit Buchstaben markiert","Padlet Sandbox, FigJam, Jotboard oder Bilder in der Präsentation mit Buchstaben markiert"],["Definitionen","","DaF WS","Üben","","","","Die TN sammeln zuerst Wörter und schreiben dann eine Erklärung auf Kärtchen und das Wort auf die Rückseite. Sie legen ihre Kärtchen mit Definition nach oben auf dem Tisch.  Sie besuchen dann die Tische der anderen Gruppen und versuchen die Wörter zu finden. (Kontrolle: Kärtchen umdrehen.) Variante: AB erstellen als Zuordnungsübung, mit Schüttelkasten, Definitionen langsam im PL vorlesen und die anderen raten lassen. ... Funktioniert auch mit einer Auswahl aus der Vokabelkartei - oder mit zufällig herausgenommenen Vokabelkarten","Vokabelkartei oder leere Kärtchen","GA","","","","",""],["Diskussionspunkte","","Erfahrung","Einstieg","Diskussion","DaF Sprechen","","3-6 TN bilden eine Gruppe, schreiben auf 12 Kärtchen 12 Themen, die sie gern diskutieren wollen, nummerieren die Rückseite und legen sie mit der Zahl nach oben in die Mitte. Die TN würfeln dann mit beiden Würfeln und ermitteln so, zu welchem Thema sie sprechen sollen (1-2 Minuten). Wenn die Zeit um ist, ist der nächste Spieler dran. Wird wieder die gleiche Zahl gewürfelt, soll er das bereits Gesagte kommentieren und seine Meinung zum Thema sagen.","Kärtchen, 1 Würfel pro Gruppe","GA","","","","",""],["Einigungsspiel","","DaF Sprechen","","","","","Die TN bekommen Rollenkarten z.b. eine Liste mit Terminen oder ein leeres Blatt aus einem Terminkalender, in dem sie all ihre Termine notieren. Sie müssen für eine gemeinsame Aktivität einen Termin finden.  Variante: sich einigen, was sie gemeinsam unternehmen / was sie einkaufen u.ä.","Rollenkarten / Infokarten","CP / GA","","","","",""],["Emotionales Echo","","DaF Sprechen","DaF Phonetik","","","","Die TN bekommen einen Stapel Wendekarten mit Reaktionen – und erweiterten Reaktionen. (Toll – ganz / echt toll, Blöd – wirklich / ganz schön blöd, Schön – so / sehr / echt / wirklich schön... usw. ). die Seiten sind farblich unterschiedlich (z.B. weiß und grau). Ein TN zieht eine Karte, nimmt die weiße Seite und sagt einen Satz, der damit endet.z.B. Schade! &#8594; Brasilien hat 0:3 gegen Deutschland verloren. Schade! Der Mitspieler reagiert darauf, wählt einen der Vorschläge von der anderen Seite und spricht den Satz mit Gefühl: So / wirklich schade! (traurig) Ich war auch für Brasilien... Sie tauschen hin und wieder die Rollen.","Wendekarten (oder AB)","PA","","","","",""],["Hemisphären-Alphabet","","Aktivieren","Konzentration","","","","An der Tafel hängt eine Liste mit den Buchstaben, zu jedem ist eine Bewegung zugeordnet: R = rechte Hand hoch, L = linke Hand hoch, Z = beide Hände hoch. Die Lernenden sagen das Alphabet und machen dabei die passenden Handbewegungen.","Plakat / Beamer","PL","","hemisph_ren.jpg","","",""],["Formel-I-Satz-Rennen","","Üben","DaF Sprechen","","","","Die TN schreiben Satzanfänge auf Kärtchen und legen sie in einen Stapel. Ein TN zieht eine Karte, liest den Anfang vor und der andere muss den Satz schnell beenden. Auch in Gruppen möglich - alle beenden den Satz. (Variante: 3 Sätze mit dem gleichen Anfang nennen.)","Kärtchen","PA / GA","","formen_1_satz_rennen.jpg","","",""],["Hypothesen bilden","","DaF HV","DaF LV","DaF HSV","","Strategie","Für die Vorentlastung von Texten: Anhand von Bildern, Titel und Zwischentiteln, Schlüsselwörtern Hypothesen zum Inhalt (erwartete Themen? Handlung? Sprecher? Figuren) oder zu erwarteten Wörtern formulieren.","Bild / Titel / Zwischentitel / Sammlung von Schlüsselwörtern (Beamen / AB / Tafel)","PL","","","","",""],["Fragekarten","","Einstieg","Erfahrung","DaF Sprechen","","","Die TN bekommen leere Kärtchen (oder vorbereitete Karten mit Fragen). Die Karten werden verdeckt in einen Stapel gelegt. Der erste Spieler zieht eine Karte und beantwortet die Frage. (Er kann danach auch die Mitspieler fragen.) Variante: Jeder kann die Frage ernst beantworten aber auch so, dass er nicht die Wahrheit sagt. Die Mitspieler entscheiden dann, ob sie ihm glauben oder nicht.","Kärtchen","GA","","","","",""],["Geheimpfad","","DaF WS","","","","Selbstkontrolle","Die TN suchen in (z.B. 5x5 großen) Buchstabenquadraten die versteckten Wörter.  Wir geben an, ob nur links-rechts-nach oben-nach unten oder auch diagonale Verbindungen möglich sind. Es ist leichter, wenn wir den Anfangsbuchstaben markieren.","AB","EA / PA","","geheimpfad.jpg","","",""],["Grafik ergänzen","","DaF HV","","","","","Aufgabe zum Hören: Beim Hören des Textes Informationen sammeln, mit denen die Grafik /z.B. Grundriss, Gelände...) oder Textkarte ergänzt werden kann.","AB","EA","","","","",""],["Ich aus Papier","","Kennen lernen","DaF Sprechen","","","","Die TN legen sich auf ein Packpapier. Der Partner malt mit einem dicken Stift die Körperkonturen nach. Danach interviewen sich die Partner gegenseitig, und schreiben in den Körperumriss des Partners die wichtigen Informationen.  Wir können auch zusätzlich die Aufgabe geben, dass sie die Infos zu den entsprechenden Körperteilen eintragen, zum Herz - was der andere mag, zur Hand - Sachen, die er gut kann… usw.","Packpapier / Pinwandbespannungsbögen","PA > PL","","","","",""],["Flussdiagramm ergänzen","","DaF HV","DaF LV","","","","Geeignet für Texte, in denen Abläufe, Vorgänge, Prozesse beschrieben werden. Beim Lesen / Hören oder nach dem Lesen / Hören  ergänzen de TN das Flussdiagramm, das den Ablauf schematisch darstellt.  Variante: Fehlerhafte Infos im Flussdiagramm korrigieren.","AB","EA","","","","",""],["Infos zu Bildern notieren","","DaF HV","DaF LV","","","","Beim Hören/Lesen Informationen zu Bildern notieren. Variante: Infos zu Stichworten notieren","Bilder / Stichwortsammlung","EA","","","","",""],["Infos sortieren","","DaF HV","DaF LV","","","","Beim Hören/Lesen entscheiden, zu welchem Thema / zu welcher Person / welchem Ort... die aufgelisteten Informationen gehören oder entscheiden, in welchem Text die Infos standen.","AB","EA","","","","",""],["Multiple-Choice-Gedicht","","DaF Schreiben","","","","","In einem Gedicht Lücken schaffen und für die Lücken jeweils 3-4 Auswahlmöglichkeiten anbieten. (Die TN können auch selbst Gedichte mitbringen und diese präparieren.) Die TN  schreiben das Gedicht neu, indem sie die für sie passendsten Wörter aussuchen.","Gedichte / AB","PA / GA","","","","",""],["Konzentrisch lesen","","DaF LV","","","","Strategie","Durch diese Aufgabe lernen TN, was es heißt, einen Text zu überfliegen, um sich in groben Zügen über den Textinhalt zu informieren (= den Text global zu verstehen / den roten Faden verstehen). Die TN lesen nur die besonders hervorgehobenen Textteile (Fettdruck, Kursivdruck, Textteile in besonderer Position – z.B. Bildunterschriften, mit größeren / anderen Schrifttypen gesetzte Zitate aus dem Text), den ersten und letzten Absatz, bei längeren Texten den jeweiligen ersten und letzten Satz von jedem Absatz (Thema-Rhema) sowie auffallen häufig wiederkehrende Wörter. Unbedingt die Zeit begrenzen, sonst lesen die Lernenden detailliert! Danach im Plenum sammeln, was alles sie verstanden haben. Beim Zusammentragen sind nur die sehr offenen Fragen „Worum geht es hier im Text?“ „Was habt ihr alles verstanden?“ hilfreich! Variante: Aus dem Text nur die Wörter mit Großbuchstaben (Substantive) lesen.","Texte","EA > PL","","","","",""],["Klassenkorrespondenz","","DaF Schreiben","IT-Kompetenz","","","WWW, BYOD, Projekt","Der KL nimmt Kontakt zu KL im Ausland auf, deren TN an einem Austausch interessiert sind und besprechen den Ablauf des Projektes. Danach nehmen die TN miteinander Kontakt auf, zuerst auf der Klassenebene: Eine Vorstellungsmail wird zusammengestellt und abgeschickt. Danach können sie zu einzelnen Themen Sendungen vorbereiten (unsere Schule / Sprachschule , der Deutschunterricht bei uns, unsere Stadt, was wir gern machen, Musik, die wir gern hören, Bericht über eine Klassenparty / einen Klassenausflug). Themen ergeben sich auch aus den Mails / Fragen der Partnerklasse. Die Texte werden in der Gruppe gemeinsam vorbereitet und geschrieben. Vorteil der digitalen Klassenkorrespondenz: Man kann auch Bilder und Videos schicken. Es ist auch möglich, dass einzelne TN dann miteinander in Mailkontakt kommen, über die privaten Mails berichten sie dann (auf Wunsch und auch gefiltert :-) in einem Gesprächskreis.","Internet","","","","","",""],["Lückenhafte Zusammenfassung","","DaF HV","DaF LV","","","","Textinhalt in einem kurzen Text zusammenfassen. In jedem Satz eine Information löschen. Die TN ergänzen nach dem Lesen / Hören des Textes die fehlenden Informationen.","AB","EA / PA","","","","",""],["Lückenmitschrift","","DaF HV","","","","","Zum Hörtext wird die Transkription des Textes mit Lücken präsentiert. Nicht in jedem Satz sollen Lücken sein, und pro Satz nicht mehr als eine Lücke. Möglichst Schlüsselwörter weglassen und darauf achten, dass aber nicht immer Substantive fehlen. Nach Möglichkeit Text extra abtippen und möglichst große Lücken lassen, damit die Lernenden reinschreiben können. Die TN sollen beim Hören die fehlenden Wörter heraushören (gute Übung zum differenzierenden Hören.)  Variante: Unter dem Text werden die Wörter angegeben, die Lücken sind nummeriert. Vor dem Hören versuchen die TN den Platz der Wörter zu finden, beim Hören überprüfen sie ihre Vorschläge.","AB","EA > PA","","","","",""],["Multiple Choice-Aufgabe","Mehrfachwahlaufgabe","Üben","Kontrolle","","","","Die TN wählen unter 3-4 Antwortmöglichkeiten die richtige Lösung aus. Die Lösung muss eindeutig richtig und die Distraktoren eindeutig falsch sein - aber sie sollen sich noch plausibel anhören. Die  Lösung und Distraktoren müssen ungefähr gleich lang und sprachlich gleich schwierig sein. Bei HV und LV folgen die einzelnen Aufgaben dem Textverlauf und enthalten Wörter aus dem Text.  Bei Grammatik- und Wortschatzübungen keine isolierten Sätze, sondern eher kleine Storys / Sätze aus dem gleichen Zusammenhang anbieten.","AB","EA / PA","","","","",""],["Metapher: X ist wie ...","","Einstieg","Erfahrung","DaF Sprechen","Kreativität","","Der Spielleiter gibt einen Impuls: z.B. Eine Prüfung machen ist wie... , Lernen ist wie …., Training ist wie..., Freiheit ist wie..., Liebe ist wie.. und präsentiert auf dem Lehrertisch oder in der Mitte auf dem Boden viele Bilder / Postkarten (30-40). Die TN beraten sich und entscheiden sich für ein Bild, das für sie am besten in den Satz passt.  Sie machen eine Liste:  Worin besteht die Ähnlichkeit? Welche Unterschiede gibt es?  Welche Vorteile ergeben sich aus dem Vergleich?  Welche Probleme sind in diesem Vergleich sichtbar? Wie löst man sie?  Die Ergebnisse stellen Gruppensprecher im Plenum vor, wir können die wichtigsten Stichwörter an der Tafel sammeln und die Gesamtgruppe kann nachher entscheiden, über welche Aspekte sie diskutieren möchten.","Postkarten / Fotos","EA/PA/GA > PL","","","","",""],["Nach Instruktionen handeln","","DaF HV","DaF LV","","","","Nach den Informationen des Textes / nach Instruktionen etwas malen (z.B. Weg, eine Figur...) oder etwas ausmalen, eine Handlung ausführen (z.B. Gymnastik). o.ä.","Hörtext, AB","EA","","","","",""],["Nonsens-Diktat","","DaF Rechtschreibung","","","","","Ähnlich wie beim Lückendiktat arbeiten wir auch an einigen ausgewählten Wörtern / fokussieren wir auf einige Rechtschreibprobleme. Die TN bekommen einen Text mit einigen Nonsenswörtern (anstelle der problematischen Wörter, an denen wir arbeiten wollen).  Der Lehrer / oder der Partner diktiert den Text, die TN sollen die Wörter, die sie nicht hören, streichen und die richtigen Wörter in den Text schreiben.","AB","FA / PA","","","","",""],["Persönliche Kommentare","","DaF Sprechen","DaF Schreiben","","","","Auf den Text reagieren: Nach dem  Lesen / Hören Aussagen aus dem Text / Verhalten der Personen... aus persönlicher Sicht kurz bewerten oder länger kommentieren.","","EA / PA / GA","","","","",""],["Neue Perspektiven","","DaF Sprechen","","","","","Ein Bild nach und nach um neue Personen erweitern, die TN beschreiben in Kleingruppen aus den verschiedenen Perspektiven, was sie beobachtet haben.","Bild","PL","","","","",""],["Planaufgabe","","DaF Sprechen","","","","","Für echte Plansituationen oder für mögliche Situationen Lösungsvorschläge ausarbeiten, Vor- und Nachteile der verschiedenen Ideen diskutieren.","Infokarte","GA","","","","",""],["Raster ausfüllen","","DaF HV","DaF LV","","","","Die TN tragen die Informationen des Textes in einen Raster ein. Der Raster soll nicht zu viele Spalten enthalten und nicht alle Informationen aus dem Text betreffen. Die TN sollen vor dem Hören / Lesen den Raster studieren, wenn nötig, die Wörter klären.  Variante:  Raster nicht leer, in manchen Zellen stehen schon Informationen, oder im Raster sind einige Informationen nicht an der richtigen Stelle, die TN haben dann die Aufgabe, die Infos zu korrigieren.  Eignet sich vor allem für Texte, die aus mehreren kleinen Texten bestehen, für Umfragen, Interviews mit mehreren Personen zum gleichen Thema...","AB","EA / PA","","","","",""],["Pro-Kontra-Debatte","","Diskussion","Einstieg","DaF Sprechen","","","Die TN bekommen Karten mit Pro- bzw. Kontraargumenten zu einem Thema. Sie können noch weitere sammeln oder wir überlassen ihnen gänzlich das Sammeln von Argumenten. Sie  sprechen mit einem Partner: der TN mit Pro fängt an, wählt ein Argument aus – der Partner wählt aus seiner Karte ein passendes Gegenargument aus. Dabei werden auch Redemittel verwendet (vorher schon eingeführt und geübt).","Karten / Liste / Papier","PA / GA","","","","",""],["Reizworttheater","","DaF  Sprechen","","","","","Vorbereitung: Wörter 4 verschiedenen Oberbegriffen zuordnen und auf Karten schreiben z.B.  Gegenstand – Tabletten, Parkbank, Brille... Personen – alter Herr, Richter, Apotheker... Ort der Handlung – Park, Bahnhof, Apotheke... Motiv – Ärger, Annäherung, Angst...  In Gruppen werden jetzt von den gemischten Karten gezogen (zu jedem Oberbegriff eine). Nach einer kurzen Absprache (5 Min.) werden die kurzen Szenen vorgespielt.","Wortkarten","GA > PL","","","","",""],["Richtig-Falsch-Aufgabe","","DaF HV / HSV","DaF LV","Kontrolle","","","Die TN lesen vor dem Hören / Lesen die Aussagen und  entscheiden beim Lesen / Hören, ob diese mit den Aussagen im Text übereinstimmen oder nicht, wo sie im Text stehen (bei LV) bzw. ob sie gar nicht im Text vorkommen. Variante für Kontrolle:   Die TN können nach dem Lesen / Hören auch selbst R/F-Aufgaben füreinander machen:","AB","EA","","","","",""],["Rohtext gliedern","","DaF LV","","","","","Den TN wird der Text als Bandwurmtext präsentiert: Die Absätze – auch die Titel und Zwischentitel werden nicht voneinander getrennt, Bildunterschriften werden in den fortlaufenden Text integriert. (Illustrationen werden mitgeliefert)  Der Text wird abgetrennt (Striche, Markierungen...) oder wenn er digital vorliegt neu gestaltet.  Variante: Zwischentitel und Titel fehlen. Die TN sollen den Text in Sinnesabschnitte teilen und den Abschnitten Zwischentitel geben.","Text (digital)","EA / PA","","","","",""],["Sachen erzählen","","Kennen lernen","DaF: Sprechen","","","","Die TN wählen aus ihrer Tasche einen Gegenstand aus oder einen Gegenstand, der zwar nicht da ist, aber für sie besonders wichtig ist, und der etwas über sie erzählen kann.  Sie stellen sich auch so vor: Ich bin ... der Schlüsselbund von... Sie ist... Sie macht... Zu mir ist er...","Persönliche Gegenstände","GA / PL","","","","",""],["Satzkarten legen","","DaF HV","DaF LV","Kontrolle","","","Textverständnis überprüfen, für Texte mit viel Handlung: Nach dem Lesen / Hören des Textes Satzkarten ordnen.","Satzkarten","PA / GA","","","","",""],["Simulationsspiel","","DaF Sprechen","Problemlösung","Kooperation","","","Die TN müssen eine außergewöhnliche Situation aushandeln und gemeinsam Entscheidungen treffen (als sie selbst). Dazu bekommen sie die genaue Beschreibung der Situation und evtl. auch Materialien, die ihnen bei der Problemlösung helfen sollen. Beispiel: Schiffbruch, NASA-Spiel, Fahrstuhl, Ballonfahrt...","Infokarten / AB","GA","","","","",""],["So eine Geschichte!","","DaF Sprechen","Wahrnehmung","","","","Zwei oder drei Spieler verlassen den Raum, ohne zu wissen, was passieren soll. Der Spielleiter erklärt der Gruppe das Spiel, dann werden die Spieler wieder hereingebeten. Der Spielleiter erzählt ihnen: „Wie haben gerade über etwas Lustiges gesprochen, das letzte Woche passiert ist und mit jemandem aus der Gruppe zu tun hat. Ihr sollt nun durch Fragen herausfinden, um was es sich dabei gehandelt hat.  Für die Gruppe gilt: Endet das letzte Wort der Frage mit einem Konsonanten, antworten alle mit „ja“, endet es mit einem Vokal, ist die Antwort „nein“. :-) Wie lange dauert es, bis die zwei Spieler die Lösung herausbekommen?","","PL","","","","",""],["Sprachschatten","Echo","DaF Sprechen","DaF Phonetik","","","","Eine sinnvolle Drillübung: Wiederholung der Sätze als Frage oder als bestätigender Aussagesatz. Auch geeignet zum Üben von Gambits.","AB","PA","","sprachschatten.jpg","","",""],["Tanzende Schlange","","DaF HV","","","","Bewegung","Aus einem Lied frequente Wörter auf Kärtchen notieren.  Jeder TN bekommt eins davon. Wenn jemand im Lied das Wort auf seiner Karte hört, steht auf, und beginnt zu tanzen. Der nächste stellt sich in die Schlange und tanzt mit. Hört man das Wort noch einmal, rennt man an den Kopf der Schlange...  Variante: Orgelpfeifen","Wortkarten, Lied","PL","","","","",""],["Textkaraoke","Sprachkaraoke","DaF Sprechen","DaF Phonetik","","","","Intonation und Sprechtempo üben: Die TN hören die Teile von Dialogen von der Kassette, die sie im Leben selbst eher nicht sprechen (Kellner, Polizist, Arzt...). Ihr Textteil ist auf dem AB abgedruckt. Sie sprechen die Sätze in die Pausen hinein. Sie müssen sich in ihrem Sprechtempo anpassen, sie sprechen also normalerweise etwas schneller als sonst.","AB, Hörtext","FA","","","","",""],["Notizen - Zusammenfassung","","DaF LV","DaF HV","","","","Notizen / Zusammenfassung des Textes lesen und über den möglichen Inhalt spekulieren, danach Notizen beim Hören mit dem Hörtext / Lesetext vergleichen.","AB","PA / GA / PL > EA","","","","",""],["Überschriften geben","","DaF LV","","","","","Beim Lesen / nach dem Lesen eine passende Überschrift / passende Zwischentitel formulieren / unter angegebenen Vorschlägen die passende/n auswählen, die angegebenen Überschriften Textpassagen zuordnen und die Wahl begründen.","Text, (Liste mit möglichen Überschriften)","EA / PA","","","","",""],["Umgekehrt lesen","","DaF WS","","","","","Die TN lesen einen Text mit den entgegengesetzten Verben / Nomen / Adjektiven vor, die entweder markiert oder nicht markiert sind. Sätze abwechselnd lesen.","Text","PA","","","","",""],["Unterschiede heraushören","","DaF Phonetik","","","","","Vorbereitende Ausspracheübungen: Die TN hören Wörter / Eigennamen und markieren, was sie hören / in welchen Wörtern sie bestimmte Laute hören. (Wörter unterstreichen / Bilder markieren)","(CD), AB","EA","","","","",""],["Zuordnungsduell","","Kontrolle","DaF WS","DaF GR","","Wettbewerb","Sätze, die Paare bilden - Frage – Antwort, Früher – Heute (GR), Aktiv – Passiv... als getrennte Liste in zwei Gruppen geben. Ein TN aus Gruppe A liest vor – jemand aus Gruppe B sagt schnell den passenden Satz aus ihrer Liste.","2 Listen","PA / GA","","","","",""],["Vorkenntnisse sammeln","","DaF HV","DaF LV","","","Strategie","Vor dem Lesen / Hören zum Thema des Textes alle Informationen (auch die unsicheren) im Plenum sammeln.  Festhalten an der Tafel als Assoziogramm, Liste, Mind map...  Daraus ergibt sich eine natürliche Höraufgabe: Daten, bei denen die TN unsicher / unterschiedlicher Meinung sind, überprüfen, bzw. weitere Informationen sammeln.","","(GA) > PL","","","","",""],["Was braucht er/sie?","","DaF Sprechen","","","","","Der SL teilt die Gruppe in Paare oder Kleingruppen von bis zu vier TN ein. Jede Kleingruppe erhält ein Foto von einer Person sowie ein Blatt Papier und einen Stift pro TN. Sie kleben das Bild auf ein Packpapier.  Aufgabe der Gruppe ist es, sich auszudenken, was die Person braucht, und die Ideen zum Bild (um das Bild herum) zu notieren. Anschließend stellt jede Gruppe ihre Figur vor.  Weitere Aufgaben denkbar: Wo war sie gerade? Was hat sie am Tag noch vor? Was ist die Geschichte hinter dem Foto? ….","Fotos, Packpapier, dicke Stifte","PA / GA","","","","",""],["W-Fragen beantworten","","DaF HV","DaF LV","","","Strategie","Beim Lesen / Hören oder nach dem Lesen / Hören W-Fragen zum Text beantworten.  Warum? Wieso? Weshalb? sind schon komplexe Aufgaben!","","EA / PA","","","","",""],["Wörter recyceln","","DaF WS","Einstieg","Aktivieren","","Wettbewerb","Ein sehr langes Wort an die Tafel schreiben, das die TN kennen, die Buchstaben des Wortes sollen „recycelt” werden. Die Aufgabe der TN: möglichst viele und lange Wörter schreiben, die diese enthalten. Buchstaben können auch mehrmals vorkommen.","Tafel","","","","","",""],["Wortpaare bilden","","DaF WS","DaF Sprechen","","","","Die TN ordnen Wortkarten nach bestimmten Gesichtspunkten in Paare und begründen ihre Entscheidung.","Vokabelkartei oder Wortkarten","","","","","",""],["Wörterball / Frageball","","Einstieg","Kontrolle","Wiederholung","DaF WS","Kettenübung","Der SL wirft einem TN einen Ball zu und nennt gleichzeitig ein Wort. Der TN fängt den Ball, nennt daraufhin sofort ein Wort, das mit dem letzten Buchstaben den vorherigen Wortes beginnt, (Baum-Maus-Sonne- ...) usw. Da es bei dem Spiel auf Schnelligkeit ankommt, müssen zu langsam reagierende ausscheiden.  Geht auch mit schnellen Fragen, die beantwortet werden sollen oder Wörter abfragen....  Besser als die Kettenspielvariante, weil jeder aufpassen muss, da er jederzeit drankommen kann.","Ball","PL","Stehkreis","","","",""],["Zahlendiktat","","DaF WS","","","","","Die TN bekommen je ein AB mit dem leeren Zahlen- / bzw. Wörterraster. Der KL diktiert die Zahlen/Wörter, die die Umrisse der Form bestimmen. Sie verbinden mit einem Strich die Zahlen miteinander oder malen die genannten Kästchen aus.. Nach dem Zahlendiktat vergleichen sie mit den Nachbarn die so entstandenen Formen.","AB, Marker","EA","","zahlendiktat.jpg","","",""],["Klopapierrolle","","Kennen lernen","Feedback","Erfahrung","DaF Sprechen","","Die TN nehmen so viel Papier, wie viel sie brauchen (wofür, das wird nicht vorher bekannt gegeben :-) und auch die Spielregeln sind erst einmal geheim). Danach gibt jeder TN so viele Infos über sich / Sätze als Kommentar, wie viele Papierstücke er abgerissen hat. (Papier in der Mitte sammeln - kann noch zum Tafel wischen genutzt werden.)","2-3 Klopapierrollen","PL","","","","",""],["Bauklötze-Sätze","","DaF GR","","","","","Die TN bekommen Bauklötze oder Legosteine. Jede Farbe / Form entspricht einem anderen Satzbaustein: Subjekt, Prädikat, verschiedene Ergänzungen. Die Liste wird gebeamt oder die TN bekommen ein Gelände als AB. Jeder TN denkt sich einen Satz aus und legt ihn vor sich auf den Tisch. Danach verrät er ein Element: Zeigt auf den entsprechenden Baustein und sagt das Wort. (z.B. SCHULE). Die anderen sollen schnell möglichst viele Sätze sagen. Für jeden korrekten Satz gibt es einen Punkt und 5 Punkte, wenn jemand den Originalsatz erraten kann.","Bauklötze, Legosteine","GA","","","","",""],["Warenhaus","","Konzentration","DaF WS","","","Rätsel","Die TN sitzen im Kreis. Der SL erklärt, dass sie in einem Warenhaus mit 7 Stockwerken einkaufen können im 1. 2. 3. Untergeschoss, im EG und im 1. 2. und 3 Obergeschoss. Der SL sagt gleich 2 Beispiele, was er kauft und in welchen Etagen. Die TN versuchen etwas zu kaufen, und der SL sagt, ob das möglich ist. Die TN müssen die Regel herauskriegen: Im EG können sie Sachen kaufen, die SIE SELBST anhaben / mit dabei haben, die Obergeschosse sind die 3 Personen rechts von ihnen, die Untergeschosse sind die 3 Personen links von ihnen. Also z.B. \"Ich kaufe eine SWATCH-Uhr im EG und ein blaues T-Shirt im 2. UG.) Wenn ein Mitspieler die Regel gefunden hat, soll er einfach zusammen mit dem SL einkaufen. Sollte die Gruppe weniger fix sein und die Regel nicht finden, einfach etwas auffälligere Sachen sagen, die ihnen helfen.","keine","PL","Sitzkreis","","","",""],["Zettelsalat","","Kennen lernen","Namen lernen","","","Bewegung","Zuerst bekommt jeder L einen Zettel und einen Stift. Der SL nennt laut einen Buchstaben. Danach müssen sich alle gegenseitig fragen, wie sie heißen. Hat man jemanden gefunden, dessen Name mit dem Buchstaben anfängt, schreibt man diesen Namen auf und holt sich vom SL einen neuen Buchstaben. Diesmal wird dieser nicht laut vorgelesen. Das Spiel ist zu Ende, wenn der erste L zu 10 Buchstaben Namen gefunden hat.","Zettel, Stifte","CP","","","","",""],["Deckenspiel","","Kennen lernen","","","","","Namen üben / wiederholen: Die Gruppe wird in zwei Hälften geteilt. Zwischen den beiden Gruppen wird eine Decke gespannt. Nach und nach setzt sich aus jeder Gruppe eine Person leise hinter die Decke. Dabei wird nicht gesprochen. Danach wird die Decke fallen gelassen. Nun müssen beide Spieler schnell den Namen seines Gegenübers nennen. Der langsamere Mitspieler oder wer einen Fehler macht, muss auf die andere Seite wechseln. Das Spiel ist zu Ende, wenn alle Spieler in einer Gruppe sind.","Decke","PL","","","","",""],["Inselspiel","Menschen clustern","Kennen lernen","Gruppendynamik","","","Bewegung","Die L bewegen sich zur Musik, und wenn die Musik stoppt, gruppieren sich schnell nach der Kategorie (versammeln sich auf der gleichen Insel), die der SL gerade genannt hat (z.B. Horoskop, Zahl der Geschwister, Schuhgröße, Lieblingsmannschaft...) - danach weiter tanzen, usw.","Musik","PL","freier Raum","","","",""],["Eigenschaften-Bingo","","Kennen lernen","","","","","Jeder TN malt sich eine 9-Felder (16,25,...-Felder) Bingo-Tabelle und füllt diese mit Eigenschaften oder Merkmalen (Augenfarbe, Haarfarbe, Schwimmerin,...) aus. Eine Freiwillige geht nach vorne und nennt drei seiner eigenen Eigenschaften oder Merkmale. Wenn jemand diese aufgeschrieben hat darf er die ankreuzen. Danach ruft dieser L eine nächste MitspielerIn in die Mitte, die auch 3 Eigenschaften nennt. Wer als erstes eine Reihe, Spalte oder Diagonale angekreuzt hat, hat gewonnen.","Papier","EA > PL","","","","",""],["Tellerdrehen","","Namen lernen","","","","","Alle L sitzen im Kreis. Ein Spieler lässt in der Mitte des Kreises den Teller wie einen Kreisel tanzen, ruft dabei den Namen eines anderen Spielers und setzt sich wieder auf seinen Platz. Der Aufgerufene muss den Teller noch erwischen, bevor dieser umfällt. Schafft er es nicht, muss er einen Pfand abgeben.","Teller","PL","Sitzkreis","","","",""],["Namen jonglieren","","Kennen lernen","Namen lernen","Konzentration","","","Alle L stehen im Kreis. Der SL wirft den ersten Ball (gelb) einem L zu und sagt dabei seinen eigenen Namen. Fällt der Ball, muss er wieder zum SL zurück. Wenn es schon gut klappt, kommt der blaue Ball ins Spiel, der Ball wird in der gleichen Reihenfolge geworfen. Bei diesem Ball sagt man, wem man den Ball zuspielt und wirft. Der dritte Ball (z.B. rot) kommt ins Spiel: der Fänger sagt, von wem er den Ball erhalten hat. Ziel ist es, dass alle drei Bälle zeitgleich von der Gruppe gespielt werden und beim Spielleiter ankommen.","drei Bälle","PL","Stehkreis","","","",""],["Bermuda Dreieck","","Kennen lernen","Namen lernen","","","","Zum Wiederholen von Namen: Die L stehen im Kreis. Der SL deutet auf einen beliebigen Spieler (A). Der rechte (R) und linke (L) Nachbar von A müssen nun gegenseitig ihren Namen nennen. Wer dies zuerst schafft, bleibt im Spiel - der langsamere der zwei (L oder R) scheidet aus und muss sich niederhocken. Er gilt damit nicht mehr als Nachbar und wird in Zukunft übergangen. Als nächster Nachbar gilt also immer die nächste Person (links oder rechts), die noch normal steht.(Damit es im Spiel deutlicher wurde, sollte sich die Person, auf die gedeutet wurde, ebenfalls kurz nieder hocken. Sie darf aber natürlich sofort wieder aufstehen.)","nichts","PL","Stehkreis","","","",""],["Anna","","Kennen lernen","Namen lernen","","","","Die L stehen im Kreis. Der SL geht zu einem L und fragt ihn: “Wie heißt du denn?” Der L antwortet (zum Beispiel eben \"Anna\"). Darauf \"singt\" der fragende Spieler den Namen, zuerst 2x lang, dann 2x kurz, dann 1x lang: “Annnnnnaaa, Annnnnnaaa, Anna, Anna, Annnnnnaaa!” “Anna” stellt sich hinter den fragenden Spieler. Diese Schlange bewegt sich  im Raum und stellt sich vor den nächsten Spieler. Ab dieser zweiten Runde wird der Name des gefragten Spielers in der Schlange nach hinten durchgesagt (also jeder Spieler stellt den gefragten Spieler dem jeweils hinter sich stehenden Spieler vor).","nichts","PL","Stehkreis","","","",""],["Ameisen","","Kennen lernen","Namen lernen","Aktivieren","","Bewegung","Die L - “Ameisen” -  bewegen sich chaotisch im Raum. Irgendwann unterbricht der SL und erklärt, dass die Ameisen jeweils die näheste andere Ameise begrüßen sollen. Dazu wird eine bestimmte Begrüßungsform vorgegeben: Händeschütteln, “Gimme five”, Knie an Knie, Nase an Nase reiben, Luftkuss, Küsschen auf die Wange, tanzen, auf die Schulter klopfen, gegenseitiges Hochheben... usw. Dabei werden auch die Namen ausgetauscht. Danach bewegen sich die Ameisen wieder chaotisch bis zum nächsten Kommando.","nichts","PL","","","","",""],["pecha kucha","","Präsentation","DaF Sprechen","","","","Zu einem Thema einen Vortrag halten mit Hilfe von 20 Bildern, die jeweils 20 Sekunden gezeigt werden. Die Dias laufen automatisch durch","Beamer","FA","","",". https://www.youtube.com/watch?v=L31SwpN1dAc","",""],["Wechselspiel","","DaF Sprechen","","","","Selbstkontrolle","Die Lernpartner haben unterschiedliche Arbeitsblätter, auf denen die Informationen verteilt werden: A weiß, was B nicht weiß und umgekehrt. Die Partner sollen durch Fragen die Informationen sammeln und am Ende etwas gemeinsam entscheiden / ein Problem lösen.","Arbeitsblätter A und B","PA","","","","",""],["Lesepuzzle","","Input","DaF LV","Selbstkontrolle","","","Ähnlich wie Bilderlotto: Die Lernenden lesen die Textteile, ordnen sie und legen die Textkärtchen in Reihenfolge auf die nummerierten Felder des Lösungblattes. Am Ende drehen sie die Kärtchen um. Stimmt das Bild, stimmt auch die Reihenfolge.","1 Lösungsblatt (Tabelle mit nummerierten Kästchen), Textkärtchen, 1 detailreiches Bild","EA / PA","","lesepuzzle.jpg","","",""],["Verbindungskrach","","Kennen lernen","Einstieg","Erwartung","","Bewegung","Die TN wählen eine Zahl zwischen 1 und 10. Danach kommt der Auftrag: Sie gehen herum, und rufen einander genau so viele Dinge LAUT zu. \"X Dinge, die Sie in diesem Training lernen möchten.“ oder \"X themenbezogene Inhaltspunkte, die besonders wichtig für Sie sind.\" oder \"X Dinge über sich, die für unsere Zusammenarbeit wichtig werden können\".","keine","CP","freier Raum","","","",""],["Keine Vorstellungsrunde mit Flipchart","","Kennen lernen","Erwartung","","","","Ein Plakat mit einem ähnlichen Text wie dies aufhängen: \"„Nachdem Sie dies gelesen haben, stellen Sie sich einer Person vor, die Sie noch nicht kennen. Bitten Sie diese Person, drei Dinge aufzuzählen, die sie im Training lernen möchte. Viel Spaß!“ Als SL den Anfang machen, den ersten begrüßen und auf den Flipchart aufmerksam machen. Darauf folgt KEINE Kennenlernrunde, evtl. in Dreiergruppen nochmal zusammenfassen, was sie oft gehört haben und dann PL.","Flipchart","PL","","","","",""],["Titelblatt","","Kennen lernen","","","","","https://sandra-dirks.de/trainerquickie-einstieg-nr-9-titelblatt/","Papier, Stifte","EA --> PL / CP","","","","",""],["Lobkärtchen","","Feedback","","","","","TN wählen Karten, beschriften sie und überreichen sie den Kolleginnen persönlich.","Kärtchen","EA > CP","","lobk_rtchen.jpg","","",""],["Gefahrguttransport","","Gruppendynamik","Problemlösung","Kommunikation","","","https://sandra-dirks.de/gruppendynamische-methode-der-gefahrentransport/","Zollstock, kleine Gegenstände, Augenbinden, Loskarten","GA","freier Raum","","","",""],["Greif den Löffel","","Wiederholung","Transfer","","","","Die Teilnehmer sitzen in Kleingruppen an Tischen und stellen sich gegenseitig Fragen zum bearbeiteten Thema, um Bonbons oder Spielsteine zu gewinnen. Der Teilnehmer, der zuerst nach dem Löffel greift, darf die nächste Frage beantworten. Die Übung gewinnt an Tempo, wenn die Teilnehmer verstanden haben, dass sie zunächst mal um die Löffel kämpfen müssen.","Löffel","PL","","greif_den_l_ffel.jpg","","",""],["QR-Code-Rallye","","Input","Üben","","","WWW, BYOD, Bewegung","TN suchen nacheinander versteckte QR-Codes im Klassenraum / im Gebäude / auf dem Gelände / bei einem Ausflug in der Stadt. Jeder Zettel enthält eine Aufgabe und die Lösung einen Hinweis auf den Fundort des nächsten Zettels. Gewonnen hat die Gruppe, die zuerst im Ziel ankommt.","Zettel","PA / GA","","","","",""],["QR-Code-Tag","","Visualisierung","","","","Autonom","Bedienungsanleitung für Geräte und Lernspiele Spielregeln als QR-Code speichern und an die Geräte / Verpackung kleben","Tag","","","qr-code_tag.jpg","","",""],["Klassenraum Hot-Spots","","Üben","Präsentieren","Differenzieren","","Autonom, BYOD","Extras oder Hilfe als QR-Code-Kärtchen mit “Titeln” immer an der gleichen Stelle im Klassenraum z.B. Tür, Schwarzes Brett, Schrank, markierte Wandteile","QR-Codes","","","","","",""],["QR-Code-Plakate","","Präsentation","DaF Sprechen","","","Differenzieren","Plakate mit QR-Codes versehen: für interessante Zusatzinfos, Hilfestellung (z.B. Erklärung von Fachbegriffen) Bilder, Videos und Audiodateien + Audiodateien mit eigenem Vortrag / Erklärungen","","","","5-Beispiel-Plakat-1.png","","",""],["W-Planungsraster","","Planen","Ideen","","","Projekt","Es werden zwei bis drei Flipchart-Bögen aufgehängt und mit folgenden Überschriften bzw. Zwischenüberschriften versehen: 1. Was ist Gegenstand bzw. Thema des Projekts? 2. Welches Ziel verfolgt das Projekt, was nützt es uns? 3. Welche Mittel zur Realisierung haben wir? (Brainstorming) 4. Welche Schritte? (Zeitachse, Ablauf) 5. Wer soll es machen? (Verantwortlichkeiten) 6. Woran kann man ein Gelingen feststellen? (Ideen zur Evaluation) 7. Welche Folgen (auch ungewollte) können auftreten? Die Fragen werden zunächst in Einzelarbeit auf einem DIN-A4-Zettel beantwortet und dann nach und nach in der Gruppe diskutiert, sodass zunehmend Konsistenz hinsichtlich der Beantwortung der Fragen hergestellt wird. Die Antworten schreibt ein Gruppenmitglied oder eineModeratorin bzw. ein Moderator auf die Flipcharts. Am Schluss sollte ein zweiter Durchgang gemacht und alle Ergebnisse im Zusammenhang behandelt und auf Konsistenz sowie Plausibilität geprüft werden. Am Ende steht ein konkreter und überschaubarer Ablaufplan für ein Projekt.","Flipchartbögen, Stifte","GA","","","","",""],["1-Minuten-Papier","","Feedback","Evaluation","Reflexion","","","Die/der Lehrende schreibt die Fragen, die sie/er stellen möchte, an die Tafel oder auf ein Flipchartpapier, welches aufgehängt wird. Jede/r TN nimmt sich ein Blatt Papier und schreibt kurze Stichpunkte zu den Fragen der/des SL auf  - pro Frage 1 Minute!","Papier","EA","","","","",""],["Kettenbrief","","Evaluation","Reflexion","","","","Fragen einzeln auf A4-Blätter schreiben, in größeren Gruppen auf mehrere Blätter. Blätter in die Gruppe geben. Die TN beantworten schriftlich die gestellte Frage auf dem Papier und geben es anschließend an ihre/n Sitznachbar/in weitergeben. So entstehen mehrere Kettenbriefe. SL liest die gegebenen Antworten vor und nimmt sich nach jedem Kettenbrief kurz die Zeit, die Anmerkungen zusammenzufassen und zu kommentieren.","DIN A4-Blätter","EA --> PL","","","","",""],["Themenbögen","","Evaluation","Feedback","","","","Zu einzelnen Aspekten Themenbögen vorbereiten (z.B. Inhalte, Methoden, Arbeitsatmosphäre, Raum, Zeit, Material...). In den Gruppen werden Meinungen zu der jeweiligen Leitfrage ausgetauscht und diese auf den Bögen notiert. Bogen weitergeben  (Wechsel der Gruppen etwa alle 5 Minuten, nach einem Signal). Am Ende werden die Bögen an der Wand gut lesbar aufgehängt. SL nimmt zu den Äußerungen Stellung, fragt nach, wenn etwas unklar ist. Gemeinsam werden Verbesserungsmöglichkeiten besprochen.","DIN A3-Blätter","GA --> PL","","","","",""],["Argumentations-Map","","Ideen","Präsentation","DaF: Sprechen","","Strategie","Vorträge / Statements vorbereiten: Das Argumtenations-Map gliedert sich in vier Abschnitte (Blatt falten und nummerieren) und wird im Uhrzeigersinn (rechts oben beginnend) angefertigt: 1. Wie ist der Ist-Zustand (IST)? 2. Wie sollte das Thema dargestellt werden oder das Problem gelöst sein (SOLL)? 3. Was spricht für die Darstellung oder Lösung des Themas / des Problems (WARUM)? 4. Was ist zu tun (APPELL)? Hier sollte in einem aussagekräftigen Satz oder in einem Aufruf zum Ausdruck gebracht werden, was getan werden muss, um die Darstellung des Themas oder die Lösung eines Problems herbeizuführen.","DIN A4-Blatt","EA / PA / GA","","","","",""],["Diagramme","","Präsentation","Visualisierung","","","","Ergebnisse (Umfragen, Recherchen, Marktforschung...) statistisch auswerten und in Form von verschiedenen Diagrammen präsentiere","Papier / Flipchart / Stifte","EA / PA / GA","","diagramme.jpg","","",""],["Votum mit Farben","","Feedback","","","","","Die TN bewerten den Baustein / den Tag beim Rausgehen, indem sie sich eine Kugel wegnehmen und in das Glas geben. Anhand der Farbgebung hat der SL einen guten (und anonymen) Überblick. Vorteil: geht sehr schnell.","Schüssel mit verschiedenfarbigen Holzkugeln, (Ampel oder nur rot/grün), ein hohes Glasgefäß","EA","","","","",""],["Fragelandschaft 2","","Erwartungen","Einstieg","","","","Die TN bekommen eine AB mit W-Fragen (in einer Sprechblase), auf die sie möglichst viele Fragen zum Thema. Zufallspaare bilden, die im Gespräch 3 gemeinsame Fragen für das PL festlegen. Zurück im Plenum stellen die TN ihre Fragen an den SL. Es gibt dabei keine festgelegte Reihenfolge. SL versucht, die Fragen der Reihe nach zu beantworten. Fragen, die ausgiebiger behandelt werden müssten, werden zurückgestellt und kommen in den „Fragespeicher“ SL sammelt die Fragelandschaften ein und erstellt eine Gesamtübersicht über alle gestellten Fragen. Ähnliche Fragen werden dabei zusammengefasst. Beim nächsten Zusammentreffen mit den TN wird das Thema noch einmal aufgegriffen und offengebliebene Fragen geklärt.","AB","PA --> PL","","","","",""],["Fremd-Wörter","","Aktivieren","Einstieg","DaF WS","","","Die TN sitzen in einem Kreis. Jeder denkt an einen Wort, das zum Thema passt. Sie sagen reihum einen Satz mit dem Wort in der gemeinsamen Sprache, sagen aber das Wort in ihrer Muttersprache. Die TN versuchen, das Originalwort zu finden. (Geeignet auch für Schulklassen mit mehrsprachigen Kindern.)","","Sitzkreis","","","","",""],["Das Klassenherz","","Feedback","Gruppendynamik","Emotionale Intelligenz","","","1. Die Kinder sollen ihren Namen auf ein Stück Papier schreiben. Diese werden dann gefaltet, vermischt und anschließend zieht jedes Kind einen Zettel mit dem Namen eines anderen Kindes. 2. Kontrollieren Sie, dass jeder einen anderen Namen und nicht seinen eigenen gezogen hat. 3. Zeigen Sie den Kindern ein großes Herz aus Papier, welches das Klassenherz darstellen soll. 4. Jedes Kind soll einen netten Satz über seinen Mitschüler sagen, dessen Namen es gezogen hat. 5. Die Kinder schreiben daraufhin alle netten Sätze auf das Papierherz, z. B.: (Jane) hat gute Ideen, (Tom) hilft sehr gern.","Zettel, Plakat mit einem großen Herz","EA --> PL","","","","",""],["Wo bin ich?","","DaF WS","Einstieg","Aktivieren","","","Ein TN denkt an einen Ort und eine Aktivität, die man dort machen kann. Die anderen dürfen ihm 20 ja-nein Fragen stellen, um herausfinden, welcher Ort und welche Aktivität gemeint ist. Der TN darf nur mit „ja“ und „nein“ antworten und keine Hinweise geben.  (Möglich: Nach jeder Frage in Gruppen beraten, was man als nächstes fragt.) Wenn sie es innerhalb der 20 Fragen nicht herausbekommen haben, hat der TN gewonnen und hat noch einen Versuch.","","PL (GA --> PL)","Sitzkreis","","","",""],["Luftballon jonglieren","","Konzentration","Aktivieren","Kooperation","","","Jede Gruppe (4 TN) bekommt einen Luftballon. Die TN versuchen für eine bestimmte Zeitspanne, ihren Ballon in der Luft zu behalten, indem sie auch Hindernissen ausweichen. Immer wenn ein TN  den Ballon berührt, bekommt die Gruppe einen Punkt. Wenn der Ballon auf den Boden fällt, muss die Gruppe von Neuem beginnen und verliert alle Punkte. Die TN müssen sich beim Berühren des Ballons abwechseln – erst wenn alle TN den Ballon berührt haben, ist der erste TN wieder an der Reihe.","1 Luftballon pro Gruppe","GA","normal eingerichtet, Möbel werden nicht weggestellt","","","",""],["Wer sind wir Bingo","","Kennen lernen","Einstieg","Erfahrung","Gruppendynamik","","Die TN sitzen in einem Kreis. Jeder bekommt einen Bingo-Fragebogen. Sie kreuzen die Felder auf dem Fragebogen an, die auf sie zutreffen.  Der SL liest durcheinander Fragen vor, die TN stehen auf, wenn das von ihnen angekreuzte Feld genannt wird - und schauen in die Runde, wer auch steht. Variante: Fragebogen enthält nur Nummer, der SL hat eine Liste mit nummerierten Fragen, die er nacheinander vorliest. Die TN stehen auf, wenn der Satz auf sie zutrifft und markieren auf dem AB die gehörte Nummer. Bekommen sie waagerecht, senkrecht oder diagonal 4 (oder 5) richtige, rufen sie auch Bingo beim Aufstehen","AB","PL","Stuhlkreis","","","",""],["Die unzerbrechliche Kette","","Kooperation","Gruppendynamik","Namen lernen","","","Jeder TN zieht einen Zettel, zieht jemand den eigenen Namen, legt es ihn zurück und entnimmt einen neuen. Es ist verboten, den gezogenen Namen in irgendeiner Weise zu kommentieren oder den Zettel zu zeigen. Wenn alle TN einen Zettel haben, sollen sie sich mit dem TN  zusammenfinden, dessen Name auf dem Zettel war, und sich mit ihren Armen einhaken, so dass sie eine Kette bilden. Die Übung ist abgeschlossen, wenn alle TN durch ihre Arme miteinander verbunden sind und eine durchgehende oder zwei Ketten entstanden ist/sind. WICHTIG: während der Übung TN nicht miteinander reden. Sie sollen stumm kooperieren, um die Kette aufzubauen. Zeit messen, wie lang die Gruppe braucht, um die Kette zu bilden. Wenn jemand spricht, werden fünf Minuten dazu gerechnet.  Die Übung sollte zwei- bis dreimal wiederholt werden, um den TN die Möglichkeit zu geben, ihre Zeit zu verbessern.","Zetteln mit Namen aller, mit Bleistift und sehr klein geschrieben, damit man die Namen beim Ziehen nicht sieht","PL","freier Raum","","","",""],["Unser gemeinsamer Freund","","Kennen lernen","Gruppendynamik","Gedächtnis","DaF WS","Kettenübung","Alle sitzen im Kreis. Gemeinsam wird dem Spielzeug ein Name gegeben. Der SL nennt das Spielzeug beim Namen und sagt eine persönliche Eigenschaft, z. B. Das ist X und X ist auch NEUGIERIG, wie ich. Spielzeug weitergeben, der nächste Spieler wiederholt die Informationen: Das ist X und er/sie ist neugierig ... und fügt eine persönliche Eigenschaft hinzu: und auch FRECH, wie ich. usw.","Spielzeug","Sitzkreis","","","","",""],["Die menschliche Digitalkamera","","Kooperation","Wahrnehmung","Vertrauen","DaF Sprechen","Bewegung","Die TN arbeiten in Paaren – einer ist der Fotograf und der andere die digitale Kamera. Die „Kamera“-TN schließen die Augen. Die „Fotograf“-TN müssen die „Kamera“-TN ganz langsam bewegen, um die Landschaft einzufangen. Wenn der Fotograf etwas Interessantes sieht, richtet er die „Kamera“ darauf und macht ein Foto (die „Kamera“-TN öffnen für zwei Sekunden die Augen).  Nach fünf Fotos geht der „Fotograf“-TN mit dessen „Digitalkamera“ zurück zum Ausgangspunkt. Die „Kamera“- TN sollen nun versuchen, sich an das Gesehene in der richtigen Reihenfolge zu erinnern. Danach tauschen sie die Rollen.  Zum Schluss sollen die TN ihre Gefühle und Wahrnehmungen während der Übung reflektieren (PA und dann PL)","","PA --> PL","","","","",""],["Zitatencollage","Schlagzeileincollage","Input","Diskussion","Präsentation","","WWW, BYOD","Die TN analysieren, vergleichen, kontrastieren Bestandteile einer Schlagzeilencollage oder Zitatecollage und bearbeiten sie oder ergänzen sie in Eigenrecherche um passende Elemente. (Schlagzeilen in Zeitung, Fernsehen und Internet, charakteristische / kontroverse Zitate von Journalisten, Schriftstellern, Experten...)","Zitate","GA","","","","",""],["Blick aus dem Fenster","","Kennen lernen","","","","WWW","TN erzählen / beschreiben kurz, was sie sehen, wenn sie aus dem Fenster schauen.","","EA","","","","",""],["Ein Stapel Karten","","Erfahrung","Diskussion","Transfer","DaF Sprechen","","Die TN sitzen im Kreis. Ein Stapel Karten wird herumgegeben. Jeder TN nimmt sich beliebig viele Karten vom Stapel. Nach einer kurzen Bedenkzeit darf jeder TN so viele Sätze zu einem vorgegebenen Problem/Thema äussern, wie er Karten hat. Die Äusserungen werden nicht kommentiert.","Moderationskarten o. andere Gegenstände","PL","SItzkreis","","","",""],["Kartenkontrolle","","Transfer","Wiederholung","Kontrolle","","","Der KL verteilt an jeden TN eine Karte mit einem Begriff aus dem letzten Baustein. Eine Karte ist mit einem roten Punkt gekennzeichnet. Die TN haben 2 Minuten Zeit sich zu überlegen, was ihnen zu dem Stichwort einfällt. Der TN, der die Karte mit dem roten Punkt hat, fängt an und sagt etwas zur Bedeutung seines Begriffes. Ein TN, dessen Begriff zum ersten passt, übernimmt das Wort und erläutert seine Karte. … usw. Der KL sammelt die besprochenen Karten ein und hängt sie in der Reihenfolge der Nennung an eine Stellwand. Zum Abschluss der Übung bespricht er mit den TN, wo in der Reihenfolge Brüche vorhanden sind. Variationen: 1. Die Karten werden zu Beginn an die Stellwand gehängt, jeder TN sucht sich eine Karte aus. 2. Vor Beginn der Übung können TN Karten tauschen, wenn diese ihnen nicht zusagen. 3. Der KL bereitet einige Karten mehr vor und bietet diese zum Tausch an.","Karten mit Begriffen, Pinnwand","EA --> PL","","","","",""],["Ausschütteln","","Aktivieren","Konzentration","","","Bewegung","Im Kreis stehend, zu lockerer Musik einen Körperteil nach dem anderen ausschütteln: ”Finger der rechten Hand..., rechte Hand..., ganzer Arm..., jetzt dazu mit den Fingern der linken Hand... usw., den rechten Fuß..., den Kopf..., den Po..., den ganzen Körper schütteln” usw.","","PL","","","","",""],["Kartenrennen","","Erwartung","","","","","Vorgegebene oder gemeinsam (etwa durch Kartenabfrage) erarbeitete Themenschwerpunkte oder Zusatzthemen eines Seminars werden untereinander an eine Stellwand gehängt. Vorher ist die Stellwand durch Striche und Zahlen in Kästchen aufgeteilt worden (tabellarisch). Die TN gehen nacheinander zur Stellwand. Jeder TN beurteilt, welche Themen ihn interessieren und hängt diese Themen ein Feld weiter. Als Ergebnis ergibt sich ein klares Bild, welche Themen am meisten gewünscht worden sind.","Moderationskarten, Raster, Pinwand","PL","","","","",""],["Kenntnis-Skala","","Erwartung","Einstieg","","","","Raster vorbereiten: so viele Spalten wie TN, Reihen mit den Seminarthemen. In den Längsspalten vermerken die TN (z.B. anhand einer Bewertungsskala von 1-6) nacheinander, wie gut ihr Kenntnisstand zu dem jeweiligen Thema ist. (sie kleben Post-its an)","Raster; Post-its","EA --> PL","","","","",""],["Namen-Schleifen","","Kennen lernen","Erfahrung","Erwartung","","Bewegung","Jeder der in den Raum kommt, wählt sich eine Papierschleife (in verschiedenen Farben) aus und faltet diese in 6 bzw. 8 Felder. In jedes der entstandenen Felder schreibt der TN nun seinen Vornamen. Diese Namensschleifen werden angesteckt. Bei Musik geht man umher, wählt sich einen Gesprächspartner und plaudert ein wenig mit ihm. Bei jedem Gesprächspartner werden jeweils ein Namenskärtchen von der eigenen Schleife gerissen und dem Partner gegeben. Jeder klebt seine gesammelten Namenskärtchen zu seinem Namen an einem Packpapierbogen. Variation: Die beiden letzten Partner unterhalten sich gezielt über ihre Erwartungen und Befürchtungen. ”Was wäre das Schönste, was mir hier passieren könnte?” ”Was wäre das Schlimmste, was mir hier passieren könnte?” Oder: Die Interviewergebnisse werden jeweils in der großen Gruppe (wenn nicht mehr als 20 Teilnehmer da sind) vorgestellt.","Papier, Stifte","CP","","","","",""],["Werkzeugkasten","","Kennen lernen","Einstieg","","","","Die TN schaffen persönliche assoziative Verbindungen zwischen dem Thema des Seminars und freigewählten Werkzeugen nach dem Schema: „Meine Aufgabe ist vergleichbar mit ...“, „Als Assoziation zum Seminarthema fällt mir ein ...“.","Verschiedene Werkzeuge (Hammer, Schraubenzieher, Säge, Feile).","PL","","","","",""],["Transferlandkarte","","Reflexion","Transfer","","","","Gelungenes und Misserfolge werden analysiert und die Erkenntnisse für die Selbststeuerung nutzbar gemacht. Die ausgefüllte Transfer-Landkarte wird von einer Bezugsperson als Klärungshilfe «gegengelesen». Die Transferlandkarte ist eine strukturierte Form eines Lernjournals","AB","EA (-->PA/GA)","","transferlandkarte.jpg","","",""],["Versteckte Überraschung","","Einstieg","Erwartung","","","","Gegenstände, die mit der später folgenden Aktivität in Verbindung stehen, unter einem Tuch verstecken. TN nehmen nacheinander ein Objekt heraus und stellen es der Gruppe vor, spekulieren, was auf sie zukommt. Alternativ können die TN auch zeitgleich oder nacheinander mit den Händen die verdeckten Gegenstände unter dem Tuch ertasten und sich darüber austauschen.","Gegenstände, Decke / Tuch","PL / PA","","","","",""],["Wasserstand","","Feedback","","","","","Zur Veranschaulichung der Stimmungslage / Zufriedenheit. Die TN füllen reihum eine Kelle mit Wasser und verteilen das Wasser auf die beiden Gefäße. Dabei erläutern die TN, warum sie die Wassermenge so verteilen. Wenn alle ihr Wasser verteilt haben, lässt sich am Wasserstand in den Gefäßen eine Gesamtbewertung ablesen.","Zwei leere Schalen / Eimer..., mit plus und minus markiert, ein mit Wasser gefülltes Gefäß, eine Kelle / ein Becher.","Stuhlkreis","","","","",""],["Lernstraße","","Wiederholung","Üben","Input","","Autonom","TN bearbeiten Aufgaben im eigenen Tempo, jedoch in gebundener Reihenfolge (um Staus zu vermeiden: Abreissaufgaben oder QR-Code-Stationen)","Aufgaben","PA / GA","Stationentische","","","",""],["Im Takt gehen","","Konzentration","","","","Bewegung","Die SL gibt mit einem Instrument den Takt vor – die TN sollen sich genau auf den Takt konzentrieren und diesem mit ihren Schritten folgen. Setzt die SL mit dem Taktschlagen aus, müssen alle so stehen bleiben, wie sie waren und dürfen sich nicht bewegen. TN, die sich dennoch bewegen scheiden aus, bis schließlich ein TN übrig bleibt.","Instrument","PL","freier Raum / im Freien","","","",""],["Wörter zählen","","Konzentration","DaF HV","Einstieg","","","Bei dieser Konzentrationsübung müssen die TN gleichzeitig Wörter zählen und genau zuhören. Die SL liest einen Text vor / erzählt eine Geschichte. Vorher wird der Klasse ein Wort vorgegeben, das gezählt werden soll. Die TN sollen nun der Geschichte zuhörn und anschließend darf von einem TN aufgelöst werden, wie oft das jeweilige Wort im Text vorkam. Sollte dieser TN falsch liegen, darf das nächste raten.","Geschichte","FA","","","","",""],["ABC-Geschichte","","Konzentration","DaF Sprechen","Kooperation","","","Es soll eine Geschichte erzählt werden, wobei jeder TN einen Satz sagt. Das jeweilige Anfangswort des Satzes soll mit den Buchstaben des Alphabets beginnen. . Beispiel: „Anna wollte Schlittschuhlaufen.“ „Bevor sie das tun kann, muss sie trainieren.“ „Chamäleon Cora sieht ihr dabei zu.“ und so weiter, bis das gesamte Alphabet durch erzählt wurde.","","PL","Sitzkreis","","","",""],["Erde, Luft und Wasser","","Konzentration","DaF WS","","","","Ein TN nennt eines der drei Elemente: Erde, Luft oder Wasser. Wer zuerst ein Tier nennen kann, das im genannten Element lebt, darf das nächste Element vorgeben usw.. Die bereits genannten Tiere dürfen nicht doppelt verwendet werden.","","PL","Sitzkreis","","","",""],["Verbsuche","","Konzentration","DaF WS","","","Wettbewerb","Bei dieser Übung bekommen die TN mehrere Substantive vorgegeben und müssen ein Verb finden, das zu allen passt. Die SL sagt im normalen Tempo die Substantive -  Beispiel: Die Substantive: Haare, Auto, Wäsche passen zum Verb waschen. Wer zuerst das richtige Verb gefunden und genannt hat, bekommt einen Punkt. Der TN / die Gruppe mit den meisten Punkten gewinnt.","Wortliste, Buzzer","PL (EA/GA)","","","","",""],["Suchsel","Magisches Quadrat / Suchquadrat","Konzentration","DaF WS","","","Selbstkontrolle","Die TN suchen und markiern in einem Buchstabenraster sinnvolle Wörter (waagerecht, senkrecht, diagonal - evtl. auch rückwärts geschrieben). Digital erstellen! Kontrolle mit einem Lösungsblatt oder Lösungsfolie","AB","EA/PA","","","www.suchsel.de","",""],["Anaconda","","Kooperation","Aktivieren","","","Bewegung","Die TN stehen hintereinander und halten sich an den Hüften fest. Nun versucht der erste TN der Reihe den hinteren Schwanz der Schlange (letzten TN) zu fangen. Gelingt ihm dies, so wird der gefangene TN  zum  Kopf der Schlange. Das Spiel beginnt von vorn.","","CP","freier Raum / im Freien","","","",""],["Indianer in der Nacht","","Konzentration","Wahrnehmung","","","Bewegung","Alle TN sitzen im Schneidersitz im Kreis. Sie bilden einen Indianerstamm. Der SL bestimmt vier bis fünf Freiwillige. Diese haben die Aufgabe, die Fähigkeiten der Stammesmitglieder zu testen. Der SL bittet nun alle im Kreis sitzenden die Augen zu schließen. Die Freiwilligen schleichen um den Kreis herum und suchen sich jeder einen Indianer, hinter dem sie stehen bleiben. Der SL bittet nun alle, die glauben, dass hinter ihnen ein Indianer steht, die Hand zu heben. Erst jetzt dürfen die Augen geöffnet werden. Alle, die richtig geraten haben, dürfen nun um den Kreis schleichen.","","Sitzkreis","","","","",""],["Florenzer Marktplatz","","Kennen lernen","Erwartungen","Ziele","","","TN verteilen Sie sich im Raum. Sie stellen sich vor, dass sie auf dem Marktplatz in Florenz sind. Der SL gibt nacheinander 4 Impulse: 1. Sie schauen Sie sich den Raum und die Menschen an, gehen durch den Raum und begrüßen 3 Menschen, die Sie nicht kennen. 2. Sie gehen weiter und stellen sich drei TN vor. 3. Gehen weiter, stellen sich wieder vor und tauschen sich mit 3 Menschen über ihre Erwartungen aus. 4. Gehen weiter, stellen sich 3 neuen TN vor und tauschen sich überiIhre Vorerfahrungen zum Thema aus.","Musik","CP","","","","",""],["1-2-Hopp","","Aktivieren","Konzentration","","","","Die TN zählen die natürlichen Zahlen der Reihe nach auf bis 100. Ist eine Zahl durch drei teilbar (z.B. 12) oder ist in der Zahl eine drei enthalten (z.B. 23), muss der TN, der an der Reihe ist, statt der jeweiligen Zahl  „Hopp“ sagen (evtl. auch springen).","","PL","Stehkreis","","","",""],["MOSCOW","","Kennen lernen","Erwartung","","","","Die TN erhalten mögliche Seminarinhalte auf Kärtchen und ordnen diese dann nach Bedeutsamkeit. Dabei wird nach Must, Should, Could und Won´t-Themen unterschieden.  Must-Themen sind die Themen, die auf gar keinen Fall im Seminar fehlen dürfen und die für alle gleichermaßen bedeutsam sind. Should-Themen sind wichtig und sollten behandelt werden. Auch wenn diese Themen von großer Bedeutung sind, ist z.B. eine Verschiebung auf ein Folgeseminar möglich. Could-Themen sind „nice to have“. Wird es mit der Zeit eng, dann kann man auf diese Themen auch verzichten. Allerdings sind die Could-Themen nicht unwichtig – hier liegt oft der Unterschied zwischen einer mittelmäßigen oder einer sehr guten Bewertung des Seminars begründet. Won’t –Themen sind die Nicht-Ziele des Seminars. Hier kann zum Beispiel deutlich gemacht werden, dass bestimmte Themen gar nicht erwünscht sind.","Kärtchen, Pinwand","PL","","","","",""],["7 VIP-s","","Reflexion","Transfer","","","","Am Ende eines Seminartages oder einer Unterrichtseinheit werden die 7 wichtigsten Punkte (= 7 Very Important Points) noch einmal zusammenfassend dargestellt.","","EA/GA/FA","","","","",""],["Büchertisch","Stiller Dozent","Input","","","","Autonom","Ein vorbereiteter Tisch im Seminarraum lädt die TN dazu ein, in ausgewählten Materialien (Bücher, Dokumente, usw.) selbstgesteuert nach neuen Lerninhalten zu suchen und darin ausgewählte Inhalte zu erschließen.","Bücher, Zeitschriften","","","","","",""],["Elevator-Statements","Aufzug-Präsentation","Präsentation","Input","Einstieg","","","TN oder SL geben in ein bis zwei Minuten eine Kurzpräsentation zu einem Thema, vermitteln dabei die Kernbotschaften und wecken das Interesse des Plenums.","","FA","","","","",""],["Szene-Stopp-Reaktion","Forumtheater","Einstieg","Erfahrung","Transfer","","","TN spielen eine Szene. Einzelne oder alle Zuschauer ersetzen (zeitweise) die Spieler, greifen in die dramatische Handlung ein und verändern sie.","","PL","","","","",""],["Geocoaching","","Input","Kooperation","Aktivieren","","BYOD, WWW","Die TN suchen mit GPS-Geräten oder einer Navigations-App auf einem Smartphone/Tablet nach Verstecken (engl. caches), die durch geografische Koordinaten definiert sind. Dort finden sie Aufgaben, die sie lösen müssen (um sich ggf. auf die Suche nach dem nächsten Versteck machen zu können).","Handy","PA/GA","","","","",""],["Leittextmethode","","Input","Üben","","","Autonom","Leittexte sind schriftliche Anleitungen zum Lernen. Sie führen durch Fragen und Aufgaben die TN zur selbstständigen Informationssuche, zur Arbeit mit Medien, Quellen und Originalmaterialien. Intention: die systematische Erkundung in Praxisbereichen oder die Lösung praktischer Aufgaben (Projekt).","AB","EA/PA/GA","","","","",""],["Lern-Spaziergang","Learning Walk","Reflexion","DIskussion","","","","Die TN und der SL nutzen einen Spaziergang außerhalb des Seminarraums für gemeinsames Lernen oder individuelles Nachdenken.","","EA/PA","im Freien","","","",""],["Innovationsdrehscheibe","","Problemlösung","Planen","Ziele","Erfahrung","","Das Instrument listet im Außenbereich die Kategorien aus der obigen Tabelle auf. Im Zentrum der Drehscheibe sind 3 Zeiger angebracht (aus Moderationskarten zugeschnitten). Mit Hilfe dieser Zeiger kann man Punkt für Punkt die Kategorien durchdenken, an denen man bei einem konkreten Problem/Projekt „drehen“ könnte, um eine neue Lösung zu finden.  Mit Hilfe der drei Zeiger kann man bis zu drei Kriterien miteinander kombinieren. Nicht immer braucht man tatsächlich alle „Schrauben“ (bzw. Zeiger), oft reicht schon eine Kategorie oder eine Kombination aus zwei Kategorien, um eine gute neue Lösung zu erreichen.","","GA / PL","","Innovationsdrehscheibe-4.jpg","http://www.methodium.de/innovationsdrehscheibe/","",""],["Aufmerksamkeitswecker","","Input","Präsentation","DaF Sprechen","","","Originelles Zitat oder Motto, provokative Frage oder These, widersprüchliche Aussage, Skizze oder Comic mit Bezug zum Thema, kurzer, anschaulicher Erlebnisbericht, aktuelles Ereignis, Allegorie, Vergleich, den jeder versteht, einfache Feststellung, in der anklingt: die Sache ist gar nicht so einfach!","","FA","","","","",""],["In einem Satz erklärt","","Transfer","Wiederholung","DaF WS","DaF Sprechen","","Bei „In einem Satz erklärt“ werden zentrale Begriffe und Aspekte zum Seminarthema an eine Pinnwand gehängt. Der SL zeigt an, welcher Aspekt erklärt werden soll und wirft den Ball zu einem TN. Dieser hat die Aufgabe, den Begriff „in einem Satz“ zu erklären. Gelingt dies zur Zufriedenheit der Gruppe, dann wird die Karte umgedreht. Der TN wirft nun den Ball weiter und benennt gleichzeitig den nächsten zu erklärenden Begriff. Die Gruppe spielt den Ball weiter, bis alle Karten erklärt und umgedreht sind. Die vorbereiteten Begriffe kann man auch weglassen. Dann ist immer der TN gefordert, der gerade eben eine Erklärung abgegeben hat. Dieser denkt sich den nächsten zu erläuternden Begriff aus und wirft den Ball der Person zu, von der er die Erklärung „in einem Satz“ hören möchte.","Kärtchen, Tafel / Pinnwand","PL","Halbkreis","","","",""],["Drei-Wort-Assoziationen","","Ideen","Erfahrung","Einstieg","","Bewegung","Im Rahmen der „Ballrunde“ assoziativ Begriffe sammeln: Zu einer Leitfrage dürfen maximal drei Worte sagen, bevor der TN den Ball weitergibt.  Die genannten Begriffe kann der SL am Flipchart sammeln. Die Begrenzung auf drei Worte führt dazu, dass recht schnell eine lange Liste an Begriffen gefunden wird. Der Ball wird weitergegeben, solange die TN sich leicht damit tun, neue Aspekte zu finden. Danach kann die Fragestellung geändert werden, zum Beispiel mit einer direkten Umkehrung.","Ball","PL","Stehkreis","","","",""],["Planning poker","","Planen","Idee","Kooperation","","Projekt","Die Karten sind bedruckt mit Zahlenwerten, die Zahlen können für Zeitdauer oder auch für Komplexität stehen. Einige Kartendecks besitzen auch Sonderkarten: Die Kaffeetasse steht für einen „Ich brauch eine Pause!“-Hilferuf, Joker-Karten können dann gezogen werden, wenn ein TN der Meinung ist, den Task gar nicht beenden zu können. Jeder TN der Schätzrunde benötigt ein Kartendeck. Der Moderator (der selbst nicht mit spielt) erläutert das Vorgehen und das Thema des Meetings.        Anschließend nennt er die erste zu schätzende Aufgabe und steht für Rückfragen zur Verfügung.        Die TN nehmen eine Schätzung für diese Aufgabe vor und legen die Karte mit dem passenden Zahlenwerk verdeckt auf den Tisch.        Alle TN drehen gemeinsam ihre Karten um, so dass die Schätzungen sichtbar werden.     • Schätzungen sollten nur von denjenigen abgegeben werden, die auch tatsächlich an der Aufgabe arbeiten.     • Bei Unsicherheiten zwischen zwei Zahlen sollte zur höheren (konservativ) geschätzt werden.     • Während des gesamten Planning Poker-Spiels ist ein Timer hilfreich, der ausschweifende Diskussionen und Fragerunden unterbindet. Ein bis zwei Minuten pro Diskussionsrunde sollten ausreichen.     • Die Kaffeetassenkarte darf tatsächlich eingesetzt werden! Planning Poker kann intensiv sein – und dafür werden frische Teilnehmer mit freiem Kopf benötigt.       Die TN mit den höchsten und niedrigsten Schätzungen begründen ihre Meinung. An dieser Stelle kann diskutiert werden.        Es folgt eine weitere Schätzrunde auf Basis der neuen Informationen.        Diese Schätzung-Diskussion-Zyklen können grundsätzlich beliebig oft wiederholt werden, bis es zu einer Einigung kommt. Die Stimme des TN, der die Aufgabe vermutlich umsetzen wird, hat hierbei das höchste Gewicht. Stellt sich allerdings heraus, dass es zu keiner Einigung kommt, sollte diese Schätzung vertagt und zur nächsten Aufgabe übergegangen werden. Ergebnis: Am Ende des Spiels liegen pro Aufgabe geschätzte Aufwände vor, auf die sich das Team gemeinsam festgelegt hat.","Kartenset","GA","Gruppentische","planning_poker_all-cards.jpg","","",""],["Lerntabu","","Transfer","Wiederholung","","","Autonom","Karten mit Begriffen aus dem Seminar vorbereiten – oder TN bereiten in Gruppen Karten vor. Mit dem Spielbeginn erhält ein TN eine Anzahl von Karten mit Begrif fen, die erraten werden müssen. Er hat nun die Aufgabe, seiner Gruppe diese Begriffe zu erklären – ohne die Unterbegriffe auf den Tabukarten zu nennen. er muss also versuchen, den Begriff mit eigenen Worten, Beispielen  zu umschreiben. SL: Zeit überprüfen, beim Ablauf und beim Nennen der Tabu-Wörter tröten.","Kärtchen","GA --> PL","","mk2016_a_lerntabu.pdf","","",""],["Fünf Dinge","","Kennen lernen","Einstieg","Aktivieren","Gruppendynamik","","Die TN beantworten eine Frage, wie z. B.: „Was sind 5 Dinge, die du in deinem Leben noch gerne tun willst?“ Nach jeder Antwort zählt die ganze Gruppe laut mit: „1.“, „2.“ usw. bis zum Schluss: „5! 5 Dinge!“.","","PL","Stehkreis / Sitzkreis","","","",""],["Titanic","Eisscbollen","Kooperation","Gruppendynamik","Vertrauen","Aktivieren","Bewegung","Alle TN bilden 2er-Teams. Der SL verteilt die Zeitungsbögen auf dem Fußb
