en ist, wenn jede Gruppe eine andere Farbe bekommt. Mögliche Fortsetzung: Jede Gruppe stellt zu seinem Thema 2-3 Quizfragen, die alle beantworten müssen. Die Experten in der Gruppe sagen dann, ob die Antwort korrekt ist.)","Kärtchen (oval), Wäscheklammern / Büroklammern","CP","freier Raum","","","",""],["Schüttel-schüttel","","Aktivieren","Auflockern","","","Bewegung","Dauert so 1 Minute und wirkt wunder.  Die Lernenden stehen im Kreis und schütteln die Arme aus, indem sie sich auf den Rhythmus des Spruchs bewegen: “Uuuuund schüttel-schüttel ... und oben schüttel-schüttel, schüttel-schüttel-schüttel, uuuuuund unten.... und rechts … und links ... und in der Hocke... und vorne ... und hinten...","","PL","Stehkreis","","","",""],["Selbstkontrolle","","Kontrolle","","","","","Lösungsblatt an der Tür (Außenseite), in der Tüte, in einem Briefumschlaf, auf der Rückseite der Pinnwand – oder „eingebaute” Lösungskontrolle (wie bei Bandolo, Bilderlotto...)","LB","","","","","",""],["Seminarchronik","","Reflexion","Gruppendynamik","","","Ritual","Tagesgeschehen in Form von Fotos und Textberichten festhalten. (Für jeden Tag melden sich verantwortliche Chronisten zum Anfang der gemeinsamen Arbeit.)","vorbereitetes Slide","PA --> PL","","","","",""],["Seminarkalender","","Input","Einstieg","","","Ritual","Für jeden Tag unterschiedliche Infos präsentieren, z.B. Wort / Zitat / Spruch / Witz / unnützes Wissen :-) des Tages. (Präsentieren in Klarsichthüllen, Infos einzeln auf Kärtchen, alte Kärtchen Tag für Tag nach hinten ordnen).","Klarsichthüllen, Kärtchen","","","","","",""],["Seminarpantomime","","Aktivieren","Evaluation","","","Abschluss","TN arbeiten in Kleingruppen: Sie schreiben wichtige Ereignisse des Seminars auf Kärtchen. Dann ziehen die Gruppen reihum Kärtchen, stellen das Ereignis als Standbild dar, die anderen raten.","Kärtchen","PL","Sitzkreis","","","",""],["Seminartratsch","","Kennen lernen","DaF Sprechen","","","","Die Lernenden arbeiten zu dritt: Zwei spekulieren über die dritte Person anhand eines Fragenkatalogs (Berufswunsch als Kind, Hobbys, Haustiere...). Die dritte Person darf nichts dazu sagen. Wenn sie schon über alle drei getratscht haben, darf jeder sagen, was stimmt und was nicht.  Wenn alle fertig sind, können alle erzählen, was sie überrascht hat / was sie witzig fanden...","","GA3","","","","",""],["Sich fallen lassen","","Gruppendynamik","Vertrauen","","","","Ein TN lässt sich mehrmals nach hinten fallen und wird von einem anderen TN aufgefangen. Austesten: Immer mehr nach hinten gehen, kein Zeichen geben, wenn man sich fallen lässt... usw. Alternative: ein TN in der Mitte eines Kreises von ca. 150 cm lässt sich in eine Richtung fallen und wird von den anderen TN aufgefangen und wie ein Kreisel oder Pendel in eine neue Richtung \"geschubst\", \"weiterbewegt\".","","PA","freier Raum","","","",""],["Sich verorten","","Kennen lernen","","","","","Den eigenen Wohnort auf einer Karte markieren (Foto + Namensschild). Möglich: Standort und Wohnort mit einem Faden verbinden, durch Pfeil-Karten die Richtung zum Standort anzeigen.","Weltkarte","EA","","","","",""],["Signale","","Ritual","","","","","Ende / Wechsel von Aktivitäten durch deutliche (aber nicht unangenehme :-) Geräusche signalisieren.","Lokpfeife, Klingel, Klatschen, Panik-Button :-) ...","","","","","",""],["Sisyphos","","Gruppendynamik","Stress ertragen","","","","In der Mitte des Raumes steht ein Korb (Klappbox oder ähnliches). Der Korb ist mit leeren Klopapierrollen (oder etwas anderes - sollte nur handlich sein) befüllt. Ein TN hat nun den Auftrag, diesen Korb innerhalb von 30 Sekunden zu leeren. Dabei darf er aber den Korb nicht berühren, ihn nicht mit dem Körper zudecken oder ähnliches. Er wirft die Klopapierrollen kreuz und quer in den Raum. Die Gruppe sammelt alle Klopapierrollen wieder ein und wirft diese zurück in den Korb, und versucht so natürlich zu verhindern, dass der TN den Korb innerhalb der gesetzten Zeit leer räumt. Dies kann so lange wiederholt werden (mit anderen TN), bis alle dran waren, oder die Luft raus ist.","Schmierpapier, Korb","PL","freier Raum","","","",""],["Skalenbewertung","","Auswertung","Feedback","","","","Geeignet vor allem zur Bewertung von Produkten und Präsentationen: TN bewerten mit Punkten mehrere Aspekte (z.B. Informationswert / Unterhaltungswert / Kooperation im Team).","Skalen","EA / PA / GA --> PL","","","","",""],["Sonne, Mond und Sterne","","Aktivieren","Einstieg","DaF WS","Wiederholung","Bewegung","Der KL setzt sich auf einen Stuhl und sagt „Ich bin die Sonne, was passt zu mir?“ Und deutet auf die zwei Stühle links und rechts von ihm.  TN nennen Begriffe, die zu „Sonne“ passen. Der KL nimmt dann eine von beiden mit, der verbleibende TN setzt sich auf den Stuhl in der Mitte, wiederholt, wer / was  er ist... usw.","","PL","Stehkreis, in der Mitte 3 Stühle","MASTER_von_Sonne_Mond_und_Sterne_1.png","","Stühle in die Präsentation einbauen, Whiteboard freischalten, TN bewegen ihre Maus. ODER bei großen Gruppen einfacher mit Jamboard: TN schreiben ihre Namen auf die Kärtchen und ziehen sie schnell auf die Stühle. Mikro an","s. BBB"],["Spaziergang mit zwei Fragen","","Einstieg","Erfahrung","DaF Sprechen","DaF HV","Bewegung","TN ziehen eine Karte mit 2 Fragen (eine allgemeine und eine themenspezifische).  Sie gehen herum, stellen einem anderen TN eine der beiden Fragen (TN kann auch wünschen, welche Frage sie wollen). Wenn sie beide Karten besprochen haben, tauschen sie die Karten aus. Wenn jemand eine Karte zurückbekommt, die er schon hatte, kann er evtl. auf die Restkarten beim KL zurückgreifen. Variante: die Reihenfolge der Fragen immer ändern, Partner fragen, ob er 1 oder 2 will.","Kärtchen (evtl. laminieren)","CP","freier Raum","2_fragen.jpg","","",""],["Speed dating","","Kennen lernen","Präsentation","Einstieg","DaF Sprechen","Bewegung","Die L stehen in zwei Reihen einander gegenüber (Plätze auf dem Boden z.B. mit Kreide oder mit hingelegten Moderationskarten markieren. Bei längeren Gesprächen zwei Stuhlreihen bilden). Sie tauschen sich mit ihrem Gegenüber kurz aus (3-5 Minuten). Nach Ablauf der Zeit rücken sie weiter, so dass sich neue Partnerkonstellationen ergeben. Kein Plenum hinterher.","","PA","2 Stuhlreihen (bei kurzer Aufgabe stehend, Markierungen auf dem Fußboden)","sd_online.png","","Online: Jamboard vorbereiten mit Namenskärtchen - Bildschirm teilen. TN gehen mit dem Partner in den BOR mit der Nummer, wie es das Jamboard anzeigt. (BOR für 2-3 Min. einstellen) Vor Ablauf der Zeit das Jamboard ändern: jedes Namenskärtchen in der angezeigten Richtung um eine Position verschieben. In der neuen Runde hat jede/r einen neuen Partner.",""],["Spielregel-Kärtchen","","Präsentation","","","","","Regel für kompliziertere / längere Arbeitsphasen auf Kärtchen schreiben und nach und nach aufdecken. Kärtchen bleiben während der ganzen Arbeitsphase sichtbar an der Tafel / Pinnwand hängen.","Kärtchen, Pinnwand","FA","","","","",""],["Spinnennetz","Wollknäuelspiel","Einstieg","Aktivieren","DaF WS","","","TN beantworten reihum eine Frage (z.B. “Was ist dein Lieblingsessen”), dabei werfen sie einander ein Wollknäuel zu und wiederholen jeweils, was der Vorgänger gesagt hat. Am Ende wird das Spinnennetz aufgelöst: Alles wieder rückwärts aufzählen.","Wollknäuel","PL","Stehkreis","","","",""],["Spinnwebanalyse","","Reflexion","Feedback","Evaluation","","","TN markieren die zutreffenden Werte, verbinden danach die Punkte - die Größe des entstandenen Netzes zeigt die Gesamtzufriedenheit mit dem Ergebnis und dem Prozess","AB, Folien, Folienstifte in versch. Farben / vorbereitete Bilddatei - einfaches Grafikprogramm, Beamer","EA --> GA --> PL","","spinne.jpg","","",""],["Spionage","","Selbstkontrolle","Kooperation","","","","Bei arbeitsgleicher GA: für komplizierte Aufgaben / für Aufgaben mit verschiedenen Lösungen. Nach einem Lösungsversuch (Gruppen weitgehend fertig oder wenn sie nicht weiterkommen) Spione mit Beobachtungs- oder Nachfrageaufträgen zu den anderen Gruppen aussenden.","","GA","","","","",""],["Spontane Kommentare - wortwörtliches Protokollieren","","Reflexion","Feedback","","","","Spontane Kommentare der TN protokollieren und am Ende an die Wand projizieren. (Ordnen: Beschreibung, Kritik, Lob, Frage, Verbesserungsvorschlag...) Eignet sich zur Bewusstmachung von Tendenzen / Einstellungen.","Laptop, Beamer (und 2 SL :-)","PL","","","","",""],["Spots in movement","","Aktivieren","Gruppendynamik","Gruppenbildung","","Bewegung","TN bewegen sich zur Musik. Wenn die Musik aufhört, bekommen sie Aufgaben: z.B. herumgehen, und jeden begrüßen (in der MS, mit einer Geste...), dann zu 2: einen Partner finden und zu zweit einen Buchstaben formen, zu 3: auf 2 Beinen stehen, zu 4: sich an der Hand fassen und der Reihe nach alle Ecken abklatschen / 5 m auf einem Bein hüpfen, auf 3 Beinen (und 2 Händen) stehen, zu 5: laut ein Gruppenlied singen / einen Gruppentanz erfinden... Geeignet auch für Gruppenbildung: Wir hören bei der gewünschten Gruppenstärke auf.","Musik","PL","","","","",""],["Sprechblasen / Denkblasen","","Einstieg","DaF Schreiben","","","","Zu Bildern, auf denen Personen abgebildet sind (am besten an die Wand projizieren!), Sprech- oder Denkblasen formulieren. Texte vorlesen und raten lassen, zu welcher Person sie gehören.","Fotos mit Personen","PA / GA","","","","",""],["Sprechen mit Handycap (\"Helmut Kohl\")","","Kommunikation","Auflockern","","","","Den gleichen kurzen Text (evtl. Nur Wortreihe) mit verschiedenen Handicaps sprechen: Zunge hinter den unteren Zähnen einklemmen (“Helmut Kohl” :-), auf die eigenen Zeige- und Mittelfinger “beißen”...).","Text","EA","","","","",""],["Sprechende Hand","Du hast es in deiner Hand","Evaluation","Feedback","","","","Als Zwischenevaluation geeignet, da es Problemstellen ausleuchtet, die noch korrigiert werden können im Programm: TN malen ihre Hand auf einem DINA4-Blatt und schreiben in die Finger ihr Feedback über den erlebten Teil des Seminars: Daumen = OK!, Zeigefinger = Hinweis, Tipp, Mittelfinger = “Stinkefinger” - nicht OK!, Ringfinger = Gefühle, allgemeine Befindlichkeit, Gruppenatmosphäre, Kleinfinger = das kam zu kurz. Blätter anonym einsammeln, bei der Wiederaufnahme der Arbeit kommentieren.","A4-Blatt, dicker Stift, Stifte","EA","","","","",""],["Sprechmühle","","Erfahrung","Diskussion","Einstieg","DaF Sprechen","Bewegung","TN bewegen sich zu einer Musik im Raum. Wenn die Musik stoppt, tauschen sie sich mit einem Partner zu dem genannten Aspekt aus. Wenn die Musik weitergeht, trennen sich die Partner und tanzen weiter. 4-5 Diskussionsaspekte nennen.","Musik","CP","freier Raum","","","",""],["Stadterkundung mit allen Sinnen","","Input","Kennen lernen","Wahrnehmung","Kooperation","Bewegung","Ein Quadrat auf dem Stadtplan erkunden und Eindrücke zu allen Sinnen sammeln und mit Fotos bzw. durch das Sammeln von konkreten Gegenständen dokumentieren: Was kann man dort sehen / hören / riechen / schmecken / fühlen?","Stadtplan mit markiertem Quadrat, AB, Kamera, Beamer","GA4-5","in der Stadt","","","",""],["Standbild","Einfrieren","Einstieg","Körpersprache","Wahrnehmung","","","Eine Situation / ein Gefühl pantomimisch darstellen und auf Kommando die Bewegung „einfrieren“. Die anderen TN deuten das Standbild.","","PA / GA --> PL","freier Raum","","","",""],["Standing-Übung","","Körpersprache","Kommunikation","","","","Die TN stehen im Halbkreis. Freiwillige treten vor die Gruppe und stellen sich uns vor, wie sie es in einer neuen Klasse tun würden. Jeder hat Zeit, sich erst mit dem Rücken zu uns zu sammeln und erst, wenn er bereit dazu ist, sich zu uns umzudrehen. Danach wird besprochen, was selbst und von außen beobachtet wurde und ggf. Tipps gegeben. Manchmal hilft es, etwas in die Hand zu nehmen oder sich irgendwo abzustützen - jeder kann im Laufe der Zeit für sich selbst herausfinden, was er braucht.","","FA","U, Fächer","","","",""],["Stationentraining","Stationenlernen","Üben","Wiederholung","Input","Transfer","Autonom","TN bearbeiten Aufgaben an unterschiedlichen Stationen und kontrollieren ihre Lösung selbst. Prinzip: Wandern. Auswahl und Reihenfolge frei, nur ein Minimum der zu bearbeitenden Stationen ist angegeben.","AB, Lösungsschlüssel, Stationenschilder, Regelkärtchen, Laufzettel / Geländekarte, Hilfsmittel nach Bedarf","PA / GA3","möglichst großer Raum, Stationen an Tischen, Pinnwänden, an der Tafel, auf dem Boden, draußen...","","","",""],["Steckbrief","","Kennen lernen","Gruppendynamik","DaF Sprechen","","","Zu angegebenen Stichpunkten (Name? Land/Wohnort? Was ich mag.. Was ich gut kann... Was ich noch lernen will...) notieren TN Infos über sich auf dem Steckbrief. Sie gehen herum, sprechen mit anderen TN (3-5), mit denen sie etwas gemeinsam haben und suchen weitere Gemeinsamkeiten.","leere Steckbriefe in verschiedenen Farben, dicke Stifte, Foto der TN, Wäscheleine, Wäscheklammern","EA --> CP --> PL","freier Raum","","","",""],["Stegreifvortrag mit Wundertüte","","Kommunikation","Körpersprache","DaF Sprechen","","","Eine Tüte mit verschiedenen Gegenständen vorbereiten. TN ziehen einen Gegenstand und denken kurz über die Verbindung des Gegenstandes mit dem Thema eines Vortrags (z.B. Über den Weltfrieden) nach. Freiwillige sprechen 3-5 Minuten lang. (Redner vorher anklatschen: Er stellt sich vor den Halbkreis, Publikum klatscht 3x in die Hände, nennt den Namen des Redners und zeigt auf ihn.)","Kleine Gegenstände, undurchsichtige Tüte","FA","U, Fächer","","","",""],["Stille Bilderpost","","Wahrnehmung","Aktivieren","DaF Schreiben","","","Jeder TN erhält einen in Streifen aufgeteilten Papierbogen und soll auf dem oberen Streifen etwas zeichnen (z. B. mehrere Strichmännchen, eine Landschaft, eine Filmszene o. ä., nicht nur einen einzelnen Gegenstand!), was er selbst auch sprachlich beschreiben könnte. Dann wird das Blatt an den Nachbarn weitergegeben, jeder TN hat also jetzt die Zeichnung seines Nachbarn vor sich und schreibt in den nächsten Streifen eine kurze Beschreibung der Zeichnung. Dann knickt jeder TN die Zeichnung nach hinten um und gibt das Blatt weiter, so daß der nächste TN nur noch die Beschreibung sieht, nicht mehr aber die ursprüngliche Zeichnung. JederTN hat also jetzt eine Beschreibung vorliegen und macht nach dieser Beschreibung wieder eine Zeichnung in der nächsten Spalte. Dann knickt er die Beschreibung nach hinten und gibt das Blatt weiter. Im Wechsel werden so nach Zeichnungen Beschreibungen und nach Beschreibungen Zeichnungen angefertigt, bis die Papierbogen voll sind. Dann werden die Blätter entfaltet und herumgegeben. Auswertung: Besonders gelungen? Woran lag das? Informationsverlust? Missverständnisse? Wodurch entstanden?","Papierbögen, in Streifen geteilt","EA","","papier.jpg","","",""],["Sternentor","Stargate","Aktivieren","Kooperation","Problemlösung","","","Die TN stehen im Kreis, alle fassen sich an den Händen. Der Spielleiter organisiert kurz eine Lücke zwischen zwei TN. Diese Spieler bekommen das „Tor in eine andere Welt“ in die Hände: Einen großen Gymnastikreifen, der zwischen den beiden eingehängt wird. Diesen Reifen dürfen die beiden Spieler bis zum Ende der Übung nicht mehr loslassen. Ohne die Hände zu lösen muss das ganze Team nach einer kurzen Beratungszeit durch das Sternentor steigen und \"hinüber in einer andere Dimension gelangen\".","Gymnastikreifen","PL","freier Raum","","","",""],["Streichholzdiskussion","","Diskussion","Gruppendynamik","DaF Sprechen","","","Ziel: Alle TN zur Beteiligung an der Diskussion animieren. Jeder TN bekommt die gleiche Anzahl von Streichhölzern. Wenn Sie in der Diskussion einen Beitrag abgegeben haben, geben sie ein Streichholz ein. Ziel ist, alle Streichhölzer loszuwerden. (Weitere Beiträge sind auch möglich.)","Streichhölzer","PL","Sitzkreis","","","",""],["Streichholzfeedback","","Feedback","","","","","Jeder TN, der etwas sagen möchte, nimmt sich ein Streichholz, zündet es und darf so lange reden, bis das Streichholz brennt. Kürzer zu reden und auszupusten ist erlaubt.","1 Streichholz pro TN","PL","Sitzkreis / U / Fächer","","","",""],["Streifenkopie","","Input","Präsentation","DaF LV","","","Papierstreifen ausschneiden / abreißen und auf den Text kopieren. TN sollen die fehlenden Textstellen erschließen.","Papierstreifen, Text","EA / PA / GA","","","","",""],["Strukturgedicht","","Einstieg","Kreativität","DaF Schreiben","","","Aus einem wenig bekannten Gedicht, das eine sehr markante Struktur hat, die Inhalt tragenden Wörter löschen / Struktur mit Buchstaben wiedergeben (a, a+b... usw.). Die TN füllen das Gedichtskelett mit eigenen Gedanken und Ideen. Geeignet: Konkrete Poesie!","AB / Flipchart / Kärtchen / nur die Struktur: A, A+B, A+B+C...usw.","EA / PA / GA","","","","",""],["Stuhlorakel","","Gruppenbildung","Präsentation","","","Ritual","Bevor die Gruppe in den Raum kommt, eine Markierung unter den Tischen anbringen. Die Personen auf den markierten Stühlen bekommen besondere Aufgaben: Moderation, Fragen stellen, Zusammenfassung, Gruppensprecher, Beobachter. Oder: An allen Stühlen Markierung anbringen, um Gruppen zu bilden.","Klebepunkte, farbige Zettel, Kärtchen, Bonbons, Minipackung Gummibärchen, Bilder...","","","","","",""],["Stummer Platzwechsel","","Wahrnehmung","Konzentration","Körpersprache","","Bewegung","Alle TN stehen im Kreis. Der Spielleiter (A) nimmt zu einem anderen TN (B) Blickkontakt auf, und gibt ihm damit zu verstehen, dass er auf seinen Platz gehen möchte.  B gibt mit einem Nicken zu verstehen, dass er verstanden hat. Während A nun ganz langsam den direkten Weg durch den Kreis zum Platz von B geht, nimmt B Blickkontakt zu einem anderen TN (C) auf und geht, nach dem ihm C durch Nicken sein „okay“ gegeben hat auf dessen Platz. C sucht sich mit Blickkontakt den nächsten Platz usw. Wichtig: Es sollte keine andere Kommunikation als den Blickkontakt und das bestätigende Nicken geben. Das Tempo kann angezogen werden, wenn die TN sicherer werden.","","PL","Stehkreis","","","",""],["Stühle kippen","","Kooperation","Problemlösung","","","Bewegung","Es stehen so viele Stühle wie Mitspieler im Kreis. Außerhalb des Stuhlkreises sollte möglichst noch ein knapper Meter Abstand zu Wand, Fenster oder Tür frei sein. Der Abstand von Stuhl zu Stuhl beträgt max. einen Meter. Jeder TN stellt sich hinter einen Stuhl, fasst diesen mit einer Hand an der Lehne und kippt ihn in Richtung Mittelpunkt des Kreises. Die Aufgabe ist, dass alle den Stuhlkreis umrunden, ohne dass ein Stuhl wieder auf seine vier Beine fällt oder umstürzt. Dabei darf nur eine hand benutzt und nur jeweils ein Stuhl berührt werden. Es dürfen weder Hilfsmittel verwendet noch die Position der Stühle verändert werden. Bei einem Fehler geht jeder TN zurück an „seinen” Stuhl und alles beginnt von vorn. Das Spiel endet, wenn alle wieder an ihrem Ausgangspunkt stehen.","identische Stühle, nicht zu leicht, nicht zu schwer, für jeden TN 1","PL","Stuhlkreis","st_hle_kippen.jpg","","",""],["Sucht etwas...","","Wahrnehmung","Kooperation","","","Bewegung","Die L arbeiten zu zweit oder in Kleingruppen. Jede Gruppe bekommt ein AB mit Suchaufträgen.   Danach suchen sie im Grünen / auf dem Schulhof... Gegenstände, auf die die Suchmerkmale zutreffen.   Etwas rundes, glänzendes, hartes, kantiges, unpassendes...)   Wer findet die meisten Gegenstände in der angegebenen Zeit?  (Eignet sich auch dafür, um den Schulhof aufzuräumen, und Müll zu sammeln...)","AB","GA","im Freien","","","",""],["Superlative","","Kennen lernen","Gruppendynamik","","","","Die TN sitzen im Kreis und studieren einander, still. Jede Person sucht sich ein Adjektiv aus, das sie von den anderen unterscheidet und sie besonders macht: z.B. Der jüngste, der witzigster, der größte, der mit den kürzesten Haaren... Sie stellen sich dann mit dem Adjektiv vor und kommentieren kurz ihre Wahl. Die anderen sagen dann, ob das dem ersten Eindruck entspricht, die sie von der Person hatten (oder wie sie sie bei der gemeinsamen Arbeit erlebt haben).","","PL","Sitzkreis","","","",""],["Tagesmotto","","Einstieg","","","","Ritual","Passend zum Thema des Seminars / Seminartages werden Zitate oder Sprüche ausgewählt. Kann mit Programmvorstellung kombiniert werden. Am Ende geeignet für einen Seminarrückblick.","DIN A4 Blatt, Buntstifte, Wachsmalkreide...","FA","","","","",""],["Rorys Story Cubes","","Erfahrung","Einstieg","Kooperation","Kennen lernen","DaF Sprechen","Mit den Story Cubes würfeln, zu ausgewählten Würfeln erzählen. // TN wählen von 9 Bildern 3, die zu ihrer Person / ihrem Unterricht... passen und erzählen darüber","Rorys Story Cubes","GA / PL","Gruppentische","rory.jpg","https://scratch.mit.edu/projects/158896002/","Screenshots machen (z.B. Story dice) --> PRÄSENTATION --> weiterklicken // BILDSCHIRM TEILEN und ein online story cube generator zeigen",""],["Tagesprotokoll","","Reflexion","Feedback","Transfer","","Ritual","Zwei TN protokollieren den Tag (als Text oder als Bild-Text-Tagebuch). Protokolle werden am nächsten Tag ausgehängt.","AB","PA","","","","",""],["Taaa-tung!","","Konzentration","","","","","Alle knien dicht zusammen im Kreis. Jede hat einen Stift vor sich liegen. Die SL gibt den Rhythmus vor: Taaa-tung (Taaa: dicke Stifte mit der rechten Hand greifen, tung: Edding der rechten Nachbarin hinlegen), Taaa-tung, Ta-tung-ta-tung (Ta: Edding greifen, tung: Edding nach rechts legen und dabei in der Hand behalten, ta: den selben Edding wieder nach links legen, tung: Edding der rechten Nachbarin hinlegen). Also: Taaa-tung, Taaa-tung, Ta-tung-ta-tung, Taaa-tung und so weiter. Dabei immer schneller werden. Wer einen Fehler macht, &#64258;iegt raus.","dicke Stifte","PL","freier Raum (nach Möglichkeit Teppichboden :-)","","","",""],["Tee oder Kaffee?","","Erfahrung","Kennen lernen","","","Bewegung","Vorbereitung: Eine Liste mit 15-20 Fragen oder Aussagen (zu unserem Thema, oder zum Kennenlernen allgemein zu den Personen), die man mit ja oder nein beantworten kann, und zwei Spalten für \"Ich\" und \"Mein Tipp\"  z.B. Thema Reisen: Warst du schon in Deutschland? Hast du schon eine Schiffahrt gemacht? Hast du schon den Nachtzug genommen?   Die Lernenden notieren in ihrer Liste erstmal ihre Antwort und dann ihren Tipp: Wie viele in der Gruppe werden ja sagen?  Sie stehen dann auf und kommen in die Mitte des Raumes.  Danach liest der Spielleiter - oder immer eine andere Person aus der Gruppe der Reihe nach die Fragen. Die L  stellen sich dann an die Fensterseite, wenn sie ja und an die Türseite, wenn sie nein antworten. Dann einfach zählen - und wenn jemand die genaue Zahl erraten hat, meldet sich.   Bei interessanten Konstellationen - z.B. nur wenige sagten ja, kann man auch nachfragen: Ach ja, und wo wart ihr mit dem Schiff? Wie lange?  Am Ende schauen, wer die meisten Treffer hatte.","AB","PL","freier Raum","","","Online: Zu jedem Paar Bilder in die Präsentation einbauen (in eine Folie oder auf aufeinander folgende Folien). Die TN notieren ihre Tipps, danach stellen sie sich in eine der Optionen (Pointer-Namenstag) oder klecksen. Nicht sofort alle klecksen, so können wir nicht so leicht über auffällige / interessante Ergebnisse sprechen.","hier: Annotate - Stempeln"],["Telegramm","","Feedback","","","","","Den Tag / die ersten 2-3 Tage in Form von einem Telegramm bewerten. (Telegramm an eine liebe KollegIn). Anonym!","Telegrammvorlage","EA","","telegramm.jpg","","",""],["Textpuzzle","","Input","Einstieg","Kooperation","DaF LV","","In Gruppen zu bearbeiten: Einen längeren Text (Prozessbeschreibung, Erzählung mit linearer Struktur) in 7-8 abgeschlossene Teile zerschneiden und mit einem Symbol markieren. Jeder TN bekommt einen Teil, liest ihn und merkt sich die wichtigsten Elemente. Danach Teile weglegen, jeder beschreibt, was in seinem Teil passiert / beschrieben war. Gemeinsam legt die Gruppe eine Reihenfolge der Puzzleteile fest und notiert auch, worauf ihre Hypothese basiert.","Text, zerschnippelt (evtl. laminiert)","GA","","","","Textteile in Einzeldateien kopieren und auf google drive hochladen, Dateiname z.B: Sonne, Mond, Blume. Bei kurzen Textteilen die TEXT-Funktion von goqrme nutzen, die QR-Codes in die Präsentation einbauen (etwas weiter voneinander, damit sie gut gescannt werden können). Jeder TN öffnet eine Datei / scannt einen QR-Code... weiter wie im Präsenz.",""],["Themenrecherche","","Input","DaF Landeskunde","","","Projekt, WWW","TN bekommen / wählen Themen, die sie im Internet / “draußen” - Bibliothek, Museum, Befragung von Passanten / Experten – recherchieren.","","GA","Außerschul. Lernorte","","","",""],["Themenspeicher","","Ideen","Visualisierung","","","","TN nennen ihre Ideen, der Moderator notiert sie kommentarlos untereinander in einer Tabelle. Die Lernenden kleben Klebepunkte an / machen einen Strich zum Thema ihrer Wahl.","Flipchart","PL","","","","",""],["Think-Pair-Square-Share","TPSS","Kooperation","Input","DaF Sprechen","","","Zuerst die individuelle Auseinandersetzung mit einer Aufgabe/Anforderung. (think). Danach der Austausch im Paar, die wechselseitige Ergänzung, die Kontrolle des eigenen Verständnisses im sicheren Kontakt mit dem Partner (pair) und (eventuell) sodann in der - immer noch schützenden – Vierer-Gruppe (square) erst am Schluss der Schritt in die Öffentlichkeit der Klasse, der Bericht, die Demonstration des Gelernten vor den (kritischen) Augen der ganzen Lerngruppe und des Lehrers. (mehr dazu: http://www.kooperatives-lernen.de/dc/netautor/napro4/appl/na_professional/parse.php?mlay_id=2500&mdoc_id=1000423","Texte","EA-->(PA)--> GA (Exp.)-->GA (Stamm)-->EA","","","","",""],["Tiere reißen","","Kooperation","Kommunikation","Wahrnehmung","Problemlösung","","Aus einem Zeitungspapier gemeinsam (3-5 Personen) ein Tier reißen, ohne, dass die TN miteinander sprechen (auch keine Absprachen vorher!). Es ist auch nicht erlaubt, sich durch Zeichen oder Schreiben zu verständigen. Jeder muss mitmachen. Man kann signalisieren, dass man weitermachen möchte. Auswertung: Wie zufrieden bist du mit dem hergestellten Produkt, mit dem gerissenen Tier? Wie zufrieden bist du mit der Zusammenarbeit der Gruppe?  Wie zufrieden bist du mit der Arbeit deiner Kollegen? Wie zufrieden bist du damit, wie du dich selber eingebracht hast? Wer war initiativ, wer ein Beobachter, mitarbeitend oder völlig außenstehend?","Zeitungspapier, 1 Bogen pro Gruppe","GA","","","","",""],["Tortendiagramm","","Einstieg","Präsentation","","","","Geeignet für den Einstieg in Themen, die eine überraschende / interessante Mengenverteilung von Teilaspekten haben. Mit Tesakrepp die Trennlinien eines Tortendiagramms auf den Boden kleben und die Bedeutung der Linien raten lassen. Wenn die Idee mit Diagramm / Anteile von versch. Aspekten / Themen genannt wird, im PL Ideen über den Inhalt der einzelnen Ausschnitte sammeln.","Tesakrepp, Kärtchen","PL","freie Fläche auf dem Boden in der Mitte","","","",""],["Tragende Hände","","Kooperation","Vertrauen","","","","Die TN bilden ein Spalier und jeder hält sich jeweils mit den Händen am gegenüberstehenden TN fest. Ein Freiwilliger legt sich nun auf diese haltenden Hände. Die Gruppe versucht nun den Freiwilligen hochzuheben, abzusenken, zu schütteln, hin und her zu rollen, hin oder her zu schaukeln, oder ähnlich einem Förderband auch mal vorwärts, mal rückwärts wandern zu lassen.","","PL","Spalier","","","",""],["Trimino","","Üben","Kontrolle","Input","DaF: WS","Selbstkontrolle","Ein großes Dreieck in mehrere kleine Dreiecke zerlegen. Begriffe und Synonyme / Antonyme / Definition / passenden Satz mit einer Lücke / Entsprechung in der Muttersprache oder Teile von Komposita auf die angrenzenden Seiten von zwei nebeneinanderlegenden Dreiecken notieren. Großes Dreieck zerschneiden, die Aufgabe der TN ist, das Dreieck zusammenzupuzzeln. Leichter: Die Außenseiten des großen Dreiecks sind leer – schwieriger: hier sind auch Begriffe, die keine Paare haben. (Funktioniert auch mit Quadraten; Begriffe-Teppich)","kleine Dreiecke","PA / GA / PL","Gruppentische - oder bei großen Triminos: Boden","trimino_kl.jpg","http://paul-matthies.de/Schule/Trimino.php","Jamboard - mit Quadraten, diese in Paint oder mit Power point vorbereiten und einzeln (windows + shift + s) ausschneiden und mit ctrl+V in Jamboard umdrehen. Drehbar, verschiebbar...",""],["Quadromino","","Einstieg","Üben","Abschluss","","","WIe Trimino, nur einfacher herzustellen: Statt Dreiecke nehmen wir bunte Quadrate. Dadurch entsteht dann ein  Begriffe-Teppich :-) Tipp: Den Anfang machen, TN machen noch eine Erweiterung, eine Reihe in jede Richtung.","Quadrate aus buntem Papier.","GA / PL","freie Fläche auf dem Boden in der Mitte","quadr.jpg","","",""],["Türschwellen-Einteilung","","Gruppenbildung","","","","","In der Reihenfolge, wie sie gerade in den Raum hereinkommen, werden die TN in Paare / Gruppen eingeteilt.","AB, die man beim Hereinkommen gleich verteilt.","","","","","",""],["Protokollbogen","","UB","","","","","Verlauf des Unterrichts in einem Protokollbogen (ähnlich wie der Planungsbogen) dokumentieren. Ziele erst im Nachhinein ergänzen. Evtl. ergänzen durch: Lehreraktivität / Arbeitsauftrag. Bei Material mehr Platz lassen für Skizzen.","AB (A4)","EA","","","","",""],["Unsere Deutschlandkarte","Lebendinge DACH-Karte","Kennen lernen,","Einstieg","Aktivieren","DaF Landeskunde","Bewegung","TN malen zusammen mit Kreide die Umrisse der DACH-Länder auf den Boden des Seminarraumes. In der 1. Runde stellen sie sich an einen Ort, wo sie schon mal waren oder wo sie jemanden kennen. Sie erzählen kurz, wo sie sind (Wann waren sie dort? Was haben sie dort gesehen / gehört…? Wie war es?...) 2. Runde: ein Ort, über den sie vor kurzem mal etwas im Fernsehen gesehen oder in der Zeitung gelesen haben. 3. Runde: wo sie gern hinfahren wollen.  Sie erzählen: Warum gerade dorthin? Wie stellen sie es sich dort vor? Was können sie sehen? Hören? Riechen? Essen? Was machen sie dort?","evtl, Kreide","PL (GA --> PL)","freier Raum","","","",""],["Unterricht mit globalen Leitfragen bewerten","","UB","Feedback","","","","Nach der Unterrichtsbeobachtung und der Beschreibung des gesehenen Unterrichts in Kleingruppen nach globalen Leitfragen (Atmosphäre? Lehrerverhalten? Lernziele erreicht?...) auswerten und dafür Beispiele aus dem Beobachtungsprotokoll notieren.","Leitfragen auf AB / Kärtchen / gebeamt","EA / PA / GA --> PL","","","","",""],["Urschrei","","Auflockern","Aktivieren","","","","TN stehen im Kreis und auf Kommando schreit jeder so laut, wie er nur kann :-)","","PL","Stehkreis","","","",""],["Vertrauenslauf","","Gruppendynamik","Vertrauen","","","","Die Gruppe formiert sich „face to face“ in zwei symmetrisch gegenüberstehenden Reihen. Nahezu Schulter an Schulter nebeneinander. Abstand zueinander sind etwa zwei Armlängen. So bildet sich ein langer Korridor, der sich verschließt, wenn alle Arme gerade nach vorne gestreckt werden. Jeder TN ist nun aufgefordert einmal durch den Korridor zu gehen, der sich unmittelbar vor der kommenden Person öffnet - Arme werden im letzten Augenblick nach oben gerissen - und sich sofort wieder schließt, wenn die Person passiert hat – die Arme gehen wieder nach vorne. Einmal passiert, reiht sich jeder Teilnehmer wieder hinten in den Korridor ein. Sehr dramatisch wird die Übung, wenn du dieTeilnehmer aufforderst nicht mehr langsam zu gehen sondern mit hoher Geschwindigkeit durch den Korridor aus Armen zu sprinten!","","PL","Spalier","","","",""],["Vokabeltischtennis","Vokabelpingpong","Wiederholung","Transfer","DaF WS","","Wettbewerb, spielerisch","Gespielt wird nach den Regeln von Tischtennis: Ein TN beginnt, umschreibt ein Wort – der Partner muss das entsprechende Wort nennen. Gelingt es ihm, so ist er dran und kann ein Wort nennen, gelingt es ihm nicht, hat der erste Spieler einen Punkt und darf nochmal \"aufschlagen\". Jeder Spieler schlägt zweimal auf (beginnt die Runde), danach Wechsel.  Ein Satz wird von dem Spieler gewonnen, der zuerst 11 Punkte erreicht hat. Haben beide Spieler 10 Punkte erreicht, geht es in die Satzverlängerung, Es gewinnt derjenige den Satz, der zuerst mit 2 Punkten Vorsprung führt (Beispiel: 12:10, 13:11 etc.).  Die TN spielen  3 Sätze.","","PA","","","","",""],["Wanderzettel","","Üben","Kontrolle","","","","Kurze Aufgaben einzeln auf Zettel schreiben und Zettel nummerieren. TN / Gruppen bekommen einen Stapel, den sie bearbeiten, und wenn fertig, an die Nachbarsgruppe weitergeben. Richtung angeben! Was schon überall war, landet in einem Korb. Kontrolle: Lösungsschlüssel, Vergleich in Gruppen...","Kärtchen, nummeriert","PA / GA","","","","",""],["Was machst du denn?","","Aktivieren","Konzentration","DaF WS","","Bewegung","Alle stellen sich im Kreis auf. A macht eine Bewegung, z. B. sie kratzt sich am Kopf. Die Nachbarin B fragt: ”Was machst du denn?“ A sagt etwas anderes: ”Ich hüpfe auf einem Bein.“  Daraufhin hüpft B auf einem Bein und von der nächsten Nachbarin gefragt, was sie denn macht. Sie antwortet z.B.: ”Ich spiele Klavier.“ Und so weiter.","","PL","Stehkreis","","","",""],["Was steckt dahinter?","","Wahrnehmung","DaF Sprechen","","","","Äußerungen / Fotos deuten: Was wollte er wirklich sagen? Wie kann man es verstehen? Wie wirkt es auf uns? (Kombinierbar mit: 4 Ohren)","Fotos, Kärtchen","PL / PA/GA --> PL","","","","",""],["Wäscheleine","","Präsentation","","","","","Die Ergebnisse an der quer durch den Raum gespannten Wäscheleine aufhängen. (Bei großen Gruppen abwechselnd links-rechts, damit die TN bequem rankönnen.)","Wäscheleine, Wäscheklammern","","","","","",""],["Wäscheleine-Arena","","Präsentation","","","","","s. Wäscheleine: Für längere Präsentationen. Ein Quadrat aus Wäscheleinen spannen, Plakate an allen 4 Seiten festmachen. TN sitzen in der Mitte.","Wäscheleine, Wäscheklammern","FA","","","","",""],["Waschstraße","","Aktivieren","Vertrauen","Gruppendynamik","","","Die TN stehen in zwei Reihen nebeneinander und bilden so eine enge Spalierreihe. Eine Person bewegt sich mit beliebiger Geschwindigkeit durch den Spalier. Sie wird dabei \"gewaschen\", also gekitzelt, massiert, sanft über den Rücken gestrichen o.ä., jedoch keinesfalls unsanft berührt oder gar verletzt! Ob sich die Person dabei aufrecht oder auf allen Vieren durch das Spalier bewegt, kann je nach Anwendungszweck und Teilnehmer variiert werden. Alle TN sollen teilnehmen können, so bewegt sich immer eine Person nach vorne durch das Spalier. Ist sie vorne angekommen, stellt sie sich als erste Person in den Spalier und der nächste kann von hinten durchgehen.","","PL","Spalier","","","",""],["Web-Quiz","","Input","Einstieg","","","WWW, BYOD","Zu 10-13 Fragen kurze Infos (Ein-Wort-Antwort) im Internet suchen. (Ohne Hilfe oder mit der Angabe von Links, wo die Antwort zu finden ist.)","AB (auf Papier oder digital), Net-Arbeitsstelle (für 2 TN 1)","PA / GA","","","","",""],["Wegweiser","","Kennen lernen","","","","","TN schreiben auf Kärtchen ihren Namen, den Wohnort und die Entfernung des Wohnortes zum Seminarort in km. Die Kärtchen werden an einem Wegweiser festgepinnt.","Kärtchen, Besenstil","EA --> PL","","","","",""],["Koordinatensystem","","Erfahrung","Reflexion","","","","In einem Koordinatensystem Werte / Themen... nach ihrer persönlichen Wichtigkeit ordnen.","AB, kleine Kärtchen, Klebestifte","EA --> GA --> PL","","","","",""],["Wetterbericht","","Feedback","","","","","Große Wetterkarten (mit oder ohne Text) vorbereiten und für alle sichtbar auf den Boden legen. TN stehen im Kreis und wählen Wetterkarten, die ihre momentane Befindlichkeit / Gefühle wiedergeben und kommentieren ihre Wahl.","Bildkarten","PL","Sitzkreis (evtl. mit freier Fläche auf dem Boden in der Mitte)","eval_wetterkarten.jpg","","",""],["Elefant im Regen","","Auflockern","Entspannung","","","","TN stellen sich als Kreis auf, so dass jeder den Rücken des Vordermannes vor sich hat. Möglicha auch als Partnerübung - der- oder diejenige, der/die sich massieren lassen möchte, legt sich auf den Bauch, wichtig ist, daß er/sie es möglichst bequem hat. Nun beginnt eine/r, eine Stegreifgeschichte zu erzählen, in der möglichst viele Wetter-\"arten\" vorkommen sollen (z.B. Urlaubsbericht, Wetterbericht ...). Die anderen MitspielerInnen spielen das Wetter auf dem Körper des Partners: Warme Sonne = Handflächen sanft auf den Körper drücken, Seichter Regen = leichtes Trippel mit den Fingerspitzen, Regenguss = entsprechend stärkeres Klopfen mit den Fingern, leichte Windböe = mit den Händen den Körper leicht hin und her bewegen, streicheln, Sturm = entsprechend stärkere Bewegungen, Nebel = mit den \"Handkanten\" auf den Körper klopfen. Variante: Pizza backen (Mehl einrieseln lassen, Eier aufschlagen, durchkneten, ausrollen, mit Tomatensoße bestreichen, Belag draufstreuen und in den Ofen schieben (Klaps auf den Po :-) Variante für „kontaktscheue“: Schnipsen, Stampfen, Klopfen auf den eigenen Körper.","","PA","Stehkreis","","","",""],["Windhundverfahren","","Gruppenbildung","","","","","Für Interessengruppen: “Den letzten beißen die Hunde” - bzw. “Wer zuerst kommt, mahlt zuerst”: Die Themen einzeln notieren, zu jeder Thema so viele Nummer notieren, wie viele Personen das Thema bearbeiten können (wg. Gruppengröße, vorhandenes Material, Arbeitsplatz etc.). Die TN rennen gleichzeitig zu den Anmeldungsbögen (oder zur Tafel) und tragen sich ein. Jeder trägt sich selbst ein!","Listen","PL","Liste gleich weit von allen, etwas weiter voneinander ausgehängt, für alle zugänglich","","","",""],["Sonnenblume","","Kennen lernen","Namen lernen","Gruppendynamik","","","Den Namen der TN auf Blütenblättern vorbereiten und in einen Blumenumriss kleben (nicht fest, Blüten müssen abnehmbar sein). TN schreiben ihre Wunschnamen (wie möchte ich hier genannt werden?) und ihr Land / ihre Stadt in die einzelnen Blüten und malen dazu etwas, was für ihr Land typisch ist. Wir können auch ein kleines Foto für jeden aufkleben.","großes Packpapier, Blütenblätter in mehreren Gelbtönen mit den Namen der TN","EA --> PL","freie Fläche auf dem Boden in der Mitte","","","",""],["Wort-Bilder","","Wiederholung","Einstieg","DaF WS","","Rätsel","Wörter als Bild darstellen, TN notieren die Wörter, die gemeint sein können. - Kann mit der Vokabelkartei kombiniert werden.","Bildkarten, Pinnwand","PL / GA --> PL","","","","",""],["Wort-Wolke","","Einstieg","Evaluation","Laufzettel","DaF WS","","Wichtige Begriffe, die zum Thema passen (oder die Namen der Stationen) oder die Namen der TN in der Gruppe bei www.wordle.net notieren und eine Wortwolke generieren. (Mehrmals aufgenommene Wörter werden in der Wolke größer!). Auch als Feedback möglich: TN gestalten ihre eigene Wortwolke zum Seminar.","AB, oder Internetzugang.","EA / PA / GA / PL","","","","",""],["Wörter zur Wahl","","Input","DaF WS","","","Ritual","Jeder TN wählt ein Wort aus dem behandelten Text / jede Gruppe wählt aus ihrem Text oder Textteil / aus dem Tagesprogramm X Wörter, die sie für lernwürdig halten, schreiben diese auf Kärtchen und pinnen an die Wortschatzwand. Diese Wörter sind Pflicht-Lernwortschatz für alle.","Kärtchen, Pinnwand","EA --> PL","","","","",""],["Wunschteam","","Gruppenbildung","","","","","TN (z.B. der älteste und der jüngste) wählen reihum Teammitglieder für ihr Team aus.","","PL","","","","",""],["Zahlenschloss","","Kontrolle","","","","Selbstkontrolle","In einem Zahlenschloss die Nummer der Buchstaben aufschreiben, die die TN in den einzelnen Antworten markieren sollen, um die Lösung zu bekommen. (Hilft dabei, dass alle wirklich alle Aufgaben lösen und nicht mit dem Lösungswort kombinieren, was die Antwort sein kann...)","AB","EA / PA / GA","","","","",""],["Zahnbürstenmörder","","Gruppendynamik","Wahrnehmung","","","","Gruppendynamische Prozesse (auch) außerhalb des Seminargeschehens in Gang setzen, zur Förderung von Gruppenzusammenhalt. Einem TN heimlich eine sehr auffällige - z.B. Kinderzahnbürste – geben mit dem Auftrag, mit der Bürste die anderen TN zu ermorden: Er muss versuchen, TN allein zu erwischen und ihnen die Zahnbürste zu zeigen. Ermordete Spieler gehen umgehend zum zentralen Spielplan und tragen in drei Spalten ein: „Wer“ wurde „Wann“ und „Wo“ ermordet. Im weiteren Verlauf schweigen sie über den Mörder. Überlebende TN kommen in regelmäßigen Abständen im Seminar in die „Verdacht - Runde“. Im Stuhlkreis melden sich Spieler „mit Verdacht“ und der Spielleiter wählt zwei TN aus. Ohne vorherige Absprache oder Diskussion deuten beide TN auf den Mordverdächtigen. Zeigen sie auf die gleiche Person, muss sie sich nun outen, ob sie der Mörder ist. Der Mörder darf sich auch als Tote ausgeben bzw. sich als Verdächtiger anmelden. Der Mörder ist der Sieger, wenn er mehr als die Hälfte der TN ausgeschaltet hat.","Liste, 1 auffällige Zahnbürste","PL","","","","",""],["Zehn Schritte","","Gruppendynamik","","","","","Die TN verteilen sich im Raum. Sie haben nun insgesamt zehn Schritte zur Verfügung, mit denen versucht werden soll, sich mit Personen zusammenzustellen, die dem Spieler jeweils sympathisch sind. Alle gehen auf Kommando zunächst drei Schritte. Dann können sich die TN sich kurz umschauen, anschließend werden, wieder auf Kommando, fünf Schritte gegangen. Die letzte Phase erlaubt zwei Schritte. Anschließend kann das Beziehungsmuster in der Gruppe besprochen werden.","","PL","freier Raum","","","",""],["Zettellandschaft entfalten","","Präsentation","","","","","Inhalte der Präsentation auf einzelne Kärtchen schreiben, diese in eine Landschaft legen und die angrenzenden Kärtchen mit Tesafilm zusammenkleben. Die Kärtchen zusammenfalten, so dass man die einzelnen Elemente nach und nach auf dem Boden auffalten kann.","Kärtchen, Tesa-Film","FA","freie Fläche auf dem Boden in der Mitte","","","",""],["Zettelwirtschaft","","Input","Kooperation","Gedächtnis","DaF Sprechen","Bewegung","TN ziehen einen Streifen mit einer (landeskundlich) relevanten Information (Auswahl: Breite Themenwahl, alle Infos etwa gleich lang, etwa gleich viele Zahlen / Fakten pro Streifen), memorisieren den Inhalt und stecken den Streifen in die Tasche.Sie gehen herum, geben die eigenen Infos weiter bzw. sammeln weitere Infos. (Variante: Sie geben auch die weiter, die sie von den anderen gehört haben.) Am Ende 3-4er-Gruppen bilden, die versuchen sollen, möglichs viele Infos schriftlich festzuhalten oder vorbereitete Quizfragen beantworten.","Infostreifen (für jeden TN ein anderer)","CP","freier Raum","","","Online: Die TN HÖREN sich Infos an (z.B. Vocaroo-Links, kurzes Youtube-Video...) und memorisieren den Inhalt. Sie geben die Infos im privaten Chat weiter. - ODER wie Speed dating organisieren.",""],["Zick-Zack-Brett","Gummifix","Üben","DaF WS","DaF GR","DaF LV","Selbstkontrolle","Ein Brett vorbereiten, auf dem wir ganz fest in der Mitte kleine Nageln in 2 Reihen einschlagen. Die Aufgabenblätter werden auf das Brett gelegt. Die Fragen sind links, die Lösungen vermischt auf der rechten Seite. Die TN bekommen Gummibänder, sie müssen die passende Antwort mit der Aufgabe verbinden. Am Ende ziehen sie die Aufgabenkarte heraus und sie schieben sie umgedreht wieder unter die Gummibänder. Die Lösung ist mit Linien markiert.","Brett, Nageln oder mehrere dicke Kartons zusammenkleben und Pinnnadeln, große, dicke Gummibänder","EA / PA","","gummifix.jpg","","",""],["Zielscheibe","","Feedback","","","","","In einer Zielscheibe mit mehreren konzentrischen Kreisen (6-10) mehrere Teile markieren, zu denen wir einzelne Evaluationsaspekte notieren (Inhalte, Methode, Gruppe, SL, Raum... ) Die TN malen die Segmente aus, die zutreffen. Je näher zur Kreismitte hin, desto besser die Beurteilung des Aspektes. DIGITAL: www.oncoo.de --> ZIELSCHEIBE","AB","EA","","eval_scheibe_ga.JPG","","Präsentation - Whiteboard freischalten, klecksen","Bildschirm teilen - Annotate, stempeln"],["Zeitstrahl","","Evaluation","","","","","Jede Gruppe erhält eine Papierbahn, auf der ein Zeitstrahl mit den Seminartagen eingetragen ist. Die TN tragen ihre Eindrücke und Bewertungen zu den jeweiligen Seminarabschnitten oder Ereignissen ein. Oberhalb des Zeitstrahls sollen die (eher) positiven Rückmeldungen eingetragen werden, unterhalb des Zeitstrahls die (eher) negativen. Die Eintragungen können besprochen werden.","Langer Papierstreifen","GA","","","","",""],["Bewusstheitsrad","","Erfahrung","Reflexion","","","","Die TN notieren zu den einzelnen Aspekten (s. Datei) auf Kärtchen ihre Erfahrungen. Diese werden in einem Raster angepinnt.","Kärtchen, Pinnwand","EA --> PL","","v2_bewusstheitsrad.jpg","","",""],["Erfahrungsschlange","","Kennen lernen","Gruppenbildung","","","","TN stellen sich auf nach ihren (aktiven) Berufsjahren. Am Ende Gruppenbildung durch Teilen (wenn TN mit etwa gleich langer Erfahrung zusammen arbeiten sollen) oder Erfahrungsschlange falten, wenn es auf eine gute Mischung ankommt.","","","","erfahrungsschlange_falten.jpg","","",""],["Kopfstandmethode","","Erfahrung","Einstieg","Problemlösung","","","Bei der Kopfstandmethode wird aus der ursprünglich definierten Problemstellung das exakte Gegenteil abgeleitet. Die Problemstellung wird auf den Kopf gestellt: Z.B. nicht „Wie bringe ich meine L zum Sprechen?“ sondern „Wodurch erreiche ich, dass meine L im Deutschunterricht nicht sprechen?“. Durch die Betrachtung des Problems aus einem konträren Blickwinkel können Denkblockaden aufgelöst und neue Lösungswege gefunden werden. (Lösungen notieren, Rangfolge der Lösungen notieren).","Flipchart: Aufgabenstellung, visualisiert","GA --> PL","","","","",""],["Der hochgestellte Laie","","Einstieg","Transfer","","","","Die TN denken über die Frage nach,, wie sie einem hochgestellten Laien einen Sachverhalt darstellen oder einen Begründungszusammenhang erläutern würden, Der hochgestellte Laie ist durch folgende Attribute gekennzeichnet: Intelligent, skeptisch, eloquent. Seine eigentlichen Kompetenzen und Präferenzen liegen nicht auf dem Gebiet, das zu verhandeln ansteht. Er ist nicht bösartig oder verbohrt, aber einflussreich. Von seiner Zustimmung oder Ablehnung hängt vieles ab. Der Laie ist in Bezug auf die anliegende Sache zu personalisieren: Als eine Person der Schulleitung, der Schulaufsicht, der Elternvertretung, des Schulministeriums, der Lokalpolitik usw. Die Aufgabenstellung Wie würden Sie Frau XX gegenüber Ihr Arbeitsergebnis begründen? o. Ä. kann im Gespräch als Provokation gegeben werden. Intensiver wird die Auseinandersetzung, wenn von einzelnen oder allen TN (in Kleingruppen) entsprechende Argumente schriftlich gesucht werden. Bei der Auseinandersetzung mit diesen Argumenten spielt der KL den Advocatus Diaboli, der die Bedenken des Laien äußert, ohne dass jedoch ein Rollenspiel daraus wird. Das Verfahren kann falscher Euphorie vorbeugen. Es kann dazu beitragen, auf mögliche Widerstände vorzubereiten. Es hilft, erarbeitete Lösungsvorschläge kritisch zu überdenken bzw. Strategien für deren Durchsetzung zu erarbeiten.","","GA --> PL","","","","",""],["Bilder verfremden","","Einstieg","","","","","Die TN bekommen ein Bild (zum Thema des Seminars). Sie betrachten und beschreiben das Bild genau und versuchen es zu verfremden, indem sie z.B. Ein Bildelement kopieren und in einen neuen Kontext / Hintergrund setzen; historische Bilder in ein aktuelles Geschehen hineinkopieren; das Bild in einem anderen Stil oder mit anderen Farben nachmalen; eine Collage des Originals anfertigen; das Bild spiegeln; die Farben verändern; das Bild um weitere Dinge ergänzen oder Vorhandenes übermalen und so unkenntlich machen. Ziel: Die Grundaussage des Bildes durch das Verfremden (noch) besser zum Ausdruck bringen.","Bilder (Fotos, Kunstbilder)","EA / PA / GA","","","","",""],["Abstrakte Bilder / Symbole","","Einstieg","Kreativität","DaF Sprechen","","","Malt ein abstraktes Bild und lasst die L beschreiben, was sie darin sehen. Schön daran ist, dass es keine richtige und keine falsche Antwort ist. Und man kann damit auch sehr schön Redemittel üben wie \"Ich denke...\" \"Das könnte ein ... sein\" \"Vielleicht ist es...\" ...","abstraktes Bild, Beamer / Flipchart / AB","PA / GA / PL","","","","",""],["Flaschendrehen","","Erfahrung","DaF Sprechen","","","","Die TN sitzen im Kreis um ein Spielfeld herum. Der erste Spieler dreht das Bleistift / eine Flasche, und erzählt zum Bild- oder Textimpuls auf dem Feld, auf das die Flasche zeigt. Danach dürfen dazu alle TN etwas sagen oder Fragen stellen. Am Ende gibt der Spieler die Flasche – und damit das Rederecht weiter.","A3-Blatt für Kleingruppen, Packpapier für größere (Kreis mit Feldern mit Bild- oder Textimpulsen), Bleistift / Flasche","GA / PL","Gruppentische oder Stuhlkreis mit freier Fläche auf dem Boden.","","","",""],["Ich will euch erzählen über...","","Kennen lernen","Einstieg","Erfahrung","DaF Sprechen","","Die TN wählen einen persönlichen Gegenstand aus und legen ihn auf das Startfeld. Der erste Spieler würfelt, zieht ihren Gegenstand auf das entsprechende Feld, wählt ein Thema und trägt es in das AB / auf die Karte ein. Er erzählt / berichtet über das Thema, die anderen können noch Fragen stellen und um Ergänzung bitten (nicht aber ihre Meinung dazu sagen!). Dann ist der nächste Spieler dran mit Würfeln. Kommt er auf ein freies Feld, sucht er sich ein neues Thema aus. Hat das Feld schon einen Namen, so muss er zu diesem Thema erzählen. Bei 6 darf man nochmal würfeln.","AB (wie gewöhnliche Brettspiele gestaltet, aber mit freien Feldern und einem Start- und einem Zielfeld) / leere Kärtchen auf dem Boden / auf einem großen Tisch zu einem Spielfeld gelegt; dicke Stifte, kleine persönliche Gegenstände.","GA / PL","Gruppentische oder Stuhlkreis mit freier Fläche auf dem Boden / auf einem großen Tisch.","","","",""],["Wörterwiese","","Einstieg","Wiederholung","DaF WS","","","Wörter zu einem Thema auf ein Arbeitsblatt schreiben: Die L markieren zuerst allein alle Wörter und Ausdrücke, die sie verstehen. Dann versuchen sie die weißen Flecken mit einem Partner zu klären. Die immer noch verbleibenden Flecken in GA oder PL klären. Variante: Auf der Wörterwiese nach einem bestimmten Aspekt Wörter markieren. (z.B.: Orte in der Stadt – “Markiert die Orte, an denen ihr gerne und oft seid.”) Variante auf dem Boden: Wörter und Ausdrücke auf Kärtchen schreiben, auf die Rückseite die Erklärung oder das Wort in der Muttersprache schreiben, oder ein Bild malen.  Im Unterricht: Alle Wortkarten mit Hilfe der Lernenden auf den legen.   Die Lernenden spazieren zu zweit über die Wiese.  Was eine von ihnen nicht versteht, erklärt der Partner. Was beide nicht wissen, erfragen sie von den anderen Teams (oder wenn nichts hilft: Lesen die Erklärung auf der Rückseite).","AB","EA / PA --> GA / PL","","","","",""],["Schwirrende Sätze","","Reflexion","Transfer","Wiederholung","DaF LV","","Die TN haben einen längeren Text bearbeitet und darin Sätze markiert, die ihnen wichtig erscheinen. Sie versammeln sich in einem Sitzkreis und nehmen ihre Texte mit. Der KL wirft jemandem einen Ball zu und bittet ihn, einen wichtigen Satz von der ersten Seite vorzulesen. Wenn fertig, wirft er den Ball jemandem weiter... Nach einigen Sätzen bringt der KL einen zeiten Ball ins Spiel... und dann einen dritten... usw. (zum Ende hin gern etwas überraschendere Wurfobjekte, Quietschente, großen Ball...). So schwirren gleichzeitig viele Sätze im Raum herum. Wenn der KL den Eindruck hat, die erste Seite ist \"fertig\", ruft er eine weitere Seitenzahl. Nach 15-20 Min. beenden.","Bälle (fast so viele, wie TN)","PL","Sitzkreis","","","",""],["Vier Ecken","","Kennen lernen","Einstieg","Erfahrung","","","Reizwörter\" vorbereiten, die die jeweiligen unterschiedlichen Positionen zu einer Frage markieren,  oder Fragen, die unterschiedliche Aspekte des Themas ansprechen. (z.B. „Was können deine L am besten? Warum? a) Sprechen b) Schreiben c) Lesen d) Hören). Diese werden in die Ecken des Raumes geklebt.  Die erste Reizwörter-Struktur wird aufgedeckt und die Begriffe laut genannt. Die TN ordnen sich den Ecken zu, zu deren Begriff sie die größte Nähe spüren. Jede Gruppe diskutiert kurz (5 Minuten) die folgenden Fragen: Wer ist hier? Wer nicht - obwohl ich das erwartet habe? Sind wir aus gleichen/ähnlichen Gründen hier? / bzw. Wie denke ich über diese Frage? Dann werden die Begriffe der zweiten Struktur / die zweite Runde Fragen aufgedeckt und die Gruppen formieren sich neu. Maximal 5 Runden! Man kann die Antworten einfach der Reihe nach übereinanderkleben und das obere Blatt wegnehmen, wenn die nächste Runde startet): Bei kurzen Antworten reicht es auch, wenn wir mit deutlicher Handbewegung die Optionen nennen.","Kärtchen, übereinaner geklebt mit den Antworten (evtl. mit Bildern illustriert)","PL --> GA","","","","",""],["Baum der Erwartungen","","Erwartung","","","","","TN notieren auf Kärtchen, was sie von dem Seminar erwarten: Was möchten sie am Ende können? Wie möchten sie arbeiten? Sie kleben die Kärtchen auf den Baum an der Pinnwand und schauen, wer etwas ähnliches geschrieben hat. Sie können sich austauschen, wie sie das Ziel erreichen wollen. Am Ende des Semianars können wir \"Herbst\" spielen: Welche Erwartungen wurden erfüllt?","grüne Kärtchen in Blätterform, Plakat mit einem Baum","EA --> PA --> PL","","","","",""],["Ärger-Freude-Kuchen","","Kennen lernen","Erfahrung","Einstieg","","","Jeder TN nimmt sich einen größeren Bogen Papaier und listet zunächste seinen Ärger und seine Freuden zum Thema auf. Danach zeichnet er zwei kreisförmige Kuchen, die in ihrer Gesamtgröße der Größe des Ärgers und der Größe der Freude entsprechen können. Er überträgt dann jedes Element seiner Listen in die Kuchenkreise und symbolisiert dessen Bedeutung durch die Größe des Tortenstücks. Danach in Paaren oder Kleingruppen die Kuchen vorstellen.  Variante Feedback: Jeder hebt die Ägernissen und Freuden hervor, die ihm wichtig sind. Er unterstreicht jene Anteile, wo er sich eine Verstärkung und eine Veränderung durch dieses Seminar wünscht. Im Auswertungsgespräch wird besprochen, welche Veränderungen erweckt werden, welche Beiträge jeder leisten kann, welche Wünsche an die Gruppe und den SL vorhanden sind.","DINA3-Blatt","EA --> PA / GA --> PL","","aerger_freude_kuchen_illu.jpg","","",""],["Hühnerhof","","Einstieg","Aktivieren","Erwartung","Reflexion","","Die TN bekommen das Bild \"Umschulung für Käfighühner\". Sie haben einige Zeit, das Bild zu betrachten. Dann bittet der SL die TN, sich im Bild zu verorten: Als welches Huhn sehen Sie sich zur Zeit? Malen Sie bitte ein Huhn aus. Reihum zeigen die TN ihre Kopie und kommentieren kurz: Ich bin hier dieses Huhn, das auf der Bank sitzt. Ich schau mir das Treiben aus der Distanz an. Ich kann mich noch nicht so recht entscheiden, voll mitzumachen. – Mein Huhn ist dieses hier in der Pyramide. Ich habe das Gefühl sehr viel tragen zu müssen. Darum wackeln die Beine. Aber ich habe auch viel Unterstützung von links und rechts....","AB (Bild: Süddeutsche Zeitung)","EA (--> PA) --> PL","","umschulung_f_r_k_figh_hner_johann_mayr.doc","","",""],["Visitenkarten","","Kennen lernen","Erfahrung","Einstieg","Erwartung","Bewegung","Die TN bekommen 6 Visitenkarten mit unterscheidlichen Satzanfängen, die etwas mit dem Seminar zu tun haben. Sie beenden die Sätze und schreiben ihren Namen drauf. Danach gehen sie herum, sprechen TN an, die sie nicht kennen, sie erzählen einander etwas über eine ihrer Karten und tauschen am Ende die Karten aus, über die sie gesprochen haben. Die Aktivität ist beendet, wenn jeder von 6 verschiedenen Personen eine Visitenkarte hat. (Quelle: Lahninger: Leiten, präsentieren, moderieren.)","6 Visitenkarten pro TN (AB), Scheren, Buntstifte","EA --> CP --> PL","freier Raum","visitenk2.JPG","","",""],["Passionschart","","Erfahrung","Reflexion","","","","TN notieren Beispiele aus ihrer Arbeit zu den Feldern: Das kann ich gut / Das mach ich gern / Das kann ich überhaupt nicht / Das mach ich überhaupt nicht gern. Vergleich mit einem Partner (mögliche Gründe?). Daraus kann man auch persönliche lang- und kurzfristige Ziele (z.B. für das Seminar) ableiten.","AB","EA --> PA --> PL","","passionschart.jpg","","",""],["Namensschild basteln","","Kennen lernen","Namen lernen","","","","TN malen etwas zu ihrer Person auf den kleinen Kärtchen, die in die Namensschild-Anstecker passen oder erstellen eine Mini-Collage. Sie laufen dann herum und versuchen die Namensschilder der anderen zu interpretieren und kommen möglichst mit allen ins Gespräch. (Danach ein Spiel zum Namen \"kontrollieren\" / wiederholen.)","Namensschilder, Buntstifte, alte Magazine, Klebestifte, Scheren","EA --> CP","freier Raum","","","",""],["Collage","","Kennen lernen","Kreativität","","","","TN erstellen aus alten Magazinen eine Bild-Wort-Collage. (Für Ordner / Ordnerrücken verwendbar.) Sie gehen herum und lassen ihre Collagen von den anderen TN interpretieren und sie kommentieren sie am Ende auch selbst.","alte Magazine (oder mit Internetrecherche kombinieren), Klebestifte, Scheren, Buntstifte","EA --> PL","","","","",""],["Anleitungschart","","Kennen lernen","","","","","Die TN beantworten im PL kurz (! Opel Kadett, 1Zi-Appartment im Appartmentmenthaus der Uni, Der Name der Rose, Grönemeyer, Blechdosen sammeln) Fragen, die auf einem Flipchart präsentiert werden.","","","","ANLEITUNGSCHART.jpg","","",""],["Gegenstände erzählen","","Kennen lernen","","","","","Die TN wählen aus ihrer Tasche einen Gegenstand aus, der etwas über sie erzählen kann. Sie stellen sich auch so vor: Ich bin ... der Schlüsselbund von ...","Gegenstände","PL / GA","","","","",""],["Teamsteckbrief","","Kooperation","Kennen lernen","","","","Ein Team, das schon länger zusammenarbeitet, stellt sich mit Hilfe eines Steckbriefes vor. Dieser kann als Vorlage zur Bearbeitung zugereicht oder auch frei gestaltet werden. Im Ergebnis enthält er alle in der jeweiligen Situation notwendigen und sinnvollen Informationen: Name, Herkunft, Funktion, Erfahrungen, Stärken und Schwächen, Erwartungen, Absichten, Pläne, Selbst- und Rollenverständnis … Der Teamsteckbrief sollte optisch ansprechend gestaltet sein. Symbolische Darstellungen sind gut möglich. Das Team als Baum, als Schiff  oder als Sportmannschaft. Fotos können aufgeklebt werden. Das Team kann sich einen Namen geben. Steckbriefe werden ausgehängt (vorgestellt, studiert und danach diskutiert, Gemeinsamkeiten suchen...)","Papier, Schere, Klebstoff, Stifte (Fotos)","GA","","","","",""],["Namensgeschichten","","Kennen lernen","Namen lernen","","","","Die TN erzählen zu ihrem Vornamen: Was bedeutet der Name? Wer hat ihm den Namen gegeben? Gibt es dazu eine Geschichte? Wie findet er/sie den Namen? Hat sich in ihrem Leben diese Einstellung geändert? Warum? Wie häufig ist dieser Name in ihrem Land? ...","","PL","","","","",""],["Namensscrabble","","Kennen lernen","Namen lernen","","","","Den Vornamen waagerecht auf ein Blatt Papier schreiben und ein Kreuzwortgitter drumherum bauen, indem man einige wichtigen Informationen zur Person darin unterbringt. Die Ergebnisse im Plenum vorlesen und evtl. auch kurz kommentieren oder ausgehängt. Bei letzterem Rundgang: kurz möglichst viele L zu den Informationen befragen. Bei dieser Variante folgt kein PL oder Auswertung am Ende! Variante: Buchstaben des Namen auf einzelne Kärtchen schreiben und auf dem Boden die Namen der Gruppe so legen, wie beim Scrabble-Spiel.","DIN A4 Blätter, bunt, dicke Stifte, Pinnwand","EA --> PL","","","","",""],["Namensrekord","Namenrekordkette","Kennen lernen","Namen lernen","","","","Eher zum Üben: Die L stehen im Kreis und der Spielleiter hält eine Stoppuhr in der Hand. Der Spielleiter nennt seinen eigenen Namen, dann nennt sein linker Nachbarn seinen, dann dessen linker Nachbar usw., bis der Kreis vollendet ist. Der Spielleiter stoppt die Zeit, die dafür benötigt wird. Nach dem ersten Durchgang rücken die L dichter zusammen und versuchen die Zeit zu unterbieten. Ist die Schallgrenze bei der Zeit erreicht, kann der Spielleiter das Spiel mit einigen Fragen abrunden: - Wer kennt einen Namen? - Wer kennt zwei Namen? - Welcher Name fing mit \"A\" an? - Wie viele \"Martin\" waren in der Gruppe?","","PL","Stehkreis","","","",""],["Mein Name - mein Programm","","Kennen lernen","Namen lernen","Erfahrung","","","TN schreiben ihren Namen von oben nach unten auf ein Blatt und notieren zu jedem Buchstaben ein Wort, das für ihre Lebens- bzw. Unterrichtsphilosophie typisch ist. Sie stellen sich mit diesem Blatt vor und kommentieren die Auswahl. Der nächste TN ist, der irgendwas mit ihm gemeinsam hat... - die Blätter werden auch wie ein Netzwerk angepinnt.","DIN A4 Blätter, bunt, dicke Stifte, Pinnwand","EA --> PL","","","","",""],["Joblotterie","","Gruppenbildung","","","","","Die Funktionen / Aufgaben werden auf Kärtchen geschrieben, jeder TN zieht eine und erfüllt diese Aufgabe bis zu einem vereinbarten Zeitpunkt. Jobkarten können nach einer Zeit auch getauscht werden, wenn beide einverstanden sind.","Jobkarten","FA","","","","",""],["Tschi-Bo","","Gruppenbildung","Aktivieren","Wahrnehmung","","","Die Gruppe teilt sich in Paare auf. Die Paare einigen sich auf ein zweisilbiges Wort. Am besten eignet sich etwas, das sie gemeinsam haben, z.B.: Beide trinken gerne Kaffee - \"Tschi- bo\"; beide waren schon einmal am Nil - \"Nil-pferd\" usw.) Nun werden den TN die Augen verbunden / oder sie machen die Augen zu. \"Es ist Nacht. Dunkle Nacht. Ganz finster ist es. Wir gehen herum. Ganz vorsichtig. Schritt um Schritt machen wir. Tasten uns durch die Dunkelheit. Wir sind nicht allein. Wir spüren andere neben uns, die genauso wandeln. Alle tasten wir uns durch die Dunkelheit. Und wir wissen alle, dass da jemand ist, der zu uns gehört. Aber wie sollen wir ihn finden? Zum Glück haben wir unsere Lockrufe. Mit unserem Lockruf können wir unseren Partner ganz schnell finden. Die Lockrufe ertönen in der Nacht - ganz laut …\"  Während die Spielleitung spricht, führen die Tn die Anweisungen aus. Schließlich lockt jeder seinen Partner mit seiner Silbe des gemeinsam ausgedachten Lockrufs. Wenn alle sich gefunden haben, nehmen alle die Augenbinden ab.","Augenbinden","PA --> PL","freier Raum, ohne Hindernisse","","","",""],["Stumme Schlange","","Gruppenbildung","Aktivieren","Wahrnehmung","","","Funktioniert genauso, wie die anderen Schlangen- / Aufstellungs- / Sortierungsaufgaben, nur die TN sollen die Aufgabe ohne Worte erfüllen.","","PL","freier Raum","","","",""],["Das elektrische Seil","","Kooperation","Problemlösung","","","","Seil etwa in Hüfthöhe zwischen zwei Bäumen / Säulen spannen (max. 150 cm). Die ganze Gruppe muss als Gesamtes über das Seil, ohne dieses zu berühren. Zuerst muss die Gruppe Strategien überlegen, mit der Umsetzung dürfen sie erst beginnen, wenn alle mit den vorgeschlagenen Methoden einverstanden sind und sich die Methode zutrauen. Es können/sollen unterschiedliche Methoden ausgehandelt werden, sowie auch eine Reihenfolge, wer wann über das Seil geht. Auf einmal darf nur ein Spieler über das Seil. (Schwierige Variante: Die TN sollen die ganze Zeit Kontakt zueinander haben.) Sollte jemand das Seil berühren (oder der Kontakt zu einzelnen TN unterbrochen werden), muss die ganze Gruppe von vorne beginnen.","Seil, etwa 2,5 m lang","PL","eher im Freien","","","",""],["Privatgrundstücke","","Kooperation","Problemlösung","","","","Mit den Teppichfliesen und /oder Stücken einer zerschnittenen Plastikplane wird ein ausgedehnter Parcours ausgelegt, bei den man relativ bequem von einem Grundstück zum Anderen gelangen kann. Alle Grundstücke haben eine Eigentümerin, was durch auf den Grundstücken angebrachte Zahlen vermerkt ist (Zahlen vorher verlosen)  Alle TN besitzen mehrere Grundstücke, die mehr oder weniger über den Parcours verteilt sind. Ziel der Gruppe ist es, über den gesamten Parcours hinweg auf die andere Seite zu gelangen. Dabei gelten folgende Regeln: Die TN dürfen alle Grundstücke betreten,die ihnen gehören, d.h. auf denen ihre Zahl markiert ist. Andere Grundstücke dürfen nur dann beteten werden, wenn die Eigentümerin sich selbst darauf befindet. Sie müssen entsprechend wieder verlassen werden,bevor die Eigentümerin sie verlässt. Der Boden zwischen den Grundstücken darf nicht betreten oder berührt werden.Geschieht das trotzdem einmal, muss die betreffende Spielerin wieder zurück zum Anfang des Parcours. Die Gruppe hat eine etwa gleich lange Aktions- und Planungszeit zur Verfügung.","Teppichfliesen / feste Plastikteile / Platten..","GA","freier Raum","privatgrundst_cke.jpg","","",""],["Inselbrücken","","Kooperation","Problemlösung","","","","In der Mitte gibt es eine große Insel. Dort müssen alle zusammenkommen, um das gigantische Inselfest zu feiern. Die Insis sind Wesen, die sich nur wohl fühlen, wenn sie mit anderen zusammen sind.  Nun hat aber eine Überschwemmung ihr Land in lauter kleine Inseln zerteilt: Jeder Mitspieler steht irgendwo auf einem Zeitungsblatt allein. Um wieder zueinander zu kommen, müssen die Insis von einem Eiland zum anderen Dämme bauen. Das Material für die Dämme kann man nur von der eigenen Insel nehmen, das heißt, man reißt Teile von seiner Zeitung ab und legt damit einen Weg. Auf diese Weise finden sich die Insis.","1 Zeitungsblatt pro TN","PL","mittelgroßer Raum","","","",""],["Colaautomat","","Aktivieren","DaF HV","","","","TN führen die Anweisungen des KL aus: \"Du stehst vor einem Getränkeautomaten und willst eine Cola. Greife mit der rechten Hand in deine Hosentasche. Hole 3 1-Euro-Stücke raus. Wirf sie eins nach dem anderen in den Automaten. Du hörst, wie die Maschine KLICK macht.  Wähle dein Getränk und drücke auf den Knopf. Du hörst ein fürchterliches Rumoren aus dem Automaten.  Und dann ruuuummms – die Coladose fällt runter. Hole sie raus. Öffne die Dose. (zisch) Cola spritzt dir ins Gesicht. Nimm ein Tempo aus deiner Tasche und wisch deine Augen. Lecke deine Lippen.  Nimm einen kräftigen Schluck. Und RÜÜÜÜLPS!\"","","PL","Stehkreis","","Mario Rinvolucri","",""],["Energie-Kieselstein","","Aktivieren","","","","","Man stellt sich einen kleinen Kieselstein vor, den man in der rechten Hand hält. Dieser Kieselstein schlupft durch die Handinnenfläche in den Arm und soll nun durch den Körper geschüttelt werden. Zunächst in die Schulter, anschließend mit etwas Schwung in die andere Schulter, in den Arm und zurück. Vorsichtig die Wirbelsäule hinab in den Po, ein paar mal von der rechten zur linken Hüfte und zurück. Dann ins rechte Bein, wieder nach oben zum Becken und ins linke Bein. Der Kieselstein erscheint nun wieder außen, liegt auf dem linken Fuß und wird in hohem Bogen nach hinten gekickt, der Spieler dreht sich um und kennzeichnet den imaginären Aufprall mit einem lauten \"Plopp!\".Übung gemeinsam machen, oder auch wie eine Art Kanon/ Wellenbewegung, zeitversetzt starten.","","PL","Stehkreis","","","",""],["Klotzen","","Erwartung","","","","","Jeder TN erhält eine bestimmte Anzahl von Klötzchen, mindestens doppelt so viele, wie Felder vorhanden sind, besser einige mehr. Sie sollen die Klötzchen je nach ihrer Einschätzung, Erfahrung oder Meinung über die verschiedenen Felder verteilen. Die Klötzchen können zu Türmen gestapelt oder zu Reihen aneinander gefügt werden. Man kann alle Klötzchen für einen besonders wichtigen oder interessanten Bereich verwenden oder seine Klötzchen relativ gleichmäßig allen Feldern zuordnen. Bevor geklotzt wird, sollten sich die TN überlegen, wie sie die Klötzchen setzen wollen. Am besten machen sie sich dazu Notizen. Ein TN beginnt ihre Klötzchen den Feldern zuzuordnen und kommentiert dies. Die anderen TN schließen sich nach und nach an.  (Weiter: Seminarprogramm).","eine größere Menge gleich großer Holzklötze (mindestens 100, ähnlich wie Spielzeugbauklötze etwa 45 x 45 x 20 mm – oder JENGA), Entscheidungsfeld mit Themen, kurzen Aussagen, Begriffen, Problemen, in jedem Feld Freiraum für die Klötzchen","EA --> PL","freier Raum","","","",""],["Blätterlawine","Round robin","Ideen","","","","","Die TN erhalten ein Blatt, auf dem sie zu einem Thema ihre Gedanken, Ideen und Fragen notieren dürfen. Nach einer zuvor festgelegten Zeit (z. B. 2 Minuten) wird auf ein Signal hin das Blatt nach rechts an den Nebenmann weitergereicht. Jeder denkt sich nun möglichst schnell in das Geschriebene ein, ergänzt, erweitert kommentiert oder antwortet schriftlich. Nach einem Signal werden die Blätter wieder weitergegeben. Die Zeitabstände zwischen den Signalen sollten mit wachsendem Text auf den Blättern ausgedehnt werden Abschluss: Jeder erhält am Ende sein Ursprungsblatt zurück und liest, was die anderen zu seinem Text beigetragen haben","DIN A4 Blatt","PL","Sitzkreis","","","",""],["Entscheidungskreise","","Ideen","Motivation","","","","Alle Ideen auf Moderationskarten schreiben und zu Projektthemen ordnen  Auf einem großen Packpapier sechs konzentrische Ringe ziehen. Auf Kärtchen gut lesbar 6 Prüffragen schreiben: Nützt uns die Idee? / Kann das funktionieren? / Dürfen wir das? / Können wir das finanzieren? / Schaffen wir das? Sind wir genug Leute? /  Haben wir genug Zeit? - In sechs Stufen wird zu jedem Vorschlag jeweils eine Prüffrage gestellt. Bei positiver Antwort rückt der Vorschlag eine Stufe weiter.","Packpapier, Kärtchen","GA / PL","freie Fläche auf dem Boden in der Mitte","","","",""],["Ich mach weiter so..","","Reflexion","Transfer","","","","TN notieren auf einem AB am Ende des Seminars Gedanken zu 1. Ich mach weiter so... 2. Ich höre damit auf... 3. Ich fange damit an... - Austausch mit einem Partner.","AB / Papier","EA (-->PA)","","","","",""],["Ideensprint","","Ideen","Kooperation","","","Wettbewerb","Gruppen bilden, alle setzen sich gleich weit vom SL entfernt hin.  Die Gruppen sammeln zu verschiedenen Fragen, die Runde für Runde an die Pinnwand gepinnt werden möglichst viele Ideen auf  Karten zu sammeln (Eine Idee pro Karte und keine Doppelnennungen!) Hat eine Kleingruppe min. 10 Karten gesammelt, kann sie diese bei der Moderation abgeben (Bonuspunkte!). Hat eine Gruppe ihre Karten abgegeben, müssen auch die anderen Gruppen ihre Karten abgeben. Es dürfen keine mehr nachgereicht werden. Die SL pinnt die gesammelten Karten der ersten Kleingruppe untereinander unter die Fragestellung an die Pinnwand und liest die Ideen einzeln vor. Die Jury vergibt Punkte: akzeptable Idee – 1, unsinnige Idee – 0,  1 Punktabzug, wenn eine Idee zweimal in der Kartensammlung ein und derselben Gruppe vorkommt, 3 Bonuspunkte für die schnellste Gruppe, wenn  10 Antwortkarten anerkannt worden) . So verfährt man mit allen Gruppen.  Insgesamt sollten 3-4 Fragen pro Spiel gestellt werden.","Moderationskarten, Pinwand","GA","","","","",""],["Erste Wahl, zweite Wahl","","Gruppenbildung","","","","","Interessengruppen: TN notieren auf einem Blatt zwei Themen, an denen sie gern arbeiten würden.","Zettel","EA","","","","",""],["Sticker chart","","Motivation","","","","Ritual","TN oder Gruppen oder die Gesamtgruppe erhält für erledigte Aufgaben / Teilaufgaben und gute Leistungen Sticker, die in einem Chart gesammelt werden. (Alles zusammen oder nach Tätigkeitsfeldern getrennt.) Den TN muss am Anfang klar sein, wofür sie Sticker bekommen können und was passiert, wenn sie X davon gesammelt haben. Das muss etwas sein, was allen als erstrebenswert vorkommt und pädagogisch wertvoll ist und - wenn es ein Gruppenpreis ist - allen TN gleich nutzt.. (Z.B. umrechnen in \"Spielzeit\", Einladung von Gästen, Erweiterung der Klassenbibliothek, Ausflug oder Unterricht draußen...)","Chart","PL","","funny-daddy-chart-stickers.jpg","","",""],["Fischgrätendiagramm","Ursache-Wirkungs-Diagramm","Ideen","Problemlösung","","","","Ausgangspunkt ist ein horizontaler Pfeil nach rechts, an dessen Spitze das möglichst prägnant formulierte Ziel oder Problem steht. Darauf stoßen schräg die Pfeile der Haupteinflussgrößen, die zu einer bestimmten Wirkung führen. Liegen weitere Ursachen zugrunde, kann weiter verzweigt werden; dadurch ergibt sich eine immer feinere Verästelung.","Papier","GA","","ishikawa_fischgr_tendiagramm_illu.jpg","","",""],["Jetzt, bald, später","","Ideen","Planung","Feedback","","Projekt","Gruppen sammeln Ideen zu ihrem Projekt auf Karten (1 Karte = 1 Idee). Diese ordnen sie dann in einem Jetzt-Bald-später-Matrix ein (sie legen die Karten nur hin). Können sie sich nicht einigen, markieren sie die Karte mit einem Blitz. Diese Karte wird später in der Gesamtgruppe diskutiert oder durch einen \"Jury-Expertencheck\" überprüft. Falls der Gruppe eine Idee grundsätzlich nicht umsetzbar erscheint, wird sie aussortiert (Nicht wegschmeißen! Die Karte muss noch mit der Gesamtgruppe diskutiert werden!). Wenn alle Karten bearbeitet und eingeordnet sind, treffen sich alle im Plenum und begehen alle Plakate / Pinwände. Die Gruppe stellt ihr \"Jetzt-Bald-Später-Matrix\" und auch die strittigen Karten vor. Dabei können sie die Karten auch verschieben.  Zum Schluss fixiert die gruppe ihre Ideenkarten endgültig mit Klebstoff auf dem Raster. --> Projektplan, Prozessbegleitungi.","Packpapier / Pinwände, Moderationskarten, dicke Stifte","GA --> PL","Gruppentische","","","",""],["Zeitschiene","","Ideen","Planen","Kooperation","","Projekt","TN sammeln Aktivitäten, die im Rahmen des Projektes notwendig sind, auf Moderationskarten, schätzen ein, wie viel Zeit für die Bearbeitung nötig ist. Danach werden werden die Aufgaben in die vorbereitete  Zeitschiene eingeordnet.","Raster für den zeitlichen Verlauf des Projektes erarbeiten, auf mehrere Moderationswände verteilen. (links:  A für Projekt- Anfang und rechts  E für Projekt-Ende, Zeiteinheit (Woche, Monat, Tag) auf der Zeitschiene festlegen=","GA","","","","",""],["Geländekarte (Laufzettel)","","Präsentation","Visualisierung","","","Autonom","Themen / Stationen als Landschaft präsentieren, Weg / Wege zeigen entweder Reihenfolge oder Verknüpfungen zwischen Themen","AB / Plakat","","","leserallye_gelaendeplan.JPG","","",""],["Texttheater","","Input","Transfer","Präsentation","Kreativität","","szenische Interpretation eines Textes: Herauspicken einzelner Zitate (Wörter, Sätze oder Satzteile), revueartiger Aufführung – Textcollage Sätze:  zerstückeln, kürzen,  (variierend) wiederholen, intonieren, einzeln oder im Chor vortragen, ein- oder mehrstimmig vortragen, verfremden, mit anderen Sätzen/Satzfortsetzungen (aus den Texten oder selbst formuliert) in Beziehung setzen, in einer bestimmten Körperhaltung sprechen, ihnen durch Pantomime eine neue Bedeutung geben","Texte","GA","","","https://uol.de/fileadmin/user_upload/paedagogik/personen/hilbert.meyer/Thextheater_20032.pdf","",""],["Timeline","Zeitstrahl","Präsentation","Visualisierung","","","","Auflistung von Ereignissen in chronologischer Reihenfolge, Ereignisse, Schlüsselpersonen, Konzepte und Meilensteine - visualisiert als Zeitstrahl","Packpapier, Stifte, Kleber","GA","","timeline.jpg","","",""],["Web-Quest","","Input","IT-Kompetenz","DaF LV","","WWW, BYOD","angeleiteten Internetrecherche, Die TN erhalten Fragestellungen, die sie mithilfe der vorgegebenen Links beantworten müssen. Ergebnisse werden auf einem Protokollblatt festgehalten. Danach: Präsentation als Klassengespräch oder mit Plakaten.","AB / Webseite","PA / GA -> PL","","","","",""],["Denkhüte","","Diskussion","Empathie","","","","Alle TN machen sich mit der Bedeutung der Farbe/Denkrichtung bekannt. Die sechs Vertreter der Denk- und Argumentationsrichtung setzen sich zu einem Kreis zusammen. Jeder wählt eine Hutfarbe und argumentiert in der folgenden Diskussion, den Zusammenhang zwischen den Farben und den spezifischen Denkweisen beachtend. Eine erste Diskussionsrunde beginnt, die nicht länger als 10 Minuten dauern sollte. Alle anderen Anwesenden sind Beobachter und folgen der Diskussion. Nach der Diskussionsrunde erfolgt eine Auswertung.","Papierhüte (wenn Sie es albern finden, A4-Blätter mit Bildern)","GA / PL","","denkh_te.doc","http://xn--kreativittstechniken-jzb.info/wp-content/uploads/2011/09/6-Denkhuete.png","",""],["Diskussion mit Gruppenschutz","","Erfahrung","DaF Sprechen","Kooperation","","","Die Gruppe teilt sich in drei bis fünf Kleingruppen auf. Die Gruppen diskutieren das Problem und arbeiten ihren Standpunkt aus. Jede Gruppe bestimmen einen Gruppensprecher. Die Gruppensprecher setzen sich in einen Innen- bzw. Diskussionskreis und diskutieren mit den anderen Gruppen-Gesandten für eine bestimmte Zeit über ein ausgemachtes Thema. Nach dieser Zeit ziehen sich die Gruppensprecher in ihre Gruppen zurück. Die Gruppen führen Feedback-Gespräche, sammeln neue Argumente oder bestimmen neue Gruppensprecher. Dann geht es in eine zweite Runde, an die sich wieder die Abstimmung mit der Themengruppe anschließt. Dieses Vorgehen kann so oft wiederholt werden, bis eine für alle stimmige Lösung erarbeitet wurde.","","GA --> PL","Innenkreis - Außenkreis","","","",""],["Sprechstein","","Diskussion","DaF Sprechen","","","Ritual","Für diese Aktivität brauchen wir einen schönen Stein, der sich angenehm in die Hand einschmiegt. Die L sitzen im Kreis, der erste L, der den Stein hat, fängt an zu erzählen. Er gibt nach einer Zeit den Stein an jemanden in der Gruppe weiter (bitte nicht automatisch an die NachbarIn!), die jetzt das Erzählrecht erhält. L können auch signalisieren, wenn sie den Stein haben möchten.","ein schöner Stein","GA / PL","Sitzkreis","","","",""],["Open Space","ähnlich: Bar camp","Diskussion","Problemlösung","Kooperation","","Autonom","Methoden, mit der viele Menschen selbstorganisiert und selbstverantwortlich ihre Anliegen gemeinschaftlich bearbeiten können. Es gibt keine vorgegebenen einzelnen Themen. Jeder kann ein Anliegen, das ihm besonders am Herzen liegt, vorantreiben. Das können komplexe und dringliche gemeinsame, aber auch persönliche Fragen und Themen sein. Sie werden erst zu Beginn der Veranstaltung formuliert. Auch Konflikte können bearbeitet werden. So entsteht ein großer „Themen-Marktplatz“, auf dem sich die TN zu Themengruppen zusammenschließen. Die Methode ermöglicht eine breite Beteiligung, erzeugt gegenseitiges Verständnis und Energie für die Umsetzung der gemeinsam erarbeiteten Ideen.  Regeln Im Open Space gibt es vier Prinzipien (eigentlich eher Beobachtungen, wie sich die Welt zeigt)  Wer auch immer kommt, es sind die richtigen Leute – einer oder 25 ist egal, und jeder ist wichtig und motiviert. Was auch immer geschieht, es ist das Einzige, was geschehen konnte – Ungeplantes und Unerwartetes ist oft kreativ und nützlich. Es beginnt, wenn die Zeit reif ist – wichtig ist die Energie (nicht die Pünktlichkeit). Vorbei ist vorbei – Nicht vorbei ist Nicht-vorbei – wenn die Energie zu Ende ist, ist die Zeit um. und ein Gesetz:  Gesetz der zwei Füße – als Ausdruck der Freiheit und Selbstverantwortung: Der Teilnehmer bleibt nur so lange in einer Gruppe, wie er es für sinnvoll erachtet, also solange er etwas lernen und/oder beitragen kann.","","","großer Raum, Pinwände, Moderationskarten","","https://www.youtube.com/watch?v=hJpTQpLLK7E","",""],["NASA-Spiel","","Kooperation","Problemlösung","DaF Sprechen","","","TN diskutieren und entscheiden, welche Materialien sie in der beschriebenen Situation brauchen","AB","GA","Gruppentische (weiter voneinander)","","https://arbeitsblaetter.stangl-taller.at/KOMMUNIKATION/NASASpiel.shtml","",""],["Problemdreieck mit Stützen","","Problemlösung","Transfer","Kooperation","","","Auf einem Plakat/Flipchart wird ein Dreieck mit der Spitze nach unten gezeichnet. Das Problem wird formuliert und in das verkehrte Dreieck geschrieben. Von den Schenkeln des Dreiecks werden Linien hin zur unteren Kante des Papiers gezeichnet. Sie stellen die Stützen dar, die dem Problem Halt geben. Die Gruppe erarbeitet gemeinsam die Ursachen des Problems und notieren diese auf den Stützen des „Problem-Dreiecks“. Auf Methodenkarten mit einem gezackten oberen Rand („Säge“) notieren die Gruppen Maßnahmen, die die Ursachen beheben können und pinnen sie auf die entsprechenden Stützen auf dem Plakat.","","","","problemdreieck.jpg","","",""],["Fesselballon","Ballonfahrt","Problemlösung","Transfer","Kooperation","Coaching","Autonom","Die Gruppen bestimmen ein Ziel, das sie erreichen möchten und diskutieren, was sie beim Erreichen hilft bzw. sie daran hindert.  Schritt für Schritt werden positive
