 und negative Wirkfaktoren reflektiert und an den entsprechenden Stellen des Plakats notiert:  1. Im ersten Schritt werden die Faktoren aufgelistet, die eine positive Wirkung haben und für einen Auftrieb sorgen.  2. Im zweiten Schritt werden die Ressourcen reflektiert, die das ganze Vorhaben nach vorne bringen können.  3. Im dritten Schritt werden die Faktoren reflektiert, die bremsend wirken.  4. Im vierten Schritt werden Strategien entwickelt, wie der Ballon am besten zum Abheben kommt. Idealerweise folgt danach ein konkreter Umsetzungsplan mit Zielformulierungen.","Plakat mit einem Heißluftballon, der mit Seilen am Boden befestigt wird, mit Ballasten im Korb und einem Antrieb. Stifte in versch. Farben","GA","Gruppentische","","","",""],["ABC-Methode","ABC-Liste","Einstieg","Feedback","Evaluation","DaF WS","","Vorbereitung: Auf einem Arbeitsblatt oder einer langen Packpapierrolle untereinander die Buchstaben notieren. (Oder wenn man es häufig macht: Auf Kärtchen das ABC vorbereiten und einfach daneben / drauflegen).   Aufgabe: Zu einem angegebenen Thema / Leitfrage zu jedem Buchstaben des Alphabets ein Wort notieren. (Hobbys, was ich gerne mache, Partys, Sommer...) Variante: Aus dem Text / aus dem Kursbuch / aus einer Zeitung Wörter zu einem bestimmten Thema sammeln.   Funktioniert als EA (dann mit einem Arbeitsblatt) – oder noch besser als GA oder mit der Gesamtgruppe. In dem Fall den Hinweis geben: Erst lesen, was schon da ist, dann Wörter notieren. Keine doppelten Eintragungen. Auch möglich: Plakat mit kleinen Bildern. (s. Anhang)","Packpapier, ABC-Kärtchen","EA / PA / GA","","abc.jpg","","",""],["Fallstudie","Case Study Method","Problemlösung","Erfahrung","","","Autonom","den TN wird ein \"Fall\" vorgelegt, der eine problematische Situation (meist fiktiv oder historisch) schildert. Aufgabe ist es dann, eine Lösung zu erarbeiten und zur Diskussion zu stellen. Arten: Problemfindungsfall,  Entscheidungsfall, Beurteilungsfall, Informationsfall, Untersuchungsfall. Die Fallarten unterscheiden sich durch folgende Lerneffekte:  Information: Die für die Falllösung relevanten Daten können vollständig, lückenhaft oder auch gar nicht gegeben sein. Problem: Das der Fallstudie zugrunde liegende Problem kann ausdrücklich benannt werden. Im Gegensatz dazu kann aber auch der Lernende gefordert sein, die Probleme eigenständig zu erkennen und ihre Relevanz abzuwägen. Lösung: Lösungsalternativen sind vom TN zu suchen, er kann aufgefordert sein, sich für eine zu entscheiden. Ebenso kann aber die Lösung vorweggenommen und zum Diskussionsgegenstand gemacht werden.","AB / Infopaket","GA","","","","",""],["Send a problem","","Problemlösung","Erfahrung","Coaching","","Autonom","In Gruppen die Probleme diskutieren, die in Bezug auf das Seminarthema häufig auftauchen. Ein (oder zwei) Problem auswählen, zu dem die Gruppe keine / unzureichende Lösungen hat und auf ein Blatt schreiben. Die Blätter im Uhrzeigersinn an die nächste Gruppe weitergeben. Die Gruppe notiert dann auf dem Blatt die Lösungsideen und zieht einen Strich, wenn sie fertig sind. Das Blatt weitergeben... bis man wieder das eigene Blatt zurückbekommt. Danach die Lösungen diskutieren. Feedback im PL: Was gefält, wobei haben sie Bedenken, wozu haben sie Fragen...","A4-Blätter","GA","","","","",""],["U-Prozedur","","Problemlösung","Kooperation","","","Autonom","Bei dieser Methode wird zu Beginn die Ist-Situation diagnostiziert und schließlich ein Soll-Entwurf erarbeitet. Zu Beginn wird das Sichtbare und Erlebbare erfasst, festgestellt, wer die beteiligten Personen sind sowie die Grundauffassungen erkundet, nach denen diese Personen heute handeln. Anschließend startet man mit der Erneuerung, indem gefragt wird was gewollt ist. Dann werden die neuen Leitsätze konkretisiert: Was tun die Beteiligten jetzt anders und wie gestalten sich die neuen Abläufe? Der Prozess lässt sich U-förmig darstellen","Packpapier","GA","","u_prozedur.png","https://methodenundmehr.de/u-prozedur/","",""],["Querdenker","","Problemlösung","Kooperation","","","","Mit der Technik des \"Querdenkens\" werden Problemstellungen, Situationen oder Personen aus sechs Perspektiven betrachtet, um Lösungsansätze zu erarbeiten.  1. Definieren Sie das Problem.  2.\tErklären Sie die Funktionen der sechs Querdenker.  3.\tLegen Sie die Spielregeln fest. \tTeilen Sie das Plenum in sechs Gruppen auf. \tWeisen Sie jeder Gruppe auf einer Karte eine Denkrichtung zu. \tNach jeder Äußerung werden die Karten im Uhrzeigersinn weitergegeben. \tKlären Sie Verständnisfragen.  4.\tBeginnen Sie mit dem \"Querdenken\".","","GA --> PL","","querdenker_rollen.jpg","","",""],["SWOT-Analyse","","Problemlösung","Planung","","","","engl. Akronym für Strengths (Stärken), Weaknesses (Schwächen), Opportunities (Chancen) und Threats (Risiken): wenig Aufwand,  leicht anwendbar, visuell, hilft, Komplexität zu reduzieren. Schafft einen Gesamtüberblick (positive und negative Aspekte) Anwendbar: Organisationen, Projekte, einzelne Prozesse, Produkte, Zukunftsvisionen.","Papier","EA / PA / GA","","SWOT3.jpg","","",""],["Das innere Team","","Problemlösung","Planung","Konflikte","","","Methode von Schulz von Thun: Thema / Frage notieren, bei denen TN / Gruppen \"hin- und hergerissen\" sind. Auf die Frage antworten und den Stimmen einen Namen geben (Papier / Orte im Raum / Stühle dafür bestimmen). - z.B Projektplanung: Der Macher: Lass es uns einfach durchziehen! Der Vorsichtige: Das ist zu riskant. Wir gehen lieber den sicheren Weg. Der Hilfesuchende: Wer könnte mich bei meiner Entscheidung unterstützen? Der Nachdenkliche: Wir sollten noch mehr Informationen sammeln und recherchieren. Der Konstruktive: Wie könnten wir das Risiko senken? Der Blockierer: Auf keinen Fall machen wir das!) Der TN / die Gruppe sammelt  Reaktionen und Argumente zu den \"Stimmen\", notieren alle einzeln auf Blättern. Am Ende Gespräch (\"Verhandlung\" im Team): Was dominiert? Welche Erkenntnisse? Wie gehen wir vor? Kompromiss möglich?","","EA / GA","","","https://www.inneres-team.de/","",""],["Aktives Zuhören","Spiegeln","Wahrnehmung","Kommunikation","","","","PA - wechselweise erzählen / zuhören (vorher Zeitlimit setzen). 1. Aufnehmendes Zuhören: Blickkontakt, Aufmerksamkeitslaute, Gestik, Mimik, Spiegeln der Emotionen . 2. Paraphrasieren & Wiederholen mit eigenen Worten (Fragen, Missverständnisse klären) 3. Verbalisieren & Wiedergeben mit eigenen Worten:  die vermutlichen Stimmungen und Emotionen des Gesprächspartners wiedergeben","","PA","","","","",""],["Vier Ohren und vier Schnabeln","Nachrichtenquadrat","Wahrnehmung","Kommunikation","","","","s. 4 Ohren Modell: Aussagen beamen, TN \"übersetzen\" sie: Was höre ich? Wie reagiere ich? // Variante: Reaktionen zuordnen","vorbereitete Sätze (Kärtchen / Beamen)","PL / GA","","","https://www.youtube.com/watch?v=9VJn1cPbf1A","",""],["Stärken-Schwächen-Profil","","Reflexion","Planen","Coaching","","","Welche Stärken, welche Schwächen sind für X charakteristisch? Was erleben Sie als ...  positiv, was eher negativ? Wie würde eine außenstehende Person X wahrnehmen? - Kommentare werden in zwei Spalten gesammelt, Reihum werden zuerst die Stärken dann die Schwächen zusammengetragen, bis alle Ideen vorgestellt sind. Diese Aussagen werden in einem weiteren Schritt geklärt, gewichtet und diskutiert.  In Kleingruppen werden die Ursachen und Folgen gesucht und danach im PL diskutiert. Das weitere Vorgehen wird besprochen und festgehalten.","Papier / Flipchart","PL --> GA --> PL","","","","",""],["Portfolio","","Reflexion","","","","Autonom","Arbeitsergebnisse, Dokumente, Präsentationen sammeln, die den eigenen Lernfortschritt dokumentieren und reflektieren --> Grundlage für Bewertungen (soll auch den Prozess und die Entwicklung aufzeigen) oder Bewerbungsportfolio (aktueller Stand).","Mappe","EA","","","http://methodenpool.uni-koeln.de/download/portfolio.pdf","",""],["Quadrate","","Evaluation","","","","","Geeignet für Fragestellungen, die zwei verschiedene Aspekte aufweisen (z.B. Spaß + persönlicher Lernerfolg). Unter die Fragestellung werden vertikal und horizontal die beiden Aspekte geschrieben und die Bedeutung der vier Ecken erklärt (++ bis - - ). Die TN kleben ihre Punkte in das Quadrat bzw. markieren die Stelle, die ihrer Position entspricht. Um Anonymität zu bewahren oder Zugzwang und Gruppenzwang zu vermeiden, können die einzelnen Quadrate nummeriert oder mit Buchstaben versehen werden.  Jeder TN schreibt dann die entsprechende Nummer auf einen Zettel und der SL markiert, oder klebt die Zettel an die gewünschte Stelle..","Tafel / Flipchart, kleine Post-it-Zettel","EA (--> PL)","","quadrat.jpg","","",""],["Klagemauer","","Feedback","","","","","TN beantworten die Frage schriftlich auf Moderationskärtchen (1 Karte – 1 Idee).  Regel: Alle schreiben für sich allein. Alle Äußerungen sind erlaubt. Nach etwa zehn Minuten wird das Sammeln von Kritikpunkten beendet. In Kleingruppen werden die Kritikzettel gemeinsam durchgesehen und besprochen. Wenn durch dieses Gespräch neue Ideen entstehen, können sie noch ergänzt werden. Bei der Klagemauer kleben die Teilnehmenden ihre Kritikzettel in versetzten Reihen (nach dem Muster einer Mauer. Jeweils zwei TN aus jeder Gruppe tragen zum Abschluss die wichtigsten Kritikpunkte aus ihrer Kleingruppe noch einmal vor","Packpapier, Leitfrage auf Streifen","EA --> GA --> PL","","","","",""],["Vier Felder-Matrix","","Feedback","Reflexion","","","","Ideen / Kommentare in einem Achsenkreuz in 2 Dimensionen anordnen (Bsp. s. Link)","Papier / Flipchart","GA","","","https://www.projectwizards.net/de/blog/2019/09/project-priorisation","",""],["Na, wie wars?","","Evaluation","Transfer","","","","Kurze Nachdenkphase (still). Danach Paare bilden, Paare setzen sich zusammen in den Sitzkreis. Die TN stellen sich vor, die Veranstaltung liegt schon einige Tage zurück. Auf der Straße treffen sie einen alten Bekannten, einen guten Freund usw., der weiß, dass die Veranstaltung stattgefunden hat. Er fragt nun: \"Na, wie war´s?\" Der TN, der gefragt wurde, versucht nun eine kurze und treffende Antwort auf die Frage des Bekannten bzw. Freundes zu geben. (\"Wie hat die Veranstaltung gefallen?\" - \"War sie ein Erfolg?\" - \"Was war das Beste?\").  Ein TN geht in die Mitte des Kreises. Sein Partner steht auch auf und trifft ihn in der Mitte. Nach kurzer Begrüßung fragt er: \"Na, wie war´s?\" Der TN beantwortet die Frage. Der Partner hört die Antwort, sagt aber nichts weiter. Danach trennen sich die beiden wieder und kehren in den Stuhlkreis zurück. … So weiter, bis alle dran waren. KEiNE KOMMENTARE!","","PL","Sitzkreis","","","",""],["Feedback-Brief","","Evaluation","Feedback","","","","Die TN schreiben der SL einen Brief. Variante Feedback im Telegrammstil  / Twitter in 140 Zeichen","Papier","EA","","","","",""],["Transferbarometer","","Transfer","Reflexion","","","","TN markieren auf einem Skala ihre Transferergebnisse","Skala","EA --> PA/GA","","transferbarometer.jpg","","",""],["Fragelandschaft","","Einstieg","Erfahrungen","Diskussion","DaF Sprechen","","TN spazieren mit einem Partner herum und besprechen die Fragen, die sie interessieren. Sie notieren kurz ihre Ideen / ihre Meinung. Im PL Interessantes / Kontroverses sammeln.","Fragekarten auf dem Boden, zu einer Landschaft angeordnet","PA --> PL","","fragelandschaft_gross.jpg","","",""],["Apfelmemory","","Wahrnehmung","Kooperation","","","","von verschiedenen Sorten von Äpfeln jeweils einen in 4 Teile zerschneiden, die TN legen die Spalte wieder zusammen","Äpfel, zerschnitten","GA","","","","",""],["Zehn Dinge, die ich bis heute nicht wusste / konnte","","Reflexion","Feedback","","","","TN notieren 10 Dinge, die sie am Seminartag zum Thema dazugelernt haben.","","EA --> PA --> PL","","","","",""],["Krach machen","","Aktivieren","Erfahrung","Einstieg","","","1. Variante: TN wählen eine Nummer zwischen eins und zehn aus. Sie sollen genau so viele Dinge in den Raum rufen, das sie zum Thema schon wissen.  2. Variante: „Gehen Sie durch den Raum und rufen Sie den anderen Teilnehmern sechs Dinge zu, die Sie in diesem Training lernen möchten.”  3. Variante: „Nennen Sie laut drei themenbezogene Inhaltspunkte, die besonders wichtig für Sie sind.”","","CP","freier Raum","","","",""],["Titelblatt","","Kennen lernen","","","","","Ein persönliches Titelblatt einer Zeitschrift zu gestalten, das folgende Punkte enthält:  Titel der Zeitschrift: Entweder der Vor- oder Nachname in Großbuchstaben, oder im Stile angelehnt an eine real existierende Zeitschrift (auto-motor-sport, Elle, YPS) Ein gezeichnetes Selbstportrait (Skizze). Drei Schlagzeilen zum Inhalt der Zeitschrift: Das können drei Schlagzeilen zum Job sein, oder zwei zum Job, eine zur Freizeit. Vielleicht auch eine Schlagzeile zum Job, eine zur Freizeit und eine mit einem persönlichen Claim.","","","","","","",""],["Experten-Speed dating","","Erfahrung","Kennen lernen","","","","TN schreiben auf einen Post-it-Zettel, für welches Thema (im Bereich des Seminarthemas) sie Experte sind. Danach wie Speed dating weitermachen. Pro Gesprächsrunde 3 Minuten.","Post-its","PA","zwei Stuhlreihen","expertenspeddating.jpg","","",""],["Drei Tags","","Kennen lernen","","","","","Die TN nennen ihren Twitter/Skype-namen, und drei Tags zu ihrer Person. Oder malen drei kleine Tag-Bilder.","","PL","","","","",""],["Flugschule","","Wiederholung","","","","","Die Großgruppe wird in 2 Gruppen geteilt. Jede Gruppe bekommt ein Teilthema des Seminarthemas / des Tagesthemas. Sie sammeln dazu Fragen und notieren sie auf DINA4-Blättern. Das (ausreichend große) Spielfeld mit einem Seil in zwei Teile teilen. Jede Gruppe nimmt in ihrem Teil Position ein. Auf ein Startsignal versuchen sie ihre Flieger in die andere Spielfeldhälfte zu bekommen. 1 Minute lang dürfen sie alles, was in ihrem Spielfeld landet, wieder aufsammeln und zu den anderen rüberzuschleudern. Dann zählen die Gruppen die Flugzeuge, die sich in ihrem Spielfeld befunden haben. Jedes Flugzeug bedeutet einen Minuspunkt.  Für jede richtig beantwortete Frage gibt es einen Punkt. Im besten Fall haben die Gruppen am Ende 0 Punkte. Das zeigt, dass sie alle Fragen richtig beantwortet haben.","DIN A4 Blätter, bunt, dicke Stifte, Seil","GA --> PL","im Freien","","","",""],["Klatschen und Stampfen","","Input","Diskussion","Einstieg","","","Der KL hält einen Vortrag - oder liest der Reihe nach Thesen zum Seminarthema vor. Wenn die TN mit den Aussagen / Thesen einverstanden sind, klatschen sie in die Hände, wenn nicht, stampfen sie mit dem Fuß auf. (Geeignet auch für Großgruppen, um ein Meinungsbild in der Gruppe zu bekommen):","","FA","","","","",""],["Transferprämie","","Reflexion","Transfer","Motivation","","","TN formulieren schnell ganz konkrete Transferideen: Was möchten sie mit dem Gelernten ganz genau anfangen? (Oder einen Begriff genau erklären, der behandelt wurde) - Für jede Person, die aufsteht, gibt es einen Punkt. Die Gruppe muss innerhalb von einer Minute 15 Punkte sammeln, um ... eine längere Mittagspause (s. Beispiel), Gummibärchen, ein interessantes Spiel... zu bekommen. In der Gruppe wird ein Zeitnehmer und ein Auf-und-Abzähler bestimmt.","Stoppuhr","PL","","Transferpr_mie.jpg","","",""],["Pufferaufgaben für Turbogruppen","","Transfer","","","","","Bei GA gibt es immer min. eine Gruppe, die zu schnell fertig ist. Was sie dann machen können: Liste machen (die 10 wichtigsten / interessantesten Dinge, die wir gelernt haben), eine Metapher für das Gelernte auswählen (malen und erklären), eine Geschichte dazu schreiben, anderen Gruppen still zuschauen, wenn sie es erlauben, Fragen auf Karteikarten zum Gelernten formulieren (auf der Rückseite die Lösung notieren)...","","GA","","pufferaufgaben_GA.jpg","","",""],["Flusslauf","","Reflexion","Einstieg","","","","Die TN diskutieren zuerst, welche Ziele sie sich gesetzt haben und welche sie davon noch nicht erreicht haben. Danach schreibt jeder TN 3 Stolpersteine einzeln auf Kärtchen, die ihn hindert, diese Ziele zu erreichen. Danach wird die Gruppe in zwei Teile geteilt. Auf dem Boden wird mit Tesakrepp ein Fluss dargestellt (2 Linien für Ufer): Kurven, mal enger, mal breiter... Die TN überlegen, wofür die einzelnen Stellen stehen (Hafen? Zwischenstopp? besonders tiefe Stellen? besonders flache, die einen Übergang ermöglichen?...) und vergleichen den Flussverlauf mit dem Weg, den sie bisher (beruflich / in der Ausbildung) zurückgelegt haben. Beide Gruppen können dann jeweils ein Ufer nutzen und ihre Stolpersteine hinlegen. Sie können dabei Gegenstände aus dem Raum oder Postkarten / Bilder verwenden, um die Aussagen zu verstärken. Auswertung im Plenum, kurze Diskussion, dann eigene Zielvereinbarung formulieren. (Um die Erreichung welcher Ziele möchte ich mich wie und bis wann kümmern? Wie werde ich die Umsetzung kontrollieren? Was gönne ich mir, wenn ich das Ziel/ die Ziele erreicht habe?)","Tesakrepp, Kärtchen, dicke Stifte, Postkarten / Bilder, Gegenstände aus dem Raum","PL --> EA --> GA --> PL","freie Fläche auf dem Boden in der Mitte","","","",""],["Keks-Scrabble","","Wiederholung","Reflexion","","","","Buchstabenkekse auf den Pausentisch kippen und die TN bitten, möglichst viele Fachbegriffe aus der letzten Arbeitseinheit oder den letzten Stunden, mit den Buchstaben zu legen, dabei unbrauchbare und kaputte Buchstaben sofort aufzuessen. (Quelle: Apprenti, Sandra Dirks)","Buchstabenkekse","GA / PL","großer Tisch","","","",""],["Dreier-Memory","","Gruppenbildung","DaF WS","","","","Memorykarten der besonderen Art für Gruppenbildung: Stadt-Land-Fluss, Glaube-Liebe-Hoffnung, Sex-Drugs-Rock&Roll, Schneller-Höher-Weiter, Himmel-Arsch-Zwirn, Lirum-Larum-Löffelstiel, Ton-Steine-Scherben, Friede-Freude-Eierkuchen, Wein-Weib-Gesang, Athos-Porthos-Aramis, Blut-Schweiß-Tränen, Caspar-Melchior-Balthasar, Pi-Pa-Po, Schnick-Schnack-Schnuck, Jubel-Trubel-Heiterkeit, heimlich-still-leise, Pleiten-Pech-Pannen, quadratisch-praktisch-gut, Kopf-Hand-Herz....","Kärtchen","CP","freier Raum","","","",""],["Was zuerst? Was danach?","","Einstieg","","","","","KL untergliedert das Thema in 7 interessante Oberpunkte/ Überschriften. Die TN stimmen ab, in welcher Reihenfolge sie die Themen vermittelt haben möchten.","Flipchart, Kärtchen","GA","","","","",""],["M.O.S.E.","","Einstieg","Ideen","","","","Brainstorming: Ideen nach Kategorien ordnen: M-enschen, O-rte, S-achen, E-reignisse.","Flipchart","PL","","","","",""],["Finde jemanden (autonom)","","Kennen lernen","Namen lernen","DaF Sprechen","","Autonom","Wie oben – nur ohne AB: SL heftet einige Kärtchen (A4-Format, nummeriert, große Schrift, von überall im Raum gut sichtbar und) nach den möglichen Mustern (… kann, … hat, … hatte / hat... gemacht, … mag, … kennt/weiß, … war schon mal...) an die Tafel und die TN schreiben jeweils eine neue Karte, nummerieren sie und heften es auch an die Tafel. Wenn jemand etws hinhängen will, das schon hängt, muss eine neue Frage formuliert werden.","DIN A4 Blätter, bunt, dicke Stifte, Pinnwand","EA --> CP","freier Raum","","","",""],["Routenplaner","","Prozessbegleitung","Präsentation","","","","Laufzettel: In einer Karte sind Punkte eingezeichnet (und nummeriert / alphabetisiert), die die Stationen / Lesetexte symbolisieren (am Rand: Thema? Arbeitsform? / Textlänge?). Die TN markieren die Punkte, die sie bearbeitet haben und verbinden diese wie eine Route in der Reihenfolge der Bearbeitung.","AB, Buntstifte","PA / GA","","","","",""],["Zitatenwiese","","Einstieg","Feedback","Erfahrung","","Bewegung","Zitate zum Thema auf Kärtchen / A4-Blätter schreiben. TN gehen kurz herum, stellen sich dann zum Zitat hin, das sie am ehesten anspricht, und diskutieren kurz mit den anderen TN, die das gleiche Zitat gewählt haben.  Mehrere Runden auch möglich: Womit ich einverstanden bin – was ich komplett anders sehe – was mich verblüfft....","Zitate auf Kärtchen (laminiert)","CP / PA","freier Raum","","","",""],["Symbol","","Einstieg","","","","","SL nennt das Thema oder die Sachfrage. Sie bittet die TN sich nun zu dem Symbol zu stellen, das am ehesten der jeweiligen Haltung, Einstellung und Meinung entspricht. Die  Kleingruppen tauschen nun in einem kurzen, ersten Gespräch ihre Meinung aus. (15 Min.) Die Gruppen notieren ggf. Schwerpunkte auf Karten bzw. auf einer Wandzeitung.  Die Gesamtgruppe kommt wieder zusammen. Die Kleinguppen berichten nun von den Schwerpunkten im Gespräch. (Die eventuell entstandenen Karten/die Wandzeitung werden/wird an einer Pinnwand visualisiert und dienen/dient den Teilnehmerinnen und Teilnehmern zur Vorstellung ihrer Ergebnissen)","Symbole auf Kärtchen","PL --> GA --> PL...","freie Fläche auf dem Boden in der Mitte","","","",""],["Zwiebel","","Kennen lernen","","","","","Die TN und das Team malen je eine „Zwiebel“ bzw. 5 Ringe, in deren Mitte sie sich selbst einzeichnen. In die Ringe tragen sie diejenigen Eigenschaften und Gruppenbezüge ein, die sie an sich selbst wichtig finden, die wichtigeren dichter im Zentrum, je unwichtiger, desto weiter nach außen. Alle hängen ihre Zwiebel-Bilder an den Wänden auf und erläutern sie.  Auswertung: Was ist wichtiger, was weniger wichtig? Warum? Findest du es eher einfach oder schwer zu beschreiben, welche Eigenschaften du an dir wichtig findest? Gibt es gesellschaftliche Ursachen für die Entscheidung?","DIN A3-Blatt / DIN A4","EA --> GA / PL","","zwiebel.jpg","","",""],["Defizit-Spiel","Ich habe noch nie...","Kennen lernen","Aktivieren","DaF Sprechen","","","Jeder L bekommt 5 Streichhölzer. Die L sitzen im Kreis. Ein L beginnt und sagt einen Satz über sich, in dem ein Defizit von sich mitteilt, z.B. „Ich war noch nie in Wien.” Alle Spieler, die schon in Wien waren, müssen dem „Unglücklichen” ein Streichholz abgeben. Der Gewinner ist der Spieler mit den größten Defiziten = den meisten Streichhölzern.","Streichhölzer, Perlen, Bonbons...","PL","Sitzkreis","","","",""],["Raum verändern","","Wahrnehmung","Aktivieren","DaF Sprechen","","","Während ein TN den Raum verlässt, verändern die Übrigen 10 Dinge im Raum. Der TN wird hereingerufen und soll binnen bestimmter Zeit (z.B. 2 Minuten), die 10 Veränderungen benennen (oder korrigieren).","","PL","","","","",""],["Stempelspiel","","Kennen lernen","","","","","Ort kennen lernen: Jede Gruppe erhält eine Klemmmappe und ein AB. Dann schickt man die Gruppen in die Stadt, um Stempel (evtl. Stempel von angegebenen Einrichtungen) zu sammeln. Nach einer vorgegebenen Zeit müssen alle Gruppen wieder am vereinbarten Treffpunkt sein. Jeder Stempel gibt einen Punkt.","Klemmmappe, AB","GA","","","","",""],["Körper-Sprüche","","Erwartungen","","","","","Die TN notieren zu Sprüchen mit Körperteilen ihre Erwartungen an das Seminar. (Sie können auch neue Sprüche hinzufügen)","AB","EA --> PA/GA --> PL","","Erwartungen_K_rper-Lehrerin.pdf","","",""],["Problemfigur","","Erfahrung","","","","","Die TN notieren ihre beruflichen Probleme zu den entsprechenden Stellen im AB. (Sprüche zu Körperteilen: Worüber raufe ich mir die Haare? Wo sehe ich schwarz? Was kann ich nicht mehr hören? Was brennt mir auf der Seele? Was verschlägt mir die Sprache? ...)","AB","EA --> PA --> PL","","problemfigur_kopiervorlage.pdf","","",""],["Landkarte der Professionalität","","Erfahrung","","","","","TN schauen sich die Karte an, und suchen Orte: 1. Wo sie sich oft (gern oder ungern?) aufhalten 2. Orte für \"Kurzbesuche\" 3. Orte, wo sie noch nie waren aber gern hinwollen 4. Orte, wo sie lange Zeit nicht waren und gern nochmal besuchen wollen 5. Orte, die sie tunlichst vermeiden wollen... (Aus der Aktivität kann man auch Wünsche an das Seminar ableiten: \"Reiseroute\".)","AB, min. A3","PA --> PL","","landkarte_der_professionalit_final_EPIK.SCHULE.AT.pdf","","",""],["Amerikanische Debatte","Zickzackdebatte","Diskussion","DaF Sprechen","","","","Alle Teilnehmer werden in Gruppen eingeteilt. Es kann auch sofort in Pro und Kontra Gruppen unterteilt werden. In einem vorgegebenen Zeitraum suchen die Teilnehmer Argumente zu einem bestimmten Thema (Quellen sind z.&#8201;B. aktuelle Zeitungsartikel, das Internet...). Die Phase des Argumentenaustauschs, die Debatte beginnt. Der Diskussionsleiter eröffnet die Debatte, indem er einer Seite das Wort erteilt. Die Diskussionszeit ist streng einzuhalten. Der Diskussionsleiter unterbricht jeden Beitrag nach der vereinbarten Zeit. Sie sollte zwischen 30 Sekunden und einer Minute liegen. Am Ende einer Debatte kann eine allgemeine Plenumsrunde oder eine Abstimmung stattfinden.","","GA --> PL","zwei Stuhlreihen","american-debate.png","","",""],["Brief an mich selbst","","Reflexion","Evaluation","Transfer","","","Die TN halten in einem Brief fest, was sie gelernt haben, was sie mitnehmen und was sie in naher Zukunft unbedingt einmal umsetzen wollen. Der Brief wird versandfertig an sich selbst adressiert. Der SL verschickt die Briefe nach einem gewissen Zeitraum und bringt das aktuelle Geschehen noch einmal in Erinnerung. Der Brief wird dann beantwortet (an SL oder an alle): Was ist seitdem passiert? Was ist aus meinen Plänen / Ideen / guten Vorsätzen geworden? Woran arbeite ich gerade?  Welche Erfolge habe ich erlebt? Welche (neuen) Probleme beschäftigen mich gerade?","Briefpapier, Briefumschlag, Briefmarken (geht aber auch als E-Mail, die zuerst an die SL versendet wird, der diese speichert und später zurückschickt. NICHT ÖFFNEN!) - oder hier erstellen: https://www.futureme.org/, wird automatisch verschickt nach der festgelegten Zeit","EA","","","","",""],["Diagramm-Abfrage","","Erfahrung","","","","","auf ein Flipchart-Blatt ein Diagramm zeichnen,  X-Achse: Themen, zu denen sich die TN einschätzen sollen.  Y-Achse: Stufen für das Beherrschen dieser Themen ein (\"gar nicht, etwas, gut, sehr gut, Profi\"). Die TN können am Beginn des Seminars zu jedem Thema eine Selbsteinschätzung abgeben. Am besten läuft es, wenn alle zusammen zum Flipchart gehen und dort die Kreuze machen. SL wertet die Selbsteinschätzungen aus.  Am Ende des Seminars oder eines Seminartags können sich die TN wieder auf dem Diagramm eintragen. Diesmal mit einer anderen Farbe, damit sie sehen können, wie sie sich durch den Kurs in den Themen verbessert haben.","Flipchart, dicke Stifte","EA --> PL","","","","",""],["Dreieck der Gemeinsamkeiten","","Kennen lernen","Gruppendynamik","DaF Sprechen","","","Jeweils drei Teilnehmer bilden eine Gruppe. Auf einem Papier wird ein Dreieck gemalt. An jeder Ecke wird der Name eines TN notiert. Die TN tauschen sich aus, zu z.&#8201;B, Alter, Hobby, Kompetenzen, Arbeit, Pläne ... Gemeisamkeiten zwischen zwei Gruppenmitgliedern werden an den Linien notiert. Gemeinsamkeiten des gesamten Trios in der Mitte des Dreiecks eintragen. Nach Ablauf der vorgegebenen Zeit, stellt jede Gruppe die gefundenen Gemeinsamkeiten vor (bzw. auch Sachen, bei denen sie denken, dass jemand von ihnen “einzigartig” in der Gruppe ist).","A3 oder Flipchart, dicke Stifte","GA3","Gruppentische","dreieck.jpg","","",""],["Flipchartbild","","Präsentation","","","","","Eine Gruppe arbeitet ein Thema aus – zum Beispiel einen Text lesen und dazu im Internet recherchieren. Zusammengefasst wird es auf einem Flipchart, jedoch ohne Worte – nur als Zeichnung. Die anderen Gruppen müssen das Bild erklären. Anschließende Diskussion.","Flipchartpapier, dicke Stifte","GA --> PL","","","","",""],["Pinnwandquiz","","Wiederholung","Transfer","","","","An der Pinnwand hängen Fragen, an einer zweiten Pinnwand hängen die Antwortmöglichkeiten. Jeder TN greift sich eine Antwort und hängt sie zur Frage. Die Gruppe ist verantwortlich für das Gesamtergebnis, Zweifelsfälle werden zuerst diskutiert. Wenn sie der Meinung sind, die Antworten sind korrekt, sagen sie fertig - SL beamt dann die Lösung oder entfernt die nicht korrekten Antworten und lässt neu diskutieren....","Kärtchen mit Fragen und Antworten (in untersch. Farbe), Pinnwände","PL","","","","",""],["Fragerunde","","Erfahrung","Ziele","","","","Jeder TN schreibt eine für ihn aktuelle Frage zum Thema auf einen Zettel. Es kann sich auch um ein Problem handeln. Nun werden die Zettel im Uhrzeigersinn an den jeweiligen Nachbarn weitergegeben, der versucht die Frage zu beantworten, oder einen Lösungsvorschlag zu einem notierten Problem zu machen. Anschließend werden die Zettel wiederum weitergegeben, bis der Kreis geschlossen ist. Hat jeder TN alle Zettel in der Hand gehabt und beantwortet, kehrt der Zettel zu dem TN zurück, das die Frage notiert hat. Die Fragen und Antworten werden im PL vorgelesen. KL schreibt Stichworte auf Flipchart oder Pinnwand mit. Es wäre denkbar, die Gruppe an dieser Stelle durch eine Punktbewertung entscheiden zu lassen, welche Frage oder welches Problem sie weiterbearbeiten wollen.","Papier","GA4-6 --> PL","Gruppentische","","","",""],["Schlüsselbund","","Kennen lernen","","","","","Jeder TN nennt seinen Namen und zeigt seinen Schlüsselbund. Dann erzählt er etwas zu ausgewählten Schlüsseln / zu Anhängern... (Vielleicht nicht Sitz-Reihenfolge, sondern thematisch anschließen.)","Schlüsselbund","PL","Sitzkreis","","","",""],["SMS","","Feedback","","","","","Die TN schreiben zum Abschluss eines Lernabschnitts eine fiktive SMS von max. 11 Wörtern an eine ihnen bekannte Person. Die SMS wird nicht wirklich verschickt, sondern auf Papier festgehalten. Die SMS wird abschließend vorgelesen oder einfach nur eingesammelt und am nächsten Tag kurz kommentiert.","AB / Papier","EA (--> PL)","","sms_an_lehrer_hessen.JPG","","",""],["Wandspeicher","","Erwartung","Feedback","Ideen","","","Während der gesamten Kursdauer können die TN Ideen, Klagen und Probleme auf Flipchart-Flächen festhalten. Für jede Kategorie wird ein Platz reserviert z.B. Ideen, Sachbeiträge, Klagemauer, Probleme …","Flipchart","EA","Post-its","","","",""],["Fragen aus dem Topf","","Kennen lernen","","","","","Jeder TN stellt sich kurz vor (z.B. Name, Land, Schule) und zieht noch 2-3 Fragen aus den Topf und beantwortet diese neben der normalen Vorstellung.","Kärtchen, Hut / Topf / Schachtel / Korb","PL","Sitzkreis","fragen_aus_dem_topf_AB.doc","","",""],["Wer hat die meisten...?","","Kennen lernen","Aktivieren","Wahrnehmung","","Bewegung","TN gehen zur Musik im Raum herum und beobachten andere hinsichtlich bestimmter Fragen, z.B.: Wer hat die längsten Haare, wer hat die größten Füße, wer hat die meisten roten Sachen an, wer hat die größten Ohren? Bei Musikstopp müssen die TN der ausgesuchten Person die Hand auf die Schulter legen und den Namen sagen.","","PL, Musik","freier Raum","","","",""],["Als ich noch ein Kind war","","Kennen lernen","","","","","Jeder TN nimmt ein Kinderfoto mit. Jeder TN steckt sein Foto in einen Umschlag. Anschließend versammeln sich alle im Raum und gehen umher, wobei sie die Umschläge tauschen, wenn sie einander begegnen. Auf das Zeichen des SL öffnet jeder seinen Umschlag und versucht das Foto richtig zuzuordnen, d.h. dem Eigentümer zu übergeben. Wer sein Foto zurückbekommen hat, setzt sich damit an den Spielfeldrand. Das Spiel geht solange weiter, bis jeder sein Foto zurück bekommen hat. Dann erzählt jeder TN kurz von sich und von den wichtigsten Erlebnissen in seiner Kindheit.","Kinderfotos von den TN, Briefumschläge","CP --> PL","freier Raum, Sitzkreis","","","",""],["Teilnehmergalerie","","Kennen lernen","","","","WWW","Vor einer Lehrerfortbildung gestaltet der SL eine Galerie auf der Kommunikations- oder Lernplattform, die allen TN zugänglich ist. Dort stellt sich der SL vor (mit Foto / Fotocollage zur Arbeitssituation und zur Person). Die TN stellen von sich auch ähnliches in die Galerie ein. Im Seminar sollten Fotos und Daten ausgedruckt oder als Wandbilder vorliegen. Die Daten lassen sich später ergänzen.","Fotos, Lernplattform --> Klassenraum","EA --> PL","online-Phase + PL","","","",""],["Namensalphabet","","Kennen lernen","Namen lernen","","","","Die TN sitzen oder stehen im Kreis und nennen der Reihe nach ihren Namen. Die Gruppe soll sich in alphabetischer Reihenfolge im Kreis zu ordnen. Dabei darf nicht mehr gesprochen werden. (Vor dem Start den ersten Stuhl markieren.) Das Ergebnis wird durch eine neue (laute) Namensrunde überprüft und so lange korrigiert, bis da die Anordnung stimmt. Bemerkung:","","PL","Sitzkreis","","","",""],["Der Detektiv von Emmelsbüll","","Kennen lernen","Wahrnehmung","","","","Die TN bekommen den Steckbrief. Der KL erzählt, dass sie unter mysteriösen Umständen verschwunden sind und durch den Detektiv von (Name des Seminarortes) gesucht werden. Sie sollen dem Detektiv Hinweise darauf geben, wie er sie finden kann. Die (anonymen) Steckbriefe werden eingesammelt und neu verteilt. Jeder liest die Antworten vor, und rät, welche Person den Steckbrief geschrieben hat. Wenn die Antwort stimmt, soll die Person sich melden (aufstehen, noch einmal den Namen sagen. Wenn nicht, bleibt sie still und die Gruppe rät weiter.","Steckbriefe","EA --> PL","Sitzkreis","detektiv_von_emmelsb_ll.jpg","","",""],["Bewegungsanweisung","","Gruppenbildung","Aktivieren","Wahrnehmung","","Bewegung","Jeder TN zieht eine Karte mit einer Bewegung (rechte Hand heben, mit dem Kopf wackeln, auf dem linken Bein hüpfen, rückwärts laufen...), merkt sich die Anweisung und gibt die Karte zurück. Musik anspielen, jeder tanzt los. Auf ein Kommando macht jeder TN die Bewegung auf der Karte und versucht schnell die Person/en zu finden, die die gleiche Bewegung zu machen und sie treffen sich dann an einem der Gruppentische / sie setzen sich irgendwo zusammen.","Musik, Kärtchen, Signal (Tröte, Kingel - oder Musik einfach sehr laut drehen)","CP","freier Raum","","","",""],["Der geheime Freund","","Gruppendynamik","Wahrnehmung","Aktivieren","","","In einem längeren Seminar: Jeder TN zieht den Namen eines anderen TN-s. Seine Aufgabe ist, sich um diesen TN zu kümmern, ihm nette Überraschungen zukommen zu lassen, schriftliche Botschaften (Lob, konstruktive kritische Rückmeldungen) zu senden. Jeder spekuliert natürlich, wer sein geheimer Freund ist - wenn jemand einen Verdacht hat, kann es zu Tagesanfang / am Tagesende sagen. Nur in Gruppen spielen, in der die Gruppenatmosphäre stimmt, nix ist doofer, wenn nicht alle einen \"aktiven\" und netten geheimen Freund haben....","Namenskärtchen","","","","","",""],["Magnete","","Aktivieren","Kennen lernen","","","Bewegung","Die TN gehen ungezwungen im Raum umher. Der SL fordert sie auf: „Greift nach jemandem, der etwas Rotes anhat.“ Wenn ein TN jemandem, der etwas Rotes trägt, greift er ihn und beide erstarren in ihrer Bewegung. Es können durchaus mehrere TN nach  demselben TN greifen. Sind alle Spieler erstarrt, stellen sich die „roten“ TN vor. Der SL gibt eine neue  Vorgabe, und das Spiel beginnt von Vorne. (... der Ohrringe trägt, der längere Haare hat als du, der Jeans anhat, mit dem du heute noch nicht  gesprochen hast, ...)  Das Spieltempo sollte lebhaft sein, so dass alle in Bewegung sind.","Musik","PL","freier Raum","","","",""],["Ellenbogenschütteln","","Aktivieren","Namen lernen","","","Bewegung","Die TN zählen durch - bis 3. Die „Einser“ legen beide Hände hinter den Kopf, alle „Zweier“ auf die Schultern und alle „Dreier“ auf die Hüften. Die TN gehen dann im  Raum umher, begrüßen die anderen mit einem freundlichen „Guten Morgen, (Vorname)!“  und berühren einander dazu an den (gespreizten) Ellenbogen","lebhafte Musik","CP","freier Raum","","","",""],["Wischi-Waschi","","Aktivieren","Konzentration","","","","http://www.managerseminare.de/kamelvideo/wischi_waschi.wmv - einfach schauen und nachmachen...","","PL","","","","",""],["Mongolischer Armtanz","","Aktivieren","Konzentration","","","","http://www.managerseminare.de/kamelvideo/mongolischer_armtanz.wmv","mongolische Musik","PL","Stehkreis","","","",""],["Ali baba","","Aktivieren","Konzentration","","","","http://www.managerseminare.de/kamelvideo/alibaba.wmv - Alle sitzen im Kreis. Alle sprechen gemeinsam „Ali Baba und die 40 Räuber, Ali Baba und die 40 Räuber, usw. ..“. Dadurch entsteht ein gemeinsamer Sprechrhythmus. In jeder Ali-Baba-Abfolge macht der Trainer eine andere Bewegungsabfolge vor (z.B. Bogen dehnen, Aufstehen, sich um-schauen, Schlüssel ins Schloss usw.). Diese Bewegung wird in der nächsten Runde vom linken Nachbarn übernommen und wandert pro Runde eine Person weiter. Jeder TN muss in jeder Runde beobachten, was macht mein rechter Nachbar und diese Bewegung in der nächsten Runde nachmachen. So dass nach einiger Zeit jeder TN eine andere Bewegung macht. Meist geht alles irgendwann völlig schief, manchmal aber auch erfolgreich zu Ende. Beides bereitet meist Freude!","","PL","Sitzkreis","","","",""],["Kabinettsitzung","","Kennen lernen","Aktivieren","Gruppenbildung","","","Die TN machen eine Namenskarte und schreiben darauf einen ungewöhnlichen Posten (z.B. \"Minister für ...dicke Luft\", \"Minister für...die Abschaffung von Montagen\"...). Jeder stellt sich vor und erklärt kurz, was er auf diesem Posten Wertvolles machen würde. (Später kann man die Karten auch für \"Koalitionsbildung\" -> Gruppenbildung nutzen.)","leere Karten zum Aufstellen. (Idee nach Machtprobe, Kartenspiel von www.bpb.de)","EA --> PL","","","","",""],["Gegen die Wand","","Wahrnehmung","Konzentration","","","","Die Gruppe stellt sich an einer Linie in etwa 4m Entfernung von einer Wand auf. Jeder TN erhält einen Gegenstand (Stein o.ä.). Der Reihe nach gehen die Spieler mit geschlossenen Augen auf die Wand zu und versuchen, ihren Gegenstand so nah wie möglich an der Wand auf den Boden zu legen. Wer die Augen öffnet, oder die Wand berührt, wird disqualifiziert. Wer seinen Gegenstand am nächsten zur Wand ablegen konnte, gewinnt.","Steine / kleine Gegenstände, evlt. Kreide / Tesakrepp für die Markierung","PL","großer Raum","","","",""],["Klangschale","","Konzentration","Einstieg","","","Ritual","KL lässt die Klangschale anklingen, TN schließen die Augen und bleiben ruhig, bis der Klang wieder ausklingt.","Klangschale","PL","","","","",""],["Eisscholle","","Aktivieren","Kooperation","Gruppendynamik","","","Die TN (Pinguine) stellen sich auf die Papierbahn (Eisscholle). Sie dürfen die Eisscholle nicht verlassen. Das Eis schmilzt (KL reißt immer etws vom Papier ab), die Pinguine müssen zusammenhalten und möglichst viele Pinguine auf dem Eis behalten.","lange Papierbahn, doppelt, oder Zeitungspapier / Flipchartpapier / Packpapier zum Bespannen der Pinnwand","PL","freier Raum","","","",""],["Willkommen, Vielfalt!","","Kennen lernen","Gruppendynamik","Aktivieren","","","Alle stehen in lockerer Runde. SL begrüßt nun verschiedene Personengruppen. Die Begrüßten treten in die Mitte oder winken und alle anderen applaudieren. (Kräftig mitapplaudieren, ruhig übertreiben!) Jetzt folgt nach diesem Prinzip viel Beifall für die verschiedensten Eigenschaften und Wünsche (auch solche, die man nicht hat). Die Fragen werden  auf die Gruppe abgestimmt und ein wenig auf das Thema des Seminars. Nach den ersten Begrüßungen durch das Team können die TN selbst Begrüßungen aussprechen. Wichtig ist, dass wirklich jede/r mal begrüßt wurde, ggf. werden dafür zusätzliche Fragen entwickelt. alle, die im (Sommer) Geburtstag haben; alle Frauen; alle, die Kinder haben; alle RaucherInnen; alle, die mit dem Zug gekommen sind; alle, die keinen Kaffee trinken; alle, die aus (Südamerika) kommen; alle, die schon mal gestreikt haben; alle, die mehr als eine Sprache sprechen können.... Nach der Aktivität keine Auswertung, um in der Applausstimmung zu verweilen.","","PL","Stehkreis","","","",""],["Lebenslinie","","Kennen lernen","","","","","Die TN finden sich in Paaren zusammen, die sich möglichst noch nicht (so gut) kennen. Jede Person zeichnet ihre / seine Lebenslinie auf einen Papierstreifen. In  diese Lebenslinie sollen nun Situationen im eigenen Leben eingetragen werden. Danach stellen sie ihrem Partner vor, was sie über ihre Lebenslinie mitteilen möchten. Auf die Lebenslinie können wichtige Ereignisse (Geschwister, Wohnortwechsel, Schule, Reisen, Ausbildung, Bundeswehr / Zivildienst, Beruf, Studium) und Personen, Stolpersteine, Hügel, Täler, Schluchten, Kurven, Kreuzungen... eingetragen werden. Für  Planungen und Erwartungen in der Zukunft kann die Strasse über das Heute hinaus verlängert werden. Die Lebenslinien werden dann im Seminarraum an die Wände gehängt und können als Galerie von allen betrachtet und bei Fragen kommentiert werden (oder: nach Parallellen suchen). Auswertung: Welche Ereignisse sind für mein Leben und das von anderen wichtig? Wo gibt es bedeutsame Unterschiede in den Lebenslinien in der Gruppe? Was macht die besondere eigene Perspektive aus und gibt es dafür Gründe in den Biographien?","gleich lange Papierstreifen für alle, Pinnwand, dicke Stifte","EA --> PA --> PL","","","","",""],["Mit anderen Augen","","Kennen lernen","","","","","Die TN teilen arbeiten in Kleingruppen. Sie werden gebeten, jeweils in die Rolle von 4 Personen zu schlüpfen, die sie kennen und darin zu erzählen, wie sie von diesen Personen (Eltern, Freunde, Kollegen, Nachbarn, Schüler...) gesehen werden. Jedes Mal, wenn sie aus einer anderen Perspektive erzählen, sollen sie den Sitzplatz wechseln.  Danach schreiben die TN die Antwort auf die Fragen: „Was haben wir aus den Perspektiven der 4 Bezugspersonen über die anderen erfahren, was wir sonst nie gehört hätten?“","Plakat / Kärtchen - Pinnwand","GA3-4 --> PL","","","","",""],["Tortogramm","","Kennen lernen","","","","","Die TN sammeln zuerst die Gruppen, zu denen sie gehören, um sie dann je nach unterschiedlicher Bedeutung für das eigene Leben in unterschiedlicher Größe in Tortenstücke in einem Kreis einzutragen. (Das Team kann sich zuerst selbst vorstellen, Familie (Bruder, Tochter, Enkelkind, Einzelkind), weitere Gruppenzugehörigkeiten (Geschlecht, Religion, etc.), Berufsgruppen, Freizeitgruppen (Musikgruppe, Schwimmverein). Die TN arbeiten mit einem Partner zusammen, und besprechen ihre Diagramme. Hierbei können Gemeinsamkeiten in gleichen Farben schraffiert werden. Anschließend können Gemeinsamkeiten und Unterschiede der Gesamtgruppe präsentiert werdern. Auswertung: Wie viele Gruppen und welche hattet ihr gemeinsam? Wie viele Gruppen und welche waren unterschiedlich?  Welchen Gruppen gehört ihr gerne an, welchen ungern? Warum? Wie wichtig sind die unterschiedlichen Gruppenzugehörigkeiten für euch?","Papier, Stifte, Buntstifte","EA --> PA --> PL","","","","",""],["Acht Nomen","","Kennen lernen","","","","","TN schreiben auf einem Papierstreifen 8 Nomen auf, stellen sich damit vor und kommentieren, warum sie diese ausgewählt haben.","Papierstreifen, dicke Stifte, Pinnwand","PL","","","","",""],["Namen klopfen","","Kennen lernen","Namen lernen","Konzentration","","","Die TN sitzen im Kreis. Der erste TN berührt die Schulter von seinem rechten Nachbarn und sagt seinen Namen... usw. Der Kreis endet, wenn der linke Nachbar die Schulter von dem esten Spieler berührt wird. Der KL nimmt die Zeit. Ziel ist, den Kreis noch schneller zu schaffen. Bei den nächsten Versuchen die Sitzordnung ändern!","Stoppuhr","PL","Sitzkreis","","","",""],["Namensecho","","Kennen lernen","Namen lernen","","","","Alle stehen in einem Kreis. Die/der Spielleiter/in beginnt, indem sie ihren Namen ruft und dabei eine - evtl. für sie typische - Bewegung macht. Der/die nächste wiederholt diese Selbstdarstellung und schließt ihre/seine eigene an, so dass folgender Ablauf entsteht: „Claudia“ (Bewegung), „Rolf“ (Bewegung), „Lisa“ (Bewegung) usw. Ist das „Echo“ wieder bei der/dem Spielleiter/in angekommen, ist das Spiel beendet. (Geht auch gut im FSU mit Anfängergruppen.)","","PL","Stehkreis","","","",""],["Atomverbund","Atome","Kennen lernen","Aktivieren","Gruppendynamik","","Bewegung","Die TN laufen locker durch den Raum. KL nennt nacheinander Kriterien, nachdem sich Untergruppen zusammenfinden sollen: z.B. unterrichten die gleiche Altersgruppe, unterrichten in ähnlichen Institutionen, haben die gleiche Zahl von Geschwistern, haben das gleiche Lehrwerk, haben die gleiche Schuhgröße).... Geht auch mit Musik - wenn die Musik stoppt, kommt das neue Kriterium.","Musik","PL","freier Raum","","","",""],["Bären-Interview","","Kennen lernen","","","","","Die TN interviewen einander (mit oder ohne vorbereiteten Fragen). Der Interviewte soll im Interview unauffällig eine falsche Information sagen (ihm einen Bären aufbinden). Der Interviewer stellt ihn dann im Plenum vor und stellt Vermutungen an, was nicht stimmen könnte.","evtl. Fragebogen","PA --> PL","","","","",""],["Mittelpunktspiel","","Kennen lernen","Aktivieren","Diskussion","","Bewegung","Die TN stehen im Kreis, in die Mitte ist eine bunte Karteikarte gelegt. Der KL sagt nacheinander Kriterien (ich esse am liebsten exotisch, ich mach jeden Tag Sport, ich arbeite gern mit Hörtexten...) oder Thesen (ohne Vokabelheft können die L nicht lernen, authentische Texte kann man nur ab B1 einsetzen, ein Lehrer muss auch ein guter Schauspieler sein, ohne Noten würden die Schüler gar nicht lernen...). Je mehr die Aussage auf die TN zutrifft oder je mehr er mit der These einverstanden ist, geht er näher zum Mittelpunkt zu.","bunte karteikarte (rund)","PL","Sitzkreis","","","",""],["Smarties und Storys","MMM-Orakel","Kennen lernen","Erfahrung","","","","Eine Packung Smarties (oder Gummibärchen) gehen herum. Jeder TN kann 1-5 nehmen - für jedes Stück muss er aber nachher etwas über sich erzählen / eine interessante Story / ein interessantes Beispiel auf die Fragestellung / ein Argument... nennen.","Smarties, Gummibärchen o.ä.","PL","","","","",""],["Gruppen schätzen","","Kennen lernen","","","","","TN schätzen (zu zweit oder in Kleingruppen) ein, wie viel von bestimmten Sachen die Gruppe insgesamt hat (wie viel Kinder? wie viel Jahre Unterrichtserfahrung? wie viel Wochenstunden? Haustiere? Entfernung vom Wohnort und Seminarort in km? ...) Sie geben ihre Tipps ab - und danach wird gerechnet: Jede Gruppe übernimmt 1-2 Aspekte und führt eine schnelle Umfrage durch.","AB","PA / GA","","","","",""],["Zahlen-Interview","","Kennen lernen","","","","","Die TN befragen einander mit einem Partnerinterview-Fragebogen, der ausschließlich nach Zahlen in ihrem Leben fragt. (Am Ende vergleichen: ähnlich? Unterschiedlich?)","AB","PA --> PL","","zahlen_interview.pdf","","",""],["Einzigartig","","Kennen lernen","","","","","Die L sitzen im Kreis, einer fängt an und sagt etwas, von dem er denkt, dass er der einzige ist, der das heute (oder sonst wann) gemacht hat. Z.B. \"Ich bin die einzige, die einen großen, roten Plüschbären hat\". Wenn jemand anderes das gleiche auch hat, dann muss der erste solange weiter versuchen, bis er der einzige ist, danach ist der nächste dran.","","PL","Sitzkreis","","","",""],["Das doppelte Lottchen","","Kooperation","","","","","Zwei TN sitzen mit dem Rücken aneinander auf dem Boden. Nach dem Startkommando des Spielleiters versucht jedes doppelte Lottchen, sich gemeinsam vorwärts zu bewegen und dabei so weit wie möglich zu kommen, ohne seine Rücken-an-Rücken-Haltung je aufzugeben. Gar nicht so leicht, aber lustig und dabei vertrauensbildend, denn jeder Mitspieler muss sich auf seinen Partner einstimmen und verlassen können. Nur so kann das doppelte Lottchen weit kommen. Nach einer kurzen Übungsphase markiert der Spielleiter eine Zielgerade und legt die Spielregeln fest: Die Paare, die auch nur kurz ihre Rücken-an-Rücken-Haltung aufgeben, scheiden aus.","","PA","","","","",""],["Morphologischer Kasten","","Ideen","","","","","Die beschreibenden Parameter eines Problems auf der einen Achse und die Varianten dieser Parameter auf der anderen Achse einer Matrix festhalten. Aus der Kombination dieser Varianten ergeben sich verschiedene Lösungen, die auf Brauchbarkeit überprüft werden.","Papier / Packpapier","PA / GA --> PL","","morph_kasten_bsp.jpg","","",""],["Klatsch Pro Klatsch Contra","","Diskussion","","","","","A muss zu einem vorgegebenen Thema argumentieren und zwar zunächst „pro“ und - wenn B klatscht - dann „contra“ zu  demselben Thema. Je schneller und häufiger B klatscht, desto schneller muss A die  Perspektive wechseln. Nach 5 Minuten die Rollen tauschen (B argumentiert, A klatscht).  Die Themen können ernsthaft oder lustig sein.","","PA","","","","",""],["Klatschwelle","","Aktivieren","Konzentration","","","","Im Kreis stehend: B geht in die Hocke, A klatscht mit beiden Händen an die Hände von C über  B. So geht es im Kreis weiter. Nach etwas Übung können mehrere Wellen hintereinander  laufen.","","PL","Stehkreis","","","",""],["Hochstapler","","Kennen lernen","Aktivieren","DaF Sprechen","DaF HV","","Jeder sitzt auf einem Stuhl im Kreis. Nun stellt einer nach dem anderen eine Frage an die Gruppe, die mit Ja oder Nein beantwortet werden kann, zum Beispiel: Bist du Linkshänder? Hast du eine Schwester? ... Wer auf diese Frage mit Ja antworten kann, rückt auf den Stuhl zu seiner rechten Seite, wer Nein antworten muss, bleibt sitzen. Wenn auf dem Stuhl zur Rechten schon jemand sitzt, dann setzen sie sich einfach auf dessen Schoss. Derjenige, der unter jemandem sitzt, ist fürs Stapeln solange gesperrt, bis keiner mehr auf seinem Schoss sitzt. Das Fragespiel geht solange weiter, bis jemand wieder auf seinem eigenen Stuhl sitzt.","evtl. eine Liste mit Fragen","PL","Sitzkreis","","","",""],["Tach, Madame!","","Aktivieren","Konzentration","","","","Die Karten werden gleichmäßig verteilt (was übrig bleibt, kommt zur Seite), bleiben aber vor allen verdeckt liegen. Nun deckt nacheinander jeder TN eine Karte auf, so dass sie alle die Karte gleichzeitig sehen können. Nun müssen möglichst schnell bestimmte Bewegungen/Ausrufe zu jeder Karte gemacht werden. Wenn alle dies machen, bleibt die Karte liegen und der nächste TN ist dran. Wer dies nicht oder wesentlich später als alle anderen macht, oder etwas ganz anderes, der bekommt den Kartenstapel der Mitte. Er ist dran mit Auslegen. Wer als erster seine Karten ausgelegt hat gewinnt.  7 - keine Reaktion 8 - beide Daumen seitlich an die Stirn, mit den Fingern wackeln 9 - zweimal klatschen 10 - einmal kurz aufstehen Bube - militärisch grüßen Dame - „Tach Madame“ ausrufen König - so tief neigen, dass die Stirn den Tisch berührt As - die Spielrichtung wird geändert","Spielkarten (Skat)","GA","","","","",""],["Schlüsselkönig","","Namen lernen","Aktivieren","Auflockern","","","Wenn die TN die Namen schon kennen: Alle TN sitzen im Kreis, der KL steht in der Mitte. Für ihn ist kein Stuhl frei. Er geht auf einen der TN zu, gibt ihm die Hand und sagt: „Guten Abend, Monika!“. Nun gehen beide auf andere Mitspieler zu und begrüßen sie. Auch diese stehen auf und begrüßen wieder andere, bis alle Spieler unterwegs sind. Dann lässt der KL den Schlüsselbund geräuschvoll auf die Erde fallen und alle suchen sich einen Stuhl. Wer übrig bleibt, hebt den Schlüsselbund auf und beginnt von neuem. (Eignet sich auch dazu, die Sitzordnung zu verändern :-)","großer Schlüsselbund","PL","Sitzkreis","","","",""],["Rate, rate, was ist das?","","DaF WS","","","","Rätsel","„Rate, rate, was ist das? Es ist kein Fuchs und ist kein Has! Es ist braun (und dick)!“ sagt ein Spieler. Die anderen TN raten, welches Tier (Bildkarten oder Gegenstand benutzen) es sein könnte. Das Tier oder der Gegenstand muss für alle sichtbar sein.","","PL","","","","",""],["Plus, minus","","DaF WS","","","","","Zahlen üben: Jeder TN darf neunmal würfeln, die Würfe werden abwechselnd addiert und subtrahiert. Der erste Wurf ist beispielweise eine 5, der zweite eine 4, das wäre dann 5+4=9. Der dritte Wurf (nehmen wir an, es war eine 2) würde dann von der Neun abgezogen 5+4=9-2=7, etc. Wer nach neun Würfen die meisten Punkte hat, hat gewonnen. Um die Zahlen zu üben, soll jeder TN auf Deutsch laut mitrechnen!","Würfel","GA / PA","","","","",""],["Tatütata","","Auflockern","","","","","Richtig albern. Alle TN stehen im Kreis, ein TN / der KL hat einen Würfel (am besten groß), alle TN müssen folgende Bewegungen bei der gewürfelten Zahl ausführen: 1 = alle heben ein Bein; 2 = alle heben zwei Beine; 3 = alle heben zwei Beine und einen Arm; 4 = alle heben zwei Beine und zwei Arme; 5 = alle heben zwei Beine und zwei Arme und strecken die Zunge in die Luft; 6 = alle stehen auf und machen ein Feuerwehrauto nach.","Würfel","PL","Stehkreis","","","",""],["Abfallmontage","","DaF Schreiben","","","","","Einen Artikel aus einer Zeitung oder einer Zeitschrift auswählen und in verschiedene Bestandteile (Sätze, Teilsätze, Wörter...) zerschneiden. Alle Bausteine mischen und in einen Umschlag stecken. Jeder L zieht eine (vorher festgelegte oder selbst bestimmte) Anzahl von Schnipseln und muss aus diesen Elementen eine Geschichte schreiben.","Artikel aus der Zeitung, zerschnippelt","EA / PA","","","","",""],["Antwortgedicht","","DaF Schreiben","","","","","Zwei L wählen ein Gedicht aus, schneiden einen Teil ab und setzen beide (unabhängig voneinander) an dieser Stelle das Gedicht fort. Am Ende alle drei Versionen aushängen und in der Gruppe raten lassen, welches Gedicht von wem stammt.","Gedicht","PA","","","","",""],["Abkürzungen verfremden","","DaF Schreiben","DaF Grammatik","","","","Für Fortgeschrittene (oder kombiniert mit Wörterbucharbeit): Bekannte internationale Abkürzungen oder solche aus dem deutschsprachigen Raum verfremden: ADAC = achtlos, diese Auto-Chaoten! SOS = Seepiraten ohne Schiff BASF = bestimmt arbeiterfreundliche Sockenfabrik... Hinterher kann die Aufgabe sein, die Originalwörter im Internet zu suchen. Gute Quelle für Abkürzungen aus Deutschland: das Lied MfG von den Fantastischen Vier.","Liste mit Abkürzungen","PA / GA","","","","",""],["Blitzdiktat","","DaF Schreiben","","","","","Den Text auf eine Overhead-Folie schreiben und dabei jeden Satz in einer neuen Zeile beginnen.  Der KL legt die Folie auf den Overhead, zeigt den ersten Satz, deckt ihn nach kurzer Zeit ab und die L schreiben ihn aus dem Kopf auf….","OHP-Folie oder PPP, OHP","EA","","","","",""],["Büchsendiktat","","DaF Rechtschreibung","Input","","","","Sätze eines zusammenhängenden Textes werden einzeln auf Papierstreifen geschrieben, nummeriert und einzeln in Büchsen / Pappbechern... gesteckt. Die Lernenden arbeiten in PA: Ein L greift in eine Büchse, liest einen Satz, merkt sich den Satz und die Nummer, diktiert dem Partner den Satz. („Nr. 9 heißt: Dazu hatte ich keine Lust....“). Eine Büchse kann mehrmals „geöffnet“ werden, wenn sie nicht mehr sicher sind, ob sie es richtig haben.  Dadurch wird gleichzeitig Wörter wiedererkennen, Rechtschreibung und Hören / Sprechen (Aussprache und Intonation) geübt und es ist auch ein gutes Gedächtnistraining!","Text auf Papierstreifen, pro Streifen eine Büchse / Pappbecher","PA","Büchsen etwa gleich weit von allen Paaren auf dem Tisch platziert","","","",""],["Cocktailparty-Diktat","","DaF Rechtschreibung","","","","Bewegung","Man nehme ... einen interessanten, witzigen Text und zerschneide ihn in Sätze. Jeder L hat einen Satz, den er sich zunächst merkt: Nicht nur den Text, sondern auch, wie er geschrieben wird. Auf einem Arbeitsblatt (Raster mit Nummern – so viele Zeilen, wie Sätze, genug Platz zum Reinschreiben) werden jetzt die fehlenden Textteile gesammelt:  Die L gehen mit einer Klemmmappe herum und diktieren einander die Texte. Sie dürfen nicht sehen, wie der andere den Text schreibt, sollen aber helfen, wenn der Schreibende Fragen stellt. Der Text wird auch selbstständig korrigiert, jeder bekommt den Originaltext.","Sätze auf Papierstreifen, irgendein Behälter (in 3-4 Ex. für die Gesamtgruppe)","CP","","","","",""],["Diktat mit Nonsenswörtern","","DaF Rechtschreibung","DaF LV","","","","Ähnlich wie beim Lückendiktat arbeiten wir auch an einigen ausgewählten Wörtern / fokussieren wir auf einige Rechtschreibprobleme. Die L bekommen einen Text mit einigen Nonsenswörtern (anstelle der problematischen Wörter, an denen wir arbeiten wollen.) Der Lehrer diktiert den Text, die L müssen die Wörter, die sie nicht hören, streichen und die richtigen Wörter in den Text schreiben.","AB","EA / PA","","","","",""],["Faltgeschichte","","Einstieg","DaF Schreiben","","","","Nach dem beliebten Schülerspiel: Auf ein Blatt die Antwort auf eine Leitfrage nach dem W-Fragen-Prinzip (Wer? Wann? Wo? Wie? Mit wem? Warum? Was gemacht hat? Mit welchen Folgen? o. ähnlich) schreiben, Blatt umknicken und nach links / rechts weitergeben. Antwort auf die nächste Frage notieren... usw. Am Ende den Zettel in der Hand vorlesen oder eine komplette Story / Zeitungsnachricht mit den Informationen schreiben.","ein Blatt pro TN","EA / PA","","","","",""],["Fotoroman","","DaF Schreiben","Abschluss","Evaluation","","","Die L bringen Fotos mit / machen gezielt Fotos / speichern Fotos aus dem Internet, ordnen sie zu einer Story und schreiben dazu kleine Texte oder Sprech- und Gedankenblasen. Funktioniert auch als Rückschau im Seminar","Fotos / alte Zeitschriften / Bilder aus dem Internet, Klebestifte, Papier / PC mit einem einfachen Grafikprogramm","PA / GA","","","","",""],["Gedichtpuzzle","","Einstieg","DaF LV","DaF Schreiben","","","Ein unbekanntes interessantes Gedicht zeilenweise auf Papierstreifen schreiben, die L setzen daraus ihre eigenen Gedichte zusammen. Der Vergleich mit dem Original führt immer dazu, dass sie ihre eigenen Gedichte viel schöner finden","Gedichtzeilen auf Papierstreifen, Original als LB","PA","","","","",""],["Papstwahl","","Konzentration","Namen lernen","","","","Bei der Papstwahl haben sich die Kardinäle im Stulkreis (oder auf dem Boden sitzend) versammelt, um den neuen Papst zu bestimmen. Es gibt zwei gleich große Gruppen, die jeweils abwechselnd sitzen - ein Platz bleibt frei. Als Erkennungszeichen krempeln sich die einen die Ärmel hoch und die anderen lassen sie unten. Ziel jeder Gruppe ist es fünf Personen der eigenen Gruppe nebeneinander zu setzen. Gespielt wird nach dem Prinzip \"Mein rechter, rechter Platz ist frei ich wünsche mir den ... herbei\". Einziger Haken ist, dass bei jedem Platzwechsel auch die Namen getauscht werden. Wenn Herbert also Klaus neben sich bittet heißt Klaus zukünftig Herbert und Herbert heißt Klaus. Es kommt also darauf an, sich jeden Wechsel zu merken, und so immer einen passenden Namen parat zu haben. Die Gruppe, die als erstes fünf Spieler nebeneinander sitzen hat, gewinnt das Spiel und bestimmt den nächsten Papst.   Alternativen: Bundestag - man muss 5 Abgeordnete der gleichen Partei nebeneinander setzen, um die Regierung zu bilden. König - man muss 5 Ritter der eigenen Adelsfamilie nebeneinander setzen um König zu werden.","Stühle für jeden +1 Stuhl","PL","Sitzkreis","","","",""],["Im Takt gehen","","Konzentration","","","","Bewegung","Für dieses Spiel wird ein Instrument benötigt, mit dem der SL einen Takt vorgeben kann. Die TN sollen sich genau auf den Takt konzentrieren und diesem mit ihren Schritten folgen. Setzt das Taktschlagen aus, müssen alle so stehen bleiben, wie sie waren und dürfen sich nicht bewegen. Der TN, der sich dennoch bewegt, scheidet aus oder gibt etwas als Pfand.","Instrument","","im Freien","","","",""],["Recken, Strecken, Gähnen","","Konzentration","","","","","Die Fenster weit öffen und frische Luft reinlassen. TN auffordern, sich einmal herzlich zu recken, zu strecken und kräftig zu gähnen. Diese Aufgabe entspannt schnell und stellt neue Konzentrationskraft her.","","PL","","","","",""],["Ausmalaufgabe","","DaF Grammatik","DaF WS","","","","\"Ergänze die Sätze. Male das Feld aus, dessen Nummer hinter der richtigen Lösung steht.  Hast du einen Spitzer (d7)  / eine Spitzer (d8)?","AB","EA","","ausmal.png","","",""],["Satzschlange","","DaF Grammatik","DaF WS","DaF Rechtschreibung","","","Alle Wörter der Sätze werden kleingeschrieben und voneinander nicht getrennt. Die S sollen die Wörter trennen und den Satz korrekt niederschreiben. Lernziel: Wörter wiedererkennen. bingoistmeinbesterfreunderwohntjetzteinjahrbeiunsimgartenmeinvaterundichhabeneinenstallgebautdortschläfterwennichausderschulekommenwarteteraufmichundfreutsichäpfelmagbingoganzbesondersgern","","EA / PA","","","","",""],["Drillingspuzzle","","DaF Grammatik","DaF WS","","","Selbstkontrolle","3er-Reihen – drei Wörter, die zusammengehören (z.B. groß-größer-am größten, Ungarn-Ungar/Ungarin-ungarisch...) schreiben wir auf Streifen und zerschnippeln diesen wie Puzzlesteine. Die L suchen die Drillinge – die Verknüpfungselemente helfen bei der Überprüfung.","","","","drillingspuzzle.jpg","","",""],["Drillübung","","DaF Grammatik","DaF WS","","","","Nach einem angegebenen Struktur / Satzmuster werden zu weiteren Wortitems Sätze gebildet.","","","","drill.jpg","","",""],["Einsetzübung","","DaF Grammatik","DaF WS","","","","In Sätze – am besten eingebettet in eine Ministory oder Minidialoge – angegebene Wörter (meist schon in konjugierter Form) einsetzen. Variante: Es gibt mehr Wörter im Angebot als Lücken.","","","","einsetz.png","","",""],["Ergänzungsübung (Satzebene)","","DaF Grammatik","DaF WS","","","","Sätze (meist mit der gleichen Struktur) mit oder ohne inhaltliche Hilfen sinnvoll ergänzen / fortsetzen.","","","","ergaenzung.png","","",""],["Ergänzungsübung (Wortebene)","","DaF Grammatik","DaF WS","","","","Sätze – am besten keine isolierte, sondern kontextualisierte Sätze oder wie im Beispiel zumindest Sätze in sinnvollen Minidialogen – um fehlende Wörter / grammatische Strukturen ergänzen.","","","","erg_w.png","","",""],["Fehlerjagd","","DaF WS","DaF Grammatik","","","Wettbewerb","In einem Text werden Fehler versteckt (das Wort passt nicht in den Satz, es ist falsch geschrieben, die Pluralform ist falsch....). Die Anzahl der Fehler ist unten angegeben – die Schüler sollen die eingebauten Fehler finden. (Am einfachsten eine Schreibfolie drauflegen...) Lösungskontrolle: mit einer weiteren Folie, auf dem bunt bemalte Kästchen die Fehlerstellen markieren.","","","","","","",""],["Kasperlsätze","","DaF WS","DaF Grammatik","DaF Schreiben","","","Drei Stöße von Karten (ca. 5cm x 20cm) mit verschiedenfarbig markierten Rückseiten liegen mit der Rückseite nach oben vor dem L.     1. Stoß: blaue Markierung = Subjekt    2. Stoß: rote Markierung = Prädikat    3. Stoß: grüne Markierung = Objekt Der L dreht je eine Karte in der Reihenfolge blau-rot-grün um und liest, schreibt, diktiert, zeichnet oder spricht den lustigen Satz.","","","","","","",""],["Lernscheibe","","DaF WS","DaF Grammatik","","","Selbstkontrolle","Auf beiden Seiten einer Kreisscheibe sind 15, 18, 20, 24 oder 30 Begriffe so angeordnet, dass sich immer die zueinander gehörenden Paare auf Vorder- und Rückseite gegenüberstehen. Wird die Scheibe in eine geeignete Hülle mit Schlitz verpackt, lässt sie sich sehr gut zum selbstständigen Üben einsetzen.","","","","lerns.jpg","","",""],["Mandala","","DaF Grammatik","DaF WS","","","","Wörter in einer Scheibe finden und mit unterschiedlichen Farben anmalen","","","","mandala.jpg","","",""],["Memory-Spiel","","DaF Grammatik","DaF WS","","","Wettbewerb","Kärtchenset: Auf jeweils zwei Karten werden Wörter geschrieben (Möglichkeiten: Das Wort und ein Bild, das dt. Wort und die Entsprechung in der Muttersprache, das dt. Wort und die Erklärung des Wortes auf dt., Wort und das Gegenwort....). Gespielt wird in Vierergruppen. Ein L deckt zwei Karten auf, sagt laut die beiden Wörter. Wenn sie passen darf er sie behalten und weitere zwei aufdecken. Passen sie nicht, ist der nächste Spieler dran. Gewonnen hat der Spieler, der am Ende die meisten Paare hat.","","","","mem.png","","",""],["Sätze bilden","","DaF GR","DaF WS","","","","Sätze bilden aus nicht konjugierten / deklinierten und ungeordneten Einzelwörtern. Die Wörter werden in Gruppen präsentiert, jede Gruppe muss zu einem sinnvollen und korrekten Satz geformt werden.","","","","s_bilden.png","","",""],["Sätze bilden nach Bildstimuli","","DaF GR","DaF WS","","","","Auf Leitfragen antworten - sinnvolle Sätze bilden nach Bildstimuli:","","","","bilstim.png","","",""],["Sätze bilden (Wörter)","","DaF GR","DaF WS","","","","Sätze bilden zu angegebenen Themen / mit angegebenen Strukturen. Macht am meisten Sinn, wenn die L etwas Konkretes über sich sagen.","","","","wortstim.png","","",""],["Sätze würfeln","","DaF GR","DaF WS","","","","Zu den Augenzahlen werden Wörter / Fragezeichen zugeordnet (Liste), die L würfeln und bilden Sätze. (Auch Nonsenssätze sind zugelassen).","","","","w_rf.png","","",""],["Fragewürfel","","DaF Grammatik","DaF WS","","","","Die Lernenden bekommen Spezialwürfel (aus Karton falten) – oder normale Würfel bekommen Klebepunkte, und darauf schreiben wir Fragewörter.   Das Spielt spielt man in Gruppen. Die Lernenden würfeln und stellen einem beliebigen Gruppenmitglied (oder wenn sie möchten, dann allen) eine Frage, in der das erwürfelte Fragewort vorkommt.   Es wird ein richtiges Spiel und keine bloße Übung, wenn wir die zusätzliche Regel einbauen, dass man nicht Wahrheit sagen muss – der Spieler, der die Frage gestellt, muss entscheiden, ob er dem Mitschüler glaubt oder nicht.","Würfel, Klebepunkte","GA","","fragew_rfel.JPG","","",""],["Satzfächer","","DaF Grammatik","","","","","Beim Satzfächer schreiben wir die Wörter eines Satzes einzeln auf Kärtchen. Die L öffnen das Fächer, ordnen die Streifen in eine Reihenfolge, die einen sinnvollen und korrekten Satz ergibt, und schreiben den Satz in ihr Heft / auf ein Arbeitsblatt.","Satzstreifen aus festem Karton, Musterbeutelklammer.","","","satzf_cher.png","","",""],["Satzschalttafel","","DaF Grammatik","DaF WS","","","","Mehrere Sätze mit der gleichen Satz¬struktur werden in Teile zerlegt, die Teile werden einzeln auf schmale Papierstreifen untereinander aufgeschrieben. In einen anderen quer gelegten Papierstreifen wer¬den Fenster hineingeschnitten – entspre¬chend der Breite der anderen Streifen. Die Papierstreifen werden hineingesteckt. Die L sollen durch verschieben der Streifen grammatisch richtige Sätze machen (ob nur sinnvolle oder auch Quatsch-Sätze zugelassen werden, muss vorab geklärt werden). Die Übung funktioniert auch, wenn dies nur gemalt ist (eignet sich aber weniger zum Ausprobieren). Schöne Beispiele in Deutsch Aktiv Neu!","","","","satzsch.jpg","","",""],["Schüttelsatz","","DaF Grammatik","DaF WS","DaF Schreiben","","","Die Wörter der Sätze sind „geschüttelt“, jedes Item wird durch einen Strich getrennt, der Satzanfang ist markiert. Die L schreiben den Satz richtig. wenn | schüttelt | ich | diesen | Satz | schüttle. | nicht, | mich | es | jetzt | Hoffentlich |","","","","","","",""],["Schwarzer Peter","","DaF Grammatik","DaF WS","","","","Jede Gruppe erhält 33 Spielkarten:  16 Paare (überprüfen, dass es nur eine mögliche Zuordnung gibt!!!) und den Schwarzen Peter. Die Karten werden verteilt. Ein L beginnt und zieht eine Spielkarte vom Nachbarn rechts von ihm. Wenn er ein passendes Paar in der Hand hat, darf er es auf den Tisch legen und vorlesen. Wenn nicht, ist sein Nachbar dran und zieht vom Nachbarn rechts eine Karte usw. Wer am Schluss den Schwarzen Peter hat, hat verloren.","Kartenset","","","schw_p.png","","",""],["Setzleiste","","DaF Grammatik","DaF WS","","","","Die Setzleiste ist ein Vierkantholz, in das zwei schräge Rillen eingefräst sind – in diese Rillen stecken die L die Aufgabenkarten. Auf den Setzleistenkarten stehen jeweils eine oder mehrere Aufgaben, deren Lösungen unterhalb des Striches stehen. Denkbar auch für das Bauen von Wörtern aus Einzelsilben.","Setzleiste, Karten","","","setzleiste.jpg","","",""],["Sortierbrett","","DaF Grammatik","DaF WS","","","","Beim Sortierbrett werden Wortkarten nach angegebenen Prinzipien (Wortart? Artikel? Thema? Pluralbildung?...) sortiert und eingehakt. (Montessori)","Sortierbrett / Brett mit Markierungen oder Fächern","","","sortierbrett-klein.jpg","","",""],["Wachsender Satz","","DaF GR","DaF WS","","","","Ein L sagt einen einfachen Hauptsatz. „Ich schlafe.“ Der Partner erweitert den Satz um ein weiteres Element. „Ich schlafe im Matheunterricht....“ – so lange, bis sie Ideen haben. Dann zählen sie, wie viele Elemente sie einbauen konnten und schreiben den Satz für sich auf (dabei checken sie, ob die Reihenfolge der Satzergänzungen auch stimmt.) Jedes Team kann seinen Rekordersatz vor der Klasse präsentieren. Einfacher: Satz nach angegebenen W-Fragen nach und nach ergänzen. Variante: Ausgangspunkt das erste Wort des Satzes.","","","","","","",""],["Wort und Zahl","","DaF WS","","","","Kettenübung","Der erste Mitspieler nennt ein Wort und eine Zahl. Zum Beispiel :\" Fernseher und 4\" . Nun muss der nächste, oder der vom ersten Spieler genannte Schüler ein Wort finden, dass mit dem Buchstaben \"N\" anfängt,\" Nudeln und 2\". Der sagt nun z.B. :\" Untergrundbahn und 6\" usw.. “G.....”  Funktioniert auch gut als Partnerspiel.","","","","","","",""],["Würfeln und konjugieren","","DaF Grammatik","","","","","Ein Spielfeld mit bekannten Verben vorbereiten. Die L spielen in Gruppen. Ein L würfelt, zieht mit seiner Spielfigur entsprechend der Augenzahl auf ein Verb. Dann bildet er mit der Augenzahl die richtige Verbform. Z.B. 3-  zieht drei Felder vor auf das Verb spielen und sagt: er / sie spielt. In Zweifelsfällen kontrollieren sie sich mit einem Kontrollblatt. Ist die Form nicht korrekt, so muss der Spieler 3 Felder wieder zurück. Gewonnen hat der, der als Erste(r) das Ziel erreicht.","Spielfeld, Würfeln","","","","","",""],["Zuordnungsübung mündlich","","DaF GR","DaF WS","DaF Sprechen","","","Sätze, die Paare bilden - Frage – Antwort, Früher – Heute (GR), Aktiv – Passiv... als getrennte Liste in zwei Gruppen geben. Ein L aus Gruppe A liest vor – jemand aus Gruppe B sagt schnell den passenden Satz aus ihrer Liste.","Listen AB","PL","","","","",""],["Mogeln","","DaF Grammatik","DaF WS","DaF Sprechen","","","Die Karten müssen immer in der Folge der Wochentage verdeckt abgelegt werden.  Auf der Karte: Wochentag + eine Aktivität (Dienstag – früh aufstehen) Spieler 1: \"Ich bin am Dienstag früh aufgestanden.\" Spieler 2: \"Ich habe am Mittwoch Suppe gekocht.\" Hat ein Spieler keine passende Karte, muss er mogeln, d.h. lügen. Alle anderen dürfen kontrollieren. Wird ein Spieler beim \"mogeln\" erwischt, muss er alle abgelegten Spielkarten nehmen und darf neu beginnen. Wird ein Spieler kontrolliert, hat aber die Wahrheit gesagt, muss der \"Kontrolleur\" alle abgelegten Spielkarten nehmen und darf neu beginnen.\"","36 Karten.  5 Karten zu jedem Wochentag und einen Joker","GA","","","","",""],["Eingeschmuggelte falsche Infos","","DaF LV","DaF HV","","","","L sollen beim Lesen einige eingeschmuggelte falsche Infos (stimmen faktisch nicht – Namen, Daten, Angaben) oder absolut nicht in den Text passende Sätze oder Wörter finden. L sollen diese nicht nur finden, sondern auch begründen, warum sie nicht passen bzw. wie die falsche Stelle korrigiert werden kann. Die nicht passenden Daten können auch mit einem Lexikon z.B. überprüft werden / oder Vergleich mit einem Parallelltext / Hinweis auf einschlägige Internetseiten. Anzahl der falschen Infos kann evtl. angegeben werden.","Text","","","","","",""],["Rollenspiel (reproduktiv)","","DaF HV","DaF LV","DaF Sprechen","","","Textinhalt zusammenfassen, indem die Lernenden Informationen aus dem Text in einem einfachen Dialog / Rollenspiel / Interview verwenden.  Die Rollen ergeben sich aus dem Text (Personen, die vorgestellt bzw. erwähnt werden).","","GA","","","","",""],["Satzpuzzle","","DaF HV","DaF LV","DaF Schreiben","","","nach dem Lesen / Hören : Angegebene Sätze zu einem sinnvollen Text ordnen.","Satzstreifen / AB","","","satzuzzle.png","","",""],["Schatzsuche","Schnitzeljagd","DaF HV","DaF LV","","","Bewegung","Nach Anweisungen (mündlich oder schriftlich) auf einem Gelände / im Raum / auf einer Schatzkarte einen versteckten Schatz finden.","Schatzkarte","PA / GA","","","","",""],["Schlagzeilen raten","","DaF LV","","","","","Aus der Zeitung schneiden die L in PA zwei oder drei interessante Schlagzeilen und Artikel aus. Die Schlagzeilen kleben sie an die Tafel und die Artikel an die Wand, so dass alle leicht herankommt oder sie legen sie einfach auf den Boden. Zu den Artikeln schreiben sie eine Chiffre dazu (z.B. HB132) oder malen ein Symbol dazu (0 ) Alle gehen herum und lesen die Artikel an: Wenn sie sicher sind, welche Schlagzeile dazu passt, notieren Chiffre / Symbol und schreiben die passende Schlagzeile auf...","","","","","","",""],["Schlüsselwörter markieren","","DaF LV","","","","","Beim Lesen markieren die L in jedem Satz / Nebensatz das Schlüsselwort. Anschließend unbedingt eine Reflexion einschie¬ben: Wie finde ich Schlüsselwörter? (Substantiv = Thema, Verb = Handlung) Ob die gewählten Schlüsselwörter „taugen“ und tatsächlich den roten Faden des Textes bilden, können wir überprüfen, wenn wir die Lernenden bitten, sie getrennt vom Text aufzuschreiben und zur Zusammenfassung des Inhalts zu benutzen. (= Sicherung des Textverständnisses – NACH LV)","","","","","","",""],["Schüttelkasten","","DaF HV","","","","","In einem Kasten werden den Lernenden Ausdrücke / Stichworte / Titelvorschläge... präsentiert. Sie sind durcheinander / gemischt: Es sieht so aus, als hätte jemand diesen Kasten kräftig „geschüttelt“. Vor dem Hören / Lesen werden evtl. nicht erschließbare neue Wörter im Kasten geklärt (auch mit Wörterbucharbeit kombinierbar). Beim Hören / Lesen markieren die L die Wörter, die im Text vorkommen oder Themen, die im Text angesprochen werden oder  Zwischentitel, die für den Text in Frage kommen...","","","","","","",""],["Sprech- / Gedankenblasen und Text vergleichen","","DaF HV","DaF LV","","","","Geeignet für Texte mit dialogischem Charakter / Gespräche unter mehreren Personen / Monologe. Zum Text wird eine Bildergeschichte / Strichmännchen mit Srech- oder Denkblasen / Fotos mit Sprech- oder Denkblasen präsentiert. Bei Bildergeschichte gibt es auch erkennbare Inhalte, in dem Fall können die Lernenden schon vor dem Hören überlegen, was die Figuren wohl sagen könnten – beim Hören wird das überprüft, die Lernenden notieren in die Sprechblasen, was die Personen sagen.","AB","","","","","",""],["Infos zu Stichwörtern notieren","","DaF HV","DaF LV","","","","Bei HV / LV: Aus dem Text beim Lesen Informationen zu angegebenen Stichwörtern notieren.","AB / Kärtchen an der Tafel","","","stichw.png","","",""],["Strategische Fragen formulieren","W-Fragen","DaF HV","DaF LV","","","Strategie","Vor HV / LV: Eine – wenn nicht die – natürlichste LV- bzw. HV-Aufgabe, die den L auch in der Realität weiterhilft, fremde Texte zu verstehen: Vor dem Hören / Lesen werden aufgrund von Titel / Bil¬dern / Textsorte / Thema... Fragen aufgeschrieben, auf die die Lernenden im Text eine Antwort finden wollen. Beim Lesen und Hören suchen die Lernenden dann Antwort auf ihre Fragen. Auch Fragen, die der Text dann doch nicht beantwortet, sind für das Verstehen wichtig – wie im richtigen Leben!","","EA --> PL","","","","",""],["Strukturmarkierer einsetzen","","DaF LV","","","","","Beim Lesen: Im Text werden mehrere, den L bekannte Strukturmarkierer (Konjunktionen, Relativpronomen) gelöscht. Sie sollen diese beim Lesen ersetzen. Wichtige Übung: Die Schüler lesen dadurch den Text sehr genau, darüber hinaus lernen sie, wie wichtig es für die Spekulation über den Textinhalt es sein kann, wenn sie schon wissen, dass im nächsten Satz (weil...) eine Begründung folgt (= Wenn Begründung für den Text wichtig, wird der Nebensatz auch aufmerksamer gelesen bzw. wird dafür, wenn nötig, Hilfe – z.B. Wörterbuch – geholt). Den Text neu tippen und genügend Platz zum Hineinschreiben lassen.","","","","","","",""],["Text mit Parallelltext vergleichen","","DaF HV","DaF LV","","","","Zum Text (zu Texten) Paralleltexte (kurze Zusammenfassungen oder ähnliche Fälle) präsentieren. L finden die Abweichungen. Zum Text (zu Texten) Paralleltexte (kurze Zusammenfassungen oder ähnliche Fälle) präsentieren. L finden die Abweichungen.","AB","","","parallelltext.png","","",""],["Textfragmente rekonstruieren","","DaF LV","DaF Sprechen","","","","L bekommen die Überschrift, den ersten und den letzten Absatz / bei Bildergeschichten die ersten und die letzten Bilder.... Die fehlenden Stellen erschließen die L aus Hinweisen im Text. Das Arbeitsblatt am besten so gestalten, dass die L ihre Vorschläge direkt in die Lücken hineinschreiben können. Variante: Im Text werden Absätze (als Anfang jeder zweite) gelöscht. Titel und den ersten Absatz unbedingt angeben! Variante: Im Text fehlt nur das Ende, die L spekulieren über mögliche Abschlüsse des Textes / schreiben einen Abschluss. Geht auch sehr gut mit literarischen Texten.","Texte, Bildergeschichten","PA / GA","","haegar_anfang_ende.jpg","","",""],["Verstehensinseln schaffen","","DaF HV","","","","","L notieren beim Hören alle Wörter, die sie heraushören. Nach dem Hören sammeln wir gemeinsam alles, was sie verstanden haben und notieren ALLES an die Tafel. (auch Sachen, die nicht stimmen, z.B.: „kanarische“...??? vielleicht Insel???“ – im Text: „kana¬dische (Holzfällerhütte)“ Wörter, bei denen jemand sagt, “das war nicht drin / das klang nicht so”, das Wort markieren – die Überprüfung wird die nächste Hörauf-gabe... zusammen mit der Aufgabe, dass die L versuchen sollen, die¬se Insel zu erweitern: Nach dem Hören werden die zusammenhängen¬den Insel auch miteinander verbunden. Eine echte „Mutmacher“-Aufgabe! Man beweist den Lernenden, dass sie VIEL verstehen und will nicht nachweisen, was alles sie NICHT verstanden haben. Geht also sehr gut mit schwierigen Texten!","","","","","","",""],["Genau, sehr genau, übergenau","","DaF Sprechen","","","","","Auf Kärtchen Aufträge schreiben - gern auch zusammen mit den Lernenden (z.B. Wo wollen wir uns treffen? Was ziehst du zur nächsten Party an? Was hast du heute gefrühstückt? Worüber hast du dich zuletzt geärgert? ...) Jeder L zieht eine Karte. Sie gehen herum und stellen einander die Frage - und der Partner bohrt einfach immer nach... - wo genau? und dort wo? wie viel Meter davon entfernt?... wenn die Antwort ihm reicht, sagt er: Danke, das genügt. Und sie tauschen die Rollen... Und dann auch die Karten und gehen weiter. Bekommt jemand eine Karte, die er/sie schon hatte, darf er/sie eine neue nehmen.  (Idee nach: 10 Minuten Dings und andere Ideen zum Leben und Schreiben - dort wird es als Partnerübung beschrieben, aber so braucht man zu viele Karten, und immer mit dem gleichen Partner ist es vielleicht auch nicht so spannend...)","Kärtchen","CP / PA","","","","",""],["Minifolien-Collage","","Präsentation","","","","","","Folie, zerschnippelt","FA","","minifolien.jpg","","",""],["Schleißenscheit","","Konzentration","DaF Phonetik","","","","Ein Spieler spricht den Zungenbrecher vor (meist nur den ersten Teil, die ersten drei Sätze). Die Spieler wiederholen den Satz reihum. Macht einer einen Fehler, beginnt wieder er erste Spieler. Wird ein voller Durchgang fehlerlos geschafft, kommt eine weitere Satzgruppe dazu.   1. Dies ist ein Scheit. Ein Schleißenscheit. Ein wohlgeschlissenes Schleißenscheit. 2. Mein Vater ist Hofscheitschleißer. Er sitzt am Ofen und schleißt Scheite. 3, Jeden Morgen bevor er gebackt und gebissen hat er einen großen Haufen Scheite geschnitzt und geschlissen.","","PL","","","","",""],["Fadenspur legen","","Präsentation","","","","","\"Legen Sie sich mehrere Bündel von farbigen Wollfäden in Ihren Moderatorenkoffer. Schneiden Sie sich Fäden von etwa 1,5 m ab. Ein Wollfaden lässt sich leicht um die Nadeln von Pinnwandkarten legen. Im Nu entstehen farbige Verbindungen zwischen Karten, auch zwischen solchen, die auf der Pinnwand entfernt voneinander hängen. Der rote Faden wird Realität!  Wenn Sie die Fadenspur legen, müssen Sie am Fadenbeginn eine enge Schlaufe machen, die am Pinn der ersten Karte eingehängt wird. (Schlaufe am besten schon bei der Vorbereitung anbringen, wenn Sie die Wollfäden vom Knäuel abschneiden.) Das ist der Fixpunkt. Um die Pinns der anderen Karten, die Sie als zusammengehörig kennzeichnen wollen, wird der Faden dann nur noch gelegt. Beim letzten Pinn sollten Sie einen Knoten machen und den Fadenrest abschneiden. Für die nächste Kartenfamilie nehmen Sie einen Wollfaden in einer anderen Farbe.\"","Pinnwand, Plakat, Pinnadeln, bunter Faden","FA","","fde.jpg","","",""],["Buchstaben belegen","","Einstieg","Kooperation","DaF WS",
