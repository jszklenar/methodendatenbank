oden und markiert eine Start- und eine Ziellinie. Nach dem Startsignal schnappt sich jedes Team zwei Bögen Zeitung. Beide stellen sich mit beiden Füßen auf den ersten Bogen, sie legen den zweiten Bogen vor sich hin. Sobald beide TN sich mit beiden Beinen auf dem zweiten Bogen neu positioniert haben, kann der erste Bogen nach vorn gelegt werden. Auf diese Weise durchqueren die Teams den Raum bzw. eine zuvor festgelegte Strecke. Mögliche Variationen: Man kann unterschiedlich große Zeitungen benutzen! Umso kleiner die Zeitung, umso schwieriger das Warm-up. Natürlich dürfen auch mehr Personen auf ein Treibholz.","Zeitung","PA","freier Raum","","","",""],["Stretching-Kreis","","Aktivieren","Konzentration","Gruppendynamik","","Bewegung","Die TN stehen im Kreis. Jeder streckt die Arme nach vorne und überkreuzt sie. Dabei liegt der rechte Arm über dem linken Arm. Mit den ausgestreckten Händen greift jeder die Hand seines Nachbarn. Anschließend laufen alle ganz langsam nach außen. Dabei ist es wichtig die Schultern entspannt zu lassen. Es entsteht eine Dehnung zwischen den Schulterblättern. Der SL leitet weiter durch die Übung: „Entspannt euch, atmet tief ein und aus.“ Dann kommen alle wieder langsam in der Mitte zusammen. Die TN halten sich weiterhin an den Händen fest. etzt heben alle gemeinsam ihre Arme nach oben und drehen sich darunter durch nach außen – mit dem Rücken in den Kreis. Die Arme sind jetzt nicht mehr überkreuzt, die Hände des Nachbarn werden weiterhin gehalten. Wieder gehen alle langsam nach außen. Diesmal wird die Brustmuskulatur gedehnt. Die TN legen sich in die Dehnung und atmen tief ein und aus. Danach gehen alle wieder langsam nach innen und drehen sich wieder zueinander. Diesmal werden die Hände umgegriffen, sodass sich alle normal an den Händen halten. Zum Abschluss strecken alle ihre Arme nach oben. Sie ziehen sich gegenseitig hoch, gehen auf die Zehenspitzen, strecken und recken sich. Es wird einmal zusammen ausgeatmet und die Arme lösen sich beim Nachvorne-Fallenlassen.","","PL","Stehkreis","","","",""],["Ich bin ein Baum","s.a. Sonne Mond und Sterne","Aktivieren","Kreativität","DaF WS","","Bewegung","Die TN stehen im Kreis. Eine Person geht in den Kreis, verharrt in einer Pose und sagt laut, was sie darstellt, z. B. „Ich bin ein Baum“. Eine zweite Person stellt sich dazu, macht aufbauend auf dem vorangegangenen Objekt eine neue Pose und sagt ebenfalls laut, was sie ist, z. B. „Ich bin ein Vogel“. Eine dritte Person ergänzt das Bild mit einem weiteren passenden Begriff. Die erste Person und eine weitere Person ihrer Wahl verlassen nun das Schaubild wieder. Mit der im Kreis verbliebenen Person, bzw. mit deren Objekt, beginnt eine neue Kette. Zur „Katze“ begibt sich z. B. eine „Sardinendose“.  Es wird min. solange gespielt, bis jeder einmal in der Mitte war.","","PL","Stehkreis","","","",""],["Papierflieger bauen","Paper plane challenge","Aktivieren","Kooperation","Problemlösung","Kommunikation","","Die TN finden sich in 2er-Teams zusammen. Jedes Team bekommt ein Blatt Papier und ggf. Klebeband.  Ab jetzt darf nicht mehr miteinander gesprochen werden. Der Timer wird auf 4 Minuten gestellt und der SL gibt das Startsignal. Jedes Team erhält die Anweisung, die „starke“ Hand hinter den Rücken zu halten und in den nächsten Minuten nur die „schwache“ Hand zu benutzen, um zu zweit einen Papierflieger zu bauen. Nach Ablauf der Zeit stellen sich alle an einer Linie auf und lassen die Flieger fliegen.","Papier","PA","","","","",""],["Äpfel zeichnen","","Aktivieren","DaF WS","","","Wettbewerb","Die TN teilen sich in zwei Teams auf. Alle Mitglieder eines Teams stellen sich in einer Schlange hintereinander vor ihr Flipchart bzw. Whiteboard.  Der Timer wird auf 3 Minuten gestellt, der SL gibt das Startsignal.  Die erste Person in der Reihe jedes Teams beginnt zu malen. Anschließend stellt sie sich hinten an und der nächste in der Reihe malt einen „Apfel-“ Begriff.  Wenn die Zeit abgelaufen ist, zählt der SL die Zeichnungen und das Team mit den meisten Apfel-Begriffen gewinnt. Mögliche Variationen: Statt Äpfel können natürlich andere Begriffe oder Themen verwendet werden, z. B. Karte, Leiter oder Ei.","Tafel / Pinwand und Flipchart","GA","","","","",""],["Pop-up-book","","Aktivieren","Körpersprache","DaF Sprechen","","Bewegung","Die Gruppe bestimmt einen Geschichtenerzähler. Die restlichen TN stellen sich nebeneinander in einer Reihe auf und gehen in die Hocke. Der Erzähler wählt frei eine Überschrift für seine Geschichte. Der Erzähler läuft langsam an der Gruppe vorbei und macht eine Handbewegung, als würde er eine übergroße Buchseite aufschlagen. Die TN stehen nun auf und nehmen eine frei zu wählende Körperhaltung ein. Der Erzähler beginnt, seine Geschichte zu erzählen, indem er die Körperhaltungen nacheinander (nicht unbedingt der Reihe nach) interpretiert. Sobald jede Person thematisiert wurde, geht der Erzähler erneut an der Gruppe vorbei und macht eine Handbewegung, als wenn er das Buch wieder schließen würde. Die TN verlassen ihre Körperhaltung und gehen wieder in die Hocke. Mögliche Variationen: Nach jedem Kapitel kann der Geschichtenerzähler in einem rotierenden Verfahren getauscht werden. Dabei wird der zu Beginn festgelegte Titel der Geschichte beibehalten und der neue Geschichtenerzähler schließt an die Erzählungen seines Vorgängers an.","","PL","Stehkreis","","","",""],["Chinese whisper","","Wahrnehmung","Körpersprache","Kommunikation","","Bewegung","Die TN - bis auf 3-4 Beobachter (am Anfang fragen, wer das Spiel kennt) - stehen in einer Schlange. Die letzte in der Schlange klopft dem Vorgänger auf die Schulter, er dreht sich um und der letzte Spieler spielt ihm pantomimisch eine Kurze Geschichte vor (z.B. mit dem Auto losfahren, einkaufen und an der Kasse zahlen, Baby - Windeln wechseln...). Beide dürfen dabei nicht sprechen. Wenn fertig, dreht sich der 2. TN um, klopft dem Vorgänger auf die Schulter und versucht das Gesehene genau nachzuspielen... Wer fertig ist, kann sich um den Spielenden herum einen Kreis bildet - lachen ist erlaubt :-) Am Ende spielt der letzte Spieler die Geschichte vor und nach ihm wieder der allererste Spieler die Originalgeschichte. Reflexion: Was hat sich geändert? An welcher Stelle gab es signifikante Änderungen? Welche Infos gingen verloren und woran kann es gelegen sein? ...","","PL","Schlange","","","",""],["Ich habe ein Problem","","Aktivieren","Kreativität","Gruppendynamik","DaF Sprechen","Bewegung","TN gehen herum, suchen sich einen Partner. Einer der beiden beginnt mit dem Satz „Ich habe ein Problem…“ und fügt etwas frei Erfundenes hinzu „…ich habe ein Loch im Schuh.“ Der Gegenüber überlegt sich nun ein beliebiges Objekt, das in keinem Zusammenhang mit dem Problem steht. Er sagt zum Beispiel: „Schau mal, ich habe einen Besen für dich.“ Dabei macht er eine pantomimische Geste. Nun ist der andere ganz erfreut und sagt „Super, dankeschön…“ und überlegt sich eine Möglichkeit mit diesem Objekt sein Problem zu lösen. „..dann kann ich ja mit dem Besenstiel Lederreste in das Loch stopfen.“ Nun beginnt der Gegenüber von vorne „Du, ich habe ein Problem…“…","","CP","freier Raum","","","",""],["Bären und Tiger","","Aktivieren","DaF Sprechen","","","Wettbewerb","Die TN suchen sich einen Partner. Jeweils ein TN ist für Bären, der andere für Tiger. Der Timer wird auf 60 Sekunden gestellt und der SL ruft “Los”. Die Tiger starten mit dem Satz „Tiger sind toll, weil sie …(z. B. Streifen haben)“. Jedes weitere Argument wird mit diesen Worten eingeleitet. Der Partner zählt die Argumente mit den Fingern mit und feuert seinen Gegner an. Nach 60 Sekunde ist Schluss und der Timer wird erneut gestellt. Jetzt sind die Bären dran und die Tiger zählen mit. „Bären sind toll, weil sie … (z. B. braun sind).” Das Team mit den meisten Argumenten hat gewonnen.","","PA","","","","",""],["Jump in – jump out – jump left – jump right","","Aktivieren","Konzentration","","","Bewegung","Die Gruppe steht im Kreis, jeder fasst sich mit seinen Nachbarn an den Händen. Phase 1: Die Gruppe führt für eine Minute die vier unterschiedlichen Kommandos des SL aus. Phase 2:  Beim Kommando „Jump In“ muss die Gruppe z.B. ebenfalls „Jump In“ rufen und gleichzeitig das Kommando ausführen. Phase 3: Die Gruppe sagt nun laut das gegenteilige Kommando des Coachs, führt aber das richtige Kommando aus z.B. Coach ruft „Jump In“, Gruppe ruft „Jump Out“ und springt aber nach innen. Phase 4: Die Gruppe wiederholt laut die erteilten Kommandos, springt aber genau gegenteilig z.B. Coach ruft „Jump In“, Gruppe ruft auch „Jump In“ und springt aber nach außen. Mögliche Variationen: Unterschiedliche Aktivitäten wie z.B. „Hochspringen” oder „doppelt springen” sind möglich. Um die Schwierigkeit zu erhöhen kann man die Geschwindigkeit erhöhen oder die Augen schließen lassen.","","PL","Stehkreis","","","",""],["Kuhstall","","Aktivieren","Konzentration","","","Bewegung","Die zwei äußeren nehmen sich an die Hände und umschließen eine dritte Person, die zur muhenden Kuh wird. Der SL erklärt die Formation und die Regeln: „Kuh”: die mittleren Personen brechen aus und suchen sich einen neuen Stall; „Stall”: die äußeren Personen lassen ihre Hände los und suchen eine andere Kuh; „Kuhstall”: alle müssen eine neue Formation finden.  Der SL beginnt mit „Kuhstall“. Alle versuchen, schnell eine “Kuhstall”-Formation einzunehmen.  Die übrig gebliebene Person, der Bauer, erteilt das nächste Kommando.","","PL","freier Raum / im Freien","","","",""],["Hepp!","","Aktivieren","Konzentration","Kooperation","","Bewegung","Alle TN bekommen einen leeren Karton. Die TN stehen im Kreis. Der SL gibt das Kommando “3, 2, 1 - Hepp!” und jeder wirft seinen Gegenstand nach rechts. Nach dem Werfen müssen alle den Gegenstand von links kommend auffangen. Der SL ruft erneut “3, 2, 1 – Hepp!” und erhöht so nach und nach die Geschwindigkeit. Nach ein paar Runden kommt zusätzlich das Kommando “Hipp” hinzu, bei dem nach links geworfen wird und von rechts gefangen werden muss. Mögliche Variationen: Die TN, die den Gegenstand nicht auffangen, scheiden aus. So ergibt sich zum Schluss der Gewinner!","Kartons","PL","Stehkreis","","","",""],["01/02/2003","","Aktivieren","Konzntration","","","","Die TN finden sich in 2er-Teams zusammen und stellen sich gegenüber auf.  Der Timer wird zu jeder Runde auf 1 Minute gestellt. Runde 1: Die Paare zählen abwechselnd bis drei („eins“, „zwei“, „drei“). Runde 2: Die Paare ersetzen die Zahl „eins“ durch einen Hüpfer. „Zwei“ und „drei“ werden wie zuvor gezählt. Runde 3: Die Zahl „zwei“ wird nun auch ersetzt: Der jeweilige Partner fasst sich an die Nase, anstatt die Zahl auszusprechen. Runde 4: Die Zahl „drei“ wird ersetzt durch das Berühren der Schulter des Partners.","","PA","","","","",""],["Stop and go, name and clap","","Aktivieren","Konzentration","","","Bewegung","Alle stehen auf und verteilen sich im Raum. Phase 1: Der SL erteilt abwechselnd die Kommandos „Stop“ und „Go“. Die TN laufen los oder halten an. Nach 30 Sekunden wechselt die Bedeutung der beiden Begriffe: Stop = Go und Go = Stop. Phase 2: Der Coach fügt zwei neue Kommandos hinzu „Name“ und „Clap“. Die TN klatschen oder rufen ihren Namen. Nach einer Minute wechseln auch diese Bedeutungen der neuen Kommandos. Phase 3: Der Coach fügt zwei weitere Kommandos hinzu: „Dance“ und „Jump“.  Die TN tanzen oder springen. Nach zwei Minuten wechseln auch die Bedeutungen der zuletzt hinzugefügten Kommandos. Es können andere Kommandos verwendet werden, um das Warm-up „seriöser” oder „spaßiger” zu gestalten.","","PL","freier Raum / im Freien","","","",""],["Brillante Momente","","Feedback","Reflexion","","","","Die TN bilden Paare, jedes Paar entscheidet zu Beginn, wer der Mensch und wer die Giraffe ist. In dieser Übung ist der Mensch der Sprecher, und die Giraffe ist der Zuhörer (die Giraffe ist das Tier mit dem organisch größten Herzen). 1. Der Mensch erzählt der Giraffe 3 Min. lang von einem brillanten Moment in seinem Leben (so bunt und detailliert wie möglich). Die Giraffe hört aufmerksam und ohne Zwischenbemerkungen zu. 2. Nach Ablauf der 3 Minuten bedankt sich die Giraffe für das Teilen des brillanten Moments und hat anschließend 3 Minuten lang Zeit, zurückzumelden, welche Stärken, Fähigkeiten, Fertigkeiten, Werte, Potenziale und Ressourcen der Mensch offensichtlich haben muss, damit es zu diesem brillanten Moment kommen konnte. 3. Nach Ablauf zeigt der Menschen per Handzeichen, wie gut das, was sie gerade über sich selbst gehört haben, tatsächlich zu ihnen passt. (Skala: vom Oberschenkel – gar nicht zutreffend bis über den Kopf – sehr zutreffend). 4. Rückrunde mit vertauschten Rollen.","","PA","","","","",""],["Das offene Buch","","Kennen lernen","Gruppendynamik","Einstieg","","Bewegung","TN notieren gut lesbar Stichpunkte über sich auf ein Blatt Papier. Die Notizen sollen einfach gemischt oder als Liste auf das Blatt niedergeschrieben werden. Stichpunkte: Name, Hobbys, was man mag / nicht mag. Jeder TN klebt sich sein Blatt auf die Brust, geht herum, spricht mit möglichst vielen TNn und sucht nach Gemeinsamkeiten.","Papier, Stifte","CP","freier Raum","","","",""],["Wimmelbild: Wer bin ich?","","Einstieg","Kennen lernen","Feedback","","","TN wählen eine Figur, und sprechen in der Rolle: Was die Figur denkt? Welche Pläne er hat? ... Variante Feedback: TN überlegen zu einer Impulsfrage: welche Person/Tier/Haltung entspricht am meisten meiner Stimmung? See erzählen reihum über ihre Befindlichkeit. Alle hören zu und versuchen zu erraten, welches Teil ist gemeint","Wimmelbild","PL / EA/PA > PL","","","","Whiteboard freigeben. TN erzählt, Mikro an, die anderen zeigen mit ihrem Pointer ihren Tipp.",""],["01/01/2001","","Kennen lernen","Einstieg","","","","TN wählen zu den Impulsen jeweils 1 Item / Wort (z.B: 1 Name, 1 Ort, 1 Wort, 1 Zahl...)","Auftrag auf Folie / Flipchart / Tafel / Körtchen","PL","Sitzkreis","","","Arbeitsauftrag in der PRÄSENTATION, MIKRO an, Kette: WL fängt an, danach nennt einen TN... am Ende wählt er einen neuen TN aus der TN-LISTE",""],["Aufzeigen","","Ritual","","","","","TN melden sich zu Wort (Hand, Finger heben)","","PL","","","","TN ändern ihren STATUS auf ein vereinbartes Zeichen (Hand, Fragezeichen)",""],["Glückstopf","","Aktivieren","Input","Erfahrungen","","Autonom","Die Großgruppe wird in mehrere Kleingruppe (zu ca. 5 Personen) aufgeteilt. Die Kleingruppen bekommen den Auftrag, einen oder mehrere Schlüsselbegriffe des Themas auf eine Moderationskarte zu schreiben. Die Moderationskarte(n) werden in einen \"Glückstopf\" gelegt. Jede Gruppe zieht eine oder mehrere Karten aus dem Glückstopf, die Gruppe versucht nun gemeinsam, die Begriffe zu erklären. Im Plenum werden mögliche Unklarheiten besprochen.","","GA --> PL","","","","",""],["Abstimmung in Bewegung","Moving Election","Ideen","Entscheiden","","","Großgruppe","Die Optionen, die zur Wahl stehen, auf einzelnde Kärtchen schreiben und gut sichtbar an unterschiedlichen Orten im Raum aufhängen. Die TN bewegen sich im Raum, markieren die Optionen, die für sie in Fragen kommen.","Papier / Kärtchen, Stifte","PL","","","","",""],["Büchsenabstimmung","","Feedback","Idee","Entscheidung","","","Für jede Option eine Büchse oder Weckglas hinstellen, mit Zettel drauf, wofür sie stehen. Jeder TN bekommt die gleiche Anzahl Kieselsteine o.ä. und wirft sie in die Behälter ihrer Wahl.","Büchsen / Gläser, Steine","EA","","","","",""],["Blind portrait","","Kennen lernen","Gruppendynamik","Feedback","","","Have the group split off into groups of 2, sitting across from each other. Explain they will be drawing a portrait of the person sitting across from them. Both partners will be drawing simultaneously. Rules: 1) They can’t look down at the paper they are drawing on, 2) They can’t lift their pen at any time during the drawing, so it will be one continuous line drawing. Have everyone promise not to look down at their paper while they do the drawing, as it is SO tempting to cheat here! Have everyone start at the same time and give them no more than 1 minute to complete the drawing of their partner. Have partners show and celebrate their masterpieces to each other! Have them write the name of their partner and three positive qualities they observed in the person they drew. Sign the portrait, and give it to their partner an a gift and an artifact.","Papier","PA","","","https://playonpurpose.com/games/blind-portrait-drawing/","alle Cam an, Bilder in die Cam halten - bei zu vielen TN BOR",""],["Clap snap stomp","","Aktivieren","Konzentration","","","","Ideally do a demonstration first with one of the participants (ie someone who has never played this before), and talk them through it as you go. This way the group will have an idea of how the game goes when you begin. Get everyone into pairs facing each other. Instruct partners to begin counting alternately 1 – 2 – 3 over and over again. As they are counting (maybe give them 15 seconds or so for each level), ask them to replace the “1” with a clap, while 2 and 3 stay the same. Then ask them to replace the “2” with a snap, so “1” is clap, “2” is a snap, and “3” is 3. Then ask them to replace the “3” with a stomp, so “1” is clap, “2” is a snap, and “3” is a stomp. Challenge participants to go as fast as possible and watch their brains try to keep up!","","PA","","","","",""],["Enemy and defender","","Gruppendynamik","Wahrnehmung","Konzentration","","","Have the group stand in a circle where they can all see each other. Have each person choose someone in the group who will be their “enemy.” They do this non-verbally and without telling anyone who their chosen enemy is. Then have each person choose someone in the group who will be their “defender.” They do this non-verbally and without telling anyone who their chosen defender is. When the group starts moving through the space, each person’s goal is to keep their defender physically between them and their enemy. Restrict the speed of movement and the boundaries of where people can go, as this game can get fast and spread out very quickly. I recommend limiting speed to a power walk (ie no running!), and staying within the immediate room/area (ie don’t let people get out of your sight). Make sure that everyone keeps moving at all times, otherwise you will end up with traffic jams and stagnation in the formation. After 1 minute or so, you can have everyone pause where they are, and reverse in their mind  who is in the roles of enemy and defender (enemy becomes defender and defender becomes enemy). Then play another round to see what different patterns emerge in the space.","","PL","freier Raum","","","",""],["Future forecast","","Reflexion","Kommunikation","","","","Get people into small groups of 2. Have people imagine what their life will be like exactly one year from today. (or you can give a timeline farther or closer away if that makes sense for your context). Imagine all the things that have happened in the year since this event they are at. Then one person at a time will have 1-2 minutes where they talk about all the amazing things that have happened in their life in the past year, in the past tense as if it has already happened. They share as a stream of consciousness, without stopping or pausing, with no holds barred, and no limits, anything is possible. It can cover health, wealth, travel, family, romance, wellbeing, anything.  They are encouraged to stand and use their whole body, face and voice to celebrate. The prompt can also focus around what has happened for this team in the past year, rather than the individual, if you are working with an intact group. The witness is actively listening during the 2 minutes, and cheering the speaker on. At the end of the 2 minutes, each group can have a short celebration, which can consist of cheering, high fives, whatever feels appropriate. Then the other person has a chance to forecast the future, with supportive encouragement from the witness, and celebration at the end.","","PA","","","","",""],["ID-Numbers","","Kennen lernen","Gruppendynamik","","","Bewegung","Distribute a blank index card and a pen to each person. Instruct everyone to write their first name in the top half of the card. In the bottom half, ask each person to write a series of numbers and letters which represent a set of interesting facts about themselves. For example, 1964-14Y-1K could represent a person born in 1964, married for 14 years and has one child (kid.) Encourage people to focus on interesting aspects of their life and experiences. When ready, pin the name-tags on each person’s clothing. Invite everyone to mix and mingle to engage in a series of conversations about their name-tags with as many people as possible.","Kärtchen","CP","freier Raum","","","ID in öff. Chat, danach Gespräche im Privaten Chat",""],["sprachkaraoke","","","","","","","","","","","","","",""],["WWW-Methode","","Reflexion","Feedback","","","","Die Methode soll den SuS ermöglichen konstruktiv Feedback zu geben und anzunehmen. WWW steht hier für Wahrnehmung, Wirkung und Wunsch. Sie sollen formulieren, wie sie etwas wahrnehmen und dazu Ich-Botschaften verwenden. Dann  sagen sie, wie sich das Wahrgenommene auf sachlicher und emotionaler Ebene auswirkt. Zuletzt formulieren die SuS einen Wunsch für die Zukunft, indem sie Änderungsvorschläge oder Lösungen darbieten.","keine","PL","Sitzkreis","","","Geteilte Notizen",""],["Kettenquiz","","Wiederholung","DaF: HV","Einstieg ins Thema","","","Die Schülerinnen und Schüler erhalten eine Karte, auf der Vorder- und Rückseite befinden sich eine Frage und eine nicht dazugehörige Antwort. Ein Schüler liest seine Frage vor. Derjenige, der die zugehörige Antwortkarte hat, liest diese vor und anschließend die neue Frage auf seiner Karte. So läuft das Quiz als laufendes Frage- Antwortspiel durch die Klasse.","Kärtchen","PL","Sitzkreis","","","",""],["Argumentationsmap","","Problemlösung","DaF: Sprechen","DaF: Schreiben","","","Die Methode „Argumentationsmap“ bildet ein Hilfsmittel zur Lösungsfindung in Problemsituationen. Dabei werden 4 Ebenen betrachtet, die als Abschnitte auf der Map selbst dargestellt werden.  Man beginnt rechts oben mit dem „Ist-Zustand“. Dabei geht es zunächst darum, die bestehende Situation zu analysieren. Dann beschäftigt man sich mit dem erwünschten Ergebnis, dem „Soll-Zustand“. Der Fokus liegt hierbei auf der idealen Situation, der das „Problem“ im Weg steht.  In diesem Schritt beschäftigt man sich mit der Differenz zwischen dem „Ist-“ und dem „Soll-Zustand“. Es sollen Gründe gefunden werden, die das Erreichen der idealen Situation im Weg stehen. Der anschließende „Appell“ soll eine Lösung des Problems darstellen. In diesem Punkt geht es um die Frage, welche Schritte und Veränderungen erfolgen müssen, um das vorangegangen analysierte Problem zu beseitigen. Wichtig hierbei ist, den Appell schriftlich zu formulieren. Das kann in Form eines Plakates, eines Merksatzes oder ähnlich erfolgen.","","","","Argumentationsmap-300x165.jpg","Methodenkartei Uni Oldenburg","Jamboard",""],["Rhyme or Reason (Reim oder Sinn)","","Aktivieren","Konzentration","DaF: WS","","","Wir machen einen Sitzkreis und bestimmen die Person, die beginnt und die Spielrichtung. Die erste Person beginnt mit einem beliebigen Wort, z.B „BALL“. Die nächste Person muss ein Wort sagen, das sich entweder auf dieses Wort reimt oder mit dem gleichen Buchstaben beginnt oder damit verwandt ist. Im Fall von „BALL“ sind beispielsweise die Wörter „Wall”, „Fall” oder „Bier“, “bunt” oder „rund” „werfen” .... Wenn jemand zögert oder ein Wort sagt, was schon dran war, ein Wort sagt, das sich nicht reimt oder nicht verwandt ist, fällt aus. Man muss schnell antworten (innerhalb von 1 bis 3 Sekunden). Lassen Sie die Gruppe entscheiden, ob ein Wort akzeptiert wird oder nicht. Das Spiel wird fortgesetzt, bis eine Person übrig ist und zum Gewinner erklärt wird.","keine","PL","Sitzkreis","","https://www.playmeo.com/activities/fun-large-group-games/rhyme-or-reason/","Sitzkreis in der Präsentation, Namen eintragen, Personen, die nicht mehr mitspielen, radieren o. durchstreichen",""],["Geschichte bauen / Geschichte mit Ein-haken","Build a story","Aktivieren","Konzentration","Kooperation","DaF: Sprechen","","Bitten Sie einen Freiwilligen, zunächst den Eröffnungssatz einer fiktiven Geschichte zu sagen, z. B. „Ich ging die Straße entlang, als plötzlich…“ Wenn dann jemand etwas zur Geschichte hinzufügen kann, bitten Sie ihn, sich bei der ersten Person einzuhaken, und zu erzählen, was als nächstes passiert ist, z. B. „… ich sah einen riesigen Elch, der meinen Weg versperrte.“ Die Geschichte geht weiter, indem neue TN sich einhaken und Satz für Satz die Geschichte aufbauen. Das Spiel geht weiter, bis alle zur Geschichte beigetragen haben, die Geschichte abgeschlossen ist – und alle im Kreis stehen.","keine","PL","freier Raum / Stehkreis","","https://www.playmeo.com/activities/fun-large-group-games/build-a-story/","Jamboard - Namensplättchen zum Kreis ordnen",""],["Kontakt herstellen","Making connections","Kennenlernen","Gruppendynamik","DaF: Sprechen","","","Das Ziel des Spiels ist, einen großen Kreis zu schaffen, in dem jede Person mit zwei anderen verbunden ist. Der Spielleiter stellt sich mit einer Hand an der Hüfte hin und teilt der Gruppe eine oder mehrere Aussagen über sich selbst mit. Wenn jemand aus der Gruppe eine Aussage hört, die er mit dem Spielleiter gemeinsam hat, wird er aufgefordert, sich bei ihm einzuhaken. Diese zweite Person teilt dann der Gruppe einiges über sich selbst mit, eine neue Person hakt sich bei ihm ein… usw.  Um den Kreis zu vervollständigen, soll die letzte Person auch etwas sagen, wovon er vermutet, dass er es mit dem Spielleiter gemeinsam hat.","keine","PL","freier Raum","","www.playmeo.com","Mikro an, Jamboard - Namensplättchen zum Kreis ordnen",""],["Kram Dralloc","","Kennen lernen","Aktivieren","DaF: Sprechen","","","Gruppe in Kleingruppen aufteilen. Vorbereitung: TN suchen einen Anagramm zu ihrem Namen (z.B. mit Hilfe eines Anagramm-Generators: https://anagramm-generator.de/)  Jeder stellt sich mit diesem neuen Namen vor (zB wird Mark Collard – der Erfinder des Spiels: als „Kram Dralloc” ). Die Gruppe spekuliert, wo auf der Welt eine Person mit diesem Namen leben würde, wenn sie echt wäre.","https://anagramm-generator.de/","GA","","","www.playmeo.com","BOR",""],["Just do it!","","Aktivieren","Konzentration","Gruppendynamik","","","TN machen die Kamera an und erfüllen Aufträge, z.B. Bring etwas Blaues / Eckiges mit... beweise, dass du eine Hose trägst... brind einen Gegenstand, der erklärungsbedürftig ist... spricht wie deine Lieblingsfigur aus dem Fernsehen... simuliere, dass du ganz laut schreist... organisere schnell einen Snack und teile es mit allen","","PL","","","","Kamera",""],["Wie sein Tag begann","","Kennen lernen","Gruppendynamik","Einstieg","","","Wie sein Tag bestimmt begann: Jeder rät, wie sein Nachbar die meisten Tage / den konkreten Tag beginnt. Anschließend korrigiert / bestätigt der Nachbar die Hypothesen. (Variante: Wie sein Abend nach dem vorigen Seminartag verlief...)","","","","","storylines.hamburg","Sitzkreis in der Präsentation / Jamboard",""],["ESVP","Explorer, Shopper, Vacationer, Prisoner","Erwartungen","","","","","Ziel: Herausfinden, wieviel Energie oder Interesse die TN haben, um sich am Seminar zu beteiligen. Matrix aufzeichnen: Explorer, Shopper, Vacationer, Prisoner (Entdecker, Einkaufsbummler, Urlauber, Gefangener) - die TN kreuzen anonym an, wo sie sich selbst gerade sehen. Auf die Haltungen eingehen, die am häufigsten vertreten sind.","Flipchart, evtl. Klebepunkte","EA > PL","","","storylines.hamburg","Whiteboard / Klecksen","Whiteboard / Stempeln"],["Die anderen über mich","","Kennen lernen","DaF: Sprechen","","","","Die TN schreiben 2 Personen auf, die ihn kennen (Sporttrainer, Ehefrau, Chef...). Bei der Vorstellungsrunde spricht jeder TN über sich selbst, aus der Perspektive der Personen. Danach sollen die anderen raten, welche Rollen er angenommen hat.","Kärtchen","PL","Sitzkreis","","storylines.hamburg","Kamera - PN an KL",""],["Agile Agenda","","Reflexion","","","","","Geplante Inhalte vorbereiten / mit den TN Aufgaben sammeln, diese im Laufe des Seminars in einer Tabelle ordnen: To do / in progress / done.","Pinwand, Kärtchen","PL","","","storylines.hamburg","MIRO o.ä.",""],["Meine Bedienungsanleitung","","Kennenlernen","Einstieg ins Thema","DaF: Sprechen","","","Vorlage auf Flipchart: Inhalte, die technisch wirken - Herstellungsdatum, Treibstoff / funktioniert mit..., Gefahrenbereich, Hochleistung bei.., gut zu verwenden mit... - die TN machen Notizen zu den Stichpunkten und stellen sich dann vor","Flipchart  (AB)","EA > PL","","","storylines.hamburg","",""],["100 Dinge","","Aktivieren","Einstieg","Erfahrung","","","Gruppen bilden (5TN). Auftrag: In 5 Minuten soll die Gesamtgruppe insgesamt 100 Antworten auf eine bestimmte Frage finden und diese auf Kärtchen schreiben.","Kärtchen, Pinnwand","GA","","","storylines.hamburg","",""],["Iterative Vorstellung","","Kennenlernen","DaF: Sprechen","","","","Schnelle und ganz und gar nicht langweilige Vorstellungsrunde:  der KL schreibt eine Reihe an Fragen auf ein Flipchart (Vorname, Name, Wohnort, Beruf, Alter, Ziel, Erfahrungsgrad...). Jeder TN beantwortet nur den ersten Punkt und gibt dann weiter an den nächsten TN. Wenn alle ihre Vornamen genannt haben, beginnt die 2. Runde... Schnelle Vorstellungsrunde.","","","Sitzkreis","","storylines.hamburg","",""],["Agenda in Frageform","","Einstieg","Erwartungen","","","","Die TN besuchen einen Workshop um Antworten auf ihre Fragen zu erhalten - das kann man ausnutzen, indem man zu den einzelnen Abschnitten des Workshops passende Fragen stellt. In jedem Baustein sollten die notwendigen Inhalte geliefert werden, um Antworten auf diese Fragen zu geben. Diese Methode hilft, wenn die Diskussion in eine ungewollte Richtung verselbstständigt: \"Hilft uns das, diese Frage zu beantworten?\" ist dann eine gute Intervention. Variante: Die TN schreiben zu Beginn selbst ihre Fragen auf, diese clustern und als Agenda ordnenne","Flipchart / Pinwand und Kärtchen","PL","","","storyline.hamburg","",""],["Priorisierungs-Matrix","","Ideen","Projektplanung","Kooperation","","","Ideen sammeln (neue Angebote, Projekte...). Jede Idee wird dann einzeln betrachtet und bewertet und wird in eine Matrix gesetzt. Die Matrix ermöglicht die Planung des weiteren Vorgehens. (In der Regel sind vor allem die Inhalte des I. und III. Quadranten relevant). Evtl. HOCHPUNKTEN als Abschluss.","Pinwand, Kärtchen, Stifte","EA/PA/GA > PL","","priorisierungsmatrix.jpg","storylines.hamburg","MIRO",""],["In unserer Hand","","Problemlösung","Erfahrungen","Kooperation","","","Wenn eine Gruppe über viele Themen klagt: Alle Themen auf Kärtchen schreiben, die der Gruppe im Wege stehen oder die Motivation rauben. Seil spannen zwischen 2 Karten (0 und 10). Die Karten sollen dann sortiert werden: Was ich selbst voll und ganz in der Hand habe, es zu ändern (10) - gar nicht aus eigener Kraft verändern kann (0). Das zeigt auf, dass es negative Themen gibt, die sie akzeptieren müssen, aber auch, dass sie Dinge anpacken können.","Kärtchen, Stifte, Seil","PL","","","storylines.hamburg","Miro o.ä.",""],["Morphologische Problemlösung","","Problemlösung","Kooperation","Motivation","","","1. Diskussion: das vorliegende Problem analysieren und definieren. 2. Das Problem in Teilprobleme aufspalten 3. Clustern 4. für Teilprobleme in Gruppen Lösungen ausarbeiten 5. Im PL Lösungen diskutieren. Erstaunlich: Scheinbar unlösbare Probleme, die blockieren, kann die Gruppe plötzlich anpacken.","Kärtchen","PL > GA > PL","","","storylines.hamburg","Miro o.ä.",""],["Filmreif","","Reflexion","Feedback","","","","Mit welchem Film können wir den letzten Sprint (die letzten Wochen, das Projekt, das Seminar...) vergleichen. Als Denkanstoß Filmplakate mitnehmen. TN schreiben ihre Idee auf ein Kärtchen und erklären ihre Wahl. (Man kann damit Prozesse, Rollen im Team, Kommunikation, Selbst- und Fremdbild... reflektieren)","evtl. Filmplakate","PL","","","storylines.hamburg","Plakat suchen und posten (z.B. Padlet)",""],["Erster und letzter Tag","","Reflexion","Erwartungen","","","","2 Fragen: Was habe ich nach dem ersten Tag hier gedacht und gefühlt? Was würde ich gern an meinem letzten Tag hier denken und fühlen? - die TN machen dazu Notizen. Nach einigen Minuten werden die Gedanken in der Gruppe geteilt. KL notiert Kernsätze / macht visuelle Notizen. Weiterführung - Wunsch letzter Tag: Was kann der Einzelne und die Gruppe tun, um diesen Zustand zu erreichen?","Flipchart","EA > PL","","","storylines.hamburg","",""],["4L-Reflexion","","Reflexion","","","","","Reflexion von Prozessen und von punktuellen Veränderungen. TN machen Notizen zu den 4 Kategorien (Kärtchen). Diese werden an der Pinwand gesammelt. Weiterführung: DAKI.","Kärtchen, Stifte, Pinwand","EA > PL","","4L_Reflexion.jpg","storylines.hamburg","",""],["DAKI","","Reflexion","","","","","Fortsetzung von 4L: Konkrete Maßnahmen aus Erfahrungen in einem Projekt / Workshop ableiten. Was folgt aus unseren Erkenntnissen? Was brauchen wir nicht mehr? Was müssen wir in Zukunft tun? Was hat sich bewährt - was wollen wir beibehalten? Was ist im Prinzip schon gut, muss aber noch mehr in dem Bereich passieren?","Kärtchen, Pinwand","","","DAKI.jpg","storylines.hamburg","",""],["Lesespurgeschichte","","DaF: LV","","","","Rätsel","Auf einem Wimmelbild werden 8-12 Orte nummeriert. In der Geschichte werden diese Orte nacheinander in einer bestimmten Reihenfolge aufgesucht (nicht von 1 bis 12). Diese Reihenfolge kann der Leser durch logisches Kombinieren der Textabschnitte herausfinden: Die Geschichte beginnt bei 1 und der Textabschnitt führt zu einer nächsten Station im Bild, usw. Die L notieren die Reihenfolge der Stationen. Beispiel: https://t1p.de/5lm2","Wimmelbild, Text in Abschnitte geteilt und random nummeriert","EA/PA","","v36_images.jpg","Zebra Lesebuch Klett Verlag","",""],["Vokabelkartei-Schlange","","Wiederholen","DaF WS","DaF Sprechen","","","Gespielt wird in Gruppen: Die L ziehen 7 Karten aus der Vokabelkartei eines Spielers. Die Regel ähnelt dem Mau-Mau / Uno-Spiel: Eine Karte wird aufgedeckt, der 1. Spieler muss eine seiner Vokabelkarten ablegen, indem er eine Beziehung zu der Karte herstellt und begründet. Kann ein Spieler keine Karte legen, zieht er eine neue Karte aus der Kartei. Gewonnen hat der Spieler, der zuerst alle seine Karten abgelegt hat.","Vokabelkartei","GA4","","","","",""],["Vokabelkarten-Kim","","DaF WS","Wiederholung","","","Wettbewerb","Die Vokabelkarten der letzten Stunde / Einheit an der Pinwand vorbereiten und je nach Menge 3-5 Karten entfernen. Die L beraten in PA, welche Wörter fehlen und notieren ihre Tipps. Wer einen Tipp hat, erklärt das Wort oder sagt die Entsprechung in der MS. Bei richtiger Wahl erhalten alle Teams einen Punkt, die das Wort auch notiert haben.","Vokabelkartei, Pinwand","PA","","","","",""],["Wörter-Pantomime","","DaF WS","Wiederholung","","","Wettbewerb","Wörter der letzten Stunde / der letzten Einheit oder ausgewählte Wörter aus der Vokabelkartei anpinnen. Mit oder ohne Vorbereitung zeigt ein TN pantomimisch ein Wort von der Pinwand. Die anderen raten. Möglich auch als Wettbewerb in Gruppen.","Vokabelkartei, Pinwand","PL / GA>PL","","","","",""],["Abdeck-Bilder","","DaF WS","Wiederholung","","","Wettbewerb","Zu Wörtern aus der letzten Stunde Bildkarten vorbereiten und über die Vokabelkarten an der Pinwand anpinnen. Die L raten dann, welches Wort unter den Bildern zu finden ist. Auch als Wettbewerb in Gruppen möglich. Variante: die L malen die Bilder selbst, schreiben auf die Rückseite das Wort und ihren Namen, die Bilder einsammeln und anpinnen. Beim eigenen Bild darf man nicht mitraten :-)","Vokabelkartei, Pinwand, Bildkarten","PL / EA>PL","","","","",""],["Atomspiel","","Kennenlernen","","","","für fas alle Lebensalter","Die Teilnehmerinnen und Teilnehmer bewegen sich als freie Atome im Raum. Auf Zuruf bilden sie \"Atomgruppen\" mit verschiedenen Personenzahlen. Die Atome einer Gruppe tauschen ihre Namen, sprechen über Eigenschaften, Hobbys, Gemeinsamkeiten usw.","gering, nichts","Kleingruppen, Paare","","","https://www.bpb.de/lernen/formate/methoden/62269/methodenkoffer-detailansicht?mid=302","",""],["Atomspiel","","Kennenlernen","","","","für fas alle Lebensalter","Die Teilnehmerinnen und Teilnehmer bewegen sich als freie Atome im Raum. Auf Zuruf bilden sie \"Atomgruppen\" mit verschiedenen Personenzahlen. Die Atome einer Gruppe tauschen ihre Namen, sprechen über Eigenschaften, Hobbys, Gemeinsamkeiten usw.","gering, nichts","Kleingruppen, Paare","","","https://www.bpb.de/lernen/formate/methoden/62269/methodenkoffer-detailansicht?mid=302","",""],["Chaotische Buchstaben","","Einstieg","Aufwärmen","","","","Die Teilnehmerinnen und Teilnehmer finden einen Buchstaben auf ihrem Platz. Ihre Aufgabe ist es, die Buchstaben in die richtige Reihenfolge zu bringen, so dass sie ein Lösungswort ergeben.","Buchstaben","Gesamtgruppe","","","https://www.bpb.de/lernen/formate/methoden/62269/methodenkoffer-detailansicht?mid=124","",""],["Wörter verschenken","","Evaluation","Abschluss","","","","TN denken kurz nach, welche Wörter für sie eine besondere Bedeutung haben oder einen besonders schönen Klang haben. Sie wählen eins aus und schreiben es auf einen Zettel. Danach gehen sie herum, und bitten 6 TN um ein Wort-Geschenk: Die angesprochenen TN schenken ein Wort, das zu der Person passt (Etwas Positives, was man im anderen sieht – oder etwas, von dem man sicher ist, dass es den anderen freut) und schreiben es auf einen Zettel. Wichtig: Einfach nur DANKE und keine Erklärungen oder Gespräche! Am Ende kehren alle mit 6 Wörtern zu ihrem Platz zurück - und schreiben nun ein Gedicht mit den Wörtern und heben die Geschenke besonders vor. Die Gedichte kann man vorlesen oder  als Galerie präsentieren.","7 Zettel, Buntstifte","EA > CP > EA > PL","","","Zamyat M. Klein","privater Chat, Präsentation: Chat oder Geteilte Notizen oder Bilder in Padlet hochladen",""],["Lesepartnerschaft","","LV","Kooperation","","","","Lesepartnerschaft für längere - auch literarische - Texte, auch für die Ferien: Mit dem Lesepartner trifft man sich jeden Tag (am besten ritualisiert um die gleiche Zeit) für 10 Minuten, um über das Gelesene zu diskutieren.","längere Texte","PA","","","","",""],["K-W-L Charts","","DaF: LV","Input","Kooperation","","","TN schreiben vor dem Lesen K - (What I Know) was sie über das Thema wissen, notieren im W-Bereich (What I Want to Know) Was sie wissen wollen und dann im L - (What I Learned) neue Informationen und Erkenntnisse, die sie gewonnen haben. - auf deutsch vlt W - M - L ? (Weiß, Möchte wissen, neu gelernt)?","Text","PA","","","","",""],["Schreiben mit allen Sinnen","","DaF Schr","Ideen","","","","Vorbereitung / Impuls: Beobachtungen Exkursion, Stadtspaziergang, Film - TN notieren danach ihre Ideen für den Text in 5 Spalten","AB","EA / PA / GA","","Schreiben_mit_allen_Sinnen_1.png","","Jamboard",""],["","","","","","","","","","","","","","",""],["ABC-Exit","","Reflexion","Feedback","","","","TN notieren in einem AB / auf Jamboard zu den Buchstaben Sachen, die sie in der vorigen Unterrichts- / Seminarphase dazugelernt haben","AB / Jamboard","EA","","ABC-Exit_1.png","","Bild als Hintergrund auf Jamboard einstellen, für jeden TN ein Frame. TN posten post-its.",""],["Scratch-Blatt / \"Rubbellos\"","","Üben","Erfahrung","Diskussion","DaF: WS","","Die TN radieren Felder nach Wahl frei und nutzen das Wort / Frage / These / Bild, das sie freigerubbelt haben: sammeln Wörter, beantworten Fragen, diskutieren.","Jamboard","EA / PA / GA","","TEST_SCRATCH_UNT_KURZ_2.png","","",""],["Blitzschnelle Schatzsuche / Lightning Scavenger Hunt","","Aktivieren","Einstieg ins Thema","DaF: WS","","","Die TN suchen (Präsenz: in Gruppen, online: EA)  in einer kurzen Zeit (STOPWATCH einschalten!) zu mehreren Kategorien Gegenstände. Die Liste wird an der Tafel / in der Präsentation als Ganzes gezeigt. ((Variante: BUCHSTABEN oder FARBEN als Suchimpuls). Nach Ablauf der Zeit zeigen die Gruppen ihre Schätze / zeigen die TN Kategorie nach Kategorie alles in die Kamera. Wie es bewertet wird (und ob es bewertet wird oder nur diskutiert), können wir mit der Gruppe aushandeln: Alles, was nur 1 Person hat - 1 Punkt oder alles, was nicht nur eine Person hat - 1 Punkt für die Gruppe.... TN können über die Gegenstände erzählen, oder in jeder Runde nennt ein anderer TN, was er in den Kameras sieht - alles muss dann erklärt werden, bei denen die Gruppe meint, das passt nicht zur Kategorie.","","","","blitzschnelle_schatzsuche.jpg","","Präsentation, Kamera, Mikro",""],["Grab a Thing!","","Aktivieren","DaF: WS","","","","1. Schnell die Namen von 10 Gegenständem in den Chat schreiben / an die Whiteboard. Die TN müssen schnell möglichst viele organisieren und nach dem Klingelzeichen in die Kamera zeigen. 2. Eigenschaften von Gegenständen nennen, TN rennen und holen etwas AUS EINEM ANDEREN RAUM, worauf das Merkmal zutrifft und zeigen es in die Kamera. Wir können vorher ein Bewertungssystem aushandeln: Für alles, was es nur EINMAL gibt, bekommt die Gruppe einen Punkt / für alles, was mehr als nur einmal gibt...","","","","","","Chat, Kamera",""],["Interview aus der Box","","Kennen lernen","DaF: Sprechen","Erfahrungsaustausch","","","Fragen in der Vorlage \"Öffne die Box\" von Wordwall eingeben. In Gruppen oder im Plenum den Bildschirm teilen, TN sagen, welche Box sie wollen, der Spielleiter (Lehrer oder ein TN) öffnet sie, der TN beantwortet die Fragen und sagt, wer die nächste Box öffnen soll. (Wir können auch einen TImer stellen, wenn es klingelt, kommt eine offene Runde: ALLE müssen die Frage beantworten). .","Wordwall Öffne die Box","GA / PL","","_ffnen_sie_die_box.jpg","","Bildschirm teilen",""],["Chatlawine mit Glücksrad","","Aktivieren","Einstieg","Kennen lernen","","","Der KL teilt den Bildschirm von einem Glücksrad-Tool mit Impulsen, die TN schreiben schnell das Erste in den Chat, was ihnen zum gedrehten Begriff oder Frage einfällt.","wordwall, wheelofnames, pickerweel...","PL","","","","Chat, Bildschirm teilen","Chat, Bildschirm teilen"],["Buchstabensalat recyceln","Namen recyceln","Aktivieren","Kooperation","DaF: WS","","","Aus einem Buchstabensalat schreiben die TN alle Wörter, die sie aus den Buchstaben heraus lesen! Es darf jeder Buchstabe nur 1x verwendet werden. Variante: TN schreiben ihre Vornamen auf (in Kleingruppen), sie dürfen nur diese Buchstaben verwenden. Sie schreiben die Wörter auf ein Plakat. (Bewertung nach Kategorien: das längste Wort, die meisten Wörter, wer hat die wenigsten Buchstaben übrig, das schönste Wort)","","","","","","Buchstabensalat: Bewegliche Buchstaben (Jamboardvorlage nutzen). Oder: Die TN sind für eine kurze Zeit (3 Min. z.B.)  in BOR. Sie schreiben ihre Namen ans Whiteboard, bilden Wörter und schreiben sie in die GET-NOT. Sie streichen alle Buchstaben durch am Whiteboard. Kurz vor Ablauf der Zeit kopieren sie die Wörter aus dem Chat. Variante: Jamboard.",""],["Give one - get one","Go Go Mo","Erfahrungsaustausch","Präsentation","","","","Die TN notieren zu einer Leitfrage 2-3 Ideen / Rezepte / Infos zu einem Thema (Fortbildung: Spiele, Unterrichtsideen, Methoden) auf einem A4-Blatt und befestigen es an der Kleidung. Sie gehen herum, sprechen mit anderen - immer mit einem Partner. Der Partner wählt, was er erklärt bekommen will und so tauschen sie sich Ideen aus: Sie bekommen eine Idee und geben eine Idee weiter. Sie können in ihrem Heft die neuen Ideen notieren und am Ende die auswählen, die ihnen am besten gefallen haben.","A4-Blatt, Wäscheklammer","CP","freier Raum","gogomo.jpg","","kombinieren mit Spatial Chat oder wonder.me - Ideen auf Padlet notieren oder bei Spatial chat zum Avatar dazuschreiben",""],["Echospiel","","DaF Sprechen","","","","kooperativ","Die L müssen ihre Meinung zu einem Thema äußern, dabei aber immer auf das Gesagte des Vorredners eingehen. So wird ganz nebenbei auch das aktive Zuhören geübt. Das Spiel ist erst erfolgreich geschafft, wenn jeder etwas beigetragen hat. Falls jemandem kein Argument einfällt, kann der Rest der Gruppe helfen.","","GA","","Echospiel_Deutsch_kombi_plus.pdf","","",""],["Bushaltestelle","","Üben","Input","","","kooperativ","Wenn ein Lernendereine Aufgabe beendet hat, wartet er an einem Treffpunkt im Klassenraum, bis ein anderer mit derselben Aufgabe fertig ist. Anschließend erfolgt ein Austausch oder eine weitere Erarbeitung in Partnerarbeit. Als Visualisierung des Treffpunkts bietet sich die Abbildung einer Bushaltestelle an. Für den Austausch suchen sich die Paare freie Plätze im Klassenraum. Wichtig ist, dass der Lernpartner nur nach dem Lerntempo gewählt wird und dass nicht auf Freunde gewartet werden darf. Außerdem sollten die Lernenden im Vorfeld auf die auftretenden Unterschiede im Lerntempo hingewiesen werden. Gleichzeitig sollten sie ermutigt werden, sich nicht aus der Ruhe bringen zu lassen, damit sie in ihrem eigenen Tempo und ihrer eigenen Gründlichkeit arbeiten können.","Haltestelle / Tafel","PA","","","","",""],["Buchstabenartist","","Kooperation","Problemlösung","Einstieg in das Thema","DaF WS","Bewegung","Ein langes Seil als gerade Linie auf den Boden gelegt. Die SL überlegt sich ein Wort aus dem Unterrichtsstoff und sucht zunächst die Buchstaben dieses Wortes aus den Buchstabenkarten heraus. Danach gibt sie an, wie viele TN sich auf der Linie nebeneinanderstellen sollen (= Anzahl der Buchstaben des Wortes). Jeder TN am Seil nimmt eine der Buchstabenkarten. Die TN haben die Aufgabe, das „geschüttelte“ Wort entlang der Seillinie zu bauen. Niemand darf beim Platztausch seinen Fuß außerhalb des Seils abstellen!","Seil, Buchstabenkarten","PL / GA","freier Raum","","","",""],["Zoodirektor","","Aktivierung","Einstieg ins Thema","Konzentration","DaF WS","","Die TN stehen im Kreis.Ein Spieler steht in der Mitte und ist der Zoodirektor, er zeigt auf einen Spieler und nennt dabei ein Tier. Der TN macht je nach genanntem Tier folgende Bewegungen: das Tier lebt im Wasser: Schwimmbewegung. das Tier lebt an Land: Arme gekreuzt an die Schultern, das Tier kann fliegen: die Kinder, die links und rechts vom angesprochenen Kind stehen, tauschen schnell die Plätze  Wer Fehler macht, wird zum Zoodirektor (oder nach einigen Runden wird automatisch ein neuer Zoodirektor ausgewählt)","-","PL","Stehkreis","","","",""],["Ans andere Ufer","","Aktivieren","Einstieg ins Thema","DaF WS","","spielerisch","Jeder Spieler schreibt einen Buchstaben seiner Wahl groß auf ein Blatt. Wir bilden zwei Gruppen. Sie Gruppen stehen einander im Abstand von circa 1 bis 2 Meter gegenüber.  Jeder Spieler hält seinen Buchstaben gut sichtbar vor sich hin. Ein Spieler nennt ein Wort zum Thema, der mit seinem Buchstaben anfängt und mit einem Buchstaben eines TN aus der gegenüberstehenden Gruppe endet: z.B. Thema Umwelt: Eigener Buchstabe G – in der anderen Gruppe ist ein R: GlascontaineR). Passt das Wort zum Thema, muss der Schüler mit dem Endbuchstaben rüberkommen und die Gruppe darf weiterfragen. Gibt es das Wort nicht oder passt es nicht zum Thema oder die Gruppe kann kein Wort mehr sagen, ist die andere Gruppe dran….","Blätter, dicke Stifte","","freier Raum","","","",""],["Quizmatrix","","","","","","","","","","","","","",""],["Tast-KIM","","Wahrnehmung","DaF WS","Einstieg in das Thema","","","Die Gegenstände werden am Boden oder auf einem Tisch aufgelegt und unter einer blickdichten Decke / einem Tuch... versteckt. Die Spieler greifen unter die Decke, um die Gegenstände nacheinander zu ertasten. Verboten: Unter die Decke schauen und Gegenstände rausholen. Die L müssen sich die Gegenstände merken und wenn sie alle Gegenstände ertastet haben, notieren sie in EA / PA oder GA  die Namen der Gegenstände.","Gegenstände, Tuch oder Decke, Tisch","EA / PA --> EA / PA / GA","","","","",""],["Sesselwanderung","","Aktivieren","Kooperation","","","","Die TN ziehen eine Karte, merken sich die Zahl und geben die Karte zurück. Wir machen einen Stuhlkreis, jeder Mitspieler setzt sich hin. Der Spielleiter nimmt eine Karte, nennt die Zahl - alle mit der Zahl müssen im Uhrzeigersinn einen Platz weiterrücken. Sie setzen sich auf einen freigewordenen Stuhl - oder jemandem aufs Knie. usw. Der Spieler \"unten\" ist \"eingefrorern\". Hin und wieder sagt der Spielleiter 4 - dann rücken alle Spieler, die oben sitzen bzw. allein auf einem Stuhl sitzen, einen Platz weiter. Der Spieler, der zuerst an seinem ursprünglichen Platz sitzt, hat gewonnen (auch wenn schon jemand da sitzt).","Kärtchen 1-2-3","PL","Sitzkreis","","","",""],["quizmatrix","","","","","","","","","","","","","",""],["Schneeballschlacht","","Kennen lernen","Gruppendynamik","","","Bewegung","Zu Beginn schreiben alle Pm Fakten über sich selbst auf einen Zettel.  Die Aufgabe kann offengehalten werden oder die Gruppenleitung gibt drei Fragen vor (z. B. „Was ist der schönste Urlaubsort, an dem du jemals warst?“, „Was ist das Verrückteste, was du jemals gemacht hast?“, „Was bereust du in deinem Leben?“). Dann werden die Zettel zu „Schneebällen“ zusammengeknüllt.  Auf Kommando der SL  gibt es eine Minute lang eine „Schneeballschlacht“ mit den Zetteln.  Ist die Minute vorbei, gibt es ein Signal und jede/r nimmt sich einen Zettel. Alle kommen wieder im Kreis zusammen und nach der Reihe dürfen alle raten, welche Person hinter den 3 Fakten steckt.","Papier","EA --> PL","","","","",""],["Gegenteile unter Verdacht","","DaF WS","","","","spielerisch","Die TN arbeiten in Gruppen an verschiedenen Tischen. Jede Gruppe erhält die gleiche Anzahl von Karten, auf denen Wörter abgebildet sind. Team A beginnt, nimmt eine Wort-Karte und fragt z.B. Team C, ob sie die passende Gegenteil-Karte dazu hat. Die muss benannt werden, wenn man sie bekommen möchte. Ist das so, muss Team C die Karte an Team A aushändigen und darf weiterspielen. Ansonsten geht bei Team C weiter. Das Spiel ist zu Ende, wenn ein Team keine Karten mehr hat, gewonnen hat allerdings das Team mit den meisten Karten.  Hat ein Team überhaupt keine Karte mehr, von dem es weiß, wie das Gegenteil heißt und wer es haben könnte, muss gegen Abgabe eines bereits gewonnenen Karten-Paares beim Spielleiter gekauft werden.","Kärtchen","GA --> PL","","","https://www.daf-daz-didaktik.de/themen/wortschatz/gegenteil-unter-verdacht/?fbclid=IwAR3CdrYJ0hBDAPdpkogkD_THo9FyeAKlW_i7_y8HnMmDQ3-QxQljMn_UPvk","",""],["Crosstown connection","","Gruppendynamik","DaF Sprechen","","","","Wir stellen 4 Begrüßungen vor: High five, 2. low five Partner (anklatschen, aber Hand unten halten), 3. fist-bump 4. Fischer-Begrüßung  - Beschreibung beim Link unten. //// Dann immer ansagen, wie man begrüßen soll und dem Partner gggs. eine Frage stellen.","","CP","leerer Raum","","Chad Littlefield - Marc Collard https://youtu.be/yGrZLuuyQMU?si=1kDM1gJLAbFwoq17&t=314","",""],["01/02/2003","","Konzentration","Gruppendynamik","","","","1. Die TN müssel SCHNELL 1-2-3-1-2-3... zählen, ohne Pausen / Nachdenken / Fehler. 2. Runde: statt 1 Klatsch mit den Händen überm Kopf, 2 und 3 bleiben 3. Runde: 1 Klatsch, 2: Im Stehkreis hochspringen, im Sitzkreis Schulter hochziehen, 3 bleibt.. 3. Runde: 1 Klatsch, 2 Schulter 3 Miau. - Die Elemente können wir der Situation bzw. dem Lerngegenstand anpassen. - Danach Partnerwechsel ein Paar mal.","keine","PA","leerer Raum","","https://youtu.be/yGrZLuuyQMU?si=Ux4Wj97vFBrSe9i0&t=532","",""],["Starfish","Seestern","Reflexion","Projektplanung","Kooperation","","","Ziel: Bestandsaufnahme / Zwischenevaluation von Projekten. In den Projektgruppen die 5 Fragen besprechen: 1. Davon mehr 2. Davon weniger 3. Aufhören 4. Weitermachen 5. Anfangen. Zum Schluss Anfangen besprechen und konkrete Schritte für die Weiterarbeit vereinbaren.","AB oder entsprechende Vorlage (digi-Whiteboard)","GA","","starfish.png","","Jamboard, Figjam, Vorlage Starfish bei https://app.timboretro.com/create-retro... (s. Anhang)",""],["Wir sind eine/r","","Kennen lernen","Gruppendynamik","","","","Wir sind eine*r Die Gruppe soll sich vorstellen, dass sie eine Person ist. Dazu sollen Körpergröße, Schuhgröße, Alter und und und der einzelnen Mitspieler*innen gesammelt und addiert werden. Die einzelnen Suchaufgaben aufteilen. Die Ergebnisse schreiben die Interviewer auf Kärtchen, schreiben die Kategorie auf die Rückseite und pinnen sie mit Kategorie nach oben an. Bevor die Ergebnisse präsentiert werden, können alle ihre Tipps abgeben :-)","Kärtchen","CP > PL","","","Jugendleiter-Blog","Jamboard mit Deckblatt oder unsichtbare (weiße) Tinte nutzen (T)",""],["Plätze tauschen","","","","","","","","","","","","","",""],["ABC-Rennen","Alphabet Race","Wiederholung","Aktivieren","DaF: WS","","Wettbewerb","1. Die Spieler schreiben das Alphabet auf ein separates Blatt Papier, zweimal, am linken und am rechten Rand. Die Mitte bleibt frei. 2. Spieler 1 schreibt ein Startwort und streicht die Buchstaben durch, die im Startwort vorkommen. 3. Spieler 2 fügt Buchstaben zum Ausgangswort hinzu, um ein neues Wort zu bilden, und streicht die verwendeten Buchstaben durch (nur die, die er verwendet hat). 4. Die Spieler dürfen die durchgestrichenen Buchstaben nicht mehr verwenden. Wenn dem Spieler kein Wort einfällt, überspringt er seinen Zug. 5. Das Spiel endet, wenn einer der Spieler alle Buchstaben durchgestrichen hat oder wenn alle Spieler ihren Zug auslassen.  Der Spieler, der alle Buchstaben durchgestrichen hat oder die wenigsten Buchstaben hat, gewinnt das Spiel..Wir können für das Spiel auch ein Thema angeben.","Papier","PA","","abc_rennen.jpg","https://eltcation.com/2017/06/22/alphabet-race/","",""],["Curious Cat","Die neugierige Katze","Aktivieren","Wiederholen","DaF: WS","","","Die TN sagen das Alphabet leise auf, die \"neugierige Katze\" sagt \"STOP\" und zeigt zufällig auf einen Spieler. Der Spieler sagt, bei welchem Buchstaben er/sie stehen geblieben ist. Die neugierige Katze stellt den Schülern verschiedene Fragen - Wer? Warum? Wo? Wann? Was? usw. - auf die die Spieler kurze Antworten geben sollen, die mit dem von ihnen gewählten Buchstaben beginnen (dies kann ein Satz oder ein einzelnes Wort sein).  Zum Beispiel der Buchstabe \"K\": Wer? - Kapitän Cook. - Wo? - in Kaiserslautern. Mit wem? - Jürgen Klopp. am Karfreitag. Was tun sie? kicken. Wie? kunstvoll. ...  Jedes Mal, wenn ein Spieler keine Antwort geben kann, bekommt die Katze einen Punkt. Das Spiel ist zu Ende, wenn die Katze drei Punkte erreicht hat.  Die TN können dann auch kurze Geschichten schreiben, in der die Antworten verwendet werden, die sie gegeben haben.","nichts","PL","Sitzkreis","","","",""],["Kettenübung mit ABC","","Wiederholung","DaF: WS","","","Kettenübung","Reihum wird eine Frage nach einer relativ einfachen Regel von allen beantwortet oder ein Satz mit einigen Variationen gesagt bzw. immer um ein weiteres Glied ergänzt. Dafür bietet sich ein Stuhlkreis an.   In dieser Variante muss man ein Wort mit dem nächsten Buchstaben des Alphabets hinzufügen, z.B. „Was nimmst du auf eine einsame Insel mit?” - Allergietabletten… Becher… Campingkocher… Decke… Eimer… Feuerzeug… G…","nichts","PL","Sitzkreis","","","",""],["Stempelspiel","","Kooperation","Erkundung","","","Stadtspiel","Bei diesem Spiel spielen mehrere Kleingruppen à circa vier Mitspieler*innen gegeneinander. Jede Kleingruppe erhält ein Klemmbrett mit Papier und hat die Aufgabe, möglichst viele Stempel von ver- schiedenen Geschäften und Einrichtungen der Stadt zu sammeln. Für jeden Stempel gibt es einen Punkt. Die Gruppe, die nach Ablauf der Zeit die meisten Stempel hat, gewinnt das Spiel. Die Spieldauer sollte circa 60 Minuten betragen. Die SLsollte genau beschreiben, in welchem Gebiet die Kleingruppen unterwegs sein dürfen und wie sie im Notfall die SL erreichen können. Auch eine fixe Anlaufstation im Zentrum des Spielgebiets bietet sich an.","Klemmbretter","GA","","","Jugendleiter-Blog","",""],["Apfel und Ei","","Erkundung","Kooperation","","","spielerisch","Die TN werden in Kleingruppen á vier Personen eingeteilt. Jede Kleingruppe erhält einen Apfel und ein Ei. Die Aufgabe ist es, die beiden Gegenstände im Dorf bzw. in der Stadt in andere Gegenstände umzutauschen, die dann wiederum getauscht werden. Mit dem Tauschen soll sich der Wert der beiden Gegenstände, die die Gruppe besitzt, immer weiter steigern. Nach Ablauf der Spielzeit (min. 45 Minuten) treffen sich die Gruppen wieder. Welcher Gruppe ist es gelungen, den wertvollsten Gegenstand zu ertauschen? Für ältere und erfahrenere Gruppen kann die Aufgabe auch spezifischer gestaltet werden: So muss zum Beispiel versucht werden, mit dem Ei einen möglichst großen Gegenstand zu ertauschen und mit dem Apfel einen möglichst wertvollen.","Apfel, Ei","GA","in der Stadt","","Jugendleiter-Blog","",""],["Bilderrallye","","Erkundung","Wahrnehmung","Kooperation","","","Für dieses Spiel braucht es einiges an Vorbereitung: in der Stadt umhergehen und Orte, Gegenstände und Details von Häusern fotografieren. Dabei muss immer darauf geachtet werden, dass die Gruppe in der Lage ist, die jeweilige Aufnahme vor Ort auch zu erkennen und wiederzufinden. Zu jedem Bild muss sich die SL eine Frage ausdenken, die nur vor Ort gelöst werden kann. Dies können zum Beispiel Öffnungszeiten von Geschäften, Details von Hinweistafeln an Gebäuden, Anzahl an Steinen in einer Mauer, Preise von Gegenständen in der Schaufensterauslage und viele weitere Details sein. Die Fragen werden auf die Rückseiten der ausgedruckten Fotos geschrieben. Je nach Schwierigkeitsgrad und Ortskenntnissen der Gruppe muss die Anzahl der Fragen festgelegt werden. Die Gruppen erhalten nun jeweils einen Briefumschlag mit den Fotos und Fragen darin und haben eine festgelegte Zeit, um die Orte zu finden und die Fragen zu beantworten. Die Antworten werden unter die Fragen geschrieben. Sobald die Zeit abgelaufen ist oder alle Fragen beantwortet wurden, versammeln sich alle Kleingruppen wieder beim SL zur Auswertung","","GA","in der Stadt","","Jugendleiter-Blog","",""],["VIP-s finden","","Kooperation","Wahrnehmung","Erkundung","","spielerisch","Zum Spiel brauchen wir mehrere SL Die SL verkleiden sich, schlüpfen in die verschiedensten Rollen (Nonnen, Punker, Balletttänzer oder Ähnliches) und verteilen sich in einem vorher festgelegten Stadtgebiet. Die TN dürfen die verkleideten SL vor Spielbeginn nicht sehen. Ausgestattet mit Autogrammkarten, laufen sie dort umher und bewegen sich möglichst unauffällig. Die TN werden in Kleingruppen à 3–5 Personen aufgeteilt. Diese haben nun die Aufgabe, möglichst schnell alle VIPs zu finden. Wegrennen vor den Kleingruppen ist nicht erlaubt. Wurde ein VIP gefunden, händigt dieser der Gruppe eine Autogrammkarte aus. (Wir können eine Zeit festlegen – gewonnen hat die Gruppe mit den meisten Autogrammen, oder das Spiel ist aus, wenn eine Gruppe alle VIP-s gefunden hat.)","","GA","in der Stadt","","Jugendleiter-Blog","",""],["Straßenkreuzungsquiz","","Kooperation","Erkundung","","","spielerisch","Die Gruppe muss möglichst schnell vom Startpunkt aus zu einem vorher vereinbarten Treffpunkt in der Stadt finden, etwa ein Café am Marktplatz, ein Warenhaus oder Ähnliches. Auf dem Weg dorthin muss sie an jeder Kreuzung eine Quizfrage lösen, die sie von einem/einer dort postierten Mitarbeiter*in gestellt bekommt. Beantwortet sie diese richtig, darf sie weitergehen, ansonsten muss sie einen kleinen Umweg machen. Zur Sicherheit begleitet ein*e Spielleiter*in die Gruppe. Ziel ist es, möglichst schnell den vereinbarten Zielpunkt zu erreichen. Bei einer größeren Anzahl an TN können auch zwei oder mehrere Gruppen gegeneinander spielen. Das Spiel eignet sich gut, um die Umgebung besser kennenzulernen. So können zum Beispiel Fragen zum aktuellen Aufenthaltsort der Gruppe gestellt oder allgemein die Geschichte der Stadt beleuchtet werden.","","GA","in der Stadt","","Jugendleiter-Blog","",""],["ABC-Tauschgeschäft","","Kooperation","Problemlösung","Kommunikation","","spielerisch","Die TN werden in Gruppen aufgeteilt. Jede Gruppe bekommt einen Apfel und eine Liste mit dem ABC. Aufgabe ist es, den Apfel in einer vorgegebenen Zeit (ca. 60–90 Minuten) in andere Gegenstände umzutauschen. Aber nur in Reihenfolge des ABCs: Der Apfel muss in einen Gegenstand, der mit dem Buchstaben B beginnt, eingetauscht werden. Dieser wiederum in einen Gegenstand, der mit dem Buchstaben C beginnt, und so weiter. Die einzelnen Tauschgeschäfte müssen mit einem Foto und einer Unterschrift der eintauschenden Person bestätigt werden. Die Gruppe, die im ABC am weitesten kommt, gewinnt das Spiel. Haben mehrere Gruppen den gleichen Buchstaben erreicht, so zählt die Kreativität des zurückgebrachten Gegenstands.","ABC-Liste","GA","in der Stadt","","Jugendleiter-Blog","",""],["Fotoausstellung","","Kooperation","Kommunikation","Erkundung","","spielerisch","Die TN werden in Gruppen aufgeteilt und müssen Aufgaben erfüllen, was sie mit einem Foto beweisen müssen. Etwa: Musiziert in der Innenstadt! Insgesamt haben sie 60 Minuten Zeit. Die Aufgaben sind so formuliert, dass sie die Kreativität fordern und nicht immer wortwörtlich umzusetzen sind (Beispiele siehe unten). Nach Ablauf der 60 Minuten treffen sich die Gruppen wieder und stellen sich gegenseitig ihre Ergebnisse und Fotos vor.  Wenn die Teams gegeneinander antreten sollen, kann eine Jury die Fotos bewerten und so eine Siegergruppe wählen. Hier einige Beispielaufgaben: Jongliert mit möglichst ungewöhnlichen Gegenständen, streichelt möglichst viele Tiere, Betretet einen möglichst ungewöhnlichen Ort, Fotografiert euch kopfüber, Musiziert in der Innenstadt, Tragt eine fremde Person über die Straße, Stellt ein CD-Cover nach, Stellt ein Werbeplakat nach","AB","GA","in der Stadt","","Jugendleiter-Blog","",""],["Reporterspiel","","Kooperation","Kommunikation","Erkundung","","spielerisch","Jede Gruppe erhält einen von der SL vorbereiteten Bogen mit verschiedenen menschlichen Eigenschaften (mutig, stark, freundlich …). Aufgabe der TN ist es nun, in der Stadt Personen zu finden, auf die diese Eigenschaften zutreffen und das auf dem Zettel unterschreiben. Jede Person darf bei jeder Gruppe aber nur einmal unterschreiben. Wichtig ist außerdem, dass bei möglichst vielen Personen eine Handynummer mit angegeben wird, damit die Spielleitung stichprobenartig kontrollieren kann, ob die Angaben auch wirklich stimmen und es sich um reale Personen handelt. (Alternative: Foto und Unterschrift sammeln). Das Spiel endet, wenn eine Gruppe für alle Eigenschaften eine Person gefunden hat – oder nach Ablauf der vereinbarten Zeit.","AB","GA","in der Stadt","","Jugendleiter-Blog","",""],["Wettkampf der Warenhäuser","","Kooperation","Kommunikation","Erkundung","","spielerisch","Bei diesem Spiel werden die Spieler in Gruppen eingeteilt. Jede Gruppe stellt ein Warenhaus dar. Ziel ist es, verschiedene Artikel schnellstmöglich zu besorgen. Die Spielrunde startet auf einem zentralen Platz der Stadt. Der SL gibt eine Ware an, und die Gruppen haben 10 Minuten Zeit, diese zu besorgen. Wichtig: Sie darf nicht gekauft werden. Das Warenhaus, das die Ware am schnellsten besorgen kann, gewinnt die Runde und sammelt einen Punkt. Die Gruppen dürfen sich dabei nicht trennen und müssen pünktlich zur SL an den zentralen Platz zurückkommen. Mögliche Waren sind zum Beispiel Bierdeckel, ein Eis, Blumen, ein Buch oder ein Hamburger.","","GA","in der Stadt","","Jugendleiter-Blog","",""],["Falscher Reiseführer","","Kooperation","Kommunikation","Erkundung","","spielerisch","Dieses Spiel eignet sich gut, um die eigene Stadt besser kennenzulernen. Aber auch beim Besuch fremder Städte kann es genutzt werden, um mehr über den Ort herauszufinden. Es verlangt allerdings einiges an Vorbereitung. Die SL erstellt einen Reiseführer mit Bildern und Infos zur Stadt. Anschließend werden in diesem selbst erstellten Reiseführer mehrere falsche Informationen eingebaut. Das kann ein Bild einer anderen Stadt sein, eine falsche Telefonnummer oder eine falsche historische Information. Die Gruppe startet an einem zentralen Platz und bekommt den Reiseführer ausgehändigt. Die Handys werden bei der SL abgelegt. Aufgabe ist es nun, innerhalb von 45 Minuten möglichst viele Fehler im Reiseführer zu entdecken. Dazu kann es helfen, die Orte, die im Reiseführer angegeben sind, zu besuchen und die Daten vor Ort zu überprüfen, sich in der Touristeninformation neue Broschüren zu besorgen oder Passant*innen zu befragen. Welche Gruppe findet die meisten Fehler?","Reiseführer","GA","in der Stadt","","Jugendleiter-Blog","",""],["Ein Wort - nur für dich","","DaF Wortschatz","Wörterbucharbeit","","","autonom","Der KL  bereitet eine Liste von Wörtern vor. Jeder TN bekommt ein Wort, das speziell für ihn/sie vorbereitet wurde. Der Trick besteht darin, dass jeder TN ein Wort bekommt, dessen Anfangsbuchstabe mit dem Anfangsbuchstaben seines Vornamens übereinstimmt, z. B. Leo erhält listig. Jeder TN muss das Wort während des Unterrichts im Wörterbuch nachschlagen und nach ein paar Minuten vor der Klasse berichten. Z. B. „Mein Name ist Leo und ich bin listig. Das bedeutet, dass ich ... (Definition)...“. Als Hausaufgabe können die TN das Gleiche mit ihrem Nachnamen machen.)","Zettel","EA > PL","","","","",""],["Das nützliche Alphabet","","DaF WS","Kooperation","","","autonom","Jeder TN erhält einen Buchstaben und muss 5, 10 oder 15 Wörter finden, von denen er glaubt, dass sie für ihn/sie nützlich sein könnten. Sie berichten dann der Klasse, z.B. als > Cocktailparty, mit Hilfe von Wortkarten (auf die eine Seite schreiben sie den Buchstaben, auf die andere die Informationen über das Wort - Rechtschreibung, Aussprache, Definition).","Karteikarten / Zettel","EA > CP","","","","",""],["Partnerinterview 2","","DaF Sprechen","Kennen lernen","Kooperation","","","Die TN bekommen keine Fragen, sondern ein AB mit angefangenen Sätzen. Sie müssen die Fragen so selbst formulieren und die Antwort des Partners notieren.","AB","PA > PL","","Interview_mit_angefangenen_S_tzen.png","","",""],["Fragen nach Zahlen","","DaF Sprechen","Kennen lernen","Kooperation","","","Bereite zwei Arbeitsblätter mit je 10 Fragen vor (für Anfänger) und nummeriere sie. Einige Fragen können sich wiederholen, sollen aber auf beiden AB an unterschiedlicher Position sein.  Oder bitte jeden TN, als Vorbereitung 10 Fragen aufzuschreiben und diese zu nummerieren. Danach Cocktailparty: Die TN gehen herum, sagen eine Zahl, der Partner stellt diese Frage, und umgekehrt. Pro Partner stellen sie 3-4 Fragen und suchen danach neue Partner. Variante: Paare nach dem Zufallsprinzip zusammenstellen oder jede/r wählt einen Partner, den er/sie nicht (so gut) kennt. Der Partner sagt, wie viele und welche Fragen er haben will. Danach können sie einander kurz im Plenum vorstellen.","AB","PA > PL","","","","",""],["Wahrheit oder Lüge?","","DaF Sprechen","Kennen lernen","Kooperation","","","Die TN bekommen ein AB mit angefangenen Sätzen. Sie beenden den Satz wahrheitsgemäß - oder sie flunkern. Danach suchen sie sich einen Partner. Sie stellen einander Fragen und antworten. Der Partner muss entscheiden, ob die Aussagen wahr oder gelogen sind.","","PA","","Wahrheit_oder_L_ge.png","Studio, Helbling Languages","",""],["Wahrsager","","DaF Sprechen","Aktivieren","","","","Vorbereitung (Hausaufgabe): Die TN suchen im Internet 6 Bilder und kopieren sie in eine Datei. Sie nummerieren die Bilder. Sie drucken das Blatt aus oder machen davon ein Foto. Im Unterricht Cocktailparty: Sie laufen herum mit ihren Blättern oder mit ihrem Handy, der Gesprächspartner nennt eine Zahl und der Wahrsager sagt anhand des Bildes etwas über die Zukunft des Partners.","6 Bilder pro TN","EA > CP","","","","",""],["Rette sich, wer kann!","","DaF GR","Aktivieren","","","Bewegung","Die L laufen zur Musik durch den Raum. Die SL stoppt die Musik und ruft: „Rette sich, wer kann …  &#10145;&#8194; auf eine Bank!“  &#10145;&#8194; neben eine Bank!“  &#10145;&#8194; unter eine Bank!“  &#10145;&#8194; zwischen eine Bank und die Wand!“  &#10145;&#8194; an die Wand!“ Die SL können auch die L übernehmen.","Musik","PL","","","","",""],["Sockenspiel","Socken-Kim","DaF WS","Aktivieren","Einstieg ins Thema","","Bewegung","Die L werden in zwei Mannschaften geteilt. Im Raum hängen die nummerierten Socken mit Gegenständen an der Wäscheleine. (oder einfach verschiedene bunte Socken nehmen). Die Mannschaften stehen in einem Abstand von der Wäscheleine. Je ein Spieler von jeder Mannschaft läuft nach dem Signal des Spielleiters an die Wäscheleine, tastet den Gegenstand in einer Socke, versucht zu verstehen, was drin ist,  läuft zurück und schreibt das Wort auf dem Papierblatt, das hinter der Mannschaft liegt; Dann ist der nächste Spieler dran. Die Mannschaft, die am meisten Gegenstände richtig schreibt, gewinnt.","Gegenstände, bunte Socken, Wäscheleine","PL","","","","",""],["High five!","","Konzentration","","","","Bewegung","Das Spielprinzip ist einfach: Jeder darf so oft aufstehen, wie er oder sie möchte.  Aber:  Es dürfen immer nur exakt 5 Schüler*innen gleichzeitig stehen.  Jede*r Schüler*in darf maximal 5 Sekunden stehen.  Ihr dürft nicht sprechen!","Würfel / digitale Tafel","","","high_five.png","","fobizz tools - digitale Tafel, Classroomscreen, Digiscreen",""],["Würfelfitness","","Konzentration","","","","Bewegung","Alle Schülerinnen und Schüler bleiben an ihrem Platz. Der Würfel auf dieser digitalen Tafel entscheidet über den Ablauf der bewegten Pause. 1. Stufe: Immer wenn eine 1 gewürfelt wird, sagen alle \"Moin\". (30 Sec) 2. Stufe: Mit Zwei Würfeln würfeln: Ist eine 1 dabei? = \"Moin\"  Ist eine 2 dabei? = Aufstehen. ((30 Sec) 3. Stufe: 1 Würfel - 1 = \"Moin\"  2 = Aufstehen  3= Mit beiden Händen jemand zuwinken  4 = Auf etwas Blaues zeigen  5 = Ausruhen  6 = Platz mit dem Banknachbarn tauschen. (1 Min.) Finale Stufe: 2 Würfel - 2 Aktionen  1 = \"Moin\"  2 = Aufstehen  3= Mit beiden Händen jemand zuwinken  4 = Auf etwas Blaues zeigen  5 = Ausruhen  6 = Platz mit dem Banknachbarn (1 Min.)","digitale Tafel mit Würfelfunktion","PL","","","","Fobizz-Tools digitale Tafel, Classroomscreen, Digiscreen",""],["Speakers Corner","","Reflexion","","","","","Ein TN steht auf einem Stuhl und bekommt besondere Aufmerksamkeit für sein Tun. Wichtig ist der Applaus des Publikums nach der Präsentation. Der TN kann den Schlüsselsatz eines Textes vorlesen, einzelne Zeilen eines Gedichtes aufsagen, gelernte Vokabeln laut sprechen,  ein auswendig gelerntes Gedicht oder Zeilen daraus vortragen, Objekte vorstellen, zeigen, anpreisen, Erkenntnisse aus einer Unterrichtsstunde verkünden, Meinungen in Bezug auf ein Projekt/eine Unterrichtsstunde kundtun, Stimmungen pantomimisch darstellen. TN stehen gerne vor dem Stuhl an, daher kann man auch zwei oder mehr Stühle anbieten - dann müssen die Sprechenden jedoch aufeinander Rücksicht nehmen. Es darf immer nur eine/r reden, und zwar ohne Absprache untereinander.","besonders markierte Stühle","PL","","","","",""],["Ja-nein-Stühle","","DaF HV-LV","Einstieg in das Thema","Wiederholung","","Bewegung","Zwei Stühle werden in den Raum gestellt, einer mit dem Schild „Ja“ und der andere mit „Nein“.  Zuerst hören oder lesen TN einen Text. (oder wenn es um Wiederholung der vorigen Inhalte geht: In Kleingruppen besprechen sie, woran sie sich erinnern, offene Fragen...) Der KL gibt Aussagen zu einem bestimmten Text (Audio- oder Lesetext) vor. Die TN müssen schnell entscheiden, ob die Aussage richtig oder falsch ist. Auf Kommando läuft ein Mitglied von jedem Team zu dem entsprechenden Stuhl (Ja oder Nein). Das Team, dessen Mitglied zuerst am richtigen Stuhl ankommt, erhält einen Punkt. - Mit mehreren Stühlen auch mit Multiple-Choice-Fragen machbar.","2 oder 3 Stühle","GA","","","","",""],["Verlorene Namen","","Kennen lernen","Aktivieren","","","","Nach dem Namen lernen oder als Auflockerung am Anfang der Sitzung / Stunde auch später: Die TN stellen sich am Anfang im Kreis auf. Der SL geht zu einem Kind und begrüßt es mit einem Händedruck. Dabei sagt der SL seinen Namen, und das Kind nennt seinen Namen. So tauschen sie die Namen.  Danach Cocktailparty. Das Spiel endet, wenn ein TN seinen Namen zurückbekommt. Oder: Wer seinen Namen zurückbekommen hat, setzt sich wieder in den Stuhlkreis und wir spielen weiter.","","CP","","","","",""],["Argumentationswippe","","Erfahrung","DaF Sprechen","","","","Ziel: Argumente pro und contra sammeln und den Standpunkt der Gruppe visualisieren.  Auf Papier sieht es so aus, wie im Bild: Die L bekommen Schnipsel in unterschiedlichen Farben und einen Papierstreifen, die die Wippe signalisiert.  Die L schreiben als Vorbereitung Argumente. Bei der Diskussion bringen sie sie an (oder schreiben noch neue dazu, wenn ihnen noch mehr Ideen kommen).  Sie legen die Schnipsel auf die unterschiedlichen Seiten und verändern die Position der Wippe, wenn sie einen neuen Zettel anlegen. (Man kann auch einen Anspitzer oder Radiergummi in die Mitte stellen, so sieht man besser, dass die Wippe sich bewegt.)    Am Ende sehen die L, wie der Standpunkt der Gruppe aussieht, und bereiten eine Stellungsnahme der Gruppe vor, die sie im Plenum - oder noch besser: mit Wirbelgruppen präsentieren. Digital geht es klasse mit diesem einfachen Tool: https://argumentationswippe.de/","Papierschnipsel, Papierbalken, Tisch","PA / GA","","argumentationswippe.png","","https://argumentationswippe.de/","https://argumentationswippe.de/"],["Buchstabendiktat","","Aktivieren","DaF WS","DaF Rechtschreibung","","spielerisch","Die L spielen zu zweit. Jede/r L malt ein Quadrat ins Heft - 4x4, 5x5 oder 6x6 - wie sie es vereinbaren. Spieler A sagt einen Buchstaben und schreibt ihn in ein Feld in seinem Quadrat. Das tut auch Spieler B. Sie zeigen einander ihre AB nicht! (Sie können evtl. ein großes Buch als Trennwand zwischen einander aufstellen.)  Dann ist Spieler B dran, sagt einen Buchtaben... usw.  Man kann die gleichen Buchstaben nochmal nennen. Eingetragenes darf man nicht mehr ändern oder löschen.  Das Ziel ist, sinnvolle Wörter zu bilden.  Ist das Quadrat voll, zãhlen sie die Wörter - gewonnen hat, wer die meisten Wörter hat.","Heft / Papier","PA","","buchstabendiktat.png","Idee: Sowieso 1 KB, Wiederholungseinheit","",""],["Halb und halb","","DaF Sprechen","","","","Kooperation","Die L bekommen jeweils die Hälfte von 4 Bildern, die Reihenfolge der Teile auf ihren Arbeitsblättern ist anders.     Sie beschreiben einander ihre Hälften und versuchen die Paare zu finden.    Sie notieren dann in der leeren Hälfte den Buchstaben der passenden Bildhälfte.     Haben sie alle Bilder beschrieben, dürfen sie einander ihre Arbeitsblätter zeigen.","AB / Bilder","PA","","halb.jpg","","",""],["Alles über mich","","Kennen lernen","Erfahrung","Aktivieren","DaF: Sprechen","spielerisch","Die L würfeln und erzählen über sich zu dem erwürfelten Bild: Mein Lieblingseis, das Buch, das ich zuletzt gelesen habe / mein Lieblingsbuch / ein Buch, das ich lesen möchte... - es ist ihnen überlassen, wie sie das Bild interpretieren. Variante: Leeres Spielfeld, die L würfeln, und zuerst auf das Feld kommt, darf etwas reinschreiben oder reinmalen, bevor er/sie erzählt. Die Spieler, die später auf das gleiche Feld kommen, müssen über das erzählen, was ihr Vorgänger bestimmt hat.","Spielfeld mit Bildern oder leeres Spielfeld, Spielfiguren, Würfel","GA","","alles__ber_mich.jpg","","Padlet Sandbox (+ Extra Würfel), FigJam (hat auch Würfel), bewegbare Spielfiguren (Hintergrund entfernt)","Padlet Sandbox (+ Extra Würfel), FigJam (hat auch Würfel), bewegbare Spielfiguren (Hintergrund entfernt)"],["Knick-Quatsch-Prompts","","Aktivieren","DaF Schreiben","","","spielerisch","Die TN schreiben zunächst einen Satz mit \"Ich möchte …\" oben auf das Blatt (z.B. \"ein Rezept für Weihnachtsplätzchen, eine Methode zum Einstieg, eine Erklärung zum Klimawandel ...)\" Sie knickend das Blatt nach hinten, so dass der Text nicht zu sehen ist. Sie geben den Zettel weiter. Die nächste Person schreibt den Zettel dann (ohne den ersten Satz zu kennen) weiter mit: \"Das Ziel ist ...\" (z.B. \"anderen Menschen eine Freude zu machen, TeilnehmerInnen zu aktivieren, anderen einen guten Einstieg in das Thema zu bieten...\") Weiter geht es dann mit \"Die Zielgruppe ist...\" , dann \"Ein Beispiel könnte ... sein. (Vanillekipferl, eine Vorstellungsrunde, das Buch xy ...). Zum Schluss wird noch festgehalten, in welchem Format geschrieben werden soll (als Gedicht, als Liste mit 10 Punkten, als Text mit 400 Zeichen ...). Abschließend kann noch irgend etwas weiteres ergänzt werden. Der Satzanfang lautet: \"Beachte dabei ...\" (Beispiele wären: sehr freundlich formulieren, auch skeptische Menschen ansprechen, vegane Ernährung berücksichtigen...)\". Die Texte werden dann vorgelesen.","Papier","PL / Kettenübung","","","Fobizz Adventskalender 2024","",""],["Diskussionsduett","","Erfahrung","DaF Sprechen","","","spielerisch","Schnelles Diskussionsspiel in Partnerarbeit zu zwei Thesen. Die L sitzen im Kreis. Sie arbeiten zu zweit, jedes Paar holt eine Karte. Sie machen aus, wer oben und wer unten wählt, lesen die Thesen... Die LehrerIn startet die Stoppuhr (1-2 Minuten) und die L führen Argumente für die Position auf, die sie gewählt haben. Nach Ablauf der Zeit geben sie ihre Karte links weiter... (Klappt auch gut bei Stationen - mit Kartenstapel und Sanduhr.) Hier ein Beispiel von Zaubereinmaleins:","Thesen auf Kärtchen, Stoppuhr","PA ODER Kugellager","Sitzkreis oder freier Raum","diskussionsduett_beispiel.jpg","Zaubereinmaleins.de","Wordwall: Vorlage Zufällige Karten oder Öffne die Box, Breakouträume, sie öffnen eine Box oder drehen eine Karte um, diskutieren 1-2 Minuten und drehen die nächste Karte um...","Wordwall: Vorlage Zufällige Karten oder Öffne die Box, Breakouträume, sie öffnen eine Box oder drehen eine Karte um, diskutieren 1-2 Minuten und drehen die nächste Karte um..."],["Synonym-Bingo","","Aktivieren","DaF WS","","","","Die L bekommen eine BINGO-Karte mit verschiedenen Wörtern. Die KL ruft ein Wort aus (z. B. „fröhlich“), und die L müssen ein Synonym (z. B. „freudig“) auf ihren Karten finden. Die L markieren das passende Wort, und der erste L, der fünf Wörter in einer Reihe hat, vertikal, horizontal oder diagonal, ruft „BINGO!“. (Wir können auch weiter spielen - gewonnen hat der L mit den meisten Bingos.)","Bingo-Karten (verschiedene!)","PL","","","","",""],["Grammatik-Detektive","","DaF GR","","","","spielerisch","Die L bekommen AB mit spezifischen grammatikalischen Hinweisen, z.B. „Finde ein Verb in einem Satz aus einem Buch\" oder \"Finde ein Adjektiv auf einem Poster im Klassenzimmer\", „Sammle 5 blaue Substantive aus dem ganzen Raum“, „Finde 3 Substantive in deinen Mathe-Textaufgaben“, „Schreibe alle Eigennamen im Raum auf.“ oder „Finde 5 Verben mit Akkusativobjekt im Text eines Liedes“) Die L können in Teams arbeiten, um so viele Aufgaben wie möglich innerhalb einer bestimmten Zeit zu erledigen.","AB","EA","","","","",""],["Gruselgeschichten im Dunkeln","","Aktivieren","DaF Sprechen","","","","Vorbereitung: Erzählkarten erstellen: Eine Seite mit Bildern und eine mit leeren Schraubgläsern. (Beispiel / Vorlage hier: https://t1p.de/vnoxv) Die zwei Seiten druckt man auf normales Papier aus und man klebt die Glas-Kärtchen auf die Bilder.  Jede Gruppe bekommt eine Packung Kärtchen und eine Taschenlampe. Danach verdunkeln wir den Raum super gut (oder wir spielen das Spiel bei einer Lesenacht, auf Klassenfahrt...).  Die L ziehen eine Karte und beleuchten sie von hinten mit der Taschenlampe - so wird das Bild sichtbar, das sie in ihre Geschichte einbauen müssen.","Karten, Taschenlampe","GA","","","Betzold Verlag, https://de.pinterest.com/pin/265853184245533524/","",""],["Sound Story","Geräuschcollage","DaF Schreiben","Kooperation","","","","Die Idee der Übung ist, eine Geräuschcollage als IMpuls für das Schreiben einer Geschichte zu nehmen.  Die L hören die Geräusche und notieren, was sie hören. Sie vergleichen das nachher in Kleing
