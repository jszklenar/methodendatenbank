en); aus selbst beschafftem Material (egal was), muss aber etwas sein, dass den Gruppenmitgliedern gehört!) die längste Kette machen;  in vorgegebener Zeit aus einem DIN A4-Blatt die längste zusammenhängende Spirale reißen (2– 5 Minuten). Bei den Varianten 1-3 bekommen die Kleingruppen fünf Minuten Bedenkzeit. Während dieser Zeit sollen sie sich auf eine gemeinsame Vorgehensweise einigen. Deshalb darf hier noch nicht Material besorgt oder geknüpft und geknotet werden. Nach Ablauf der Bedenkzeit beginnt die eigentliche vorgegebene Spielzeit. Natürlich darf der Raum zur Materialbeschaffung verlassen werden. Aber das wird den Gruppen erst auf Nachfrage mitgeteilt.","Papier, Büroklammern...","GA","","","","",""],["Partneraufgaben","","Kooperation","Problemlösung","","","","Eine Schleife binden, jeder darf nur eine Hand benutzen. Material: 1 Schuh mit Schnürsenkeln Einen Papierflieger falten, jeder darf nur eine Hand benutzen. Material: 1 Blatt Papier Ein Papierschiff falten, jeder darf nur eine Hand benutzen. Material: 1 Blatt Papier Eine Nadel einfädeln, einer hält die Nadel, der andere den Faden. Material: großöhrige Stopfnadel, Nähgarn Einen logischen (und grammatikalisch korrekten) Satz aus mindestens 10 Wörtern bilden, dabei muss immer ein Wort abwechselnd gesagt werden. Ein Kartenhaus aus 7 Spielkarten bauen. Die Karten müssen paarweise aufgestellt werden. Material: 1 Kartenspiel","","PA","","","","",""],["Farbkarussell","","Aktivieren","","","","","Die TN sitzen im Kreis und bekommen jeweils eine Uno-Karte. Die übrigen Karten behält der SL, deckt diese nacheinander auf und nennt die Spielfarbe der Karte. Die TN, die diese Spielfarbe haben, rücken nach rechts und setzten sich auf den Stuhl oder Schoß ihres Nachbarn. TN, auf denen schon jemand sitzt, rücken nicht weiter. Der TN, der zuerst wieder auf seinem ursprünglichen Platz sitzt, hat gewonnen.","","PL","Stuhlkreis, UNO-Karten","","","",""],["Lernlandschaft","","Präsentation","","","","","Die TN sitzen in einem Stuhlhalbkreis und während des Vortrags baut der SL nach und nach eine Lernlandschaft auf. Entweder in der Mitte auf dem Boden oder vorne wie auf einer Art Bühne oder auf einer Wäscheleine. Zu den wichtigsten Schwerpunkten und Inhalten jeweils etwas auf den Boden legen Stichworte auf bunten Karton geschrieben und Gegenstände, die diesen Begriff illustrieren. Um die TN mit einzubeziehen, kann der SL vorher Karten / Gegenstände an sie verteilen. Wenn das im Vortrag erwähnt wird, ilegt der TN die Karte auf den Boden.","Bunte Karten, Bilder, Gegenstände, Schnur","FA","freie Fläche auf dem Boden in der Mitte","RTEmagicC_Lernlandschaft.jpg.jpg","","",""],["In die Hand sprechen","","Einstieg","","","","","Als Einstieg in den Tag einen Monolog mit der eigenen Hand führen und dabei Aspekte vom Vortrag oder das Programm oder Konfliktpunkte.. ansprechen, möglichst beide Positionen ausleuchten (Sprecher und Hand).","","FA","","","","",""],["Infostreifen-Puzzle","","Input","Wiederholung","Kontrolle","","","Wie Zuordnungsübung – aber nicht auf Papier: Zusammengehörige Infos auf Kärtchen schreiben (bei mehreren Items zwei Farben nehmen!). Die TN finden die Paare (Möglichkeit der Selbstkontrolle: Mit AB oder mit Mustern auf der Rückseite der Karten, die passen.)","Textstreifen","GA","","","","",""],["Innensicht - Außensicht","","UB","","","","","Ein Teil (etwa 2/3) der Gesamtgruppe nimmt als Lernende an der Simulation teil, der Rest sitzt im Außenkreis und beobachtet den “Unterricht”. Bei der Reflexion wird zuerst die Innensicht der Lernenden diskutiert und diese dann um die Außensicht der Beobachter ergänzt.","Beobachtungsbogen","PL","","","","",""],["Interessengruppen mit Konsens","","Gruppenbildung","","","","","Sich in Listen eintragen, nach eigenem Interesse – dann nach Austausch Zuordnung evtl. ändern, um etwa gleich große Gruppen bilden zu können.","Listen","PL","","","","",""],["Internet-Recherche","","Input","","","","WWW","Im Internet zu angegebenen Stichworten ohne Link-Hilfen Informationen sammeln.","","","","","","",""],["Internetspeicher","","Input","","","","WWW","Links oder AB im Internet (z.B. Dropbox) ablegen, die TN entscheiden, was und in welcher Reihenfolge sie studieren / bearbeiten / aufsuchen.","Linkliste","EA / PA / GA","","","","",""],["Interviewprojekt","","Input","","","","Projekt","TN machen mit Experten Interviews, sammeln bei ihrer Institution Material, machen Fotos und Videos, um ein Thema näher zu erkunden. Die L gehen in Kleingruppen an einen Ort in ihrer Stadt, wo sie viele Touristen treffen können. Sie befragen sie dort zu Fragen, die sie vorher gemeinsam in der Klasse ausgehandelt haben. Je nach technischen Möglichkeiten sie machen Aufnahmen oder füllen einen vorher zusammengestellten Fragebogen beim Interview aus. Sie machen als „Beweis” auch ein Foto mit ihnen und dem Touristen. In der Klasse zurückgekehrt werten sie ihre Interviews aus: Sie schreiben eine Reportage, machen eine Statistik... usw.","Kamera, Interviewbogen...","PA / GA","","","","",""],["Intervision","","Kooperation","Problemlösung","Erfahrung","","","TN sitzen im Kreis. Ein TN nennt ein Unterrichtsproblem und beschreibt eine konkrete Situation, in der dieses vorgekommen ist, bzw. evtl. auch seinen Lösungsvorschlag. Der TN mit dem Problem verlässt den Kreis. Die anderen diskutieren das Problem und nennen mögliche Lösungen (wenn... dann...). Nach 10-15 Minuten schließt der KL die Runde, der TN kommt wieder in den Kreis zurück und kann die Lösungsvorschläge kommentieren oder sich einfach nur bedanken.","Tafel / Flipchart / Pinnwand mit Kärtchen","PL","Sitzkreis","","","",""],["Intuitives Durchzählen","","Kooperation","Konzentraion","Wahrnehmung","","","Die TN setzen sich ganz unregelmäßig verteilt im Raum hin. Ziel dieses Spiels ist es, von 1 bis 21 zu zählen. Die Pointe besteht darin, dass es keine vorher festgelegte Reihenfolge gibt, in der die einzelnen Spieler sprechen. Die Abfolge der Sprecher ist ganz zufällig. Jeder bestimmt selbst, wann und wie oft er sprechen will. Niemand darf allerdings zwei Zahlen hintereinander nennen. Wenn zwei Spieler dieselbe Zahl zur selben Zeit nennen, muss die Gruppe wieder bei 1 beginnen. Die Gruppe darf verschiedene „Techniken“ ausprobieren, aber sie darf diese nicht verabreden. Nach ein paar vergeblichen Anläufen stellen sich die Spieler immer mehr aufeinander ein und hören einander besser zu. Sie entdecken, dass ein langsames Tempo in der Regel erfolgreicher ist als ein schnelles. Bei diesem Spiel gibt es also viele Unsicherheiten, aber auf eines können Sie sich verlassen: Das ist der Schrei des Triumphes und der Begeisterung, wenn ein Spieler die 21 ansagt, ohne dass er dabei ein Echo hat. Dieses Spiel kann man häufiger wiederholen. Es funktioniert wie ein Barometer, das die „Gruppenempathie“ misst.","","PL","","","","",""],["Inventur","","Feedback","Reflexion","Evaluation","","","Die geclusterten Kärtchen mit den Erwartungen nach einer Woche / in der Mitte des Seminars noch einmal checken: Welche Erwartungen haben sich schon erfüllt / zum Teil erfüllt? Was fehlt noch? Welche Befürchtungen sind eingetroffen? (Kommt Neues hinzu?) TN markieren die Kärtchen mit versch. Zeichen (!, Blitz, Fragezeichen...)","","EA --> PL","","","","",""],["Jurte","","Kooperation","Gruppendynamik","Konzentration","Aktivieren","","TN stehen im Kreis, schauen zur Kreismitte und fassen sich an den Händen. Durchzählen: 1-2-1-2... Auf Kommando lässt sich jeweils jeder TN mit der Nr. 2 nach innen, die mit der 1 nach außen fallen. Es entsteht eine Zick-Zack-Formation, die sich gegenseitig hält. Die Gruppe kann versuchen, inwieweit sich jeder nach vorne bzw. nach hinten lehnen kann ohne dass der gesamte Kreis auseinander bricht. Wenn sie geschickt sind, können sie am Ende einfach hin und herschaukeln.","","PL","Stehkreis","","","",""],["Farbkleckse","","Input","DaF LV","","","","In Texten Lücken schaffen, indem man Farbkleckse auf das Papier malt. (Hälfte / Anfang / Ende der Wörter sichtbar.)","AB","EA / PA / GA3","","","","",""],["Kärtchenabfrage","","Erfahrung","Ideen","Erwartung","","","Zu einer Leitfrage / einem Thema / zum Seminarprogramm werden Infos / Ideen / Anregungen / Wünsche... auf Kärtchen festgehalten. (Pro Karte 1 Idee, max. 3 Zeilen). Weiterführung: Clustern, Hochpunkten...","Kärtchen, Pinnwand","EA --> PL","U, Fächer","","","",""],["Beidseitig / Wendekarten","","Üben","Kontrolle","","","Selbstkontrolle","Auf Karten Aufgaben / Fragen präsentieren, die Lösung ist auf der Rückseite.","Kärtchen (evtl. laminieren)","EA / PA / GA","","","","",""],["Kevin can't wait","","Kooperation","Gruppendynamik","Konzentration","","","Die Gruppe steht nebeneinander in der Reihe. Aufgabe: Der Reihe nach einmal in die Hände klatschen. Erst klatscht der Trainer, dann Schüler A, dann Schüler B, dann Schüler C, …  Aufgabe: Abwarten bis ich dran bin - einen Impuls zurückhalten.","","PL","","","","",""],["Kim","","Wahrnehmung","Aktivieren","Einstieg","DaF WS","Wettbewerb","Informationen (Bildfolge, Wimmelbild, Geräusche, Wörter, Gerüche...) nur kurz präsentieren. Danach sollen die TN versuchen, sich an möglichst viele Infos zu erinnern.","Bild, Gegenstände, HV...","FA","","Vattenfall_Wimmel_Seitelinks.jpg","","",""],["Klammerkarte","","Üben,","Erfahrung","DaF WS","DaF GR","Selbstkontrolle","Auf einer Karte eine Aufgabenstellung und dann untereinander links und recht Aussagen notieren. Bei “richtig” eine Wäscheklammer einstecken. Auf der Rückseite ist die Position der richtigen Lösung markiert.","AB aus festem Karton, Wäscheklammern (klein)","EA / PA","","Klammerkarte_8.jpg","","",""],["Klatsch-Rhythmus-Kanon","","Kooperation","Gruppendynamik","Aktivieren","Konzentration","","Gleichhzeitig beginnen die TN die Partitur zu klatschen, so wie sie sie aus ihrer jeweiligen Perspektive sehen. Begonnen wird oben links nach oben rechts (d. h. mit der ersten Zeile), dann wird mit der zweiten Reihe weitergemacht, u.s.w.  Dabei steht ein schwarzer Kreis für Klatschen, ein weißer Kreis für Nicht-Klatschen. Ziel ist es, dass ie Partitur wird in die Mitte gelegt. Die TN  stehen um die  Partitur, so dass auf jeder der vier Seiten etwa die gleiche Zahl an Personen steht. Der SL (oder ein TN) zählt an und gleicdie Partitur mind. einmal (oder zwei-/dreimal) fehlerfrei durchgeklatscht wird. Der Schwierigkeitsgrad und der Spaß kann erhöht werden, wenn andere Symbole oder Farben eingeführt werden, die beispielsweise für Stampfen, Schreien oder in die Luft springen stehen könnten.","\"Partitur\"","PL","freie Fläche auf dem Boden in der Mitte","partitur.jpg","","",""],["Klebepunkte-Bewertung","","Feedback","","","","","Jeder TN / jede Gruppe bekommt nur eine bestimmte Anzahl von Klebepunkten / Bonbons... und verteilen diese an die anderen TN / Gruppen. Vorher Kriterien diskutieren!","Klebepunkte","EA / GA","","","","",""],["Knickzettel","","Feedback","Evaluation","","","","Ein Blatt in 3 Teile falten und in den einzelnen Bereichen zu unterschiedlichen  Fragen / Aspekten Kommentare festhalten. Danach herumgehen lassen, wenn SL stopp sagt, behält man den Zettel in der Hand. Reihum die einzelnen Aspekte vorlesen, evtl. im PL kommentieren.","A4-Blatt","EA --> PL","Sitzkreis","","","",""],["Kometenhagel","Gruppenjonglage","Kooperation","Gruppendynamik","Konzentration","","","Der schnelle Ball mit 3-6 verschieden großen Bällen, die reihum in Umlauf gesetzt werden. Ohne Zeitvorgabe. Null Fehlertoleranz!","3-6 verschiedene Bälle","PL","freier Raum","","","",""],["Kommunikationsallee","","Kooperation","Aktivieren","Einstieg","DaF Phonetik","","Die Gruppe teilt sich in Paare auf; die Partner stehen sich in etwa 10 - 20 Meter Abstand gegenüber. Die Aufgabe ist, eine Botschaft von etwa 50 Wörtern so laut und deutlich wie möglich dem Partner zuzurufen, der Partner soll die Botschaft notieren. Dann mit getauschten Rollen weiteren Text kommunizieren.","kurze Texte (pro Paar eins, jeweils halbiert)","PA","im Freien","","","",""],["Kommunikationsnetzwerk","","Kooperation","Problemlösung","Wahrnehmung","","","Die Gesamtgruppe teilt sich in drei Untergruppen A, B, C auf. Die Gruppen stellen sich so auf, dass Gruppe B beide Gruppen sehen kann, die Gruppen A und C aber jeweils nur B sehen können (hierfür kann eine Trennwand nützlich sein). Gruppe B und C dürfen sprechen. Alle Gruppen sitzen jeweils im Stuhlkreis. Gruppe A erhält folgende Aufgabe (auf einem AB), die von der Gesamtgruppe zu lösen ist: „Die Aufgabe für eure Gruppe: Achtung! Ab sofort dürft ihr nicht mehr sprechen! Eure Aufgabe als Gesamtgruppe ist folgende: Gruppe C hat ein (etwa vier Meter langes) Seil zur Verfügung und vier Wäscheklammern. Aus  dem Seil hat Gruppe C ein Quadrat auf dem Boden zu legen. Alle Seiten des Quadrates müssen gleich lang sein! Es wird nur eine Differenz von 10 cm toleriert. Während der ganzen Übung dürft ihr nicht sprechen! Die Übung wird beendet, wenn alle Teilgruppen der Meinung sind, sie haben die Aufgabegelöst.","Seil (etwa 4 m lang), 4 Wäscheklammern, AB für Gruppe A, Tücher zum Verbinden der Augen von Gruppe C, Pinnwand","GA","","","","",""],["Kompetenzkreuz","","Reflexion","","","","","Einen Matrix vorbereiten mit den Feldern: Ich kann es gut / Ich mache es gern (oben), Ich kann es nicht (so) gut / Ich mache es nicht (so) gern (unten). TN schreiben Beispiele in die Felder – geeignet, um Lernpartnerschaften zu bilden, Lernziele für die nächste Phase zu formulieren, festzustellen, welche Aufgaben man in einer größeren Aufgabe / bei einem Projekt übernehmen möchte.","AB","EA --> GA","","","","",""],["Komplimente","","Aktivieren","Feedback","Gruppendynamik","","","Dem Partner (oder wechselnden Partnern bei Sprechmühle) ein positives Feedback geben: Zu Verhalten / Aktivitäten...","Musik","CP","freier Raum","","","",""],["Kontrollfolie","","Kontrolle","","","","Selbstkontrolle","Für Zuordnungsübungen: A und B mit geraden Linien miteinander verbinden (Ausgangspunkt markieren) und eine Kontrollfolie auflegen, auf denen die Linien markiert sind. (Variante: Markierung auf einer Klarsichthülle, das Lösungsblatt einfach reinschieben).","Folie, Klarsichthülle","EA / PA / GA","","","","",""],["Kooperative Text-/Fotorallye","","Kooperation","Input","Wahrnehmung","","","Auf dem Stadtplan mehrere Rundgänge markieren und jeden Rundgang halbieren. TN laufen in entgegengesetzter Richtung die Rundgänge, machen Fotos nach angegebenen Aspekten und beschreiben detailliert die Bilder bzw. den Standpunkt, aus dem sie die Bilder gemacht haben. Auf halber Strecke tauschen sich die Gruppen die Beschreibungen und versuchen aufgrund dessen möglichst genau die Fotos zu machen.","AB, Kamera, Stadtplan","GA","im Freien","","","",""],["Kontrollierter Dialog","","Kooperation","Wahrnehmung","","","","In Dreiergruppen werden die Rollen A, B und C verteilt. A und B wählen ein Thema und sprechen dann 15 Minuten darüber. Insgesamt dauert die Übung 45 Minuten plus die Auswertung. A beginnt mit einem Satz, am besten mit einer These. B wiederholt in eigenen Worten das, was er verstanden hat. A prüft, ob das Wiederholte dem entspricht, was er gemeint hat. Wenn ja, dann bestätigt er mit \"richtig\". Wenn B etwas vergessen oder entstellt hat, dann antwortet er mit \"falsch\". B wiederholt nun nochmals in eigenen Worten das, was er von diesem ersten Satz verstanden hat. Wenn A sich immer noch falsch verstanden fühlt, wiederholt A noch einmal die eigene Aussage. A und B arbeiten so lange an einem Satz, bis sich A von B genau verstanden fühlt. Erst dann darf B mit einem eigenen Satz antworten. Und A wiederholt dann diese Antwort. Evtl. wiederholt sich obiges Vorgehen solange, bis sich B verstanden fühlt. C ist dabei Beobachter und achtet nur darauf, dass die Spielregeln eingehalten werden. Nach 15 Minuten werden die Rollen gewechselt. (Durch kürzere Fristen lässt sich die Übung für die Beteiligten evtl. etwas spannender gestalten. Auch die Festlegung eines anerkannt strittigen Themas mit kontroversen Positionen könnte dazu beitragen.)","","GA3","","","","",""],["Kooperativer Turmbau","","Kooperation","Gruppendynamik","Problemlösung","","","Bei dieser Aktivität bauen die TN einen möchlichst hohen freistehenden Turm, der 1 Minute lang ohne Hilfe stehen bleibt.","8 DIN A4-Blätter + Schere und Klebestift","GA","","","","",""],["Kopf leer machen","","Aktivieren","","","","","TN sprechen am Anfang eines neuen Themenblocks / nach dem Mittagessen / zum Tagesstart... mit dem Nachbarn 2-3 Minuten lang über alles, was sie im Moment beschäftigt.","","PA","","","","",""],["Körperteiltanz","","Aktivieren","Körpersprache","","","","Auf Kommando werden nach und nach alle Körperteile auf die Musik bewegt.","","PL","","","","",""],["Kopiertanz / Kasatschok","","Wahrnehmung","Körpersprache","","","","TN stehen im Kreis. Einer von ihnen tanzt etwas vor und die anderen machen es nach. Reihum sind alle dran.","","PL","Stehkreis","","","",""],["Körperkontakt","Po an Po","Aktivieren","DaF WS","","","Bewegung","TN bewegen sich auf Musik. Wenn die Musik aufhört, gibt der KL ein Kommando: “Knie an Knie” oder “rechte Hand auf linke Schulter” - TN müssen schnell einen Partner finden und das Kommando ausführen. Mit einfachen Aufgaben beginnen! Am besten ungerade TN-Zahl: Wer keinen Partner findet, sagt das nächste Kommando!","","PL","freier Raum","","","",""],["Kreativspiel-Stadtspaziergang","","Input","","","","","Zu ausgewählten Standorten Quizfragen formulieren und dazu 3-4 plausible Antworten (mit jeweils einem Körnchen Wahrheit) formulieren. Die TN positionieren sich zu den Antworten, für die richtige Lösung gibt es Punkte. Der Reiseleiter löst die Aufgabe und erzählt dann Näheres dazu.","Für die spielerischen Aufgaben: Papier, Bierkronen, Bierdeckel, Kreide, Obst (Kirsche), Becher, Eimer, Locher / Schaffnerzange / Stanzer, Namenskärtchen und Sicherheitsnadeln","PL (GA)","in der Stadt","","","",""],["Streichhölzer legen","","Kooperation","Kommunikation","Wahrnehmung","DaF Sprechen","","PA: Die TN sitzen Rücken an Rücken, jedes Paar hat ca. 20 bis 30 Streichhölzer. Beide legen gleichzeitig eine Figur mit 10 bis 15 Streichhölzern. Dann beschreibt ein TN dem anderen, wie seine Hölzer liegen, der andere soll nach dieser Anweisung die Figur nachlegen (neben der eigenen Figur). Rückfragen sind nicht erlaubt. Dann Wechsel. Am Ende schauen sie beide die Ergebnisse an und stellen fest, dass es gar nicht so einfach ist, genau zu beschreiben.","1 Pckg Streichhölzer pro Paar","PA","","","","",""],["Kriteriengruppen","","Gruppenbildung","","","","","Kriterien angeben (z.B. jemand aus Asien; jemand, der Französisch spricht; jemand U30; usw.) In jeder Gruppe muss für jede Kategorie ein Teammitglied „nominiert“ sein.","Kärtchen / Flipchart","PL","","","","",""],["Kugellager","Zwiebelgespräche, Innenkreis-Außenkreis","Einstieg","Feedback","Konzentration","DaF Sprechen","Bewegung","Die Lernenden stehen oder sitzen in einem Doppelkreis und tauschen sich über eine Frage mit ihrem Gegenüber aus / erzählen einander etwas / geben Informationen weiter / erklären ein Wort.... Nach 5 Minuten gehen die TN im Außenkreis 2 Positionen / Stühle weiter. Sie berichten dem neuen Partner von den Infos, die sie in der vorigen Runde gehört haben und tauschen sich dann über eine neue Frage aus. 3-4x wechseln, kein Plenum hinterher. Bei Wörter erklären und bei mündlichen Grammatikübungen (z.B. Ein Problem nennen „Ich habe keinen Appetit. / Ich schlafe nicht gut. / Mir tut der Bauch weh...” - der Partner gegenüber soll einen Rat geben: „Mach lange Spaziergänge oder Sport. / Schlafe bei offenem Fenster..... ) einen kompletten Kreis machen.","Signal (Pfeife, Klingel...)","PA","doppelter Steh- oder Sitzkreis","kugellager-klassisch.jpg","","",""],["Landeskundliche Spionage","7","Wahrnehmung","Input","","","Projekt","Zu ausgewählten Aspekten sammeln jeweils 2-3 TN Erfahrungen / Erlebnisse / Beweismaterial in einem angegeben Zeitraum. Die Spionagethemen dürfen sie einander in der Gruppe nicht verraten, jeder weiß nur, wer noch das gleiche Thema hat. Diese Spione können sich regelmäßig austauschen, einander beraten und Suchaufgaben formulieren.","AB","PA","","","","",""],["Längster Atem","","Kennen lernen","Namen lernen","","","","Die TN sitzen oder stehen im Kreis. Der SL holt tief Atem, geht im Kreis herum und nennt die Namen der TN, an denen er gerade vorbeigeht. Wenn ihm der Atem ausgegangen ist, übernimmt der letzte genannte TN seine Rolle. Sieger wird, wer die meisten Namen in einem Atemzug nennen kann. Damit alle dran kommen, geben diejenigen, die es ein zweites Mal trifft, ihre Rolle an einen Nachbarn ab, der noch nicht dran war.","","PL","Stehkreis","","","",""],["Geländekarte","","Reflexion","","","","","Bei Stationenlernen o.ä. autonomen Lernformen: Die Informationen zu den Inhalten / Arbeitsformen an den Stationen sind in einer Landkarte untergebracht, nach Erledigung der Station die entsprechenden “Etappen” markieren und Bearbeitungsreihenfolge malen.","A3-Blatt","PA","","","","",""],["Laufzettel als Tabelle / Speisekarte","","Lernprozess begleiten","Präsentation","","","","Bei Stationenlernen o.ä. autonomen Lernformen: Die Informationen zu den Inhalten / Arbeitsformen an den Stationen sind in einer Tabelle untergebracht, in der die bearbeiteten Stationen abgestempelt und evtl. auch bewertet werden können.","AB","PA / GA","","","","",""],["Laurentia","","Aktivieren","","","","Bewegung","TN stehen im Kreis und fassen sich an den Händen. Bei folgendem Lied gehen sie bei LAURENTIA und bei den Wochentagen in die Knie. “Laurentia liebe Laurentia mein, wann werden wir wieder zusammen sein? Am Montag (in jeder Strophe neuer Wochentag)! Ach wenn es doch jeden Tag Montag (Montag, Dienstag... - immer alles wiederholen) wär und ich bei meiner Laurentia wär! Laurentia”.","","PL","Stehkreis","","","",""],["Lebendige Litfasssäule","","Präsentation","DaF Schreiben","DaF Sprechen","","Bewegung","TN schreiben die wichtigsten Infos auf 2 A3-Blätter und befestigen sie sie vorne und hinten an der Kleidung mit Wäscheklammern. Sie gehen herum, studieren die Blätter, und bei interessanten / kontroversen Aspekten verlangen sie weitere Infos / Klärung bzw. diskutieren die Aspekte.","2 DINA3-Blätter pro TN, Wäscheklammern oder Schnur","CP","","","","",""],["Lebendiges Memory","","Aktivieren","Konzentration","DaF WS","","","Zwei TN gehen aus dem Raum. Die anderen verteilen unter sich Wörter, die nach dem gleichen Prinzip zusammenhängen (Teil-Ganzes, Oberbegriff-Unterbegriff, Gegensatzpaare...) und die Paare verteilen sich im Raum. (Kreis oder Matrix). Die zwei TN kommen rein und drehen nacheinander nach den Spielregeln von Memory nicht Karten, sondern Menschen um: Sie sagen die Namen, und die Personen nennen dann ihr Wort. Finden sie Paare, so gehen diese 2 TN aus dem Kreis und stellen sich zu dem TN, der sie gefunden hat.","Ball","PL","","","","",""],["Leitfragen-Reflexion","","Reflexion","","","","","TN reflektieren vorige Arbeitsschritte bzw. diskutieren ein Thema anhand von 4-6 Leitfragen. Gruppenstandpunkt kann schriftlich formuliert werden oder Gruppensprecher berichten kurz im Plenum.","","GA --> PL","","","","",""],["Lernwerkstatt","","Input","Erfahrung","Transfer / Anwendung","","Autonom","Großes Stationenlernen (Angebot: evlt. 8X des Mininalpensums) mit individuellen Lernzielen. Auch Aufgaben möglich, bei denen die TN konkret etwas erstellen (Spielmaterial, Aufgaben, Übungen...)","","PA / GA","","","","",""],["Lernziehharmonika","","Wiederholung","Erfahrung","Input","DaF WS","Selbstkontrolle","Einen langen Papierstreifen wie eine Ziehharmonika falten. Auf die Felder abwechselnd Aufgabe-Lösung schreiben. Die Schüler können sie auch selbst basteln, sie funktioniert gut mit Antonymen, Synonymen, Bild-Wort, dt. Wort-Wort in der Muttersprache, Präsens – Perfekt, Verb und Valenz, Satz umformen, fehlende Satzteile ergänzen – also alles, wo es nur EINE Lösung möglich ist.","langer Papierstreifen","EA / PA","","lernzielharmonika_perfekt.jpg","","",""],["Lernzirkel","Stoffparcour","Wiederholung","Input","","","Autonom","Stationen bearbeiten: Alle Stationen sind Pflichtstationen (Ausnahme: Puffer- und Erholungsstation). Reihenfolge jedoch nicht gebunden.","AB","PA / GA","","","","",""],["Leserallye","","Input","DaF LV","","","Autonom","Die Rallye-Teams fahren jeweils zu zweit (Pilotin und Kopilotin) durch eine „Leselandschaft“ aus (in ca. fünffacher Ausführung) fotokopiertem Lesestoff aus der Fachliteratur zum behandelten Thema. Die Teams erhalten „Landkarten“, d.h. Ein Verzeichnis der ausliegenden Literatur; diese ist in Rubriken gegliedert; die Aufschriften der „Aussichtstürme“ sind identisch mit dem Rubriken auf der Landkarte. Die Teams stellen ihre Route anhand der Landkarten selbstständig zusammen. Wenn sie einen Text gelesen haben, machen sie sich Notizen auf einem Beobachtungsblatt und hängen diese Blätter an den Aussichtsturm (Ansichten, Einblicke und Fragen). Für die Nachbesprechung muss ausreichend Zeit zur Verfügung stehen, da in dieser Phase das von den TN erarbeitete Wissen an die anderen TN weitergegeben wird, bzw. Fragen diskutiert und geklärt werden.","kurze Texte, Wäscheleine, \"Laufzettel\" für jedes Paar, Auswertungsplakate an den Säulen.","PA","","","","",""],["Lied-Pantomime","","Aktivieren","Körpersprache","DaF HV","","Bewegung","TN stellen den Inhalt eines Liedes als Pantomime da. Geht vor allem gut mit Liedern, die viel Refrain haben.","Lied","EA","","","","",""],["Lücken füllen","","Einstieg","Konzentration","DaF HV","","","Einen Liedtext mit Lücken (vergrößert) kopieren, die Lücken auf einzelnen Kärtchen in jede Gruppe geben. Variante 1 mit Vorbereitung: Die TN überlegen, was wohin passt und beim Hören überprüfen sie ihre Hypothesen. Variante 2: Kärtchen beim Hören in die Lücken hineinlegen.","Lied, Liedtext mit Lücken,","EA  --> GA","","","","",""],["Lücken pflücken","","Konzentration","Aktivieren","DaF WS","DaF HV","Bewegung","Variante 1: Wörter aus dem Lied auf Kärtchen schreiben und auf einem Tisch auslegen. Die Lernenden in gleich große Gruppen aufteilen. Pro Gruppe brauchen wir einen Tisch mit einem Kartenset.  Beim Hören des Liedes tanzen die Lernenden – im Tempo des Liedes!!! - um den Tisch herum und pflücken schnell die Wortkarte, wenn sie das Wort hören.  Variante 2: Einen Liedtext mit Lücken (vergrößert) kopieren, die Lücken auf einzelnen Kärtchen in jede Gruppe geben. Variante 3 mit Vorbereitung: Die TN überlegen, was wohin passt und beim Hören überprüfen sie ihre Hypothesen. Kärtchen beim Hören in die Lücken hineinlegen.","Lied,  Wortkarten (evtl. laminiert9","EA","","DSCN5802.JPG","","",""],["Lückenhandout","","Präsentation","DaF HV","","","","Input unterstützen mit einem lückenhaften Handout (Modell, oder nur Stichpunkte)","AB","FA","","","","",""],["Lückentext mit Schüttelkasten","","Input","Präsentation","DaF LV","","","Im Text Schlüsselwörter löschen. Unten in einem Schüttelkasten durcheinander die Wörter angeben, diesen Teil nach hinten umknicken. TN entscheiden, ob sie die Aufgabe mit oder ohne Hilfe lösen.","AB","EA --> PA --> PL","","","","",""],["LÜK-Kasten","","Üben","DaF WS","DaF GR","DaF LV","Selbstkontrolle","Eine Zuordnungsübung für haptische Lernende mit Selbstkontrolle: s. http://www.luek.de/index.xtp  - man kann es aber auch selbst basteln!","LÜK-Kasten, AB","EA / PA","","L_K.jpg","","",""],["Mach weiter so!","","Gruppendynamik","Feedback","","","","Jeder TN bekommt ein A4-Blatt, er schreibt seinen Namen drauf, erstellt eine Tabelle mit 3 Spalten: „Mach weiter so!” / „Hör damit auf!” / „Fang damit an!” und legt das Blatt auf seinen Platz. Alle gehen herum, und schreiben Kommentare in Form von Ich-Botschaften auf die Blätter der anderen. („Mich stört es, wenn du nicht zuhörst, wenn wir unsere Ergebnisse präsentieren.” Niemand darf beim eigenen Blatt stehen bleiben. Man darf in die Spalte 2 und 3 nur schreiben, wenn man auch etwas in die erste Spalte geschrieben hat. Die Kommentare darf man unterscheiben, wenn man möchte. Am Ende geht jeder an seinen Platz zurück, liest das Blatt. In Form von einem Blitzlicht können die TN sagen, was für sie vom Feedback am wichtigsten war.","AB / A4-Blatt","EA --> PA","","","","",""],["Markierte Materialien","","Gruppenbildung","","","","","Arbeitsblätter mit Farbpunkten markieren / AB auf unterschiedliche Farben drucken. Die TN finden die Kollegen, die die gleichen Farben haben.","bunte Klebepunkte / buntes Papier","","","","","",""],["Materialpuzzle","","Transfer","Üben","","","","Zerschnittenes Material (hier: Lehrwerkteile) in eine sinnvolle Reihenfolge bringen (hier: Ablauf nach dem Phasenmodell).","Puzzleteile","PA / GA","","","","",""],["Medium","","Aktivieren","Wahrnehmung","","","","SL und zweiter SL (oder ein eingeweihter TN) erklären, dass sie telepathische Verbindung zueinander haben. Sie bereiten einen Tisch mit Gegenständen vor. Einer von ihnen geht aus dem Raum, die TN bestimmen einen Gegenstand, den das Medium finden soll. Das Medium wird reingeholt, der Partner zeigt nacheinander auf Gegenstände, benennt sie und fragt, ob die gemeint sind. Vorher wurde ein System vereinbart, z.B. Der Partner zeigt auf die Gegenstände, und wenn er einen auch berührt, dann ist der 2.... folgende Gegenstand , der gemeint war. Die TN raten, wer eine Idee hat, geht mit dem Medium raus. Hat er Recht, dann ist er das nächste Medium.","viele kleine Gegenstände","FA","Tisch in der Mitte oder freie Fläche auf dem Boden","","","",""],["Mehrfachwahlaufgabe mit Lösungsschlüssel","","Üben","","","","Selbstkontrolle","Die einzelnen Distraktoren werden nicht mit 123 oder abc, sondern mit unterschiedlichen Buchstaben gekennzeichnet. Bei richtiger Lösung ergibt sich nach Zusammenlesen der Buchstaben ein Lösungswort / -spruch. Wörter oder Sprüche nehmen, die die TN nicht zu schnell entziffern, sonst erübrigt sich das Lösen der Übung.","\"Zahlenschloss\", AB","EA / PA / GA","","","","",""],["Mein Lieblingsplatz","","Evaluation","","","","","Am Ende des Seminars stellen sich die TN an einen Platz im Seminarraum (zu Materialien / zu Plakaten...), der für sie den wichtigsten Inhalt / die wichtigste Phase repräsentiert. Jeder TN darf kurz kommentieren. Möglich, sich beim Kommentieren im Raum zu bewegen und dadurch mehrere Orte zu benennen.","","EA --> PL","","","","",""],["Mein Platz","Freibad","Evaluation","Transfer","","","","Auf einem Plakat wird der Grundriss von einem Zirkus präsentiert (Manege, Garderobe, Vorraum, Zuschauertribüne, Stehplätze, Regie-Loge, Schminkraum, WC, Büfett, Kasse, Beleuchtung, Technikraum, Tierkäfige, die Umkleidekabine der Darsteller...) Wir können aber auch andere Schauplätze wählen, das den TN-n bekannt ist, Piratenschiff, Theater, Burg... Möglich auch mit Tesa-krepp auf dem Boden und Kärtchen. Die TN schreiben ihren Namen in den Teil des Plakats, wo sie sich sehen, in einem Teil dürfen auch mehrere Namen stehen. Jeder TN begründet seine Entscheidung, die anderen in der Gruppe sagen dann auch, wo sie ihn sehen. Variante: Mein Platz bei dieser Aufgabe / beim Projekt.","Plan","EA --> PL","freier Raum","","","",""],["Mein Symbol","","Kennen lernen","","","","","TN malen für sich ein Symbol und stecken es an. Cocktailparty: Sie gehen herum, versuchen die Symbole der anderen zu deuten bzw. fragen danach, was sie für die Person bedeuten.","A4-Blatt, Buntstifte, Wäscheklammer","EA --> CP","freier Raum","","","",""],["Memorykarten","","Gruppenbildung","DaF Sprechen","DaF WS","","","Memorykarten verteilen, TN beschreiben die Karte (zeigen sie einander nicht) und finden den Partner.","Memorykarten","CP","freier Raum","","","",""],["Messe","","Präsentation","","","","","Gruppenergebnisse werden in 2 Rundgängen (2x 15 Minuten) von den TN vorgestellt. Die Hälfte der TN sind Messebesucher und lernen die Ergebnisse der anderen Gruppen kennen, die anderen bleiben als \"Informationspersonal\" am Messestand stehen. Im 2. Rundgang Wechsel.","Pinnwände, Plakate, Signal (Klingel, Pfeife...)","GA","größerer Raum","","","",""],["Methodenkoffer","","Ideen","Erfahrung","","","","TN legen ihre Ideen in einen “Methodenkoffer”. Nach dem Sammeln werden die Ideen an die Wäscheleine gehängt und gelesen (danach Auswahl für eine Simulation / für eine Unterrichtsphase), oder sie werden vorgelesen und geordnet, dann hochgepunktet und ggf. simuliert","AB, Koffer","EA --> PL","Sitzkreis","","","",""],["Methodenkoffer packen","","Reflexion","Evaluation","Transfer","","","Aus persönlicher Sicht wichtige Inhalte eines Seminars sortieren: Was nehme ich mit? Was packe ich zu Hause gleich aus? Was mache ich damit? Zuerst machen die TN Notizen, dann diskutieren sie in Kleingruppen mit Personen ihrer Wahl. Highlights evtl. im Plenum ansprechen, vor allem mit Schwerpunkt auf Transfermöglichkeiten.","evtl.AB","EA","","","","",""],["Methodenteppich","","Reflexion","Präsentation","Visualisierung","","","Um Transparenz zu schaffen bzw. um das Führen des Methodentagebuchs zu unterstützen und das Erinnern bei der Endreflexion zu erleichtern, die eingesetzten Methoden Tag für Tag auf einem Plakat mit Kärtchen in unterschiedlichen Farben festhalten.","bunte Karten, großes Packpapier","","","Methodenteppich.JPG","","",""],["Methodisches Tagebuch","","Reflexion","Transfer","","","","TN notieren als persönliches Tagebuch, was an dem Seminartag passiert ist, z.B.: Was haben wir gemacht? Wie haben wir gearbeitet? Wie kann ich es umsetzen?","AB","EA","","","","",""],["Mind map","","Präsentation","Input","Ideen","DaF WS","","Zu einem zentralen Begriff systematisiert und geordnet weitere Begriffe notieren: Auf dicken Hauptästen Obergebriffe, auf dünneren Ästen die Unterbegriffe. Verschiedene Farben und Symbole nutzen, Verknüpfung / Beziehungen zwischen den Ästen verdeutlichen.","A3-Blatt, dicke und dünne Filzstifte","EA / PA / GA","","","","",""],["Mind map-Programm","","Präsentation","","","","","Das Programm des Tages / des Seminars wird in Form einer Mind Map präsentiert, in der auch die Zusammenhänge und die Reihenfolge der einzelnen Themenblöcke gekennzeichnet ist.","Plakat","FA","","","","",""],["Mind map zu einer Person","","Kennen lernen","","","","","Sich mit einer Mind map vorstellen – die anderen / der Partner fasst dann zusammen, was sie über die Person erfahren haben.","","FA","","","","",""],["Mix-Gruppen","Jigsaw","Präsentation","","","","","Für Aufgaben mit wahrscheinlich unterschiedlichen Ergebnissen oder zu unterschiedlichen Aspekten. Gruppen bilden mit Karten: Zuerst arbeiten alle mit dem gleichen Symbol zusammen, in der Auswertungsrunde gibt es dann neue Gruppen (alle Könige / Asse / Damen / Buben...). Vorteil: Jeder TN muss das Gruppenergebnis präsentieren.","Karten","GA","","","","",""],["Mix-Gruppen wandernd","","Präsentation","","","","","s. Mix-Gruppen. Gruppen nummerieren. Ein Gruppenmitglied bleibt sitzen. jeweils ein Vertreter geht an den nächsten Tisch, einer an den übernächsten Tisch. … usw. Ziel ist, dass jeder TN min. 3-4 Ergebnisse kennen lernt.","","GA","","","","",""],["Bewegungskanon","","Aktivieren","Konzentration","","","Bewegung","1. 3x in die Hände klatschen, 2. 3x auf die Oberschenkel schlagen,, 3. 3x die Hände in die Luft strecken, 4. 3x mit beiden Füßen auf den Boden stampfen  Wenn die Gruppe es gut kann, Gruppe in 4 Teile teilen und wie bei Kanon zeitversetzt die Bewegungen machen.","","PL","Sitzkreis","","","",""],["Der Mond ist rund","","Aktivieren","Konzentration","","","","Der sl hält einen Stift in der Hand, mit dem er zu dem Spruch: „Der Mond ist rund, der Mond ist rund. Er hat zwei Augen, Nase, Mund.“ einen Mond in die Luft zeichnet. Er gibt den Stift mit der Hand, mit der er nicht gemalt hat, an seinen Nachbarn weiter und sagt dazu: „Und das war richtig!“. Jetzt versucht die Gruppe, einer nach dem anderen, genau dasselbe zu machen. Der Spielleiter kommentiert dann immer, ob es richtig oder falsch war. Dabei kommt es nicht aufs Malen an, sondern nur darauf, wie der Stift weitergegeben wurde.","Stift","PL","Sitzkreis","","","",""],["Indianernamen","","Kennen lernen","Namen lernen","DaF WS","","","Für das  Spiel bekommt jeder TN einen Zettel und einen Stift. Die Aufgabe ist, sich einen Indianernamen zu überlegen (Adj. + Subst.), der auf besondere Ereignisse oder Eigenschaften hinweist. Danach setzen sich alle im Kreis zusammen und stellen ihre Namen vor.","Zettel","EA --> PL","Sitzkreis","","","",""],["Gruppenfinger","","Kooperation","Problemlösung","","","","Der SL teilt die Gruppen in Kleingruppen auf. Jede Kleingruppe setzt sich an einen Tisch. Dann nennt der SL eine Zahl. Aufgabe der TN in jeder Kleingruppe ist es, die genannte Zahl mit den Fingern darzustellen. Die Gruppe, der das am schnellsten gelingt, ist Rundensieger.","","GA","Gruppentische","","","",""],["Genau so oder ganz anders","","Feedback","Gruppendynamik","","","","Vorab schreibt der SL verschiedene Eigenschaften auf Zettel; dabei kann er sich von Horoskop-Texten anregen lassen. Die Zettel werden zusammengefaltet und kommen in einen Korb. Die Gruppe setzt sich im Kreis zusammen. Der Korb geht reihum, jeder nimmt sich einen Zettel. Der erste Spieler entfaltet den Zettel und liest ihn vor. Dann muss er sich für einen TN im Kreis entscheiden, auf die diese Eigenschaft sehr oder überhaupt nicht zutrifft und seine Wahl begründen. Der genannte TN muss dazu Stellung nehmen und sagen, wie er sich selbst in dem genannten Punkt einschätzt. Das Spiel setzt eine vertrauensvolle Atmosphäre voraus!!!","Eigenschaftenkärtchen","PL","Sitzkreis","","","",""],["Schlamperpfand","","Aufräumen","Gruppendynamik","Auflockern","","Ritual","Im Raum liegen Gegenstände, die verschiedenen TN gehören, ungeordnet herum. In der ersten Phase des Spiels sammeln alle TN diese Gegenstände und legen sie in eine große Kiste. Darüber legt der SL ein Tuch. Dann wird \"gepfändet\", und zwar sagt der SL folgenden Spruch: \"Was soll das Schlamperpfand in meiner Hand für eine Buße tun?\" Die TN überlegen sich nun eine \"gerechte\" Strafe, die sofort ausgeführt werden muss, Derjenige, dem der Gegenstand gehört, muss nun die Strafe ausführen.","Kiste, Tuch","PL","Sitzkreis / U","","","",""],["Hier passt etwas nicht","","Aktivieren","Wahrnehmung","DaF WS","","","Jede Gruppe soll mehrere Gegenstände, die zueinander passen, zusammenstellen. Dazu kommt ein Gegenstand, der nicht in die Sammlung passt, z.B. ein Filzstift in einem Mäppchen voller Holzstifte. Wenn sie ihre Sammlung fertig gestellt haben, decken sie sie mit einem Tuch ab. Wenn die Arbeit an den Sammlungen beendet ist, bleibt ein TN sitzen, die anderen gehen zu einer anderen Sammlung. Jetzt gilt es mit geschlossenen Augen zu ertasten, welcher Gegenstand nicht in die Sammlung passt. (Antwort dem Experten zuflüstern.) Hat der TN den Gegenstand erraten, bekommt seine Gruppe einen Punkt.","Gegenstände aus dem Raum","GA","Gruppentische","","","",""],["Finden und schweigen","","Aktivieren","Wahrnehmung","","","","Die Gruppe versammelt sich im Raum. Der SL kündigt an, dass er einen bestimmten Gegenstand im Raum versteckt hat. Bei der Suche  gilt folgende Regel: Der Finder darf sich nicht als solcher zu erkennen geben, er muss still an seinen Platz zurückgehen und sich setzen. Nach einer Weile fragt der Spielleiter jeden einzelnen Spieler, wo der Gegenstand ist.","","PL","","","","",""],["Fall-Geräusche","","Aktivieren","Wahrnehmung","","","","Zu Beginn sammeln die TN verschiedene Materialien, die man gut auf den Boden werfen kann, ohne dass sie beschädigt werden oder kaputtgehen. Anschließend stellt sich ein TN auf einen Stuhl und lässt nacheinander die Gegenstände fallen. Die übrigen hören genau zu und versuchen sich zu merken, welcher Gegenstand welches Geräusch beim Auftreffen auf dem Boden erzeugt. Für das Spiel dreht sich die Gruppe mit dem Rücken zu dem Spieler, der die Gegenstände fallen lässt. Jedes Mal, wenn ein Gegenstand auf dem Boden gelandet ist, wird geraten, welcher Gegenstand es war. Wer als erster den richtigen Gegenstand errät, darf den nächsten Gegenstand fallen lassen.","Gegenstände aus dem Raum","PL","Sitzkreis","","","",""],["Rakete","","Aktivieren","Konzentration","","","Abschluss","Die TN stellen sich vor, sie seien Teil einer Rakete, die kurz davor ist in den Weltraum zu starten. Sie spielen den Start nach, indem sie zuerst leise Geräusche erzeugen, die sich dann steigern. Dabei kommt der ganze Körper in Aktion: - mit den Fingern auf den Tisch trommeln, dann auf den Tisch mit der flachen Hand schlagen. - mit den Füßen auftippen, dann auf den Boden stampfen - leise summen, dann immer lauter bis hin zum Schreien. Wenn die Geräusche ihren Höhepunkt erreicht haben, springen alle gleichzeitig in die Höhe.","","PL","","","","",""],["Alles, was rund ist","","Aktivieren","Kreativität","DaF WS","Wiederholung","Wettbewerb","Der SL bereitet ein Blatt für jeden TN vor. Darauf sind 25 Kreise eingezeichnet, je fünf Kreise in fünf Reihen. Aufgabe der TN ist es, in fünf Minuten so viele runde Gegenstände in die Kreise zu zeichnen, wie möglich. Dabei können auch, wie z.B. bei einer Brille oder einem Fernglas, zwei Kreise kombiniert werden. Gewonnen hat derjenige, der die meisten Gegenstände gefunden hat.","AB","EA / PA / GA","","","","",""],["Murmelbahn","","Aktivieren","Kooperation","Problemlösung","","","Alle bilden einen Kreis und stehen so eng zusammen, dass die Oberarme sich berührten. Die Hände werden nebeneinander vor dem Oberkörper gehalten, die Handflächen nach oben. Aufgabe ist es, einen Ball auf den Handflächen langsam laufen zu lassen, ohne ihn festzuhalten. Das Tempo kann nach und nach gesteigert werden. Richtungsänderungen können immer wieder vorgenommen werden. Ist der Ball gut im Fluss kann ein zweiter, kleinerer, hinzugenommen werden z.B. Tischtennisball...","kleiner Ball","PL","","","","",""],["Murmelpause","","Input","","","","","Beim Vortrag Pausen einlegen, Gruppen bekommen eine Aufgabe, die sie leise diskutieren. Ergebnisse kommen nicht ins Plenum. (Nr. 1: Drehen Sie sich zu der Person neben Ihnen und erzählen Sie ihr die interessanteste Tatsache, die Sie in den letzten zehn Minuten gelernt haben. Nr. 2: Überlegen Sie sich eine kurze Frage zum soeben Gelernten. Überprüfen Sie, ob die Person neben Ihnen diese Frage auch beantworten kann. Nr. 3: Fragen Sie die Person, die Ihnen gegenüber sitzt, wie das was sie gelernt hat mit dem zusammen passt, was sie über das Thema schon wusste. Nr. 4: Drehen Sie sich zu einer Person, mit der Sie bisher noch nicht gesprochen haben und erzählen Sie ihr, warum die Information, die Sie gehört haben, wichtig für Ihre tägliche Arbeit ist. Nr. 5: Drehen Sie sich zu der Person hinter Ihnen und bitten Sie sie zusammenzufassen, was sie in den letzten 10 Minuten gelernt hat.)","","PL --> GA --> PL...","","","","",""],["Namen jonglieren","","Kennen lernen","Namen lernen","Konzentration","","","Alle Spieler stehen oder sitzen im Kreis. Der erste nimmt den z.B. gelben Ball in die Hand. Er wirft diesen einem anderen Spieler zu und sagt dabei seinen Namen. (Rolf) Dies geschieht solange, bis es gut klappt.  Dann kommt der blaue Ball ins Spiel. Bei diesem Ball sagt man, wem man den Ball zuspielt und wirft. (Rolf zu Ana) Wieder wird dies mit dem blauen Ball geübt.  Der dritte Ball (z.B. rot) kommt ins Spiel: der Fänger bedankt sich beim Absender. (Danke, Rolf!) Es wird wieder gut geübt. Ziel ist es, dass alle drei Bälle zeitgleich von der Gruppe gespielt werden.","3 verschiedene Bälle","PL","Stehkreis","","","",""],["Namen klatschen","","Kennen lernen","Namen lernen","Konzentration","","","TN stehen im Kreis. Ein TN zeigt auf einen TN (TN1), “klatscht ihn an” und nennt den Namen einer anderen TN (TN2), die nachher von TN1 angeklatscht werden soll. (Leichter, als Vorübung: Man nennt den Namen des Angeklatschten.)","","PL","Stehkreis","","","",""],["Namenschaos","","Kennen lernen","Namen lernen","Aktivieren","","","Der SL macht die Musik an. Alle sollen sich durch den Raum bewegen (auf Ansage auch hüpfen, schleichen, schreiten, etc.). Irgendwann macht der Spielleiter die Musik aus und ruft einen Namen aus der Gruppe, z.B. Peter. Nun müssen alle zu der Person laufen, von der sie glauben, dass dies „Peter“ ist. Die letzte Person die ankommt, scheidet aus und muss den nächsten Namen ansagen.","Musik","PL","freier Raum","","","",""],["Namensschilderkette","","Kennen lernen","","","","","Geeignet für Kurzseminare mit Gruppen, die sich z.T. schon kennen. Jeder TN zieht ein Namensschild, nennt den Namen und gibt den Namensschild an die Person weiter.","Namensschilder","PL","Sitzkreis","","","",""],["Nehmen und Geben","","Feedback","","","","","Wie Blitzlicht: Die TN nennen kurz, was sie vom Tag mitnehmen und geben in einem Satz auch Feedback für die SL, was sie mitnehmen kann (Verbesserungsvorschläge, Ideen, Dank...)","","PL","","","","",""],["Netzwerk","","Kennen lernen","Kooperation","DaF Sprechen","","","Die Namenskärtchen / Fotos ordnen wir auf einem großen Packpapier in einen Kreis. Die TN sprechen mit möglichst vielen, um Gemeinsamkeiten mit ihnen herauszufinden. Finden zwei Personen eine Gemeinsamkeit, dann verbinden sie ihre Namen durch eine Linie und schreiben auf die Linie, was sie verbindet - oder malen kleine Bilder dafür. In einer schnellen Runde stellt sich dann jeder mit Namen vor und erläutert kurz die Verbindungslinien, die den eigenen Namen mit den Namen anderer Personen verbinden ODER erzählen von den interessantesten Verbindungen ODER von denen, die für die gemeinsame Zeit / Arbeit von Wichtigkeit sind.","Packpapier, Pinnwand, Namenskärtchen oder Fotos, evtl. auch Faden","CP","freier Raum","DSCN7981.JPG","","",""],["Nordpol - Südpol","","Erfahrungsaustausch","","","","","SL nennt zwei gegensätzliche Aspekte (insgesamt 10-12, z.B. arbeitet mit Jugendlichen / arbeitet mit Erwachsenen) und zeigt auf zwei entgegengesetzte Wände des Raumes. TN positionieren sich dann auf dem “Nordpol” oder auf dem “Südpol”.","","PL","freier Raum","","","",""],["Nummerierte Köpfe","","Kooperation","Gruppenbildung","Gruppendynamik","","","In den Kleingruppen reihum durchzählen. Zeitwächter, Materialbeschaffer, Raumgestalter, Sozialmanager, Babysitter (für den Lehrer), Lautstärkedesigner, Zahlenmeister – alle Funktionen bekommen eine Nummer, die TN mit der entsprechenden Nummer bekommt diese Aufgabe für die nächste (längere!) Arbeitsphase. Auch geeignet für die Vorbereitung gemeinsamer Projekte (wie z.B. Länderabend :-)","Plakat mit den Funktionen","PL","","Tag_12_Internationaler_Abend_Nummerierte_K_pfe.JPG","","Türsteher – Tippt in den Chat Begrüßung, wenn Lernende sich verspäten oder den Raum wieder betreten. Erklärt in 1-2 Sätzen, was gerade passiert (privater Chat). Zeitwächter achtet auf die Einhaltung des Zeitrahmens. Linksammler speichert alle Links und schickt sie nach dem Unterricht an alle.  Chat Meister überwacht den Chat (z.B. während L. seinen Bildschirm teilt), macht auf Fragen oder Probleme aufmerksam.  Techniker – hilft (über privaten Chat) bei technischen Problemen. Screenshooter – erstellt Screenshots von wichtigen Arbeitsergebnissen.",""],["Obstsalat","","Gruppenbildung","DaF Sprechen","","","","TN sitzen im Kreis. Jeder TN bekommt einen Obstnamen (etwa 4-5 verteilen). Der SL steht in der Mitte und beginnt eine Geschichte zu erzählen. Wenn er einen Obstnamen nennt, müssen die TN mit den Obstnamen den Platz tauschen. Wer ohne Stuhl bleibt, setzt die Geschichte fort.","","PL","Sitzkreis","","","",""],["Onkel Willie ist krank","","Aktivieren","Auflockern","DaF WS","","Kettenübung","TN sitzen im Kreis und nehmen einen dicken Stift oder einen Radiergummi in den Mund. KL beginnt und spielt mit ihrer NachbarIn folgenden Dialog vor: „Hast du gehört? Onkel Willy ist krank.” „Was hat er denn?” „Halsschmerzen? „Ach der Arme!” Die NachbarIn wendet sich dann an ihre NachbarIn und sie spielen nun den Dialog und erweitern ihn um eine weitere Krankheit: „Halsschmerzen und Kopfschmerzen...”","dicker Stift","PL","Sitzkreis","","","",""],["Original-Fälschung","","Einstieg","Kooperation","Aktivieren","DaF Sprechen","","In zwei Bildern / in zwei Texten / in 2 Tabellen / zwei Diagrammen... sollen die TN die Unterschiede finden durch Erzählen bzw. Beschreiben, ohne einander ihre Vorlagen zu zeigen. Die Anzahl der Unterschiede können wir angeben. Kontrolle: Lösungsblatt mit deutlichen Markierungen","2 Bilder / Texte / Tabellen / Diagramme, \"Trennwand\"","PA","","","","",""],["Oscar-Verleihung","","Feedback","Auswertung","","","","Nach der Präsentation bewerten die Gruppen alle Präsentationen (auch die eigene!) mit Punkten, nach mehreren Aspekten. Am Ende wird jede Kategorie einzeln ausgewertet und der Sieger der Kategorie ermittelt.","AB","GA --> PL","","","","",""],["Öko-Memory","","Kooperation","Wahrnehmung","","","","In der Natur durchführen! Vorbereitung: Auf einem überschaubaren Areal Naturgegenstände suchen und diese auf einem Flipchartbogen platzieren, Flipchart abdecken. Die Gruppen beraten sich zuerst, wie sie die Aufgabe lösen – alle Gegenstände, möglichst gleich groß / gleiche Farbe / gleiche Form... auf dem Areal finden und in der gleichen Anordnung auf einem neuen Flipchartbogen hinlegen. Nach der Beratung darf nicht mehr gesprochen werden, die Gegenstände werden für 1 Minute aufgedeckt, danach werden sie wieder zugedeckt und die Gruppen beginnen zu sammeln. (5-10 Minuten geben). Für jeden passenden Gegenstand gibt es einen Punkt, wenn sie auch richtig liegen, noch einen.","Naturgegenstände aus der unmittelbaren Gegend, Flipchartpapier (je 2 für das Original und für die Gruppen)","GA","im Freien","","","",""],["Pantomime-Interview","","Kennen lernen","DaF Sprechen","","","","Geht wie ein normales Partnerinterview - nur dass hier nur der Interviewer sprechen darf, die Fragen beantwortet man als Pantomime. Danach werden die Rollen gewechselt.  Nach ca. 10-15 Minuten trifft sich die ganze Gruppe wieder und jeder stellt den Partner vor. Der jeweilige Partner kann ergänzen und korrigieren, falls beim Pantomime-Interview etwas missverstanden wurde.","","PA --> PL","","","","",""],["Pantomimenstaffel","","Aktivieren","Wahrnehmung","Kommunikation","","","5 TN gehen aus dem Raum. Die anderen einigen sich eine Geschichte die ein TN dann für die erste Person, die draußen war, pantomimisch darstellt. Die Person schaut zu, kommentiert nicht und darf auch keine Fragen stellen. Dann wird die zweite Person reingeholt, der 1. Mitspieler spielt die Geschichte vor... usw. Die letzte Person spielt die Geschichte auch vor und kommentiert dabei, was sie verstanden hat. Zum Schluss wird die Originalgeschichte vorgespielt und dann reflektiert, welche Aspekte “unterwegs” verloren gegangen sind und was evtl. falsch weitergegeben wurde bzw. was die Gründe dafür sein könnten.","","PL","","","","",""],["Parallellgedicht","","Einstieg","DaF Schreiben","","","","Zu einem einfachen Gedicht aus einer anderen Perspektive ein zweites Gedicht schreiben (Personen ändern, Zeit, Ort...), Struktur des Gedichtes belassen.","kurze Gedicht(e)","EA / PA / GA","","lehrer_fragen.JPG","","",""],["Parallellplanung","","UB","","","","","Vor der UB das Material studieren und ohne die Planung der LehrerIn zu kennen einen eigenen Plan erstellen. Diskussion wird intensiv, Vorsicht aber: die eigene Brille ist in diesem Fall doppelt zu stark!","Unterrichtsmaterial, Planungsraster","GA","","","","",""],["Zufallsgruppen","","Gruppenbildung","","","","","Geeignet für die Gruppenbildung für eine themenzentrierte arbeitsteilige Gruppenarbeit, bei der es egal ist, wer welches Thema bearbeitet (keine Wahlgruppen also): TN ziehen Karten mit Symbolen oder Gummibärchen unterschiedlicher Farbe (wenn Jale sie vorher nicht plündert... :-) und finden sich zu Themengruppen zusammen.","Gummibärchen, Spielkarten, kleine Gegenstände","","","","","",""],["Augenkontakt","","Gruppenbildung","","","","","TN sitzen im Kreis oder gehen im Raum umher und nehmen Kontakt zu ihrer WunschpartnerIn nur durch Augenkontakt.","","PL","","","","",""],["Personen raten","","Feedback","Gruppendynamik","Abschluss","DaF Sprechen","","Zertifikate (oder kleine Geschenke) werden verlost, jeder TN beschreibt die Person, die das Zertifikat erhalten soll, die anderen TN raten, um wen es geht.","","PL","Sitzkreis","","","",""],["Phantasie-Kim","","Wahrnehmung","Einstieg","","","","Kombination aus Phantasiereise und Kim: SL erzählt über etwas (hier: Markt zu Hause), die TN versuchen sich den Ort vorzustellen. Danach wird gesammelt: Was habe ich gesehen, gehört, gefühlt, gerochen, geschmeckt?","","PL","","","","",""],["Phantasiereise","","Einstieg","Erfahrung","Konzentration","","","Ein imaginatives Verfahren: von einem Sprecher wird langsam und ruhig eine fiktive Geschichte (ca. 15 Minuten) vorgelesen oder erzählt. Wichtig: eine entspannte Körperposition (auf dem Rücken liegend mit geschlossenen Augen). Rückkehr in die Realität durch tiefes Durchatmen, sich strecken und Gähnen, im Anschluss: Gespräch oder ausdruckszentriertes Malen/ Gestalten zur Auswertung","","FA","","","","",""],["Pinnwand-Arena","","Präsentation","","","","","Pinnwände als Kreis aufstellen, in der Mitte soll genügend Platz zum herumgehen geben, aber nur so viel, dass man von überall her alle Pinnwände auch gut sehen kann. Ergebnisse werden an den Pinnwänden sortiert / ausgehängt, Ergebnisse direkt im Stehen besprechen.","Pinnwände (3-5)","GA / CP","","","","",""],["Pinnwand-Spaziergang","","Erfahrung","Reflexion","","","","Auf Pinnwänden Gesprächsimpulse festhalten, allein oder mit einem Partner an den aufgestellten Pinnwänden entlang spazieren und die Aspekte diskutieren.","Pinnwände, Kärtchen, Thesen, Cartoons","PA / GA","","","","",""],["Placemat","","Kooperation","Erfahrung","Ideen","","","Flipchartpapier in 5 Felder teilen: In der Mitte ein ovales Feld, von den Ecken ausgehend führen Linien zu diesem Feld, wodurch weitere 4 Felder entstehen. Die TN (oder Gruppen) kommentieren  eine These / sammeln Ideen zu einem Thema in einem Feld. Danach drehen sie die Tischdecke weiter (oder bei Gruppen: sie gehen um den Tisch zum nächsten Feld) und kommentieren die Ideen in dem neuen Feld. Wenn jeder zu seinem Originalfeld zurückgekehrt ist, sammelt die Gruppe die gemeinsam als wichtig erachteten, häufig genannten Aspekte im mittleren ovalen Feld.","Flipchartpapier, dicke Stifte (evtl. für jeden TN in der Gruppe 4 versch. Farben)","GA --> PL","Gruppentische","placemat.gif","","",""],["Plakat mit Feldern","","Reflexion","Erfahrung","Ideen","","","Ein Plakat vorbereiten mit verschiedenen Feldern, das um Items erweitert wird.","Packpapier, dicke Stifte, Kärtchen","GA --> PL","","","","",""],["Plakat mit Rätsel","","Präsentation","Einstieg","Visualisierung","","","In Plakat Elemente integrieren, die nicht gleich sichtbar sind: Fenster, Klappteile, aufgerollte Blätter, Rückseite zum Auflippen...","Flipchart","FA","","","","",""],["Plakatgerüst","","Präsentation","Visualisierung","Konzentration","","","Ein Plakat (Schema, Diagramm) zuerst ohne Infos präsentieren, und diese nach und nach beim Vortrag eintragen / mit vorbereiteten Kärtchen ergänzen / vorbereitete Kärtchen umdrehen / abgedeckte Teile aufdecken.","Plakat, Kärtchen, Pinnadeln / Tack-it","FA","","DSCN6020.JPG","","",""],["Planungskonferenz","Botschafterkonferenz","Ideen","Kooperation","","","","Bei längeren Arbeitsphasen (Transfer): Nachdem das erste Ideensammeln in den Kleingruppen abgeschlossen ist, trifft man sich im Plenum, die Gruppen stellen die Ideen vor und formulieren Beratungswünsche. Tipps der anderen TN notieren, ohne viele Kommentare und Diskussion. Phase dauert max. 20-30 Min., danach kehren die TN in ihre Stammgruppen zurück und arbeiten weiter. Variante Botschafterkonferenz: Vertreter der Gruppen treffen sich zu einer Besprechung, bei der z.B. auch etwas aufgeteilt und verbindlich vereinbart wird.","","GA > PL > GA","","","","",""],["Planungsraster mit Lücken","","Transfer","","","","","Unterrichtsplanung in einem Planungsraster festhalten, darin Zeile für Zeile immer mehr Lücken lassen. TN komplettieren den Plan anhand der vorliegenden Materialien  (Lehrwerk, Arbeitsblätter...)","Planungsraster, Unterrichtsmaterial","PA / GA","","","","",""],["Plätze tauschen","Alle, die...","Aktivieren","Kennen lernen","","","Abschluss","ie Lernenden sitzen im Kreis, der Spielleiter steht in der Mitte.   Er sagt den Satz: „Alle tauschen die Plätze, die …” und nennt ein Merkmal, von dem er annimmt, dass es auf jemanden in der Gruppe zutrifft. z.B: alle, die Rad fahren können, alle, die Deutsch mögen, alle, die einen Bruder haben...   Alle Spieler, auf die das Merkmal zutrifft, stehen auf und suchen schnell einen freien Stuhl. Regel: 1. Auf jedem Stuhl darf nur eine Person sitzen. 2. Was nicht geht: Den Nachbarstuhl zu nehmen oder nach ein wenig Herumlaufen den eigenen ursprünglichen Stuhl.  Der Spielleiter muss versuchen, einen freien Stuhl für sich zu finden.   Wer sich nicht hinsetzen kann, macht als Spielleiter weiter. Ist besonders lustig, wenn die L sich schon (gut) kennen.    Variante für TN, die sich noch nicht kennen:   “Ich mag alle, die...” - hier Eigenschaften, Hobbys, Vorlieben, Kleidungsstücke... nennen.","","PL","Sitzkreis","","","",""],["Plitsch-platsch","Berlin, Die verflixte 7","Aktivieren","Konzentration","","","","TN sitzen im Kreis und es wird reihum gezählt. Jede Zahl, die eine 7 enthält oder durch 7 teilbar ist, wird durch das Wort \"Plitsch\" (oder durch „Berlin“) ersetzt, jede Zahl, die eine 5 enthält oder durch 5 teilbar ist, durch „Platsch“.   Das Hochzählen bleibt solange erhalten, bis Fehler auftreten. In solchen Fällen beginnen immer diejenigen, welche den Fehler produziert haben von vorne oder die Zählrichtung wird gewechselt.","","PL","Stehkreis / Sitzkreis","","","",""],["Meinungsstandbild","","Reflexion","Feedback","","","Bewegung","Durch Positionieren im Raum (Entfernung, Körperhaltung, Gestik, Mimik) Stellung nehmen zu einem Problem / einem Verfahren... In die Mitte einen Gegenstand stellen, der das Problem / Verfahren... symbolisiert.","ein zentraler Gegenstand","PL","freier Raum","","","",""],["Positionslinie","Walk the line, Nordpol-Südpol","Diskussion","Erfahrung","Feedback","DaF Sprechen","Bewegung","Zu mehreren Aspekten Stellung beziehen: Sich auf einer Linie auf dem Boden (Kreide, Tesa-Krepp) positionieren (Mitte und beide Extrempole sind angegeben). Auch als vergleichende Auswertung möglich, in diesem Fall bedeutet die Vergleichsgröße die Mitte: z.B. Das Korrekturverhalten war intensiver – weniger intensiv als.... / Der Medieneinsatz war durchdachter und adäquater – weniger durchdacht und adäquat als...","Tesa-Krepp / Kreide / Seil, Markierungen","PL","freier Raum","","","",""],["Post-it-Begriffe","","Diskussion, ,","Reflexion","Transfer","DaF WS","","Verwandte Begriffe auf Post-Its schreiben. TN ordnen sie auf einem Blatt an und formulieren Definitionen, so dass Unterschiede und Gemeinsamkeiten sichtbar werden.","Post-it","EA / PA / GA","","","","",""],["Post-it-Kommentare","","Feedback","Auswertung","","","","Beim Galeriegang die Objekte (Unterrichtsplanung, Modelle, Texte) mit kleinen Kommentarzetteln „dekorieren“. (Ideen, Verbesserungsvorschläge, Lob, Kritik, Fragen...). Am Ende schaut jede Gruppe die Zetteln an. Darauf kann eine weitere Planungsrunde folgen (Ideen einarbeiten) oder eine offene Diskussionsrunde.","Post-its in mehreren Farben (pro Gruppe eine)","GA","","","","",""],["Prioritätspunkte","Hochpunkten","Ideen","","","","","Nach Kärtchenabfrage und Clustern oder nach der Erstellung eines Themen-/Ideenspeichers bringen die TN 2-3 Klebepunkte bei den Themen an, die sie wichtig / diskussionswürdig / umsetzungsfähig... finden. Möglich, alle Punkte an die gleiche Stelle zu kleben. Klebepunkte durchzählen und eine Prioritätenliste erstellen.","Klebepunkte","EA / PA / GA","","","","",""],["Profile erstellen","","Einstieg","Erfahrung","","","","Die Merkmale einer Zielgruppe auf Kärtchen schreiben. Möglich: Stärken / Schwächen (mit unterschiedlichen Farben), oder am Ende die Karten Kopf/Hand/Herz zuordnen... - weiterarbeit: Konsequenzen für die Arbeit, Nennung geeigneter Lösungsversuche bei Problemen / geeigneter Methoden, die auf den Stärken aufbauen etc.","Kärtchen, Plakat mit einer Figur","EA --> PL","","","","",""],["Puzzle mit Messkarte","","Input","Üben","DaF WS","","Selbstkontrolle","Wörter / Sätze aus Puzzleteilen legen und die Richtigkeit mit einer Messkarte überprüfen (alle Wörter / Sätze sind gleich lang).","Puzzleteile, Messkarte","PA / GA","","","","",""],["Quadratübung","","Kooperation","Problemlösung","","","","Aus festem Karton schneidet die SpielleiterIn 10x10 cm oder 15x15 cm große Quadrate und zerschneidet sie wie angegeben. Die Teile kommen in Umschläge: 1.  i, h, e; 2.: a, a, a, c; 3.: a, j,  4.: d, f,  5.: g, b, f, c. Jede Gruppe (5 Personen) bekommt 5 Umschläge. Ihre Aufgabe ist, aus den Teilen 5 gleich große Quadrate zu bauen, so dass jeder L einen Quadrat vor sich auf dem Tisch liegen hat. Sie dürfen nicht reden, in die Arbeit der anderen direkt eingreifen, einander signalisieren, welchen Teil sie brauchen, sie dürfen aber Teile in die Tischmitte legen und den anderen anbieten – den Teil kann jeder L nehmen. Es ist auch erlaubt, jemandem direkt einen Teil von den eigenen anzubieten. Beobachter nehmen die Zeit, wie lange die Gruppen für die Arbeit brauchen und wie die TN agieren.","Puzzleteile in Briefumschlägen","GA","Gruppentische, möglichst weit voneinander","quadrat_vorlage.jpg","","",""],["Quattro-Diskussion","","Erfahrung","Diskussion","Gruppendynamik","","","TN sitzen im Kreis. Jeder bekommt eine Karte mit den Nummern 1-2-3-4 in den Ecken. Sie esen die nacheinander aufgelegten Thesen auf den Folienstreifen,  entscheiden, wie sie zu der These stehen und zeigen die entsprechende Ecke ihrer Karte: 1 = ja, 2 = ja, aber, 3 = nein, aber, 4 = nein","Quattrokärtchen, Thesen gebeamt / Kärtchen","PL","Sitzkreis / U","quattrokarte.jpg","","",""],["Quiz","","Präsentation","Kontrolle","Transfer","","Autonom","Jede Gruppe formuliert 2-3 Fragen zu den wichtigsten Inhalten ihrer Präsentation und schreibt sie auf Kärtchen / Folienstreifen. Alle TN beantworten dann alle Fragen. Die “Experten” entscheiden, ob sie die Antwort akzeptieren.","Kärtchen / Folienstreifen / PPP","GA > PL","","","","",""],["Quizmatrix","","Wiederholung","Aktivieren","DaF WS","DaF GR","Wettbewerb","Zu den gelernten Wörtern Oberbegriffe formulieren und diese einzeln auf Kärtchen schreiben. Kärtchen in ein Raster legen (waagerecht Buchstaben, senkrecht Nummer dazu schreiben, z.B. A-E, 1-5). TN arbeiten in Gruppen, nennen eine Kombination (z.B: A4), die Karte wird umgedreht, und sie haben 1 Minute Zeit, um in der Gruppe möglichst viele Wörter zu der Kategorie zu nennen. Bei der Kontrolle beginnt die Gruppe, die am wenigsten Wörter hat, die anderen ergänzen dann um weitere Items.","Kärtchen, Pinnwand","GA --> PL","","quizmatrix.png","","",""],["Rahm schöpfen","","Präsentation","Feedback","","","","Höhepunkte und als persönlicher Lernertrag eingeschätzte Momente / Arbeitsschritte / Übungen und Aufgaben auf Plakat schreiben. (Weiterführung: Messe oder lebende Litfasssäule).","Plakate","GA","","","","",""],["Rasender Reporter","","Erfahrung","Einstieg","Gruppendynamik","DaF Sprechen","Bewegung","Trainiert: Hören, Sprechen, Schreiben. Geeignet als Einstieg in ein Thema.  Funktioniert wie Finde jemanden, aber hier stellt man keine ja/nein Fragen und es reicht nicht, wenn man den Namen der Person schreibt. Es dauert auch länger (ohne Auswertung 10 Min. - Finde jn. meist 5), aber weil es viele Fertigkeiten trainiert, lohnt es sich.  Die Lernenden  bekommen ein AB mit verschiedenen Fragen zum Thema, bei denen wir sicher sind, dass sie dazu schon im Deutschunterricht oder in anderen Fächern etwas gelernt haben.   z.B. Thema Essen:   Was braucht man für Kartoffelpuffer?  Aus welchen Ländern kommt Kaffee?  Was ist in einem Fischbrötchen drin?  Wie macht man Apfelschorle?  Wie schmecken Johannisbeere?  Wie sieht ein Zuckerapfel aus?  Wie viel Kalorien gibt es in Tee?  Was soll man essen, wenn man erkältet ist?  Was ist eine Vesperbox / Brotdose?    Die L gehen herum, versuchen jemanden zu finden, der die Antwort kennt, notieren die Antwort und den Namen der Person, der die Auskunft gegeben hat. Wenn die Person sagt, sie ist nicht ganz sicher, markieren sie die Frage und suchen noch jemanden, der die Antwort bestätigen / kontrollieren kann.    Am Ende Auswertung: Für welche Frage konntet ihr schnell jemanden finden, wer die Antwort wusste? Gibt es Fragen, die niemand beantworten konnte? Gibt es Fragen, bei denen ihr immer noch nicht sicher seid, dass die Antwort stimmt?","AB (Raster, Tabelle)","CP","freier Raum","","","",""],["Rasterpuzzle","","UP","Transfer / Anwendung","","","","Zerschnippelte Tabellen (z.B. Unterrichtsplanung im Raster) wieder ordnen (Spalten sind angegeben).","Puzzleteile","PA / GA","","","","",""],["Raumbegehung","","Kennen lernen","","","","Bewegung","Für Seminare, die in mehreren Räumlichkeiten durchgeführt werden bzw. um einzelne Geräte, die “Hausordnung” etc. vorzustellen – Gruppe wird herumgeführt und lernt nach und nach die Tagungsstätte kennen.","","PL","","","","",""],["Reflexionsspaziergang","","Reflexion","Erfahrung","","","Bewegung","Fragen zu Reflexion an Pinnwänden / an der Wand aushängen, auf den Boden legen. Ausgewählte Aspekte mitnehmen und mit einem Partner diskutieren.","Kärtchen, Pinnwände / Boden (+ Schnur)","EA --> PA --> PL","freier Raum","","","",""],["Reise nach Kanikano","","Aktivieren","Wahrnehmung","Konzentration","","Rätsel","Die L sagt, dass sie alle nach Kanikano fahren, aber man kann nur mit, wenn man die passenden Gegenstände im Reisegepäck hat. Die TN machen Vorschläge, und die L sagt, ob sie mit dürfen. Wenn jemand die Regel gefunden hat, sagt sie nicht, sondern sagt einige Gegenstände, die in den Koffer dürfen. ... Man darf z.B. ein dickes Buch - aber kein Lexikon, Wolle - aber keine Stricknadeln, eine Regenjacke ber keinen Regenschirm und kein Anorak mitnehmen, kein Handy, keinen Computer, kein Laptops und schon gar keine I-Phones!!!  (KEIN I – KEIN O :-)","","PL","","","","",""],["Reziprokes Lesen","","Input","Kooperation","DaF LV","","Autonom","Kooperative Lesemethode für das Erschließen von verdichteten und anspruchsvollen Texten.  4 TN erarbeiten einen Text abschnittweise gemeinsam. Sie übernehmen abwechselnd verschiedene Aufgaben. Zuerst wird ein Abschnitt von allen leise gelesen. Anschließend wird er arbeitsteilig erarbeitet: A liest den Abschnitt des Textes vor und stellt den Gruppenmitgliedern anschließend Fragen zum Inhalt. B fasst den Inhalt des Abschnitts mündlich kurz zusammen.  C stellt Fragen zu Textstellen und Wörtern, die schwierig sind oder die er/sie nicht verstanden hat. Im gemeinsamen Gespräch werden Verstehenslücken geschlossen. Wenn erforderlich, werden Hilfsquellen benutzt oder wird die Lehrkraft befragt. D stellt Vermutungen darüber an, wie der Text weitergehen könnte. Die anderen Gruppenmitglieder ergänzen. Vor dem Lesen des nächsten Abschnittes werden die Rollen gewechselt, zum Beispiel im Uhrzeigersinn. ...","Aufgabenkarten","GA","Gruppentische","Rollenkarten__reziprokes_Lesen.pdf","","",""],["Rippel-Tippel","","Aktivieren","Konzentration","","","","Die Spieler sitzen oder stehen im Kreis und es wird durchgezählt. Der Spielleiter beginnt: \"Rippel-Tippel 1 ohne Tippel ruft Rippel-Tippel 5 ohne Tippel\". Der Spieler mit der Nummer 5 ist nun gefragt seinerseits jemanden zu rufen: \"Rippel-Tippel 5 ohne Tippel ruft Rippel-Tippel 8 ohne Tippel\" usw. Hat sich ein Spieler versprochen oder etwas vergessen, erhält er einen Tippel, d.h. einen schönen bunten Schminkfleck ins Gesicht. Der wird ab sofort natürlich in allen Rufen berücksichtigt, d.h. ab sofort ist er \"Rippel-Tippel x mit einem Tippel\"! Im Laufe des Spiels ergibt sich so ein buntes Bild und die Zahl der Tippel erhöht sich ständig.","Schninkfarbe","PL","Sitzkreis","","","",""],["Rythymuswechsel","","Kooperation","Konzentration","Wahrnehmung","","","Ein TN beginnt einen einfachen Rhythmus zu klatschen, und die anderen folgen ihm, indem sie denselben Rhythmus mitklatschen. Sagen sie der Gruppe dann, sie möchten, dass jemand aus der Gruppe den Rhythmus verändert, jedoch ohne etwas zu sagen. Derjenige soll einfach einen neuen Rhythmus beginnen und der Rest der Gruppe folgt diesem neuen Rhythmus. Nach einigen Wechseln sollte die Übung beendet werden und folgende Fragen beantwortet werden: • Wie hat die Gruppe gemerkt, dass jemand die Gruppe zu einem neuen Rhythmus führen wollte? • Was hat dich dazu gebracht oder daran gehindert einen neuen Rhythmus einzuführen? • Warum ist es schwierig bei einer Übung wie dieser die Führung zu übernehmen?","","PL","Sitzkreis","","","",""],["Der wilde Werner","Alliterationsspiel, Name-Adjektiv-Geste","Kennen lernen","Namen lernen","","","Bewegung","Mein absolutes Lieblingsspiel zum Lernen der Namen. Ich nenne es \"Der wilde Werner\" - als Andenken an den Seminarleiter, von dem ich es gelernt habe. Eure Lernenden werden es vielleicht nach euch benennen... :-D  Die Lernenden sitzen im Kreis. Sie stellen sich reihum vor: Sagen ihren Vornamen, ein Adjektiv („Ich bin der wilde Werner”).  Varianten:  - nennen etwas, was sie gern tun (muss mit dem gleichen Buchstaben beginnen, wie der Vorname - „Ich heiße Rita, und ich rudere gern.”) - oder etwas, was sie haben / haben wollen („Ich heiße Doris und habe einen Dackel / möchte einen Dackel haben.”.  - oder nennen Wunsch- oder Phantasieberufe – „Ich bin Judit, und ich wäre gern Jongleurin / Joghurttesterin”. In jeder Variante stellen sie das Adjektiv / die Tätigkeit / den Gegenstand auch pantomimisch vor.   Es ist ein Kettenspiel: Auf diese Weise stellen die nächsten Mitspieler zuerst alle vor, die vor ihnen dran waren und dann sich selbst.  Helfen darf man mit dem Zeigen der Geste.  Es ist wichtig, dass man die Gesten zeigt, das hilft beim Merken der Namen, tun es die L nicht, erinnern sie sie daran.   Auswertung: Besprecht, was geholfen hat, die Namen zu lernen - die Wiederholung, die Reihenfolge, dass man sich sieht, der gleiche Buchstabe, das Adjektiv (oder die Info) - je witziger, desto leichter zu lernen! , die Geste - je lustiger und breiter, desto besser! Weist darauf hin, dass Namen auch Wörter sind, all diese Techniken helfen auch beim Lernen von Wörtern!","","PL","Sitzkreis / Stehkreis","namensspiel_rolf_raketeninspekteur.jpg","","",""],["Rollenkino","","Präsentation","","","","","Plakat auf einer langen Papierrolle vorbereiten, die linear, von links nach rechts gelesen werden soll. Beide Enden der Papierrolle auf einem Stil festkleben (oder einfach aufgerollt festhalten) und nach und nach von zwei Personen aufrollen, während eine dritte die Inhalte erläutert. Schon behandelte Teile einfach wieder aufrollen.","lange Papierrolle (evtl. 2 Besen)","FA","U, Fächer","","","",""],["Rollenspiel","","Präsentation","","","","","Zwei Personen stellen in Form von einem Interview die wichtigsten Informationen aus einem Interview (selbst durchgeführt, Hör- oder Lesetext, Film...) vor. Nachstellen des Originalinterviews oder Interview mit einer fiktiven Person / einer Person, die Experte / Betroffene im Thema ist. Im Anschluss auch Fragen aus dem Publikum möglich, die der Experte beantwortet.","","FA","U, Fächer","","","",""],["Podiumdiskussion mit Rollen","","Diskussion,","Präsentation","DaF Sprechen","","","In Kleingruppen anhand von Rollenkarten die Stellungnahme von Personen vorbereiten. Jede Gruppe schickt einen Vertreter aus, der für die Gruppe diskutiert. Die restlichen TN spielen das Publikum und stellen Fragen.","Rollenkarten","GA --> PL","U, Fächer","greenpeace_aufgaben.JPG","","",""],["Rote Karte zeigen","","Feedback","","","","","Missfallen / Kritik / Diskussions-/ Änderungs- / Umformulierungsbedarf mit einer roten Karte signalisieren, die eigene Entscheidung kurz begründen und einen Verbesserungsvorschlag machen.","rote Karten für jeden TN","PL","Sitzkreis","","","",""],["Rotierende Hospitation","","UB","","","","","Die Hospitationsgruppe teilt sich in “Frühschicht” und “Mittagsschicht”: Während die Frühschicht hospitiert, plant die Mittagsschicht mit dem Material, das dem Unterricht zugrunde liegt, eine Sequenz für 90 Minuten. Im 2. Block plant die Frühschicht, wie der erlebte Unterricht weiter fortgesetzt werden könnte, während die Mittagsschicht hospitiert. Im Anschluss berichten beide Gruppen über den Unterrichts und vergleichen den Verlauf mit ihrer Parallelplanung.","","GA","","","","",""],["Rotkäppchen und der Wolf","","Gruppenbildung","","","","","Auf Kärtchen berühmte Paare oder Gruppen schreiben (Rotkäppchen – Wolf, Athos – Porthos – Aramis). Die TN gehen herum, stellen sich vor und suchen ihren Partner / oder schreien den Namen des vermuteten Partners.","Visitenkarten","CP","freier Raum","","","",""],["Rücken an Rücken","","Aktivieren","Wahrnehmung","DaF Sprechen","","Bewegung","TN tanzen eine Weile, und wenn die Musik stoppt, stellen sie sich mit einem Partner Rücken an Rücken. Ohne sich umzudrehen, versuchen sie den Partner möglichst detailliert zu beschreiben (Aussehen, Kleidung, Stimmung....). Variante:  Der Lehrer (oder ein Teilnehmer) stellt Fragen, die möglichst genau beantwortet werden sollen:  Welche Farbe hat das T-Shirt deines Partners? Was für Schuhe trägt dein Partner? Trägt dein Partner Ohrringe? ...","Musik","CP","freier Raum","","","",""],["Rückenkarten","","Feedback","DaF Schreiben","","","","Jeder TN bekommt drei Kärtchen. Auf je ein Kärtchen schreibt er folgende Satzanfänge: ICH KANN … / ICH BIN … / ICH HABE … Die Kärtchen werden bei jedem auf den Rücken aufgeklebt. Nun gehen alle im Raum herum und können bei jedem einen Kommentar auf die Zettel schreiben","3 Kärtchen pro TN, je 3 Wäscheklammer","CP","freier Raum","","","",""],["Sandwich-Methode","","Input","Diskussion","Erfahrung","Kooperation","","Dreiteiliges Verfahren: Zu Beginn wird das Gesamtthema und die Methode erläutert. anschließend werden Arbeitsgruppen gebildet. Sie beschäftigen sich entweder arbeitsgleich mit derselben Frage oder arbeitsteilig mit verschiedenen Fragen. Die Gruppen arbeiten zu ihrer Frage und halten die Ergebnisse fest.  Es folgt ein Kurzreferat.  Die Arbeitsgruppen treten dann wieder  zusammen, sie vergleichen ihre eigenen Überlegungen mit den Aussagen des Kurzreferates und entwickeln ihr Arbeitsergebnis weiter (Überprüfung, Änderung, Abrundung, Vertiefung). Im Plenum werden diese Arbeitsergebnisse ausgetauscht und im Blick auf das Gesamtthema vertieft.","","GA --> FA --> GA --> PL","","","","",""],["Schatzkiste und Störball","","Aktivieren","Konzentration","DaF WS","DaF Phonetik","","TN stehen im Kreis, eine(r) von ihnen stellt sich in die Mitte. KL gibt in eine Richtung kleine Gegenstände einzeln herum, und benennt sie auch (ein grünes Adressbuch, ein Silberring...). TN geben diese immer weiter und sagen dem Nachbarn, was sie gehört haben. Der TN in der Mitte wirft gleichzeitig den Ball einzelnen TN zu, sie sollen den Ball dann immer diesem TN zurückwerfen. Am Ende gemeinsam sammeln, was alles herumgereicht wurde, oder die TN raten lassen, welche Gegenstände NICHT der SL gehören.","kleine Gegenstände, 1 Ball","PL","Stehkreis","","","",""],["Schema füllen (Fußboden)","","Ideen","Präsentation","","","","Für das Sammeln von vielen Ideen / Items, wenn die Pinnwand zu klein: Mit Tesa-Krepp auf dem Fußboden ein Schema legen, in das die auf Kärtchen gesammelten Items eingeordnet werden können. (Bei Mehrfacheinordnung entweder auf die Grenze legen oder wenn das nicht geht, Karte doppeln).","Tesa-Krepp, Kärtchen","GA --> PL","freie Fläche auf dem Boden in der Mitte","","","",""],["Schimpfduell","","Kommunikation","Aktivieren","DaF WS","DaF Phonetik","Wettbewerb","TN stellen sich in Paaren einander gegenüber auf und gehen aufeinander zu. Sie beschimpfen einander deutlich artikuliert, stark gestikulierend und mit viel Emotion – mit Alltagsgegenständen. (Duuuuu Wischmop! Duuuuuu Dampfbügeleisen!...) Sie werden lauter und intensiver, wenn sie einander näher kommen - und leiser, wenn sie wieder auseinandergehen. Bringt einer den anderen zum Lachen, bekommt er einen Punkt. Gewonnen hat, wer am Ende die meisten Punkte hat.","evtl. Liste mit Wörtern","PA","Spalier","","","",""],["Schlafposition vorstellen","","Kennen lernen","Körpersprache","Wahrnehmung","","","Partnerübung: TN zeigen dem Partner, in welcher Position sie am liebsten schlafen. Dieser merkt sich die Position und stellt im Kreis dann der Partner schläft.","","PA --> PL","freier Raum (nach Möglichkeit Teppichboden :-)","","","",""],["Schlangengrube","","Kennen lernen","Aktivieren","Kooperation","","Bewegung","TN stellen sich  auf Stühle, die als Schlange aufgestellt werden. Sie stellen sich dann zu einer Leitfrage in eine Schlange (z.B. Anzahl der Dienstjahre? Viel / wenig Erfahrung mit etwas...). Niemand darf den Boden berühren, die Gruppe muss dafür sorgen, dass alle auf den Stühlen bleiben.","Stühle als Schlange, nicht sehr nah aber auch nicht sehr weit voneinander","PL","","","","",""],["Schneeball","TPSS, Lawinengespräche","Diskussion","Gruppendynamik","Kooperation","DaF Sprechen","","Gruppenkonsens finden: Die Lernenden sammeln zuerst allein Aspekte / Ideen zu dem genannten Thema.  Dann einigen sie sich zu zweit (oder bei großen Gruppen zu dritt) auf gemeinsam wichtige 5-6 Aspekte. Dann setzen sie sich mit der Nachbarsgruppe zusamemn, und einigen sich nun zu viert oder zu sechst auf gemeinsam wichtige 7-8 Aspekte und schreiben diese auf Kärtchen.  Weiterführung: Einer für alle","Kärtchen, Pinnwand","EA --> PA --> GA -->  PL","","","","",""],["Schnitzeljagd","","Input","Kooperation","Problemlösung","","Bewegung","Einen neuen Ort mithilfe von Fragen (etwas notieren, etwas erfragen, etwas malen, etwas ausprobieren und beschreiben, etwas abzählen, etwas einsammeln, etwas fotografieren...). Damit die Gruppe zusammenbleibt, einige Fragen als Gruppenaufgabe formulieren (Fotos machen mit der ganzen Gruppe drauf, etwas einzeln kommentieren lsassen). Für die Einhaltung der vorgeschriebenen Zeit gibt es Zusatzpunkte.","AB, Kamera, Stadtplan","GA","in der Stadt","","","",""],["Schraubendrehen","","Kooperation","Problemlösung","","","","Jeder Spieler erhält zu Beginn des Spiels eine Schraubenmutter. Ziel der Gruppe ist es, alle zu  Spielbeginn erhaltenen Muttern auf ein Zeichen des Spielleiters über die gesamte Länge des  Gewindestabes zu drehen. Jeder muss seine Mutter selbst auf den Stab drehen und am Ende in Empfang nehmen. Alles weitere ist der Strategie der Gruppe überlassen. Die Zeit wird vom Spielleiter gestoppt. Im zweiten Durchgang versucht die Gruppe, ihre erreichte Zeit zu verbessern. Vor diesem zweiten Durchgang erhält die Gruppe eine fünfminütige Planungsphase, in der Absprachen getroffen und Strategien ausgearbeitet werden können. Vor dem Spiel sollten der Gewindestab und die Muttern auf ihre Funktionsfähigkeit überprüft werden. Außer den Muttern und dem Gewindestab sind keine weiteren Hilfsmittel erlaubt.","ein Gewindestab M8 und Muttern je nach Anzahl der TN","PL","","","","",""],["Schulterklopf-Kreis","","Feedback","Gruppendynamik","","","","Nach dem erfolgreichen Abschluss einer komplizierten Aufgabe stellen sich die TN im Kreis auf, drehen sich rechts umd, und klopfen dem Vorderman auf die Schulter (möglich: Feedbackruf wie “Bravo” “Prima”...)","","PL","Stehkreis","","","",""],["Schuppen","","Präsentation","Kooperation","DaF Schreiben","DaF Sprechen","Bewegung","Wichtige Infos, anregende Fragen, Thesen, Bilder, die zum Thema gehören, auf Kärtchen festhalten und an der Kleidung befestigen. Die L gehen danach herum und erzählen dem jeweiligen Gesprächspartner zu den Karten, die er interessant findet oder zu denen er Fragen hat und befragen ale zu ihren „Schuppen”. Auf einmal immer nur mit einer Person sprechen.  (Bei Gruppenpräsentation: In der Gruppe darauf achten, dass eine Information bei min. 2 Personen vorkommt. Für die Orientierung ist es am einfachst
