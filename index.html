nal: Agree) oder nicht (sehe ich Anders / Disagree). Danach wählen sie X Thesen aus, über die sich austauschen möchten und markieren diese mit einem Kreis. Sie gehen herum, zeigen einander, worüber sie diskutieren möchten, und diskutieren, warum sie der These zustimmen / die These ablehnen. Sie können auf dem Blatt den Standpunkt der Gesprächspartner diskutieren (A / G). Am Ende über die am meisten kontroversen Thesen im Plenum diskutieren oder Arbeitsgruppen bilden, die einzelne Themen in der Fachliteratur erforschen.","AB","EA > CP > GA","","sehe_ich_so_sehe_ich_anders.jpg","","",""],["Stuhlmühle","","Kooperation","Konzentration","Problemlösung","","","Mühle spielen in einem Stuhlfeld von 9 Sessel. Zwei Dreierteams treten gegeneinander an. Abwechselnde Sitzposition. Wer senkrecht, waagrecht oder diagonal eine Dreierreihe schafft, hat gewonnen.","9 Stühle","GA","","","","",""],["Zahlen rufen","","Aktivieren","Konzentration","","","Bewegung","An der Tafel stehen Zahlen (z.B. von 1-10...), zu jeder Zahl wird eine Aktion zugeordnet: sich auf den Boden setzen, rückwärts laufen, in die Hocke gehen, auf dem rechten Bein stehen, hochspringen, hüpfen, klatschen, Hurra rufen, winken...). Die TN laufen im Raum herum. Der Spielleiter ruft laut Zahlen, die TN führen die Anweisung aus. Danach WEITER rufen.. und weiter gehts.","Tafel","PL","freier Raum","","","",""],["The Odd One Out","","Einstieg","Wiederholung","DaF WS","DaF GR","Wettbewerb","3-5 Wörter oder Zahlen oder Bilder oder Symbole... werden vorgegeben. Was passt nicht? Die TN nennen und begründen ihre Lösung. Timer setzen - Wette mit der Gruppe abschließen, ob sie X Begründungen in der Zeit finden.","AB / Beamer","PA / GA","","","","Präsentation: Bilder oder TN zeigen 3 Gegenstände in die Kamera, gut, wenn der Timer sichtbar ist, daher z.B. Bild mit den Gegenständen als Hintergrund in classroomscreen hochladen.",""],["Prioritätenspiel","","Einstieg","Erfahrung","DaF Sprechen","","","Die Gruppen erhalten eine Liste von 10 Items. 4 davon sollen sie streichen, den Rest in eine Rangfolge bringen. Danach Diskussion im Plenum.","AB / Beamer","GA","","","","",""],["Zahlenroulette","","Wiederholung","Reflexion","DaF Sprechen","","","Nach dem Lesen / Hören eines Sachtextes oder nach einem Film / Doku: Die TN zählen durch, jeder merkt sich seine Zahl. Der KL ruft eine Nummer auf, die Person sagt etwas zum Thema (Was war mir wichtig? Was sollen wir uns merken? Was fiel mir auf? Was sollten wir diskutieren / weiter vertiefen?...). Am Ende ruft eine nächste Zahl auf... usw.","","PL","","","","",""],["Powerpoint-Karaoke","","Präsentation","DaF Sprechen","","","","Die TN improvisieren Referate zu fertigen Überraschungs-Präsentationen, deren Inhalt man vorher nicht kennt. Man kann die Dias aber vorher auch studieren und in Kleingruppen üben, bevor man es vor allen präsentiert.","PPP","GA > PL","","","http://www.kapopo.de/","",""],["QR-Code-Extras","","Präsentation","","","","Differenzieren","Für Schnelle / Langsame: weiterführende Informationen, Zusatzaufgaben, Hilfestellungen Alternative Lernwege: Audios, Videos, Interaktive Karten, Spiele, Bilder… Bei Präsentationen: Weiterführende Materialien, Erklärung für Fachbegriffe Arbeitsaufträge: mehrschrittige Aufgaben – Aufgaben und Material in Ordner ablegen, das AB enthält nur die QR-Codes für die Ordner","","","","","http://goqr.me/de/","",""],["Wer kann was-Geschäft","","Kennen lernen","Kooperation","","","","Mit diesem Spiel sollen sich die TN besser kennenlernen und unbekannte Eigenschaften am Anderen herausfinden. In Kleingruppen (6) muss die Gruppe ein möglichst interessantes Geschäft gründen. Dazu sollen sie überlegen, welche Art von Geschäft es werden soll, welche Produkte oder Dienstleistungen sie anbieten wollen und wer welche Aufgabe in diesem Geschäft übernimmt.  Zu diesen Fragen soll eine kleine Präsentation entworfen werden, die dann im Plenum allen vorgestellt wird. In der Präsentation soll Bezug auf die individuellen Eigenschaften der TN genommen werden.","Papier","GA","","","","",""],["Wandstürmer","","Kooperation","Problemlösung","","","","Die Gruppe bekommt die Aufgabe, ein Stück Kreppklebeband möglichst weit oben an einer Wand zu befestigen. Dabei dürfen keine Hilfsmittel verwendet werden. Nach einer kurzen Beratungsphase muss die Gruppe sagen, wie hoch sie es schaffen wollen und dann muss die Aufgabe bewältigt werden.  Unbedingt auf die Sicherheit der Teilnehmer achten!","Tesa-Krepp","GA","","","","",""],["Gruppenquiz","","Kooperation","Transfer","Kontrolle","Kennen lernen","Wettbewerb / Autonom","Die TN teilen sich in 3–5 gleich große Gruppen auf, und wählen einen Gruppennamen. Jede Gruppe überlegt sich Fragen zu einem vorgegebenen Thema (eine pro TN) und schreibt diese auf Moderationskarten. Jede aus der Gruppe muss die Frage beantworten können. Die Fragen sollen interessant, aber nicht zu einfach sein.  In der Zwischenzeit erstellt die SL eine Punktetabelle auf Flipchart oder auf Packpapier: Eine Zeile pro Runde sowie eine Spalte pro Gruppe.  Wenn alle Gruppen ihre Fragen gesammelt und diskutiert haben, beginnt das Spiel: Aus der ersten Gruppe kommt ein TN nach vorne und liest die 1. Frage vor. Die anderen Gruppen 1 Minute Zeit, in der Gruppe über die Antwort zu diskutieren. Die Gruppe, die nach Ablauf der Zeit (oder schon vorher) glaubt, die Frage beantworten zu können, ruft lauft ”Hier!“ / klingelt.... Der TN, der die Frage gestellt hat, zeigt dann willkürlich auf jemanden aus der Hier-Gruppe, die dann die Frage beantworten muss. Findet der Fragensteller die Antwort richtig, bekommt die Gruppe einen Punkt. War die Antwort falsch, darf eine andere Gruppe antworten. Pro Runde darf jede Gruppe nur einmal antworten.  Weiß keine Gruppe die richtige Antwort, zeigt die SL auf jemanden aus der Gruppe, die die Frage gestellt hat, die dann die gewünschte Antwort sagt. Dann stimmen die anderen Gruppen darüber ab, ob sie die Frage (und die Antwort natürlich) interessant fanden. Wenn mindestens ein Viertel der TN aus den anderen Gruppen  für ”interessant“ stimmen, bekommt die fragende Gruppe einen Punkt pro Gruppe, die falsch geantwortet hat. Sonst bekommt die fragende Gruppe nichts (deswegen muss man interessante, aber nicht zu einfache Fragen stellen!)","","GA","","","","",""],["Die verrückte Professorin","","Akivieren","Kooperation","","","","Eine TN wird zur Professorin gewählt, die zwar sehr genial, aber auch etwas verrückt und vor allem extrem vergesslich ist. Sie hat vor kurzem eine geniale Erfindung gemacht, aber leider vergessen, was genau es war. Sie hat nur noch die Bewegung ihrer Hände, um sich wieder daran zu erinnern. Die Professorin verlässt zuerst den Raum. In ihrer Abwesenheit einigt sich die Gruppe auf eine ”Erfindung“, die die Professorin ”erfunden“ hat und die sich (hoffentlich) gut in Gesten darstellen lässt: Das Internet, die Kaffeemaschine, das Handy, der Laminator, der motorisierte Milchaufschäumer . . .  Danach sucht die Gruppe noch eine zweite TN aus, die die Reporterin sowie die Hände der Professorin spielen.  Die ”Professorin“ wird hereingerufen, setzt sich vor der Gruppe auf den Stuhl und lässt die Arme hängen. Die ”Hände der Professorin“ kniet sich hinter die Professorin und steckt ihre Arme unter den Achseln der Professorin durch. Dann zieht sie die Jacke umgekehrt über die Arme, so dass die echten Arme der Professorin nicht zu sehen sind und das zweite Paar Arme stattdessen gestikulieren kann.  Die ”Reporterin“ setzt sich schräg gegenüber der Professorin auf einen Stuhl und fängt mit dem Interview an. Auf die Fragen antworten ”die Hände der Professorin“ mit Gesten, die die Professorin zu verstehen zu versucht und dann ihren Teil dazu sagt. Nach dem Smalltalk am Anfang werden die Fragen der Reporterin immer konkreter, bis die Professorin schließlich erraten hat, um welche Erfindung es geht.  Beispiel: Reporterin: Guten Tag, Frau Professorin. Wie geht es Ihnen heute? Hände: (Daumen hoch.) Professorin: Danke, danke, sehr gut. Reporterin: Ich habe schon viel von Ihrer neuen Erfindung gehört. Was ist aus Ihrer Sicht das Herausragende an Ihrer Erfindung? Hände: (ziehen ein sehr großes Quadrat auf) Professorin: Dass . . . dass sie sehr groß und eckig ist. Und dass man damit . . . Hände: (zeigen in die Mitte) Professorin: . . . ähm, und dass man etwas hineintun kann. Reporterin: Ah, sehr interessant. Und was kann man dort hineintun? Hände: (Trinkbewegung) Professorin: Ähm, Tassen. Ja, Tassen!","Jacke","PL","","","","",""],["Rapunzel","","Aktivieren","Wahrnehmung","","","","Eine TN ist die ”Rapunzel“ (also dienenige, die raten soll). Jemand, der das Spiel schon kennt, sagt: Rapunzel, Rapunzel, hör aufs Wort! Geh nicht eher, bis ich sage: Geh! Nach einiger Zeit schickt sie Rapunzel mit dem Wort ”Geh!“ aus dem Raum. Nach ein paar Sekunden wird Rapunzel durch die geschlossene Tür wieder hereingerufen. Sie muss dann einer Spielerin die Hand geben. Das Ganze wiederholt sich mit dieser Rapunzel so lange, bis diese das Muster erkannt hat oder keine Lust mehr hat. Dann ist jemand anderes die Rapunzel. Achtung Lösung: Rapunzel muss derjenigen die Hand geben, die nach dem obli- gatorischen Spruch als Erste redet. Deswegen kann Rapunzel auch erst hinausgeschickt werden, wenn jemand etwas gesagt hat.","","PL","","","","",""],["Wanderndes Klatschen","","Kooperation","Konzentration","","","","Die TN stellen sich im Kreis auf. Jemand wendet sich einer Nachbarin zu und klatscht in die Hände. Die Nachbarin hat sich inzwischen ebenfalls sich der ersten zugewandt und klatscht zeitgleich in die Hände. Danach gibt sie das Klatschen in die gleiche Richtung weiter – oder gibt es wieder zurück. Direkt nach dem Zurückgeben darf nicht noch einmal zurückgegeben werden. Das Spiel läuft gut und macht richtig Spaß, wenn ein gemeinsamer Rhythmus entstanden ist. Nach und nach kann dann das Tempo erhöht werden.  Besondere Hinweise: Dieses Spiel ist miteinander, nicht gegeneinander – es geht dabei nicht darum, die anderen auszutricksen! Ziel ist der gemeinsame Rhythmus und das Gruppenerlebnis dabei.","","PL","Stehkreis","","","",""],["Vergrößerungskreis","","Aktivieren","Wahrnehmung","Kooperation","","","s. Anhang","keine","PL","Stehkreis","vergr__erungskreis.jpg","","",""],["Aus der Zeitung lesen","","Aktivieren","Konzentration","Einstieg","Körpersprache","","s. Anhang","Zeitung für jeden TN","EA","freier Raum","aus_der_zeitung_lesen.jpg","","",""],["Mimische Kette","","Aktivieren","Wahrnehmung","Körpersprache","","","s. Anhang","keine","PL","Stehkreis","mimische_kette.jpg","","",""],["Seminarraum-Feedback","","Feedback","Evaluation","","","","Am Ende des Seminartages / Seminars wählt jeder TN einen Gegenstand aus dem Seminarraum und schildert den Tag aus dessen Perspektive. (Kurze Nachdenkzeit geben.)","keine","PL","Sitzkreis","","","",""],["Haltungs-Echo","","Wahrnehmung","Feedback","","","","s. Anhang","keine","PA","je 2 Stühle einander gegenüber","haltungsecho.jpg","","",""],["Stolz auf","","Kennen lernen","DaF Sprechen","Körpersprache","","","s. Anhang","Zettel mit Anweisungen","FA","","stolz_auf.jpg","","",""],["Ja! Nein! Doch!","","Aktiveren","Konzentration","","","","TN stehen im Kreis. Sie wenden sich zum Nachbarn und klatschen ihn an. JA - rechts, NEIN - links, quer durch den Kreis jemanden anklatschen: DOCH!","keine","PL","Stehkreis","","","",""],["Lebendige Relativsatzkette","","Aktivieren","Einstieg","DaF GR","","","Die TN stehen oder stizen im Kreis. Der SL steht in der Mitte, streckt seine Hand aus und beginnt mit einem Satz, z.B. ich bin ein Kellner. Wer weiterführen kann, steht auf, fasst die Hand an, und sagt einen Relativsatz: Ich bin der Teller, den der Kellner trägt. Der SL geht aus dem Kreis, ein nächster TN setzt die Kette fort: Ich bin die Pizza, die auf dem Teller liegt. ... usw.","","PL","Sitzkreis","","","",""],["Handmassage","","Entspannung","Konzentration","","","","In der Mitte der Handinnenfläche befindet sich ein wichtiger Meridianpunkt. Die SL lässt die TN einen Partner für die Handmassage auswählen und weist sie in den Ablauf ein, sobald sich beide gegenübersitzen. Eines beginnt und legt nun seine rechte Hand mit der Handfläche nach oben in die linke Hand des Partners (bei Linkshändern in die rechte). Dieses kreist nun mit dem Daumen zuerst sachte um den Energiepunkt. Und massiert dann, von ihm ausgehend, die gesamte Hand mit langsamen, festen und streichenden Bewegungen. Abschließend wird jeder Finger einzeln vom Handteller aus bis hin zur Fingerspitze abgestreift. Dann wird gewechselt.","","PA","","","","",""],["Arche Noah","","Konzentration","Aktivieren","DaF WS","","Kettenübung","Alle sitzen im Kreis. Der KL beginnt zu erzählen: „Noah nimmt zwei Spatzen mit in die Arche, piep – piep.“ Ihr rechter Nachbar fährt fort: „Noah nimmt zwei Spatzen mit in die Arche, piep – piep, und zwei Hunde, wau – wau.“ Dessen rechter Nachbar ergänzt: „Noah nimmt zwei Spatzen mit in die Arche, piep – piep, und zwei Hunde, wau – wau, und noch zwei Kamele, gurgel – gurgel.“ Jeder TN muss immer alle Tiere und Stimmen wiederholen und ein neues Tierpaar mit den dazugehörigen Stimmen hinzufügen. Wer sich verspricht oder nicht mehr weiter weiß, muss eine Runde aussetzen.  Zu den Geräuschen kann sich jeder auch noch eine Bewegung des Tieres ausdenken und präsentieren.","","PL","Sitzkreis","","","",""],["Zen","","Konzentration","","","","","Die TN stehen im Kreis. TN 1 sagt „A“ und hält sich die flache Hand quer über den Kopf. Je nachdem, in welche Richtung die Fingerspitzen deuten (nach rechts oder links), antwortet sein rechter oder linker Nachbar: „Wer?“ TN 1 antwortet „Du“, und zeigt dabei mit der noch freien Hand auf einen dritten Teilnehmer (TN 3) im Kreis. Die andere Hand bleibt währenddessen über dem Kopf. TN 3 setzt das Spiel fort, indem er wiederum „A“ sagt und eine Hand über seinen Kopf hält usw.","","PL","Stehkreis","","","",""],["Huhn und Ei","","Konzentration","","","","","Jeder TN erhält eine Zahl, indem von 1 an durchgezählt wird. TN 1 beginnt und sagt: „Mein Huhn legt 14 Eier!“ TN 14 fragt: „Warum denn 14?“ – TN 1 fragt zurück: „Wie viele denn sonst?“ – TN 14: „Na, 7!“ Daraufhin TN 7: „Warum denn 7?“ – TN 14: „Wie viele denn sonst?“ TN 7: „Na, 5.“ TN 5 antwortet: „Warum denn 5?“, usw.","","PL","Sitzkreis","","","",""],["Ich sage Knie","","Konzentration","DaF WS","","","Bewegung","Die TN stehen oder sitzen im Kreis. TN 1 beginnt und sagt: „Ich sage Knie“, und fasst sich dabei ans Ohr. Sein linker Nachbar, TN 2, sagt: „Ich sage Nase“ und fasst sich dabei an das Knie. TN 3 fasst sich an die Nase und ruft: „Ich sage Ellenbogen“, usw. Jeder fasst also das an, was der andere gesagt hat und benennt dazu gleichzeitig ein neues Körperteil.","","PL","Sitzkreis Stehkreis","","","",""],["Ja nein","","Konzentration","","","","","Die TN stehen in einem engen Kreis. A beginnt, dreht den Kopf zur rechten Schulter und sagt: „Ja“. B, der rechte Nachbar, dreht seinen Kopf ebenfalls nach rechts und sagt: „Ja“. Dies wird von C aufgegriffen usw. Jeder sollte diese Aktionen möglichst schnell ausführen. Wenn nun D den Kopf einfach gerade lässt und nichts sagt, so ist das das Stopp-Signal. C muss dann nach links (also in die andere Richtung) ein „Nein“ weitergeben. In dieser Übung gibt es also abwechselnd Ja- und Nein-Runden, die durch Schweigen und Unbeweglichkeit eines Spielers ihre Richtung ändern. Das erfordert eine besondere Aufmerksamkeit, denn auch der Wechsel sollte möglichst schnell geschehen.","","PL","Stehkreis","","","",""],["Verfolgen","","Konzentration","Wahrnehmung","","","Bewegung","Alle gehen zur Musik kreuz und quer durch den Raum. Jeder sucht sich heimlich einen Mitspieler, den er unauffällig verfolgt. Bricht die Musik ab, versucht jeder sein bisher verfolgtes Opfer zu fangen. Falls er vorher nicht selbst gefangen wird.","Musik","PL","","","","",""],["Brautschau","","Gruppenbildung","","","","Bewegung","Jeder TN zieht einen Zettel, den er den anderen nicht zeigen darf. Auf ein Kommando hin stellen alle gleichzeitig ihr Tier pantomimisch dar. Es geht darum, seinen jeweiligen Partner zu finden. Wenn sich alle Paare gefunden haben, führt jedes Paar zusammen seine Bewegungen noch einmal vor. Die anderen raten dann, um welches Tier es sich handelt.","Zettel mit Tiernamen","PL","","","","",""],["Modespionage","","Kennen lernen","Wahrnehmung","","","","Die TN bilden Paare. Die Paare haben nun Gelegenheit, sich eine Weile zu unterhalten, ohne schon ihre genaue Aufgabe zu kennen. Nach etwa 3 Minuten werden alle A- Partner vor die Tür geschickt. Die B-Partner bekommen die Aufgabe, möglichst genau aufzuschreiben, was ihr A-Partner anhatte. Die A-Partner werden jetzt wieder hereingerufen. Alle B-Partner lesen jetzt laut ihre Modespionageberichte vor und diese werden mit der tatsächlichen Kleidung der A-Partner verglichen. Wirkung Mit dieser Übung kann man sich bewusst werden, wie aufmerksam man Details seines Gegenübers wirklich wahrnimmt – vor allem dann, wenn der Fokus auf etwas anderes gerichtet ist, wie z. B. auf den Inhalt des Gesprächs.","","PA","","","","",""],["Auf- und abzählen","","Feedback","Wiederholung","Transfer","","","Die TN benennen einen Abzähler, seine Aufgabe ist, die Punkte zu zählen und auf die Zeit zu achten. Alle anderen TN haben die Aufgabe, möglichst viele Begriffe zu nennen, die sie jetzt gelernt haben und diese zu erklären. Wenn jemand einen Begriff nennen will. steht er auf. Der KL sagt, ob die Erklärung einen Punkt wert ist. Für jeden Punkt bekommt die Gruppe 1 Min. Extrapause oder ein Stück Kuchen..","","PL","","","","",""],["Ideenkorb","","Erfahrung","Ideen","Feedback","","","Die TN sitzen im Kreis. Ein TN beschreibt ein Problem aus seiner Praxis. Die anderen beschreiben Lösungsvorschläge (am besten als wenn, dann...), die aber nicht kommentiert werden. Am Ende kann der TN, dem das Problem gehört, sagen, was er davon mitnimmt und ausprobieren will.","","PL","Sitzkreis","","","",""],["Eine Minuten Stille und nichts tun","","Konzentration","","","","","Die TN setzen sich bequem hin - und tun 1 Minute lang nichts. Keine Musik, niemand redet. Dient der Entspannung und dem Sortieren der Gedanken und der Verdauung :-)","","EA","","","","",""],["Namens-Aufsage-Rekord","Namensstress, Namensrekordkette","Kennen lernen","Namen lernen","","","","Die Gruppe stellt sich in einen Kreis auf und einer stoppt mit einer Uhr. Jetzt muss einer anfangen und den Namen vom linken Nebenmann sagen, der dann wieder den vom linken... Bis alle Namen einmal im Kreis herum genannt wurden. Jetzt könnt ihr versuchen neue Geschwindigkeitsrekorde aufzustellen! Das Spiel eignet sich vor allem für große Gruppen.","","PL","Stehkreis","","","",""],["Köln oder Sahara","","Kennen lernen","Aktivieren","","","","Die TN stehen frei im Raum. Jeder entscheidet sich im Stillen für eine Alternative: für Sonne oder für Regen. Die Musik beginnt, und alle TN laufen nun im Raum herum. Wenn der Trainer die Musik stoppt, sucht sich jeder den Partner, der ihm am nächsten ist. Wer Regen gewählt hat, trommelt mit seinen Fingerspitzen dem Partner auf den Arm oder auf den Kopf. Wer sich für Sonne entschieden hat, wärmt den anderen, z. B. mit einer Umarmung oder indem er seine Hände auf den Arm des Partners legt oder dies im Abstand vom Körper des anderen nur andeutet.  In der Variante mit Körperkontakt wird das Spiel besser erst eingesetzt, wenn sich die TN schon etwas kennen und Sie als Trainer festgestellt haben, dass es sich um eine spielfreudige Gruppe handelt.  Der Trainer kann nun Aufgaben stellen: Treffen zwei Sonnen oder zwei Regen aufeinander, sollen die Partner eine Gemeinsamkeit herausfinden. Danach verwandeln sich beide in das Gegenteil (also eine Sonne in Regen und umgekehrt).  Trifft Sonne auf Regen, dann suchen die Partner im Gespräch Gegensätze, die sie voneinander unterscheiden. Nach dem Gespräch bleiben sie in ihren Rollen (Sonne bleibt Sonne, Regen bleibt Regen).  Wirkung: Mit dieser Übung lernen sich die TN noch ein wenig mehr kennen und erfahren etwas voneinander. Gleichzeitig stehen sie auf und kommen in Bewegung – eine gute Unterbrechung bei langer Kopfarbeit.","","CP","","","","",""],["Body percussion","","Aktivieren","Konzentration","Gruppendynamik","","","Alle stehen im Kreis und klatschen im gleichen Rhythmus:  pap – in die Hände klatschen  pa-pap – auf die rechte und linke Brustseite schlagen pa pap – auf den rechten und linken Oberschenkel schlagen Mit dem rechten und dann mit dem linken Fuß trampeln  Man beginnt in einem gemäßigten Rhythmus und lässt so erst einmal die Energie wirken, die durch das gemeinsame Klatschen entsteht. Später kann man das Ganze schneller machen. Dabei sollte jedoch darauf geachtet werden, dass alle im gleichen Rhythmus klatschen.  Wirkung. Die Übung hat eine sehr energetisierende Wirkung. Durch das Gleichmaß entsteht ein tolles Gruppengefühl. Geht etwas schief, hat das Spiel auch eine amüsante Komponente.","","PL","Stehkreis","","","",""],["Postkarten beschreiben","","Wahrnehmung","Einstieg","DaF Sprechen","","","Die TN bilden Paare. Sie setzen sich mit ihren Stühlen Rücken an Rücken. 1. Phase: Karten beschreiben. Der KL gibt jedem A eine Karte so, dass B sie nicht sehen kann. A muss ihm nun diese Karte beschreiben, er darf jedoch dabei nicht sagen, was darauf abgebildet ist, also keine Gegenstände oder Inhalte nennen, er darf nur Formen, Farben und Stimmungen auf der Karte schildern. Nach einiger Zeit wird gewechselt: Nun bekommt B eine Karte, die er nach diesen Regeln dem A beschreiben muss.  2. Phase: Karten finden. Wenn beide Runden abgeschlossen sind, sammelt der KL die Postkarten wieder ein und legt sie mit vielen anderen Karten vermischt auf den Boden oder auf einen Tisch. Jeder TN muss jetzt versuchen, die Karte zu finden, die sein Partner beschrieben hat.  3. Phase: Auswertung im Plenum. Danach schildern die TN der Gruppe ihre Erfahrungen: Was hat es leicht oder schwer gemacht, die Karten zu beschreiben? Was hat es leicht oder schwer gemacht, die richtige Karte zu finden? Wirkung: Dies ist eine ruhige Übung, in der die TN neue Erfahrungen machen, wie unterschiedlich Wahrnehmungen gemacht und kommuniziert werden können.","Postkarten","PA","Stühle Rücken an Rücken","","","",""],["Kreuzbeinkampf","","Aktivieren","Körpersprache","","","","Ihr kennt es von Angelina: Es werden Paare gebildet, bei denen die Partner in etwa gleich groß und schwer sein sollten. Alle Paare stellen sich jeweils Rücken an Rücken in einer Reihe in der Mitte des Raums auf. Sie gehen leicht in die Knie und berühren sich mit dem unteren Rücken (dem Kreuzbein-Bereich). Dabei sollten beide Rücken gerade sein. Auf ein Startzeichen des Trainers versucht nun jeder, seinen Partner über die Mitte des Raumes hinauszuschieben – bis hin zur anderen Raumseite. Aber Vorsicht, nicht gegen die Wand drücken!  Der Trainer kann den TN folgende Tipps geben: Man hat mehr Kraft, wenn man bei Anstrengung ausatmet, statt den Atem anzuhalten. Ganz wirkungsvoll ist es, direkt beim Losschieben auch einen lauten (Karate-)Schrei tief aus dem Bauch heraus auszustoßen. Das gibt einem selbst mehr Energie – während es den anderen vielleicht für einen Augenblick erschreckt. Und es macht Spaß!  Wichtig: Bei Holzfußböden kann das Spiel schon einmal eine rutschige Angelegenheit werden. Mit Gummisohlen oder barfuß geht es am besten.","","PA","","","","",""],["Lebendige Maschine","","Kooperation","Aktivieren","","","","Alle stehen auf der einen Seite des Raumes, auf der anderen Seite ist die leere „Bühne“, auf der nach und nach eine aktive Maschine unter Mitwirkung aller TN entstehen soll. Ein TN beginnt. Er geht auf die Bühne und macht eine Bewegung und ein Geräusch dazu. Beispiel: Er stampft immer wieder mit dem Fuß auf und sagt dazu „Bumm“ oder macht ein Geräusch („ Pffftt“). Ein zweiter TN gesellt sich zu ihm und macht ebenfalls eine Bewegung und ein Geräusch. Dabei sollte er eine Verbindung zum ersten TN herstellen, sodass sie nicht einfach unverbunden nebeneinander stehen. z.B. er macht mit seinem rechten Arm eine vor und zurück wiegende Pumpbewegung, die direkt über das Bein des ersten TN führt. Oder er tippt immer mit dem Zeigefinger leicht auf den Arm des anderen und ruft dabei „Ping“.  Nach und nach kommen alle TN nach vorne, bis sie gemeinsam eine Maschine voller Bewegung und Geräusche darstellen.","","PL","","","","",""],["Schulter-Domino","","Konzentration","Aktivieren","","","","Alle bilden stehend einen Kreis und lassen die Arme seitlich locker hängen. Der Trainer beginnt, indem er heftig einatmet und dabei seine beiden Schultern so hoch zieht, wie nur möglich. Sein linker Nachbar macht das Gleiche. Die Bewegung wird fortgeführt von dessen linken Nachbarn usw. Einatmen und Schulternhochziehen pflanzen sich also im Kreis fort – zuerst nach links, im Uhrzeigersinn. Alle ziehen nacheinander die Schultern hoch und lassen sie solange oben (halten aber nicht unbedingt solange den Atem an), bis die Bewegung wieder bei dem Trainer angekommen ist. Dieser atmet hörbar aus (es ist entspannend, dabei einen lauten ausatmenden Ton zu machen) und lässt seine Schultern sinken. Auch das pflanzt sich dann nach links weiter fort. Nacheinander atmen alle aus und lassen die Schultern sinken.  Das erfordert Konzentration. Oft lassen zwei TN gleichzeitig die Schultern fallen oder es kommt zu Stockungen. Ziel der Übung ist es, dass die Bewegung schnell und in einem gleichmäßigen Rhythmus die Runde macht, einer nach dem anderen.  Nachdem die Übungsrunde abgeschlossen ist, geht es richtig los: Die Runde geht links herum, anschließend geht es rechts herum. Der Trainer fordert die TN auf, noch schneller zu werden. In erhöhtem Tempo geht es noch mal nach links und nach rechts.  Dann kommt eine weitere Steigerung: Nun werden beide Schultern einzeln gehoben und gesenkt. Geht die Bewegung links herum, wird erst die rechte Schulter, dann die linke gehoben, sowohl beim Ein- als auch beim Ausatmen. Geht der Kreis rechts herum, beginnen alle mit der linken Schulter. Das ist für jeden eine Herausforderung, der gerne rechts mit links verwechselt.","","PL","Stehkreis","","","",""],["Wäscheklammer-Jagd","","Aktivieren","","","","Bewegung","Jeder TN bekommt drei Wäscheklammern (am besten Holzklammern, die stabiler als Plastikklammern sind). Der Spielraum ist durch einen Stuhlkreis begrenzt. Niemand darf sich außerhalb dieses Kreises bewegen. 1. Runde: Geben Die Aufgabe in der ersten Runde besteht darin, den anderen all seine Wäscheklammern anzustecken, also selber keine zu behalten. Während man eine Klammer an das Hemd eines anderen klemmt, kann es passieren, dass man selber gerade eine angeheftet bekommt. Nach einer Weile des Tobens, Laufens und Lachens unterbricht der Trainer. Wer die wenigsten Klammern an sich hat, hat gewonnen. Sie können aber auch scherzhaft denjenigen mit den meisten Klammern als Gewinner küren. 2. Runde: Nehmen In der zweiten Runde lautet die Aufgabe, den anderen möglichst viele Klammern wegzunehmen. Die TN dürfen die ergatterten Klammern jedoch nicht etwa in der Hand verstecken, sondern sie müssen sie sofort an sich heften – und zwar an sichtbaren Stellen! Allerdings ist es jedem TN überlassen, wo er die Klammern anbringt. Manche sind hier sehr kreativ und wählen Regionen, die schlecht erreichbar sind (z. B. die Hosenbeine ganz unten) oder an sich für andere tabu sind.","3 Wäscheklammern pro Person","PL","freier Platz / im Freien","","","",""],["Laufcharade","","Aktivieren","Einstieg","DaF WS","Wiederholung","Wettbewerb","Die TN werden in gleich große Gruppen aufgeteilt. Die Gruppen stellen sich in verschiedene Ecken des Raumes. Der KL bleibt in der Mitte mit der Liste, auf der untereinander verschiedene Begriffe (Komposita) stehen.  Aus jeder Gruppe kommt ein TN in die Mitte, und der KL zeigt jedem den ersten Begriff. Die TN laufen nun zu ihrer Gruppe zurück und stellen diesen Begriff pantomimisch dar. Geräusche sind nicht erlaubt. Mit den Fingern können sie anzeigen, ob sie den ersten Teil des Wortes darstellen oder den zweiten. Die Gruppenmitglieder raten nun, was für ein Begriff gesucht wird – möglichst leise, damit die anderen Gruppen ihre Vermutungen nicht hören.  Wenn eine Gruppe den Begriff herausgefunden hat, kommt der nächste TN in die Mitte, (z.B. derjenige, der die Lösung gefunden hat), flüstert dem KL die Lösung zu und bekommt dann den nächsten Begriff gezeigt.  Gewonnen hat die Gruppe, die zuerst alle Begriffe herausgefunden hat.","Liste mit Wörtern","GA","","","","",""],["Fall in Ohnmacht","Zusammenbruch","Wahrnehmung","Kooperation","Vertrauen","","","Die TN bilden einen Kreis, zählen sich immer von eins bis sechs ab und merken sich ihre Zahl. Der Spielleiter stellt Musik an und die Mitspieler bewegen sich dazu im Raum. Immer wenn der Spielleiter die Musik ausschaltet, ruft er eine Zahl zwischen eins und sechs. Diejenigen Mitspieler, deren Zahl aufgerufen wurde, schreien laut auf und fallen anschließend langsam zu Boden, als fielen sich plötzlich in Ohnmacht.  Andere, die neben ihnen stehen, reagieren blitzschnell und fangen sie im Fallen auf. Danach wird die Musik erneut angestellt und alle bewegen sich wieder im Raum usw.","Musik","PL","freier Platz","","","",""],["Gruppenscrabble","","Kooperation","DaF WS","","","","Die TN werden in zwei oder drei Teams (mit bis zu acht Personen) aufgeteilt. Jedes Team erhält die gleiche Anzahl an Buchstabenkarten seiner Farbe und muss daraus innerhalb von einer Minute ein Wort mit einem möglichst hohen Gesamtpunktwert bilden. Nach Ablauf der Zeit stellt sich jedes Team in einer Reihe auf und hält die verwendeten Buchstaben als Lösungswort in die Höhe. Die Werte der einzelnen Buchstaben des Wortes werden addiert und dem jeweiligen Team als Punkte gutgeschrieben. In der nächsten Runde bekommen die Teams eine neue Auswahl an Buchstaben und suchen wieder ein möglichst „hochwertiges“ Wort. Das Team, das nach zehn Runden die meisten Punkte erreicht hat, hat gewonnen.","pro Team 3 × 26 Buchstabenkarten von A bis Z à DIN A6 (für jedes Team auf andersfarbigem Papier)","GA","","werte_gruppenscrabble.jpg","","",""],["Wechselnde Aufsatzbeiträge","","Einstieg","DaF Schreiben","","","Ritual","kurze Textanalyse oder Erörterung: Jeder TN ist für einen speziellen (Themen-)Beitrag für eine bestimme Unterrichtsstunde zuständig. Plan erstellen, Themen verteilen die Themen, Frist bestimmen. Solang hat der jeweilige TN dann Zeit, den Text zu mailen. Der KL kann interessante Auszüge herausgreifen und besprechen, Handouts verteilen und den kompletten Text zur Diskussion stellen oder den Textbeitrag als Basis nehmen und sich weiterführende Aufgaben ausdenken.","Themen, Textanfänge, Bilder als Impulse","EA/PA","","","","",""],["Social Media Stimmungsbarometer","","DaF LV","DaF Sprechen","","","","Die TN sollen bis zur nächsten Stunde gezielt darauf achten, was in sozialen Netzwerken zu einem bestimmten Thema gepostet wird. Die Beiträge, die ihnen besonders auffallen, sollen sie notieren oder als (anonymisierte) Screenshots mitbringen. Gemeinsam können Sie sich dann ein Bild von der Stimmung machen, einzelne Posts diskutieren und über Auffälligkeiten sprechen. So kann man aktuelle Themen ganz leicht im Unterricht aufgreifen und regen die TN anregen, auch in den vermeintlich harmlosen, privaten Netzwerken Gelesenes zu hinterfragen.","","EA > GA / PL","","","","",""],["Smartphone-Eindrücke","","Einstieg","Erfahrung","","","","Am Anfang eines neues Themas:  Vor dem Beginn Thema nennen, TN haben eine  Woche Zeit: Mit dem Smartphone machen sie Fotos oder kurze Videos von dem, was ihnen zu dem Thema einfällt bzw. im Alltag begegnet. Sie teiln die Ergebnisse (Mail, Dropbox, Gruppe). Die interessantesten Beiträge zur Themeneinführung in der Gruppe diskutieren.","","EA > GA / PL","","","","",""],["Nanu?","","Konzentration","Einstieg","DaF WS","","","Die Bildkarten werden offen auf dem Tisch verteilt. Dann werden die 5 Deckel über 5 beliebige Karten gelegt. Dabei merken sich alle TN, was unter welchem Deckel liegt. Wer an der Reihe ist, würfelt und nennt den Gegenstand, der unter dem Deckel der gewürfelten Farbe liegt: \"Unter dem blauen Deckel liegt der Apfel.\" Ist die Antwort korrekt, nimmt der Spieler die Karte an sich und legt den Deckel, für alle sichtbar, auf eine andere Karte: \"Ich lege den blauen Deckel auf das Schiff.\" Hat sich der/die Spieler/in geirrt, ist der/die nächste an der Reihe.  Wer am Ende die meisten Karten gesammelt hat, gewinnt.","24 runde Bildkarten, 5 Plastikdeckel in verschiedenen Farben, 1 Farbwürfel","GA","","","","",""],["Ein solches Ding","","DaF WS","Wiederholung","","","Wettbewerb","Jeder Mitspieler bekommt 9 Karten vom Stapel. Karten verdeckt halten. 1 zusätzliche Karte vom Stapel wird aufgedeckt und neben \"EIN SOLCHES DING...\" gelegt. Die Spieler legen reihum je eine Karte aus der Hand offen in die Mitte. So entsteht dort eine Kette von Eigenschaften, die auf EIN SOLCHES DING zutreffen sollen. Wer an der Reihe ist legt entweder eine weitere Karte aus dem eigenen Vorrat offen an die Kette an, oder bringt die Kette zum Platzen, fragt den Vorgänger was das ist. Die Befragte muss ein Ding nennen, für das alle Karten der Kette zutreffen. Schafft der Spieler es nicht, alle zu überzeugen, muss er 3 Karten vom Stapel aufnehmen; schafft er es, so nimmt der Frager 3 Karten auf.Die Kette dieser Runde wird entfernt, und die Spieler decken eine Anfangskarte vom Stapel auf.. Der auf den Verlierer folgende Spieler darf die zweite Karte zur neuen Kette anfügen,. Ausnahme: Wer nur noch eine einzige Karte in der Hand hat, beginnt nie eine Kette – in diesem Fall trifft dieses Vorrecht den nächstfolgenden Spieler. Gewonnen hat, wer zuerst alle Karten loswird.","Kartenset","GA","","Ein-solches-Ding-Beispielreihe.jpg","","",""],["Der Ruf eilt voraus","","Kennen lernen","Konzentration","","","","Die TN stehen im Kreis. Das Ziel: per Handdruck ein Signal nach rechts oder links weiterzuschicken.  1. Runde: Während des Händedrucks den eigenen Namen nennen. 2. Runde: Während des Händedrucks den nächsten Namen nennen. 3. Runde: Während des Händedrucks den übernächsten Namen nennen. Wer ist als erstes konfus?","","PL","Stehkreis","","","",""],["Der Ruf eilt voraus 2","","Kennen lernen","","","","","Die TN stehen im Kreis. Das Ziel ist, per Händedruck einen Namen weiterzugeben. Immer derselbe Name wird einmal im Kreis herumgeschickt. Der/die entsprechende TN läuft dabei so schnell wie möglich einmal außen um den Kreis herum, um möglichst dann wieder am eigenen Platz zu stehen, bevor alle den Namen genannt haben. Start ist jeweils, wenn die 5. Person von dem/der LäuferIn aus den Namen genannt hat.","","PL","Stehkreis","","","",""],["Marktplatz","","Gruppenbildung","","","","","Für jede Gruppe, die benötigt wird, braucht man einen Gegenstand in so vielen Ausführungen wie TN da sein sollen. Z.B. 5 Gabeln, 5 Löffel, etc. oder 3 Bleistifte, 3 Kugelschreiber, etc. Jeder TN erhält erst einmal einen Gegenstand, es wird Musik gespielt. Während der Musik werden die Gegenstände wahllos getauscht. Hört die Musik auf, müssen sich die Gruppen je nach Gegenstand finden (also alle Löffel, alle Kulis,…)","Gegenstände, Musik","CP","","","","",""],["Versteckte Fragen","","Wiederholung","Transfer","Einstieg","","","Vorbereitung: Fragen – zum vorigen Thema, zu der Gruppe, zu der Stadt, zum neuen Thema... - auf Kärtchen vorbereiten und bevor die TN eintreffen, überall im Raum verstecken.  Die Gruppe in zwei Teams aufteilen, die Spielregeln erklären und die Anzahl der versteckten Fragen nennen (die Zahl an die Tafel schreiben und während des Spiels aktualisieren, wie viel noch zu finden sind). Die TN suchen den Raum nach den Karten ab. Hat jemand eine Karte gefunden, kommt er damit zum KL und versucht die Frage zu beantworten. Gelingt ihm das, kann er weitersuchen – und sein Team bekommt 2 Punkte. Ist die Antwort nicht korrekt, kann jemand von seinem Team für 1 Punkt – oder der nächste für 0,5 Punkte – die Frage beantworten. Auf einmal kann jeder TN nur eine Karte mitnehmen, es ist auch nicht erlaubt, eine Karte weiterzugeben. Das Spiel endet, nachdem alle Karten gefunden wurden oder nach einer vorher vereinbarten Zeit. Gewonnen hat das Team mit den meisten Punkten.","Kärtchen mit Fragen","GA","","","","",""],["Küchenuhr-Runde","","Kennen lernen","Einstieg","","","","Die TN stehen im Kreis. Eine Küchenuhr wird dreimal durch die Runde gereicht. Die Uhr ist auf zwei Minuten gestellt. Die Zeit läuft. Drei Runden, wobei jeder TN mit dem schnellen Weiterreichen der Küchenuhr eine kurze Information über sich preisgibt / oder eine w-Frage zum Thema beantwortet . Zwei Minuten. Die Zeit läuft. Runde Eins: Jeder nennt den eigenen Namen (... und gibt die Uhr schnell weiter.)  Runde Zwei: Jeder nennt das liebste Reiseziel (... und gibt die Eieruhr weiter.) ...  Die Aussage \"fällt mir nicht ein\" oder vergleichbar, ist nicht erlaubt.","Küchenuhr","PL","Stehkreis","","","",""],["So geht Rumba!","","Aktivieren","","","","Bewegung","Die TN stehen im Kreis. Der SL sagt \"So geht Rumba!\" und zeigt eine Bewegung. Alle im Kreis machen die Bewegung nach. Dann kommt der nächste TN, er sagt \"Nein, Rumba geht so!\" und wiederholt die erste Bewegung und ergänzt sie mit einer anderen Bewegung - alle im Kreis machen nun beide nach. usw....","","PL","Stehkreis","","","",""],["Ein Wort - nur für dich","","Aktivieren","DaF WS","","","","Jeder TN bekommt eine besonders schön gestaltete Wortkarte mit einem für ihn neuen Wort, das mit dem gleichen Buchstaben beginnt, wie sein Vorname und das nach Möglichkeit etwas mit ihm zu tun hat.  Sie schlagen das Wort nach und stellen es in der Gruppe vor.  Fortsetzung: weitere Wörter suchen, evtl. auch zum Buchstaben, mit dem der Familienname beginnt","Wortkarten","EA > PL/CP","","","","",""],["Nützliche Wörter","","DaF WS","","","","","Jeder TN bekommt einen Buchstaben des Alphabets und sucht dazu im Wörterbuch 5 / 10 / 15... Wörter, die er nützlich findet und schreibt sie auf Kärtchen oder auf ein AB.  Fortsetzung: Cocktailparty - herumgehen, anderen die Wörter zeigen, erklären, laut aussprechen. Wenn jemand ein Wort brauchbar findet, notiert er es auf eine leere Wortkarte für seine Vokabelkartei.","Buchstabenkarten","EA > CP","","","","",""],["Mimürfeln","","DaF Sprechen","","","","","Es wird im Uhrzeigersinn gespielt: die TN ziehen eine Situationskarte und würfeln. Die gewürfelte Mimik muss entsprechend der gezogenen Situationskarte versprachlicht werden.  Variante PA: ein TN muss die gewürfelte Mimik entsprechend der gezogenen Situationskarte versprachlichen, der Partner muss darauf angemessen sprachlich reagieren. Der zweite Partner darf die  gewürfelte Emotion außer acht lassen.","Bildkarten / Situationskarten, präparierte Würfel","GA / PA","","mim_rfeln.jpg","","",""],["Vokalspiel","","DaF WS","","","","","Die Spieler suchen Wörter mit möglichst vielen Vokalen und tragen die Buchstaben zeilenweise in die Kästchen ein (siehe Beispiel Verb). Punkte bekommt man nur, wenn in dem Kästchen ein Vokal steht, und nur diese Punkte werden bei jedem Wort zusammengezählt. Hat ein Wort mehr Buchstaben, als Kästchen vorhanden sind, werden die Restbuchstaben in das letzte Kästchen geschrieben. Der Spieler mit den meisten Punkten gewinnt.","AB","GA / PA","","vokalspiel.jpg","","",""],["Taschen-ABC","","DaF WS","Transfer","","","Wettbewerb","Die TN schreiben auf die vorbereiteten Kärtchen jeweils ein Wort. Sie erfragen dann in PA gegenseitig und abwechselnd die ABC-Wörter, z.B.: A: Wie heißt dein Ding mit \"B\"? B: Mein Ding mit \"B\" ist die Banane. Hat Spieler A ebenfalls eine Banane in seinem Taschen-ABC, bekommt keiner der Spieler einen Punkt. Haben Spieler A und B jeweils verschiedene Dinge abgebildet, bekommt jeder Spieler einen Punkt.","AB / Kärtchen","EA > PA","","taschenabc.jpg","","",""],["Pyramide","","DaF WS","Transfer","Einstieg","","","2 Spieler verlassen den Klassenraum. Die restliche Klasse sammelt 5 Begriffe (die z.B. etwas mit dem Unterrichtsstoff der letzten Zeit zu tun haben müssen). Diese Begriffe werden auf die Innenseite der Tafel in eine Pyramide (leicht oben, schwer unten) geschrieben und die Tafel wird zugeklappt. Es werden ein Schiedsrichter und ein Zeitnehmer bestimmt. Das Team wird hereingeholt. Ein S setzt sich auf einen Stuhl vor der Tafel, so dass er diese sehen kann. Der andere S setzt sich ihm gegen über, so dass er die Tafel im Rücken hat. Die Tafel wird aufgeklappt und das Team hat nun z.B. 3 Minuten Zeit, die Begriffe zu erraten. Der S, der Blick auf die Tafel hat, beschreibt die Begriffe; natürlich ohne das Wort an der Tafel zu benutzen (es ist tabu). Der Zeitnehmer kontrolliert und informiert über die Zeit, der Schiedsrichter hakt die erratenen Begriffe ab.","","PL","","","","",""],["Meinungsschlange","","Erfahrung","Einstieg","Diskussion","DaF Sprechen","","Zu einem kontroversen Thema, das wir zu oft schwarz-weiß sehen, zwei Thesen / Aussagen formulieren und auf A3 Blätter / an die Tafel schreiben oder einfach langsam und deutlich sagen. Die Lernenden lernen die zwei Thesen kennen, und müssen dazu eine Stellungnahme formulieren: Sie gehen herum und vergleichen ihre Ansichten. Wenn jeder schon mit jedem gesprochen hatte, richten wir einen Halbkreis ein und befestigen die zwei Thesen an den beiden Enden des Halbkreises / wiederholen wir die Thesen und zeigen auf die zwei Stühle an beiden Enden. Die Lernenden nehmen im Halbkreis Platz: Sie sollen sich einen Stuhl aussuchen, dessen Position ihre Meinung am besten wiedergibt. Wir müssen darauf hinweisen, dass die beiden Enden der Schlange nicht bedeuten, dass die Personen auf diesem Stuhl mit der These voll und ganz einverstanden sind, sondern nur, dass sie dieser These am nächsten stehen. Im Plenum stellen reihum die Lernenden ihre Position dar, und überprüfen damit, ob sie richtig sitzen. Die Gruppe soll darüber abstimmen, ob jemand einen anderen Stuhl nehmen und mit jemanden den Platz tauschen soll.","Stühle, zwei Thesen-Poster","CP > PL","","","","",""],["Lese-Domino","","Input","DaF LV","","","","Die TN verteilen unter sich gleichmäßig die Spielkarten. Der TN, der die START-Karte hat, liest","","","","lesedomino.jpg","","",""],["Wirbelgruppen","","Präsentation","","","","","Für Aufgaben mit wahrscheinlich unterschiedlichen Ergebnissen oder zu unterschiedlichen Aspekten, bei denen ein Produkt (Liste, Modell, Plakat...) entsteht. Gruppen bilden mit Karten: Zuerst arbeiten alle mit dem gleichen Symbol zusammen, in der Auswertungsrunde gibt es dann neue Gruppen (alle Könige / Asse / Damen / Buben...), das Gruppenergebnis bleibt auf dem Tisch liegen, die Gruppen wandern im Uhrzeigersinn von Tisch zu Tisch, schauen sich das Ergebnis an. Der TN, der an der Erstellung des Produktes mitgearbeitet hat, präsentiert das Produkt. Vorteil: Jeder TN muss das Gruppenergebnis präsentieren.","Spielkarten für die Gruppenbildung","GA","Gruppentische","","","2 Runden Breakout-Räume : TN manuell reinziehen oder am Whiteboard durch eine Tabelle, alte und neue Gruppen visualisieren, danach Wahlgruppen einstellen und die TN gehen selbstständig in die Gruppen",""],["Pantomime halb-halb","","Einstieg","Transfer","DaF WS","","","Vorbereitung: Komposita auf einzelne Kärtchen schreiben. Paare bilden. Die TN kommen dann zu zweit nach vorne, sagen, wer von ihnen 1 und wer 2 ist, ziehen ein Kärtchen und ohne sich abzusprechen, stellen sie gleichzeitig den 1. und den 2. Teil des Wortes pantomimisch dar. Alle anderen raten, und sie bekommen so viele Punkte, in wie viel Sekunden der Begriff erraten wurde. Gewonnen hat am Ende das Team mit den wenigsten Punkten.","Kärtchen","PL","","","","",""],["Fortsetzungsroman","","DaF Schreiben","","","","","Jeder TN / jede Gruppe schreibt eine Geschichte mit 5 bis 6 Sätzen auf. (Wir können ein Thema oder eine Situation oder eine Textsorte vorgeben). Der letzte Satz bleibt stehen, der Rest wird umgeknickt. Der Text wird an den Nachbarn / an die Nachbargruppe weitergegeben und er/sie schreibt/schreiben ihn weiter. Zum Schluss wird die gesamte Geschichte vorgelesen.","","EA / PA / GA","","","","",""],["Backbord und Steuerbord","","Aktivieren","DaF HV","","","Bewegung","TN führen die Anweisungen des SL (\"Kapitätn\") aus - s. Bild.","","PL","","BACKBORD.jpg","","",""],["Wir sind einer","","Kennen lernen","","","","","Die TN sollen schätzen, wie eine Person aussehen würde, die sich aus den Durchschnittwerten der Gruppe zusammensetzt. Alle TN machen Angaben über die eigene Person (Körpergröße, Gewicht, schuhgröße, Alter., Hobbys, Note in einem bestimmten Fach...). Die Daten werden vom SL gesammelt und druch die Anzahl der Spieler geteilt. Jeder TN hat nun die Aufgabe zu schätzen, wie diese Person aussieht. Gewonnen hat der Mitspieler, der mit seinem Tipp am nächsten dran ist.","Zettel","EA > PL","","","","",""],["Farbenkette","","Aktivieren","DaF WS","","","Bewegung","Die TN tanzen, sobald die Musik gestoppt wird, ruft der SL den Mitspielern eine Farbe zu. Alle TN, die ein Kleidungsstück in dieser Farbe tragen, müssen möglichst schnell eine Menschenkette bilden, wobei sich alle jeweils an der farblich passenden Stelle berühren müssen.","Musik","PL","freier Raum","","","",""],["AH-KA-KU","","Konzentration","Aktivieren","","","","Die TN stehen/sitzen im Kreis . TN 1 ruft AH und legt eine Hand flach auf die Stirn. Je nachdem, ob die Finger nach links oder rechts zeigen, ist der linke oder rechte Nachbar dran. TN 2 ruft dann KA und legt die flache Hand auf seine Brust. Dann ist der Nachbar dran, auf den die Finger zeigen. TN 3 ruft dann KU und deutet mit ausgetreckter Hand auf irgendeine Person im Kreis. Ziel ist es, die Abfolge immer schneller und fehlerfrei zu schaffen.","","Stehkreis / Sitzkreis","","","","",""],["Anders kennen lernen","","Kennen lernen","Aktivieren","","","Bewegung","Die TN gehen zur Musik durch den Raum. Wenn der SL die Musik stoppt, grüßen sich die nächstbesten Mitspieler mit Handschlag und sagen “Gestatten: Anders...” und fügen den eigenen Vornamen an. Treffen dabei zwei TN aufeinander, deren Vorname mit dem gleichen Buchstaben beginnt, dann klatschen sie in die Hände des Partners und rufen laut “We are the champions” (oder “So sehn Sieger aus”). Der SL bringt immer wieder neue Vorstellungsaufgaben ein. z.B. “Anders + Hausnummer, Anders + Schuhgröße, “Anders + Kontinent”, “Anders + Hobby”...","Musik","PL","","","","",""],["Arche Noah","","Konzentration","Aktivieren","DaF WS","","Kettenübung","Die TN sitzen im Kreis. Zu Beginn werden so viele Tierlaute, wie möglich, gesammelt. Dann beginnt der SL das Spiel mit dem Satz “Noah baute eine Arche und nahm zwei Esel mit: iah-iah”. Der nächste TN wiederholt den Satz und nennt ein neues Tier und fügt danach beide Geräusche an. “Noah baute eine Arche und nahm zwei Esel und zwei Schweine mit: iah-iah, oink-oink”...","","PL","","","","",""],["Aufgabenliste","","Aktivieren","DaF Sprechen","DaF LV","","Wettbewerb","Jeder TN erhält ein AB mit verschiedenen einfachen Aufgaben, die man im Raum erfüllen kann. Hat ein TN eine Aufgabe erfüllt, kann er diese durchstreichen oder das AB dort einreißen. Gewonnen hat der TN, der alle Aufgabe als erster (oder in der angegebenen Zeit die meisten Aufgaben) geschafft hat. Mögliche Aufgabe. Erzähle einem TN eine Geschichte aus deinem Leben / einen Witz. Schüttle 5 Leuten die Hand. Verteile ein Lob an einen beliebigen TN. Mache mit jemandem fünf Liegestützen oder Kniebeugen. Singe einer Person aus der Gruppe ein Lied vor, das er nicht kennt. Schreibe jemandem deinen Namen auf die Hand / sammle 3 Unterschriften auf deiner Hand. Klopfe 3 TN auf die Schulter. …","AB","CP","","","","",""],["Drei Arme zwei Beine","","Aktivieren","Gruppendynamik","Problemlösung","","Bewegung","Die TN müssen auf Zuruf des SL eine Figur bauen, abhängig von den drei Zahlen, die der SL nennt: Zuerst wird die Zahl der TN bestimmt, die sich zusammenfinden müssen, dann die Anzahl der Beine und zum Schluss der Hände, die den Boden berühren dürfen. 5-6-7: 5 TN haben 6 Beine und 7 Hände auf dem Boden. Evtl. Matten auf dem Boden verteilen.","evtl. Matten","PL","freier Raum","","","",""],["Commander Curry","","Aktivieren","Gruppendynamik","","","Bewegung","Bewegungsspiel mit hohem Nonsens-Faktor :-) Die TN führen auf Kommando Aktionen durch:  Curry: alle laufen wild herum, weil das Essen so scharf war, Bratwurst: alle legen sich auf den Boden, Sandwich: zwei TN stellen sich eng aneinander, Hotdog: TN stellen sich zu 3 zusammen, Pommes: die gesamte Gruppe versammelt sich in der Mitte, ganz eng beieinander...","","PL","freier Raum","","","",""],["Begrüßungsrekord","","Kennen lernen","Aktivieren","","","Bewegung","Die TN begrüßen sich mit den Worten “Schön, dass du da bist, (Name)” und schütteln sich dabei die Hände. Das ganze in einem rasanten Tempo – Ziel ist, dass sich alle in einer Minute begrüßt haben.","","PL","freier Raum","","","",""],["Transferpyramide","","Transfer","","","","","Die TN zeichnen eine Pyramide auf ein Blatt und teilen diese in mehrere Stufen ein – je nachdem, wie viele Vorsätze sie so bearbeiten wollen. In die verschiedenen Stufen-Felder schreiben sie jeweils ein Vorhaben, das Leichteste nach unten, das Schwierigste oder Entfernteste nach oben. Überschrift: “Das will ich umsetzen!” Die Linien werden nach rechts und links über die Pyramide hinaus gezogen, auf der linken Seite steht “Mögliche Schwierigkeiten”, auf der rechten Seite “Strategien zur Überwindung”.","A4-Blätter","EA","","transferpyramide.jpg","","",""],["Der magische Moment","","Evaluation","Transfer","","","","(nach einer Aktion / nach einem Tag mit besonders starken emotionalen Eindrücken). Die TN stehen im Kreis oder einer lockerer Ansammlung. Der SL fordert die TN auf, an einen Moment zu denken, der für sie während der letzten Aktion besonders eindrucksvoll war. Dieser magische Moment soll in einem Wort ausgedrückt werden. Auf ein Kommando rufen alle gleichzeitig ihr Wort. Nach dem Rufen kann sich die Gruppe darüber austauschen, welche Eindrücke besonders stark in der Gruppe vertreten waren oder welche nicht so häufig genannt wurden.","","PL","Stehkreis","","","",""],["Stein und Apfel","","Evaluation","Feedback","","","","Die TN wählen Gegenstände aus einem Pool und notieren dazu ihre Eindrücke / lesen sie vor / sagen es ihm Kreis... BEISPIELE: Stein = das liegt mir schwer im Magen, ich fand es nicht geglückt / Apfel = das hat mir gemundet / gefallen, es wird Früchte tragen / Lupe = hiermit sollten wir uns noch einmal genauer beschäftigen / Fuß = das war zum Davonlaufen / Glühbirne = das war sehr erhellend / Zahnrad = da haben wir gut ineinander gegriffen","Gegenstände","EA > PL / GA","","","","",""],["5-Finger B-s","","Reflexion","","","","","","\"Reflektier-bar\" ManagerSeminare","","","reflexion_5_finger_b-s.jpg","","",""],["Nicht nochmal","","Feedback","","","","","“Was ist ein Impuls, den Sie vom heutigen Tag mitnehmen?” TN beantworten die Frage reihum, dabei ist die Regel zu beachten: Bereits genannte Aspekte dürfen nicht wiederholt werden. Macht die Gesprächsrunde lebendiger und wacher, alle bleiben aufmerksam, Vielfalt und Tiefe der Gesprächsbeiträge werden gefördert.","","PL","","","","",""],["Schiffsteile","ä. wie Freibad","Gruppendynamik","Feedback","","","","","Plakat, Stifte, Post-its","EA > PL","","schiffsteile.jpg","","",""],["Bogenschützen","","Reflexion","","","","","Jeder TN wählt sich einen Schützen: Welche seiner/ihrer Eigenschaften hätte ich gern (mehr), die mir beim Erreichen meiner Ziele helfen würden? (Legolas, Ronja Räubertochter, Merida, Robin Hood, Sternzeichen Schütze, Indianer, Rambo, Katniss Everdeen, Neytiri, Wicki, Amazonen, Samurai...)","Fotos von den Figuren","EA > PL / GA","","","","",""],["Veränderungen sehen und erraten","","Feedback","Reflexion","Gruppendynamik","","","s. Anhang","","PL","","ver_nderungen_sehen_und_erraten.jpg","","",""],["Insel-Übung","","Reflexion","Transfer","","","","Die TN bekommen ein leeres DIN A3-Blatt und sollen sich vorstellen, dieses Papier symbolisiere das “Meer der Möglichkeiten”, das sich nach dem seminar auftut. Jeder mal nun die Umrisse einer Insel auf das Blatt, das etwa die Hälfte der Fläche einnimmt. Um diese Insel herum wird in ca. 3 cm Abstand eine gestrichelte Linie gezeichnet, die das unbefestigte Schwemmland symbolisiert. Nun sollen die TN die drei entstandenen Bereiche mit Inhalt füllen. Die Insel: gesicherte Erkenntnisse aus dem Seminar, die möglichst bald praktisch umgesetzt werden sollen. Das Schwemmland: Erkenntnisse, die noch nicht gefestigt sind und solche, deren Umsetzung zunächst noch zurückgestellt werden soll. Das umliegende Meer: Eindrücke, die sich ergeben haben, aber im Moment nicht verwertbar sind.","A3-Blätter","EA > PA / GA","","","","",""],["Mit einer Farbe","","Kennen lernen","Einstieg","Gruppendynamik","","","Jeder TN bekommt eine Kreide – möglichst jeder in einer anderen Farbe. Der Gruppe wird eine Zeichenaufgabe gestellt, die etwas mit dem (Seminar)thema zu tun hat. Es sollen jeweils farbige Bilder erstellt werden. Da jeder TN nur eine Farbe besitzt, müssen sie andere TN bitten, die andersfarbigen Details zu malen. (Jeder darf nur mit seiner Kreide malen.) Nach etwa 15. Minuten werden die Bilder im PL vorgestellt.","Wachsmalkreide","CP > PL","","","","",""],["Außerirdische","","Kennen lernen","","","","","Die TN stellen sich vor, sie sind TN an einer Konferenz von Außerirdischen. Jeder stellt sich vor: Name = ihr Vorname, rückwärts gelesen, ihr Planet = ihr Nachname / ihr Land rückwärts gelesen. Zudem beantwortet jeder Außerirdische noch die Fragen: Was ist das Schöne an meinem Planeten? Was ist auf meinem Heimatplaneten verboten? Nach ca. 5 Min. Nachdenken stellen sich die TN im PL vor.","","EA > PL","","","","",""],["Kreispuzzle","Legekreis","Input","Üben","DaF LV","DaF WS","Selbstkontrolle","Einen großen Kreis mit konzentrischen Kreisen vorbereiten. Die Infos, die zusammengehören, in die Felder schreiben / malen, die zu einem \"Tortenstück\" gehören. Alles zerschneiden. Aufgabe: Kreis wieder zusammnpuzzeln. (s. Beispiel)","Puzzlestücke","EA / PA","Tische / Boden","kreispuzzle.jpg","","",""],["Dominoschlange","","DaF WS","","","","Selbstkontrolle","ähnlich wie beim Domino-Spiel - hier werden aber die Dominosteine offen ausgelegt, die TN puzzeln gemeinsam die Schlange zusammen","Dominosteine mit Wort / Bild, Wort MS / Wort FS","PA","Tische","dominoschlange.jpg","","",""],["Tintenkleckse","","Input","DaF LV","","","","In einem Text Lücken schaffen, indem man Farbkleckse draufmalt, diese decken mal ganze Wörter, mal halbe ab, auch mehrere Zeilen verbindend.","AB","EA / PA","","kaffee.jpg","","",""],["Zoom","","Einstieg","DaF WS","DaF Sprechen","","","Von Bildern interessante Stellen ausschneiden. TN spekulieren, was es ist. Als Collage präsentieren (und beamen) oder auf dem AB.","Bilder","PL / PA","","augen.jpg","","",""],["Bild-Lexikon","Bilderlexikon","DaF WS","Üben","","","Autonom","TN wählen Bilder zum Thema aus, mit vielen Details. Sie kleben das Bild auf ein Blatt, in die Mitte ,suchen Teile, die sie beschreiben können, malen Pfeile zu diesen Teilen. Auf die Rückseite schreiben sie die Lösung und geben ihre Aufgabe an die Nachbarn weiter / legen sie in die Arbeitskartei. (Geht auch als Testaufgabe, mit präparierten Bildern \"Was ist das? Schreib das Wort auf.\" oder frei \"Was ist auf dem Bild? Benenne 10 Sachen\".)","Bilder, Papier, Schere, Kleber","EA / PA","","bilderlexikon.jpg","","",""],["Bilderrätsel","Bilder übersetzen","DaF WS","","","","Rätsel","Teile von Wörtern durch Bilder ersetzen - S raten die Wörter. (Im Beispiel: Namen von deutschen Fußballspielern erraten)","Wortkarten mit Bildern oder Bilderfolge","Beamen als Bilderfolge oder AB","","f2.jpg","","",""],["Wortwolke","","DaF WS","Einstieg","DaF Sprechen","Präsentation","","Wörter als Wolke arrangieren - geht leicht mit: www.wordle.de - die TN erstellen selbst eine Wortwolke zu einem Thema, oder wir nutzen eine fertige Wolke als Einstieg, Vorentlastung, als Gesprächsimpuls...","Internet (www.wordle.net, www.wortwolken.com)","PA / PL","","herrlich.jpg","","",""],["Wort-Bilder malen","","DaF WS","Konzentration","","","","Ein bekanntes Gemälde zeigen. Die TN merken sich das Bild und malen nachher ein Wort-Bild aus dem Gedächtnis: was war wo auf dem Bild?","Kunstbilder als Postkarte / Poster / gebeamt","FA -> PA","","v2_van_goghs_schlafzimmer_zusammen.jpg","","",""],["Wörter-Labyrinth","","DaF WS","","","","Selbstkontrolle","In einem Labyrinth sinnvolle Wörter finden und notieren.","AB","EA","","v2_worterlabyrinth.png","","",""],["Begriffs-Scrabble","","DaF WS","Einstieg","Kennen lernen","","","Die TN schreiben ihren Namen / einen zentralen Begriff auf ein Blatt und notieren dazu passende Wörter (die Buchstaben müssen nicht als ersten Buchstaben für die Wörter genutzt werden). Präsentation: PL, Gespräche in Gruppen - mit Gemeinsamkeiten suchen, nachfragen...","Papier","EA > PL / GA","","wow.jpg","","",""],["Story-Steine","","Einstieg","Kennen lernen","DaF Sprechen","","","Auf Kieselsteine (auf beide Seiten) kleine Bilder malen. Sie dienen als Bildimpulse: Über sich erzählen, eine Story entwickeln, etwas zum neuen Thema assoziieren.","Kieselsteine","GA / PL","","story_stones.jpg","","",""],["Will euch erzählen über...","","Kennen lernen","Einstieg","DaF Sprechen","","Autonom","Die TN bekommen ein leeres Spielfeld. Jeder nimmt einen persönlichen Gegenstand - der funktioniert als Spielfigur. Der jüngste TN beginnt, würfelt, geht auf das erwürfelte Feld, nennt das Thema, über er erzählen möchte, und schreibt es in das leere Feld. In den folgenden Runden können leere Felder frei benannt werden, auf bereits besetzten Feldern muss man zu dem Thema erzählen. Das Spiel endet, wenn ein TN das Ziel erreicht.","AB / DIN A4-Blatt, Gegenstände","GA","","will_euch_erz_hlen.jpg","","",""],["Prozesskette","","Visualisierung","DaF Sprechen","","","","Die Schritte eines Prozesses auf Kärtchen schreiben und nach und nach als Zeitleiste anpinnen. Für Vorträge, für die Strukturierung von Recherchen, Nacherzählen von kennen gelernten Prozessen...","Kärtchen","FA","","v2_prozesskette.jpg","","",""],["Satzanfänge ergänzen","","DaF Schreiben","DaF Sprechen","Erfahrung","Feedback","","Angefangene Sätze gemäß der Infos aus dem Text / aus den Vorkenntnissen oder Erfahrungen ergänzen.","AB / Tafel / Kärtchen","EA / GA","","nacherz.jpg","","",""],["Sprachkaraoke","","DaF Sprechen","DaF Phonetik","","","","Die TN bekommen nur einen Teil eines Dialogs. Sie hören den Text des anderen Sprechers von der CD und sprechen ihre Textteile in die Lücken. Trainiert das natürliche Sprechtempo.","AB","EA","","textkaraoke.jpg","","",""],["Meine Kreise","","Kennen lernen","Einstieg","Erfahrung","","Bewegung","Auf einem Blatt 3 Kreise malen. Zu einem bestimmten Thema 3 Items in den Kreisen notieren (was ich gut kann / was mich interessiert / womit ich Probleme habe...). Herumgehen, die anderen befragen, und Autogramme sammeln, die das auch können / die eine Lösung für das Problem haben... usw.","DIN A4-Blatt","EA > CP","","","","",""],["Ein Satz","","Aktivieren","Reflexion","Transfer","","","Die TN stehen im Kreis. Jeder sagt reihum, ohne nachzudenken einfach einen Satz, der ihm gerade durch den Kopf geht und wendet sich dabei immer dem linken Nachbarn zu. (Der Kaffee war zu heiß. Ich wollte noch aufs Klo gehen. Ich will endlich diesen Schuh ausziehen...) Danach bittet der KL alle, diesen Satz zu merken. In den nächsten Runden sollen sie den Satz mit Gefühl sprechen, der KL gibt das Gefühl für die Runde vor: ausgelassen fröhlich, traurig, verliebt... Danach 2-3 Runden nach den Vorschlägen der TN machen. Variante als Ausstieg: Einen schlauen Satz zum Thema des Tages sagen :-)","","PL / CP","Stehkreis / Sitzkreis","","","",""],["Karten brüllen","","Gruppenbildung","Aktivieren","Wahrnehmung","","","Dieses Spiel eignet sich nur für sehr große Gruppen ab 20 Mitspielern. Jeder Mitspieler erhält eine Karte aus einem Kartenspiel. Dabei muss vom Spielleiter vorab darauf geachtet werden, dass es jede Karte zwei Mal im Spiel gibt und es so viele Karten wie Mitspieler gibt.   Auf ein Zeichen beginnen alle ihre Karte laut in den Raum zu brüllen. Dies muss am laufenden Band geschehen. Wie schnell finden alle Mitspieler ihren Partner mit der gleichen Karte?","Spielkarten","PL","","","","",""],["Bluff-Quiz","","Wiederholung","Transfer","Aktivieren","","","Für dieses Quiz-Spiel muss die SL jede Menge Fragen vorbereiten, die zum Alter und zum Wissensstand der Gruppe passen. Alle Mitspieler sitzen im Kreis. Die Spielleitung steht außerhalb. Jede Runde wird nach dem gleichen Prinzip gespielt. Die Spielleitung stellt eine Frage und alle, die meinen, die Frage beantworten zu können, heben die Hand. Die Spielleitung wählt dann einen beliebigen Mitspieler aus und dieser darf die Frage beantworten.  Antwortet er richtig, darf er einen Platz nach links rutschen.  Antwortet er falsch, rutscht er drei Plätze nach rechts.  Das Besondere: Es ist egal, wenn der Platz links oder der zweite Platz rechts besetzt ist. Beim nach links rutschen, setzt er sich auf den Schoß des Mitspielers. Beim nach rechts rutschen, muss er sich unter den Mitspieler setzen.  Das Spiel würde aber nicht „Bluff-Quiz“ heißen, wenn man nicht auch Bluffen könnte. Und zwar, dürfen alle Mitspieler, die die Hand gehoben haben, am Ende der Runde auch einen Platz aufrutschen. Wird man also nicht aufgerufen, hat man schon einen Platz gut gemacht. Gut wäre es, wenn genau das passiert, wenn man die Antwort nicht weiß. Wird man aber aufgerufen und weiß die Antwort gar nicht, verliert man schmerzlich drei Plätze.  Wer zuerst eine Runde im Uhrzeigersinn (!) geschafft hat und wieder auf seinem Platz sitzt, hat gewonnen. Vielleicht hatte die- oder derjenige ja Glück und wusste gar nicht so viel und ist nur durchs Bluffen zum Sieger geworden-","Fragen","PL","Sitzkreis","","","",""],["Feuchte Aussprache","","Aktivieren","Kommunikation","","","","Die Mitspieler teilen sich in Paare auf, die sich gegenüber aufstellen. Die Mitspieler in der einen Reihe werden nun zum Fragesteller. Die Spieler in der anderen Reihe werden zu den Befragten. Die Befragten bekommen nun einen Becher mit Wasser in die Hand. Vor der ersten Frage muss jeder Befragte einen großen Schluck des Wassers in den Mund nehmen, aber nicht herunterschlucken.  Nun darf jeder Fragenstellende seinem Partner eine Frage stellen, die er dann versuchen muss, zu beantworten. Dabei sollte er, anstatt zu sprechen, auf Hände, Füße und Gesten zurückgreifen, wenn er vermeiden möchte, dass sein Gegenüber nass wird.  Ein lustiges Spiel für verschiedene Situationen. Auf jeden Fall immer ein Spaß wert und ein Garant für lustige Fotos. (Handzeichen ….) was ihr Lieblingsessen ist. Ein sehr lustiges Spiel und es gibt immer was zum lachen!","Becher, Wasser","PA","","","","",""],["Büroklammer-Schlange","","Aktivieren","Kooperation","","","Wettbewerb","Wer schafft in einer Minute die längste Schlange aus aneinander geklemmten Büroklammern?  Variante:  mit verbundenen Augen oder auch auf dem Rücken spielen","viele Büroklammern","PA / GA / EA","","","","",""],["Bilder-Rallye","","Kooperation","Aktivieren","Kennen lernen","","Bewegung","Gegenstände und Details von Häusern fotografieren. Zu jedem fotografierten eine Frage ausdenken, die nur vor Ort gelöst werden kann. (Öffnungszeiten von Geschäften, Details von Hinweistafeln, Anzahl an Steinen in einer Mauer, Preise von Gegenständen im Schaufenster…) . Diese Fragen auf die Rückseiten der Fotos schreiben.  Die Anzahl der Fragen, die in der Spielzeit beantwortet werden sollen, festlegen.  Die Kleingruppen erhalten einen Briefumschlag mit den Fotos und versuchen in der festgelegten Zeit die Fragen vor Ort zu beantworten.","Fotos","GA","","","","",""],["Klimaerwärmung","","Aktivieren","Gruppendynamik","Kooperation","","","Alle (bis auf 2) TN bekommen einen Bogen Zeitung, auf den sie sich stellen müssen. Diese symbolisieren die Eisberge, auf denen die TN im Meer treiben. Die anderen beiden TN sind die Sonnen, die die Eisberge zum Schmelzen bringen. Sie laufen umher und reißen immer wieder von den Zeitungsbögen der anderen TN ein Stück ab. So wird es immer schwerer sich auf den Beinen zu halten und die TN müssen evtl. auch versuchen, sich gegenseitig zu stützen und zu halten.","Zeitungspapier","PL","freier Raum","","","",""],["Kahoot","","Transfer","Kontrolle","Diskussion","DaF WS","","www.create.kahoot.it - bietet verschiedene Angebote für registrierte Nutzer, bei denen die TN ihre eigenen Handys benutzen: Quiz, Umfrage, Diskussion, Reihen ordnen","online-Quiz","EA / PA","","","","",""],["Shapes","Wort-Konturen","DaF WS","Einstieg","","","Rätsel","Wörter verrätseln: Buchstaben der Wörter durch Kästchen repräsentieren (s. Anhang), dazu evtl. kleine Piktogramme als Hilfe oder das Thema angeben","Vokabelkartei oder AB / Tafel","","","UNI_6_Konturen_shapes_r_tsel.pdf","","",""],["Formel-I-Pantomime","","Einstieg","DaF WS","","","","Wortkarten aus der Wortschatzkartei / vorbereitete Kärtchen zum Thema / von den TN schnell in EA gesammelte Begriffe auf Kärtchen in die Mitte legen. Die TN spielen in Gruppen: Reihum nehmen sie Karten, erklären das Wort pantomimisch. Finden die anderen Gruppenmitglieder das Wort, ist der nächste TN dran - so lange, wie die vorher vereinbarte Zeit läuft. Gewonnen hat die Gruppe mit den meisten erratenen Wörtern.","Wortkarten","GA","","","","",""],["Wort-Gabel","","DaF WS","","","","","Die TN bauen zu einem Grundwort Komposita oder bauen aus aufgelisteten Elementen (s. Anhang) Komposita zusammen.","AB","","","DL_schulw_rter_gabel.pdf","","",""],["Wendekarten","","Input","Einstieg","DaF WS","","Selbstkontrolle","Karten mit Aufgabe auf der einen - Lösung auf der Rückseite. z.B: Die TN gehen herum, schauen sich ausgelegte / ausgehängte Wortkarten an und versuchen eine Definition zu finden. Danach drehen sie die Karten um und vergleichen ihre Lösung mit der Definition.","Karten","PA","","wendekarte.jpg","","",""],["Knick-Blatt","","Kontrolle","","","","Differenzieren","Einen Teil des AB nach hinten knicken - auf dem Teil ist entweder eine Lösung, eine Lösungshilfe oder die nächste Aufgabe. Bei Bedarf öffnen :-)","AB","","","","","",""],["Wäscheklammer-Bewertung","","Kontrolle","","","","","Bei Quiz / schnellen Aufgaben den Gruppen Wäscheklammern (oder Bonbons) zuwerfen - ist schneller und sicherer, als Punkte notieren.","Wäscheklammer / Bonbons","","","","","",""],["Bonbon-Orakel","","Einstieg","Erfahrung","DaF Sprechen","Kennen lernen","","Die TN arbeiten in Gruppen. Jede Gruppe bekommt ein Schälchen bunte Bonbons. Auf einem Flipchart erklären wir die Bedeutung der Farben: Zu jeder Farbe gehört ein Sprechauftrag. Die TN greifen blind in die Schale oder suchen gezielt eine Farbe aus und erzählen solange über die Frage, die zur Farbe passt, solange der Bonbon im Mund schmilzt.","kleine bunte Bonbons (z.B. Skittles, M&M-s) oder Gummibärchen, Flipchart","GA","Gruppentische","bonbon_orakel1.jpg","","",""],["Zehn Wörter","","Aktivieren","DaF WS","Wiederholung","","Wettbewerb","Die TN sitzen im Kreis und geben einen Gegenstand weiter. Der Spielleiter steht mit dem Rücken zu ihnen und wenn er stopp sagt, bekommt der TN mit dem Gegenstand eine Aufgabe: z.B. \"Nenne 10 Sachen, die rund sind.\" Dann geben die anderen den Gegenstand wieder im Kreis weiter - der TN muss die 10 Wörter nennen, bis der Gegenstand wieder zu ihm zurückkommt.","-","PL","Sitzkreis","","","",""],["Open Space","","Auswertung","Erfahrung","","","Großgruppe","Einführung in Ablauf, Prinzipien, Gesetzmäßigkeiten und Erscheinungsformen einer Open Space Konferenz Alle Teilnehmer versammeln sich im Plenum (geöffneter Kreis). Strukturierte Sammlung der Anliegen der Teilnehmer. Erstellen eines gemeinsamen „Stunden-/Arbeitsplans“ Arbeit in Interessengruppen in einstündigen Zeitslots zu den Anliegen der Teilnehmer Teilnehmer ordnen sich nach persönlicher Präferenz den für Sie relevantesten Themengebieten zu. Wechseln der Gruppen, auch während der Arbeitsphasen, ausdrücklich erlaubt. Dokumentation der Ergebnisse durch Teilnehmer in strukturiertem Formblatt (Wer, Was, Ergebnisse, Verabredungen) Ausstellung aller Ergebnisse in Ergebnisgalerie Priorisierung der Ergebnisse Ggf. Handlungsplanung Abschlussrunde","Flipchartpapier, Stifte, DINA4-Papier","PL>GA","Gruppentische","","","",""],["Stationengespräche","","Erfahrung","Diskussion","DaF Sprechen","","Großgruppe","Impulsfragen werden auf Flipchart-Papier an Wänden/Pinnwänden im Rauf aufgehängt Kleingruppen rotieren im Uhrzeigersinn im 5-Minuten Takt an den Wänden vorbei, bearbeiteten die Fragestellungen, notieren ihre Erkenntnisse stichpunktartig auf den Flipcharts Die nächsten Gruppen, die an den Stand kommen, ergänzen die Diskussionsergebnisse der vorigen Gruppen und kommentieren diese mit Symbolen: „!“ für „ausgesprochene Zustimmung“, „?“ für „klärungsbedürftig“, ein „Blitz-Symbol“ für „Widerspruch“ Anschließendes „Sharing“ im Plenum","Flipchart, Stifte","GA","großer Raum","","","",""],["Fische und Fischer","","Gruppendynamik","","","","","https://www.youtube.com/watch?v=flALM4eqlXc","","GA","draußen / freier Raum","","","",""],["Hot chocolate river","","Gruppendynamik","Problemlösung","","","","Die Gruppe muss einen Fluss aus heißer Schokolade (3-4 m, abgesteckt durch zwei Seile = Ufer) überqueren, mit Hilfe von runden Marhsmallows (= Moderationskarten, nummeriert, so viele, wie TN). Wenn ein Marshmallow in die Schokolade fällt, muss sofort betreten oder angefasst werden, sonst ist es verloren und der Spielleiter nimmt es weg. Ziel ist, dass jeder TN den Fluss überquert. https://www.youtube.com/watch?v=gMJxZgIpgUc","runde Moderationskarten (je 1 pro TN), 2 Seile","PL","freier Raum","","","",""],["ABC - Arrive - Be present  - Choice","","Kennen lernen","","","","","1. Die TN kommen noch einmal bewusst durch die Tür an und erforschen den Raum: Was fällt mir auf mit Augen / Ohr / Tastsinn? Wählen einen besonderen Punkt zum Schauen aus / Lichtblicke im Raum. Berichten kurz, begründen ihre Wahl – SL notiert alles mit auf dem Flipchart. 2. TN suchen einen Partner: a) Klären Erwartungen an das Training b) besprechen Wünsche an das Lernklima 3. Weiterarbeit in Kleingruppen: Austausch über “Was nicht passieren soll?” - stellen ein Denkmal vor, die anderen TN raten und geben dem Denkmal einen Namen. (Möglich: Gruppenregel festlegen) 4. Abschluss in der Gesamtgruppe: Jurtenkreis","","EA > PL > PA > GA > PL","","","","",""],["Figur-Zahlen-Analyse","","Wahrnehmung","","","","","Die TN stehen im Halbkreis um einen Tisch herum. Der SL legt aus dem Streichhölzern geometrische Formen, die jeweils eine Zahl zwischen 0 und 5 repräsentieren. Die TN raten – wer glaubt, die Zahl zu erkennen, darf es sagen, es ist aber verboten, Erklärung abzugeben oder anderen Mitspielern Hinweise zu geben, wie man auf das Ergebnis kam. Der SL sagt jeweils, ob die Zahl richtig oder falsch ist und legt eine weitere Form.  Trick: Der SL legt die Form mit der rechten Hand, die linke Hand legt er afu den Tisch und mit dieser Hand zeigt er die wirkliche Nummer an. (Faust = 0, Zeigefinger = 1... , Zeigefinger und Daumen = 2) Die Formen kann man wiederholen und dabei eine neue Zahl nennen.","5 Streichhölzer oder Zahnstocher (oder Bleistifte)","PL","Tisch","","","",""],["Kennenlern-Memory","","Kennen lernen","Einstieg","","","","Die TN bekommen zwei Karten, in zwei Farben. Auf der einen Farbe notieren sie ihren Namen, auf der anderen eine Frage, die er von den anderen beantwortet haben möchte. (Zum Thema: Motivation für das Training, Einstellung zum Seminarthema...). Die Karten einsammeln und verdeckt auslegen. Ein TN deckt eine Namenskarte und eine Fragekarte an, die Person, deren Name aufgedeckt wurde, muss die Frage beantworten. Die Karten werden dann wieder umgedreht und an den Originalplatz gelegt.  Geeignet für Gruppen, die sich schon kennen. Dauert 20-30 Minuten.","Kärtchen in 2 Farben","EA > PL","Sitzkreis","","","",""],["Tischklopfen","","Konzentration","Aufwärmen","Gruppendynamik","","","TN sitzen an einem Tisch und legen die Hände auf die Tischkanten, dass sie sich jeweils mit den Händen der Nachbarn links und recht überkreuzen. Der SL klopt mit einer Hand auf Tisch und nennt die Richtung, das Klopfen muss dann weitergegeben werden. Einmal klopfen: es geht in die bisherige Richtung weiter, zweimal: Richtungswechsel. Wer einen Fehler macht (nicht reagiert, falsch klopft), muss eine Hand vom Tisch nehmen. Fällt die zweite Hand auch aus, scheidet der TN aus. Gewonnen hat, wer als letzte übrigbleibt.","Tisch","PL","Sitzkreis","","","",""],["Kameraspiel","","Wahrnehmung","Vertrauen","","","","Spielregel erklären und sagen, dass am Ende nicht die Aufgabe ist, alle gesehenen Objekte aufzuzählen. Die TN wählen einen Partner, entscheiden, wer in der 1. Runde Kamera und wer Fotograf ist. Die Kamera hat ihre Augen (= Linse) geschlossen. Der Fotograf führt die Kamera mit geschlossenen Augen durch den Raum. Drückt der Fotograf auf den Auslöser (linke oder rechte Schulter), dann öffnet sich die Linse für einen Augenblick und macht ein Foto. Während ca. 4 Minuten werden so viele Fotos wie möglich gemacht, dabei kann der Abstand variiert werden.  Auswertung: Kamera beschreibt – ohne die Augen zu öffnen, welche Fotos sie gemacht hat / welche Eindrücke sie gesammelt hat..  Für die 2. Runde zusätzliche Objekte auslegen und die Stelle der Objekte ändern.","","PA > PL","","","","",""],["Teamentwicklungsuhr","","Gruppendynamik","Reflexion","","","","Einen Zeiger in der Uhr zeichnen an die Stelle, die dem gegenwärtigen Entwicklungsstand der Gruppe entspricht. Sie nennen ihre Uhrzeit, der SL malt alle genannten Werte an der Tafel / Flipchart. In einer Diskussion wird versucht, ein gemeinsames Ergebnis zu erreichen: Jeder darf zuerst seinen Standpunkt darstellen und erläutern.  Die TN überlegen dann Maßnahmen, die sie in ihrem weiteren Entwicklungsprozess voranbringen werden.","AB mit einem Ziffernblatt ohne Zeiger, Flipchart: Team-Uhr","EA > PL","","teamuhr.png","","",""],["Das fliegende Ei","","Kooperation","Problemlösung","","","","Die moderierende Person erklärt den Teilnehmerinnen und Teilnehmern das Ziel, die Regeln und den Ablauf des Spiels. Nach dem Zufallsprinzip werden Teams mit vier bis sieben Mitgliedern gebildet. Jedes Team erhält ein Blatt mit den Instruktionen sowie die vorbereiteten Arbeitsmaterialien. Die Teams werden räumlich voneinander getrennt, damit sie keine Gelegenheit erhalten, die Arbeit der «Konkurrenz» zu beobachten. Die Spielleitung überwacht die Einhaltung der Regeln. Nach 90 Minuten ist die «Konstruktionsphase» beendet und die Teams präsentieren ihre Produkte im Plenum. Danach folgt die «Flugshow»: Je zwei Gruppenmitglieder schicken ihr Fluggerät auf den «Jungfernflug». Idealerweise werden die Objekte aus dem obersten Stock der Weiterbildungsstätte «geworfen». Die restlichen Teilnehmerinnen und Teilnehmer beobachten die Aktion vom Hof aus. Die einzelnen Objekte werden von einer Jury nach verschiedenen Kriterien bewertet. Die Aufgabe  Konstruieren Sie im Team ein Fluggerät für ein rohes Ei. Die Zeit  Für die Planung und die Realisierung des Projekts haben Sie 90 Minuten Zeit. Die Vorgaben  Sie dürfen ausschliesslich die vorgegebenen Materialien verwenden (2 Scheren, 1 Lineal, 1 DIN A4 Karton, 2 Blatt FlipChart-Papier, 1 Tube Klebstoff, 1 rohes Ei). Papier und Karton müssen in Streifen zerschnitten werden, die nicht breiter als 3 cm sein dürfen. Das Ei darf nicht geklebt werden. Manipulationen wie Abkochen oder Ausblasen sind verboten und führen zur sofortigen Disqualifikation des Teams. Das Fluggerät soll einen Namen erhalten, der auf das Gerät gemalt werden kann. Darüber hinaus dürfen keine Farben verwendet werden. Nach Ablauf der 90 Minuten präsentieren die Teams ihr Fluggerät im Plenum. Die Präsentation darf maximal 5 Minuten dauern und wird bewertet. Die Bewertung  Professionalität und Originalität der Produktpräsentation Ästhetik des Fluggeräts Flugverhalten des Geräts Zustand des Ei’s nach der Landung Die einzelnen Kriterien werden mittels einer Punkteskala von 1 bis 10 bewertet. Jedes Team bewertet die Produkte der «Konkurrenz». Die Teammitglieder einigen sich, wie viele Punkte je Kriterium vergeben werden. Das Team mit den meisten Punkten gewinnt.","2 Scheren, 1 Lineal, 1 DIN A4 Karton, 2 Blatt FlipChart-Papier, 1 Tube Klebstoff, 1 rohes Ei","GA","","","","",""],["Wort-für-Wort-Satz","","Kooperation","Reflexion","","","","Die Gruppe in Kleingruppen (8-9 Personen) unterteilen. Sie stellen sich im Halbkreis auf. Ihre Aufgabe ist es, gemeinsam einen Satz zu bilden, zu dem jeder jeweils ein Wort beiträgt. Der TN links fängt an, der letzte TN muss den Satz sinnvoll und grammatikalisch korrekt abschließen.  Mehrere Sätze (Geschichte, Tag rekapitulieren, Thema zusammenfassen...) bilden, nach dem fertigen Satz muss die erste Person ans Ende der Schlange laufen, somit hat jeder unterschiedliche Positionen erlebt. Wichtig: Jeder soll eine gute Vorlage für die nächsten Mitspieler liefern.  Auswertung: Hierarchie, kooperativ-konstruktives oder konfrontativ-destruktives Teamverhalten (Destruktive Vorgehensweisen: einander ins Wort fallen, einander keine Zeit lassen, mehr als nur ein Wort vorgeben, keine guten Vorlagen liefern...), schwierige und leichtere Positionen, Verantwortung, Parallele zum Berufsalltag","","GA","","","","",""],["Die drei Eigenschaften des Seminars","","Feedback","Evaluation","","","","Jeder TN fasst seine persönlichen Gedanken zum Seminartag in 3 Adjektiven zusammen und notiert diese auf einer Moderationskarte. Vorstellung im Plenum, reihum oder Sprecher mit einem Ball bestimmen.","Moderationskarten (Ball)","PL","Sitzkreis / Stehkreis","","","",""],["Ich in einem Jahr","","Reflexion","","","","","Die TN zeichnen und beschreiben, wie sie sich selbst in einem Jahr sehen. (Vermutungen über die private und berufliche Zukunft). Bericht über die Visionen und ihre Emotionen dazu. Keine Kommentare – nur Applaus am Ende.","","EA > GA / PL","Sitzkreis","","","",""],["Mini-Coach","","Reflexion","Transfer","","","","TN wählen einen Partner und beschreiben ihm, welches Teilziel sie sich als erstes zum Umsetzen vorgenommen haben. Der Partner soll präzise nachfragen, damit das Ziel möglichst konkret um umsetzbar wird. Am Ende kann das Ziel auch schriftlich festgehalten werden, danach werden die Rollen getauscht. Die Partner können Termine nach dem Seminar vereinbaren, zu dem sie sich über die Umsetzung und neue Ziele unterhalten.  Geeignet auch für Nachfolge-Seminare oder wenn Follow-Up-Termine stattfinden.","","PA","","","","",""],["LernCards","","Reflexion","Transfer","Wiederholung","","","TN entwickeln in Kleingruppen Frage- und Antwortkarten zum Seminarthema. (Vorderseite und Rückseite von Kärtchen beschriften). SL kann vorher einzelne Themen an die Gruppen verteilen, um Doppelungen zu vermeiden.  Besprechen in PL oder in GA: Kärtchen verteilen, TN liest die Frage, die anderen versuchen sie zu beantworten, Vergleich mit der Antwortseite. Nicht beantwortete Fragen sammeln – Input, Übungen.","Karteikarten","EA/GA > GA/PL","","","","",""],["Bilddiktat","","Aktivieren","Wahrnehmung","Konzentration","","","TN zeichnen ein Bild: Sie malen, was der SL diktiert: einen Kreis, eine senkrechte Linie, einen Punkt, ein Dreieck, eine diagonale Linie, eine waagerechte Linie... (Welle, Quadrat...). Das wo und das wie spielt keine Rolle. .","Papier, bunte Filzstifte","EA > PL","","","","",""],["Etwas taucht auf","","Wahrnehmung","Reflexion","Feedback","","","Die TN nehmen je 3 Stifte, in verschiedenen Farben, die ihrer Meinung nach zusammenpassen. Aus den angegebenen Formen (Anhang) sucht sich jeder ein Beispiel aus. Aufgabe: Die Form in verschiedenen Größen / Farben / Richtungen zu zeichnen.  “Interpretation” (z.B. mit dem Seminarthema in Verbindung setzen) in Kleingruppen oder im PL.","Buntstifte (3 pro TN), Papier","EA > GA / PL","","etwas_ta
