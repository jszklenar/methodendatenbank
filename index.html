ucht_auf.jpg","","",""],["Prozessanalyse","","Evaluation","","","","","Die TN notieren die für sie wichtigsten Ereigniss in Form von Bildern / Zeichen / Symbolen zu den Seminartagen.","Plakat: Raster mit den Seminartagen als Fries / auf dem Boden / auf einem langem Tisch","EA > PL","","","","",""],["Bingo Fragerunde","","Kennen lernen","Erfahrung","","","","Jede/r TN erhält eine nummerierte Süßigkeit. Anschließend zieht die SL einen Bingo-Ball und liest die Nummer des gezogenen Balls vor. Jene/r TN, die/der auf ihrer/seiner Süßigkeit dieselbe Nummer stehen hat wie auf dem gezogenen Ball, bekommt dann eine Frage gestellt.  Beispiele für Fragen Wie gehen Sie mit Hierarchien um? Wer war/ist Ihr größtes Vorbild? Warum? Was machen Sie, wenn Sie das Gefühl haben nicht wahrgenommen zu werden? Was gibt Ihnen Energie? Die/der TN beantwortet anschließend die Frage. Dabei gibt es keine richtigen oder falschen Antworten. Es geht darum, die persönlichen Ansichten der/des Teilnehmenden zu erfahren. Nachdem die/der TN die Frage beantwortet hat, darf sie/er seine Süßigkeit essen. Danach wird der nächste Bingo-Ball gezogen.","Bingobälle, Süßigkeiten, Fragekatalog","PL","","","","",""],["Strippenzieher","","Kooperation","","","","","Die Gruppe bekommt eine Zeichenaufgabe. Zum Beispiel: «Harmonie», «Konflikt» usw. Es wird kein Thema vorgegeben und das Ergebnis interpretiert: zu wem zeigt das Bild/die Schrift? Führung des Stifts: wer hat dominiert? Es werden 2 bis 3 Gruppen gebildet. Jede dieser Gruppen erhält eine geheime Aufgabe. Alle Gruppen müssen sich gleichmässig um den Strippenzieher verteilen, um alle Aufgaben zu zeichnen. - Aufgabe für 2 Gruppen: z.B. Autokarosserie und Autoräder - Aufgabe für 3 Gruppen: z.B. Blüte, Stängel und Blätter  Welche Gruppe setzte sich durch? Wurde das gemeinsame Ziel erreicht, ein Auto bzw. eine Blume zu zeichnen? Es wird eine doppeldeutige Aufgabe gestellt (z.B. «Zeichnen Sie ein Blatt/einen Hahn») ohne weitere Erläuterung. Welche Missverständnisse traten dabei auf und wie wurden sie gelöst? Eine Gruppe stellt Sprichwörter dar. Die andere Gruppe muss die Sprichwörter erraten. Es wird ein Labyrinth oder ein Irrgarten vorgegeben. Die Teilnehmenden müssen den Weg zeichnen, ohne die Begrenzungslinie zu durchkreuzen. Einzelne Gruppen können ihre Zukunftswünsche gemeinsam zu Papier bringen oder Portraits zeichnen.","Papier, Stifte / Wachsmalkreide - und der Strippenzieher (s. Anhang)","GA","","e9314ab4aebd796625d174d5e1c52e29.jpg","","",""],["Random-Input-Technik","","Ideen","","","","","Die TN formulieren  schriftlich, wozu Sie eine Idee suchen. (“Wie können wir erreichen, dass....?”) Sie wählen  nach dem Zufallsprinzip einen Begriff (Hauptwort) aus einem Lexikon, einer Zeitung oder einem Buch oder wählen ein Bild zufällig aus einem Magazin. Sie schreiben vier bis sechs charakteristische Merkmale des Begriffes auf und versuchen zwischen dem Thema und jedem Merkmal des Zufallswortes Verbindungen herzustellen. Sie können den Vorgang mit einem anderen Zufallsbegriff oder –bild wiederholen.","Papier, Zeitung / Wörterbuch / Lexikon / Magazin","PA / GA","","","","",""],["Marshmallow-Challenge","","Aktivieren","Kooperation","Problemlösung","","","Man spielt die Marshmallow Challenge in Gruppen von vier bis fünf Spielern. Die Gruppen 18 Minuten Zeit, um mit den Materialien, einen Turm zu bauen. Am Ende wird bei jedem Turm die Höhe des Marshmallowturms gemessen und der höchste Turm gewinnt.  PS: Genug Marshmallows kaufen (bei diesem Spiel wird genascht).","20 Spaghetti, 1 Meter Kreppband und 1 Packung Marshmallow pro Gruppe","GA","Gruppentische mit ausreichend Abstand","","","",""],["Overload","","Aufwärmen","Konzentration","","","","Overload spielt man in Vierergruppen. Dabei steht ein Spieler in der Mitte und wird regelrecht gegrillt. Der Spieler links von ihm fragt ihn Assoziationsfragen, der Spieler rechts fragt einfache Rechenfragen und der Spieler gegenüber macht Bewegungen vor, die der Spieler in der Mitte nachmachen muss. Bald ist das schwere Mittagessen vergessen.     Worauf muss man achten: Wichtig ist, dass die Fragesteller schön nah am „Gegrillten“ dran stehen und ihm die Fragen direkt ins Ohr sprechen können. Der Spieler in der Mitte wird zu Antworten gedrängt. Manche Spieler verkünsteln sich auf der Suche nach guten Fragen. Aber darum geht es nicht. Statt schwierige Fragen zu stellen, stellt man lieber viele einfache Fragen und wiederholt sie schnell hintereinander. Auch wichtig ist natürlich, dass man das ganze nicht zu ernst nimmt und sich über skurrile Antworten freut.     Moderation des Seminar Spiels: Das Setup ist relativ kompliziert, deswegen muss man sich für die Einleitung Zeit nehmen. Vor dem Startsignal überprüfe ich, ob jeder Spieler seine Rolle (Gefragter, Mathefrager, Farbfrager, Bewegungen) kennt, indem ich sie die Hände heben lasse. Wie immer ist es wichtig, das „Warum“ des Spiels zu erklären, damit Spieler sich auf die fordernde Methode einlassen  FITNESS KREIS","","GA","","overload.jpg","","",""],["Jeder fängt jeden","","Aktivieren","Gruppendynamik","","","","Die TN legen ihre linke Hand flach hinter den Rücken. Dann sollen sich die Spieler abklatschen. Sie klatschen mit der freien rechten Hand auf die linken Hände, die die anderen Spieler hinter dem Rücken halten. Wenn man abgeklatscht wird, passiert nichts, man spielt einfach weiter. Spieler brauchen weder zu zählen, wie oft sie klatschen, noch wie oft sie abgeklatscht wurden. Es gibt eine Variation, bei der man „raus“ ist, wenn man einmal geklatscht ist. Ich habe sie noch nicht ausprobiert, weil ich den „unkompetitiven“ Charakter des Warm-Up sehr mag. In der Gruppe entsteht ein Gefühl des Miteinanders. Wenn es kompetitiver sein soll, dann bietet sich Stifte Stierkamp an.   Bei dem Spiel wird viel gerannt, aber man kann es genauso gut spielen, wenn man nur langsam spaziert. Das sage ich anfangs dazu, damit sich langsamere oder in der Bewegung eingeschränkte Spieler wohl fühlen. Meist läuft das Spiel nach ca. 2-4 Minuten von alleine aus.","","PL","im Freien / freier Raum","","","",""],["Ding! - Neue Idee!","","Aktivieren","Ideen finden","","","","Zwei Spieler stehen sich gegenüber, einer ist Erzähler und einer ist Klingler. Der Klingler hat eine Klingel in der Hand. Der Erzähler erzählt eine frei improvisierte Geschichte, die mit „Es war einmal…“ beginnt. Immer wenn der Klingler klingelt, revidiert der Erzähler das letzte Wort seiner Geschichte und denkt sich ein Neues aus. So ist das Spiel eine Storytelling Übung und eine Übung schnell viele Ideen zu generieren und alte Ideen loszulassen.    Beachten: Das Spiel wird viel schneller, wenn der Erzähler wirklich nur das letzte Wort wiederholt und nicht den ganzen letzten Satz. Das Spiel macht immer dann richtig Spaß, wenn der Mitspieler mit der Klingel oft hintereinander klingelt und den Erzähler dadurch zwingt, wirklich von seinen Ideen loszulassen und sich einfach überraschen zu lassen, wie die Geschichte, die er selber erzählt, weiter geht.    Moderation: Man kann es aus zwei Richtungen anmoderieren. Einerseits kann man betonen, dass es eine Gedankenübung ist um schnell neue Ideen zu generieren. Andererseits muss man bei dem Spiel von dem Anspruch loslassen, eine besonders lustige oder originelle Geschichte zu erzählen, da man darüber sowieso keine Kontrolle hat. Nach dem Spiel kann man mit den Spielern Gespräche zum „Im Moment sein“ führen. http://www.workshop-spiele.de/storytelling-spiel/","Klingel / Buzzer","PA","","","","",""],["Applaus! Applaus!","","Gruppendynamik","Konzentration","","","Abschluss","Man kann eigentlich jeden Grund nehmen, um sich gegenseitig zuzuapplaudieren. Dazu gibt man den Spielern die Anweisung: „Damit auch wirklich jeder einen Applaus bekommt, applaudiert eurem rechten und linken Nachbarn.“ Der Ice-Breaker ist eine gute Methode um Tage mit Gruppen zu beginnen oder zu beenden, mit denen man sonst keine Ice-Breaker spielen will. Man muss versuchen, den Nachbarn zu erwischen, wenn er gerade schaut :-) http://www.workshop-spiele.de/kuerzeste-ice-breaker/","","PL","Sitzkreis / Stehkreis","Kuerzeste_Ice_Breaker_Applaus.png","","",""],["Fitness-Kreis","","Aktivieren","Gruppendynamik","","","Bewegung","Jeder macht eine Fitnessübung vor, dann machen alle mit.  Moderation: Meist macht man als Moderator die erste Fitness Übung. Je nachdem, ob man eher die leichte Dehnung oder die tiefe Liegestütze macht, und wie viele man davon macht, werden sich die Mitspieler ein Beispiel nehmen.  Worauf muss man achten: Man kann die Intensität des Warm-Ups genau steuern, indem man die Zeit, die jeder Spieler hat, eingrenzt.  Hat jeder nur 10 Sekunden, ist es ein ganz lockeres schnelles Warm-Up.  Hat jeder eine ganze Minute, macht man mitunter eine Viertelstunde Sport. Und noch etwas: An heißen Tagen sollte man das Spiel nicht machen, da Spieler danach verschwitzt im Workshop sitzen. http://www.workshop-spiele.de/fitness_kreis/","","PL","Stehkreis","","","",""],["Stifte-Stierkampf","","Aktivieren","Gruppendynamik","Konflikte","","","Man balanciert auf beiden Händen einen Stift. Dazu legt man den Stift auf die Oberseite von kleinem Finger und Zeigefinger und balanciert sie dort. (Die Hand schaut aus wie ein Stier.) Man muss die Stifte der anderen runterschubsen. Wen man einen eigenen Stift verliert, geht die Hand hinter den Rücken. Es ist nur Handkontakt erlaubt. Wer von der Gruppe als letztes noch einen Stift auf der Hand balanciert, hat gewonnen.  ACHTUNG BEI WILDEN UND GROSSEN GRUPPEN: Vor allem in männerdominierten Gruppen wird gerne gerempelt. Deswegen stelle ich meist klar, dass es darum geht, die Stifte der anderen mit der Hand runterzuschubsen, und nicht darum wer besser rempeln kann. Zur Vorsicht stelle ich zwei Regeln auf:  Es ist nur Hand Kontakt erlaubt (Das bedeutet, dass Schulterkontakt verboten ist) Man sollte einem Zweikampf nicht ausweichen    MODERATION: Die Moderation kann kaum schief gehen. Das erste „Stift auf die Hand setzten“ ist schon in sich ein kleiner Ice Breaker. Daher sollte man warten, bis alle Spieler einen Stift auf jeder Hand haben, bevor man das Startsignal gibt. Es ist wichtig auf einen gemeinsamen Start zu achten, damit alle die gleichen Chancen haben. http://www.workshop-spiele.de/einfacher-icebreaker-fuer-gruppen-stifte-stierkampf/","Stifte","PL","freier Raum","","","",""],["Zwölf Monate","","Aktivieren","","","","","Alle stehen im Kreis. Der SL erläutert, dass es lange und kurze Monate gibt. „Januar ist lang, Februar kurz, März lang, und so weiter …“  „Nun werden wir diese gemeinsam sprechen und dies jeweils mit einer kleinen Bewegung unterstützen: Bei einem langen Monat machen wir uns lang, bei einem kurzen Monat kurz“  – Trainer macht vor.  Dann gemeinsam starten, laut und deutlich sprechen…","","PL","Stehkreis","","","",""],["Mond und Satellit","","Aktivieren","Gruppendynamik","","","","Alle TN stehen im Kreis. Jeder sucht sich gedanklich einen anderen TN aus, der für ihn sein „Mond ist“. Gleichzeitig ist jeder TN auch Satellit. Auf ein Zeichen des SL geht es nun darum, möglichst schnell als Satellit seinen Mond drei Mal zu umkreisen.","","PL","freier Raum","","","",""],["Leipziger Messe","","Aktivieren","DaF WS","","","Kettenübung","1. Runde  Alle sitzen im Kreis, ich beginne und sage zu meinem linken Nachbarn  Ich: „Ich war gestern auf der Leipziger Messe.“  B: „Und, hast du mir was mitgebracht?“  Ich: „Ja, eine Säge“ – und mache dazu eine Sägebewegung mit dem rechten Arm- den ich vor und zurück bewege. Das behalte ich nun die ganze Zeit bei.  B wendet sich an seinen linken Nachbarn C:  B: „Ich war gestern auf der Leipziger Messe.“  C: „Und, hast du mir was mitgebracht?“  B: „Ja, eine Säge“ – und macht die Sägebewegung mit dem rechten Arm usw.  Es pflanzt sich also durch die ganze Runde fort, bis alle sägen und der letzte wieder bei mir landet.  2. Runde  Ich sage dann zu B: „Ich war gestern wieder auf der Leipziger Messe.“  B: „Und, hast du mir wieder was mitgebracht?“  Ich: „Ja, einen Fächer“ – und mache fächelnde Bewegungen mit der linken Hand.  Das in Kombination mit dem rechten sägenden Arm wird schon schwierig und sieht ungeheuer komisch bis dämlich aus (was dabei rauskommt). Es geht wieder den ganzen Kreis herum.  3. Runde   „Eine Nähmaschine“ – dazu Bewegungen mit dem rechten Bein, als ob man auf den Fuß einer alten Nähmaschine tritt.  4. Runde  „Einen Schaukelstuhl“ – mit dem ganzen Oberköper gleichzeitig vor und zurück schaukeln.  Inzwischen sind alle schon völlig fertig vor Anstrengung und vor Lachen…  5. und letzte Runde  „Einen Papagei“ – der die ganze Zeit mir krächzender Stimme „Lore, Lore“ ruft.","","PL","Stehkreis / Sitzkreis","","","",""],["Klammerspiel","","Aktivieren","Gruppendynamik","","","Bewegung","Die Gruppe wird in zwei Gruppen geteilt. Ein Teil erhält Wäscheklammern, der andere Teil steht im Raum und schließt die Augen. Nun gilt es \"heimlich\" die Klammern an die Kleidung zu stecken. Ahnt jemand, dass dies passiert, darf er sich nach vorne beugen. Solange darf keine Klammer gesteckt werden. Natürlich darf man in dieser Position nicht lange verharren.","Wäscheklammer","PL","","","","",""],["Irrenhaus","","Aktivieren","Konzentration","","","","Ein/zwei TN gehen raus - die übrigen vereinbaren ein System. Die nicht eingeweihten Spieler sind die Irrenärzte, die bereits \"wissenden\" Spieler stellen die Irren dar. Die Ärzte dürfen Fragen stellen, jeweils ein Irrer antwortet drauf. Die Antwort klingt dabei meist so, als wäre sie Schwachsinn. Tatsächlich steckt aber System dahinter! Jeder, der beweisen kann, das System zu kennen, darf auch zum Irren werden. Natürlich wird die Lösung nicht erraten, sondern die Spieler müssen durch aktives Tun beweisen, das Wissen zu besitzen. Die Irren beantworten jeweils die vorangegangene Frage (oder, bei sehr kleveren Spielern, noch weiter zurück liegende Fragen). Die erste Frage wird mit einer möglichst lustigen und unsinnigen Antwort beantwortet.  Wie heißt du? => Raumschiff Enterprise (zufällige Antwort) Wie viel ist drei mal vier => Christian (Antwort auf Frage 1) Wie heißt die Hauptstadt von Deutschland => zwölf (Antwort auf Frage 2) und so weiter Alternativ können auch andere Systeme benutzt werden, beispielsweise Antworten mit nur einem Wort oder beginnend mit dem jeweils nächsten Buchstaben des Alphabets, etc.","","PL","","","","",""],["Affenspiel","","Konzentration","","","","","1. Runde Der SL zeigt auf Pfeile (oben, unten, links, rechts) und alle sagen und zeigen, was gezeigt wird. 2. Runde Alle sagen und zeigen genau das Gegenteil 3. Runde Richtig zeigen, Gegenteil sagen 4. Richtig sagen, Gegenteil zeigen","Tafel mit vielen Pfeilen","PL","","","","",""],["Namenslotto","","Kennen lernen","Gruppendynamik","","","Bewegung","TN schreiben ihren Namen auf Tesakrepp. Sie zerreißen dann den Namen in Einzelbuchstaben, und kleben die Buchstaben irgendwo im Raum auf. Dann schnappt sich jeder TN irgendeinen Buchstaben, und fragt jeden, den er trifft, ob er diesen Buchstaben braucht. Wenn ja, darf er ihm den Buchstaben auf den Rücken kleben. Gewonnen hat, wer zuerst den Namen fertig hat.","Tesakrepp","PL","","","","",""],["Auto-Rallye","","Vertrauen","Kooperation","","","","TN gehen paarweise zusammen und stellen sich jeweils hintereinander. Der Hintermann (-frau) fasst den Vorderen an der Schulter, der Vordere schließt die Augen. Nun kann die Fahrt beginnen. Durch Druck auf die Schultern kann der Hintermann Geschwindigkeit geben, Bremsen, Lenken.  Kann in verschiedenen Varianten gespielt werden: Achtsam und Vorsichtig, zum Thema Führung / Vertrauen, oder in der Speed-Variante, in der es um Spaß, Schreck und Spannung geht.","","PA","","","","",""],["Personaldecke","","Kooperation","Problemlösung","Aktivieren","","","Decke, Pinwandpapier oder ähnliches wird auf den Boden gelegt. TN erhalten die Anweisung, sich so darauf zu positionieren, dass die Füße von allen Teilnehmern sich auf oder über der Decke befinden. Von Durchgang zu Durchgang faltet der Trainer die Decke zusammen, so dass immer weniger Platz da ist und die Herausforderung für Teilnehmer immer schwieriger wird.  Lösung: wenn sich alle auf den Boden setzen, im Kreis, und jeweils die Füße auf die Decke, dann haben am meisten Platz.","Decke, Pinwandpapier","PL","","","","",""],["Ballspiel","","Kooperation","Problemlösung","","","","https://www.youtube.com/watch?v=rva3wRvpS_4&index=36&list=PLeqMC1bzXBnB27g8HUHn6IYke6Y8FkX1r","1 kleiner Ball","GA (5-6 TN)","","","","",""],["Versteckte Zahlen","","Wahrnehmung","Problemlösung","","","","Der SL legt 4 Papierstreifen in verschiedenen Formen an. Die TN raten, welche Zahl von 0-10 dargestellt wird. Lösung: Die korrekte Zahl zeigen die Hände des SL an, nachdem er sich von der Figur zurückgezogen hat. https://www.youtube.com/watch?v=afKA9TvPkfM&index=37&list=PLeqMC1bzXBnB27g8HUHn6IYke6Y8FkX1r","Papierstreifen","PL","Halbkreis","","","",""],["Bushaltestelle","","Kennen lernen","","","","","Eine Variante von Tee oder Kaffee / Nordpol-Südpol: TN positionieren sich nach den Impulsen des SL (steigen auf der passenden Seite aus dem Bus). https://www.youtube.com/watch?v=rJHbFCDJuyE&index=38&list=PLeqMC1bzXBnB27g8HUHn6IYke6Y8FkX1r","zwei Tesakreppstreifen auf dem Boden, ca. 1 m Entfernung voneinander (Bus)","PL","","","","",""],["Wanderraupe","","Kooperation","Problemlösung","","","Bewegung","Die Gruppe halbieren, die TN bilden zwei Schlangen. Wir kleben die Füße der TN zusammen, jeweils einmal links - einmal rechts. So entstehen zwei Raupen. Diese Müssen von einer Startlinie aus (markiert mit Tesakrepp auf dem Boden) hinter die Startlinie der anderen Gruppe kommen, so dass sie 3 Quadrate betreten dürfen, die zwischen den Linien mit Tesakrepp markiert sind. Sie dürfen die Raupe nicht verlassen und die Markierungslinien betreten - bei einem Fehler muss die Raupe neu starten. Beide Gruppen beginnen gleichzeitig :-) https://www.youtube.com/watch?v=xn6r-fAJNcw&index=45&list=PLeqMC1bzXBnB27g8HUHn6IYke6Y8FkX1r","Tesakrepp, fester Klebeband für die Füße","GA","freier Raum","","","",""],["Fünf Handschläge in fünf Minuten","","Aktivieren","Gruppendynamik","","","","Für größere Gruppen: in 5x1 Minuten möglichst zu vielen TN Kontakt aufnehmen. https://www.youtube.com/watch?v=DV9C3CUd8jQ&index=47&list=PLeqMC1bzXBnB27g8HUHn6IYke6Y8FkX1r","","PL","freier Raum","","","",""],["Kommst du zu meiner Party?","","Problemlösung","DaF WS","Wahrnehmung","","","Die TN nennen Sachen, die sie zu der Party mitnehmen dürfen. Der SL beginnt - z.B. \"Ich bringe Pudding mit\" - in diesem Fall ist die Regel: Alles mit doppelten Buchstaben im Wort ist erlaubt. Die TN raten, der SL, ob sie zur Party kommen dürfen, die TN raten die Regel, wer sie gefunden hat, spielt einfach weiter . (https://www.youtube.com/watch?v=PFrPn-vJeeo),","","PL","","","","",""],["Evolution","","Aktivieren","","","","Bewegung","Amöbe macht: Mimimimimimi Amöbe triftt Amöbe (Schnick, Schnack, Schnuck) - wer gewinnt wird zum Fisch, Fisch macht: Blubb, Blubb, Blubb, Fisch trifft Fisch (Schnick, Schnack, Schnuck) > Huhn, Huhn macht: Kikeriki, .... Huhn trifft Huhn > Affe, Affe macht: Affenlaute .... Affe trifft Affe > Mensch, Mensch geht aus dem Gemenge heraus und beobachtet das wilde treiben gelangweilt - er ist an der Spitze der Evolution angekommen.","Reihenfolge der Evolution an der Tafel / auf Karten","PL","freier Raum","","","",""],["Aufgabensammlung","","Kennen lernen","Aktivieren","Gruppendynamik","","","Die TN arbeiten die Aufgaben von einem Arbeitsblatt ab (s. Anhang). Wenn Sie eine Aufgabe erledigt haben, reißen sie den Zettel ab und geben sie der Person, mit der sie die Aufgabe gelöst haben. Zeitlimit angeben und beim Ablauf der Zeit klingeln / tröten...","AB","CP","","v2_Aufgabensammlung.jpg","","",""],["Kästchendiskussion","","Einstieg","Erfahrung","DaF Sprechen","","","Ein TN wählt von den Kästchen ein Thema, legt den Sprechstein darauf und erzählt dazu: Erfahrungen, Erlebnisse, Beispiele, Meinung... Er darf auch andere (alle oder nur bestimmte) dazu befragen - oder einfach wer was dazu sagen möchte... Wenn fertig, wird das Kästchen als \"erledigt\" markiert und der nächste TN ist dran. Zeitlimit vereinbaren!","AB: Tabelle mit Feldern (wie ein Schachbrett) mit Fragen oder Stichwörtern, Sprechstein, Marker","GA4","Gruppentische","","","",""],["Setzen! Sechs!","","Konzentration","","","","","Man schreibt mit der rechten Hand eine Sechs und in der gleichen Zeit muss man mit dem rechten Fuss eine Sechs in der Gegenrichtung zeichnen","A4-Blatt, Stift","EA","am Tisch, im Sitzkreis","","","",""],["Die liegende Acht","","Konzentraion","","","","","eine liegende Acht mit einem Arm in der Luft zeichnen, dann mit beiden Armen ausprobieren","kein","EA","im Stehen oder im Sitzen","","","",""],["schnipp-schnapp","plitsch-platsch","Konzentration","","","","","Man beginnt zu zählen, aber statt 5 sagt man schnipp, statt 7 sagt man schnapp und dann ersetzt man alle Zahlkombinationen mit 5 oder 7 mit schnipp oder schnapp: z.B.15 kann man schnippzehn und 27 schnappundzwanzig aussprechen usw.","kein","EA","im Steh- oder Sitzkreis","","","",""],["Schätzfrage","","Aktivieren","Einstieg","Input","","","Entweder ganz klassisch per Handabfrage oder per Polling-Software.  Fragen Sie das Publikum nach einer Einschätzung zu (überraschenden) Zahlen, Daten und Fakten oder \"unnützes Wissen\".","","PL","","","","",""],["Stop motion-Video","","Anwendung","Transfer","Präsentation","","","Mit dem Handy Fotos machen, die Figuren immer nur ein bisschen weiter bewegen. Mit dem Stop motion app aus den Fotos einen Film zusammenstellen. Vertonen: Sprechblasen an die Figuren kleben oder \"Synchronstimmen\".","Playmobil- oder Legofiguren, Spielsachen, Steine, Knete, Werkzeug...","PA / GA","","","","",""],["Schlandeis","","Gruppenbildung","","","","","wie Eisbecher, aber Schoko-Erdbeere-Vanille nehmen - Schlandeisbecher :-)","Kärtchen oder einfach in die entsprechende Ecke gehen.","CP","","","","",""],["One day","","Kennen lernen","DaF Schreiben","","","WWW","Die TN dokumentieren einen beliebigen Tag in ihrem Leben: Machen Fotos  (Vorgaben: Aufstehen, Frühstück, Weg zur Schule, mein Arbeitsplatz, Bilder aus dem Unterricht, Freizeit, Familie, Schlafen gehen...) und schreiben zu jedem Foto kurze Kommentare. Die Präsentationen (ppp oder pdf) werden allen TN vor dem Kurs zur Verfügung gestellt. Sie können dazu Fragen stellen, ihre ppp weiter erläutern.  Am ersten Tag: Bilderbuffet mit ausgewählten Fotos (jeweils 1 berufliches und 1 persönliches Foto / TN) und Autogrammjagd (Fotos wählen, die Person finden, zu der es gehört und Fragen stellen – am Ende Autogramm einholen). (ODER:  Finde jemanden, die Fragen beziehen sich auf Infos aus den Präsentationen, Superlative, Lebendige Statistik...)","Cloud / Lernplattform, Fotos","EA > PL > CP","","","","",""],["Begrüßungsplakat","","Einstieg","Gruppendynamik","","","","\"Herzlich willkommen!\" an der Tafel geht auch - ABER ein richtiges Begrüßungsplakat erfüllt weit mehr Funktionen: Kann ein einladendes Hallo enthalten, eine Bildmetapher zum Seminarthema, kann bei Kurzfortbildungen die Agenda anzeigen (Themen und Zeitplan), kann zum Mitmachen animieren (Namen, Herkuntsländer, erste Ideen, warum ich hier bin, was ich hier will...). Es muss ein Hingucker sein, Identifikationsmöglichkeiten (Seminartitel, Seminarkürzel) und Anhaltspunkte für den Anfang bieten. Es kann an der Tür (innen oder außen), am Flipchart hängen oder auch auf dem Boden liegen. Manche von ihnen können weiter ergänzt werden und die ganze Seminarzeit hängen bleiben.","Flipchartpapier, Stifte","","","begr__ungsplakat.jpg","","",""],["Autogrammjagd","","Kennen lernen","Einstieg","Gruppendynamik","DaF Sprechen","","Ähnlich wie Finde jemanden: Die TN gehen mit einer Frageliste herum, befragen einander, und wenn jemand mit JA antwortet oder die Antwort weiß, bitten sie die Person um einen Autogramm. (In großen Gruppen dient die Aktivität auch zum Namen lernen.)","AB","CP","","","","",""],["Stoppuhr","","Üben","Kontrolle","","","Ritual","Stoppuhr stellen (gern auch online stopwatch und die auch beamen) für sehr kurze / schnelle Aufgaben, die dann auch deutlich bimmelt, wenn die Zeit vorbei ist.","Stoppuhr","","","","","",""],["Musik als Zeitlimit","","Üben","","","","Ritual","Eine Aufgabe endet, wenn die Musik aus ist. Für Erfahrungsaustausch, small talk - wenn es kein konkretes Ziel erreicht werden muss.","Musik","","","","","",""],["Angebotstisch","","Präsentation","","","","","Infokarten, Material auf einem Tisch präsentieren, an dem sich die TN frei bedienen können. Angebote können zum Mitnehmen oder zum Anschauen sein - das muss vorher bekanntgegeben werden.","Tische","","","","","",""],["Tischklingel","","Üben","","","","Ritual","Signal für: Ruhe, Wechsel, Ende der Aktivität. Bei Quiz: Wenn eine Gruppe fertig ist / die Antwort weiß, ein TN rennt hin, und klingelt.","Tischklingel","","","","","",""],["Ballrunde","","Erfahrung","Einstieg","Ideen","DaF WS","","Nach der Impulsfrage der SL werfen die TN einen Ball herum, wer ihn hat, darf etwas sagen (eine Idee / ein Erlebnis / einen Begriff, der ihm für das Thema wichtig erscheint). Muss schnell gehen. Man darf sich auch melden, dass man den Ball bekommen möchte.","Ball","Stehkreis","","","","",""],["Markierter Arbeitsplatz","","Ritual","Gruppenbildung","","","","Bei arbeitsteiliger GA: Tische mit Farben / Gegenständen markieren, die zum Thema gehören. Material auf dem Tisch vorbereiten.","bunte Karten, Fahnen...","","","","","",""],["Strichliste","","Ideen","","","","","Zu den gesammelten Ideen schnell eine Abstimmung machen: Handzeichen - Strichlisten an der Tafel führen.","Tafel","","","","","",""],["Murmelgruppe","","Erfahrung","Transfer","Präsentation","","","Den Vortrag mehrmals unterbrechen und kurze Diskussionsaufträge zu Erfahrungen / Umsetzung der Ideen... in Kleingruppen (Nachbarschaft) geben.","","PA / GA3","","","","",""],["Text weißen","","Präsentation","Kontrolle","","","","","Einen Text mit Lücken beamen. Die Buchsaben bei den Lücken vorher auf weiß stellen. Bei der Kontrolle die Farbe wieder ändern.","","","","","",""],["Eisbecher","","Gruppen bilden","","","","","Kärtchen mit Eissorten (eine Kugel) vorbereiten. TN nehmen eine Sorte. Danach bilden sie Gruppen: in jedem Eisbecher unterschiedliche Eissorten, SL sagt, aus wie vielen Kugeln der Eisbecher besteht.","Kärtchen","","","eisbecher.jpg","","",""],["Das Haus vom Nikolaus","Nachspuren","Kontrolle","","","","","Eine Strichzeichnung - z.B. das Haus vom Nikolaus - mit gestrichelten Linien an die Tafel malen. (So viele Linien, wie viele Punkte bei der Aktivität erreicht werden können.) Für jeden Punkt eine Linie dick mit einer anderen Farbe nachzeichnen.","Tafel","PL","","haus_vom_nikolaus.jpg","","",""],["Buddy / Partnerfeedback","","Reflexion","Feedback","","","","Einen Partner wählen, der einem zu einem Plan / einem Auftritt... Feedback gibt. Ergebnisse des Gesprächs werden nicht im Plenum gesammelt.","","PA","","","","",""],["Buzzer","","Üben","","","","Ritual","Gruppen bekommen Buzzer mit verschiedenen Geräuschen. Die Gruppe, die als erste auf ihren Buzzer haut, bekommt das Rederecht.","Buzzer für jede Gruppe","GA","","","","",""],["Dinge anfassen / Dinge umbenennen","","Wahrnehmung","Aktivieren","","","Bewegung","Runde 1: Die TN bekommen die Aufgabe, in einem relativ zügigen Tempo (aber nicht rennen) 5 Gegenstände mit dem gleichen Material oder 5 Gegenstände mit 5 unterschiedlichen Materialien im Raum zu suchen und zu berühren. Runde 2: Sie sollen die gleichen Gegenstände berühren und dabei den Sachen einen neuen Namen geben. (Fenster > \"Das ist die Tür / ein Vorhang...\"","","PL","","","","",""],["Erklärvideo","","Transfer","Präsentation","","","","Nach einer autonomen / arbeitsteiliger Input-Phase: Einen kleinen Film mit dem Handy drehen, der die wichtigsten Infos zusammenfasst / die wichtigsten Sachverhalte erklärt","Handy","PA / GA","","","","",""],["Freiarbeit","","Üben","","","","Autonom","TN bestimmen die eigenen Übungsziele und üben selbstständig, mit Hilfe einer strukturierten Arbeitskartei mit einem größeren Angebot. Die bearbeiteten Materialien werden auf einem Laufzettel notiert.","Laufzettel","EA / PA","","","","",""],["Geteilte Pinnwand","","Präsentation","","","","","Pinnwand in Felder teilen und Felder benennen. Die beschrifteten Moderationskärtchen pinnen die TN in den passenden Feldern an. Die Zuordnung kann man im PL diskutieren","Pinnwand, Bespannungspapier","EA > PL","","","","",""],["Hatte noch nie die Ehre","","Gruppendynamik","Gruppenbildung","","","","TN wählen einen Lernpartner, sie arbeiten mit jemandem zusammen, mit dem sie noch nie / ganz selten zusammen gearbeitet haben. Geeignet für Aufgaben, bei denen es wichtig ist, dass man neue Sichtweisen kennen lernt.","","PA","","","","",""],["Hoch und Tief","","Feedback","Evaluation","","","","TN nennen den Höhepunkt und den Tiefpunkt (nach Wichtigkeit / nach eigener Aktivität oder Motivation / nach dem Ertrag / im Gruppenleben) und begründen ihre Meinung. Sie können ihre Einschätzung auch auf zwei versch. farbigen Kärtchen festhalten und anpinnen.","evtl. Kärtchen in zwei Farben","EA > PL","","","","",""],["Inseln im Raum","","Präsentation","","","","Ritual","Der KL / SL wählt bewusst den Ort, an denen er unterschiedliche Handlungen durchführt: Informieren, verbindliches klären, Erklärung, Exkurs, TN-Fragen beantworten... Auch wenn man das mit den TN nicht thematisiert, bei konsequenter Umsetzung wird das bewusst oder unbewusst von den TN wahrgenommen, dass der KL an unterschiedlichen Inseln in unterschiedlicher Funktion auftritt.","","FA / PL","","","","",""],["Klatschometer","","Feedback","","","","","Am Ende von Präsentationen / nach der Vorstellung von Ideen wird die beste Präsentation oder die beste Idee ausgewählt: Jeder TN klatscht - die am lautesten beklatschte Idee / Präsentation hat gewonnen. Meist kann man gar nicht entscheiden, welche Präsentation gewonnen hat - und es ist gut so :-)","","PL","","","","",""],["Kommentarblatt","","Feedback","","","","","Bei Präsentationen mit Produkten (Galerie, Angebotstisch) Kommentarblätter (leer oder Raster) für die Ersteller hinterlassen.","Post-it, Raster","","","","","",""],["Kraftzentrum / Körpermitte","","Wahrnehmung","Körpersprache","","","","TN arbeiten zu zweit. Das Theraband wird um die Hüfte des ersten TN gelegt, der Partner steht hinter ihm, und zieht mal rechts mal links - die Person mit dem Band soll loslassen und sich den Impulsen folgen. Die Impulse werden mit der Zeit immer abrupter und stärker. Dachen soll er versuchen, die Person, die das Band ganz fest um das Handgelenk gewickelt hat und festhält, aus dem Kraftzentrum aus, mit geradem Oberkörper wegzuziehen und sie laufen so durch den Raum / über den Hof. Auf Kommando lassen die hinteresn Personen das Band los und die Person vorne soll ohne stehen zu bleiben einfach weiter laufen. Am Ende reflektieren, wie man seinen Körper selbst erlebt hat - und jeder bekomt Rückmeldung zu dem Gangart mit und ohne Theraband.","Theraband","PA","freier Raum / im Freien","","","",""],["Lochen","","Kontrolle","","","","","Mit einer Schaffnerzange oder einem Locher auf der Sammelkarte der Gruppen / Personen jeweils einen Loch machen, wenn ein Punkt vergeben wird.","Schaffnerzange / Locher, feste Karten","","","","","",""],["Lückentext mit Flecken","","Input","Transfer","DaF LV","","","In einem Text mit Flecken ganze Wörter, mehrere Wörter, Teile von Wörtern verdecken. Funktioniert auch mit Bilddatei und Abdeckern, die man bei der Kontrolle abnimmt.","AB / gebeamter Text","EA/PA","","","","",""],["Marktschreier","","Präsentation","","","","","TN \"verkaufen\" ihre Ergebnisse / Ideen, gehen herum, sagen, was sie zu verkaufen haben - und stellen Interessenten ihre Ideen vor.","","CP","","","","",""],["Materialschlange","","Präsentation","","","","","Material - in Ermangelung an Tischen - als Schlange auf dem Boden auslegen. Material und den Platz evtl. nummerieren, damit die TN die Sachen nach dem Lesen / Bearbeiten wieder an die gleiche Stelle zurücklegen können.","Kärtchen / Kreide","","freier Platz in der Mitte des Raumes","","","",""],["Mind map auf dem Boden","Mind map begehen","Präsentation","","","","","TN erstellen in Gruppen Teile eines Mind maps. Die Teile vom geteilten Plakat oder Einzelplakate werden auf dem Boden zusammengefügt, z.B. mit Tesakrepp-Ästen und Kärtchen als Überschrift. Die TN \"begehen\" die Mind map und stellen zu den Teilen, die sie interessieren, Fragen an die Autoren.","Packpapier, Tesakrepp, Moderationskarten","GA > PL","freier Platz","","","",""],["Modell bauen","","Präsentation","","","","","Ergebnisse mit Legosteinen, bunten Kärtchen.. visualisieren. (Bedeutung der Farben klären!)","Legosteine / Kärtchen","GA","","","","",""],["Papierchat","","Erfahrung","Transfer","Feedback","DaF Schreiben","","Im Raum werden AB ausgehängt / ausgelegt, die die TN nacheinander besuchen. Auf den Blättern stehen echte oder fiktive Forumbeiträge (am besten auch so formatieren :-) - die TN erfinden sich einen Nickname und kommentieren den Originalbeitrag oder die Kommentare der anderen. Sie sollen jeweils angeben, auf welchen Beitrag sie reagieren (wie im Chat). Jeder kann auch mehrmals zum gleichen Chat zurückkehren.","AB","EA","","","","",""],["Plakat mit Post-its ergänzen","","Präsentation","","","","","Ein Plakatgerüst bei der Präsentation nach und nach mit vorbereiteten Post-its ergänzen.","Flipchart, Post-its","FA","","","","",""],["Raumlauf","","Aktivieren","Wahrnehmung","Körpersprache","","Bewegung","Die Spieler gehen entweder kreuz und quer oder in einer Richtung nahe den Wänden durch den Raum und achten dabei auf folgendes:  ihre Atmung ihre Entspannung ihren Blick, ihre Haltung und Gangart den Raum möglichst gut auszufüllen (wie Luftmoleküle) alle etwa das gleiche Tempo zu haben den Boden bewusst zu spüren (geht am besten ohne Schuhe) die anderen anzuschauen und bewusst wahrzunehmen zu lächeln :-) Ankommen Raumlauf wie oben. Der Spielleiter sagt zwischendurch: \"Wer angekommen ist, soll die Hand heben (Variante: und/oder stehenbleiben)\".  \"Angekommen sein\" heißt, den Alltag und die Gedanken, die einen vom Tag her noch immer beschäftigen, loszulassen, und nun wirklich auch geistig anwesend und bereit für die kommenden Übungen zu sein. https://improwiki.com/de/wiki/improtheater/raumlauf","","PL","","","","",""],["Reflexionsprotokoll","","Reflexion","","","","","Ergebnisse der Reflexion - in Kleingruppen oder im Plenum - als Protokoll (Listen, Mind map...) schriftlich festhalten.","Flipchart, Papier","GA / PL","","","","",""],["Zehn Finger","","Kennen lernen","","","","Großgruppe","Die TN bilden einen Kreis und halten alle zehn Finger hoch in die Luft. Nun stellen die TN Fragen, die man mit Ja oder Nein beantworten kann. Wer eine Frage nicht mit Nein beantworten muss, reduziert die Anzahl seiner Finger um einen Finger. Die Person, die am Ende übrigt bleibt gewinnt.","","PL","Stehkreis","","","",""],["Rollen-Buttons","","Gruppendynamik","","","","Ritual","Für eine längere Gruppenarbeitsphase (z.B. bei Projekten) in jeder Gruppe Rollen - und auch Rollen-Buttons für die bessere Identifizierung der Rollen - verteilen. Auf diese Weise erleichtern wir die Kommunikation zwischen den einzelnen Gruppen, wenn z.B. die Personen mit der gleichen Rolle einen Austausch brauchen.","Buttons (in versch. Farben oder mit Symbolen)","","","","","",""],["Rückseiten-Botschaften","","Feedback","Gruppendynamik","","","","Auf der Rückseite von einem Material (gern z.B. das, was wir beim Kennen lernen benutzt haben, z.B. Steckbrief) am Ende des Seminars Botschaften (Wünsche, Feedback...) für die Besitzer hinterlassen.","z.B. Steckbriefe","EA","","","","",""],["Running sushi","","Präsentation","Üben","Input","Wiederholung","","Material (Infokarten, Zitate, Übungen...) auf einem langen Tisch hinlegen. Die TN gehen um den Tisch herum, schauen sich die Materialien an, diskutieren sie, lösen die Aufgaben, notieren sich auf einem Beipackzettel, welche sie wichtig sind, und sortieren sie nach einem angegebenen System.. (und legen sie am Ende an den Originalplatz zurück).","Kärtchen, viele Tische","EA/PA","","","","",""],["Johannes","","Kennen lernen","Namen lernen","","","","Die Spieler stellen sich im Kreis auf. Spieler A ist der \"Johannes\".  Spieler A schaut/blinzelt nun einen Spieler B im Kreis an. Gleichzeitig ruft er den Namen eines anderen Spielers C Spieler A (Johannes) geht nun auf den Platz von Spieler B Spieler B geht auf den Platz von Spieler C Spieler C geht auf den Platz von Spieler A Spieler C ist nun der neue \"Johannes\" und beginnt von vorn. Nach und nach immer weiter die Geschwindigkeit erhöhen.","","PL","Stehkreis / Sitzkreis","","","",""],["Luftballons pusten","","Gruppendynamik","","","","","Die Gruppe in Teams von 3-5 Personen aufteilen. Jedes Team bekommt einen Ballon sowie einen Papier- oder Plastikfan. Ein Spieler bekommt eine Stoppuhr, er ist der Zeitnehmer. Aufgabe: Ballons müssen so lange wie möglich in der Luft gehalten werden, ohne berührt zu werden und ohne den Boden zu berühren. Die TN können dabei den Fächer benutzen oder pusten. Jedes Mal, wenn ein Ballon von einem Teammitglied berührt wird oder den Boden berührt, muss die Zeit auf der Stoppuhr auf Null zurückgesetzt werden.  Tipp: Jedem Team einen anderen farbigen Ballon geben, damit es keine Verwechslungen geben kann, wenn sich die Teams an irgendeinem Punkt überschneiden. Zeitrahmen begrenzen. Das Team, das es schafft, den Ballon in dieser Zeit über die längste Zeit in der Luft zu halten, ist der Gewinner.","Luftballons, Fächer","GA","","","","",""],["Mr. Hit me","","Kennen lernen","Namen lernen","Aktivieren","","","Alle Spieler stehen im Kreis. Ein Spieler läuft los und tippt einen anderen an der Schulter an. Der, der angetippt wurde, sagt den Namen eines 3. Spielers. Der genannte Spieler läuft dann los und tippt jemand anderes an, der wiederum einen Namen sagen muss (wenn der Spieler, der gelaufen ist, den anderen angetippt hat, stellt er sich neben ihn in den Kreis). Beispiel: Spieler A läuft los und tippt Spieler B an. Spieler B sagt \"Spieler C!\". Spieler C muss daraufhin los laufen und einen anderen Spieler antippen.","","PL","Stehkreis","","","",""],["Seminarfilm","","Gruppendynamik","Reflexion","","","Abschluss","Rückschau am Ende des Seminars: Aus Seminarfotos oder aus den zusammengefügten Seminarchroniken.","Fotos / PPP","PL","","","","",""],["Senda! Mitsou! Naka-Naka!","","Aktivieren","Konzentration","","","","SENDA - MITSUO - NAKA-NAKA! ein Konzentrationsspiel, das schnell gehen muss: Wir stehen im Kreis. Der erste Spieler zeigt deutlich auf einen Mitspieler und sagt SENDA! - der macht weiter und zeigt einen weiteren Mitspieler und sagt MITSUO. \"Mitsus\" Nachbarn heben beide Hände und machen winke winke -und sagen dabei NAKA-NAKA. Dann macht \"Mitsu\" weiter...","","PL","Stehkreis","","","",""],["SMART","","Ziele","Feedback","Planen","","","Bei der Formulierung von Zielen (Projektplanung, längere Gruppenarbeit, Unterrichtsplanung...) bewusst auf SMART achten: sind sie spezifisch? messbar? anspruchsvoll / akzeptiert / attraktiv (hierfür gibts verschiedene Varianten auf Deutsch)? realistisch? terminiert?","evtl. Plakat","","","SMART_Ziele.jpg","","",""],["Spinnennetz","Auswertungsspinne","Reflexion","Feedback","","","","Die TN bewerten einen Arbeitsprozess / ein Produkt mit einem AB aus 6-8 Aspekten: Sie markieren auf den Ästen die Werte und verbinden die Punkte nachher miteinander. Je größer das Spinnennetz, desto erfolgreicher der Prozess. In der Gruppe die Werte vergleichen und besprechen, wie bei nächsten Aufgaben die Werte verbessert werden könnten.","AB","EA > GA > PL","","spinne.png","","",""],["Storytelling","","DaF Sprechen","","","","","Dramapädagogische Methode: Erzählen von Geschichten, aus der Ich-Perspektive. Vorangehende Übungen: 3-Minuten-Interview, dem Partner über ein intensives Erlebnis erzählen - danach geht der Partner auf die Bühne und erzählt, indem er sich in die Rolle des anderen schlüpft. (Plus: Beobachtungsaufgabe beim Gespräch zu Gestik, Mimik, Sprechart, Sprachgebrauch..)","","PA > PL","Bühne","","","",""],["Stuhlkreis","","DaF Sprechen","Gruppendynamik","","","Ritual","Die TN sitzen im Kreis (keine Tische!). Das kann als Ritual zu Beginn der gemeinsamen Arbeit regelmäßig zu Berichten, Reflexion, als Frage- und Feedbackrunde... eingesetzt werden. Jeder hat Rederecht, und jeder begrenzt sein eigenes Rederecht auf das Nötigste, damit jeder drankommen kann.","","PL","Stuhlkreis","","","",""],["Methodenteppich klopfen","","Reflexion","Transfer","","","","Am Ende des Seminars in Kleingruppen die Einträge auf dem Methodenteppich besprechen: Methoden beschreiben, sortieren, die eigenen Notizen nochmal studieren... Ruhig lange Zeit geben! Fortsetzung: Heißer Stuhl mit Fliegenklatsche.","Methodenteppich, eigene Notizen","GA","","","","Methodenwand mit Farbgelände in die PRÄSENTATION einbauen, WHITEBOARD für alle freischalten, TN markieren die \"Methodenkärtchen\"",""],["Vorgezeichnet","","Präsentation","Visualisierung","","","","Erhöht die Lebendigkeit von Präsentationen am Flipchart: Plakat oder Plakatteile mit Bleistift dezent vorzeichnen, so dass die Teile aus der Entfernung nicht sichtbar sind. Bei der Präsentation skizzenhaft nachzeichnen.","Plakat","FA","","","","",""],["Mosaikwort","","Input","Gedächtnis","","","","Für die bessere Bemerkbarkeit die wichtigsten Inhalte als Mosaikwort zusammenfassen, die einen Sinn ergeben z.B. ZITRUS (Lahninger), SMART-Ziele, SWAT-Analyse, REZEPT (Rachow). Mit Mosaikwörtern kann man auch Merksätze basteln, in denen die Wörter der Reihe nach mit den Buchstaben beginnen.","","","","neue001.jpg","","",""],["Namenssilben","","Kennen lernen","Namen lernen","","","","Die TN bilden einen Kreis. Die erste Person sagt ihren Namen und macht zu jeder Silbe ihres Namens eine Geste.  Beispiel: Peter. Der Name Peter besteht aus zwei Silben (Pe-ter). Also macht Peter zu jeder Silbe eine Geste. Peter sagt \"Pe\" und stampft mit einem Bein auf den Boden. Peter sagt \"ter\" und fasst sich mit Daumen und Zeigefinger an seine Nase.  Jeder Spieler wiederholt dieses Muster mit seinem eigenen Namen. Haben alle Teilnehmer Gesten zu Ihren Silben gemacht, so beginnt die nächste Stufe.  Jetzt sagt ein Spieler den Namen einer anderen Person und macht die Gesten, die diese Person zum eigenen Namen vorher gemacht hat. Danach wiederholt diese Person den eigenen Namen und die eigenen Gesten. Danach ruft sie einen Namen einer anderen Person auf (und macht dabei natürlich die passenden Gesten)","","PL","Stehkreis","","","",""],["Blinzeln - Platzwechsel","","Wahrnehmung","Konzentration","Aufwärmen","","","Wahrnehmung - Weitwinkel- (oder Indianer)blick trainieren Einer (A) steht in der Mitte des Kreises. Die TN im Kreis suchen Augenkontakt zueinander. Wenn sich zwei Augenpaare gefunden haben, blinzeln sich die beiden TN heimlich zu, rennen dann gleichzeitig los und tauschen so schnell es geht die Plätze. (A) muss versuchen, einem der beiden den Platz wegzuschnappen.","","PL","Stehkreis","","","",""],["Barney","","Aktivieren","Konzentration","DaF Sprechen","DaF GR","","TN stehen im Kreis.  Alle Spieler fangen an, langsam in einem gemeinsamen Rhythmus mit den Fingern zu schnipsen. Ein Spieler stellt sich in die Mitte des Kreises, das ist der \"Barney\". \"Barney\" ruft nun einen zufälligen Buchstaben des Alphabets, z.B. \"B\" und deutet dann auf einen Spieler A im Kreis. Dieser Spieler A bildet jetzt mit dem Buchstaben \"B\" einen Satz und zwar nach folgendem Schema:  ein Vorname oder Subjekt mit dem Anfangsbuchstaben \"B\" ein Verb mit dem Anfangsbuchstaben \"b\" ein Adjektiv mit dem Anfangsbuchstaben \"b\" ein Objekt mit dem Anfangsbuchstaben \"B\" ... in einem Land/Ort mit dem Anfangsbuchstaben \"B\". Also beispielsweise könnte der Spieler A nun rufen:  \"Beatrix baut beheizbare Bassrollen in Bergen.\". Schafft der Spieler A dabei im Rhythmus des Fingerschnipsens zu bleiben, ruft \"Barney\" in der Mitte nun einen neuen zufälligen Buchstaben des Alphabets, z.B. \"K\" und zeigt dann auf einen neuen Spieler. Kommt der Spieler A jedoch aus dem Rhythmus oder macht einen Fehler, so geht er als der neue \"Barney\" in die Mitte und der alte \"Barney\" nimmt stattdessen seinen Platz im Kreis ein. Der Gruppenrhythmus des Fingerschnippsens kann dann im Laufe des Spiels allmählich schneller werden.","","PL","Stehkreis","","","",""],["Geräuschball","","Aktivieren","Konzentration","","","","Die TN  stehen im Kreis. Sie werfen sich einen imaginären Ball zu. Bei jedem Wurf macht der Werfer ein Geräusch. Der Fänger wiederholt dieses Geräusch wenn er den Ball fängt. Dann gibt er den Ball mit einem neuen Geräusch an einen anderen Spieler weiter.","","PL","Stehkreis","","","",""],["Steigerung","","Aktivieren","Wahrnehmung","","","","Die TN stehen im Kreis. Einer macht zu seinem Nachbarn eine dezente Geste oder Bewegung ggf. begleitet von einem Wort oder Ton. Der Nächste macht das Gleiche, aber ein wenig stärker. So geht es reihum, immer ein wenig gesteigert - bis es nicht mehr geht. Dann fängt derjenige, der keine Steigerungsmöglichkeit mehr sieht, eine neue Runde an.  Variation: Wenn die Geste oder Bewegung nicht mehr gesteigert werden kann, wird sie vom Nächsten wieder langsam abgeschwächt, bis sie kaum noch wahrzunehmen ist.","","PL","Stehkreis","","","",""],["Monster","","Aktivieren","Konzentration","Wahrnehmung","","","Spieler A steht in der Mitte eines großen Kreises, den alle anderen Spieler bilden. A ist das Monster. Er bewegt sich mit nach vorne ausgestreckten Armen, schreckliche Geräusche ausstoßend und mit fürchterlicher Miene auf einen der Spieler - B - zu. Dieser schaut hilfesuchend einen anderen Spieler - C - an. Wenn C den Blick bemerkt, sagt er den Namen eines beliebigen weiteren Spielers - D - . Daraufhin wendet sich A von B ab und geht auf D zu. D sucht nun Blickkontakt mit einem anderen Spieler. Dieser bemerkt das und sagt den Namen eines Spielers usw. Das Monster (A) verwandelt sich dann in einen normalen Menschen, wenn es ihm gelingt, sein \"Opfer\" zu berühren, bevor der vom Opfer angeschaute Spieler einen Namen ausgesprochen hatte. In diesem Fall verwandelt sich das Opfer in das Monster.","","PL","Stehkreis","","","",""],["Zip - Zoom - Boing","","Aktivieren","Konzentration","","","","Ein Spieler fängt an, in die Hände zu klatschen, dabei zeigt er entweder nach links oder nach rechts mit den Händen und dem Blick.  Klatschen nach Links wird mit einem \"Zip\" kommentiert. Klatschen nach Rechts wird mit einem \"Zoom\" kommentiert. Der \"Angeklatschte\" muss so schnell wie möglich, am besten noch *im* Klatschen des Nachbarns reagieren und den \"Klatscher\" weitergeben, Richtung beliebig. Das Klatschen darf also auch zurückgegeben werden und die Richtung ändern.  Anstatt nach links oder rechts kann das Klatschen auch mit einem \"Boing\" an einen beliebigen Spieler im Kreis weitergegeben werden. Ganz wichtig: Blickkontakt und deutliches Zeigen.","","PL","Stehkreis","","","",""],["Gerüchte","","Aktivieren","DaF Sprechen","","","","","Alle TN stehen im Kreis. Ein Spieler A fragt seinen Nachbarn Spieler B im Kreis, ob er schon das Gerücht über XYZ gehört hat: z.B.: \"Hast du schon gehört, dass zwei Löwen aus dem Zoo ausgebrochen sind?\" Spieler B nimmt das nun auf, fügt etwas hinzu und macht das Gerücht größer: \"Ja und ich habe auch gehört, dass man sie noch nicht wieder eingefangen hat und sie wohl mit der UBahn von Steakhaus zu Steakhaus fahren.\" Danach kichern Spieler A und B zusammen kurz. Spieler B gibt dann ein neues Gerücht weiter an Spieler C im Kreis usw.","PL","Stehkreis / Sitzkreis","","","",""],["Was ist ein was ist ein was?","","Aktivieren","DaF WS","","","","Alle TN stellen sich im Kreis auf und schnipsen langsam einen Rhythmus mit den Fingern. Spieler A beginnt dann mit einem Satz in der Form: \"Was ist ein was, ohne ein was?\", also z.B.: \"Was ist ein Kind ohne die Mutter?\" Der nächste Spieler B im Kreis versucht nun einen ebenso aufgebauten Satz darauf zu reimen, also z.B.: \"Was ist ein Brot ohne die Butter?\" Dann ist der nächste Spieler an der Reihe und versucht wieder einen Satz auf \"Butter\" zu reimen. Es wird so lange gereimt, bis einem Spieler nichts mehr einfällt, er einen Fehler macht, oder er aus dem Fingerschnips Rhythmus kommt. Dann ruft die ganze Gruppe: \"Oooohh. Was ist ein Was ist ein Was ist ein Was?\".","","PL","Stehkreis / Sitzkreis","","","",""],["Whiskeymixer","","Aktivieren","Konzentration","","","Bewegung","Wichtig für dieses Aufwärmspiel sind die drei Wörter \"Whiskeymixer\", \"Wachsmaske\" und \"Messwechsel\".  Alle Spieler stellen sich im Kreis auf. Im Uhrzeigersinn wird das Wort \"Whiskeymixer\" möglichst schnell herum gegeben. Sagt ein Spieler \"Messwechsel\", wird die Richtung gewechselt und das Wort \"Wachsmaske\" wird entgegen dem Uhrzeigersinn weitergegeben. Das A und O des Spiels ist dabei Geschwindigkeit: Zögert ein Spieler oder fängt an zu lachen, muss er bzw. sie einmal um den Kreis laufen.  Hinweise und Tipps  Versprecher sind bei diesem Spiel explizit erlaubt! Man kann auf das Kreislaufen verzichten - dann ist das Aufwärmspiel eher noch witziger. Ob \"Wasmaxe\" oder \"Wiximixi\", irgendwann verspricht sich jeder mal und es ist jedes Mal wieder witzig! Für Perfektionisten ein Spiel, das Grenzerfahrungen vermittelt ;-) Ein schönes, schnelles Spiel um den Kopf freizubekommen.","","PL","Stehkreis","","","",""],["Der König von Siam","","Aktivieren","Konzentration","","","","Beim König von Siam sitzt oder steht man im Kreis. Ein TN ist der König, die anderen werden reihum nummeriert, der Letzte hat allerdings keine Nummer, sondern ist \"der Letzte\".  Der König von Siam hat seine Krone verloren, nun ist die Frage wer sie gefunden hat, und so geht auch das Spiel:  König: Der König von Siam hat seine Krone verloren. Nummer x hat sie gefunden! Nummer x: Ich nicht, meine Herr! König: Wer dann, mein Herr? Nummer x: Nummer y, mein Herr!  Nun muss Nummer y sofort entrüstet verneinen: Nummer y: Ich nicht mein Herr! Nummer x: Wer dann, mein Herr? Nummer y: Nummer z, mein Herr!  Nun muss Nummer z ablehnen und so weiter.  Wer sich vertut, zu langsam ist, sein Sprüchlein falsch sagt, der wird zum \"Letzten\", und alle anderen werden entsprechend neu nummeriert.  Wichtig ist bei dem Spiel, das Tempo hoch zu halten, und wenn der König entscheidet dass irgendwer zum Letzten wird, dann ist das so.","","PL","Stehkreis / Sitzkreis","","","",""],["Gestenkette","","Aktivieren","Konzentration","Wahrnehmung","","","Die Spieler stehen locker im weiten Kreis, so dass es ihnen möglich ist, auch ausladende Bewegungen und Gesten zu machen. In der Startrunde macht jeder eine übertrieben ausgeprägt dargestellte haushaltstypische Bewegung z.B. Staub saugen oder Wäsche aufhängen. Haben alle nacheinander eine Bewegung gemacht, macht der Starter seine Bewegung und eine von einem anderen Spieler. Danach kommt diese Person dran, macht seine Bewegung und danach wiederum eine von einer anderen Person. usw. Wichtig ist, dass die Bewegungen immer übertrieben, ausgeprägt und engagiert gemacht werden. Die Wechsel müssen schnell und zackig gehen.","","PL","großer Stehkreis","","","",""],["Menschen Hände Füße","","Aktivieren","Kooperation","","","Bewegung","Wir bewegen uns auf Musik kreuz uns quer durch den Raum. Wenn die Musik stoppt, und dann drei Zahlen.  Die erste Zahl steht für die Zahl der Spieler, die sich - schnell - zusammenfinden müssen. Dieses Zusammenfinden drückt sich dadurch aus, dass diese Personen durch Körperkontakt - an welcher Stelle auch immer - miteinander verbunden sind. Die zweite Zahl steht für die Anzahl der Hände, mit der die Gruppe den Boden berühren darf. Die dritte Zahl steht für die Anzahl der Füße, mit denen die Gruppe den Boden berühren darf. Mit anderen, weiteren Körperteilen darf der Boden nicht berührt werden. \"3-3-2\": 4 Gruppen mit jeweils 3 Spielern, diese dürfen sich -- pro Gruppe! -- jeweils mit drei Händen und zwei Füßen abstützen.  Es entstehen so interessante, witzige \"Standbilder\". Wobei es schon ziemlich akrobatisch ist, wenn in einer Gruppe eine Person ohne Fußabstützen auskommen muss (wie im Beispiel). Daher sollte man grundsätzlich jeder Person einen Fuß \"zubilligen\". Es können auch andere/weitere Körperteile in das Spiel einbezogen werden (Kopf, Po), dann muss dies aber ausdrücklich angesagt bzw. vereinbart werden.","","PL","freier Raum","","","",""],["Improtheater","","DaF Sprechen","","","","","Viele Übungen dazu hier: https://improwiki.com/de/uebungen","","","","","","",""],["Schneesturm","","Reflexion","Feedback","","","","Am Ende des Unterrichts / einer größeren Einheit schreiben die TN auf Zettel, was für sie am wichtigsten war, was sie gelernt haben. Sie zerknüllen das Papier und auf ein Zeichen werfen sie sie in die Mitte. Jeder nimmt dann ein Papier und liest es kommentarlos vor.","Papier","EA > PL","","","","",""],["Wortliste / Glossar","","Input","DaF WS","","","","Liste wichtiger Wörter und Fachbegriffe, Stütze für LV / Präsentationen","AB / Online-Speicher","","","","","",""],["Sprechblasen","","Präsentation","DaF LV","","","","Durch Sprechblasen und Gedankenblasen werden wichtige Formulierungen und gedankliche Hintergründe zum Thema / als Paralleltext zu komplexeren Texten angeboten. Lenkt den Fokus, hilft beim einprägen, hilft komplexere Textstellen zu verstehen. Eignet sich auch als Suchaufgabe für Lesen (wo steht das im Text?) bzw. nach dem Lesen als Hilfe für die Zusammenfassung der wichtigsten Aussagen.","AB","","","","","",""],["Bildsequenz","","Präsentation","DaF Sprechen","","","","Eine Reihe von Bildern, die zeitliche Abläufe, räumliche Anordnungen oder inhaltliche Zusammenhänge veranschaulichen. (Verwandt mit FILMLEISTE). Die L beschriften die Bilder / erzählen anhand der Bilder, sammeln dazu Beispiele... usw.","AB","","","","","",""],["Ideennetz","Clustering","Ideen","","","","","In die Mitte eines weissen Papiers einen Begriff schreiben. Um den Begriff einen Kreis zeichen (das ist der Kern des Clusters). Von der Mitte ausgehend werden Ketten von Einfällen gebildet. Sobald einem nichts mehr einfällt, geht man zurück zur Mitte und beginnt mit einer neuen Assoziationskette. Jeder Begriff wird wiederum selbst mit einem Kreis umgeben und durch einen Strich mit dem Kern oder einem anderen Gedanken verbunden. Sobald in Ihrer Darstellung ein Muster erkennbar ist, kann man mit dem Schreiben oder Vortrag beginnen. (Entwickelt wurde diese Methode des kreativen Schreibens zur gleichen Zeit wie das Mind Mapping Anfang der 70iger von der amerikanischen Pädagogin Gabriele L. Rico. Diese Technik beruht auf der von Sigmund Freud entwickelten Methode der „freien Assoziation“. Alle Gedanken sind erlaubt. Es gibt keine Zensur. )","Papier","EA / PA","","mw_800x600_001.jpg","","",""],["Satzmuster","","DaF Sprechen","DaF Schreiben","","","","Mustersätze / standardisierte Redewendungen, die z.B. für die korrekte Nutzung der Fachsprache wichtig sind.","AB / Beamen / Satzstreifen","","","","","",""],["Concept Map","Begriffsnetz","Ideen sammeln","Präsentation","","","","Reduktion auf das Wesentliche – Auswahl der wichtigsten Begriffe Räumliche Anordnung der Begriffe (Strukturierung und Visualisierung) – Aufbau i.d.R. von oben nach unten (zentraler Begriff oben, dann hierarchisch absteigend), dichter beieinander oder weiter entfernt in Abhängigkeit von der Semantik Begriffe umrahmen und mit Pfeilen verbinden Begriffsnetz verfeinern (Elaboration) durch z.B. Beschriftung der Pfeile, Ergänzung der Begriffe mit Zusatzinformationen. sind häufig komplexer als Mind Maps. Es gibt mehrere zentrale Begriffe, um die sich weitere Schlüsselwörter organisieren. So können Sie z.B. mit einer Concept Map das Beziehungsgeflecht eines Romans abbilden. Mit einer Mind Map können Sie nur den Stammbaum einer Familie darstellen. In einer Concept Map werden konkrete Aussagen getroffen, die kontrovers diskutiert werden können. Dieses geschieht über die Verbindungslinien und deren Beschriftung. Mind Maps hingegen sind nicht richtig oder falsch. Sie können aus dem Blickwinkel des Betrachters lediglich vollständig oder aber unvollständig sein.","Papier","","","","","",""],["Strukturdiagramm","","Präsentation","DaF LV","DaF Sprechen","","","Abstrakte Darstellung eines Sachverhaltes, wichtige Fachbegriffe werden in verzweigter Struktur dargestellt, dass daraus ihre Logik und innere Struktur hervorgeht.","","Papier","","","","",""],["Stille Post","","DaF Schreiben","","","","","Zwischen verschiedenen Gruppen läuft Post in Form von Arbeitsaufträgen auf AB, die zur Korrektur und Kontrolle wieder zur Ausgangsgruppe zurückkommt.","AB","GA","","","","",""],["Lehrer-Karussell","","Präsentation","Input","","","","Die Klasse wird in z.B. neun Dreiergruppen (Nr. 1, ..., 9) mit je drei Schülern (A, B, C) eingeteilt. Jede Gruppe bearbeitet eine andere Aufgabe (Aufgabennummer = Gruppennummer). Runde 1: Auf ein Signal hin wandern die Schüler A zur nächsten Gruppe. Dort nehmen sie die Lehrerrolle ein. Sie beraten und moderieren die neue Gruppe bei der Bearbeitung ihrer „alten“ Aufgabe. Runde 2: Nach einer festgesetzten Bearbeitungszeit wandern die Schüler B mit der soeben bearbeiteten Aufgabe zur nächsten Gruppe. Dort nehmen sie die Lehrerrolle ein. Runde 3: Dasselbe machen anschließend die Schüler C, so dass die alte Gruppe wieder komplett ist. Es können sich weitere anschließen. — Bei den Aufgaben kann es sich um Rechenaufgaben, Lückentexte, Zuordnungen, Frage-Antwort-Quiz, Fachkreuzworträtsel, Aufgaben zu Fachtexten u.a. handeln.","","GA","","","","",""],["Schaufensterbummel","","Input","Üben","","","","1. Die Tischflächen werden leergeräumt und für eine Ausstellung vorbereitet. 2. Auf den Tischflächen werden mehr Materialien ausgebreitet als die Gruppe Mitglieder zählt. 3. Die Schüler sehen sich alle ausgelegten Materialien in Ruhe an. 4. Auf ein Signal hin, wählt jeder Schüler ein Beispiel aus, das ihn besonders interessiert. 5. In Stillarbeit wird das Beispiel bearbeitet und ggf. auf ein anderes Thema umgeschrieben. 6. Die Bearbeitungen werden im Klassenraum aufgehängt und gesichtet. 7. Jeder Schüler kann drei Punkte vergeben, die auf die Beispiele geklebt oder gemalt werden. Die drei Beispiele mit den meisten Punkten werden präsentiert.","","EA / PA / GA","freigeräumte Tischflächen","","","",""],["Expertenkongress","","Input","","","","","Voraussetzungen: Das Thema muss sich in deutlich abgegrenzte Aspekte gliedern lassen. — Die Anzahl dieser Aspekte bestimmt die Zahl der Gruppenmitglieder. — Da die Methode anspruchsvoll ist, sollte Gruppenarbeit bereits anderweitig geübt sein. — Zeitrahmen: Mindestens zwei Stunden. — Sprachaspekte: Die Verwendung der Muttersprache in den Gruppen ist akzeptabel. Hier wird vor allem das Leseverstehen geübt. Die Auswertung im Plenum findet in der Zielsprache Deutsch statt. Durchführung: 1. Aufgabenstellung und Arbeit in Farbgruppen — Die Klasse wird in Farbgruppen eingeteilt und bearbeitet ihre Aufgabe. — Jeder Schüler erhält eine Expertenaufgabe und eine Nummer, (z.B. Rot 1, Rot 2, ..., Grün 1, etc.). 2. Arbeit in Expertengruppen — Die Experten, z.B. alle mit der gleichen Nummer (z.B. Rot 1, Grün 1, Blau 1, Gelb 1, ...), treffen sich in Expertengruppen, berichten einander und lösen gemeinsam eine neue Expertenaufgabe. 3. Präsentation im Plenum — Die Expertengruppen präsentieren ih","","GA","","","","",""],["Aushandeln","","Problemlösung","","","","","1. Der Lehrer gibt eine Aufgabe, Frage, Problemstellung etc. vor. 2. Jeder Schüler bearbeitet auf einem Zettel oder Arbeitsblatt eine eigene Lösung. 3. Er vergleicht mit dem Banknachbar, und beide handeln eine gemeinsame Lösung aus. 4. Anschließend handeln die beiden eine gemeinsame Lösung mit dem Paar der Nachbarbank aus usw.. 5. Am Ende gibt es zwei Gruppen mit ausgehandelten Lösungen, die von je einem Vertreter präsentiert werden. — Das Verfahren lässt sich abkürzen, indem gleich zwei Gruppen gebildet werden, die ihre Ergebnisse einander präsentieren und anschließend eine gemeinsame Lösung aushandeln. — Es empfiehlt sich, mit Hilfe einer Folie die Schrittfolge des Aushandelns übersichtlich darzustellen und einzublenden.","AB","EA > PA > GA","","","","",""],["Thesentopf","","DaF Sprechen","Einstieg","","","","Sammlung von Pro- und Contra-Thesen zur Führung eines Streitgesprächs / Expertengesprächs / für eine Podiumdiskussion","AB","","","","","",""],["Abgestufte Lernhilfen","","Üben","Input","","","Differenzierung","Den TN werden zu einer Aufgaben- oder Problemstellung Hilfen angeboten, abgestuft von schwach bis stark. Die TN entscheiden selbst, ob und wann sie davon Gebrauch machen. (Hilfen in Briefumschlägen) Schüler können auch selbst Lernhilfen erstellen","Briefumschläge","","","","","",""],["Lösungsblatt zum Aufklappen","","Kontrolle","","","","Selbstkontrolle","Auf dem AB die Lösung mit einem bunten Blatt abdecken und mit Tesafilm oben festkleben, so dass es einfach aufklappbar ist. Geeignet für AB mit mehrschrittigen Aufgaben.","AB, bunte Kärtchen, Tesafilm","EA / PA / GA","","","","",""],["Geheimes Wort","","Aktivieren","Präsentation","DaF Sprechen","","","TN bekommen ein Thema / wählen ein Thema, über die sie einen Vortrag halten sollen - und ziehen ein Wort / 2-3 Wörter, die mit dem Thema nicht zu tun  haben. Ihre Aufgabe ist es, das Wort so geschickt im Vortrag zu verstecken, dass das Publikum es nicht erraten kann.","Themenkarten, Wortkarten","PA / GA > PL","","","","",""],["Ich habe noch nie","","Kennen lernen","DaF Sprechen","DaF HV","","","Die TN halten 5 / 10 .. Finger hoch (abhängig von der Gruppengröße). Ein TN sagt etwas, was er/sie noch nie getan hat. Alle, die es schon getan haben, schließen einen Finger und erzählen etwas über die Aktivität. Die Runde endet, wenn jemand es schafft, alle Finger zu schließen.","","Sitzkreis","","","","",""],["JA - NOCH NIE","","Kennen lernen","","","","","Die TN schreiben auf beide Seiten eines A4-Blattes mit dicken Stiften JA / NOCH NIE. Der Spielleiter liest eine Frage aus der Sammlung vor (Hast du schon... / Warst du schon...?). Die TN zeigen ihre Antwort, in der ersten Runde bestimmt der SL, welche 2 TN erzählen sollen, in der nächsten Runde liest eine der beiden die nächste Frage und die beiden bestimmen, welche 2 jetzt erzählen... Ideen für Fragen: https://icebreakerideas.com/have-you-ever-questions/#Have_You_Ever_8230_Funny_Version und http://iteslj.org/questions/haveyou.html","Fragekarten","PL","Sitzkreis","","","",""],["Menschenbingo","Human Bingo","Kennen lernen","Einstieg","DaF Sprechen","DaF HV","Bewegung","Jeder TN bekommt ein Blatt A4-Papier und faltet es viermal, um ein 4 x 4 Bingoraster zu bekommen. Der KL stellt 16 Fragen / beamt die Fragen (keine ja-nein-Fragen!) und die TN schreiben die Antwort auf die erste Frage in ein beliebiges Feld. Für die Antwort auf die 2. Frage sollen die TN das Blatt drehen und wieder in ein beliebiges Feld notieren... das dann solange, bis alle Gitter mit den Antworten gefüllt sind. TN gehen herum befragen die anderen und markieren das Feld, wenn ihre Antwort gleich ist. Wenn sie horizontal / vertikal / diagonal eine Linie hinbekommen, müssen sie BINGO rufen.  Wichtig: Die TN dürfen einander ihre Blätter nicht zeigen.","Liste von Fragen / Beamer, A4-Blätter","EA > CP","","menschenbingo.png","","",""],["Labyrinth-Spiel","The A-MAZE-ING GAME","Transfer","DaF WS","DaF GR","","Wettbewerb","Die TN spielen in Paaren. Sie sagen einander, wo ihr Eingang ist und markieren das im bisher leeren Raster. Ziel des Spiels ist es, die Schatztruhe zu finden und das Labyrinth zu verlassen. Ein Spieler nennt die Koordinaten eines Quadrats: man kann immer ein Feld weitergehen (links, rechts, geradeaus) aber nicht durch Wände gehen. Der Partner nennt dann das Wort, das auf diesem Feld steht und der Spieler muss das Wort erklären / einen Satz damit sagen. Kann er das, dann darf er weitergehen, kann er das nicht, so ist der nächste Spieler dran. Landet ein Spieler auf einem Hinweis-Feld, bekommt er eine Information, wo es eine Wand gibt. Während des Spiels sollten die Spieler ihre Züge auf dem leeren Gitter aufzeichnen und die Wörter notieren.","Vorbereitung: Jeder TN bekommt ein A4-Blatt, teilt das Blatt und faltet jedes Blatt 4x, sodass er ein Raster mit 16 Feldern bekommt. Sie schreiben oben die Zahlen 1-4, an der Seite die Buchstaben A-D. Sie markieren auf einem AB dann einen Eingang in das Labyrinth an den Außenwänden des Labyrinths und einen Ausgang, legen dann 9 Wände in das Labyrinth legen und verstecken auch einen Schatz (auf dem Bild markiert mit T für Treasure). Sie markieren auch 4 Quadrate mit \"Hinweis\" (H) markieren. Sie füllen dann das Raster mit 10 Wörtern.","PA","","grid4.jpg","","",""],["Google Bilder","","Einstieg","DaF WS","","","","Die TN denken an ein Wort und tragen es bei Google Bildersuche ein. Sie wählen dann 3-5 Bilder aus den Ergebnissen und zeigen es den anderen. Die Aufgabe ist es, das Wort zu raten. (Punkte: Nach dem 1. Bild erraten: 1 Punkt, usw. Gewonnen hat das Team mit der niedrigsten Punktzahl.)","Internet","PA / GA > PL","","","","",""],["The Courious Cat","Die neugierige Katze","DaF Sprechen","DaF Schreiben","DaF WS","","","Ein TN steht in der Mitte. Ein anderer sagt still das ABC - der in der Mitte stoppt ihn dann. Der Spieler in der Mitte stellt nacheinander Fragen (Wer, wo, wann, mit wem, warum...) und zeigt auf andere TN, die dann kurze Antwort geben sollen - mit dem Buchstaben, der in der Runde gewählt wurde. Kann ein Mitspieler nicht antworten, bekommt die \"Katze\" einen Punkt. Erreicht er 3 Punkte, fasst er die \"Story zusammen\" und tauscht mit der Person den Platz, die zuletzt nicht antworten konnte.  Am Ende kann man abstimmen lassen, welche Story am witzigsten war oder in PA können sie eine der Storys schreiben.","","Sitzkreis","","","","",""],["Überleben auf der Insel","","DaF WS","","","","","Die TN sitzen im Kreis. Sie stellen sich vor, auf einer einsamen Insel zu sein und überlegen, was sie zum Überleben brauchen. Der erste Spieler muss etwas mit A nennen, der nächste mit B .. usw. Der Spielleiter oder ein TN zählt die Gegenstände, die sie gesammelt haben. Kann jemand kein Wort mit dem Buchstaben nennen, der an der Reihe ist, wird ein Punkt von der Liste gestrichen. Ziel ist, möglichst viele Punkte in der Runde zu sammeln (bis alle dran waren). Zweite Runde riskanter: Für jeden \"Aussetzer\" 2 Punkte kassieren, in der 3. Runde 3.... (Wir beginnen bei einem anderen Mitspieler.)  Die Gruppe entscheidet, ob sie in die nächste Runde gehen...","","Sitzkreis","","","","",""],["Wörterduell","","DaF WS","","","","","Der SL nennt ein Wort / ein Wortfeld. Die Teams schreiben in 1 Minute Synonyme / zusammengesetzte Wörter / abgeleitete Wörter / Wörter zum Wortfeld. Nach einer Minute lesen sie reihum Wörter vor - hat es eine andere Gruppe, müssen sie es alle durchstreichen. Gewonnen hat das Team, das das letzte Wort sagen kann.","","PA / GA > PL","","","","",""],["UNO - Nummerierte Köpfe 2","","Gruppenbildung","","","","","Gruppen bilden mit UNO-Karten: Die gleiche Farbe bestimmt die Gruppe. Jeder TN behält seine Karte, die Nummer kann dann bestimmen, wer welche Rolle übernimmt (Auflösung: Flipchart vorbereiten). ODER der Gruppensprecher wird in jeder Gruppe durch Zufall ermittelt, erst unmittelbar vor der Präsentation sagt der KL, wer in der Gruppe die Ergebnisse vorstellt (in jeder Gruppe andere Zahl nennen!)","UNO-Karten","GA","","","","",""],["GoGoMo","Give one, get one, move on.","Erfahrung","Diskussion","Präsentation","DaF Sprechen","Bewegung","Die TN notieren 3 Ideen zum Thema auf einem Blatt Papier. Sie gehen herum, finden einen Partner,  beschreiben ihm eine ihrer Ideen, bekommen eine von dem Partner, die sie notieren. Sie diskutieren kurz beide Ideen und gehen dann weiter....","Papier","EA > CP","","","","",""],["Windrad-Diskussion","","Diskussion","DaF Sprechen","","","","Die TN sind in 4 Gruppen unterteilt. Drei dieser Gruppen diskutieren das Thema aus einer vorher bestimmten Perspektive. Die vierte Gruppe bilden die \"Provokateure\", die dafür sorgen sollen, dass die Diskussion weitergeht und kontrovers bleibt. Eine Person aus jeder Gruppe (der \"Sprecher\") sitzt in der Mitte, so dass die 4 ein Quadrat bilden. Hinter jedem Redner sitzen die übrigen Gruppenmitglieder: zwei direkt hinter dem Sprecher, dann drei hinter ihnen usw. und bilden eine Art Dreieck. Von oben würde dies wie ein Windrad aussehen. Die vier Sprecher stellen Fragen vor, die sie im Vorfeld gemeinsam in der Gruppe vorbereitet haben vor und diskutieren sie. Nach einiger Zeit kommen neue TN von den Sitzen hinter dem Sprecher in die Mitte und jemand rückt von der nächsten Reihe auf und besetzt seinen Stuhl...","","GA > PL","","","","",""],["Conver-station","Rotierende Diskussion","Diskussion","DaF Sprechen","","","Bewegung","Die TN werden in Gruppen von jeweils 4-6 Personen eingeteilt und bekommen eine Frage, die sie besprechen sollen (jeweils ein Teilaspekt des Themas, das wir diskutieren möchten). Nach etwa 5-10 Minuten wechseln ein oder zwei TN aus jeder Gruppe in eine andere Gruppe, während die anderen Gruppenmitglieder dort bleiben, wo sie sind. Die Diskussion geht weiter, und die neuen werden in ihrer neuen Gruppe eine andere, aber verwandte Frage diskutieren und sie können dabei auch einige der wichtigsten Punkte aus dem Gespräch der letzten Gruppe mit einbringen. Bei der nächsten Rotation gehen TN weiter, die vorher in ihrer Gruppe geblieben sind haben. Usw. (4-5 Runden machen).","","GA","","","","",""],["Chat-Stationen","","Diskussion","Ideen","Transfer","DaF Sprechen","Bewegung","Beschreibung hier: https://www.youtube.com/watch?time_continue=29&v=eFUL4yP0vqo. Grundidee: Thema in Teilthemen gliedern, zu jedem Thema eine Frage formulieren und auf Kärtchen schreiben. Kärtchen im Raum aufhängen. Die TN in Gruppen teilen (weniger, als es Chat-Stationen gibt!) und jeder Gruppe einen Laufzettel geben, auf dem sie die Ergebnisse ihrer Diskussion notieren können. Die Gruppen wandern im Raum herum und diskutieren die Fragen. Wechsel mit Klingelzeichen signalisieren. Danach im Plenum jedes Thema diskutieren.","Kärtchen / Flipcharts","GA > PL","","","","",""],["Zocken","","Kontrolle","","","","","Für die Kontrolle von geschlossenen / halboffenen Übungen (mit eindeutigen Lösungen): Die TN geben ihren Tipp ab, wie viele ihrer Antworten korrekt sind und markieren die Antworten, bei denen sie 100% sicher sind. Nach der Kontrolle bekommen sie für jeden korrekten Satz, den sie markiert haben 200 Punkte, haben sie den Satz nicht korrekt, wird ihnen 100 abgezogen. Gewonnen hat der TN mit den meisten Punkten.","","EA > PL","","","","",""],["Flexagon","","DaF Sprechen","DaF Schreiben","","","","Vorbereitung: S. Anhang. Die TN schreiben dann in die verschiedenen Felder: 4 Verben, 4 Substantive, 4 Bilder, 4 Adjektive, 4 Redewendungen und 4 Adverbien. Danach wird das Blatt gefaltet: das obere zuerst, dann die anderen Seiten im Uhrzeigersinn. Danach wird das Flexagon geöffnet und mit den sichtbaren Wörtern erzählen sie eine Geschichte, bis sie alle Seiten geöffnet haben. https://eltcation.wordpress.com/2016/07/30/crafty-teaching-pocket-study-tool/","A4-Blatt (Buntstifte)","PA / GA","","flexagon.jpg","","",""],["Geheimnisvolle Antworten","","DaF Sprechen","DaF WS","","","","Ein TN denkt sich einen Satz aus (Spruch / Titel / Redewendung / Zitat) und sagt, wie viele Wörter der Satz enthält (Artikel und Substantiv gelten als 1 Wort). Die anderen in der Gruppe dürfen dann so viele (inhaltlich beliebige) Fragen an ihn stellen. Er muss dann die Sätze so beantworten, dass sie - in der Reihenfolge - die Wörter seines Satzes beinhalten. Die Gruppe muss nach den Antworten raten, wie der geheime Satz hieß.","","GA","","","","",""],["Vier Quadrate-Methode","","Präsentation","Input","Transfer","DaF Sprechen","","Die TN falten ein A4-Blatt in 4 Teile. Sie schreiben das Thema des Minivortrags in die Mitte. Sie notieren in den 4 Feldern 1. Einführung, 2-3-4 Gründe, Beispiele und Erklärungen und  dann eine Schlussfolgerung (zurück zu 1..). Sie notieren dann weitere Ideen zu 2-3-4. An der Tafel präsentieren wir einleitende Redemittel für die einzelnen Quadrate. Die TN halten dann ihre Reden in Kleingruppen.","DIN A4-Blatt","GA","","n3.jpg","","",""],["Sternreflexion","","Reflexion","Konzentration","","","","Drei TN stellen sich dicht in einen Kreis zusammen, ihre Schuhspitzen sollen sich berühren. Sie halten sich gegenseitig an der Hand fest, lehnen sich so weit nach hinten, wie es geht und bilden so einen Stern. Sie versuchen, die Sternformation und die Balance zu halten, während sie kurz besprechen, was ihnen im Unterricht / in dem Baustein.. wichtig war.","","GA","","","","",""],["Sechs Punkte","","Transfer","Evaluation","","","Bewegung","Im Raum 6 Punkte mit einem bunten Blatt und mit den Zahlen 1-6 markieren. Jedes Paar bekommt einen Würfel, sie würfeln und gehen dann zu dem Punkt, der der Zahl entspricht und jeder sagt X Sätze zum gerade behandelten Thema. Dann rollen Sie weiter und gehen weiter… Wir können die Aufgabe in jeder Runde variieren: Was mir wichtig war? Fragen, die ich beantwortet bekommen habe... Fragen, die ich noch habe … Was für mich neu war...","Würfel","PA","","","","",""],["Post-it-Stellungnahme","","Diskussion","Gruppendynamik","DaF Sprechen","DaF Schreiben","","Jedes Team bekommt eine These oder eine Frage. Jedes Teammitglied schreibt seine persönliche Meinung (EA) auf einer Post-it Note. Der “Schreiber” in jedem Team sammelt die Post-its, liest sie und führt dann eine kurze Teambesprechung. Das Team schreibt am Ende eine kurze Zusammenfassung der Meinungen, die später mit dem Rest der Klasse geteilt und nacheinander diskutiert werden sollen","Post its, AB","EA > GA > PL","","img_20171106_193324.jpg","","",""],["Vortragskaraoke","","Präsentation","Input","DaF Sprechen","","","Die TN bereiten in Gruppen zu selbst gewählten oder verlosten Theman (sehr allgemeines und gut eingegrenztes Thema oder ein Nonsensthema) Vorträge und wählen 5-10 Bilder zu den Aspekten aus, über die sie sprechen würden. Sie machen daraus eine Power Point-Präsentation. Die Themen werden dann verlost, und die anderen Gruppen bereiten dazu eine Präsentation vor - oder machen einen Stegreifvortrag (letzteres viel mehr Fun, und man kann sich mehr auf die Redemittel konzentrieren, weil es nicht so wichtig ist, dass man etwas Kluges sagt...) Man kann festlegen, wie lange man zu jedem Bild sprechen soll (oder die Gruppen stellen es schon bei der PPP ein, und die PPP läuft automatisch).","Beamer, Laptops","GA","","","","",""],["Wie der Würfel fällt","","Kennen lernen","DaF Sprechen","","","Großgruppen","Die TN lernen sich in Kleingruppen kennen (wir können sie 2-3x neu mischen...). Jede/r würfelt und erzählt je nach der Augenzahl 1-6 Sachen über sich.  Variante: In der Gruppe werden Fragen gestellt - zu der Frage muss jede/r TN je nach Augenzahl 1-6 Infos über sich nennen. Variante: Zu jeder Augenzahl eine Frage zuordnen, z.B. Was ich gern mache / Was ich gut kann / Meine Familie... (Tafel, beamen, Flipchart). Die TN würfeln und erzählen zu der Frage über sich.","1 Würfel / Gruppe","GA","Tische","","","",""],["Würfel-Geschichten","","DaF Schreiben","","","","","Den Eröffnungssatz für eine Geschichte diktieren. Die TN würfeln (gute Schreiber / Fortgeschrittene gern auch mit 2 Würfeln...) und schreiben die Geschichte weiter. Der Würfel entscheidet über die Anzahl der Sätze, die sie schreiben sollen. Dann diktiert man einen weiteren Satz (oder nennt nur ein Wort), die TN würfeln wieder, schreiben wieder 1-6 Sätze, aber sie müssen den Satz in ihre Geschichte einfügen. usw. Am Ende einfach nur würfeln (ohne neuen Satz oder Wort) - und die Geschichte beenden.","mehrere Würfel","EA/PA/GA","","","","",""],["Wörter wiederholen mit einem Würfel","","DaF WS","","","","","Vokabelkartei bereit halten oder zuerst in Gruppen die Wörter der letzten Einheiten auf Zettel schreiben. Für jede Zahl eine Aufgabe ausdenken: 1. Wort zeichnen 2: Wort in einem Satz verwenden 3: Wort umschreiben / definieren 4: Wort buchstabieren 5: Synonym nennen 6. eine Ableitung / ein zusammengesetztes Wort nennen Die TN ziehen reihum von den Wörtern und würfeln eine Aufgabe.","Vokabelkartei oder leere Zettel, 1 Würfel pro Gruppe","GA","","","","",""],["Minibook","","Präsentation","","","","","Ergebnisse werden auf einem A4-Blatt zusammengefasst, auf 8 Miniseiten.","DIN A4-Blatt","EA/PA/GA","","faltanleitung_minibooks.gif","http://www.minibooks.ch/minibooks_schreiben.cfm","",""],["Secret trails","Geheimpfad","DaF WS","","","","Selbstkontrolle","In einem Raster (4x4 / 5x5) wird ein Wort versteckt. Die Definition des Wortes angeben und das Wort im Raster suchen.","AB","EA / PA","","secret-trails.png","","",""],["Zwei Wörter - eine Zahl / Ein Wort - zwei Zahlen","","Kennen lernen","Einstieg","","","Bewegung","Zur Person / zum Thema 2 Wörter und 1 Zahl bzw. 1 Wort und 2 Zahlen auf einem Blatt notieren. Herumgehen, Partner raten lassen, was die Sachen bedeuten.","Kärtchen / Blatt Papier","EA > CP","freier Raum","","","",""],["Overload","","Aktivieren","Konzentration.","","","","4er-Teams bilden. Ein TN stellt sich in die Mitte seines Teams. Der rechte Spieler stellt ihm simple Rechenaufgaben zB „Was ist 2x2, 4+4“ …“ Der linke Spieler stellt ihm Farbfragen zB „Welche Farbe hat das Meer, Schnee, eine  Tomate“ … Ein Spieler steht dem in der Mitte gegenüber und macht unterschiedliche Grimassen und Bewegungen, die er nachmachen muss. Schluss ist, wenn jeder mal dran war.","","GA4","","","","",""],["Bohnen-Übung","","Reflexion","","","","","Ausreichend Bohnen (oder Murmeln etc.) an die TN verteilen, die sie in der rechten Jackentasche verstecken. Die TN bitten, für jedes Erlebnis, für das sie dankbar sind, eine Bohne von rechts nach links wandern zu lassen. Bei der Abschlußreflexion, am Ende des Workshops, kann jeder zeigen, wieviele seiner Bohnen zur Dankbarkeitsbohne geworden sind. Natürlich darf auch jeder darüber erzählen. (https://www.trainer-lounge.net/download/bohnenubung.pdf)","Bohnen","EA","","","","",""],["Ressourcen-Tratsch","","Kennen lernen","Einstieg","Feedback","","","3 oder 4 TN, die sich möglichst nicht kennen setzen sich zusammen; Reihum wird jeweils über eine Person drei Minuten lang positiv ‚getratscht‘. Diese Person sitzt körperlich ein wenig abgewandt zu den anderen beiden, aber nur so viel, dass alle sich gut hören und sehen können.  Die beiden anderen TN phantasieren jetzt darüber: Welche Stärken und positive Eigenschaften die Person haben könnte und Wobei ihr diese besonders zugute kommen könnten Beispiele für Formulierungen: „Ich kann mir vorstellen, dass sie Talent hat für… und gut ist in…“ „Vielleicht kann es auch sein, dass… das kann hilfreich sein für…“ „Ich vermute sie hat eine Begabung für… somit könnte sie…“ Wichtig: Die Person, über die getratscht wird, setzt ein Pokerface auf und gibt keine Signale oder Kommentare ab über das, was gesagt wird.  Anschließend gibts eine Vorstellungsrunde inkl. Reflexion im Plenum: Wer bin ich (wirklich)? Wie hab ich mich dabei gefühlt, diese Anerkennung zu bekommen? Natürlich könnt ihr diese Methode auch mit Teilnehmern einsetzen, die sich bereits kennen. Dann einfach die Fragen anpassen. ZB statt „Ich kann mir vorstellen, dass…“ in „Was ich an ihr schätze ist…“","","GA","","","","",""],["Lebensweg","Path of life","Kennen lernen","","","","","Schritt 1:  ca. 30 - 45 Minuten Jeder TN schnappt sich ein Flipchartpapier und Stifte und bekommt folgende Aufgabe: Zeichne deinen Lebensweg mit Brücken, Bergen, Diagrammen etc. Mach alle Stationen in deinem Leben sichtbar, die für dich  relevant waren. Im positiven, wie im negativen Sinne. Nimm wichtige Personen, Ereignisse, Muster, Phasen, Übergänge usw. mit auf. Starte bei deiner Geburt . Es m
