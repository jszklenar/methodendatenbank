n. Alle TN werden gebeten ein Namensschild vor sich aufzustellen. Jeder bekommt ein vorgefertigtes Arbeitsblatt, auf dem er den Auftrag erhält über die drei ihm unbekannte TN Aussagen zu treffen (Was ist ihr/ sein Lieblingsessen Wie wohnt die Person? Welche Hobbies hat die Person? ...). In einem zweiten Schritt wird jeder TN gebeten, seine getroffene Aussage schriftlich zu begründen. Nun geben alle TN nacheinander ihre Vermutungen preis. Jede Person wird einzeln besprochen und trifft im Anschluss an alle geäußerten Vermutungen die Aussagen, die wirklich auf sie/ ihn zutreffen.","AB, Namensschilder","GA4","Gruppentische","","","",""],["Lieblingszahl","","Kennen lernen","DaF Sprechen","","","","Jeder TN bekommt einen Zettel, auf dem er seine Lieblingszahl notiert (aus Zeitgründen empfiehlt es sich einen Zahlenbereich vorzugeben: z.B. 1-10). Anschließend legt jeder seinen Zettel gut sichtbar vor sich auf den Boden. Der erste beginnt. Jeder muss jetzt reihum seiner Zahl entsprechend viele Dinge über sich erzählen (Name, Alter, Hobbies, Schule, ...) -> z.B. bei einer 5, 5 Eigenschaften.","Zettel","GA5-6 / PL","","","","",""],["Name, Lieblingsessen, Lieblingsfarbe","","Kennen lernen","Namen lernen","Aktivieren","DaF WS","","Die TN stehen im Kreis; jeder TN wirft jemandem den Ball und nennt seinen Namen. Der Ball darf (wie beim schnellen Ball) bei jedem nur einmal gewesen sein. Die Runde dann noch einmal machen, in der gleichen Reihenfolge. In der nächsten Runde nennt jeder Werfende sein Lieblingsessen; dies muss sich derjenige, von dem der Ball kam, merken und es in der nächsten Runde nennen (statt den Namen zu nennen). Mehrere Runden machbar - mit anderen Infos.","Ball","PL","Stehkreis","","","",""],["Reflexion in 2x15 Sekunden","","Reflexion","","","","","„Ich zähle jetzt die Gruppe ab in 1 und 2. Dann erzählen die 1er den 2ern 15 Sek. lang, die wichtigste Sache, die Sie bisher hier gelernt haben. 2er, Sie haben 15 Sek. Zeit, den 1ern zu erzählen, wie Sie diese Erkenntnisse in der Praxis anwenden.“","","PA","","","","",""],["Textfetzen reinflechten","","Präsentation","DaF Sprechen","Kooperation","Konzentration","","Verteilen Sie den TN unterschiedliche Textfetzen. Beginnen Sie mit Ihrem Kurzvortrag. Die TN sollen sich zu Wort melden, wenn Sie der Meinung sind, dass ihr Textfetzen in diesem Moment zum Thema passt und warum.","Textfetzen","FA","","","","",""],["Aufspringen","","Reflexion","Feedback","Transfer","","","\"Aufspringen heißt, dass ein TN aus dem Stuhl springt und den interessantesten Punkt nennt, den er heute gelernt hat. Vor unserer Pause brauchen wir jetzt insgesamt 20 'Aufspringer' in den nächsten 60 Sekunden. Die Zeit beginnt jetzt!\"","","PL","","","","",""],["Sätze beenden","","Einstieg","Aktivieren","DaF SP","Gruppendynamik","Bewegung","Jeder bekommt einen Zettel mit einem Satzanfang. Alle laufen mit Musik im Raum umher. Musik stoppt, jeder schnappt sich einen Partner und zeigt den Satz her. Der Partner muss den Satz beenden. Danach beendet der andere den Satz des Partners. Und die Zettel tauschen.","Zettel","CP","","","","",""],["Appel und Ei","","Gruppendynamik","Kommunikation","","","Bewegung, Strategie","Die TN/Gruppen erhalten einen Apfel und ein Ei. Diese sind im Verlauf des Stadtspiels gegen etwas Beliebiges einzutauschen. Wobei auch die getauschten Dinge wieder eingetauscht werden können. Wer im Ziel/am Ende das wertvollste/größte/ausgefallenste Ding getauscht hat, gewinnt. (Alle Tauschgeschäfte müssen dokumentiert werden!) Wer mit dem Ei und dem Apfel wieder im Ziel eintrudelt geht natürlich leer aus.  Variante: Die TN müssen das Ei gekocht zurückbringen.","pro Gruppe ein Apfel und ein rohes Ei und eine Liste","GA","in der Stadt","","","",""],["Bewegungen würfeln","","Aktivieren","","","","Bewegung","Man nehme einen möglichst großen Würfel, damit man die Augenzahl von jedem Platz aus sehen kann. Dann verabredet man für jede Augenzahl eine bestimmte Handlung, Aktion und Ruf/Schrei. Grundmuster: Augenzahl Standard-Handlung Standard-Ruf Handlung(Variation 1) Ruf(Variation 1) Augenzahl 1: rechtes Bein hoch Ohhhhh wie ein Trecker durch den Raum laufen brummmm Augenzahl 2: linkes Bein hoch Ahhhhh wie eine Kuh bewegen Muh Augenzahl 3: rechter Arm hoch Ihhhhh wie ein Flugzeug eschujjuuu Augenzahl 4: linker Arm hoch Ehhhhh wie ein Schwimmer platsch Augenzahl 5: alle Arme und Beine hoch, Jipieheijipedeohua wie ein Greis stöhnen Augenzahl 6: einmal um sich selber drehen Uhuhuhu Huuu (wie Indianer) wie ein Astronaut in der Schwerelosigkeit Das Spiel lässt sich am besten im Sand spielen, dann tut eventuelles Hinfallen nicht weh und das Rumalbern fällt leichter. Der Kreativität keine Grenzen gesetzt.","Schaumwürfel (groß)","PL","freier Raum / im Freien","","","",""],["Kreisrücken","","Aktivieren","Kennen lernen","DaF Sprechen","","","Die Gruppe setzt sich im (Stuhl)Kreis. Der SL ruft verschiedene Eigenschaften in die Runde. Dabei dürfen immer nur diejenigen Weiterrücken, auf die diese Eigenschaft zutrifft. (z.B. rote Socken, schwarze Hose, Turnschuhe, blaue Augen usw.). Dabei kommt es vor, dass zwei oder mehr TN übereinander sitzen. Allerdings darf immer nur derjenige weiterrücken, der ganz oben auf dem Stapel sitzt. Das Spiel ist zu Ende, wenn der erste wieder auf seinem Platz sitzt, egal in welcher Höhe.","","PL","Stuhlkreis","","","",""],["Schweizer Grenze","","Wahrnehmung","DaF WS","","","Rätsel","Spielleiter fängt an: \"Ich habe einen Sack voll XXUhrenXX, komme an die Schweizer Grenze - und darf passieren\". Reihum spricht nun jeder im Spielkreis diesen Satz mit Variationen nach, doch zum großen Erstaunen kommen die meisten nicht über die Grenze. (Das Erkennungszeichen z.B. die übereinander geschlagenen Beine des Spielleiters - nur wer seine Beine auch übereinander geschlagen hatte, konnte die Grenze passieren.) Wer eine Idee hat, geht zum Spielleiter und flüstert ihm seine Lösung ins Ohr...","","Sitzkreis","","","","",""],["Salatschleuder","","Kennen lernen","Namen lernen","","","","Zum Wiederholen der Namen: Die TN sitzen im Kreis. Einer steht in der Mitte und sucht sich jemanden aus der zwei Mitspieler beim Namen nennt. Diese zwei müssen ihre Plätze tauschen. Nun versucht der Spieler aus der Mitte einem von den zweien den Platz abzunehmen indem er schnell die beim Tausch entstehende Lücke besetzt. Wer in der Mitte bleibt beginnt eine neue Runde.","","PL","Sitzkreis, ein Stuhl weniger als TN","","","",""],["Kleines-großes Stretching","","Aktivieren","Konzentration","","","Bewegung","Die Gruppe steht in einem Kreis. Einer fängt mit einer \"kleinen\" Bewegung an (z.B.: Däumchendrehen) die alle wiederholen. Der nächste macht eine \"große\" Bewegung (z.B.: Kniebeugen) die wieder alle nachahmen. In der Reihenfolge geht’s dann weiter im Kreis bis alle gut aufgewärmt sind.","","PL","Stehkreis","","","",""],["Scream","","Wahrnehmung","Aktivieren","Gruppendynamik","","","Abreagieren mit einem Wahrnehmungsspiel. Die Gruppe steht im Kreis und schaut zu Boden. Beim Signal des SL gucken alle jemanden an, den sie sich vorher überlegt haben. Wenn sich zwei Blicke treffen, gehen beide Spieler mit einem \"Aaargh\" möglichst theatralisch zu Boden. Danach kann mit dem Rest eine neue Runde beginnen.","","PL","Stehkreis","","","",""],["Stadt-Land-Fluss ohne Papier","","Aktivieren","Wiederholung","DaF WS","","Wettbewerb","Der SL stellt sich in die Mitte des Kreises und gibt eine Kategorie und einen Anfagsbuchstaben vor, z.B. \"Beruf mit K\". Schnell wirft er einen Ball zu einem Spieler. Der muss nun schnell ein Wort sagen, das zu der vom Spielleiter gesagter Kategorie passt. Er wirft dann den Ball weiter - mit einem neuen Buchstaben (und evtl. auch mit einer neuen Kategorie). Vorher Kategorien vereinbaren - oder die Spieler können im Laufe des Spiels selbst Kategorien ausdenken.","Ball","PL","Stehkreis","","","",""],["Pfeil-Chaos","","Aktivieren","Wahrnehmung","Konzentration","","","Es gibt bei dem Spiel mehrere Abschnitte die nach und nach immer schwerer werden.  1: Der SL hält einen Pfeil aus Pappe in verschiedene Richtungen und die anderen müssen mit ihren Armen in die selbe Richtung zeigen.  2: Alle nennen die Richtung in die der Pfeil gezeigt wird.  3: Alle nennen und zeigen die Pfeilrichtungen.  4: Die Richtungen nennen, aber mit den Armen in die entgegegesetzten Richtungen zeigen.  5: Das Gegenteil sagen aber die richtige Richtung zeigen.","Pfeil aus Pappe","PL","Stehkreis","","","",""],["Spürnase","","Wahrnehmung","DaF Sprechen","Gruppendynamik","","","Zwei TN stehen sich gegenüber und beobachten sich eine Weile. Dann drehen sie sich um und verändern drei Teile an sich. Wenn sie wieder zueinander stehen, sollen sie sich gegenseitig die Veränderungen benennen.","","PA","","","","",""],["Halli hallo","","Aktivieren","Einstieg","DaF WS","","","Alle stehen in einer Reihe. Der Werfer steht etwas abseits und denkt sich z.B. ein Tier aus. Er verrät nur den 1. Buchstaben und wirft jetzt einen Ball dem ersten in der Reihe zu. Der versucht das Tier zu erraten und wirft dabei den Ball zurück. Rät er falsch, bekommt der nächste in der Reihe den Ball, bis das Tier erraten wird. Dann muss der Ball gefangen werden, wobei der Werfer sehr hoch wirft. Solange wie der Ball in der Luft ist, kann der Werfer weglaufen. Dann ruft der Fänger Stopp und darf noch 2 Schritte auf den Werfer zugehen. Jetzt muss er ihn mit dem Ball abticken. Gelingt das, ist er selbst Werfer.","Ball","PL","Reihe","","","",""],["Vier Ecken - schneller","","Kennen lernen","Aktivieren","DaF HV","","","Es wird eine Frage/ eine Aussage vorgelesen und jeder Ecke wird eine andere Antwort zugeordnet (mit der Hand zeigen). Die TN stellen sich dann in die Ecke ihrer Wahl, begrüßen dort die anderen und stellen sich vor. Ein paar Beispiele für Fragen und Antworten:  Wann hast du Geburtstag? (im Frühling, Sommer, Herbst,Winter)  Was ist dein Lieblingsessen? (Pizza, Suppe, Pommes, Schokolade)   Was trinkst du am liebsten? (Cola, Bier, Wasser, Milch)   Was machst du sehr gerne? (Sport, Mathematik, Musik, nichts)  Warst du schon in Deutschland? (dies ist mein erstes Mal, schon Mal, schon oft, regelmäßig) Mit welchem Buchstaben fängt dein Vorname an? (A-F, G-K, L-Q, R-Z) Welche Musik hörst du gern? (Klassik, Pop, Rock, HeavyMetal) Wer will, das du hier bist? (meine Eltern, meine Lehrer, ich, meine Freunde)  Wie viele neue Wörter möchtest du jeden Tag lernen? (50, 100, 200, 10)","keine","PL","Ecken frei zugänglich","","","",""],["Wendediktat","","DaF Rechtschreibung","DaF LV","Einstieg","","","Auf einer Karte ist ein Text, die Sätze sind nummeriert. Der L liest einen Satz, dreht die Karte um und schreibt den Satz. Beim Schreiben markiert er evtl. die Stelle, bei der er unsicher ist. Karte umdrehen - kontrollieren... weiter...","AB / Kärtchen","","","wende2.jpg","","",""],["Kopfgewusel","","Wahrnehmung","DaF WS","","","","Die TN schauen sich das Bild an, decken es ab und entscheiden dann, welches Wort nicht zum Bild passt und welches Wort fehlt.","AB Bild - Wörter an der Tafel / gebeamt oder AB mit Wörtern und einem Bild","EA / PA","","kopfgewusel5.jpg","","",""],["Gitter-Kim","","Wahrnehmung","DaF WS","Aktivieren","Einstieg","","Die L studieren die Karte für 20-30 Sec. Sie drehen es um und malen das Gitter in ihrem Heft ab - statt Bilder tragen sie die Wörter ein.","AB, Stoppuhr","EA","","wahrnehmungstraining_mit_gittern.jpg","","",""],["Vokabel-Kombi","","DaF WS","DaF GR","DaF Sprechen","","","Für zwei oder mehr Spieler: Der Spielleiter schreibt elf Substantive und acht Verben auf Karten. Sie werden in einem Kreis ausgebreitet – außen die Substantive, innen die Verben. Zwei Spielfiguren werden auf je eine Karte im Außen- und Innenkreis gesetzt. Der erste Spieler würfelt und zieht die Spielfiguren jeweils um die Augenzahl weiter. Der Spieler muss nun einen Satz mit den Wörtern bilden. Dabei bestimmt die gewürfelte Augenzahl die Person, in der das Verb steht (Zahl Eins: 1. Person Singular, Zwei: 2. Person Singular, ..., Sechs: 3. Person Plural). Die Zeit, in der das Verb steht, wird vorher vom Spielleiter festgelegt. Weiß ein Spieler keinen Satz, helfen die Mitspieler.","Karten","PA/GA","","","","",""],["Päckchen ausliefern","","DaF Schreiben","DaF LV","DaF HV","Aktivieren","Bewegung","Alle TN schreiben Anweisungen auf Zettel, die in einem Pappkarton gesammelt werden. Der KL macht die Musik an, und solange Musik lauft, geben die TN den Karton mit den Worten \"Päckchen weitergeben\" weiter. Sobald die Musik stoppt, zieht der TN, bei dem der Karton angekommen ist, einen Zettel und liest die Aufgabe vor - alle (oder nur der TN) müssen die Anweisung ausführen.","Pappkarton, Zettel, Musik","PL","freier Raum","","","",""],["Flying papers","","Erfahrung","DaF Sprechen","Gruppendynamik","","Bewegung","In der Raummitte liegen doppelt so viele A4-Blätter wie TN. Auf jedem Blatt steht eine Frage zum Thema. Jeder TN nimmt sich ein Blatt, das ihn besonders interessiert. Alle laufen durcheinander, jedes Paar, das sich begegnet, stellt sich gegenseitig eine Frage. Wenn ein TN genügend Antworten erhalten hat, sucht er sich eine neue Frage.","Fragen auf A4-Blättern","CP","freier Raum","","","",""],["Aussagen und Erfahrungen","","Erfahrung","","","","","Zu einem Thema werden Aussagen / Erkenntnisse kurz präsentiert. Die Aufgabe an die TN ist, diese eher abstrakten Formulierungen mit eigenen Beispielen aus ihrer Praxis zu belegen und lebendig werden zu lassen. Dies geschieht am besten im Plenum.","Karten","PL","","","","",""],["Domino mit Fragen und Antworten","","Input","Wiederholung","","","","Statt Punkten – wie bei Original-Dominosteinen – gibt es hier Fragen und Antworten. Auf der rechten Kartenseite steht eine Frage, auf der linken Seite eine Antwort. Die Aufgabe besteht darin, die richtige Antwort zur letzt-gestellten Frage zu legen. Damit ein Domino etwas interessanter wird, können neben reinen Wissensfragen auch andere Fragen eingebaut werden, bei denen es um Meinungen geht oder um Erlebnisse. Zusätzlich können Aktionsaufgaben auf der Rückseite stehen, die derjenige erfüllen muss, der die entsprechende Karte gezogen hat. Das können einfache Aktionen zur Belustigung oder zum Wachmachen sein, sie können auch im Zusammenhang mit dem Thema stehen.","große Dominokarten (DIN A3)","PL (oder Teilgruppen)","freier Raum","","","",""],["Oma Löwe Samurai","","Aktivieren","","","","","Oma Löwe Samurai  Es werden zwei Teams gebildet. Die knobeln gegeneinander, wobei sich ein Team immer gemeinsam auf ein Symbol einigen muss.  Es gibt: Löwe (Hände zu Krallen geformt, ein Schritt nach vorne, Löwengebrüll) Samurai (schlägt mit Schwert zu und macht „Ha“) Oma (erhobener Zeigefinger, tippelt nach vorne, macht „Dudududu“)  Die Regeln sind: Löwe frisst Oma Samurai schlägt Löwe Kopf entzwei Oma schimpft Samurai  Anschließend spielen beide Teams z.B. 5 Runden gegeneinander.","","PL","","","","",""],["Das ist mein Knie","","Aktivieren","DaF WS","","","","Alle TN stehen im Kreis. SL beginnt. „Dies ist mein Knie“ und zeigt auf seinen Ellenbogen. Nächster TN im Kreis sagt „Dies ist mein Ellenbogen“ und zeigt auf ein anderes Körperteil. Nächster TN im Kreis benennt das vorher gezeigte Körperteil und zeigt auf ein anderes. Usw. Dies zwei Runden lang spielen.","","PL","Stehkreis","","","",""],["Die Leipziger Messe","","Aktivieren","DaF WS","","","","Alle sitzen im Kreis, ich beginne und sage zu meinem linken Nachbarn Ich: „Ich war gestern auf der Leipziger Messe.“ B: „Und, hast du mir was mitgebracht?” Ich: „Ja, eine Säge“ – und mache dazu eine Sägebewegung mit dem rechten Arm- den ich vor und zurück bewege. Das behalte ich nun die ganze Zeit bei. B wendet sich an seinen linken Nachbarn C: B: „Ich war gestern auf der Leipziger Messe.“ C: „Und, hast du mir was mitgebracht?“ B: „Ja, eine Säge“ – und macht die Sägebewegung mit dem rechten Arm usw. Es pflanzt sich also durch die ganze Runde fort, bis alle sägen und der letzte wieder bei mir landet. 2. Runde Ich sage dann zu B: „Ich war gestern wieder auf der Leipziger Messe.“ B: „Und, hast du mir wieder was mitgebracht?“ Ich: „Ja, einen Fächer“ – und mache fächelnde Bewegungen mit der linken Hand. Das in Kombination mit dem rechten sägenden Arm wird schon schwierig und sieht ungeheuer komisch bis dämlich aus (was dabei rauskommt). Es geht wieder den ganzen Kreis herum. 3. Runde  „Eine Nähmaschine“ – dazu Bewegungen mit dem rechten Bein, als ob man auf den Fuß einer alten Nähmaschine tritt. 4. Runde „Einen Schaukelstuhl“ – mit dem ganzen Oberköper gleichzeitig vor und zurück schaukeln. Inzwischen sind alle schon völlig fertig vor Anstrengung und vor Lachen… 5. und letzte Runde „Einen Papagei“ – der die ganze Zeit mir krächzender Stimme „Lore, Lore“ ruft.","","PL","Sitzkreis","","","",""],["Walnusswandern","","Aktivieren","Kooperation","Konzentration","","","Alle TN stehen eng im Kreis, jeder hat eine Walnuss in der rechten Faust. Sie zeigt nach unten. Die leere linke flache Hand zeigt nach oben und wird direkt unter die rechte Walnusshand des linken Nachbarn gehalten. Der Trainer (T) sagt „parallel“ und die Walnuss wird übergeben. Die Hände werden dann überkreuz genommen und dabei gedreht. Die jetzt gefüllte linke Faust befindet sich über der leeren rechten Hand des rechten Nachbarn, die leere rechte Hand befindet sich unter der gefüllten linken Faust des linken Nachbarn. Der T sagt „überkreuz“ und die Walnuss wird übergeben. Die Arme gehen in die parallele Ausgangsstellung zurück und das Ganze wiederholt sich.","eine Walnuss für jeden TN","PL","Steh- oder Sitzkreis.","","https://www.youtube.com/watch?v=rZGImkbBkYI","",""],["Huhn oder Ei?","","Aktivieren","Konzentration","","","","TN sitzen im Kreis.  SL gibt Ei (z.B. Koosh-Ball) nach rechts mit den Worten: „Dies ist ein Ei“. TN gibt es wieder zurück: „Was ist das?“. Trainer gibt es wieder: „Dies ist ein Ei“. TN gibt es an den rechten Nachbarn: „Dies ist ein Ei“. Der fragt zurück und gibt Ei zurück „Was ist das?“. TN gibt an linken TN „Was ist das?“, Zurück an SL „Was ist das?“. SL (=“Hüter der Weisheit“) gibt Ei wieder nach rechts. „Dies ist ein Ei“ usw.  Gleiches Prinzip auf der linken Seite „Dies ist ein Huhn“.  Nachdem alle das Prinzip verstanden haben, schickt der SL Huhn und Ei ins Rennen. Was wird zuerst da sein?","2 Bälle","PL","Sitzkreis","","","",""],["Familie Meier","","Aktivieren","Gruppen bilden","","","Bewegung","Kärtchen austeilen mit mehreren ähnlichen Familiennamen (Meier, Seier, Leier, Geier - oder bekannte Namen). In jeder Familie gibt es jeweils Sohn, Tochter, Vater, Mutter.  In der ersten Phase (durch Musik begleitet) laufen alle durcheinander und tauschen ihre Kärtchen aus. Sobald die Musik aufhört, sollen sich alle Familien so schnell wie möglich finden, allerdings mit folgender Regel: nur durch lautes Rufen des eigenen Nachnamens. Sobald sich die Familien gefunden haben, gilt es sich in der richtigen Reihenfolge aufzustellen, z.B. Tochter-Sohn-Mutter-Vater. Wer am Schnellsten ist, gewinnt.","Visitenkarten, Musik","PL","freier Raum mit jeweils 1 Stuhl für jede Familie","","","",""],["Besuch im Zoo","","Aktivieren","Konzentration","","","","Die Rollen:  Bären: \"Tanzen, wir wollen tanzen, das macht mich soo dschubbi dubbi duaa, chachacha\" (mit Hüften schwingen und angewinkelten Armen) Perlhühner: \"Gock, gock, gook – gock, gock, gook\" (Hände in Brusthöhe vor sich halten, Handflächen nach unten, im Rhythmus nach oben bewegen) Schlangen: \"Hoch, die vielen Leute, hoch, was woll’n die heute,\" (Hände vor der Mund schlagen) \"husch, husch, geht doch alle fort von mir\" (mit Handbewegung wegscheuchen) Kinder: \"Wir wollen Eis und Pommes Frites\" (stampfend gehen mit angewinkelten Armen)  Alle stehen im Kreis und nacheinander werden erst einmal die verschiedenen Tiere und Kinder vorgestellt und eingeübt. Dann teilen sich die TN in vier Gruppen auf, ordnen sich den Bären, Schlangen etc. zu, je nachdem, was ihnen am besten gefällt. Die Gruppen sollten allerdings in etwa gleich groß sein, vor allem nicht zu viele Kinder, da diese sehr laut sind und sonst die anderen übertönen. Der SL gibt wie ein Dirigent den jeweiligen Einsatz: erst die Bären, dann in der zweiten Runde die Perlhühner, dann die Schlangen und zuletzt die Kinder. Wenn dann alle ihre Sprüche im Rhythmus sagen, gehen auf ein Zeichen alle kreuz und quer durch den Raum. Die Konzentrationsleistung besteht darin, bei seiner Rolle zu bleiben und vor allem im richtigen Rhythmus. Nach einer Weile schlägt der SL auf einen Gong und alle gehen in ihre Ecken zurück, immer noch ihre Rolle beibehaltend. Dann bringt der „Dirigent“ zuerst die Kinder zum Verstummen, dann die Schlangen, dann Perlhühner und zuletzt die Bären, also in umgekehrter Reihenfolge.","Gong / Trillerpfeife","PL","freier Raum","","","",""],["Sachen suchen","","Aktivieren","Einstieg","","","","Schicken Sie Ihre Leute, nach Pippi-Langstrumpf-Art als \"Sachensucher\" auf die Straße und lassen Sie diese Requisiten passend zum Thema finden. Jeder \"Fund\" wird vorgestellt, in Beziehung zum Thema gesetzt und gegebenenfalls weiterverarbeitet.","","PA/GA","","","","",""],["Letzte Seite","s.a. Markierte AB","Gruppenbildung","","","","","Verschiedenfarbige Punkte auf die letzte Seite des Materials kleben und verteilen. Gleiche Farben ergeben dann die Paare/Gruppen.","Klebepunkte / bunte Marker","","","","","",""],["Summen","","Gruppenbildung","","","","Bewegung","Zettel mit Liedanfängen vorbereiten, auf ein Zeichen gehen die TN los, summen ihr Lied und finden ihre Gruppenmitglieder. Wenn sie sich gefunden haben, gehen sie nicht zusammen weiter, sondern merken sich, wer zu ihnen gehört. Nach einem Signal finden sich alle als Gruppe zusammen.","Zettel","CP","","","","",""],["Sprachschatten","","DaF Phonetik","DaF GR","","","","Sprachschatten ist eine kontextualisierte Drillübung, bei der TN 2 die Aussagen des TN1 wiederholt, als Frage, ergänzt mit gambits.. usw.","AB","PA","","gambi01.JPG","","",""],["Glasorakel","s.a. Stuhloraker","Gruppenbildung","","","","","Wie Stuhlorakel - Kärtchen / Wörter / Farbpunkte am Glas unten (beim Trinken erst sichtbar.","Kärtchen, Kleber, Klebepunkte","","","","","",""],["Römisches Feedback","Daumenprobe","Feedback","","","","","Tagesfeedback / Feedback am Ende einer Arbeitsphase: TN stehen/sitzen im Kreis, und zeigen alle zusammen ihren Daumen - hoch, nach unten, in die Mitte und kommentieren ihre Entscheidung.","","PL","Steh oder Sitzkreis.","","","",""],["Staffellauf","","Wiederholung","Transfer","","","Wettbewerb, Bewegung","An der Pinnwand die möglichen Kategorien auf eine Suchfrage vorbereiten (Z.B. Sozialformen von EA bis PL...). Die Pinnwände stehen seitlich, so dass immer nur die Person, die an der Pinnwand ist, das Ergebnis sehen kann. Auf einem Tisch Kärtchen vorbereiten, die zu diesen Kategorien sortiert werden sollen (z.B. Aktivitäten und mögliche Arbeitsformen). Jede Gruppe bekommt eine Pinnwand, die TN stellen sich hintereinander auf. Der erste aus jeder Gruppe nimmt eine Karte, läuft zur Pinnwand und ordnet die Karte zu, läuft zurück, klatscht den nächsten in seiner Gruppe an... usw. Wenn jemand der Meinung ist, etwas hängt falsch, darf er pro Runde noch eine Karte umpinnen. Gewonnen hat die Gruppe mit den meisten richtig zugeordneten Karten.","Kärtchen, Pinnwände","GA","freier Raum","","","",""],["Wettermassage","","Wahrnehmung","Entspannung","","","","Die TN stehen im Kreis, jeder bearbeitet den Rücken des Vordermanns. Der Spielleiter erzählt eine kleine Story. \"Die Sonne scheint dir warm auf deinen Rücken.\" Die Hände legst du flach auf den Rücken und lässt deine Wärme auf den Partner übergehen. \"Ein leichter Wind kommt auf.\" Deine Hände streichen zart und langsam über Rücken und Schultern. \"Der Wind frischt auf und treibt Wolken heran!\" Deine Bewegungen werden schneller und stärker. \"Es beginnt zu blitzen... .\" Du zeichnst mit einem Finger Blitze auf den Rücken. \"... und zu donnern.\" Mit der Handkante sanft klopfen. \"Der Regen prasselt herab.\" Mit deinen Fingerspitzen trommeln. \"Der Wind treibt die Wolken auseinander.\" Die Hände streichen vom Rückgrat nach außen. \"Der Regen hört auf.\" Nur noch langsam mit einzelnen Fingern klopfen. \"Die Sonne kommt wieder hervor und wärmt dich wieder auf.\" Mit deinen flachen Händen fest und immer langsamer werdend über den Rücken und die Schultern streicheln. \"Ein Regenbogen ist zu sehen.\" Du nimmst den Partner in die Arme","","PL","Stehkreis","","","",""],["Nordpol-Südpol","Meinungs-Äquator","Erfahrung","","","","Bewegung","Der KL stellt Fragen, die TN bewegen sich zwischen zwei Polen (die Bedeutung von Nord-Süd wird bei jedem Item genannt).","eine Linie auf dem Boden - Tesakrepp","PL","freier Raum","","","",""],["Hüpftest","","Kontrolle","Wiederholung","","","Bewegung","TN stehen im Kreis / stehen hintereinander in einer Schlange. Der KL stellt Fragen, die mit ja/nein beantwortet werden können und die TN hüpfen in den Kreis rein oder raus oder bei einer Schlange nach rechts oder nach links. (Funktioniert auch mit stimmt / stimmt nicht , richtig / falsch, kenne ich / kenne ich nicht).","","PL","Stehkreis oder Schlange","","","",""],["Wetterfrosch","","Feedback","","","","","Nach einer Arbeitsphase, schnelles Feedback zu pers. Wohlbefinden, mit Kurzkommentaren. Wie ist das \"Wetter\" in euch? Drei Positionen bestimmen: Gutes Wetter = auf den Stuhl steigen, halbwegs gut = aufstehen, schlecht = sitzen bleiben.","","PL","Sitzkreis","","","",""],["Pinoy-Spiel","","Wiederholung","","","","Wettbewerb","Von Jover und Ronna: Mehrere Mannschaften spielen gegeneinander. Ziel ist, innerhalb von X Minuten möglichst viele Begriffe zu erraten. Der erste Spieler bekommt eine Karte auf die Stirn, stellt ja-nein Fragen, seine Mannschaft darf antworten. Es gibt nur einen Rateversuch, passen ist möglich. Wenn er gepasst hat oder das Wort erraten hat, ist der nächste Spieler dran.","Post-its","PL","","","","",""],["Tresen-Gespräche","","Erfahrung","Präsentation","","","","wie Speed-Dating, mit Tisch dazwischen.","langer Tisch","PA","","","","",""],["Plakat vollpacken","","Präsentation","Input","","","","Input als Systematisierung (bekanntes Thema): Das Gerüst des Plakats legen / vorstellen und einige Items zu bestimmten Teilen sortieren. Weitere Items in Gruppen geben, sie entscheiden, wo man sie einordnen kann und präsentieren ihre Lösung.","Plakat, Kärtchen","PL --> GA --> PL","","Tag_11_Routinen_und_Rituale.JPG","","",""],["Fliegenklatsche","","Wiederholung","Kontrolle","","","Wettbewerb","Items an der Tafel / Pinnwand vorbereiten (oder den Methodenteppich nutzen). TN beraten sich vorher in Gruppen und klären die Bedeutung der Items. Dann nominiert jede Gruppe einen Vertreter, der sich mit dem Rücken zur Tafel / Pinnwand / Methodenteppich sitzt. Der KL klatscht mit einer Fliegenklatsche einzelne Items ab, die TN erklären den Begriff / die Methode, die TN auf den Stühlen raten. Wer zuerst das gesuchte Item nennt, bekommt einen Punkt.","Fliegenklatsche, 3-4 Stühle, Tafel / Pinnwand / Methodenteppich","GA --> PL","","Tag_11_FLiegenklatsche.jpg","","Wörter auf Jamboard (Text, Post-its oder eine Wortwolke oder ähnliches als Hintergrund hochladen). TN schreiben sich Namens-Post-its. L oder ein TN nennt ein Wort, wer zuerst seinen Namen daraufzieht, darf das Wort erklären.",""],["Am laufenden Band","","Wiederholung","Einstieg","","","Selbstkontrolle","Aufgaben auf einem langen Flur auslegen. Die Aufgaben sind nummeriert. Die Gruppen bekommen EIN Lösungsblatt, sie sollen gemeinsam alle Lösungen finden - die Zeit ist wichtig, wenn eine Gruppe fertig ist und sein Lösungsblatt abgibt, müssen alle Gruppen aufhören.","Aufgabenkärtchen, 1 Lösungsblatt pro Gruppe","GA","langer Flur / auf dem Hof","","","",""],["1, 2 oder 3?","","Wiederholung","Einstieg","Erfahrung","","Wettbewerb","Der KL nennt Items / stellt Fragen, die zu drei Kategorien zugeordnet werden können . (Z.B. Aufgaben für vor-während-nach bei Hören/Lesen). Drei Pinnwände stehen für die 3 Antworten. Die TN positionieren sich vor der Pinnwand, wenn alle sich entschieden haben, geht der zweite KL hinter den Pinnwänden zu der passenden Pinnwand und hebt die Hand. (\"Licht\")","Pinnwände","PL","","","","",""],["Punkte vergeben","","Kontrolle","","","","","Strichliste an der Tafel führen oder verschiedene kleine Sachen verteilen (schneller), die am Ende gezählt werden","Tafel, Bonbons, Wäscheklammer, Puzzleteile","","","","","",""],["Hannes aus der Knopffabrik","","Aktivieren","Konzentration","","","","https://www.youtube.com/watch?v=aP6kLNso9ls","","PL","Stehkreis","hannes_aus_der_Knopffabrik.PDF","","",""],["Sternformation","","Konzentration","Gruppendynamik","","","","s. Jurte","","","","","","",""],["Loop","","Kooperation","Aktivieren","Aktivieren","","","Die TN stehen im Kreis und fassen sich bei der Hand und üben zuerst, wie sie mit ihren Armen eine Welle machen können. Dann einen langen Schal zusammenbinden / einen Hullahoopring benutzen: Den Kreis an einer Stelle öffnen, den Schal / den Ring an einen Spieler hängen und den Kreis wieder schließen. Der Schal muss im Kreis wandern, weitergegeben werden, so dass jeder durchsteigt.","Schal / Hullahoopring","PL","Stehkreis","","","",""],["Vertrauenskreis","","Vertrauen","Kooperation","Gruppendynamik","","","Die TN (7-8) stehen im engen Kreis und halten die Hände offen vor sich, einer steht in der Mitte, kreuzt die Arme, schließt die Augen, und lässt sich nach vorne / hinten / in die Seite fallen, bzw. von den andern sanft in verschiedene Richtungen schubsen.","","GA","Stehkreis","","","",""],["Wo ist mein....?","X","Gruppendynamik","","","","","","","","","","","",""],["Puzzleplakat","","Präsentation","Input","Visualisierung","","","Plakat in Teile zerschneiden und beim Vortrag / nach einzelnen Simulationsteilen nacheinander an der Tafel (mit Magneten) / an der Pinnwand oder auf dem Boden entwickeln.","Plakatteile (größer)","PL","","Tag_13_Angelina_K_rper.jpg","","",""],["Meine mutige Geste","","Präsentation","Kennen lernen","","","","TN stehen im Kreis und stellen sich mit dem Vornamen und einer Geste vor, die anderen machen es nach. In jeder Runde soll die Geste mutiger werden (breiter, lauter, frecher...)","","PL","Stehkreis","","","",""],["Rechts-links-mitte - klatschen","","Aktivieren","Konzentration","","","Bewegung","TN stehen einander gegenüber und heben den Daumen beider Hände. Sie klatschen auf die Oberschenkel und zeigen mit den Daumen in die Mitte / nach rechts oder nach links. Zeigen sie beide in die gleiche Richtung, müssen sie klatschen. Immer schneller !!","","PA","","","","",""],["Ingenieur-Analyse","","Problemlösung","","","","","Flussdiagramm präsentieren (Problem gelöst? ja/nein, Methode übernehmen? ja/nein) - Diskussion im PL","Flussdiagramm","PL","","Tag_14_Ingenieuranalyse.jpg","","",""],["Thermosflasche","Energiepegel","Feedback","","","","","Energie-/ Lustpegel anzeigen, zeigen, wie viel Mut / Engagement... eine Aktivität gefordert hat: KL zieht den Finger von oben nach unten an einer Thermosflasche, TN sagen stopp, wenn der Stand ihrem persönlichen Lust/Energie/Mutpegel entspricht","Thermosflasche","PL","Steh- oder Sitzkreis.","","","",""],["The Ambassador-Game","","Simulation","DaF Laku","","","","TN handeln ihrer Rollenkarte entsprechend, jeder kennt nur die eigene Rollenkarte und muss mit jedem Smalltalk machen. Auswertung: Gefühle? Gedanken? Was angenehm / unangenehm? Was ungewohnt? Erfahrungen mit anderen Kulturen? Reaktionen?","Rollenkarten","CP --> PL","freier Raum","ambassador_dt.pdf","","",""],["Klatschimpuls","","Konzentration","Gruppendynamik","","","","Alle TN stehen im Kreis. Einer beginnt und sendet ein Klatschsignal an einen beliebigen anderen Spieler. Dabei wichtig: immer Augenkontakt herstellen und mit den klatschenden Händen deutlich auf den Empfänger zeigen. Das ist wichtig, damit das Signal sauber ankommt, insbesondere wenn später die Geschwindigkeit angezogen wird. Der Empfänger sendet das Klatschsignal weiter an den nächsten Spieler usw. Ziel der Übung ist, als Gruppe in einen \"Flow\" zu kommen: das heißt, jeder ist hochaufmerksam, aber gleichzeitig locker und entspannt; das Weitergeben des Signals geschieht automatisch ohne nachzudenken. Dass der Flow erreicht ist, zeigt sich darin, dass das Klatschen einen gleichmäßigen Rhythmus bekommt. Tipp: es hilft, locker in der Hüfte dazustehen (wie ein Cowboy) oder leicht auf seinem Platz zu federn. Lächeln und Mimik nicht vergessen!","","PL","Stehkreis","","https://improwiki.com/de/aufwaermspiele/klatschkreis","",""],["Pizza backen","","Aktivieren","Entspannung","","","","Die TN arbeiten zu zweit oder stehen im Kreis und jeder massiert den Rücken des Vordermanns. „Heute wollen wir uns eine leckere Pizza backen. Zuerst machen unsere Tisch sauber.“ - Mit beiden Händen über den Rücken streichen. „Dann nehmen wir Mehl und machen damit ein kleines Häufchen auf den Tisch. In das Häufchen kommt ein Loch damit wir die Eier und das Wasser hin einfüllen können. Etwas Salz und die Hefe.“ „Nun kneten wir den Teig gut durch.“  Rücken und die Schultern gut durchkneten. „Jetzt ist der Teig fertig und wir rollen den Teig glatt.“ Mit den Fäusten über den Rücken rollen. „Den Rand nochmal schön glattdrücken.“ „Nun kommt zuerst die Tomatensoße.“ - mit der flachen Hand über den Rücken streichen. „Welchen Belag möchtest Du haben?“Mit den Fingern Zwiebelringe,  Salamiescheiben malen. „Und dann zum Schluß kommt noch der leckere Käse darauf.“ - Ganz leicht und sanft mit den Fingerspitzen den Rücken rauf und runtertrommeln. „Der Ofen wird angeschaltet und vorgeheizt.“ Hände ganz fest aneinanderreiben, bis sie warm werden. „Die Pizza kommt in den Ofen. „- leicht schubsen. „Die Pizza wird gebacken.“ -  Hände auf den Rücken legen. „Klingelingeling, die Pizza ist fertig. Ofen aus. Pizza aus den Ofen nehmen aber vorsichtig heiß!“ Hände wegnehmen und die Pizza in Stücke schneiden. Dann noch so machen, als ob man in den Rücken beißt. „Mhm lecker!“ Schmatz-Geräusche.","","PL","Stehkreis","","","",""],["Rück(en)meldung","","Feedback","Gruppendynamik","","","","Jeder TN bekommt ein Blatt auf den Rücken geklebt, darauf Impulse wie \"Ich kann\" \"Ich bin\" \"Ich habe\"... Die TN gehen herum und schreiben etwas auf den Rücken der anderen. Am Ende Blatt abnehmen, und einiges vorlesen (was mich überrascht hat, was mir gefällt...)","A4-Blätter","PL","freier Raum","","","",""],["Raster legen","","DaF HV","","","","","Lernen mit den Händen - auch bei Hörverstehen! Infos aus dem Text auf Kärtchen vorbereiten, Raster auf A3. Beim Hören die Infos in den Raster ordnen. (Einfacher, als Notizen machen!)","Kärtchen, Raster","PA","","Tag_12_Unterrichtsversuch_9.JPG","","",""],["Auswertungstabelle","","Kontrolle","","","","","Bei Aufgabenrallye oder Lernzirkel / Zirkeltraining die bearbeiteten Aufgaben abstempeln / bewerten / Ergebnis bewerten.","Plakat, Stempel","","","Tag_6_Auswertung_Aufgabenrallye_mit_vielen_Stempeln.JPG","","",""],["60 SEC PAPER","","Feedback","Reflexion","","","","L beschreiben in einer Minute  1. das Wichtigste, das sie gelernt haben  3. die Bereiche, die sie noch nicht ganz klar sehen","Papier","EA","","","","",""],["Fünf Wörter","","Reflexion","","","","","\"Mit welchen 5 Wörtern könntest du .... beschreiben? Begründe deine Wahl.\"","","EA","","","","",""],["Zehn Quizfragen","","Reflexion","","","","","\"Schreibe 10 nicht sehr einfache Quizfragen zu unserem Thema / Text. Wähle dann 2 aus und schreibe dazu eine Antwort (etwa eine halbe Seite).\"","","EA / PA","","","","",""],["Vergleich und Kontrast","","Reflexion","Input","DaF LV","","","\"Beschreibe eine Theorie / Thesis des Autors. Beschreibe dann die Gegenthese / eine Gegentheorie. Worin liegen die Ähnlichkeiten und die Unterschiede zwischen diesen Ideen? \"","","EA / PA","","","","",""],["Verwirrt","","Reflexion","","","","","\"Was frustriert / verwirrt dich in diesem Text / in diesem Modell / in diesem Vortrag? Warum?\"","","EA","","","","",""],["KWL-Chart","","Reflexion","","","","","\"What do you know, what do you want to know, and  what have you learned?\"","","EA","","","","",""],["03/02/2001","","Reflexion","","","","","3 Sachen, die du rausgefunden hast, 2 Sachen, die du interessant findest, 1 Frage, die dich beschäftigt / die der Text für dich nicht beantwortet hat","","EA","","","","",""],["Zwei-Spalten-Leseprotokoll","","Reflexion","","","","","In der linken Spalte: 5-8 wichtige Zitate beim Lesen notieren. In der rechten Spalte die Reaktionen / Gedanken zu den Zitaten notieren.","","EA","","","","",""],["Biografisches Gedicht","","DaF Literatur lesen","","","","","Eine Figur aus dem Text wählen. 1. Zeile: Vorname 2. 3–4 Adjektive, die die Person beschreiben 3. die wichtigste Beziehung zu einer Figur im Text 4. 2-3 Dinge, Personen, Ideen, die die Person mag 5. 3 Gefühle, die die Person erlebt hat 6. 3 Ängste / Befürchtungen 7.  2-3 Dinge / Erfolge, die die Person erreicht hat 8. 2–3 Dinge, die die Person sich gewünscht hat / erleben wollte  9. Die Wohnort der Person 10. Der Familienname der Person.","","EA","","","","",""],["Sprech-Bingo","","Diskussion","Aktivieren","DaF Sprechen","","","Die L füllen ein Raster mit Ausdrücken (aus der letzten Einheit / die sie üben wollen / die ihnen zum Thema einfällt...). Sie bekommen ein Thema, über das sie sich in Kleingruppen oder mit einem Partner oder in einer PL-Diskussion austauschen sollen. Beim Sprechen streichen sie die Ausdrücke durch, die sie schon verwendet haben. Bei PA: Sie nutzen nicht ihr eigenes Bingo-Blatt sondern das des Partners, das sie vorher nicht gesehen haben, Ziel ist möglichst schnell alle Ausdrücke zu verwenden.","A4-Blatt","PA / GA / PL","","bingo.jpg","","",""],["Schatten-Lesen","","DaF Aussprache","","","","","KL liest einen Text vor, die TN markieren die Satzakzente und die Satzmelodie. Danach werden die Markierungen verglichen (z.B. markierten Text kurz beamen). Dann liest der KL den Text noch einmal vor, alle TN lesen halblaut mit und beachten die Markierungen. Sprechtempo ist auch wichtig: Sie sollen mit dem KL gleichzeitig mit dem Lesen fertig werden.","Text, Text mit Markierungen, Beamer","FA","","","","",""],["Fliegenklatsche 2","","Wiederholung","DaF WS","","","Wettbewerb","Vorbereitung: Wortkarten oder Bildkarten an die Tafel kleben. Die Klasse in zwei Gruppen teilen. Jede Gruppe erhält vor Spielbeginn eine Fliegenklatsche. Die Gruppenmitglieder treten nacheinander gegeneinander an. Die zwei Spieler stehen mit dem Rücken zur Tafel. Ein Schüler nennt ein Wort oder erklärt ein Wort, die zwei Spieler drehen sich blitzschnell um und klatschen mit der Fliegenklatsche auf die entsprechende Karte. Für jede korrekte Antwort gibt es einen Punkt, die Punkte werden an der Tafel notiert. Nach 2 Fragen wird gewechselt, und neue Spieler kommen nach vorne.","Vokabelkartei, 2 Fliegenklatschen, Tafel, Karten","PL","","","","",""],["One minute paper","","Reflexion","","","","","Am Ende einer Stunde oder einer längeren Phase (z.B. Gruppenarbeit) nehmen die TN ein leeres Blatt und auf einer Seite schreiben sie alle positiven Gedanken und Rückmeldungen (Was hat mir gefallen? Was habe ich verstanden? Wo habe ich gut mitarbeiten können? Was hat mich angeregt? Womit bin ich zufrieden? Was habe ich Neues gelernt?). Auf der Rückseite werden alle kritischen oder unklaren Gedanken niedergeschrieben (Was hat mir nicht gefallen? Was habe ich nicht ganz verstanden? Woran habe ich mich nicht beteiligen können? Was hat mich gestört? Was ist mir schwer gefallen?). Auswertung: die Interpretation der Rückmeldungen in der Kleingruppe, Erarbeitung der Vorschläge für die Weiterarbeit (Was könnte man beim nächsten Mal anders machen?).","Papier","EA --> GA --> PL","","","","",""],["Waagschale","","Reflexion","","","","","Zu Ende einer Stunde / eines Tages / eines kurzen Seminars können die Teilnehmer abwägen, ob die positiven oder die negativen Aspekte überwogen haben. Die eine Waagschale steht für das, was gut war, die andere für die Teile, die nicht angekommen sind. Jeder bekommt eine bestimmte Anzahl von Steinen, die er nun in den Schalen verteilt. Wenn er will, kann er dazu einen Kommentar abgeben. Am Ende wird sichtbar, ob die TN insgesamt eher zufrieden waren oder nicht. Variante: Die TN suchen sich ihre Steine selbst oder basteln sich andere Gewichte.","Steine (evtl.)","EA / GA","","","","",""],["Pferderennen-Diktat","","DaF GR","DaF Rechtschreibung","Einstieg","","","Die Wörter eines Satzes durcheinandergewürfelt beamen. TN schreiben den Satz auf. Danach Satz diktieren. Danach Satz beamen. Für jeden korrekten Satz gibt es einen Punkt.   Rechtschreibung üben: Satz komplett kurz beamen, TN merken sich den Satz. Dann Satz wegnehmen, TN schreiben den Satz auf.","Beamer","FA","","","","",""],["Wortquadrate","","DaF WS","Wiederholung","","","Wettbewerb","Zwei Spieler malen jeweils diese Quadrate. Einer nennt einen Buchstaben, sie schreiben diese diagonal in alle Quadrate wie im Bild. Das Ziel ist, die Quadrate mit sinnvollen Wörtern zu füllen. Gewonnen hat der Spieler, der zuerst alle Quadrate gefüllt hat. Bei mehreren Spielern (oder Gruppen): Jeder bekommt 2 Punkte für ein Wort, das die anderen nicht haben und 1, das jemand noch hat. Gewonnen hat der Spieler mit den meisten Punkten.","Papier","PA","","squares.jpg","","",""],["Wörter versenken","","Wiederholung","Einstieg","DaF WS","","","Die gleichen Regeln wie bei Schiffe versenken. Die Spieler verstecken Wörter (2,3,4,5,6-Buchstaben, von jedem unterschiedliche Anzahl, was vorher vereinbart wird). Mit allen gelernten Wörtern oder mit Wörtern zu einem bestimmten Thema spielen.","kariertes Papier","PA","","battleship.jpg","","",""],["Wort-Treppe","","DaF WS","Einstieg","","","Wettbewerb","Zwei Spieler malen jeweils eine Treppe. Einer nennt einen Buchstaben, sie schreiben diese von oben nach unten in jede Zeile. Das Ziel ist, die Treppe mit sinnvollen Wörtern zu füllen. Gewonnen hat der Spieler, der zuerst alle Stufen gefüllt hat.","","","","treppen.jpg","","",""],["Wörter bilden","","DaF WS","Wiederholung","","","Wettbewerb","2-5 Spieler spielen gegeneinander. Sie malen ein 7×7, 9×9, 11×11, oder 13×13-er Quadrat und schreiben ein langes Wort in die Mitte. in jeder Runde müssen sie reihum neue Wörter bilden, indem sie nur einen Buchstaben addieren. Für jeden benutzten Buchstaben gibt es 1 Punkt.","kariertes Papier","PA, GA","","scrabble.jpg","","",""],["Wörter in der Hand 1","","DaF WS","Transfer","","","Wiederholung","Die TN malen ihre Hand auf ein kariertes Blatt und schreiben 12-20 Wörter von der letzten Einheit / der wiederholten Einheiten / zu einem Thema in die Hand. Sie erklären die Wörter dem Partner, und solange er nach Wörtern sucht, schreiben sie X-e rund um die Hand. Seminar: Fachbegriffe verstecken","kariertes Blatt","PA","","hands.jpg","","",""],["Wörter in der Hand 2","","DaF WS","Transfer","Wiederholung","","Wettbewerb","An die Tafel eine große Hand malen. 10 Wörter (z.B. aus der Vokabelkartei) aussuchen, und in einer den TN nicht bekannten Sprache in die Hand schreiben. Oder Nummer in die Hand notieren - und die Wortliste auf der Rückseite der Tafel zur Kontrolle bzw. für uns eine kleine Version in die Hand. Die Gruppe fragen, was sie denken, wie viele Versuche sie brauchen, um die 10 Wörter zu finden. Die Zahl notieren. Danach umschreiben sie die Wörter von den neu gelernten / wiederholten Wörtern oder von einem bestimmten Wortfeld. Wenn sie eins der Wörter in der Hand erwischt haben, das Wort oder die Nr. durchgestrichen, wenn nicht, dann gibts ein X drum herum. Das Ziel ist, weniger X-e zu sammeln, als sie am Anfang gesetzt haben. Seminar: Spiel mit Fachbegriffen aus den abgeschlossenen Bausteinen","Vokabelkartei, Tafel","PL","","hand_2.jpg","","",""],["Hobbykreise","","Kennen lernen","DaF Sprechen","Gruppendynamik","","Bewegung","Jeder TN malt drei Kreise und notiert in jedem Kreis eins seiner Hobbys. Sie gehen herum und erzählen einander, was sie gern machen. Sagt der Gesprächspartner \"ich auch\", dann notiert man den Namen in den Kreis. (Evtl. einschränkende Infos auch, z.B. lesen // Anna: nur Krimis). Am Ende für die Auswertung: welches Hobby haben die meisten? Was hat überrascht? Welches Hobby hast nur du allein? ...","Papier","EA --> CP","Freier Raum","","","",""],["Notizen-Dating","","Feedback","Transfer","","","","Die TN sitzen - wie bei Kugellager - im Innenkreis und Außenkreis. Jetzt sitzen sich jeweils zwei Teilnehmer gegenüber, und zeigen sich gegenseitig ihre Notizen. Es kommt darauf an, dass die Teilnehmer diese Mitschriften vergleichen. Das bedeutet, dass jeder der beiden dem anderen zeigt, oder vorliest, was er sich während des gesamten Tages notiert hat: Stichworte, kleine Zeichnungen, Links, Merksätze, oder ganz eigene Ideen. Jeder Teilnehmer entscheidet, welche der Notizen auch für ihn selbst wichtig sind, und notiert sich diese. Die TN haben 5 Minuten Zeit für diesen gegenseitigen Austausch. Jeder der beiden hat 2,5 Minuten Zeit etwas zu sagen. Meist sind das eher Stichworte, oder schnelle Ideen, die hier ausgetauscht werden. Manchmal sind die TN damit schon nach 2-3 Minuten fertig. Der Rest der Zeit bleibt dann für das Ergänzen der Notizen. (Wenn jemand sehr viel mitgeschrieben hat: TOP 5 Stichworte auswählen). Notizen, zu denen sich noch Fragen ergeben, markieren sich die TN besonders. Entweder weiß der nächste TN , auf den die TN in der nächsten Runde treffen eine Antwort, oder die TN stellen ihre Frage dazu in einer abschließenden Plenumsrunde.  Nach 5 Minuten rutschen die TN im Außenkreis 1-2 Plätze nach links auf und bekommen einen neuen Gesprächspartner. Nach jeweils 5 Minuten kommt der nächste Wechsel, bis die TN im Außenkreis wieder auf ihren ursprünglichen Plätzen sitzen. Bei einer größeren Gruppe vorher festlegen, wie oft die TN den Platz wechseln sollen. http://www.apprenti.de/blog/2015/07/09/methode-zur-wiederholung-das-notizen-dating/","eigene Notizen","PA","doppelter Stuhlkreis","IMG_8248.jpg","","",""],["Geräuschememo","","Wahrnehmung","DaF WS","Konzentration","","Rätsel","Kleine Dosen (z.B. Kinderüberraschungseier, Streichholzschachteln) mit verschiedenen Dingen füllen (Reis, Büroklammern, Perlen) und wie bei Memory auf dem Tisch verteilen. Spielregeln auch wie beim einfachen Memory-Spiel. Bei WS: Auch die Sachen benennen, die man gerade in die Hand genommen hat...","kleine Dosen","GA","Tisch","","","",""],["Fliegende Worte","","Konzentration","Konflikte","DaF Sprechen","","","TN stehen im Kreis. Der SL fängt mit einem Satz an, der gerade zu der Situation passt (Mich nervt, dass.., Mich macht es wütend, wenn..., Es würde mich freuen, wenn...) und beendet für sich den Satz und wirft den Ball weiter. Der TN, der den Ball hat, wiederholt, was der Vorredner gesagt hat und beendet für sich den Satz...","Ball","PL","Stehkreis / Sitzkreis","","","",""],["Nasenstopper","","","","","","","74 konflikte","","","","","","",""],["Logische Reihe","","DaF WS","","","","","Zeichnen Sie sich eine Tabelle mit fünf Spalten. In die Spalte ganz links tragen Sie ein Adjektiv ein. In die Spalte ganz rechts tragen Sie das Adjektiv ein, das das genaue Gegenteil des Adjektivs in der Spalte ganz links meint. In den drei verbleibenden Spalten zwischen diesen beiden Polen können Sie jetzt Reihen von Substantiven einsortieren. http://www.sprachenlernen24-blog.de/tipps-zum-sprachenlernen-logische-reihen/logische_Reihen_Englisch.pdf","Papier","EA/PA","","","","",""],["Links-rechts-Mitte-Klatschen","Dänisches Klatschspiel","Konzentration","Aktivieren","","","Bewegung","Die TN stehen in Paaren einander gegenüber. Im gleichen Rhythmus (schnell!) klopfen sie auf die Schenkel, zeigen mit beiden Händen entweder nach links oder rechts oder in die Mitte (oder Hände über dem Kopf). Zeigen beide in die gleiche Richtung (sie spiegeln einander), müssen sie einander in die Hände klatschen. Zeigen sie in unterschiedliche Richtungen, dann geht es weiter: auf die Schenkel klopfen und in eine Richtung zeigen.","","PA","","","","",""],["Loop","","Kooperation","Problemlösung","","","","Die TN stehen im Kreis und halten sich an den Händen. Wir lösen an einer Stelle den Kreis und hängen einen langen verknoteten Schal oder ein Seil rein. Die TN fassen sich wieder an den Händen. Der Schal / das Seil muss im Kreis herumwandern, ohne dass die TN die Hände loslassen.","Seil / langer Schal","PL","Stehkreis","","","",""],["Lachgesicht","","Kooperation","Wahrnehmung","Konzentration","","","Die TN arbeiten in Kleingruppen und malen abwechselnd (das Blatt im Kreis wandern lassen) Gesichtsoval, Augen, Ohr 1 , Ohr 2 , Nase, mund, Haare, Augenbraue, Bart, Pickel,….","Papier, ein Stift pro Gruppe","GA","","","","",""],["Faule Ausrede","","Konzentration","DaF: WS","","","","Jeder bringt eine Krankheit als Entschuldigung, die immer mit dem nächsten Buchstaben des Alphabets beginnt (Atemnot, Bauchschmerzen, Cellulite, Durchfall,…). Möglich als Kettenspiel nach Sitzordnung oder mit dem Zuwerfen eines Balls.","Ball","PL","Stehkreis / Sitzkreis","","","",""],["Tante Jo","","Konzentration","Aktivieren","","","Kettenübung","Tante Jo die macht so: Eigenarten (Augenzwinkern, Geräusche, Bewegungen usw. ) Runde für Runde vormachen und in der Runde wandern lassen, alles wiederholen, was die vorigen Spieler gezeigt haben.","","PL","Sitzkreis / Stehkreis","","","",""],["LEGO-Figur","","Kooperation","Kommunikation","Problemlösung","","","LEGO-Figur (oder Zeichnung…) hinter einer Sichtwand - Gruppen bekommen gleichartige LEGO-Sets - Jeweils 1 TN pro Gruppe darf zur Figur laufen diese ansehen und beschreibt 2 weiteren TN seiner Gruppe wie sie bauen haben (diese dürfen nicht sprechen) - Der 4. TN ist der Regelwächter - Nach 1min rotieren die Aufgaben (Rollen) - Sieger ist, wer zuerst die Figur richtig nachgebaut hat","LEGO-Steine, Pinnwand","GA4","","","","",""],["Geräusche-Mikado","","Konzentration","","","","","Auf einer Decke werden ein Haufen Gegenstände gelegt, die Geräusche machen, benötigt, z.B.: Glöckchen, Besteck, Rasseln, Quietschtiere, kleine Töpfe, Schlüsselbund, Muschelketten ... Die TN sitzen im Kreis um die Decke. Einer beginnt und versucht, einen Gegenstand nach dem anderen von der Decke zu nehmen, ohne dass dabei ein Geräusch zu hören ist. Auch beim Ablegen dürfen keine Töne zu hören sein, sonst ist der/die nächste dran. Gewonnen hat, wer die meisten Gegenstände hat.","Decke, Gegenstände","PL","Sitzkreis","","","",""],["Ali Baba und die 40 Räuber","","Konzentration","Aktivieren","","","","Der SL gibt die Einführung des Spieles und beginnt dem Rhythmus der Worte entsprechend eine Bewegung zu machen, z.B. klatscht in die Hände und sagt dazu, wie der Rhythmus es verlangt: \"Ali Baba und die 40 Räuber\". Danach beginnt er eine andere Bewegung, z.B. stampft mit dem linken Fuß auf. Er wiederholt dazu wie bei der 1. Tour die Worte: \"Ali Baba ...\". Die Bewegungen des SL werden, so bald er mit der 1.Tour fertig ist, von seinem linken NachbarIn aufgegriffen und nachgeahmt. Es wird bei jeder neuen Tour ein weiterer linker Nachbar in das Spiel einbezogen. Das Spiel endet, wenn der letzte die Bewegung aufgenommen hat.","","PL","Stehkreis","","","",""],["Gewitter","","Entspannung","Konzentration","","","","Die TN sitzen im Kreis, schließen die Augen und sind still. Aufgabe: Geräusche zu wiederholen, die der TN rechts macht. 1. Handflächen aneinander reiben. (reihum machen, bis der erste TN merkt, dass sein Nachbar rechts auch die Hände aneinanderreibt). 2. Dann fängt er an, mit den Fingern zu schnipsen (Regen platscht). 3. Klatschen (Klatschregen). 4. Auf die Schenkel schlagen (Wolkenbruch). 5. Stampft  mit den Füßen (Donnergrollen). Dann alles rückwärts – das Gewitter zieht vorbei. Hört der letzte TN  auf, seine Hände zu reiben, fasst er seinen Nachbarn zur linken an der Hand - das geht weiter so im Kreis, bis es wieder ganz still ist. Dann Augen öffnen - die Sonne kommt zwischen den Wolken hervor.","","PL","Sitzkreis","","","",""],["Lach-Kanon","","Aktivieren","Konzentration","Kooperation","","","Die Gruppe wird in drei \"Stimmen\" eingeteilt. Das \"Lied\" besteht aus drei Teilen: 3 x auf die Schenkel klatschen. 3 x in die Hände klatschen. Aufstehen und laut \"ha, ha, ha\" rufen. \"Dirigiert\" wird ein ganz \"normaler\" Kanon.","","PL","Sitzkreis","","","",""],["Zwei kleine Wölfe","","Aktivieren","Kooperation","","","","TN stehen im Kreis und legen beide Hände auf die Schultern des Vordermanns. Singen / skandieren den Text. Wenn zu Ende, greift man über den Vordermann hinüber und legt die Hände auf die Schultern des TN davor. In jeder Runde weiter greifen. :-)","Text: Zwei kleine Wölfe gingen des Nachts im Dunkeln, da hört man den einen zu dem andren munkeln: \"Warum gehn wir denn immer nur des Nachts herum, man tritt sich an den Wurzeln ja die Pfoten krumm, wenns nur schon heller wär (PFEIFEN) wenn nur der Wald mit Sternenlicht beleuchtet wär badumbadum(badum badum badum badum...) https://www.youtube.com/watch?v=inxPxnpV2CY","","","","","",""],["In Ohnmacht fallen","","Konzentration","Gruppendynamik","Wahrnehmung","","","In der Gruppe 1-2-3 durchzählen. Die TN gehen bei Musik herum, und auf Kommando des SL (1-2 oder 3) müssen die TN mit der Zahl umfallen – die anderen müssen sie daran hindern, dass sie auf den Boden fallen.","","PL","freier Raum","","","",""],["Reaktionskette","","Wahrnehmung","Konzentration","DaF Lesen","","","Jeder TN bekommt einen Schnipsel mit einer Instruktion: \"Wenn...., dann mach so: ....\" Die Zettel sind NICHT nummeriert und die Instruktionen ergeben eine Kette. Der SL beginnt: Er macht etwas, was die Reaktion wie auf Zettel 1 hervorruft. Die TN sollen aufpassen, und handeln langsam und gut sichtbar / hörbar, wenn die Situation auf ihrem Zettel beobachtbar ist (Wenn...). Ziel ist, dass die Gruppe eine reibungslose Reaktionskette hinbekommt.","Zettel mit Instruktionen für jeden TN","PL","","","","",""],["Fußarbeit","","Kooperation","Gruppendynamik","","","","Die Mitspieler sitzen im Kreis nebeneinander oder in einer Reihe mit ein wenig Abstand hintereinander.  • Auf Zeit müssen sie mit ihren Füßen einen Gegenstand an ihren Nachbarn bzw. Hintermann weiterreichen. • Wie lange dauert der Durchgang? • Die Gruppe versucht mit jedem neuen Durchgang, ihre Zeit zu verbessern.","ein Gegenstand","PL","Sitzkreis","","","",""],["Kartenhüpfer","","Gruppendynamik","Konzentration","","","","Der SL mischt die Karten und gibt jedem Mitspieler eine. Jeder merkt sich die Farbe seiner Karte. Dann werden die Karten wieder eingesammelt und neu gemischt. Nun beginnt das eigentliche Spiel: Der SL nimmt die erste Karte des Stapels auf und nennt die Farbe. Nun dürfen diejenigen, welche diese Kartenfarbe hatten, einen Platz nach links rutschen. Sitzt dort bereits ein Mitspieler, setzt man sich einfach auf dessen Schoß. Im Verlauf des Spiels kann es so dazu kommen, dass drei oder mehr Personen „übereinander“ auf einem Stuhl sitzen. Der SL gibt die Farbe der nächsten Karte an. Nun dürfen die Mitspieler, die eine Karte dieser Farbe hatten, wieder einen Platz weiter nach links rutschen usw. Sollte ein TM „blockiert“ sein, weil mindestens ein TN auf seinem Schoß sitzt, darf er den Platz nicht wechseln. Das Spiel ist beendet, wenn ein TN – nach einer Runde durch den gesamten Stuhlkreis – zurück an seinen ursprünglichen Platz gelangt.","Spielkarten","PL","Sitzkreis","","","",""],["Fünf und fünf","","Kennen lernen","Gruppendynamik","DaF Sprechen","","","Die Gruppe in Vierergruppen aufteilen. Sie bekommen ein DIN A3-Blatt. Sie sammeln 5 Merkmale, die sie gemeinsam haben und schreiben sie in die Mitte. In die Ecken schreiben sie jeweils 5 Merkmale, die auf sie einzeln zutreffen, die aber niemand in der Gruppe hat.  Anschließend im Plenum die Gruppe vorstellen: WIR sind...","DIN A3","GA","Tische","","","",""],["Stuhlchaos","","Kooperation","Gruppendynamik","Aktivieren","","","Die Gruppe in 3 Teilgruppen aufteilen – jede Gruppe erhält vom Spielleiter einen geheimen Auftrag, die sich auf die Stühle im Raum beziehen: 1. Die Stühle stapeln. 2. Die Stühle hinlegen. 3. Die Stühle hinaustragen. Ohne weitere Erläuterung gibt der SL ein Zeichen – und da beginnt das Chaos, wenn die Gruppe sich stur an die Aufgaben hält :-) Wenn sie sich aber austauschen (was nicht verboten war), gelingt die Lösung: Z.B. zuerst alle Stühle stapeln, dann den Stapel hinlegen und alle Stühle hinaustragen.","Stühle","PL","","","","",""],["Platz nehmen","","Aktivieren","Gruppendynamik","Wahrnehmung","","","Die TN stehen im Stuhlkreis vor ihren Stühlen. Ziel der Gruppe ist, dass am Ende alle sitzen.  Gleichzeitig dürfen sich aber nicht mehrere TN hinsetzen, sonst müssen alle wieder aufstehen.  Nicht erlaubt ist, sich reihum zu setzen und beim Spiel zu sprechen.","","PL","","","","",""],["Aufstand","","Gruppendynamik","Wahrnehmung","Aktivieren","","","Die TN sitzen im Stuhlkreis. Jeder muss dreimal aufstehen, wobei nie mehr als drei TN gleichzeitig stehen dürfen (wenn das der Fall ist, das zählt dann nicht). Die Gruppe darf dabei nicht sprechen und auch vor dem Spiel ist keine Beratung möglich. Es kommt nicht auf die Zeit an, jeder TN zählt für sich mit. Wer schon dreimal aufstehen konnte, verschränkt als Zeichen die Arme. Variante: Jeder muss dreimal aufstehen, und auf einmal müssen immer drei TN stehen.","","PL","Stuhlkreis","","","",""],["Kaminfeger","","Aktivieren","Kooperation","","","","4 bis 6 TN stehen ganz eng im Kreis zusammen und legen die Arme über die Schulter der anderen, so bilden sie einen Kamin. Ein Luftballon wird in die Mitte gelegt, sie sollen ihn – ohne ihn mit den Händen anzufassen – im „Kamin“ hochbefördern.","Luftballons","GA","","","","",""],["Fährmann","","Aktivieren","Kooperation","Gruppendynamik","","","Auf einer Seite steht der Fährmann als Fänger, ihm gegenüber die anderen TN. Die TN rufen dem Fährmann zu: „Fährmann, hol uns rüber!“ Dieser antwortet z.B.: „Drei nehme ich mit.“ Die TN sollen sich schnell zu Dreiergruppen zusammenfinden, so sind sie sicher, alle anderen darf der Fährmann fangen. Der TN, den der Fährmann gefangen hat, wird der nächste Fährmann.","","PL","freier Raum oder im Freien","","","",""],["Stop and go","","Kooperation","Wahrnehmung","Kommunikation","","","Die TN bilden Paare.  A und  B stellen sich in großem Abstand gegenüber auf. A winkt B so weit zu sich heran, bis A die Distanz als richtig und angemessen empfindet und bittet B dann, sich wieder zu entfernen. Anschließend werden die Rollen getauscht. In einem zweiten Durchgang probieren A und B aus, was sie tun und sagen können, wenn die Distanz nicht eingehalten wird. Sie können das durch Mimik und Gestik tun, z. B. nicht mehr lächeln, ein ernstes Gesicht machen einen oder beide Arme aus-strecken die Hand zum Stoppsignal heben u. Ä. Sie können kurze verbale Statements ausprobieren, z. B. Bleib stehen! Komm nicht näher! Geh zurück! u. Ä.  Auswertungsgespräch: Wie leicht fällt es, die Distanz zu einer anderen Person zu bestimmen und ihr deutlich zu machen, dass sie diese nicht überschreiten soll? Wie schwer ist es, den Wünschen der anderen nach Distanz zu entsprechen? Sind Mimik, Gestik und Worte immer eindeutig und stimmen verbales und nonverbales Verhalten überein?","","PA","freier Raum","","","",""],["Gleichberechtigt","","Gruppendynamik","DaF Sprechen","","","","Die TN sammeln „Zweierbeziehungen“, die allen aus ihrem Alltag, aus Texten und Liedern bekannt sind. (Hänsel und Gretel, Lehrer und Schüler, Vater und Mutter, Stan und Ollie, Rotkäppchen und der Wolf...) Gemeinsam wird dann besprochen und im Rollenspiel ausprobiert: Wie gehen die Paare miteinander um? Dürfen beide dasselbe tun? Wer darf mehr? Wer darf weniger? Warum ist das so? Ist das in Ordnung?","","PA / GA","","","","",""],["Wappen","","Kennen lernen","Gruppendynamik","","","","Die TN bekommen ein AB mit einem Wappen. Sie schreiben in die Felder 1 und 4 Infos zu: “ich bin...” in die Felder 2 und 3 “Ich mag...”. In die Mitte malen sie ein Bild, das sie symbolisiert.  Die Wappen werden in die Mitte gelegt und angeschaut. Danach im PL einzeln die Wappen zeigen und raten, wem sie gehören.","AB","EA --> PL","","wappen.jpg","","",""],["Verzauberte Bleistifte","","Kennen lernen","Kooperation","Gruppendynamik","","Bewegung","Jeder TN bekommt einen Kärtchen und einen Stift, den wir mit einem Zettel präpariert haben. Auf dem Zettel stehen 2 Buchstaben – der verzauberte Stift kann nur diese schreiben. (Alternative: TN ziehen Kärtchen mit Buchstabenkombinationen.) Die Aufgabe: Jeder muss ein Namenskärtchen mit ihrem Namen drauf haben, dafür brauchen sie aber die Personen, deren Bleistift die passenden Buchstaben schreiben kann. Die TN gehen herum, stellen sich vor – und sammeln die Buchstaben. Das Spiel endet, wenn jeder seinen Namen auf der Karte hat.","Präparierte Bleistifte oder Buchstaben-Zettel, leere Kärtchen","CP","","","","",""],["Partnerprofil","","Kennen lernen","Gruppendynamik","","","","Aus der ganzen Gruppe werden Paare gebildet, die sich gegenseitig ein Profil erstellen sollen. Falls sich die Partner kaum untereinander kennen, sollte den Paaren 2 x 5 Minuten Zeit gegeben werden, um ein freies Partner-Interview durchzuführen. Dann malt jeder vom anderen ein Bild auf ein A4-Blatt und füllt anschließend den folgenden Fragebogen mit Informationen über den Partner aus. Die Profile werden ausgetauscht und miteinander besprochen. Der Porträtierte darf das Profil korrigieren oder ergänzen. Abschließend werden alle Profile und Portraits ausgestellt.","AB","PA","","","","",""],["Verabredungsuhr","","Erfahrung","Üben","Präsentation","","Bewegung","Die TN erhalten ein Blatt Papier, auf dem 9 Uhr, 12 Uhr und 18 Uhr steht oder eine Uhr oder ein Kalenderblatt. Sie gehen nun im Raum umher, um mit einem anderen eine Verabredung auszumachen.   Später wird sie der Moderator bitten, z.B. zu der 12 Uhr Verabredung zu gehen, um etwas Bestimmtes zu diskutieren. usw...","AB","EA --> PL","","verabredungsuhr.jpg","","",""],["Murmel-Drill","","DaF Aussprache","","","","","s. Bild","Text","FA","","murmeldrill.jpg","","",""],["Das letzte Wort haben","","Input","DaF LV","Diskussion","","","1. Gruppen von 4 TN bilden. Einen Zeitnehmer für jede Gruppe bestimmen. Jeder TN bekommt einen längeren Text. 2. Jeder TN liest den Text und markiert die Stelle, die für ihn die wichtigse Idee / den wichtigsten Gedanken enthält.  3. Wenn alle fertig sind, ein TN liest seine markierte Passage laut vor. Er sagt nichts dazu, die anderen sollen max. 1 Minute lang reihum die Stelle kommentieren. (Was bedeutet er für sie? Welche Gedanken hat er dazu? Welche Ideen weckt sie in ihm?...)  4. Am Ende sagt der TN, der die Stelle ausgewählt hat, warum er sie ausgewählt hat und kann auch auf die Kommentare der anderen reagieren. Dafür hat er 3 Minuten.  5. Nach dem Muster weiter verfahren, bis alle ihre Stelle vorgestellt – und dazu auch das letzte Wort hatten. 6. Am Ende im Plenum offene Fragen klären, Fragen beantworten, die in den Gesprächen aufgetaucht sind und die interessantesten Aspekte sammeln und diskutieren.","ein schwieriger Text","GA","","","","",""],["Oink oink","","Aktivieren","Gruppendynamik","","","Bewegung","Alle Spieler müssen sich nach vorne beugen und ihre Knöchel mit den Händen umfassen. Alle gehen nun in dieser Position vorsichtig im Raum rückwärts. Berühren sich zwei Spieler mit ihren Hinterteilen, müssen sie sich durch die Beine hindurch anschauen und mit „Oink Oink“ begrüßen.","","PL","freier Raum","","","",""],["Elements-Reaktion","","Aktivieren","Konzentration","","","Bewegung","Für dieses Spiel braucht es reichlich Platz und einige Hindernisse, die von den Mitspieler erklommen werden können. Die Mitspieler laufen über die Spielfläche. Immer wieder ruft die Spielleitung eines der vier Elemente. Auf die gerufenen Elemente müssen die Mitspieler wie folgt reagieren:  Bei Erde müssen sich alle Mitspieler flach auf den Boden legen. Bei Wasser müssen die Mitspieler auf eines der Hindernisse klettern, um so vor der kommenden Flut sicher zu sein. Bei Feuer müssen alle Mitspieler in eine Ecke stürmen und dort auf die Feuerwehr warten. Bei Luft müssen die Mitspieler auf einem Bein stehen und die Arme weit von sich strecken. Wer am langsamsten reagiert, scheidet aus. Wenn die Mitspieler mit den Regeln vertraut sind, können weitere Regeln eingeführt werden. Wr hält am längsten durch und reagiert in jeder Runde am schnellsten?","Hindernisse","","großer Raum / im Freien","","","",""],["Gefangen im Käfig","","Kooperation","Problemlösung","","","","Die Seile werden zwischen vier Bäumen gespannt, so dass ein Viereck entsteht, in dem sich die Gruppe der Mitspieler aufhalten und bewegen kann. Die Seile werden jeweils in unterschiedlichen Höhen gespannt. Diese sollten sich an der Körpergröße der Mitspieler orientieren (einmal Höhe Oberschenkel, einmal Höhe Hüfte, einmal Höhe Bauchnabel, einmal Höhe Brust).  Die Gruppe muss zuerst das Viereck betreten. Nun bekommt sie die Aufgabe, dass alle Mitspieler den Käfig wieder verlassen müssen. Dazu muss allerdings jeder Mitspieler über ein Seil den Käfig verlassen. Das klingt erst einmal leicht. Allerdings dürfen nicht alle Mitspieler über das niedrigste Seil steigen. Pro Seil gibt es eine Beschränkung.  So dürfen nur circa 20 Prozent über das niedrigste Seil, 20 Prozent über das zweitniedrigste, 40 Prozent über das zweithöchste und weitere 20 Prozent über das höchste Seil. Die Verteilung sollte an die Körpergrößen und an die Kraft der Mitspieler angepasst werden.  Sobald ein Mitspieler ein Seil berührt, müssen alle Mitspieler wieder zurück in den Käfig und die Aufgabe beginnt von vorne. Die Aufgabe stellt hohe Herausforderungen an Zusammenarbeit, Kommunikation und Vertrauen.","Seil, Bäume","GA","im Freien","","","",""],["Verbotene Wörter","","Konzentration","Kooperation","DaF Sprechen","","","Die TN sitzen im Kreis zusammen und bekommen von der SL ein Thema für eine Geschichte / als Diskussionsanlass.  Nacheinander erzählt jeder TN die Geschichte weiter oder sagt seine Meinung zum Thema, indem er einen Satz beisteuert. Dabei dürfen zu Beginn des Spiels nicht die Wörter „und“ und „oder“ genutzt werden. Hat jeder TN einen Satz hinzugefügt, wird durch die Spielleitung ein weiteres Wort verboten.  Bei jeder Umrundung wird es so komplexer, welche Wörter nicht genutzt werden. Die Gruppe kontrolliert sich selbst, ob die verbotenen Wörter genutzt werden und ob die Geschichte widerspruchsfrei erzählt wird / immer neue Aspekte in der Diskussion genannt werden. Bei einem Fehler erhält der TN einen Minuspunkt. Wer am Ende die wenigsten Minuspunkte hat, gewinnt das Spiel.","nichts","PL","Sitzkreis","","","",""],["Win-ter-land-schaft","","Einstieg","Aktivieren","DaF WS","","","Ein Freiwilliger verlässt den Raum. Die Gruppe innen wird in so viele Kleingruppen eingeteilt, wie das Wort, das der Freiwillige erraten hat, Silben hat. Jeder Gruppe wird eine Silbe zugeteilt. Die Gruppen vermischen sich dann wieder im Raum. Sobald der Freiwillige den Raum betreten hat, sprechen alle Gruppen gleichzeitig ihre Silbe aus. Der Freiwillige muss herausfinden, welche Silben und welches Wort gesucht werden.","","PL","","","","",""],["Sprechende Farben","","Einstieg","Kennen lernen","DaF Sprechen","","Bwegung","Buntstifte in verschiedenen Farben auf den Boden / auf den Tisch legen, so dass jede Farbe gut sichtbar ist. Die TN tanzen um die Stifte herum, und wenn die Musik stoppt, nehmen Sie einen Stift, der zu der Frage passt: z.B. \"Was esst ihr gern?\"  Sie gehen herum, sprechen mit möglichst vielen TN, und erzählen, was sie gern essen. (1 Minute). Danach legen die TN die Stifte zurück - und der KL nennt jetzt das nächste Thema (ein Obst, mein Lieblingskleidungsstück, ein Tier, ein Reiseziel, mein Lieblingsmonat, Musik, mein bester Freund, ein Traum). Die TN legen am Ende jeder Runde den Stift zurück, tanzen weiter und entscheiden sich in der nächsten Runde neu.  Tipp: Zuerst konkrete, dann immer abstraktere Themen nennen, bei den letzten die Zeit auf 2 Minuten erhöhen.","Buntstifte / Kärtchen in verschiedenen Farben","CP","freier Raum","","","",""],["Star-Interview","","Kennen lernen","Einstieg","DaF Sprechen","","","Die TN malen einen Stern. Notieren 5 Fragen zur Person / zum Thema, die sie interessieren. (Wir können sie auch gemeinsam sammeln, wenn es wichtig ist, dass wir am Ende einen Gruppenspiegel erstellen.) Sie notieren den Namen einer Person, die sie interviewen wollen, in die Mitte und befragen sie. Zu jeder Frage sollen noch weitere Fragen gestellt werden (warum, wie, wo, seit wann), um nähere Infos zu bekommen. Wenn fertig, kann jeder noch beliebig viele Sterne malen und weitere TN befragen. Im Plenum die interessantesten Antworten sammeln.","Papier","CP / PA","","star_interview.jpg","","",""],["Zugreifen","","DaF HV","Konzentration","","","","In die Mitte eines Tisches, an dem alle TN sitzen, werden eine große Menge an Gegenständen gelegt. Die SL beginnt eine Geschichte zu erzählen, in der die Gegenstände vorkommen. Sobald einer der Gegenstände genannt wurde, dürfen die TN zugreifen. Wer den Gegenstand erwischt, darf ihn behalten und sichert sich somit einen Punkt. Wir können auch Süßigkeiten auf dem Tisch verteilen, die dann nach der Geschichte gegessen werden dürfen.","kleine Gegenstände, Süßigkeiten","PL","großer Tisch","","","",""],["Eckenlauf","","Erfahrung","Einstieg","DaF Sprechen","DaF Schreiben","Bewegung","In den 4 Ecken des Raumes hängen Plakate mit unterschiedlichen Aussagen bzw. Fragen zum aktuellen Thema. Die TN teilen sich in 4 Gruppen auf. Jede Gruppe beginnt an einer Ecke und nimmt zur Frage bzw. Impuls Stellung und schreibt die Gedanken, Anmerkungen dazu auf die bereit gelegten Post-its. Nach ca. 5-10 Minuten ist Wechsel. Ziel ist, dass jede Gruppe in allen 4 Ecken die Fragen bzw. Impulse bearbeitet hat. Anschließend gemeinsamer Austausch in allen 4 Ecken.","4 Plakate, post-its","GA","","","","",""],["Getränkekiste","","Kooperation","Problemlösung","Kommunikation","","","Für dieses Kooperationsspiel braucht ihr eine (Wasser-)Getränkekiste mit sechs verschiedenen Wasserflaschen darin. Diese sollten sich von der Größe und Form leicht unterscheiden.  Die Aufgabe der Gruppe besteht darin, sich zu merken, welche Flaschen an welcher Stelle in der Getränkekiste steht. Meint die Gruppe, sich dies gemerkt zu haben, bekommen alle Mitspieler die Augen verbunden. Anschließend verteilt die SL die Flaschen in einem angemessenen Radius um die Kiste herum. Die Gruppe muss nun blind eine Taktik finden, wie sie die Flaschen findet und dann wieder an die passende Position in der Getränkekiste stellt.  Der Abstand zwischen der Getränkekiste und den Flaschen sollte maximal etwas über der Spannweite der Arme aller Mitspieler zusammen liegen, so dass sie, wenn sie eine Kette bilden, gerade noch an die Flasche kommen – oder vielleicht auch nicht.  Die Spielleitung hat dabei stets auf die Sicherheit der TN zu achten. Die Mitspieler sollten nie das Gelände blind verlassen. Auch auf Hindernisse im Gelände ist zu achten.  Hinterher kann die Taktikfindung und die Kommunikation im blinden Zustand ausgewertet werden.","Getränkekiste, 6 verschiedene Wasserflaschen, Augenbinden für alle TN","GA","","","","",""],["Tat-Wirkungsbogen","","Transfer","Feedback","Reflexion","","","Am Ende eines Kurses erhalten alle TN einen Tat-Wirkungsbogen. Ein einfaches Din-A-4-Blatt mit zwei Feldern: Ein Tatfeld: „Das mache ich“ und ein Wirkungsfeld: „Mit dieser Wirkung“. Jeder TN überlegt nun für sich: „Was aus dem hier Gelernten will ich in meiner Praxis umsetzen? Und was genau will ich damit bewirken?“ Die TN wählen ein Vorhaben aus und notieren Tat und Wirkung auf dem Bogen. Dann stellen sie ihre geplanten Taten und erhofften Absichten vor. Je nach Gruppengröße und verfügbarer Zeit in der Gesamtgruppe, in Kleingruppen oder gemeinsam mit einem Lernpartner. Egal in welcher Form – jeder TN präzisiert für sich selbst ein konkretes Vorhaben und benennt die gewünschte Wirkung.","AB","EA > GA/PL","","wirkung.jpg","","",""],["Seminar-Landkarte","","Reflexion","Transfer","","","","Die TN falten ein Blatt Papier, so dass 16 kleine Felder entstehen. Sie denken dann über das Seminartheme nach, studieren ihre Notizen und schreiben jedes Stichwort, jedes Teilthema, das ihnen einfällt, gut lesbar in eines der 16 Felder. Die Reihenfolge spielt keine Rolle.  Sie reißen danach das Blatt an den Faltlinien durch, so, dass am Ende 16 kleine Zettel mit den Stichworten entstehen. Sie wählen dann einen bunten A3-Bogen aus und ordnen darauf die gewählten Stichworte und kleben sie am Ende auf. (Wie hängen die Dinge zusammen?, Gibt es Hierarchien?, Welche Verbindungen gibt es?, Welche Unterschiede bestehen?, Wo gibt es Abhängigkeiten? Sie können auch Verbindungs- und Trennlinien einzeichnen, Pfeile, Kästen oder Kreise, können Überschriften finden.) So entsteht eine Art Landkarte.  Die TN stellen einander in PA ihre Sammlungen vor.","A4-Blätter, bunte A3-Blätter, Kleber, Stifte","EA > PA","","","","",""],["Alexa, Andi, Anton","","Kennen lernen","Namen lernen","","","","Für die Wiederholung der Namen: TN nennen ihre Vornamen in alphabetischer Reihenfolge, ohne, dass sie sich vorher absprechen oder einander Zeichen geben, dass sie dran sind. Macht die Gruppe einen Fehler, müssen sie von vorne anfangen.","","PL","Sitzkreis / Stehkreis","","","",""],["Bequem - mutig - waghalsig","BMW","Transfer","Üben","","","Differenzieren","Die TN wählen allein, zu zweit oder zu dritt Aufgaben und bearbeiten sie. 1. Die bequemen Aufgaben sollen leichtfallen, aber auch nicht unterfordern. Umsetzungsaufgaben bieten sich an. Aufgaben, bei denen das Besprochene aufgefrischt wird. Oder ein Text mit Fragen dazu. (“Wenn Sie die bequeme Aufgabe wählen, können Sie gewiss sein: Es wird Ihnen gut gelingen, die Aufgabe zu lösen. Ich bin sicher, dass Sie gut zum Ziel kommen werden.“ 2. Die Aufgaben für die Mutigen können anspruchsvoller sein. Hier eignen sich Übertragungsaufgaben, Herausforderungen zum Weiterdenken. Die Aufgaben sollen ambitioniert, aber machbar sein. („Sie können sich auch für eine mutige Aufgabe entscheiden. Da ist schon etwas Mumm gefordert, hier werden Sie sich ins Zeug legen müssen, um die Nuss zu knacken. Wer Lust auf eine kleine Mutprobe hat, greift hier zu.“) 3. Die Aufgaben dürfen es in sich haben. Entwickeln Sie Aufgaben, bei denen die Lernenden an ihre Grenzen kommen. (“Und jetzt kommt noch eine Möglichkeit, bei der ich allerdings nur zur Vorsicht raten kann. Hier steckt eine waghalsige Aufgabe drin, bei der Sie sich die Zähne ausbeißen können. Ich empfehle Ihnen nicht, hier zuzugreifen. Natürlich entscheiden Sie selbst. Aber sagen Sie nachher nicht, ich hätte Sie nicht gewarnt!“). Die TN können nach Abschluss ihrer Arbeit einen Musterlösungsbogen abholen.","3 Aufgaben","EA / PA / GA","","","","",""],["Erklären Sie es Herrn Paul!","","Transfer","Reflexion","","","","Die TN stellen sich vor, dass sich am Seminarende der Auftraggeber / ihr Chef mit dem Wunsch gemeldet hat, bei der Schlussrunde dabei zu sein. Die TN überlegen sich eine Kurzzusammenfassung der wesentlichen Inhalte. Wer eine Sache gefunden hat, beginnt einfach und wendet sich an en (imaginären) Gast und spricht ihn direkt an. An die Flipchart kommt der Satz: „Lieber Herr Paul, wären Sie gestern und heute hier mit dabei gewesen, dann hätten Sie gelernt …“ So kommt jeder in der Gruppe dran. Eignet sich auch, wenn eine TN zu spät kommt und integriert werden muss.","Flipchart","","PL","","","",""],["Begriffs-Paten","","Einstieg","Input","","","","Begriffe aus Ihrem Thema finden – pro TN 1 plus 3 bis 5 zusätzliche und auf Moderationskarten schreiben. (Bei großen Gruppen Patenteams bilden!) Kärtchen an die Rückseite einer Pinnwand anpinnen. Die TN wählen einen Begriff – sie sind dann im Kurs der Pate / die Patin für den Begriff. Die Begriffe werden dann reihum genannt. Danach sammelt jeder TN in den bereitgestellten Materialien oder im Internet Infos zum Begriff. Im Laufe des Kurses erläutern die Paten den anderen die Begriffe. Auf der Rückseite der Karte kann der Block genannt werden, in dem der Begriff vorkommt.)","Kärtchen, Pinwand","EA / PA > FA","","","","",""],["Stimmt oder stimmts nicht?","","Einstieg","Input","","","","Die TN erhalten vor einem Vortrag oder Seminarbaustein einen Bogen mit Aussagen zum Thema. Gemeinsam mit dem Nachbarn, der Nachbarin sollen sie herausfinden, ob sie den Aussagen zustimmen oder nicht. Hier sind Vermutungen gefragt. Im Laufe des Vortrages werden dann nach und nach die Rätsel aufgelöst.","AB","EA / PA > FA","","","","",""],["Sicherheitscheck","","Reflexion","Transfer","","","","Nach der Bearbeitung einer komplizierte Sache schätzen sich die TN selbst ein, wie sicher sie sich mit dem Problem fühlen. Dazu wird ein Plakat mit einer Skala von 0 bis 10 vorbereitet, die TN kreuzen eine Zahl an, die auf sie zutrifft. (Topfitt: 10). Danach tauschen sie sich mit dem Nachbarn zu den drei Fragen aus: 1. Wie sicher fühle ich mich im Thema? 2. Weshalb? 3. Was brauche ich, um weiter Richtung 10 zu kommen?. Sie sollen am Ende die wichtigsten Maßnahmen für sich notieren.","Flipchart","EA > PA","","","","",""],["Schwärzen","","Input","","","","","Die Teilnehmer lesen Texte und haben die Aufgabe, alle Informationen, die ihnen nicht wichtig erscheinen, mit einem schwarzen Filzstift wegzustreichen. Anschließend Austausch und Diskussion.","Text, schwarze Stifte","EA > PA / GA","","","","",""],["Beutebuch","","Reflexion","Transfer","","","","Jeder TN erhält ein leeres Schreibheft. Regelmäßig gibt es im Seminarverlauf Schreibzeiten, in denen die TN ihre wichtigsten Erkenntnisse, Fragen und Ideen in ihren Beutebüchern notieren können.","Miniheft","EA","","","","",""],["Brillenträgervotum","","Diskussion","Erfahrung","","","","Bestimmte TN-Gruppen (z.B. Brillenträger oder Schwaben ...) werden überraschend aufgefordert, zu einer zentralen Frage Stellung zu beziehen. Danach kann das Thema in der Gesamtgruppe oder in Kleingruppen diskutiert werden. In regelmäßigen Abständen neue Aspekte zur Diskussion stellen...","","PL","","","","",""],["Feierabendkino","","Reflexion","","","","","Die TN hören entspannt mit geschlossenen Augen zu. Der Kl fasst in einem kleinen Bericht die wichtigsten Themen und Ereignisse des Seminars zusammen.","Stichwortzettel","FA","","","","",""],["Inventur","","Reflexion","Transfer","Einstieg","","","Die TN eln in Einzelarbeit auf großen Papieren Fakten, Gedanken, Ideen zum Seminarthema. Sie haben die Aufgabe, mindestens (bspw.) 33 Informationen zusammenzutragen. Anschließend stellen sie ggf. ihre Sammlung oder Teile daraus vor.","DIN A3-Blatt, Stifte","EA","","","","",""],["Stichwortsalat","","Reflexion","Transfer","Wiederholung","","","Alle TN  notieren am Ende einer Arbeitseinheit oder eines Seminars auf Notizzetteln Begriffe, die sie erinnern und / oder, die ihnen wichtig sind. Die gefalteten Notizzettel kommen alle in eine Schüssel. Nun ziehen die TN  reihum einen Zettel, nennen das Stichwort und erzählen, was sie dazu erinnern.","Notizzettel","EA > PL","","","","",""],["Tempo-Thesen-Runde","","Diskussion","Erfahrung","","","","Die TN erhalten Thesen und nehmen in einem Kurzvortrag Stellung dazu. Eine Diskussion kann sich anschließen. Vorbereitung: 2, 3 oder 5 Minuten, Vortrag: 90 Sekunden pro TN","Kärtchen, Briefumschläge, Stoppuhr","FA > PL","","","","",""],["Emoji-Storys","","Kennen lernen","DaF Sprechen","","","","Die TN wáhlen aus den Emojis passende aus und beschreiben ihr Wochenende, ihre Ferien. Sie schneiden sie aus und kleben sie auf ein Blatt. Sie arbeiten danach in Paaren, lassen zuerst den Partner raten, wofür die Bilder stehen und erzählen danach ihre Geschichte.","AB, Schere, Kleber, Blätter","EA > PA","","emoji.jpg","","",""],["Sehe ich genauso - sehe ich anders","","Erfahrung","Einstieg","Diskussion","DaF Sprechen","Bewegung","Die TN bekommen ein AB mit vielen Aussagen / Thesen zum Thema. Sie entscheiden bei jedem, ob sie der These zustimmen und markieren die Thesen mit S bzw. A (sehe ich So - im Origi
