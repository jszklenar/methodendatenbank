ruppen und bekommen auch einen Lösungsschlüssel.  Danach schreiben sie in der Gruppe: Was ist passiert? Wie endet die Geschichte? Wenn sie ihre Story geschrieben haben, bekommen sie noch eine Sammlung von Konjunktoren und Satzanfängen, mit der sie die Geschichte überarbeiten können.  Die Texte können sie veröffentlichen und einander Kommentare schreiben. Lesen wollen sie sicherlich alle Texte, weil es sie interessiert, was die anderen zur gleichen Geräuschcollage geschrieben haben.  Bei der Quelle ist eine Datei mit Geräuschen und auch eine Liste.","Geräuschcollage, Wortliste","EA > PA/GA > PL","","","https://eltcation.com/2016/03/13/the-sounds-of-story/","",""],["","","","","","","","","","","","","","",""],["Circle of voices","","DaF Sprechen","Erfahrungen","Kooperation","","","Eine Aktivität, um freies Vortragen und Diskutieren zu üben.  Bei der Methode wechseln sich die L mit dem Sprechen ab. Sie arbeiten in Kleingruppen von 4/5 Personen. Jede Gruppe bekommt ein Diskussionsthema.  Zuerst bekommen die L einige Minuten Zeit, um ihre Gedanken dazu zu ordnen.  Die Diskussion wird eröffnet, wobei jeder L bis zu 3 Minuten ununterbrochen sprechen kann. (Je nach Sprachniveau und Komplexität des Themas kann die Dauer variieren.)  Wenn ein L spricht, darf niemand aus der Gruppe etwas sagen. Wir können vorher festlegen, wie viele Runden die L machen, danach wird die Diskussion freier gestaltet.  (Wenn die L einander nicht zuhören oder einander nicht ausreden lassen, nutze eine \"heiße Kartoffel\": Jede Gruppe, zerknüllt ein Blatt Papier zu einem Ball zu zerknüllen. Der L, der den Ball hält, darf sprechen. Nachdem der L gesprochen hat, kann er den Ball an ein beliebiges Mitglied der Gruppe weitergeben.) Die L sollen auf dem aufbauen, was der vorherige L gesagt hat: Er soll zuerst die Bemerkungen des Vorgängers paraphrasieren oder zeigen, wie seine Bemerkungen mit denen des Vorgängers zusammenhängen.","Papier","GA","","","","",""],["Nominierungskarten","","Erfahrung","DaF Sprechen","Kooperation","","spielerisch","Ziel: Diskussionen in kleinen Gruppen mit Hilfe von Nominierungskarten zu strukturieren. Jede Gruppe bekommt ein Thema/eine Frage zur Diskussion und einen Satz von Nominierungskarten. Der erste Redner gibt seine Meinung zu dem Thema ab, nimmt eine Karte vom Stapel mit der leeren Seite nach oben und folgt den Anweisungen: Stellt z.B. eine Frage an die Person links. \"Was meinst du?\" / \"Wie denkst du über ...?\" ... usw. Wenn die L mit der Diskussion über das Thema fertig sind oder alle 20 Karten verwendet wurden, können sie entweder der Lehrkraft oder einer anderen Gruppe berichten, was sie besprochen haben, die Diskussion fortsetzen, indem sie auf dem aufbauen, worüber sie bereits gesprochen haben, oder sie können mit einer neuen Frage zum Thema fortfahren, die Karten mischen und den Vorgang wiederholen.","Nominierungskarten (dt. Version im Anhang)","GA","","Nominierungskarten.jpg","https://tekhnologic.wordpress.com/2016/03/29/nomination-cards-giving-students-a-chance-to-speak/","Wordwall: Zufällige Karten","Wordwall: Zufällige Karten"],["Bild-Prompt Storytelling (mit Wirbeln)","","DaF Schreiben","DaF Sprechen","Kooperation","","spielerisch","Kleingruppen bilden und jeder Gruppe eine Nummer zuweisen. Jede Gruppe bekommt ein Tablet / oder sie nutzen ihr eigenes Handy.     Jede Gruppe schreibt in einem KI-Bildgenerator einen Prompt zu einer Szene, der Bilder auf dieser Grundlage erzeugt.     Die Gruppe wählt ein Bild aus und gibt das Tablet / das Handy an die Gruppe mit der nächsten Nummer weiter (z.B. 1 an 2, 2 an 3, 3 an 4, 4 an 1).     Die nächste Gruppe muss die Geschichte fortsetzen, und sie beschreiben die nächste Szene als Prompt.   ... usw.    Wenn jede Gruppe sein eigenes Tablet zurückbekommen hat, lesen sie die Prompts, schreiben daraus eine Geschichte und füllen evtl. Lücken.     Die Texte werden dann in der Klasse veröffentlicht.","Tablets / Handys, Internet","GA","","","https://eltcation.com/2023/05/23/imagine-5-activities-for-language-students/","",""],["Wiederholungsuhr","","Wiederholung","DaF WS","","","spielerisch","Die L zeichnen eine Uhr und ausgehend aus den Ziffern zeichnen sie Linien, so dass auf dem Papier 12 Segmente entstehen (s. in der Quelle). Sie blättern ihr Kursbuch /  ihre Notizen durch und schreiben Sie 3 bis 5 Vokabeln in jedes Segment der Uhr. Dann sollten sie entweder die Anweisungen für jedes Segment befolgen (siehe Anhang mit 12 5-Minuten-Aktivitäten zur Vokabelwiederholung) oder sie wählen Aktivitäten zufällig aus der Liste.","AB, Papier","EA / PA","","revisionsclock.jpg","https://eltcation.com/2022/06/11/revision-clock-5-minute-vocabulary-activities/","",""],["","","aktivieren","","","","","","","","","","","",""],["Echo-Bingo","","DaF Sprechen","","","","spielerisch, Bewegung","Mit dem Spiel üben die L Gambits, mit denen sie auf Aussagen reagieren. Vorbereitung: In der Klasse Beispiel sammeln, die sie schon gelernt haben - oder was sie gern auch auf Deutsch können wollen (wow, no way!...). Jeder L trägt die Begriffe in ein Feld in seinem Heft ein (3x4, 3x4, 4x4...). Danach laufen sie herum, und stellen einander Fragen. (Was ist deine Lieblingsmannschaf? Wie oft warst du schon in Deutschland?...) Der Partner antwortet und sie reagieren wahrheitsgemäß mit einem Ausdruck von ihrer Tabelle und markieren sie es danach. Sie suchen dann einen neuen Gesprächspartner... Haben sie 3 oder 4 in einer Linie (waagerecht, senkrecht oder diagonal), rufen sie laut BINGO!Gewonnen hat der L, der in der angegebenen Zeit die meisten Bingos hat.","Papier / Heft","CP","","echo_bingo.png","","",""],["Die unsichtbare SängerIn","","Aktivieren","Einstieg","DaF Sprechen","","","Personen beschreiben - mal anders: Die L hören eine Passage von einem Lied von einem für sie nicht bekannten Sänger (ein älteres Lied nehmen oder ein wenig bekanntes Lied, z.B. aus einem anderen Land).   Sie sollen sich beim Hören vorstellen, wie der Sänger wohl aussehen könnte und machen Notizen.  Danach sammeln wir in der Gruppe alle Ideen und notieren sie in Spalten an der Tafel: Geschlecht, Alter, Haare, Augen, Größe, Figur, Kleider...   ... und zum Schluss vergleichen wir mit dem Video und markieren dann an der Tafel, was stimmt.","Musik, Tafel","EA > PL","","","","",""],["Weitergeben!","","Aktivieren","Einstieg","Erfahrung","DaF Sprechen","","Die L sitzen im Kreis - das erleichtert das Weitergeben: Jeder L nimmt ein Blatt Papier. Sie schreiben oben eine Frage auf. Sie geben ihr Blatt weiter und schreiben ihre Antwort auf das Blatt, das sie bekommen haben, bis jeder seine eigene Frage zurückbekommen hat. Sie lesen die Antworten und tragen eine Zusammenfassung der Ergebnisse vor.","Papier","Sitzkreis","","","","",""],["Hand","","","","","","","","","","","","","",""],["Sätze malen","","DaF Grammatik","DaF WS","Wiederholung","","spielerisch","1. Die L schreiben zuerst in Gruppen zu verschiedenen Grammatikthemen (Liste - wie im Bild links) Sätze.     2. Danach wählen sie ihre schönsten Sätze aus und malen dazu kleine Bilder. Zu jedem Bild schreiben sie auch einen \"Code\" dazu – s. Grammatikliste. Auf die Rückseite schreiben sie ihren Satz.  (Beispiel: In den USA sind die Hamburger größer / In den USA isst man mehr Hamburger .... Peter kann nicht Auto fahren ./ Peter hat kein Auto. / Peter kommt nicht mit dem Auto....)  3. Dann hängen sie ihre Bilder aus und schreiben eine Nummer dazu.   4. Alle gehen herum und versuchen die Sätze zu raten. Sie notieren sie im Heft und vergleichen ihre Lösung  mit der Rückseite.","","EA/PA","","s_tze_malen.png","Sowieso KB 2, Langenscheidt","",""],["1-Wort-Geschichte","","Aktivieren","Einstieg","DaF Sprechen","","","Die TN arbeiten alle zusammen oder in Kleingruppen: Ihre Aufgabe ist,  als Gruppe eine Geschichte zu erfinden. Sie legen die Reihenfolge fest, wie sie drankommen. (Online: Sie schreiben ihre Namen an die Tafel, wie ein Sitzkreis :-). Jeder TN sagt der Reihe nach ein Wort. Wenn der Satz zu Ende ist, kann der L, der das letzte Wort gesagt hat, die Hand heben, als Signal, dass jetzt ein neuer Satz beginnen soll.  Zum Beispiel: 1: Einmal 2. flog 3: ein 4: kleiner 5: Junge 6: allein 7: nach ... Wenn die TN in Gruppen gearbeitet haben, können sie dann in Mixgruppen ihre Geschichten nacherzählen.","-","GA / PL","Sitzkreis","","","die TN schreiben ihre Namen an die Tafel (Sitzkreis), damit die Reihenfolge klar ist und das Spiel flott geht",""],["Der heiße Drehstuhl","","Wiederholung","DaF WS","Einstieg ins Thema","","spielerisch","3er-Teams bilden (A-B-C) Ein L („A“) sitzt mit dem Rücken zur Tafel. Die anderen zwei erklären schnell Wörter / sagen Sätze mit Lücken. „A“ sagt das Wort oder „weiter“, wenn ihm/ihr das Wort nicht einfällt. „A“ zählt seine Punkte und nach 3 Minuten kommt „B“ auf den heißen Stuhl… Was dran war (und A auch gewusst hat), kommt nicht nochmal dran Danach „C“… Am Ende rechnen die Gruppen die Punkte zusammen Auswertung (PL):\u000bWelche Wörter sind schwierig?\u000bWelche Strategien waren bei der Erklärung hilfreich?","Tafel und Wortkarten / PPT","GA","","","","",""],["20 Fragen","","Einstieg","Aktivieren","DaF Sprechen","","","Ziel: Kluge Fragen stellen. Die KL gibt den L  ein Thema und dann müssen sie nach kurzer Überlegung der KL 20 Fragen stellen, die er mit Ja oder Nein beantworten kann. - Weiter: Alles, was die KL nicht beantworten konnte, können die L schnell recherchieren.","","PL","","","","",""],["Mein Wort","","Aktivieren","","","","","Für Präsentationen und Vorträge: Jedem TN ein Blatt Papier mit Wörtern zum Thema geben. Wenn sie das Wort hören, müssen sie die Hand heben.","Zettel","FA","","","","",""],["Lotusblütentechnik","","Ideen sammeln","Problemlösung","Kooperation","","","Brainstorming in mehreren Runden, aufeinander aufbauende Ideen entwickeln","Vorlage, Post-its / kooperative Whiteboards","GA","","lotus.png","https://www.youtube.com/watch?v=-dOsmRkQHS0&t=131s","FigJam, Miro, Padlet Sandbox",""],["Herzensdinge","","Kennen lernen","DaF Sprechen","","","","Alle malen ein großes Herz auf ein Blatt Papier.   Danach malen sie Teile in verschiedenen Farben ein: Was ist mir wichtig? Die Größe der Flächen zeigt auch die Wichtigkeit der Sachen. Sie schreiben an den Rand eine Erklärung zu den Feldern.   Fortsetzung: Partnergespräche - Ähnlichkeiten finden.","Blätter, Buntstifte","EA > PA","","herzensdinge.png","","",""],["ABC-Geschichten","","DaF Sprechen","DaF WS","Konzentration","","","Alle sitzen im Kreis. Ein Spieler beginnt, indem er ein Wort mit A als Anfangsbuchstaben nennt. Der nächste Spieler wiederholt das erste Wort und nennt anschließend ein Wort mit B als Anfangsbuchstaben. Wichtig ist dabei, dass die Wörter sinnvoll aneinandergereiht werden, so dass sich nach und nach ein Satz ergibt.","","PL","Sitzkreis","","","",""]];
const URLRE=/(https?:\/\/[^\s<>"]+|www\.[^\s<>"]+|\b[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:de|com|org|net|at|ch|eu|info|io|app|ly|me|tv)\b(?:\/[^\s<>"]*)?)/gi;
function rich(s,terms){let out="",last=0,m;URLRE.lastIndex=0;
  while((m=URLRE.exec(s))){let u=m[0],tail="";const k=u.match(/[.,;:!?)\]”“"']+$/);if(k){tail=k[0];u=u.slice(0,-tail.length)}
    if(!u)continue;
    out+=hl(s.slice(last,m.index),terms)+`<a href="${esc(/^https?:/i.test(u)?u:"https://"+u)}" target="_blank" rel="noopener">${hl(u,terms)}</a>`+hl(tail,terms);last=m.index+m[0].length}
  return out+hl(s.slice(last),terms)}
const LONG=new Set([7,8,11,13,14]);

function hl(s,terms){let h=esc(s);for(const t of terms){if(t.length<2)continue;try{h=h.replace(new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>")}catch(e){}}return h}
const adv=$("adv"),fi=[];
COLS.forEach((c,i)=>{const d=document.createElement("div");d.className="ar";d.innerHTML=`<label>${esc(c)}</label><input type="search" placeholder="suchen in ${esc(c)}">`;adv.appendChild(d);const inp=d.querySelector("input");inp.onkeydown=e=>{if(e.key==="Enter")go()};fi.push(inp)});
$("tog").textContent="Spaltensuche";$("tog").onclick=()=>adv.classList.toggle("on");
let hits=[],shown=0,terms=[];const PAGE=40;

  terms=norm($("q").value).split(/\s+/).filter(Boolean);

    for(let i=0;i<fq.length;i++)if(fq[i]&&!r.n[i].includes(fq[i]))return false;

function more(){
  const frag=document.createDocumentFragment();
  hits.slice(shown,shown+PAGE).forEach(r=>{
    const v=r.v,el=document.createElement("div");el.className="card";
    const chips=[2,3,4,5].filter(i=>v[i]).map(i=>hl(v[i],terms)).join(" · ");
    
    const det=[1,6,8,9,10,11,12,13,14].filter(i=>v[i]).map(i=>`<div><b>${esc(COLS[i])}:</b> ${i==11?lk(v[i],true):rich(v[i],terms)}</div>`).join("");
    const at=(r.att||[]).map(a=>`<a href="${esc(a.url)}" target="_blank" rel="noopener">📎 ${esc(a.name)}</a>`).join("");
    el.innerHTML=`<h3>${hl(v[0]||"(ohne Titel)",terms)}${r.neu?'<span class="new">NEU</span>':""}${r.att&&r.att.length?" 📎":""}</h3>${chips?`<div class="fn">${chips}</div>`:""}<p class="desc">${rich(v[7],terms)}</p><div class="det">${det}${at?`<div class="att"><b>Hochgeladene Dateien:</b> ${at}</div>`:""}</div><div class="ed"><button class="edit">BEARBEITEN</button></div>`;
    el.querySelector(".edit").onclick=e=>{e.stopPropagation();startEdit(r)};
    el.onclick=e=>{if(!e.target.closest("a"))el.classList.toggle("open")};
    frag.appendChild(el)});
  $("list").appendChild(frag);shown=Math.min(hits.length,shown+PAGE);
  $("more").style.display=shown<hits.length?"block":"none";
}
$("more").onclick=more;
const go2=document.createElement("button");go2.className="p";go2.textContent="Suchen";go2.style.justifySelf="start";go2.onclick=()=>go();adv.appendChild(go2);
function go(){
  run();
  const parts=[];const q=$("q").value.trim();if(q)parts.push("„"+q+"“");
  fi.forEach((i,k)=>{if(i.value.trim())parts.push(COLS[k]+": "+i.value.trim())});
  document.body.classList.toggle("res",parts.length>0);
  $("sum").textContent=parts.length?"Suche: "+parts.join(" · ")+" – "+hits.length+" Treffer":"";
  window.scrollTo(0,0);
}
$("go").onclick=go;$("q").onkeydown=e=>{if(e.key==="Enter")go()};
$("chg").onclick=()=>{document.body.classList.remove("res");if(fi.some(i=>i.value.trim()))adv.classList.add("on")};
$("all").onclick=()=>{$("q").value="";fi.forEach(i=>i.value="");go()};
// Formular
const form=$("form");
COLS.forEach((c,i)=>{const d=document.createElement("div");d.className="f";d.innerHTML=`<label>${esc(c)}${i==0?" *":""}</label>`+(LONG.has(i)?`<textarea rows="${i==7?5:2}"></textarea>`:`<input type="text">`);form.appendChild(d)});
form.querySelectorAll("textarea")[2].placeholder="Link(s) zu Google-Drive-Dateien einfügen, mehrere untereinander";
const fields=()=>[...form.querySelectorAll("input,textarea")];
$("neu").onclick=()=>{editing=null;$("dtitle").textContent="Neue Methode";$("send").textContent="Abschicken";fields().forEach(f=>f.value="");$("msg").textContent="";$("dlg").showModal()};
$("x").onclick=()=>$("dlg").close();
const PWH="";let unlocked=false,editing=null,afterPw=null,added=[],ovr={};
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function askPw(cb){afterPw=cb;$("pwi").value="";$("pwm").textContent="";$("pw").showModal();$("pwi").focus()}
async function checkPw(){let ok=false;try{ok=(await sha($("pwi").value))===PWH}catch(e){}if(ok){unlocked=true;$("pw").close();afterPw&&afterPw()}else $("pwm").textContent="Falsches Passwort."}
$("pwok").onclick=checkPw;$("pwi").onkeydown=e=>{if(e.key==="Enter")checkPw()};$("pwx").onclick=()=>$("pw").close();
function startEdit(r){if(unlocked)openEdit(r);else askPw(()=>openEdit(r))}
function openEdit(r){editing=r;fields().forEach((f,i)=>f.value=r.v[i]||"");$("msg").textContent="";$("dtitle").textContent="Methode bearbeiten";$("send").textContent="Speichern";$("dlg").showModal()}
function rebuild(){const prev=shown;rows=added.concat(BASE.map((r,i)=>{const o=ovr[i],v=o?o.v:r;return{v,n:v.map(norm),neu:false,att:o?o.att:[],idx:i}}));run();while(shown<prev&&shown<hits.length)more()}
const toV=a=>COLS.map((_,i)=>String(a[i]||""));
let db=null;
async function initDb(){
  try{
    if(!window.claude||!claude.use)return;
    db=await claude.use("db");if(!db)return;
    db.collection("vorschlaege").onSnapshot(s=>{
      added=s.docs.map(d=>({id:d.id,d:d.data()})).filter(x=>x.d&&Array.isArray(x.d.v)).sort((a,b)=>(b.d.ts||0)-(a.d.ts||0))
        .map(x=>{const v=toV(x.d.v);return{v,n:v.map(norm),neu:true,att:Array.isArray(x.d.att)?x.d.att:[],id:x.id,ts:x.d.ts}});
      rebuild();
    },()=>{});
    db.collection("aenderungen").onSnapshot(s=>{
      ovr={};s.docs.forEach(d=>{const x=d.data();if(x&&Array.isArray(x.v))ovr[d.id]={v:toV(x.v),att:Array.isArray(x.att)?x.att:[]}});
      rebuild();
    },()=>{});
  }catch(e){}
}
$("send").onclick=async()=>{
  const v=fields().map(f=>f.value.trim()),m=$("msg");
  if(!v[0]){m.textContent="Bitte mindestens den Methodennamen eintragen.";return}
  try{
    if(db){const att=editing?(editing.att||[]).slice():[];
    if(editing){if(editing.neu)await db.collection("vorschlaege").doc(editing.id).set({v,att,ts:editing.ts||Date.now()});else await db.collection("aenderungen").doc(String(editing.idx)).set({v,att,ts:Date.now()});m.textContent="Gespeichert."}
    else{await db.collection("vorschlaege").add({v,att,ts:Date.now()});m.textContent="Gesendet – danke!"}setTimeout(()=>$("dlg").close(),900);return}
    if(editing){m.textContent="Speichern nicht möglich (Anmeldung mit Schreibrechten nötig).";return}
    const dl=window.claude&&claude.use?await claude.use("downloads"):null;
    if(dl){const o={};COLS.forEach((c,i)=>o[c]=v[i]);await dl.save({filename:"neue-methode.json",data:JSON.stringify(o,null,2)});m.textContent="Als Datei gespeichert – bitte weiterleiten.";return}
    m.textContent="Senden hier nicht möglich (Anmeldung nötig).";
  }catch(e){m.textContent="Senden fehlgeschlagen: "+(e&&e.message||e.code||"Fehler")}
};
run();initDb();
</script></body></html>
